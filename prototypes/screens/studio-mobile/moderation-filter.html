<!-- ====================== MODÈLE DE VUE ===================== -->

<script type="text/x-dc-fragment">
  page_moderation(c) {
    const s = this.state;
    const ctx = MOD_CTX[c.chan.name] || { show: '', viewers: 0, rate: 0, queue: [], sanctions: [] };
    const peer = (ROSTER[c.chan.name] || []).filter(m => m[3] === 'mod' && m[0] !== c.me.name)[0];
    const peerName = peer ? peer[0] : 'un confrère';
    const flood = c.P.autoMod !== false && ctx.rate > 60;
    const done = s.modDone || {};
    const taken = s.modTaken || {};
    const left = ctx.queue.filter((q, i) => !done[i] && q[4] !== 'decided').length;
    const TABS = [['live', 'TCHAT EN DIRECT'], ['queue', 'À VALIDER', String(left), left ? WARN : '#5B636B'], ['filter', 'FILTRE ET RÉGIME'], ['sanct', 'SANCTIONS']];
    const tab = TABS.some(t => t[0] === s.modTab) ? s.modTab : (flood ? 'queue' : 'live');

    const regime = s.chatMode || CHAT_FROM_PROP[c.P.chatRegime || 'emojis et phrases préparées'] || 'emoji';
    const HINTS = { free: 'tout le monde écrit, le filtre travaille seul', emoji: 'le compromis des grandes salles', read: 'le public voit sans écrire', off: 'aucun tchat, aucune file' };
    const REGIMES = CHAT_MODES.map(([k, label]) => [k, label, HINTS[k]]);
    const sev = s.modSev || 'std';
    const words = s.banWords || ['idiot', 'nul', 'arnaque', 'remboursez', 'spoiler', 'triche', 'honte', 'scandale'];
    const sanct = s.modSanct || {};
    const q = (s.modQ || '').trim().toLowerCase();

    const out = {
      pageTitle: ctx.viewers ? ctx.show + ' · ' + c.num(ctx.viewers) + ' spectateurs' : 'Aucun direct en cours',
      pageTabs: this.tabStrip(TABS, tab, 'modTab'),
      band: this.stats([
        ['DÉBIT DU TCHAT', ctx.rate ? ctx.rate + ' MSG/MIN' : '—', flood ? 'au-delà du seuil de lecture' : 'lisible message par message', flood ? WARN : OK],
        ['EN FILE', String(left), left ? 'à valider' : 'rien n’attend', left ? WARN : OK],
        ['RÉGIME', CHAT_SHORT[regime], 'modifiable en direct', INFO],
        ['SANCTIONS ACTIVES', String(ctx.sanctions.length + Object.keys(sanct).length), 'muets et bannis']
      ])
    };


    if (tab === 'filter') {
      const SEV = { soft: 'ne retient que les liens et les insultes franches', std: 'dictionnaire, majuscules, répétitions', hard: 'tout message douteux passe en file' };
      return Object.assign(out, {
        form: {
          label: 'RÉGLAGES DU TCHAT', note: 'APPLIQUÉS EN DIRECT',
          fields: [
            this.fld({ type: 'pick', label: 'RÉGIME', value: regime, options: CHAT_MODES, set: k => this.setState({ chatMode: k }),
              hint: (REGIMES.find(x => x[0] === regime) || [])[2] }),
            this.fld({ type: 'pick', label: 'SÉVÉRITÉ DU FILTRE', value: sev,
              options: [['soft', 'SOUPLE'], ['std', 'STANDARD'], ['hard', 'STRICT']],
              set: k => this.setState({ modSev: k }), hint: SEV[sev] }),
            this.fld({ type: 'toggle', label: 'MODE LENT', badge: s.slow ? 'ACTIF' : '', badgeColor: OK,
              toggleLabel: s.slow ? 'DÉSACTIVER' : 'ACTIVER', act: () => this.setState({ slow: !s.slow }),
              hint: 'Un message toutes les 20 secondes par spectateur.' }),
            this.fld({ type: 'toggle', label: 'RÉSERVÉ AUX DÉTENTEURS DE PLACE', badge: s.ticketOnly ? 'ACTIF' : '', badgeColor: OK,
              toggleLabel: s.ticketOnly ? 'DÉSACTIVER' : 'ACTIVER', act: () => this.setState({ ticketOnly: !s.ticketOnly }),
              hint: 'Les visiteurs sans place lisent sans écrire.' })
          ]
        },
        blocks: [
          this.block('DICTIONNAIRE DE MOTS BLOQUÉS', words.length + (words.length > 1 ? ' TERMES' : ' TERME'), {
            intro: 'Un terme ajouté s’applique rétroactivement : les messages déjà publiés qui le contiennent repassent en file.',
            rows: this.rows(words.map(w => ({
              label: w, hint: 'retient aussi les variantes accentuées',
              cta: 'RETIRER', act: () => this.setState({ banWords: words.filter(x => x !== w) })
            })).concat([{ label: 'Ajouter un terme', hint: 'appliqué à cette chaîne, toutes dates', cta: '+ AJOUTER UN TERME', tone: 'primary', act: () => this.openSheet('banword') }]))
          })
        ]
      });
    }

</script>
