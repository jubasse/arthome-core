    <sc-if value="{{ pgEvents }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="display: flex; align-items: center; border: 1px solid #2A2F35; background: #111316;">
          <input value="{{ evQuery }}" onChange="{{ onEvQuery }}" placeholder="Chercher un spectacle, un commentaire" style="flex: 1 1 auto; min-width: 0; min-height: 44px; box-sizing: border-box; padding: 0 11px; border: 0; background: transparent; color: #E6E9EC; font-size: 13px;" />
          <sc-if value="{{ evHasQ }}" hint-placeholder-val="{{ false }}">
            <div onClick="{{ clearEvQuery }}" style="flex: 0 0 auto; width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #7C858D;">✕</div>
          </sc-if>
        </div>
        <div style="display: flex; gap: 7px;">
          <div onClick="{{ openStates }}" style="flex: 1 1 auto; min-width: 0; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 1px solid #2A2F35; background: #111316; cursor: pointer;">
            <span style="{{ stTriggerStyle }}">{{ stTriggerLabel }}</span>
            <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #5B636B;">▾</span>
          </div>
          <div onClick="{{ openSort }}" style="flex: 0 0 auto; min-width: 116px; min-height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border: 1px solid #2A2F35; background: #111316; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: #C6CDD4;">{{ sortLabel }}</div>
        </div>
        <div style="position: relative;">
          <div data-strip="1" style="display: flex; gap: 6px; overflow-x: auto; padding: 1px 0;">
            <sc-for list="{{ evWhen }}" as="w" hint-placeholder-count="2">
              <span data-chip="1" onClick="{{ w.pick }}" style="{{ w.style }}">{{ w.label }}</span>
            </sc-for>
          </div>
        </div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; line-height: 1.6; color: #5B636B; padding: 2px 1px;">{{ evZoneNote }}</div>
        <sc-for list="{{ evRows }}" as="r" hint-placeholder-count="4">
          <div onClick="{{ r.open }}" style="border: 1px solid #23272C; background: #15171A; padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; animation: riseIn .18s ease;">
            <div style="display: flex; align-items: flex-start; gap: 9px;">
              <div style="min-width: 0; flex: 1 1 auto;">
                <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: #C6CDD4;">{{ r.when }}</div>
                <sc-if value="{{ r.local }}" hint-placeholder-val="{{ false }}">
                  <div style="padding-top: 2px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: oklch(0.72 0.11 235);">{{ r.local }}</div>
                </sc-if>
                <div style="padding-top: 5px; font-size: 14px; line-height: 1.3; color: #E6E9EC; text-wrap: pretty;">
                  <sc-for list="{{ r.tParts }}" as="p" hint-placeholder-count="1"><span style="{{ p.style }}">{{ p.t }}</span></sc-for>
                </div>
                <div style="padding-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.08em; line-height: 1.6; color: #7C858D;">
                  <sc-for list="{{ r.mParts }}" as="p" hint-placeholder-count="1"><span style="{{ p.style }}">{{ p.t }}</span></sc-for>
                </div>
              </div>
              <span style="{{ r.stateStyle }}">
                <sc-if value="{{ r.isLive }}" hint-placeholder-val="{{ false }}">
                  <span style="width: 5px; height: 5px; background: oklch(0.7 0.19 27); animation: pulseLive 1.6s infinite;"></span>
                </sc-if>
                {{ r.state }}
              </span>
            </div>
            <div style="display: flex; align-items: baseline; gap: 8px;">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #98A0A8;">{{ r.fill }}</span>
              <sc-if value="{{ r.rev }}" hint-placeholder-val="{{ false }}">
                <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #C6CDD4;">{{ r.rev }}</span>
              </sc-if>
            </div>
            <div style="height: 3px; background: #1D2126;"><div style="{{ r.barStyle }}"></div></div>
          </div>
        </sc-for>
        <sc-if value="{{ evNoMatch }}" hint-placeholder-val="{{ false }}">
          <div style="border: 1px solid #23272C; background: #15171A; padding: 13px; font-size: 12.5px; line-height: 1.55; color: #98A0A8; text-wrap: pretty;">{{ evNoMatchLabel }}</div>
        </sc-if>
      </div>
    </sc-if>

<!-- ======================== VIEW MODEL ====================== -->

<script type="text/x-dc-fragment">
  page_events(c) {
    const s = this.state;
    const q = (s.evQuery || '').trim().toLowerCase();
    const sel = s.stateSel || [];
    const past = s.evPast === true;
    const PAST = { done: 1, replay: 1 };
    const MONTH_N = { 'août': 8, 'sept.': 9, 'oct.': 10, 'nov.': 11, 'déc.': 12 };
    const dkey = r => {
      const mo = Object.keys(MONTH_N).find(m => r[0].indexOf(m) > -1);
      const d = parseInt((r[0].match(/(\d+)/) || [0, 0])[1], 10);
      return (MONTH_N[mo] || 9) * 100 + d;
    };

    let list = c.evDefs.map((r, i) => [r, i])
      .filter(([r, i]) => !(s.evGone || {})[i])
      .filter(([r, i]) => !!PAST[c.stateAt(i)] === past)
      .filter(([r, i]) => sel.length === 0 || sel.indexOf(c.stateAt(i)) > -1)
      .filter(([r]) => !q || (r[2] + ' ' + r[8]).toLowerCase().indexOf(q) > -1);

    const sortKey = s.evSort || 'date';
    const dir = s.evDir === -1 ? -1 : 1;
    const val = ([r, i]) => ({
      date: dkey(r), title: r[2].toLowerCase(), state: STATE_ORDER.indexOf(c.stateAt(i)),
      price: r[6], fill: r[5] ? r[4] / r[5] : 0, rev: r[15] || 0
    })[sortKey];
    list = list.slice().sort((a, b) => {
      const x = val(a), y = val(b);
      return (x > y ? 1 : (x < y ? -1 : 0)) * dir;
    });

    const pg = this.pager(list, 6, 'evPage');
    const SORTS = { date: 'DATE', title: 'SPECTACLE', state: 'ÉTAT', price: 'TARIF', fill: 'JAUGE', rev: 'RECETTE' };
    const stLabel = sel.length === 0 ? 'TOUS LES ÉTATS' : (sel.length === 1 ? c.T(STATES[sel[0]][0]) : sel.length + ' ÉTATS');

    return {
      pageTitle: past ? 'Ce qui a été joué' : 'Vos dates à venir',
      evQuery: s.evQuery || '', evHasQ: q.length > 0,
      onEvQuery: e => this.setState({ evQuery: e.target.value, evPage: 0 }),
      clearEvQuery: () => this.setState({ evQuery: '', evPage: 0 }),
      openStates: () => this.openSheet('states'),
      openSort: () => this.openSheet('sort'),
      stTriggerLabel: stLabel,
      stTriggerStyle: sel.length === 1 ? this.pill(STATES[sel[0]][1]) : MONO + 'font-size: 10px; letter-spacing: 0.09em; color: #C6CDD4;',
      sortLabel: SORTS[sortKey] + ' ' + (dir === 1 ? '↑' : '↓'),
      evWhen: [['soon', 'À VENIR'], ['past', 'PASSÉ']].map(([k, label]) => ({
        label, pick: () => this.setState({ evPast: k === 'past', evPage: 0 }), style: this.chip(past === (k === 'past'))
      })),
      evZoneNote: 'HEURES DE SALLE EN ' + c.zAbbr + (c.zSame ? '' : ' · VOTRE FUSEAU ' + (ZONES[c.myZone] || [])[0] + ' EN BLEU'),
      evRows: pg.items.map(([r, i]) => {
        const st = c.stateAt(i);
        const vd = c.voidAt(i);
        const sold = vd ? 0 : r[4];
        const pct = r[5] ? Math.round((sold / r[5]) * 100) : 0;
        const loc = c.localOf(r[1]);
        return {
          when: r[0].replace('.', '').toUpperCase() + ' · ' + c.withZone(r[1]),
          local: loc ? loc + ' CHEZ VOUS' : '',
          tParts: this.parts(r[2], q),
          mParts: this.parts(vd ? vd[0] + ' · ' + r[8] : r[8], q),
          state: vd ? vd[0] : c.T(STATES[st][0]),
          stateStyle: this.pill(vd ? vd[1] : STATES[st][1]),
          isLive: st === 'live' && !vd,
          fill: vd ? 'JAUGE NEUTRALISÉE' : (r[5] ? c.num(sold) + ' / ' + c.num(r[5]) + ' · ' + pct + ' %' : 'SANS BILLETTERIE'),
          rev: c.canRevenue && !vd && r[6] ? c.eur(sold * r[6]) : '',
          barStyle: 'height: 3px; width: ' + (vd ? 0 : pct) + '%; background: ' + (pct >= 90 ? WARN : (st === 'live' ? LIVE : OK)) + ';',
          open: () => this.setState({ page: c.free.indexOf('event') > -1 ? 'event' : 'events', evSel: i, evTab: null, sheet: null })
        };
      }),
      evNoMatch: pg.items.length === 0,
      evNoMatchLabel: q ? 'Aucune date ne correspond à « ' + q + ' ».' : (sel.length ? 'Aucune date dans les états retenus.' : 'Aucune date ' + (past ? 'passée' : 'à venir') + ' sur cette chaîne.'),
      more: pg.more,
      footer: c.free.indexOf('wizard') > -1 ? this.act('+ CRÉER UNE DATE', () => this.go('wizard'), 'primary') : null
    };
  }

</script>
