<script type="text/x-dc-fragment">
  page_moderation(c) {
    const s = this.state;
    const ctx = MOD_CTX[c.chan.name] || { show: '', viewers: 0, rate: 0, queue: [], sanctions: [] };
    const peer = (ROSTER[c.chan.name] || []).filter(m => m[3] === 'mod' && m[0] !== c.me.name)[0];
    const peerName = peer ? peer[0] : 'un confrère';
    const flood = c.P.autoMod !== false && ctx.rate > 60;
    const done = s.modDone || {};
    const taken = s.modTaken || {};
    const left = ctx.queue.filter((q, i) => !done[i] && q[4] !== 'decided').length;
    const TABS = [['live', 'TCHAT EN DIRECT'], ['queue', 'À VALIDER', String(left), left ? WARN : '#5B636B'], ['filter', 'FILTRE ET RÉGIME'], ['sanct', 'SANCTIONS']];
    const tab = TABS.some(t => t[0] === s.modTab) ? s.modTab : (flood ? 'queue' : 'live');

    const regime = s.chatMode || CHAT_FROM_PROP[c.P.chatRegime || 'emojis et phrases préparées'] || 'emoji';
    const HINTS = { free: 'tout le monde écrit, le filtre travaille seul', emoji: 'le compromis des grandes salles', read: 'le public voit sans écrire', off: 'aucun tchat, aucune file' };
    const REGIMES = CHAT_MODES.map(([k, label]) => [k, label, HINTS[k]]);
    const sev = s.modSev || 'std';
    const words = s.banWords || ['idiot', 'nul', 'arnaque', 'remboursez', 'spoiler', 'triche', 'honte', 'scandale'];
    const sanct = s.modSanct || {};
    const q = (s.modQ || '').trim().toLowerCase();

    const out = {
      pageTitle: ctx.viewers ? ctx.show + ' · ' + c.num(ctx.viewers) + ' spectateurs' : 'Aucun direct en cours',
      pageTabs: this.tabStrip(TABS, tab, 'modTab'),
      band: this.stats([
        ['DÉBIT DU TCHAT', ctx.rate ? ctx.rate + ' MSG/MIN' : '—', flood ? 'au-delà du seuil de lecture' : 'lisible message par message', flood ? WARN : OK],
        ['EN FILE', String(left), left ? 'à valider' : 'rien n’attend', left ? WARN : OK],
        ['RÉGIME', CHAT_SHORT[regime], 'modifiable en direct', INFO],
        ['SANCTIONS ACTIVES', String(ctx.sanctions.length + Object.keys(sanct).length), 'muets et bannis']
      ])
    };

</script>
