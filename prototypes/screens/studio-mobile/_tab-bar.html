<!--
  PART         _tab-bar — the four-tab bar, derived from the role
  SURFACE      Studio Mobile — Angular + Ionic + Capacitor, 430 px, duty tool
  PURPOSE      This surface's central mechanism: four entries at most, chosen by the role held ON THE CURRENT CHANNEL, plus a "More" entry that is always present.
  SOURCE       prototypes/Studio Mobile.dc.html
               markup      L814-826
               view model  L962-1019 (ROLES, SHORT, GRANTS, ACCESS, FREE, ORDER, PAGE_META, TAB_PREF, TAB_SHORT) · L1626-1632 (access) · L1727-1768 (tabs and back button)
  NOTE         Both renderReady() slices are ALSO in _shell.html, verbatim. The duplication is deliberate.

  VERBATIM EXTRACTION — nothing is corrected, nothing is rewritten.
  The original must never be modified.
-->

<!--
  The derivation, in exactly this order (extracted as it stands below):

    roles   = role held on the current channel  ∪  optional second role
    union   = ⋃ ACCESS[r]                         "access is the union of roles, never a rank"
    allowed = ORDER filtered by union             canonical order, not arrival order
    free    = ⋃ FREE[r]  +  inbox
    pref    = ⋃ TAB_PREF[r], deduplicated         PER-ROLE preference order
    tabs    = pref ∩ (allowed ∪ free), 4 at most  + "More"

  WARNING — TAB_PREF is not ORDER truncated. For artist, ORDER∩ACCESS gives
    dashboard · crew · events · stream, whereas TAB_PREF.artist gives
    dashboard · events · crew · tickets. Two differences out of four.
    See needs/studio-mobile.md §Confrontation C2.

  WARNING — TAB_PREF.regie contains "regie", which is NOT in ACCESS.regie: it only enters the
    bar through FREE.regie. See needs/studio-mobile.md §Confrontation C1 and
    architecture/corrections-handoff.md E6.
-->

<!-- ========================= MARKUP ========================= -->

<!-- ---- the bar, fixed at the bottom (L814-826) ---- -->
  <div style="position: fixed; bottom: 0; left: 0; right: 0; z-index: 45; display: flex; justify-content: center; pointer-events: none;">
    <div style="{{ tabBarStyle }}">
      <sc-for list="{{ tabs }}" as="t">
        <div onClick="{{ t.go }}" style="{{ t.style }}">
          <svg viewBox="0 0 24 24" style="{{ t.iconStyle }}"><path d="{{ t.iconPath }}"></path></svg>
          <span style="{{ t.labelStyle }}">{{ t.label }}</span>
          <sc-if value="{{ t.badge }}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; top: 6px; right: 12px; min-width: 13px; height: 13px; display: flex; align-items: center; justify-content: center; padding: 0 2px; background: oklch(0.78 0.13 75); color: #0E0F10; font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 500;">{{ t.badge }}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

<!-- ======================== VIEW MODEL ====================== -->
<script type="text/x-dc-fragment">
/* ---- the tables (L962-1019) ---- */
const ROLES = {
  artist: ['ARTISTE · PROPRIÉTAIRE', INK2],
  prod:   ['PRODUCTION', INFO],
  regie:  ['RÉGIE', 'oklch(0.7 0.012 240)'],
  mod:    ['MODÉRATION', MUTE],
  coord:  ['COORDINATION', WARN],
  tres:   ['TRÉSORERIE', OK]
};
const SHORT = { artist: 'Artiste', prod: 'Production', regie: 'Régie', mod: 'Modération', coord: 'Coordination', tres: 'Trésorerie' };
let GRANTS = {};
const ACCESS = {
  artist: ['dashboard', 'events', 'stream', 'crew', 'stats', 'tickets', 'store', 'replays', 'payouts', 'journal', 'settings', 'help'],
  prod:   ['dashboard', 'events', 'stream', 'crew', 'stats', 'tickets', 'store', 'replays', 'journal', 'help'],
  regie:  ['agenda', 'events', 'stream', 'replays', 'help'],
  mod:    ['agenda', 'moderation', 'help'],
  coord:  ['crew', 'journal', 'help'],
  tres:   ['dashboard', 'stats', 'tickets', 'payouts', 'journal', 'help']
};
const FREE = {
  artist: ['event', 'wizard', 'regie'],
  prod:   ['event', 'wizard', 'regie'],
  regie:  ['event', 'regie'],
  coord:  [], mod: [], tres: []
};
const ORDER = ['agenda', 'dashboard', 'moderation', 'crew', 'events', 'stream', 'stats', 'tickets', 'store', 'replays', 'payouts', 'journal', 'settings', 'help'];
const PAGE_META = {
  agenda:     ['Mes dates', '#ic-agenda'],
  dashboard:  ['Tableau de bord', '#ic-dash'],
  moderation: ['Modération', '#ic-mod'],
  crew:       ['Planning et équipe', '#ic-crew'],
  events:     ['Événements', '#ic-events'],
  stream:     ['Diffusion', '#ic-stream'],
  stats:      ['Statistiques', '#ic-stats'],
  tickets:    ['Billetterie', '#ic-tickets'],
  store:      ['Boutique', '#ic-store'],
  replays:    ['Rediffusions', '#ic-replays'],
  payouts:    ['Versements', '#ic-payouts'],
  journal:    ['Journal', '#ic-journal'],
  settings:   ['Réglages de la chaîne', '#ic-settings'],
  help:       ['Aide et guides', '#ic-help'],
  regie:      ['Régie', '#ic-regie'],
  event:      ['Fiche de la date', '#ic-event'],
  wizard:     ['Nouvelle date', '#ic-wizard'],
  inbox:      ['Boîte', '#ic-inbox']
};
const TAB_PREF = {
  artist: ['dashboard', 'events', 'crew', 'tickets'],
  prod:   ['dashboard', 'events', 'crew', 'stream'],
  regie:  ['agenda', 'stream', 'regie', 'events'],
  mod:    ['agenda', 'moderation', 'help'],
  coord:  ['crew', 'journal', 'help'],
  tres:   ['dashboard', 'payouts', 'tickets', 'stats']
};
const TAB_SHORT = {
  dashboard: 'Bord', events: 'Dates', crew: 'Équipe', agenda: 'Mes dates', stream: 'Diffusion',
  regie: 'Régie', moderation: 'Modér.', journal: 'Journal', payouts: 'Versements',
  tickets: 'Billets', stats: 'Stats', help: 'Aide', store: 'Boutique', replays: 'Rediff.'
};

/* ---- access: the union of roles (extracted from renderReady, L1626-1632) ---- */
    /* accès : union des rôles, jamais un rang */
    const union = roles.reduce((acc, r) => acc.concat(ACCESS[r] || []), []);
    const allowed = ORDER.filter(p => union.indexOf(p) > -1);
    const free = ['event', 'wizard', 'regie'].filter(p => roles.some(r => (FREE[r] || []).indexOf(p) > -1));
    free.push('inbox');
    const page = (s.page && (allowed.indexOf(s.page) > -1 || free.indexOf(s.page) > -1)) ? s.page : allowed[0];


/* ---- bottom tabs and back button (extracted from renderReady, L1727-1768) ---- */
    /* ---------- onglets bas : quatre entrées au plus, dérivées du rôle ---------- */
    const pref = roles.reduce((acc, r) => acc.concat(TAB_PREF[r] || []), []).filter((v, i, a) => a.indexOf(v) === i);
    const tabKeys = pref.filter(k => allowed.indexOf(k) > -1 || free.indexOf(k) > -1).slice(0, 4);
    const badges = {
      agenda: tonight.length ? String(tonight.length) : '',
      events: String(evDefs.length),
      moderation: (() => {
        const mq = (MOD_CTX[chan.name] || { queue: [] }).queue;
        const n = mq.filter((x, i) => !(s.modDone || {})[i] && x[4] !== 'decided').length;
        return n ? String(n) : '';
      })(),
      crew: '', dashboard: '', stream: '', regie: '', journal: '', payouts: ''
    };
    const tabs = tabKeys.map(k => {
      const on = page === k || (k === 'events' && (page === 'event' || page === 'wizard'));
      return {
        key: k, icon: PAGE_META[k][1], iconPath: iconPath(PAGE_META[k][1]), label: T(TAB_SHORT[k] || PAGE_META[k][0]), badge: badges[k] || '',
        go: () => this.go(k),
        style: 'flex: 1 1 0; min-width: 0; min-height: 56px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; border-top: 2px solid '
          + (on ? '#E6E9EC' : 'transparent') + '; background: ' + (on ? '#191C20' : 'transparent') + ';',
        iconStyle: 'width: 20px; height: 20px; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; color: ' + (on ? '#E6E9EC' : '#5B636B') + ';',
        labelStyle: MONO + 'font-size: 9px; letter-spacing: 0.09em; text-transform: uppercase; color: ' + (on ? '#E6E9EC' : '#7C858D') + ';'
      };
    }).concat([{
      key: 'more', icon: '#ic-more', iconPath: iconPath('#ic-more'), label: T('Plus'), badge: '',
      go: () => this.openSheet('more'),
      style: 'flex: 1 1 0; min-width: 0; min-height: 56px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; border-top: 2px solid '
        + (s.sheet === 'more' ? '#E6E9EC' : 'transparent') + '; background: ' + (s.sheet === 'more' ? '#191C20' : 'transparent') + ';',
      iconStyle: 'width: 20px; height: 20px; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; color: ' + (s.sheet === 'more' ? '#E6E9EC' : '#5B636B') + ';',
      labelStyle: MONO + 'font-size: 9px; letter-spacing: 0.09em; text-transform: uppercase; color: ' + (s.sheet === 'more' ? '#E6E9EC' : '#7C858D') + ';'
    }]);

    ctx.tabKeys = tabKeys;
    /* d'où l'on vient : une page hors barre d'onglets porte toujours son retour */
    if (page !== this._page) { this._back = this._page; this._page = page; }
    let backTo = null;
    if (tabKeys.indexOf(page) < 0) {
      const PARENT = { event: 'events', wizard: 'events', regie: 'agenda' };
      backTo = [this._back, PARENT[page], allowed[0]]
        .filter(x => x && x !== page && (allowed.indexOf(x) > -1 || free.indexOf(x) > -1))[0] || null;
    }

</script>
