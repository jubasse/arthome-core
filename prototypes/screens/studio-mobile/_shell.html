lt&quot;:&quot;emojis et phrases préparées&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Antenne&quot;},&quot;autoMod&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Antenne&quot;}}">

<!-- Opening of the class (L1084) -->
<script type="text/x-dc-fragment">
class Component extends DCLogic {
  cssUrl(u) { return u ? 'url("' + u + '")' : 'none'; }


  componentDidMount() {
    this.loadArthome();
    try { const L = localStorage.getItem('ath.regie.layout'); if (L) this.setState({ rgLayout: L }); } catch (e) {}
    this._t = setInterval(() => this.setState({ now: Date.now() }), 1000);
    /* une image dont la source n'est pas résolue est masquée, puis réaffichée au chargement réel */
    this._imgErr = e => { const el = e.target; if (el && el.tagName === 'IMG') el.style.visibility = 'hidden'; };
    this._imgOk = e => { const el = e.target; if (el && el.tagName === 'IMG') el.style.visibility = 'visible'; };
    document.addEventListener('error', this._imgErr, true);
    document.addEventListener('load', this._imgOk, true);
    this._esc = e => { if (e.key === 'Escape' && this.state.sheet) this.setState({ sheet: null }); };
    document.addEventListener('keydown', this._esc);
    setTimeout(() => this.bindStrips(), 60);
  }

  componentDidUpdate() {
    clearTimeout(this._st);
    this._st = setTimeout(() => this.bindStrips(), 40);
  }

  componentWillUnmount() {
    clearInterval(this._t);
    clearTimeout(this._st);
    document.removeEventListener('error', this._imgErr, true);
    document.removeEventListener('load', this._imgOk, true);
    document.removeEventListener('keydown', this._esc);
  }

  /* bandes glissables : glisser à la souris, recentrage de l'onglet cliqué, flèches du seul côté utile */

  bindStrips() {
    const strips = document.querySelectorAll('[data-strip]');
    strips.forEach(strip => {
      if (!strip._bound) {
        strip._bound = true;
        strip.style.cursor = 'grab';
        let sx = 0, sl = 0, drag = false, moved = false;
        strip.addEventListener('mousedown', e => { drag = true; moved = false; sx = e.clientX; sl = strip.scrollLeft; });
        window.addEventListener('mousemove', e => {
          if (!drag) return;
          if (Math.abs(e.clientX - sx) > 4) moved = true;
          strip.scrollLeft = sl - (e.clientX - sx);
        });
        window.addEventListener('mouseup', () => { drag = false; setTimeout(() => { moved = false; }, 60); });
        strip.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); } }, true);
        strip.addEventListener('click', e => {
          const t = e.target.closest ? e.target.closest('[data-chip]') : null;
          if (!t || moved) return;
          const r = t.getBoundingClientRect(), c = strip.getBoundingClientRect();
          strip.scrollTo({ left: strip.scrollLeft + (r.left - c.left) - (c.width - r.width) / 2, behavior: 'smooth' });
        });
        const host = strip.parentElement;
        if (host) {
          if (getComputedStyle(host).position === 'static') host.style.position = 'relative';
          const mk = side => {
            const b = document.createElement('div');
            b.textContent = side === 'l' ? '‹' : '›';
            b.style.cssText = 'position: absolute; top: 0; ' + (side === 'l' ? 'left: 0;' : 'right: 0;')
              + ' width: 30px; min-height: 44px; box-sizing: border-box; display: none; align-items: center; justify-content: center;'
              + ' background: #1A1D21; border: 1px solid #333941; color: #C6CDD4;'
              + " font-family: 'JetBrains Mono', monospace; font-size: 14px; cursor: pointer; z-index: 12;"
              + ' box-shadow: 0 0 14px 10px rgba(14,15,16,0.9);';
            b.addEventListener('click', ev => {
              ev.stopPropagation();
              strip.scrollTo({ left: strip.scrollLeft + (side === 'l' ? -1 : 1) * Math.round(strip.clientWidth * 0.7), behavior: 'smooth' });
            });
            host.appendChild(b);
            return b;
          };
          strip._edges = { l: mk('l'), r: mk('r') };
          strip.addEventListener('scroll', () => this.syncEdges(strip), { passive: true });
        }
      }
      this.syncEdges(strip);
    });
  }

  syncEdges(strip) {
    const e = strip._edges;
    if (!e) return;
    const host = strip.parentElement;
    if (!host) return;
    const max = strip.scrollWidth - strip.clientWidth;
    const top = Math.round(strip.getBoundingClientRect().top - host.getBoundingClientRect().top + strip.clientHeight / 2 - 22);
    [e.l, e.r].forEach(b => { b.style.top = Math.max(0, top) + 'px'; });
    e.l.style.display = strip.scrollLeft > 4 ? 'flex' : 'none';
    e.r.style.display = strip.scrollLeft < max - 4 ? 'flex' : 'none';
  }


  go(page) { this.setState({ page, sheet: null }); }

  openSheet(kind, extra) { this.setState(Object.assign({ sheet: kind }, extra || {})); }


  renderVals() {
    if (!this.state.dataReady) {
      const land = (this.props.orientation || 'portrait') === 'paysage';
      return { booting: true, ready: false, bootError: this.state.dataError || '',
        shellStyle: 'width: 100%; max-width: ' + (land ? '932px' : '430px')
          + '; margin: 0 auto; min-height: 100vh; position: relative; overflow-x: hidden;'
          + " background: #0E0F10; color: #E6E9EC; font-family: 'Archivo', sans-serif; font-size: 13px;" };
    }
    return Object.assign({ booting: false, ready: true, bootError: '' }, this.renderReady());
  }


  renderReady() {
    const s = this.state;
    const P = this.props;
    const en = (P.lang || 'fr') === 'en';
    const T = x => (en && EN[x]) ? EN[x] : x;

    const personaRaw = P.persona || 'artiste';
    const persona = { 'régie': 'regie', 'modération': 'moderation', 'trésorerie': 'tresorerie' }[personaRaw] || personaRaw;
    const SECOND = { aucun: null, artiste: 'artist', production: 'prod', coordination: 'coord', 'régie': 'regie', 'modération': 'mod', 'trésorerie': 'tres' };
    const second = SECOND[P.secondRole || 'aucun'] || null;

    /* chaînes acceptées depuis la boîte : elles entrent réellement au sélecteur */
    const invState = s.invState || {};
    const joined = INV_DEFS.filter(v => invState[v[0]] === 'ok');

    const baseSet = (CHAN_SETS[persona] || CHAN_SETS.artiste).slice();
    joined.forEach(v => { if (!baseSet.some(c => c[0] === v[1])) baseSet.push([v[1], v[3], false, false]); });

    const channels = baseSet.map(([name, rk, isLive, own], i) => ({
      name, roleKey: rk, own,
      isLive: isLive && P.onAir !== false,
      img: CHAN_IMG[name] || IMG.hall,
      role: T(ROLES[rk][0]),
      roleColor: ROLES[rk][1],
      idx: i
    }));
    const chan = channels[Math.min(s.chan, channels.length - 1)] || channels[0];
    const roleOf = chan.roleKey;
    const roles = [roleOf].concat(second && second !== roleOf ? [second] : []);
    const has = r => roles.indexOf(r) > -1;
    /* La personne connectée est un membre réel de la chaîne : celui qui tient le
       rôle choisi, à défaut le propriétaire. */
    const me = (() => {
      const D = this.data;
      const fallback = { name: chan.name, mail: '', initials: (chan.name || '?').slice(0, 2).toUpperCase() };
      if (!D) return fallback;
      const channel = (D.cited || D.channels).filter(x => x.name === chan.name)[0];
      if (!channel) return fallback;
      const wanted = { artist: 'artist', prod: 'production', coord: 'coordination',
        regie: 'director', mod: 'moderation', tres: 'treasury' }[roleOf];
      const mine = channel.members.filter(x => x.role === wanted)[0] || channel.members[0];
      return mine
        ? { name: mine.name, mail: mine.email || '', initials: mine.initials || mine.name.slice(0, 2).toUpperCase() }
        : fallback;
    })();

    const myZone = s.myZoneOv || P.myZone || 'Europe/Paris';
    const zoneOf = name => CHAN_ZONE[name] || 'Europe/Paris';
    const abbrOf = name => (ZONES[zoneOf(name)] || ZONES['Europe/Paris'])[0];
    const chanZone = zoneOf(chan.name);
    const zAbbr = abbrOf(chan.name);
    const zSame = chanZone === myZone;
    const withZone = (t, name) => String(t || '').replace(':', 'h') + ' ' + abbrOf(name === undefined ? chan.name : name);
    const localOf = (t, name) => {
      const alt = shiftTime(t, zoneOf(name === undefined ? chan.name : name), myZone);
      return alt ? alt.time + ' ' + alt.abbr + alt.shift : '';
    };

    /* accès : union des rôles, jamais un rang */
    const union = roles.reduce((acc, r) => acc.concat(ACCESS[r] || []), []);
    const allowed = ORDER.filter(p => union.indexOf(p) > -1);
    const free = ['event', 'wizard', 'regie'].filter(p => roles.some(r => (FREE[r] || []).indexOf(p) > -1));
    free.push('inbox');
    const page = (s.page && (allowed.indexOf(s.page) > -1 || free.indexOf(s.page) > -1)) ? s.page : allowed[0];

    const canRevenue = has('artist') || has('prod') || has('tres');
    const canDecide = has('artist') || has('prod');
    const grantable = ['artist', 'coord', 'prod', 'regie', 'mod', 'tres'].filter(k => roles.some(r => (GRANTS[r] || []).indexOf(k) > -1));

    const eur = n => Math.round(n).toLocaleString('fr-FR') + ' €';
    const num = n => Math.round(n).toLocaleString('fr-FR');

    /* ---------- catalogue des dates : douze colonnes, une seule source ---------- */
    const evRaw = this.agendaOf(chan.name);
    (s.evNew || []).forEach(n => evRaw.push(n));
    /* forme canonique : seize colonnes, pour que les colonnes dérivées tombent
       toujours au même rang, y compris sur les dates créées par l'assistant */
    evRaw.forEach(r => {
      if (r[10] === undefined) r[10] = true;
      if (r[11] === undefined) r[11] = true;
      if (r[12] === undefined) r[12] = 0;
      if (r[13] === undefined) r[13] = '';
      if (r[14] === undefined) r[14] = null;
      if (r[15] === undefined) r[15] = 0;
      r.length = 16;
    });
    /* les saisies de la fiche réécrivent la colonne concernée : une seule source pour tout l'écran */
    const EDIT_COL = { day: 0, time: 1, title: 2, cap: 5, price: 6, comment: 8, poster: 10, tests: 11 };
    const evEdits = s.evEdit || {};
    const evDefs = evRaw.map((r, i) => {
      const e = evEdits[i];
      if (!e) return r;
      const n = r.slice();
      Object.keys(EDIT_COL).forEach(k => { if (e[k] !== undefined) n[EDIT_COL[k]] = e[k]; });
      return n;
    });
    const stateAt = i => (s.evOver || {})[i] || evDefs[i][3];
    const voidAt = i => VOIDS[(s.evVoid || {})[i]] || null;

    /* ---------- boîte : invitations et alertes routées ---------- */
    const seen = s.seen || {};
    const ALERT_DEFS = [
      ['al1', 'regie', 'Débit instable sur ' + ((evDefs[0] || [])[2] || 'la date à venir'), 'passé sous 5 Mb/s pendant 40 s', 'il y a 12 min'],
      ['al2', 'coord', 'Aucun modérateur affecté au 6 sept.', 'la date est dans 1 jour', 'il y a 1 h'],
      ['al3', 'prod', ((evDefs[0] || [])[2] || 'La prochaine date') + ' à ' + (evDefs[0] && evDefs[0][5] ? Math.round((evDefs[0][4] / evDefs[0][5]) * 100) : 0) + ' % de la jauge',
        ((evDefs[0] && evDefs[0][13]) || 0) + ' personnes en liste d’attente', 'ce matin'],
      ['al4', 'tres', 'Litige bancaire sur ' + ((evDefs[1] || evDefs[0] || [])[2] || 'une date'), '35 € contestés, réponse sous 24 h', 'hier'],
      ['al5', 'mod', 'File de modération saturée', '14 messages en attente', 'il y a 20 min']
    ];
    const myAlerts = ALERT_DEFS.filter(a => roles.indexOf(a[1]) > -1).filter(a => !seen[a[0]]);
    const openInv = INV_DEFS.filter(v => !invState[v[0]]);
