<script type="text/x-dc-fragment">
  page_replays(c) {
    const R = this.replaysOf(c);
    return {
      pageTitle: 'Rediffusions en ligne',
      band: this.stats([
        ['EN LIGNE', String(R.online.length), 'catalogues actifs'],
        ['VUES', c.num(R.views), 'lectures uniques'],
        ['EXPIRE BIENTÔT', String(R.expiring.length), R.expiring.length ? R.expiring[0].title + ' · dans ' + R.expiring[0].hours + ' h' : 'aucune fenêtre proche', R.expiring.length ? WARN : OK],
        [c.canRevenue ? 'RECETTE' : 'ACCÈS VENDUS', c.canRevenue ? c.eur(R.revenue) : c.num(R.views), 'sur la période']
      ]),
      note: 'La politique d’accès se décide à la création de la date. Dès la première vente, elle ne se désactive plus : des gens ont payé pour cette rediffusion.',
      blocks: [
        this.block('CATALOGUE', 'POLITIQUE · EXPIRATION · VUES', {
          rows: this.rows(R.rows.length ? R.rows : [
            { label: 'Aucune rediffusion', hint: 'la fenêtre s’ouvre au salut, une fois la date terminée', value: '—', valueColor: '#4A535C' }
          ])
        }),
        R.chapters.length ? this.block('CHAPITRAGE', R.chapterOf.toUpperCase(), {
          intro: 'Les repères posés en régie restent attachés à la rediffusion.',
          rows: this.rows(R.chapters)
        }) : null
      ]
    };
  }

</script>
