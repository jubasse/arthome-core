const shiftTime = (hhmm, from, to) => {
  const zf = ZONES[from] || ZONES['Europe/Paris'];
  const zt = ZONES[to] || zf;
  const d = zt[1] - zf[1];
  if (!d) return null;
  const m = String(hhmm).match(/(\d{1,2})[:hH](\d{2})/);
  if (!m) return null;
  let h = (parseInt(m[1], 10) + d) % 24;
  if (h < 0) h += 24;
  const day = parseInt(m[1], 10) + d;
  return {
    time: (h < 10 ? '0' : '') + h + 'h' + m[2],
    abbr: zt[0],
    shift: day >= 24 ? ' le lendemain' : (day < 0 ? ' la veille' : '')
  };
};

/* ---- modèles de lecture par chaîne (L1092-1326) ---- */
  metricsOf(channelName) {
    const A = this.A, D = this.data;
    const empty = { sold: 0, available: 0, waitlist: 0, gross: 0, commission: 0, vat: 0, net: 0,
      paid: 0, held: 0, tiers: [], dates: [], rate: 12, merch: 0, viewers: 0 };
    if (!A || !D) return empty;
    const channel = (D.cited || D.channels).filter(c => c.name === channelName)[0];
    if (!channel) return empty;
    const dates = channel.dates.map(id => A.date(id)).filter(Boolean).sort((a, b) => a.startOffsetMin - b.startOffsetMin);
    const bal = A.balanceOf(channel) || {};
    const tiers = {};
    let sold = 0, available = 0, waitlist = 0;
    dates.forEach(d => {
      sold += d.seats.sold || 0; available += d.seats.available; waitlist += d.seats.waitlist;
      d.prices.forEach(p => {
        const key = p.tier;
        tiers[key] = tiers[key] || { tier: key, label: A.enumLabel('priceTier', key), amount: p.amount, count: 0 };
        tiers[key].count += p.sold || 0;
      });
    });
    return {
      sold, available, waitlist,
      gross: bal.gross || 0, commission: bal.commission || 0, vat: bal.vat || 0,
      net: (bal.paid || 0) + (bal.scheduled || 0), paid: bal.paid || 0,
      scheduled: bal.scheduled || 0, held: bal.held || 0,
      rate: bal.gross ? Math.round((bal.commission / bal.gross) * 100) : 12,
      merch: channel.shows.reduce((n, id) => n + A.merchOf(id).reduce((m, x) => m + x.sold * x.price, 0), 0),
      merchItems: channel.shows.reduce((acc, id) => acc.concat(A.merchOf(id)), []),
      viewers: dates.reduce((n, d) => n + Math.max(d.viewers || 0, d.seats.sold || 0) + (d.replayViews || 0), 0),
      tiers: Object.keys(tiers).map(k => tiers[k]),
      dates
    };
  }

  // Journal d'une chaîne : les actes réels, du plus récent au plus ancien.
  journalOf(c) {
    const A = this.A;
    if (!A || !c || !c.M) return [];
    const out = [];
    const when = (min) => A.dayLabel(min) + ' ' + A.clock(min);
    const owner = (ROSTER[c.chan.name] || [[]])[0][0] || c.chan.name;
    c.M.dates.forEach(d => {
      const show = A.show(d.show), pub = A.publicationOf(d), pay = A.payoutOf(d);
      if (pub) out.push(['ÉVÉNEMENT', owner, 'a publié ' + A.title(show),
        'tarif engagé à ' + A.price(d.prices[0].amount), when(pub.publishedAtOffsetMin), 'event', pub.publishedAtOffsetMin]);
      if (pay && pay.gross > 0) out.push(['ARGENT', owner, 'a demandé le versement de ' + A.title(show),
        A.price(pay.net) + ' · ' + A.payoutLabel(d), when(pay.dueOffsetMin), 'money', pay.dueOffsetMin]);
      A.moderationOf(d).slice(0, 2).forEach(m => {
        const who = m.handledBy ? (A.person(m.handledBy) || {}).name : null;
        out.push(['MODÉRATION', who || 'Filtre automatique',
          'a ' + A.enumLabel('moderationState', m.state).toLowerCase() + ' un message',
          A.enumLabel('moderationReason', m.reason), when(d.startOffsetMin + m.atMin), 'mod', d.startOffsetMin + m.atMin]);
      });
      A.crewOf(d).slice(0, 1).forEach(cr => {
        out.push(['ACCÈS', owner, 'a affecté ' + cr.name + ' à la ' + A.roleLabel(cr.role).toLowerCase(),
          A.title(show), when(d.startOffsetMin - 1440), 'access', d.startOffsetMin - 1440]);
      });
    });
    return out.sort((a, b) => b[6] - a[6]).slice(0, 12).map(r => r.slice(0, 6));
  }

  // Rediffusions d'une chaîne : en ligne, archivées, vues, recette, chapitres.
  replaysOf(c) {
    const A = this.A;
    const empty = { online: [], views: 0, revenue: 0, expiring: [], rows: [], chapters: [], chapterOf: '' };
    if (!A || !c || !c.M) return empty;
    const dates = c.M.dates;
    const online = dates.filter(d => A.stateOf(d) === 'replay');
    const past = dates.filter(d => A.stateOf(d) === 'ended');
    const POLICY = { included: ['INCLUSE', RPL], subscription: ['ABONNEMENT', INFO], unit: ['À L’UNITÉ', RPL], none: ['AUCUNE', INK3] };
    const rowOf = (d, expired) => {
      const show = A.show(d.show);
      const pol = POLICY[d.replayPolicy] || POLICY.included;
      const left = expired ? 0 : A.replayHoursLeft(d);
      const views = d.replayViews || 0;
      const unit = d.replayPolicy === 'unit' ? Math.round(d.prices[0].amount * 0.4) : 0;
      return {
        label: A.title(show) + ' · ' + A.dayLabel(d.startOffsetMin),
        hint: [A.replayLabel(d), unit ? A.price(unit) : null,
          expired ? 'fenêtre close' : (left ? 'expire dans ' + left + ' h' : 'sans expiration'),
          A.number(views) + ' vues'].filter(Boolean).join(' · '),
        pill: expired ? 'EXPIRÉE' : pol[0], pillColor: expired ? INK3 : pol[1],
        value: c.canRevenue ? A.price(unit * views) : A.number(views)
      };
    };
    const first = online[0] || past[0] || null;
    const run = first ? A.runOf(first) : null;
    return {
      online,
      views: dates.reduce((n, d) => n + (d.replayViews || 0), 0),
      revenue: online.reduce((n, d) => n + (d.replayPolicy === 'unit' ? Math.round(d.prices[0].amount * 0.4) * (d.replayViews || 0) : 0), 0),
      expiring: online.filter(d => A.replayHoursLeft(d) && A.replayHoursLeft(d) < 48)
        .map(d => ({ title: A.title(A.show(d.show)), hours: A.replayHoursLeft(d) })),
      rows: online.map(d => rowOf(d, false)).concat(past.map(d => rowOf(d, true))),
      chapters: run && run.chapters ? run.chapters.map(ch => ({ label: A.chapterLabel(ch), value: A.timecode(ch.atMin * 60) })) : [],
      chapterOf: first ? A.title(A.show(first.show)) + ' · ' + A.dayLabel(first.startOffsetMin) : ''
    };
  }

  // Identité publique d'une chaîne : adresse, discipline et ville, dérivées de
  // l'artiste et de la salle où il joue — jamais d'un nom écrit en dur.
  // Journal des accès : les affectations réellement posées sur les dates.
  accessLogOf(channelName) {
    const A = this.A, D = this.data;
    if (!A || !D) return [];
    const channel = (D.cited || D.channels).filter(c => c.name === channelName)[0];
    if (!channel) return [];
    const SHORT = { artist: 'artist', production: 'prod', coordination: 'coord',
      director: 'regie', video: 'regie', sound: 'regie', moderation: 'mod', treasury: 'tres' };
    /* Qui invite : la production ou la coordination si la chaîne en a une,
       sinon le propriétaire. Une compagnie ne s'affecte pas elle-même. */
    const inviter = channel.members.filter(m => m.role === 'production' || m.role === 'coordination')[0]
      || channel.members.filter(m => m.canInvite && m.role !== 'artist')[0]
      || channel.members.filter(m => m.role !== 'artist')[0]
      || channel.members[0] || { name: channel.name };
    /* Un journal ne consigne que le passé : l'affectation est datée du moment
       où la date a été publiée, jamais de son lever de rideau à venir. */
    const rows = [];
    channel.dates.map(id => A.date(id)).filter(Boolean).forEach(d => {
      const pub = A.publicationOf(d);
      const at = pub ? pub.publishedAtOffsetMin : d.startOffsetMin - 1440;
      if (at >= 0) return;
      const title = A.title(A.show(d.show));
      A.crewOf(d).forEach(cr => {
        const person = cr.person ? A.person(cr.person) : null;
        rows.push({
          at,
          who: inviter.name,
          what: 'a affecté ' + cr.name + ' à la ' + A.roleLabel(cr.role).toLowerCase() + ' de ' + title,
          how: person && person.freelance ? 'accès ponctuel · expire au tomber du rideau' : 'accès permanent',
          role: SHORT[cr.role] || 'regie'
        });
      });
    });
    channel.members.slice(1, 3).forEach(mb => {
      rows.push({
        at: -mb.joinedDaysAgo * 1440,
        who: inviter.name,
        what: 'a donné le rôle ' + A.roleLabel(mb.role) + ' à ' + mb.name,
        how: 'accès permanent',
        role: SHORT[mb.role] || 'coord'
      });
    });
    /* Du plus récent au plus ancien, sur l'horodatage lui-même. */
    return rows.sort((a, b) => b.at - a.at).slice(0, 6);
  }


  // Accès ponctuels : les indépendants affectés à une date de la chaîne.
  guestsOf(channelName) {
    const A = this.A, D = this.data;
    if (!A || !D) return [];
    const channel = (D.cited || D.channels).filter(c => c.name === channelName)[0];
    if (!channel) return [];
    const SHORT = { director: 'regie', video: 'regie', sound: 'regie', moderation: 'mod',
      production: 'prod', coordination: 'coord', treasury: 'tres', artist: 'artist' };
    const out = [];
    channel.dates.map(id => A.date(id)).filter(Boolean).forEach((d, di) => {
      A.crewOf(d).forEach(cr => {
        const person = cr.person ? A.person(cr.person) : null;
        if (!person || !person.freelance || out.some(g => g.name === person.name)) return;
        out.push({
          name: person.name,
          initials: person.initials || person.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase(),
          roleKey: SHORT[cr.role] || 'regie', dateIdx: di,
          mail: '@' + person.id.replace('person:', '')
        });
      });
    });
    return out;
  }

  identityOf(channelName) {
    const A = this.A, D = this.data;
    const fallback = { name: channelName, url: 'arthome.fr', discipline: '', city: '' };
    if (!A || !D) return fallback;
    const channel = (D.cited || D.channels).filter(x => x.name === channelName)[0];
    if (!channel) return fallback;
    const artist = A.artist(channel.artist);
    const date = channel.dates.map(id => A.date(id)).filter(Boolean)[0];
    const venue = date ? A.venue(date.venue) : null;
    const show = date ? A.show(date.show) : null;
    const gen = show && show.genre ? A.genre(show.category, show.genre) : null;
    return {
      name: channel.name,
      url: 'arthome.fr/' + channel.artist,
      discipline: [A.label(A.category(artist.category)), gen ? A.label(gen) : null].filter(Boolean).join(' · '),
      city: venue ? venue.city : ''
    };
  }

  agendaOf(channelName) {
    const A = this.A, D = this.data;
    if (!A || !D) return [];
    const channel = (D.cited || D.channels).filter(c => c.name === channelName)[0];
    if (!channel) return [];
    const MONTHS = ['janv.', 'févr.', 'mars', 'avril', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
    const DAYS = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
    const rows = channel.dates.map(id => A.date(id)).filter(Boolean).map(d => {
      const show = A.show(d.show), venue = A.venue(d.venue), at = A.dateAt(d.startOffsetMin);
      const st = A.stateOf(d);
      const sold = Math.max(0, venue.capacity - d.seats.available);
      return [
        DAYS[at.getDay()] + ' ' + at.getDate() + ' ' + MONTHS[at.getMonth()],
        A.clock(d.startOffsetMin).replace(' h ', ':').replace(' h', ':00'),
        A.title(show),
        d.outcome ? 'done' : st === 'live' ? 'live' : st === 'replay' ? 'replay' : st === 'ended' ? 'done' : 'sched',
        sold, venue.capacity, d.prices[0].amount,
        /* « En réserve » = retenue avant publication, pas « complet ». */
        (A.publicationOf(d) || {}).state === 'reserve',
        [A.label(A.category(show.category)), A.duration(show.runtimeMin)].join(' · ').toLocaleUpperCase('fr-FR'),
        A.duration(show.runtimeMin),
        true, true,
        Math.max(0, -d.startOffsetMin), A.showImage(show, 900), d.id,
        (A.payoutOf(d) || { gross: 0 }).gross
      ];
    });
    /* Les projets retenus avant publication rejoignent l'agenda : une date en
       réserve doit se voir là où la chaîne lit son calendrier. */
    (A.draftsOf(channel) || []).filter(x => x.state === 'reserve').forEach(x => {
      const show = A.show(x.show), venue = A.venue(x.venue);
      if (!show || !venue) return;
      const at = A.dateAt(x.intendedStartOffsetMin);
      rows.push([
        DAYS[at.getDay()] + ' ' + at.getDate() + ' ' + MONTHS[at.getMonth()],
        A.clock(x.intendedStartOffsetMin).replace(' h ', ':').replace(' h', ':00'),
        A.title(show), 'hidden', 0, venue.capacity, 0, true,
        [A.label(A.category(show.category)), A.duration(show.runtimeMin)].join(' · ').toLocaleUpperCase('fr-FR'),
        A.duration(show.runtimeMin), true, true,
        x.intendedStartOffsetMin, A.showImage(show, 900), x.id, 0
      ]);
    });
    const rank = (r) => r[3] === 'live' ? 0 : (r[12] > 0 ? 2 : 1);
    return rows.sort((a, b) => rank(a) - rank(b) || (rank(a) === 2 ? b[12] - a[12] : a[12] - b[12]));
  }


/* ---- chargement de la couche de données (L1327-1411) ---- */
  async loadArthome() {
    try {
      const at = (p) => new URL(p, document.baseURI).href;
      const [helpers, fixtures, bridge] = await Promise.all([
        import(at('helpers.js')), import(at('fixtures.js')), import(at('studio-data.js'))
      ]);
      const get = async (p) => {
        const res = await fetch(at(p));
        if (!res.ok) throw new Error(p + ' (' + res.status + ')');
        return res.json();
      };
      const [catalogue, taxonomy, index] = await Promise.all([get('catalogue.json'), get('taxonomy.json'), get('i18n/index.json')]);
      const strings = await Promise.all(index.files.map(f => get('i18n/' + f.file)));
      const fx = fixtures.buildFixtures({ catalogue, taxonomy });
      const A = helpers.createArthome({
        taxonomy, fixtures: fx, strings, locales: index.locales, i18nFormat: index,
        locale: (this.props.lang || 'fr')
      });
      const D = bridge.buildStudioData(A, fx);
      DIRECTORY = D.directory; ZONES = D.zones; GRANTS = D.grants;
      ROSTER = D.roster; AUDIENCE = D.audience;
      /* Le pont rend des messages en objets ; cette surface les lit en colonnes
         [pseudo, texte, heure, état]. Conversion unique, ici. */
      LIVE_CHAT = {};
      Object.keys(D.liveChat || {}).forEach(name => {
        LIVE_CHAT[name] = (D.liveChat[name] || []).map(m =>
          Array.isArray(m) ? m : [m.user, m.text, m.time, m.state]);
      });
      // Le mobile nomme ses colonnes autrement : [nom, rôle, antenne, propriétaire].
      CHAN_SETS = {};
      Object.keys(D.chanSets).forEach(k => {
        CHAN_SETS[k] = D.chanSets[k].map(([name, img, roleKey, isLive, own]) => [name, roleKey, isLive, own]);
      });
      CHAN_ZONE = D.channelZone;
      CHAN_IMG = {}; CHAN_DATES = {}; MOD_CTX = {};
      (D.cited || D.channels).forEach(c => {
        const dates = c.dates.map(id => A.date(id)).filter(Boolean).sort((a, b) => a.startOffsetMin - b.startOffsetMin);
        const first = dates.map(d => A.show(d.show)).filter(Boolean)[0];
        CHAN_IMG[c.name] = first ? A.showImage(first, 900) : '';
        CHAN_DATES[c.name] = dates.slice(0, 3).map(d => {
          const show = A.show(d.show);
          const st = A.stateOf(d);
          return [A.title(show), A.dayLabel(d.startOffsetMin),
            A.clock(d.startOffsetMin).replace(' h ', ':').replace(' h', ':00'),
            st === 'live' ? 'live' : st === 'replay' ? 'replay' : st === 'ended' ? 'done' : 'sched',
            A.duration(show.runtimeMin)];
        });
        const live = dates.filter(d => A.isOnAir(d))[0];
        MOD_CTX[c.name] = live ? {
          show: A.title(A.show(live.show)), viewers: live.viewers,
          rate: Math.max(1, Math.round(A.chatOf(live).length / Math.max(1, -live.startOffsetMin / 60))),
          queue: A.moderationOf(live).filter(m => m.state === 'reported').slice(0, 5).map(m => {
            const msg = A.messageById(m.message);
            return [(msg && (A.viewerOf(msg) || {}).handle) || (msg || {}).author || '',
              msg ? A.chatText(msg) : '',
              A.enumLabel('moderationReason', m.reason).toLocaleUpperCase('fr-FR'),
              A.clock(live.startOffsetMin + m.atMin), null];
          }),
          sanctions: A.moderationOf(live).filter(m => m.state === 'muted' || m.state === 'banned').slice(0, 4).map(m => {
            const msg = A.messageById(m.message);
            return [(msg && (A.viewerOf(msg) || {}).handle) || '',
              A.enumLabel('moderationState', m.state).toLocaleUpperCase('fr-FR'),
              A.enumLabel('moderationReason', m.reason),
              A.clock(live.startOffsetMin + m.atMin)];
          })
        } : { show: dates[0] ? A.title(A.show(dates[0].show)) : '', viewers: 0, rate: 0, queue: [], sanctions: [] };
      });
      this.A = A; this.fx = fx; this.data = D;
      /* Invitations en attente : des indépendants de l'annuaire, proposés par
         d'autres chaînes que celle qu'on regarde. */
      const others = D.cited || D.channels;
      INV_DEFS = (D.directory || []).slice(0, 3).map((row, i) => {
        const other = others[(i + 1) % others.length];
        const date = other ? A.date(other.dates[0]) : null;
        return ['iv' + (i + 1), other ? other.name : '', row[0], row[4] === 'mod' ? 'mod' : 'regie',
          date ? 'date' : 'perm',
          date ? A.title(A.show(date.show)) + ' — ' + A.dayLabel(date.startOffsetMin) + ' ' + A.clock(date.startOffsetMin) : '',
          'il y a ' + (i + 1) + ' jours', date ? 'expire à la date' : 'expire dans 6 jours'];
      });
      this.setState({ dataReady: true, dataError: null });
    } catch (e) {
      this.setState({ dataReady: false, dataError: String(e && e.message || e) });
    }
  }


/* ---- équipe, dates et créneaux (L2254-2292) ---- */
  crewRoster(c) {
    const s = this.state;
    const gone = s.crewGone || {};
    const set = s.roleSet || {};
    return (ROSTER[c.chan.name] || [])
      .map(([name, initials, mail, rk, note, online]) => {
        const base = set[name] ? set[name].slice() : (rk ? [rk] : []);
        return {
          name, initials, mail, note, online, pending: false,
          roleKeys: base.concat(name === c.me.name ? c.roles : []).filter((v, i, a) => a.indexOf(v) === i)
        };
      })
      .concat((s.crewInvites || []).filter(i => i.chan === c.chan.name).map(i => ({
        name: i.name, initials: i.initials, mail: i.mail, note: 'Invitation envoyée · en attente', online: false, pending: true, roleKeys: [i.roleKey]
      })))
      .filter(m => !gone[m.name]);
  }

  crewDates(c) {
    return c.evDefs.map((r, i) => [r, i]).filter(([r, i]) => ['done', 'replay', 'draft'].indexOf(c.stateAt(i)) < 0).slice(0, 6);
  }

  /* un poste peut être tenu à plusieurs : deux régisseurs, deux modérateurs */
  holdersOf(c, di, rk) {
    const a = this.state.assign || {};
    const key = di + '|' + rk;
    if (a[key] !== undefined) return a[key] || [];
    const able = this.crewRoster(c).filter(m => m.roleKeys.indexOf(rk) > -1 && !m.pending);
    /* de quoi éprouver le cumul : la première date à trois, la troisième à deux, une sur deux vacante */
    const n = [3, 0, 2, 0, 1, 2][di % 6];
    return able.slice(0, n).map(m => m.name);
  }

  toggleSlot(c, di, rk, name) {
    const cur = this.holdersOf(c, di, rk);
    const next = cur.indexOf(name) > -1 ? cur.filter(x => x !== name) : cur.concat([name]);
    this.setState(st => ({ assign: Object.assign({}, st.assign, { [di + '|' + rk]: next }) }));
  }

</script>
