let ZONES = {};
/* une heure de salle, rendue dans le fuseau de qui la lit */
const shiftTime = (hhmm, from, to) => {
  const zf = ZONES[from] || ZONES['Europe/Paris'];
  const zt = ZONES[to] || zf;
  const d = zt[1] - zf[1];
  if (!d) return null;
  const m = String(hhmm).match(/(\d{1,2})[:hH](\d{2})/);
  if (!m) return null;
  let h = (parseInt(m[1], 10) + d) % 24;
  if (h < 0) h += 24;
  const day = parseInt(m[1], 10) + d;
  return {
    time: (h < 10 ? '0' : '') + h + 'h' + m[2],
    abbr: zt[0],
    shift: day >= 24 ? ' le lendemain' : (day < 0 ? ' la veille' : '')
  };
};

class Component extends DCLogic {
  mainRef = React.createRef();

  // Les données viennent de fixtures.js par studio-data.js : une seule source
  // pour les cinq surfaces. Tant qu'elles arrivent, la régie affiche son écran
  // d'attente plutôt que des tables figées.
  async loadArthome() {
    try {
      const at = (p) => new URL(p, document.baseURI).href;
      const [helpers, fixtures, bridge] = await Promise.all([
        import(at('helpers.js')), import(at('fixtures.js')), import(at('studio-data.js'))
      ]);
      const get = async (p) => {
        const res = await fetch(at(p));
        if (!res.ok) throw new Error(p + ' (' + res.status + ')');
        return res.json();
      };
      const [catalogue, taxonomy, index] = await Promise.all([get('catalogue.json'), get('taxonomy.json'), get('i18n/index.json')]);
      const strings = await Promise.all(index.files.map(f => get('i18n/' + f.file)));
      const fx = fixtures.buildFixtures({ catalogue, taxonomy });
      const A = helpers.createArthome({
        taxonomy, fixtures: fx, strings, locales: index.locales, i18nFormat: index,
        locale: (this.props.lang || 'fr')
      });
      const D = bridge.buildStudioData(A, fx);
      DIRECTORY = D.directory; DATE_LABELS = D.dateLabels; ZONES = D.zones; GRANTS = D.grants;
      ROSTER = D.roster; AUDIENCE = D.audience; LIVE_CHAT = D.liveChat;
      CHAN_SETS = D.chanSets; CHAN_ZONE = D.channelZone;
      this.A = A; this.fx = fx; this.data = D;
      this.setState({ dataReady: true, dataError: null }, () => {
        if (!this._measure) return;
        this._measure();
        requestAnimationFrame(() => this._measure());
        let tries = 0;
        clearInterval(this._mt);
        this._mt = setInterval(() => { this._measure(); if (++tries > 10) clearInterval(this._mt); }, 100);
      });
    } catch (e) {
      this.setState({ dataReady: false, dataError: String(e && e.message || e) });
    }
  }

  // Barres tirées d'une série de valeurs réelles. Série vide ou toute nulle :
  // aucune barre, plutôt qu'un historique décoratif à côté d'un zéro.
  barsFrom(values, tint) {
    const list = (values || []).filter(v => typeof v === 'number' && isFinite(v));
    const max = Math.max.apply(null, list.concat([0]));
    if (!list.length || max <= 0) return [];
    return list.slice(-14).map((v, i, arr) => ({
      style: 'flex: 1 1 auto; min-width: 2px; height: ' + Math.max(6, Math.round((v / max) * 100)) + '%; background: '
        + (i === arr.length - 1 ? tint : '#2A3037') + ';'
    }));
  }

  bars(seed, n, tint) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const h = 18 + ((seed * (i + 3) * 17) % 82);
      out.push({ style: 'flex: 1 1 auto; min-width: 2px; height: ' + h + '%; background: ' + (i === n - 1 ? tint : '#2A3037') + ';' });
    }
    return out;
  }

  hms(n) {
    /* Un chapitre posé avant le lever de rideau a un horodatage négatif :
       le signe se sort du calcul, sinon chaque part le porte. */
    const sign = n < 0 ? '−' : '';
    const v = Math.abs(Math.round(n));
    return sign + [Math.floor(v / 3600), Math.floor((v % 3600) / 60), v % 60]
      .map(x => (x < 10 ? '0' : '') + x).join(':');
  }
