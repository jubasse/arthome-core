<sc-if value="{{ isHelp }}" hint-placeholder-val="{{ false }}">
<div style="animation: fadeIn .3s ease both; padding: 18px 16px 0;">
  <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: #857E73;">{{ t.helpSub }}</div>
  <h1 style="margin: 11px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 32px; line-height: 1.03;">{{ t.helpTitle }}</h1>
  <p style="margin: 12px 0 0; font-size: 14px; line-height: 1.6; color: #B0A899; text-wrap: pretty;">{{ t.helpIntro }}</p>
  <div style="margin-top: 20px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #857E73; padding-bottom: 10px;">{{ t.helpTopics }}</div>
  <div style="display: flex; flex-direction: column; gap: 1px; background: #1F1C19; border: 1px solid #1F1C19;">
    <sc-for list="{{ helpTopics }}" as="hp" hint-placeholder-count="6">
      <div onClick="{{ hp.go }}" style="cursor: pointer; background: #100F0D; padding: 13px; min-height: 44px; box-sizing: border-box;  display: flex; align-items: center; gap: 12px;">
        <div style="min-width: 0;">
          <div style="font-size: 14px;">{{ hp.label }}</div>
          <div style="padding-top: 5px; font-size: 12.5px; line-height: 1.5; color: #8B857C; text-wrap: pretty;">{{ hp.hint }}</div>
        </div>
        <span style="margin-left: auto; flex: 0 0 auto; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #6B6459;">→</span>
      </div>
    </sc-for>
  </div>
  <div style="margin-top: 16px; border: 1px solid #1F1C19; background: #0C0B0A; padding: 16px;">
    <div style="font-family: 'Instrument Serif', serif; font-size: 22px; line-height: 1.1;">{{ t.helpContactTitle }}</div>
    <div style="padding-top: 11px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #EDE7DC;">{{ t.helpMail }}</div>
    <div style="padding-top: 9px; font-size: 12.5px; line-height: 1.6; color: #857E73; text-wrap: pretty;">{{ t.helpHours }}</div>
  </div>
  <div style="margin-top: 12px; border: 1px solid rgba(214,178,102,0.28); background: rgba(214,178,102,0.04); padding: 16px;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: oklch(0.83 0.1 84);">{{ t.helpDpoLabel }}</div>
    <div style="padding-top: 9px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #EDE7DC;">{{ t.helpMailDpo }}</div>
    <div style="padding-top: 9px; font-size: 12.5px; line-height: 1.6; color: #9B948A; text-wrap: pretty;">{{ t.privDpoHint }}</div>
    <span onClick="{{ goPrivacy }}" style="display: block; margin-top: 13px; cursor: pointer; padding: 13px; min-height: 44px; box-sizing: border-box;  text-align: center; border: 1px solid #332E28; font-size: 12.5px; color: #C9C0B2;">{{ t.accPrivacy }} →</span>
  </div>
</div>
</sc-if>
