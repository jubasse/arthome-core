  splitHit(text, q) {
    const s = String(text || '');
    if (!q) return { pre: s, hit: '', post: '' };
    const i = s.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return { pre: s, hit: '', post: '' };
    return { pre: s.slice(0, i), hit: s.slice(i, i + q.length), post: s.slice(i + q.length) };
  }

  setState(patch, cb) {
    const next = typeof patch === 'function' ? null : patch;
    if (next && next.page !== undefined && next.page !== this.state.page) {
      const win = (typeof window !== 'undefined') ? window : null;
      if (win) {
        setTimeout(() => {
          win.scrollTo(0, 0);

        }, 0);
      }
      if (this.state.stuck) next.stuck = false;
    }
    return super.setState(patch, cb);
  }
