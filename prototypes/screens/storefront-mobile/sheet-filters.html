    <sc-for list="{{ filterGroups }}" as="fg" hint-placeholder-count="4">

    <span onClick="{{ closeFiltersSheet }}" style="cursor: pointer; padding: 14px; min-height: 44px; box-sizing: border-box;  text-align: center; background: #EDE7DC; color: #0B0A09; font-size: 13.5px; font-weight: 600;">{{ applyFiltersLabel }}</span>

</div>
