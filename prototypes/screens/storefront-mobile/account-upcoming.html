      <sc-if value="{{ accUpcoming }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{ tickets }}" as="tk" hint-placeholder-count="3">
            <div style="border: 1px solid #1F1C19; background: #100F0D;">
              <div style="position: relative; aspect-ratio: 16/9; overflow: hidden; background: #17140F;">
                <sc-if value="{{ tk.img }}" hint-placeholder-val="{{ false }}">
                  <div style="position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(0.72) brightness(0.7); background-color: #17140F; background-image: {{ tk.imgCss }}; background-size: cover; background-position: center;"></div>
                </sc-if>
                <div style="position: absolute; left: 10px; top: 10px; display: flex; align-items: center; gap: 6px; background: rgba(11,10,9,0.8); padding: 4px 8px;">
                  <sc-if value="{{ tk.isNow }}" hint-placeholder-val="{{ false }}">
                    <span style="width: 5px; height: 5px; border-radius: 50%; background: oklch(0.74 0.15 42); animation: pulseLive 1.6s infinite;"></span>
                  </sc-if>
                  <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: {{ tk.statusColor }};">{{ tk.statusText }}</span>
                </div>
              </div>
              <div style="padding: 13px;">
                <div style="font-size: 15px; font-weight: 500;">{{ tk.title }}</div>
                <div style="padding-top: 5px; font-size: 12.5px; color: #9B948A;">{{ tk.artist }}</div>
                <div style="padding-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: #857E73;">{{ tk.when }}</div>
                <div style="padding-top: 8px; font-size: 12.5px; line-height: 1.5; color: #8B857C; text-wrap: pretty;">{{ tk.desc }}</div>
                <div style="padding-top: 11px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                  <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.06em; color: #6B6459;">{{ tk.code }}</span>
                  <span onClick="{{ tk.action }}" style="margin-left: auto; cursor: pointer; padding: 10px 15px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;  border: 1px solid #332E28; font-size: 12.5px; color: #EDE7DC;">{{ tk.cta }}</span>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>
