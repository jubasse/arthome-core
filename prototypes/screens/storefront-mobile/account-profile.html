        <div>
          <div style="display: flex; flex-direction: column; gap: 1px; background: #1F1C19; border: 1px solid #1F1C19;">

            </sc-for>
          </div>
          <span onClick="{{ saveProfile }}" style="display: block; margin-top: 12px; cursor: pointer; padding: 13px; min-height: 44px; box-sizing: border-box;  text-align: center; background: #EDE7DC; color: #0B0A09; font-size: 13px; font-weight: 600;">{{ saveLabel }}</span>

          <div style="margin-top: 16px; border: 1px solid rgba(214,178,102,0.28); background: rgba(214,178,102,0.04); padding: 16px;">

            <div style="padding-top: 6px; font-size: 12.5px; line-height: 1.5; color: #857E73; text-wrap: pretty;">{{ t.helpBlurb }}</div>
            <span onClick="{{ helpFromMenu }}" style="display: block; margin-top: 12px; cursor: pointer; padding: 13px; min-height: 44px; box-sizing: border-box;  text-align: center; border: 1px solid #332E28; font-size: 12.5px; color: #C9C0B2;">{{ t.helpCta }}</span>

            <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">

      ['city', 'CITY', 'USED FOR RECOMMENDATIONS']
    ];

/* ── profileFields  —  calcul dans renderReady()  —  L5239–5247 ── */
    const profileFields = profileDefs.map(([key, label, hint]) => ({
      label, hint,
      value: s.profile[key],
      hintColor: hint.indexOf('✓') > -1 ? 'oklch(0.7 0.13 150)' : '#6B6459',
      onChange: e => {
        const v = e.target.value;
        this.setState(st => ({ profile: Object.assign({}, st.profile, { [key]: v }) }));
      }
    }));

/* ── goStudio  —  clé du modèle rendu  —  L5832–5832 ── */
      goStudio: () => this.setState({ studioOpen: true }),

</script>
