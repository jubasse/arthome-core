<sc-if value="{{ isFollowing }}" hint-placeholder-val="{{ false }}">
<div style="animation: fadeIn .3s ease both; padding: 18px 16px 0;">
  <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 32px; line-height: 1.05;">{{ t.navFollowing }}</h1>
  <div style="padding-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #857E73;">{{ followingCountLabel }}</div>

  <div style="margin-top: 20px; display: flex; align-items: center; gap: 9px;">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: oklch(0.62 0.21 27); animation: pulseLive 1.6s infinite;"></span>
    <h2 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 22px;">{{ t.liveSection }}</h2>
    <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: #857E73;">{{ followLiveCount }}</span>
  </div>
  <sc-if value="{{ noFollowLive }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top: 12px; border: 1px solid #1F1C19; background: #0D0C0A; padding: 24px 18px; text-align: center;">
      <div style="font-family: 'Instrument Serif', serif; font-size: 20px;">{{ t.emptyFollowLive }}</div>
    </div>
  </sc-if>
  <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{ followLive }}" as="a" hint-placeholder-count="2">
      <div style="border: 1px solid #1F1C19; background: #100F0D; padding: 12px; display: flex; gap: 12px;">
        <div onClick="{{ a.liveRowOpen }}" style="cursor: pointer; flex: 0 0 96px; position: relative; aspect-ratio: 16/11; overflow: hidden; background: #17140F;">
          <sc-if value="{{ a.img }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(0.72) brightness(0.72); background-color: #17140F; background-image: {{ a.imgCss }}; background-size: cover; background-position: center;"></div>
          </sc-if>
        </div>
        <div style="min-width: 0; flex: 1 1 auto;">
          <div onClick="{{ a.open }}" style="cursor: pointer; font-size: 14px;">{{ a.name }}</div>
          <div style="padding-top: 4px; font-size: 12.5px; color: #9B948A; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ a.title }}</div>
          <div style="padding-top: 7px; display: flex; align-items: center; gap: 7px;">
            <span style="width: 5px; height: 5px; border-radius: 50%; background: oklch(0.62 0.21 27); animation: pulseLive 1.6s infinite;"></span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: {{ a.liveColor }};">{{ a.liveLabel }}</span>
          </div>
          <span onClick="{{ a.liveRowOpen }}" style="display: inline-block; margin-top: 9px; cursor: pointer; padding: 10px 14px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;  background: #EDE7DC; color: #0B0A09; font-size: 12.5px; font-weight: 600;">{{ t.joinLive }}</span>
        </div>
      </div>
    </sc-for>
  </div>

  <h2 style="margin: 26px 0 12px; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 22px;">{{ t.offlineSection }}</h2>
  <div style="display: flex; flex-direction: column; gap: 1px; background: #1F1C19; border: 1px solid #1F1C19;">
    <sc-for list="{{ followOffline }}" as="a" hint-placeholder-count="5">
      <div style="background: #0F0E0C; padding: 12px 13px; display: flex; align-items: center; gap: 11px;">
        <div onClick="{{ a.open }}" style="cursor: pointer; flex: 0 0 40px; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; position: relative; background: #1A1815;">
          <sc-if value="{{ a.portrait }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(0.7) brightness(0.8); background-color: #17140F; background-image: {{ a.portraitCss }}; background-size: cover; background-position: center;"></div>
          </sc-if>
        </div>
        <div onClick="{{ a.open }}" style="cursor: pointer; min-width: 0;">
          <div style="font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ a.name }}</div>
          <div style="padding-top: 3px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #857E73;">{{ t.lastLive }} {{ a.lastLive }}</div>
        </div>
        <span onClick="{{ a.toggleNotify }}" style="{{ a.notifyStyle }}">{{ a.notifyLabel }}</span>
      </div>
    </sc-for>
  </div>
</div>
</sc-if>

<script type="text/x-arthome-extract" data-part="viewmodel">
/* ── followRow  —  calcul dans renderReady()  —  L5121–5130 ── */
    const followRow = (a, i) => ({
      liveLabel: a.isLive ? t.onNow : '',
      liveColor: 'oklch(0.72 0.16 27)',
      notifyLabel: (s.notifyArtists[i] ? '🔔 ' : '🔕 ') + (fr ? 'ALERTES' : 'ALERTS'),
      notifyStyle: 'cursor: pointer; padding: 10px 12px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-family: \'JetBrains Mono\', monospace; font-size: 9px; letter-spacing: 0.08em; '
        + (s.notifyArtists[i] ? 'background: #221F1B; color: #EDE7DC;' : 'border: 1px solid #1F1C19; color: #857E73;'),
      toggleNotify: () => this.setState(st => {
        const n = st.notifyArtists.slice(); n[i] = !n[i]; return { notifyArtists: n };
      })
    });

/* ── followLive  —  calcul dans renderReady()  —  L5131–5131 ── */
    const followLive = followed.filter(a => a.isLive).map((a, i) => Object.assign({}, a, followRow(a, i)));

/* ── followOffline  —  calcul dans renderReady()  —  L5132–5141 ── */
    const followOffline = followed.filter(a => !a.isLive).map((a, i) => {
      const hasReplay = a.replay !== 'off';
      return Object.assign({}, a, followRow(a, i), {
        nextColor: 'oklch(0.78 0.13 42)',
        cta: hasReplay ? t.watchReplay : t.viewProfile,
        action: hasReplay
          ? (() => this.setState({ page: 'replay', artistId: a.i, replayTitle: a.showTitle, replayImg: a.showImg, replayDuration: '1 h 42', pos: 0, watching: a.i, watchKind: 'replay', pipClosed: false }))
          : (() => this.setState({ page: 'artist', artistId: a.i }))
      });
    });

/* ── noFollowLive  —  clé du modèle rendu  —  L6082–6082 ── */
      noFollowLive: followLive.length === 0,

/* ── followingCountLabel  —  clé du modèle rendu  —  L6434–6434 ── */
      followingCountLabel: followed.length + (fr ? ' ARTISTES SUIVIS' : ' ARTISTS FOLLOWED'),

/* ── followLiveCount  —  clé du modèle rendu  —  L6435–6435 ── */
      followLiveCount: followLive.length + (fr ? ' EN DIRECT' : ' LIVE'),

</script>
