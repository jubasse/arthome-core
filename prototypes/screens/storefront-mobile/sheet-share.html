<sc-if value="{{ shareOpen }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeShare }}" style="position: fixed; inset: 0; z-index: 8850; background: rgba(6,5,5,0.8); backdrop-filter: blur(5px); animation: fadeIn .2s ease both;"></div>
<div style="{{ sheetBase }} background: #0B0A09; border-top: 1px solid #332E28; box-shadow: 0 -24px 60px rgba(0,0,0,0.6); animation: slideUp .26s cubic-bezier(.2,.7,.2,1) both;">
  <div style="padding: 12px 0 6px; display: flex; justify-content: center;"><span style="width: 38px; height: 3px; background: #332E28;"></span></div>
  <div style="padding: 6px 16px 22px;">
    <div style="font-family: 'Instrument Serif', serif; font-size: 24px;">{{ t.shareTitle }}</div>
    <div style="padding-top: 8px; font-size: 12.5px; line-height: 1.5; color: #857E73; text-wrap: pretty;">{{ t.shareBlurb }}</div>
    <div style="margin-top: 15px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px;">
      <sc-for list="{{ shareTargets }}" as="s" hint-placeholder-count="4">
        <span onClick="{{ s.act }}" style="cursor: pointer; padding: 13px; min-height: 44px; box-sizing: border-box;  text-align: center; border: 1px solid #262320; font-size: 12.5px; color: #C9C0B2;">{{ s.label }}</span>
      </sc-for>
    </div>
    <div style="margin-top: 14px; border: 1px solid #1F1C19; background: #0F0E0C; padding: 12px; display: flex; align-items: center; gap: 10px;">
      <span style="min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #857E73; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ shareUrl }}</span>
      <span style="margin-left: auto; flex: 0 0 auto; cursor: pointer; padding: 10px 13px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;  background: #221F1B; font-size: 12px; color: #EDE7DC;">{{ t.copy }}</span>
    </div>
  </div>
</div>
</sc-if>
