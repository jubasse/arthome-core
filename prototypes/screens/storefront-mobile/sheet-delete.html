<script type="text/x-arthome-extract" data-part="viewmodel">
/* ── alertTokens  —  class method  —  L4211–4232 ── */
  alertTokens(al, cats, T) {
    const st = al.st || {};
    const out = [];
    (st.fCats || []).forEach(i => { if (cats[i]) out.push(cats[i].name); });
    if ((st.fCats || []).length === 1) {
      (st.fSubs || []).forEach(i => {
        const nm = (SUBS_ALL[this.props.lang === 'en' ? 'en' : 'fr'][st.fCats[0]] || [])[i];
        if (nm) out.push(nm);
      });
    }
    const P = { free: T.pFree, u10: T.pU10, '1020': T.p1020, '2035': T.p2035, o35: T.p35 };
    (st.fPrices || []).forEach(k => { if (P[k]) out.push(P[k]); });
    const D = { tonight: T.dTonight, weekend: T.dWeekend, d7: T.d7, d30: T.d30, range: T.dRange };
    if (st.fDate && st.fDate !== 'all' && D[st.fDate]) out.push(D[st.fDate]);
    const S = { live: T.stLive, soon: T.stSoon, replay: T.stReplay };
    if (st.fStatus && st.fStatus !== 'all' && S[st.fStatus]) out.push(S[st.fStatus]);
    if (st.fAlmost) out.push(T.almostFull);
    if (st.fHasDates) out.push(T.hasDates);
    if (st.fExpiring) out.push(T.expSoon);
    if (st.fPromo) out.push(T.promoFilter);
    return out;
  }

/* ── alertName  —  class method  —  L4234–4239 ── */
  alertName(al, cats, T) {
    if (al.name) return al.name;
    if (al.query) return al.query;
    const tk = this.alertTokens(al, cats, T);
    return tk.length ? tk.join(' · ') : T.alertAll;
  }

/* ── deleteOpen  —  key of the rendered model  —  L5730–5730 ── */

      })(),

/* ── deleteKind  —  key of the rendered model  —  L5739–5742 ── */
      deleteKind: (() => {
        const al = s.alerts.find(x => x.id === s.deleteId);
        return al && al.scope === 'category' ? t.scopeCategory : t.savedHere;
      })(),

/* ── cancelDelete  —  key of the rendered model  —  L5743–5743 ── */
      cancelDelete: () => this.setState({ deleteId: null }),

/* ── confirmDelete  —  key of the rendered model  —  L5744–5747 ── */
      confirmDelete: () => this.setState(st => ({
        alerts: st.alerts.filter(x => x.id !== st.deleteId),
        deleteId: null, renameId: null, renameDraft: '', alertCreated: false
      })),

</script>
