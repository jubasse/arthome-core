      <sc-if value="{{ accPast }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 1px; background: #1F1C19; border: 1px solid #1F1C19;">
          <sc-for list="{{ pastEvents }}" as="p" hint-placeholder-count="4">
            <div style="background: #0F0E0C; padding: 12px; display: flex; gap: 12px; align-items: center;">
              <div style="flex: 0 0 76px; position: relative; aspect-ratio: 16/11; overflow: hidden; background: #17140F;">
                <sc-if value="{{ p.img }}" hint-placeholder-val="{{ false }}">
                  <div style="position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(0.6) brightness(0.62); background-color: #17140F; background-image: {{ p.imgCss }}; background-size: cover; background-position: center;"></div>
                </sc-if>
              </div>
              <div style="min-width: 0; flex: 1 1 auto;">
                <div style="font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ p.title }}</div>
                <div style="padding-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #857E73;">{{ p.date }}</div>
                <div style="padding-top: 8px; display: flex; align-items: center; gap: 9px;">
                  <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: {{ p.replayColor }};">{{ p.replay }}</span>
                  <span onClick="{{ p.action }}" style="margin-left: auto; cursor: pointer; padding: 10px 12px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;  border: 1px solid #2A2621; font-size: 12px; color: #C9C0B2;">{{ p.cta }}</span>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>
