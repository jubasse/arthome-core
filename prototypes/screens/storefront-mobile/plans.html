<sc-if value="{{ isPlans }}" hint-placeholder-val="{{ false }}">
<div style="animation: fadeIn .3s ease both; padding: 18px 16px 0;">
  <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: #857E73;">{{ t.plansSub }}</div>
  <h1 style="margin: 11px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 32px; line-height: 1.03;">{{ t.plansTitle }}</h1>
  <p style="margin: 12px 0 0; font-size: 14px; line-height: 1.6; color: #B0A899; text-wrap: pretty;">{{ t.plansIntro }}</p>
  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{ plans }}" as="pl" hint-placeholder-count="3">
      <div style="{{ pl.cardStyle }}">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: {{ pl.tagColor }};">{{ pl.tag }}</div>
        <div style="padding-top: 11px; font-family: 'Instrument Serif', serif; font-size: 27px; line-height: 1;">{{ pl.name }}</div>
        <div style="padding-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #EDE7DC;">{{ pl.price }}</div>
        <div style="margin-top: 15px; border-top: 1px solid #1F1C19; padding-top: 14px; display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{ pl.features }}" as="ft" hint-placeholder-count="4">
            <div style="display: flex; align-items: baseline; gap: 9px;">
              <span style="flex: 0 0 auto; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: {{ ft.mark }};">{{ ft.glyph }}</span>
              <span style="min-width: 0; font-size: 13px; line-height: 1.5; color: {{ ft.color }}; text-wrap: pretty;">{{ ft.label }}</span>
            </div>
          </sc-for>
        </div>
        <span onClick="{{ pl.action }}" style="{{ pl.ctaStyle }}">{{ pl.cta }}</span>
      </div>
    </sc-for>
  </div>
  <p style="margin: 20px 0 0; font-size: 12.5px; line-height: 1.6; color: #857E73; text-wrap: pretty;">{{ t.plansFootnote }}</p>
</div>
</sc-if>
