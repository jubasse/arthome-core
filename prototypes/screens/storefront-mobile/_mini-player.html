<sc-if value="{{ pipVisible }}" hint-placeholder-val="{{ false }}">
<div style="{{ pipStyle }}box-shadow: 0 18px 44px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 11px; padding: 9px;">
  <div onClick="{{ pipReturn }}" style="cursor: pointer; flex: 0 0 84px; position: relative; aspect-ratio: 16/10; overflow: hidden; background: #17140F;">
    <sc-if value="{{ pipImg }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(0.8) brightness(0.72); background-color: #17140F; background-image: {{ pipImgCss }}; background-size: cover; background-position: center;"></div>
    </sc-if>
  </div>
  <div onClick="{{ pipReturn }}" style="cursor: pointer; min-width: 0; flex: 1 1 auto;">
    <div style="font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ pipTitle }}</div>
    <div style="padding-top: 4px; display: flex; align-items: center; gap: 6px;">
      <sc-if value="{{ pipIsLive }}" hint-placeholder-val="{{ true }}">
        <span style="width: 5px; height: 5px; border-radius: 50%; background: oklch(0.62 0.21 27); animation: pulseLive 1.6s infinite;"></span>
      </sc-if>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.06em; color: #857E73; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ pipViewersShort }}</span>
    </div>
    <sc-if value="{{ pipIsReplay }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top: 6px; height: 2px; background: #1F1C19;"><div style="{{ pipBarStyle }}"></div></div>
    </sc-if>
  </div>
  <span onClick="{{ pipClose }}" style="flex: 0 0 auto; cursor: pointer; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #262320; font-size: 12px; color: #857E73;">✕</span>
</div>
</sc-if>
