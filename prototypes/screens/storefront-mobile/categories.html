<sc-if value="{{ isCategories }}" hint-placeholder-val="{{ false }}">
<div style="animation: fadeIn .3s ease both; padding: 18px 16px 0;">
  <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 32px; line-height: 1.05;">{{ t.allCatsTitle }}</h1>
  <div style="padding-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #857E73;">{{ t.allCatsSub }}</div>
  <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px;">
    <sc-for list="{{ allCategories }}" as="cat" hint-placeholder-count="8">
      <div onClick="{{ cat.open }}" style="cursor: pointer; position: relative; aspect-ratio: 4/3; overflow: hidden; background: #17140F;">
        <sc-if value="{{ cat.img }}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(0.7) brightness(0.6); background-color: #17140F; background-image: {{ cat.imgCss }}; background-size: cover; background-position: center;"></div>
        </sc-if>
        <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,7,7,0.92), rgba(8,7,7,0.15));"></div>
        <div style="position: absolute; left: 11px; right: 11px; bottom: 11px;">
          <div style="font-family: 'Instrument Serif', serif; font-size: 19px; line-height: 1.1;">{{ cat.name }}</div>
          <sc-if value="{{ cat.hasLive }}" hint-placeholder-val="{{ false }}"><div style="padding-top: 5px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: oklch(0.78 0.14 27);">{{ cat.liveLabel }}</div></sc-if>
          <sc-if value="{{ cat.noLive }}" hint-placeholder-val="{{ false }}"><div style="padding-top: 5px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: #9B948A;">{{ cat.count }}</div></sc-if>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</sc-if>
