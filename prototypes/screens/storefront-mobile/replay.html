<sc-if value="{{ isReplay }}" hint-placeholder-val="{{ false }}">
<div style="animation: fadeIn .3s ease both;">
  <div style="position: relative; aspect-ratio: 16/9; overflow: hidden; background: #100F0D; border-bottom: 1px solid #1F1C19;">
    <sc-if value="{{ replayImg }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(0.72) brightness(0.62); background-color: #17140F; background-image: {{ replayImgCss }}; background-size: cover; background-position: center;"></div>
    </sc-if>
    <div style="position: absolute; left: 10px; top: 10px; background: rgba(11,10,9,0.8); padding: 4px 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: oklch(0.78 0.13 42);">{{ t.replayPage }}</div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px; background: linear-gradient(to top, rgba(8,7,7,0.94), transparent);">
      <div style="height: 3px; background: rgba(237,231,220,0.18);" onClick="{{ seek }}"><div style="{{ progressStyle }}"></div></div>
      <div style="padding-top: 10px; display: flex; align-items: center; gap: 12px;">
        <span onClick="{{ togglePlay }}" style="cursor: pointer; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid #4A423A; background: rgba(11,10,9,0.6); font-size: 14px; color: #EDE7DC;">{{ playIcon }}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #C9C0B2;">{{ timeLabel }}</span>
        <div style="margin-left: auto; display: flex; gap: 5px;">
          <sc-for list="{{ speeds }}" as="sp" hint-placeholder-count="3">
            <span onClick="{{ sp.pick }}" style="{{ sp.style }}">{{ sp.label }}</span>
          </sc-for>
        </div>
      </div>
    </div>
  </div>
  <div style="padding: 14px 16px 0;">
    <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 27px; line-height: 1.06;">{{ replayTitle }}</h1>
    <div style="padding-top: 8px; font-size: 13.5px; color: #C9C0B2;">{{ artist.name }}</div>
    <div style="padding-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: #857E73;">{{ replayDateLabel }} · {{ replayMeta }}</div>

    <h2 style="margin: 22px 0 10px; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 22px;">{{ t.chapters }}</h2>
    <div style="display: flex; flex-direction: column; gap: 1px; background: #1F1C19; border: 1px solid #1F1C19;">
      <sc-for list="{{ chapters }}" as="ch" hint-placeholder-count="4">
        <div onClick="{{ ch.jump }}" style="cursor: pointer; background: #0F0E0C; padding: 12px 13px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;  display: flex; align-items: baseline; gap: 12px;">
          <span style="flex: 0 0 auto; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: {{ ch.color }};">{{ ch.time }}</span>
          <span style="min-width: 0; font-size: 13px; color: #C9C0B2;">{{ ch.label }}</span>
        </div>
      </sc-for>
    </div>

    <h2 style="margin: 22px 0 10px; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 22px;">{{ t.store }}</h2>
    <div data-rail="1" style="display: flex; gap: 10px; overflow-x: auto; overscroll-behavior-x: contain; padding-bottom: 4px; cursor: grab; scrollbar-width: none;">
      <sc-for list="{{ replayMerch }}" as="m" hint-placeholder-count="3">
        <div style="flex: 0 0 180px; border: 1px solid #1F1C19; background: #100F0D; padding: 12px;">
          <div style="position: relative; aspect-ratio: 1/1; overflow: hidden; background: #17140F;">
            <sc-if value="{{ m.img }}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(0.75) brightness(0.8); background-color: #17140F; background-image: {{ m.imgCss }}; background-size: cover; background-position: center;"></div>
            </sc-if>
          </div>
          <div style="padding-top: 10px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ m.name }}</div>
          <div style="padding-top: 8px; display: flex; align-items: center; gap: 9px;">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #EDE7DC;">{{ m.price }}</span>
            <span onClick="{{ m.add }}" style="{{ m.addStyle }}">{{ m.addLabel }}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</sc-if>
