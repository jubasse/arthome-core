      <sc-if value="{{ saveDone }}" hint-placeholder-val="{{ false }}">
        <span onClick="{{ goManageSearches }}" style="cursor: pointer; padding: 14px; min-height: 44px; box-sizing: border-box;  text-align: center; background: #EDE7DC; color: #0B0A09; font-size: 13.5px; font-weight: 600;">{{ t.saveManage }}</span>
        <span onClick="{{ closeSave }}" style="cursor: pointer; padding: 13px; min-height: 44px; box-sizing: border-box;  text-align: center; border: 1px solid #332E28; font-size: 12.5px; color: #C9C0B2;">{{ t.close }}</span>
      </sc-if>
    </div>
  </div>
</div>
</sc-if>
