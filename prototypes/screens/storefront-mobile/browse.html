<sc-if value="{{ isBrowse }}" hint-placeholder-val="{{ false }}">
<div style="animation: fadeIn .3s ease both; padding: 18px 16px 0;">
  <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 32px; line-height: 1.05;">{{ browseTitle }}</h1>
  <div style="padding-top: 8px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #857E73;">{{ searchCountLabel }}</span>
    <span onClick="{{ createAlert }}" style="{{ createAlertStyle }}">{{ createAlertLabel }}</span>
  </div>

  <div style="margin-top: 16px; display: flex; gap: 8px;">
    <span onClick="{{ toggleFilters }}" style="{{ filtersBtnStyle }}">{{ filtersBtnLabel }}</span>
    <span onClick="{{ toggleSortMenu }}" style="{{ sortFieldStyle }}">{{ sortCurrentLabel }} {{ sortCaret }}</span>
  </div>

  <sc-if value="{{ hasTokens }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap;">
      <sc-for list="{{ activeTokens }}" as="tk" hint-placeholder-count="2">
        <span onClick="{{ tk.drop }}" title="{{ tk.title }}" style="{{ tk.style }}">{{ tk.label }} ✕</span>
      </sc-for>
      <span onClick="{{ clearAllFilters }}" style="cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: #857E73; align-self: center;">{{ t.clearAll }}</span>
    </div>
  </sc-if>

  <div data-strip="1" style="margin-top: 16px; display: flex; gap: 18px; border-bottom: 1px solid #1F1C19; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; cursor: grab;">
    <sc-for list="{{ searchTabs }}" as="tb" hint-placeholder-count="4">
      <div onClick="{{ tb.pick }}" style="{{ tb.style }}">
        <span>{{ tb.label }}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #6B6459;">{{ tb.count }}</span>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{ nothingFound }}" hint-placeholder-val="{{ false }}">
    <div style="margin-top: 22px; border: 1px solid #1F1C19; background: #0D0C0A; padding: 32px 20px; text-align: center;">
      <div style="font-family: 'Instrument Serif', serif; font-size: 22px;">{{ t.emptyResults }}</div>
      <div style="padding-top: 9px; font-size: 13px; color: #857E73;">{{ t.emptyResultsHint }}</div>
    </div>
  </sc-if>
