<sc-if value="{{ isArtists }}" hint-placeholder-val="{{ false }}">
<div style="animation: fadeIn .3s ease both; padding: 18px 16px 0;">
  <h1 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 32px; line-height: 1.05;">{{ t.artistsTitle }}</h1>
  <div style="padding-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: #857E73;">{{ artistsCountLabel }}</div>
  <div data-strip="1" style="margin-top: 14px; display: flex; gap: 7px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; cursor: grab; padding-bottom: 4px;">
    <sc-for list="{{ artistFilters }}" as="af" hint-placeholder-count="4">
      <span onClick="{{ af.pick }}" style="{{ af.style }}">{{ af.label }}</span>
    </sc-for>
  </div>
  <div data-strip="1" style="margin-top: 8px; display: flex; gap: 7px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; cursor: grab; padding-bottom: 4px;">
    <sc-for list="{{ artistSorts }}" as="so" hint-placeholder-count="3">
      <span onClick="{{ so.pick }}" style="{{ so.style }}">{{ so.label }}</span>
    </sc-for>
  </div>
  <div style="margin-top: 16px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px;">
    <sc-for list="{{ artistsList }}" as="a" hint-placeholder-count="8">
      <div style="border: 1px solid #1F1C19; background: #100F0D;">
        <div onClick="{{ a.open }}" style="cursor: pointer; position: relative; aspect-ratio: 1/1; overflow: hidden; background: #17140F;">
          <sc-if value="{{ a.img }}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(0.7) brightness(0.7); background-color: #17140F; background-image: {{ a.imgCss }}; background-size: cover; background-position: center;"></div>
          </sc-if>
          <div onClick="{{ a.openLiveRow }}" title="{{ a.liveTitle }}" style="position: absolute; left: 9px; top: 9px; display: flex; align-items: center; gap: 6px; background: rgba(11,10,9,0.78); padding: 4px 8px; cursor: {{ a.statusCursor }};">
            <sc-if value="{{ a.isLive }}" hint-placeholder-val="{{ false }}">
              <span style="width: 5px; height: 5px; border-radius: 50%; background: oklch(0.62 0.21 27); animation: pulseLive 1.6s infinite;"></span>
            </sc-if>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: {{ a.statusColor }};">{{ a.statusLabel }}</span>
          </div>
        </div>
        <div style="padding: 11px;">
          <div onClick="{{ a.open }}" style="cursor: pointer; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ a.name }}</div>
          <div style="padding-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #857E73; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ a.discipline }}</div>
          <span onClick="{{ a.toggleFollow }}" style="{{ a.followStyle }}">{{ a.followLabel }}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</sc-if>
