<sc-if value="{{ authOpen }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeAuth }}" style="position: fixed; inset: 0; z-index: 8850; background: rgba(6,5,5,0.8); backdrop-filter: blur(5px); animation: fadeIn .2s ease both;"></div>
<div style="{{ sheetBase }} background: #0B0A09; border-top: 1px solid #332E28; box-shadow: 0 -24px 60px rgba(0,0,0,0.6); animation: slideUp .26s cubic-bezier(.2,.7,.2,1) both;">
  <div style="padding: 12px 0 6px; display: flex; justify-content: center;"><span style="width: 38px; height: 3px; background: #332E28;"></span></div>
  <div style="padding: 6px 16px 24px;">
    <div style="font-family: 'Instrument Serif', serif; font-size: 28px; line-height: 1.05;">{{ authTitle }}</div>
    <div style="padding-top: 9px; font-size: 13px; line-height: 1.55; color: #857E73; text-wrap: pretty;">{{ authIntro }}</div>
    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
      <sc-if value="{{ authIsUp }}" hint-placeholder-val="{{ true }}">
        <div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: #6B6459;">{{ t.authName }}</div>
          <input placeholder="{{ accountName }}" style="margin-top: 7px; width: 100%; box-sizing: border-box; padding: 13px; border: 1px solid #332E28; background: #0F0E0C; font-family: inherit; font-size: 14px; color: #EDE7DC; outline: none;" />
        </div>
      </sc-if>
      <div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: #6B6459;">{{ t.authEmail }}</div>
        <input placeholder="marie@exemple.fr" style="margin-top: 7px; width: 100%; box-sizing: border-box; padding: 13px; border: 1px solid #332E28; background: #0F0E0C; font-family: inherit; font-size: 14px; color: #EDE7DC; outline: none;" />
      </div>
      <div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: #6B6459;">{{ t.authPass }}</div>
        <input type="password" placeholder="••••••••" style="margin-top: 7px; width: 100%; box-sizing: border-box; padding: 13px; border: 1px solid #332E28; background: #0F0E0C; font-family: inherit; font-size: 14px; color: #EDE7DC; outline: none;" />
      </div>
      <span onClick="{{ doAuth }}" style="cursor: pointer; padding: 15px; text-align: center; background: #EDE7DC; color: #0B0A09; font-size: 14px; font-weight: 600;">{{ t.authGo }}</span>
      <span onClick="{{ switchAuth }}" style="cursor: pointer; text-align: center; font-size: 12.5px; color: #857E73;">{{ authSwitch }}</span>
      <span onClick="{{ closeAuth }}" style="cursor: pointer; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: #575047;">{{ t.authAlt }}</span>
    </div>
  </div>
</div>
</sc-if>
