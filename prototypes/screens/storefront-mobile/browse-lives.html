        title: baseOf(group[0].title),
        tHit: this.splitHit(baseOf(group[0].title), (this.state.liveQuery || '').trim()),
        isGroup: true,
        hasExtra: true,
        extra: isOpen ? group.slice(1) : [],

  paged(key, list, step, fr) {
    const n = (this.state.shown || {})[key] || step;

    const busy = (this.state.loading || {})[key] === true;

      this.setState(st => ({ loading: Object.assign({}, st.loading, { [key]: true }) }));
      clearTimeout(this['_pgT_' + key]);

          shown: Object.assign({}, st.shown, { [key]: ((st.shown || {})[key] || step) + step }),
          loading: Object.assign({}, st.loading, { [key]: false })
