<!-- ═══ VIEW MODEL — keys bound by the markup ═════════════════════════════════════════════════ -->
<script type="text/x-dc-fragment">
({
      showChat: s.tab === 'chat', showStore: s.tab === 'store',
      chatModes: [['free', t.chatFree], ['emoji', t.chatEmoji], ['off', t.chatOff]].map(([k, label]) => ({
        label,
        pick: () => this.setState({ chatMode: k, chatModeSet: true }),
        style: 'cursor: pointer; padding: 4px 8px; font-family: \'JetBrains Mono\', monospace; font-size: 9px; letter-spacing: 0.08em; transition: background .2s ease; ' +
          (chatMode === k ? 'background: #EDE7DC; color: #0B0A09;' : 'border: 1px solid #1F1C19; color: #8B857C;')
      })),
      chatFreeMode: chatMode === 'free', chatEmojiMode: chatMode === 'emoji',
      chatOffMode: chatMode === 'off', chatHasFeed: chatMode !== 'off',
      presetPhrases: (fr
        ? ['Bravo, quelle interprétation !', 'Le son est parfait ici', 'Première fois que je les vois en direct', 'Merci pour la rediffusion 🙏']
        : ['Bravo, what a performance!', 'Sound is perfect here', 'First time seeing them live', 'Thanks for the replay 🙏']
      ).map(label => ({
        label,
        send: () => this.setState(st => ({ messages: st.messages.concat([{ user: 'vous', text: label, color: 'oklch(0.72 0.16 42)' }]) }))
      })),
      chatPlaceholder: s.guest ? (fr ? 'Connectez-vous pour écrire' : 'Sign in to chat')
        : (locked ? (fr ? 'Place requise pour écrire' : 'Ticket required to chat') : (fr ? 'Dire quelque chose…' : 'Say something…')),
      chatBlocked: s.guest || locked,
      chatInputStyle: 'flex: 1; min-width: 0; height: 36px; background: #141210; border: 1px solid #1F1C19; font-family: Archivo, sans-serif; font-size: 13.5px; padding: 0 12px; outline: none; color: '
        + ((s.guest || locked) ? '#857E73; cursor: pointer;' : '#EDE7DC;'),
      chatSendStyle: 'cursor: pointer; padding: 0 15px; height: 36px; display: grid; place-items: center; background: #221F1B; font-size: 12.5px; transition: background .24s ease; color: '
        + ((s.guest || locked) ? '#6B6459;' : '#EDE7DC;'),
      chatGate: () => { if (s.guest) this.setState({ authOpen: true, authTab: 'up' }); else if (locked) this.setState({ ticketOpen: true }); },
      messages: s.messages,
      onDraft: e => this.setState({ draft: e.target.value }),
      onDraftKey: e => { if (e.key === 'Enter') this.sendNow(); },
      sendMsg: () => this.sendNow(),
      openShare: () => this.setState({ shareOpen: true }),
})
</script>
