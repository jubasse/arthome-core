  ROUTE      page === 'live', tab === 'store'
  AFFICHE    La boutique du spectacle en cours : ses articles réels, leurs prix réels, et l'ajout au panier.
  MÈNE VERS  overlay-cart

  SOURCE     mockups/Storefront Web.dc.html, lignes 2314-2338
             Extraction stricte : balisage et code recopiés tels quels, rien n'est
             corrigé. L'original reste la référence et reste intact.

  NOTE       C'est le SEUL endroit d'où une ligne de panier est créée — le panier du web ne porte
             pas de places (D-011).

  BESOINS    needs/storefront-web.md
  CONTRAT    openapi/storefront.yaml — addCartLine, getCart

  PARTAGÉ    ce fichier s'appuie sur _shared-runtime.html et _shared-catalogue.html
             pour : A, artist, currentDate, fr, s, t

<!-- ═══ BALISAGE ══════════════════════════════════════════════════════════════════════════════ -->

      <sc-if value="{{ showStore }}" hint-placeholder-val="{{ false }}">
      <div style="flex: 1; overflow-y: auto; padding: 14px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: #857E73; padding-bottom: 12px;">{{ t.storeNote }}</div>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <sc-for list="{{ merch }}" as="m" hint-placeholder-count="4">
            <div style="display: grid; grid-template-columns: 68px 1fr; gap: 12px; align-items: center; border: 1px solid #1F1C19; padding: 10px; background: #100F0D; transition: background .24s ease, border-color .24s ease, color .24s ease, opacity .24s ease;" style-hover="border-color:#4A423A">
              <div style="position: relative; aspect-ratio: 1/1; overflow: hidden; background: #17140F;">
                <div style="position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(0.7) brightness(0.85); background-color: #1A1815; background-image: {{ m.imgCss }}; background-size: cover; background-position: center;"></div>
              </div>
              <div>
                <div style="font-size: 13.5px;">{{ m.name }}</div>
                <div style="padding-top: 4px; display: flex; align-items: center; gap: 10px;">
                  <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #9B948A;">{{ m.price }}</span>
                  <span onClick="{{ m.add }}" style="{{ m.addStyle }}" style-hover="background:#221F1B">{{ m.addLabel }}</span>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="margin-top: 16px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #1F1C19; padding-top: 14px;">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #857E73;">{{ cartLabel }}</span>
          <span style="margin-left: auto; padding: 8px 14px; background: #EDE7DC; color: #0B0A09; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background .24s ease, border-color .24s ease, color .24s ease, opacity .24s ease;" style-hover="background:oklch(0.75 0.15 42)">{{ t.checkout }}</span>
        </div>
      </div>
      </sc-if>

<!-- ═══ MODÈLE DE VUE — calculs locaux (renderReady) ══════════════════════════════════════════ -->
<script type="text/x-dc-fragment">
/* merch  —  lignes 5445-5468 */
    const merch = (() => {
      const IMG_BY_KIND = { textile: IMG.tshirt, poster: IMG.poster, record: IMG.vinyl, print: IMG.poster };
      const d = currentDate || this.defaultDate();
      const items = d ? A.merchOf(A.show(d.show).id) : [];
      const rows = items.filter(x => x.state === 'on-sale').slice(0, 4).map(x => ({
        name: x.label, price: A.price(x.price, x.currency), img: IMG_BY_KIND[x.kind] || IMG.tote
      }));
      return rows.length ? rows : [{ name: fr ? 'Boutique à venir' : 'Shop coming soon', price: '—', img: IMG.tote }];
    })().map(m => Object.assign(m, {
      add: () => this.setState(st => {
        const lines = st.cartLines.slice();
        const i = lines.findIndex(l => l.name === m.name);
        if (i > -1) lines[i] = Object.assign({}, lines[i], { qty: lines[i].qty + 1 });
        else lines.push({ name: m.name, price: m.price, img: m.img, imgCss: this.cssUrl(m.img), seller: artist.name, qty: 1 });
        clearTimeout(this._addT);
        this._addT = setTimeout(() => this.setState({ cartJustAdded: '' }), 1600);
        return { cartLines: lines, cartOpen: true, cartStep: 'list', cartJustAdded: m.name, notifsOpen: false };
      }),
      addLabel: s.cartJustAdded === m.name ? t.cartAdded : t.add,
      addStyle: 'margin-left: auto; cursor: pointer; padding: 5px 11px; white-space: nowrap; font-size: 12.5px; border: 1px solid ' +
        (s.cartJustAdded === m.name ? 'oklch(0.6 0.11 150); color: oklch(0.78 0.13 150);' : '#332E28; color: #EDE7DC;') +
        ' transition: background .24s ease, border-color .24s ease, color .24s ease;'
    }));

/* cartCount  —  lignes 6231-6231 */
    const cartCount = s.cartLines.reduce((n, l) => n + l.qty, 0);
</script>

<!-- ═══ MODÈLE DE VUE — clés rendues au balisage ══════════════════════════════════════════════ -->
<script type="text/x-dc-fragment">
({
      cartLabel: (fr ? 'PANIER · ' : 'CART · ') + cartCount + (fr ? ' ARTICLE' : ' ITEM') + (cartCount > 1 ? 'S' : ''),
})
</script>
