    <sc-if value="{{ searchModal }}" hint-placeholder-val="{{ false }}">

    </sc-if>
    <div data-pop="sugg" style="{{ searchWrapStyle }}">
      <input value="{{ query }}" onChange="{{ onQuery }}" onFocus="{{ onSearchFocus }}" onBlur="{{ onSearchBlur }}" onKeyDown="{{ onSearchKey }}" placeholder="{{ t.search }}" style="width: 100%; height: 40px; background: #141210; border: 1px solid #1F1C19; border-radius: 2px; color: #EDE7DC; font-family: Archivo, sans-serif; font-size: 13.5px; padding: 0 14px 0 38px; outline: none;" style-focus="border-color:#4A423A" />

      <sc-if value="{{ suggOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; left: 0; right: 0; top: 48px; z-index: 600; max-height: 68vh; overflow-y: auto; background: #0D0C0A; border: 1px solid #1F1C19; box-shadow: 0 24px 60px rgba(0,0,0,0.6); animation: riseIn .18s ease both;">

            <div>

              <sc-for list="{{ suggShows }}" as="sg" hint-placeholder-count="3">

<!-- ═══ MODÈLE DE VUE — calculs locaux (renderReady) ══════════════════════════════════════════ -->
<script type="text/x-dc-fragment">
/* q  —  lignes 5699-5699 */
    const q = s.query.trim().toLowerCase();
/* suggArtists  —  lignes 5701-5705 */
    const suggArtists = q ? roster.filter(a => matchQ(a.name, a.discipline)).slice(0, 4).map(a => ({
      name: a.name, img: a.portrait, imgCss: this.cssUrl(a.portrait), open: () => this.setState({ page: 'artist', artistId: a.i, suggOpen: false, searchOpen: false }),
      isLive: a.isLive, status: a.isLive ? t.onNow : a.discipline.toUpperCase(),
      statusColor: a.isLive ? 'oklch(0.78 0.14 27)' : '#857E73'
    })) : [];
/* suggShows  —  lignes 5706-5712 */
    const suggShows = q ? roster.filter(a => matchQ(a.showTitle)).slice(0, 4).map(a => ({
      name: a.showTitle, artist: a.name, img: a.showImg, imgCss: this.cssUrl(a.showImg),
      open: () => this.setState({ page: 'live', artistId: a.i, suggOpen: false, searchOpen: false, watching: a.i, watchKind: 'live', pipClosed: false }),
      isLive: a.isLive, status: a.isLive ? t.onNow : (fr ? 'REDIFF.' : 'REPLAY'),
      statusColor: a.isLive ? 'oklch(0.78 0.14 27)' : '#857E73'
    })) : [];

</script>

<!-- ═══ MODÈLE DE VUE — clés rendues au balisage ══════════════════════════════════════════════ -->
<script type="text/x-dc-fragment">
({
      query: s.query, draft: s.draft,
      onQuery: e => {
        const v = e.target.value;
        this.setState({ query: v, suggOpen: v.trim().length > 0 });
        clearTimeout(this._qT);
        this._qT = setTimeout(() => {
          const q = v.trim();
          this.setState(st => ({ liveQuery: q.length >= 3 ? q : '', shown: {}, page: q.length >= 3 && st.page === 'browse' ? 'browse' : st.page }));
        }, 260);
      },
      onSearchFocus: () => this.setState(st => ({ suggOpen: st.query.trim().length > 0 })),
      onSearchBlur: () => setTimeout(() => this.setState({ suggOpen: false, searchOpen: false }), 160),
      onSearchKey: e => { if (e.key === 'Enter') this.setState(st => ({ page: 'browse', suggOpen: false, searchOpen: false, filter: 0, liveQuery: st.query.trim(), shown: {} })); if (e.key === 'Escape') this.setState({ suggOpen: false, searchOpen: false }); },
      submitSearch: () => this.setState(st => ({ page: 'browse', suggOpen: false, searchOpen: false, filter: 0, liveQuery: st.query.trim(), shown: {} })),
      suggOpen: s.suggOpen && s.query.trim().length > 0,
      suggArtists, suggShows,
      hasSuggArtists: suggArtists.length > 0, hasSuggShows: suggShows.length > 0,
      noSuggArtists: suggArtists.length === 0 && suggShows.length > 0,
      noSuggShows: suggShows.length === 0 && suggArtists.length > 0,
      suggEmpty: suggArtists.length === 0 && suggShows.length === 0,
      searchModal: sideDrawer && s.searchOpen,
      closeSearch: () => this.setState({ searchOpen: false, suggOpen: false, searchOpen: false }),
      searchWrapStyle: !sideDrawer
        ? 'flex: 1 1 140px; min-width: 0; max-width: 380px; position: relative;'
        : (s.searchOpen
          ? 'position: fixed; left: 50%; top: 96px; transform: translateX(-50%); width: 560px; max-width: 92vw; z-index: 8900; animation: fadeIn .2s ease both;'
          : 'display: none;'),
})
</script>
