<script type="text/x-dc-fragment">
/* accStack  —  lignes 5747-5747 */
    const accStack = availW < 760;
/* profileFields  —  lignes 5837-5846 */
    const profileFields = profileDefs.map(([key, label, hint]) => ({
      label, hint,
      value: s.profile[key],
      hintColor: hint.indexOf('✓') > -1 ? 'oklch(0.7 0.13 150)' : '#6B6459',
      onChange: e => {
        const v = e.target.value;
        this.setState(st => ({ profile: Object.assign({}, st.profile, { [key]: v }) }));
      }
    }));

</script>

<!-- ═══ MODÈLE DE VUE — clés rendues au balisage ══════════════════════════════════════════════ -->
<script type="text/x-dc-fragment">
({
      goStudio: () => this.setState({ studioOpen: true }),
      accH2: accStack ? 'display: none;' : '',
      helpFromMenu: () => this.setState({ accMenuOpen: false, page: 'help', pick: null }),
      accProfile: s.accTab === 'profile', accPrefs: s.accTab === 'prefs',
      profileFields: profileFields,
      saveProfile: () => { this.setState({ profileSaved: true }); setTimeout(() => this.setState({ profileSaved: false }), 2000); },
      saveLabel: s.profileSaved ? t.saved : t.save,
})
</script>
