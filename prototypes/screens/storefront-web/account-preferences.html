/* prefRows  —  lines 5864-5878 */
    const prefRows = prefDefs.map(([key, label, hint, opts]) => ({
      label, hint,
      options: opts.map(([val, oLabel]) => {
        const on = key === 'lang' ? s.lang === val : s.prefs[key] === val;
        return {
          label: oLabel,
          pick: key === 'lang'
            ? (() => this.setState({ lang: val }))
            : (() => this.setState(st => ({ prefs: Object.assign({}, st.prefs, { [key]: val }) }))),
          style: 'cursor: pointer; padding: 7px 12px; font-family: \'JetBrains Mono\', monospace; font-size: 9px; letter-spacing: 0.08em; ' +
            (on ? 'background: #EDE7DC; color: #0B0A09;' : 'border: 1px solid #1F1C19; color: #9B948A;')
        };
      })
    }));

</script>
