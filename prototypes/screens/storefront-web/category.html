<script type="text/x-dc-fragment">
/* priceDefs  —  lines 5936-5936 */
    const priceDefs = [['free', t.pFree, p => p === 0], ['u10', t.pU10, p => p > 0 && p < 10], ['1020', t.p1020, p => p >= 10 && p <= 20], ['2035', t.p2035, p => p > 20 && p <= 35], ['o35', t.p35, p => p > 35]];
/* dateDefs  —  lines 5937-5937 */
    const dateDefs = [['tonight', t.dTonight], ['weekend', t.dWeekend], ['d7', t.d7], ['d30', t.d30], ['range', t.dRange]];
/* statusDefs  —  lines 5945-5945 */
    const statusDefs = [['live', t.stLive], ['soon', t.stSoon], ['replay', t.stReplay]];
/* catFollowEntry  —  lines 6045-6045 */
    const catFollowEntry = s.alerts.find(al => al.scope === 'category' && this.alertSig('', al.st) === catSig) || null;
/* catFilterCount  —  lines 6175-6175 */
    const catFilterCount = subsSel.length + s.cPrices.length + (s.cDate !== 'all' ? 1 : 0) + (s.cStatus !== 'all' ? 1 : 0) + (s.cAlmost ? 1 : 0) + (s.cPromo ? 1 : 0);
/* catPool  —  lines 6176-6191 */
    const catPool = catalogue.filter(o => {
      if (o.cat !== s.catId) return false;
      if (subsSel.length && !subsSel.some(i => o.subs.indexOf(i) > -1)) return false;
      if (s.cPrices.length && !s.cPrices.some(k => priceMatch(k, o.price))) return false;
      if (s.cDate !== 'all' && !dateMatch(s.cDate, o.day)) return false;
      if (s.cStatus !== 'all' && o.kind !== s.cStatus) return false;
      if (s.cAlmost && o.kind !== 'replay' && o.soldPct < 80) return false;
      if (s.cPromo && !o.hasPromo) return false;
      return true;
    }).sort((a, b) => {
      if (s.cSort === 'soon') return a.day - b.day;
      if (s.cSort === 'pop') return (b.viewers || b.soldPct * 40) - (a.viewers || a.soldPct * 40);
      if (s.cSort === 'priceUp') return a.price - b.price;
      if (s.cSort === 'priceDown') return b.price - a.price;
      return 0;
    });
/* catLiveList  —  lines 6194-6194 */
    const catLiveList = catPool.filter(o => o.kind === 'live');
/* catRepList  —  lines 6196-6196 */
    const catRepList = catPool.filter(o => o.kind === 'replay');
/* catArtList  —  lines 6197-6197 */
    const catArtList = roster.filter(a => catPool.some(o => o.artistIdx === a.i));
/* goCatTab  —  lines 6202-6202 */
    const goCatTab = k => () => this.setState({ catTab: k, shown: {} });
</script>

<script type="text/x-dc-fragment">
({
      goCategories: this.nav('categories'),
      /* L'accueil s'arrête aux douze premières disciplines : au-delà, la
         grille devient un sommaire. La page dédiée les montre toutes. */
      catAlreadySaved: !!catFollowEntry, catNotSaved: !catFollowEntry,
      catSaveNew: this.gate(() => this.setState({ saveOpen: true, saveStep: 'ask', saveName: '', saveScope: 'category' })),
      catSavedName: catFollowEntry ? this.alertName(catFollowEntry, cats, t) : '',
      catSavedEditing: !!catFollowEntry && s.renameId === catFollowEntry.id,
      catSavedIdle: !!catFollowEntry && s.renameId !== catFollowEntry.id,
      catSavedDraft: s.renameDraft,
      catSavedStartRename: () => { if (catFollowEntry) this.setState({ renameId: catFollowEntry.id, renameDraft: this.alertName(catFollowEntry, cats, t) }); },
      catSavedInput: e => this.setState({ renameDraft: e.target.value }),
      catSavedKey: e => {
        if (e.key === 'Enter') this.setState(st => ({
          alerts: st.alerts.map(x => catFollowEntry && x.id === catFollowEntry.id ? Object.assign({}, x, { name: st.renameDraft.trim() }) : x),
          renameId: null, renameDraft: ''
        }));
        if (e.key === 'Escape') this.setState({ renameId: null, renameDraft: '' });
      },
      catSavedRemove: () => { if (catFollowEntry) this.setState({ deleteId: catFollowEntry.id }); },

      catViewOptions: [['tiles', t.viewTiles], ['list', t.viewList]].map(([k, label]) => ({
        label, pick: () => this.setState({ cView: k }),
        style: CHIP + (s.cView === k ? '#EDE7DC; background: #EDE7DC; color: #0B0A09;' : '#1F1C19; color: #9B948A;')
      })),
      catTokens: (() => {
        const out = [];
        if (subsSel.length) {
          const names = SUBS[s.catId] || SUBS[0];
          const picked = subsSel.map(i => names[i]).filter(Boolean);
          out.push({ label: picked.length === 1 ? picked[0] : t.subgenres + ' (' + picked.length + ')', title: picked.join(' · '), drop: () => this.setState({ subs: [] }) });
        }
        if (s.cPrices.length) {
          const labels = s.cPrices.map(k => (priceDefs.find(p => p[0] === k) || ['', k])[1]);
          out.push({ label: labels.length === 1 ? labels[0] : t.fPrice + ' (' + labels.length + ')', title: labels.join(' · '), drop: () => this.setState({ cPrices: [] }) });
        }
        if (s.cDate !== 'all') out.push({ label: (dateDefs.find(d => d[0] === s.cDate) || ['', ''])[1], drop: () => this.setState({ cDate: 'all' }) });
        if (s.cStatus !== 'all') out.push({ label: (statusDefs.find(d => d[0] === s.cStatus) || ['', ''])[1], drop: () => this.setState({ cStatus: 'all' }) });
        const cFlags = [];
        if (s.cAlmost) cFlags.push({ label: t.almostFull, clear: { cAlmost: false } });
        if (s.cPromo) cFlags.push({ label: t.promoFilter, clear: { cPromo: false } });
        if (cFlags.length) out.push({
          label: cFlags.length === 1 ? cFlags[0].label : t.fMisc + ' (' + cFlags.length + ')',
          title: cFlags.map(x => x.label).join(' · '),
          drop: () => this.setState(cFlags.length === 1 ? cFlags[0].clear : { cAlmost: false, cPromo: false })
        });
        return out.map(tk => Object.assign(tk, {
          title: tk.title || tk.label,
          style: "cursor: pointer; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border: 1px solid #332E28; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.06em; color: #C9C0B2; transition: border-color .2s ease;"
        }));
      })(),
      catHasTokens: catFilterCount > 0,
      clearCatFilters: () => this.setState({ subs: [], cPrices: [], cDate: 'all', cStatus: 'all', cAlmost: false, cPromo: false, cSort: 'auto' }),
      sideCols: sideDrawer ? 'minmax(0,1fr)' : (s.sideOpen ? '236px minmax(0,1fr)' : '38px minmax(0,1fr)'),
      catTabs: [
        ['ov', t.tabOverview, catPool.length],
        ['live', t.tabCatLive, catLiveList.length],
        ['up', t.catUpcoming, catPool.filter(o => o.kind === 'upcoming').length],
        ['art', t.tabCatArtists, catArtList.length],
        ['rep', t.replaysTitle, catRepList.length]
      ].map(([k, label, n]) => ({
        label, count: String(n),
        pick: goCatTab(k),
        style: 'cursor: pointer; padding: 12px 2px; display: flex; align-items: baseline; gap: 8px; font-size: 15px; white-space: nowrap; border-bottom: 2px solid ' +
          (s.catTab === k ? '#EDE7DC' : 'transparent') + '; color: ' + (s.catTab === k ? '#EDE7DC' : '#857E73') + '; transition: color .24s ease, border-color .24s ease;'
      })),
})
</script>
