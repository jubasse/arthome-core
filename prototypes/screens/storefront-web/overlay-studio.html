  AFFICHE    Le panneau qui annonce que le studio est un produit séparé.
  MÈNE VERS  aucun — il ne mène nulle part dans cette maquette

  SOURCE     mockups/Storefront Web.dc.html, lignes 3049-3060
             Extraction stricte : balisage et code recopiés tels quels, rien n'est
             corrigé. L'original reste la référence et reste intact.

  BESOINS    needs/storefront-web.md

<!-- ═══ BALISAGE ══════════════════════════════════════════════════════════════════════════════ -->

<sc-if value="{{ studioOpen }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeStudio }}" style="position: fixed; inset: 0; z-index: 8700; background: rgba(6,5,5,0.82); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 32px; animation: fadeIn .2s ease both;">
  <div onClick="{{ stopEvt }}" style="width: 440px; max-width: 100%; max-height: calc(100vh - 64px); overflow-y: auto; border: 1px solid rgba(214,178,102,0.32); background: #0B0A09; padding: 26px 28px; animation: riseIn .28s ease both;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; color: oklch(0.83 0.1 84);">{{ t.studioSoonNote }}</div>
    <div style="padding-top: 12px; font-family: 'Instrument Serif', serif; font-size: 27px; line-height: 1.1;">{{ t.studioSoonTitle }}</div>
    <div style="padding-top: 12px; font-size: 13.5px; line-height: 1.6; color: #9B948A; text-wrap: pretty;">{{ t.studioSoonBody }}</div>
    <div style="padding-top: 20px; display: flex; justify-content: flex-end;">
      <span onClick="{{ closeStudio }}" style="cursor: pointer; padding: 11px 18px; white-space: nowrap; border: 1px solid #332E28; font-size: 12.5px; color: #C9C0B2; transition: border-color .24s ease, color .24s ease;" style-hover="border-color:#4A423A;color:#EDE7DC">{{ t.studioSoonClose }}</span>
    </div>
  </div>
</div>
</sc-if>

<!-- ═══ MODÈLE DE VUE — clés rendues au balisage ══════════════════════════════════════════════ -->
<script type="text/x-dc-fragment">
({
      stopEvt: e => { if (e && e.stopPropagation) e.stopPropagation(); },
      studioOpen: s.studioOpen,
      closeStudio: () => this.setState({ studioOpen: false }),
})
</script>
