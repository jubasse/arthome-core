/* faves  —  lines 5207-5227 */
    const faves = (() => {
      const followed = (s.follows || []).map(i => roster[i]).filter(Boolean);
      const pool = followed.length ? followed : roster.slice(0, 5);
      return pool.slice(0, 5).map(a => ({
        artist: a.name,
        initials: a.name.split(/[\s’']+/).map(w => w[0]).filter(Boolean).join('').slice(0, 2).toLocaleUpperCase(fr ? 'fr-FR' : 'en-US'),
        title: a.showTitle,
        /* Le rouge d'antenne ne sert qu'à l'antenne. */
        isLive: !!a.isLive, notLive: !a.isLive,
        nextLabel: a.isLive ? '' : (() => {
          const next = A.datesOfArtist(a.id).filter(d => d.startOffsetMin > 0)
            .sort((x, y) => x.startOffsetMin - y.startOffsetMin)[0];
          return next
            ? (A.dayLabel(next.startOffsetMin) + ' · ' + A.clock(next.startOffsetMin)).toLocaleUpperCase(fr ? 'fr-FR' : 'en-US')
            : (fr ? 'AUCUNE DATE' : 'NO DATE');
        })(),
        viewersLabel: a.viewers || '',
        img: a.showImg, imgCss: this.cssUrl(a.showImg)
      }));
    })().map(x => Object.assign(x, { open: () => this.openLive(x.artist), openArtist: this.goArtistFrom(x.artist) }));

/* accStack  —  lines 5747-5747 */

</script>
