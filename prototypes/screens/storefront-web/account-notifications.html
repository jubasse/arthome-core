<!-- ═══ MODÈLE DE VUE — calculs locaux (renderReady) ══════════════════════════════════════════ -->
<script type="text/x-dc-fragment">
/* accStack  —  lignes 5747-5747 */
    const accStack = availW < 760;
/* notifRows  —  lignes 5892-5907 */
    const notifRows = notifDefs.map(([key, label, hint]) => ({
      label, hint,
      cells: [0, 1, 2].map(ci => {
        const on = s.notif[key][ci];
        return {
          toggle: () => this.setState(st => {
            const row = st.notif[key].slice(); row[ci] = !row[ci];
            return { notif: Object.assign({}, st.notif, { [key]: row }) };
          }),
          wrapStyle: 'cursor: pointer; justify-self: center; width: 38px; height: 21px; border-radius: 11px; padding: 3px; display: flex; ' +
            (on ? 'background: oklch(0.68 0.18 42); justify-content: flex-end;' : 'background: #221F1B; justify-content: flex-start;'),
          knobStyle: 'width: 15px; height: 15px; border-radius: 50%; background: ' + (on ? '#0B0A09' : '#857E73') + ';'
        };
      })
    }));

</script>

<!-- ═══ MODÈLE DE VUE — clés rendues au balisage ══════════════════════════════════════════════ -->
<script type="text/x-dc-fragment">
({
      accH2: accStack ? 'display: none;' : '',
      accNotifs: s.accTab === 'notifs', accSecurity: s.accTab === 'security',
      notifRows: notifRows,
      toggleQuiet: () => this.setState(st => ({ quiet: !st.quiet })),
      quietLabel: s.quiet ? (fr ? 'ACTIVÉ' : 'ON') : (fr ? 'DÉSACTIVÉ' : 'OFF'),
      quietStyle: 'margin-left: auto; flex: 0 0 auto; cursor: pointer; padding: 8px 14px; white-space: nowrap; font-family: \'JetBrains Mono\', monospace; font-size: 9px; letter-spacing: 0.1em; ' +
        (s.quiet ? 'background: #EDE7DC; color: #0B0A09;' : 'border: 1px solid #332E28; color: #9B948A;'),
})
</script>
