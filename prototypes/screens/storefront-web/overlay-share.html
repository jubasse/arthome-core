<sc-if value="{{ shareOpen }}" hint-placeholder-val="{{ false }}">
<div onClick="{{ closeShare }}" style="position: fixed; inset: 0; z-index: 8000; background: rgba(6,5,5,0.72); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 40px; animation: fadeIn .2s ease both;">

    <div style="padding-top: 8px; font-size: 13.5px; color: #9B948A;">{{ t.shareBlurb }}</div>
    <div style="margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <sc-for list="{{ shareTargets }}" as="s" hint-placeholder-count="4">
        <span style="cursor: pointer; padding: 12px; border: 1px solid #1F1C19; font-size: 13.5px; text-align: center; color: #C9C0B2; transition: background .24s ease, border-color .24s ease, color .24s ease, opacity .24s ease;" style-hover="border-color:#4A423A;color:#EDE7DC">{{ s }}</span>
      </sc-for>
    </div>
    <div style="margin-top: 14px; display: flex; gap: 8px;">
      <input value="{{ shareUrl }}" readOnly="{{ true }}" style="flex: 1; min-width: 0; height: 38px; background: #141210; border: 1px solid #1F1C19; color: #9B948A; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 0 12px; outline: none;" />
      <span style="cursor: pointer; padding: 0 15px; height: 38px; display: grid; place-items: center; background: #221F1B; font-size: 12.5px; transition: background .24s ease, border-color .24s ease, color .24s ease, opacity .24s ease;" style-hover="background:#2E2A24">{{ t.copy }}</span>
    </div>
  </div>
</div>
</sc-if>
