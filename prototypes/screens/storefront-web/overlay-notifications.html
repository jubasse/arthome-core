      <div data-pop="notifs" style="{{ memberOnly }} position: relative;">

            </div>
            <div style="max-height: 340px; overflow-y: auto;">
              <sc-for list="{{ notifFeed }}" as="n" hint-placeholder-count="4">
                <div onClick="{{ n.open }}" style="{{ n.style }}">
                  <div style="flex: 0 0 42px; width: 42px; height: 42px; overflow: hidden; position: relative; background: #17140F;">
                    <div style="position: absolute; inset: 0; width: 100%; height: 100%; filter: saturate(0.7) brightness(0.76); background-color: #1A1815; background-image: {{ n.imgCss }}; background-size: cover; background-position: center;"></div>
                  </div>
                  <div style="min-width: 0;">
                    <div style="font-size: 12.5px; line-height: 1.4; text-wrap: pretty;">{{ n.text }}</div>

            </div>
            <div onClick="{{ goAccountNotifs }}" style="cursor: pointer; border-top: 1px solid #1F1C19; padding: 11px 15px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; color: #C9C0B2; transition: background .2s ease;" style-hover="background:#171410;color:#EDE7DC">{{ t.notifSettings }} →</div>
          </div>

<!-- ═══ MODÈLE DE VUE — clés rendues au balisage ══════════════════════════════════════════════ -->
<script type="text/x-dc-fragment">
({
      notifsOpen: s.notifsOpen,
      toggleNotifs: () => this.setState(st => ({ notifsOpen: !st.notifsOpen })),
      markAllRead: () => this.setState({ notifsRead: true }),
      unreadNotifs: !s.notifsRead,
      notifCount: '3',
      goAccountNotifs: () => this.setState({ page: 'account', accTab: 'notifs', notifsOpen: false }),
      bellStyle: 'cursor: pointer; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid ' +
        (s.notifsOpen ? '#4A423A' : '#332E28') + '; font-size: 12.5px; color: ' + (s.notifsOpen ? '#EDE7DC' : '#C9C0B2') + '; transition: border-color .24s ease, color .24s ease;',
      /* Les alertes : ce qui se passe réellement sur les artistes suivis. */
      notifFeed: (() => {
        const rows = [];
        A.liveNow().slice(0, 2).forEach(d => {
          const show = A.show(d.show), art = A.artist(show.artist);
          rows.push([(art ? art.name : '') + (fr ? ' est en direct — ' : ' is live — ') + A.title(show),
            (fr ? 'DEPUIS ' : 'FOR ') + A.duration(Math.max(1, -d.startOffsetMin)).toUpperCase(),
            A.showImage(show, 900), (roster.filter(r => art && r.id === art.id)[0] || {}).i || 0, true]);
        });
        A.replays().slice(0, 1).forEach(d => {
          const show = A.show(d.show), art = A.artist(show.artist);
          const left = A.replayHoursLeft(d);
          rows.push([(fr ? 'Votre rediffusion de ' : 'Your replay of ') + A.title(show)
            + (left ? (fr ? ' expire dans ' : ' expires in ') + left + ' h' : (fr ? ' est en ligne' : ' is online')),
            (fr ? 'REDIFFUSION' : 'REPLAY'), A.showImage(show, 900),
            (roster.filter(r => art && r.id === art.id)[0] || {}).i || 0, true]);
        });
        A.upcoming().filter(d => {
          const cap = A.venue(d.venue).capacity;
          return cap && d.seats.sold / cap > 0.9;
        }).slice(0, 1).forEach(d => {
          const show = A.show(d.show), art = A.artist(show.artist), cap = A.venue(d.venue).capacity;
          rows.push([A.title(show) + ' — ' + (art ? art.name : '') + ' : '
            + Math.round((d.seats.sold / cap) * 100) + (fr ? ' % des places vendues' : '% of seats sold'),
            A.when(d).toLocaleUpperCase(fr ? 'fr-FR' : 'en-US'), A.showImage(show, 900),
            (roster.filter(r => art && r.id === art.id)[0] || {}).i || 0, false]);
        });
        return rows;
      })().map(([text, time, img, id, unread]) => ({
        text, time, img, imgCss: this.cssUrl(img),
        timeColor: (unread && !s.notifsRead) ? 'oklch(0.78 0.13 42)' : '#6B6459',
        open: () => this.setState({ page: 'artist', artistId: id, notifsOpen: false }),
        style: 'cursor: pointer; padding: 12px 15px; display: flex; gap: 12px; align-items: flex-start; border-bottom: 1px solid #16140F; transition: background .2s ease; ' +
          ((unread && !s.notifsRead) ? 'background: #12100E;' : 'background: transparent;')
      })),
      memberOnly: s.guest ? 'display: none;' : '',
})
</script>
