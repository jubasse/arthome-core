<!-- ═══ MODÈLE DE VUE — calculs locaux (renderReady) ══════════════════════════════════════════ -->
<script type="text/x-dc-fragment">
/* accStack  —  lignes 5747-5747 */
    const accStack = availW < 760;
/* pastEvents  —  lignes 5768-5791 */
    const pastEvents = ownedPast.map(d => {
        const show = A.show(d.show), art = A.artist(show.artist);
        const online = A.stateOf(d) === 'replay';
        const left = online ? A.replayHoursLeft(d) : 0;
        return [A.title(show), art ? art.name : '', A.showImage(show, 900),
          A.longDate(d.startOffsetMin).toLocaleUpperCase(fr ? 'fr-FR' : 'en-US'),
          online ? (left ? (fr ? 'REDIFF. ' : 'REPLAY ') + left + ' H' : (fr ? 'REDIFFUSION' : 'REPLAY'))
                 : (fr ? 'EXPIRÉE' : 'EXPIRED'),
          online,
          online ? (fr ? 'Revoir' : 'Watch again') : (fr ? 'Voir la fiche' : 'See details')];
      })
      .map(([title, artist, img, date, replay, live, cta]) => {
      const ai = artistIndexFor(artist);
      return {
        title, artist, img, imgCss: this.cssUrl(img), date, replay, cta,
        replayColor: live ? 'oklch(0.74 0.15 42)' : '#6B6459',
        openArtist: () => this.setState({ page: 'artist', artistId: ai }),
        action: live
          ? (() => this.setState({ page: 'replay', artistId: ai, replayTitle: title, replayImg: img, replayDuration: '1 h 42', pos: 0, watching: ai, watchKind: 'replay', pipClosed: false }))
          : (() => this.setState({ page: 'artist', artistId: ai }))
      };
    });

    /* Vos artistes suivis, avec leur prochaine date. */
</script>

<!-- ═══ MODÈLE DE VUE — clés rendues au balisage ══════════════════════════════════════════════ -->
<script type="text/x-dc-fragment">

      pastEvents: pastEvents,

</script>
