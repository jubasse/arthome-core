<script type="text/x-dc-extract">
    // hero
    const lives = cat.filter(o => this.st(o) === 'live').sort((a, b) => b.view - a.view);
    const myLive = lives.filter(o => this.owns(o)).sort((a, b) => a.min - b.min)[0];
    const myOpen = cat.filter(o => this.owns(o) && this.st(o) === 'soon' && o.min <= 30).sort((a, b) => a.min - b.min)[0];
    const heroShow = (this.onAir() && myLive) ? myLive
      : myOpen ? myOpen
      : (this.onAir() && lives.length) ? lives[0]
      : (cat.filter(o => this.st(o) === 'soon').sort((a, b) => a.min - b.min)[0] || cat[0]);
    const heroOwned = this.owns(heroShow), heroLive = this.st(heroShow) === 'live';
    const inList = s.list.indexOf(heroShow.id) > -1;
    const hero = {
      img: this.img(heroShow), preview: U(PIC.crowd), isLive: heroLive, notLive: !heroLive, ownedLive: heroLive && heroOwned,
      viewers: this.num(heroShow.view) + ' ' + t.viewersSuffix,
      kicker: (heroOwned && heroLive) ? t.yourLiveSeat
        : (heroOwned && this.st(heroShow) === 'soon' && heroShow.min <= 30) ? t.kEnterOpen
        : this.st(heroShow) === 'replay' ? t.kReplayOn
        : (heroShow.seats > 0 && heroShow.seats < 30 ? t.kLast + ' · ' + heroShow.seats : this.countdown(heroShow.min)),
      kickerCol: (heroOwned && heroLive) ? LIVE_INK
        : (heroOwned && this.st(heroShow) === 'soon' && heroShow.min <= 30) ? OK
        : (heroShow.seats > 0 && heroShow.seats < 30 ? GOLD : ACC),
      title: this.title(heroShow),
      meta: [this.catLabel(heroShow.cat), this.durLabel(heroShow.dur), heroShow.ven, (fr ? 'heure locale ' : 'your time ') + this.clock(heroShow.min)].join(' · '),
      syn: this.syn(heroShow),
      primaryLabel: heroLive ? (heroOwned ? t.watch : t.book) : (heroOwned ? (heroShow.min <= 30 ? t.enter : t.watch) : t.book),
      playable: heroOwned ? 'y' : '',
      primary: () => heroOwned ? this.openPlayer(heroShow) : this.go('book', { pid: heroShow.id, tier: 0, qty: 2 }),
      hasSecondary: !heroOwned && heroShow.seats > 0,
      secondaryLabel: t.trailer,
      secondary: () => this.openPlayer(heroShow),
      info: () => this.go('title', { pid: heroShow.id }),
      toggleList: () => this.toggleList(heroShow.id),
      listGlyph: inList ? '✓' : '+', listCol: inList ? GOLD : '#C9C0B2'
    };
</script>

<script type="text/x-dc-extract">
  homeRails() {
    const t = this.t(), cat = this.catalogue(), out = [];
    const resume = cat.filter(o => o.prog);
    if (resume.length) out.push(this.rail('resume', t.rResume, resume.map(o => this.card(o, 'resume')), 'card'));
    const live = cat.filter(o => this.st(o) === 'live');
    if (live.length) out.push(this.rail('onair', t.rOnAir, live.map(o => this.card(o, 'onair')), 'card', this.num(live.reduce((n, o) => n + o.view, 0)) + ' ' + t.viewersSuffix, LIVE_INK));
    else out.push(this.emptyRail('onair', t.rOnAir, t.nothingOnAirShort, t.seeTonight, () => this.go('live')));
    const mine = cat.filter(o => this.owns(o) && (this.st(o) === 'soon' || this.st(o) === 'live')).sort((a, b) => a.min - b.min);
    if (mine.length) out.push(this.rail('tickets', t.rTickets, mine.map(o => this.ticketCard(o, 'tickets')), 'card'));
    const tonight = cat.filter(o => this.st(o) === 'soon' && o.min < 1440).sort((a, b) => a.min - b.min);
    if (tonight.length) out.push(this.rail('tonight', t.rTonight, tonight.map(o => this.card(o, 'tonight')), 'card'));
    const f = this.follows();
    if (f.length) {
      const a = ARTISTS.filter(x => x.id === f[0])[0];
      const items = cat.filter(o => o.ar === a.id);
      if (items.length) out.push(this.rail('because', t.rBecause + ' ' + a.name, items.map(o => this.card(o, 'because')), 'card'));
    }
    const exp = cat.filter(o => this.st(o) === 'replay' && o.rep <= 48).sort((a, b) => a.rep - b.rep);
    if (exp.length) out.push(this.rail('expiring', t.rExpiring, exp.map(o => this.card(o, 'expiring')), 'card', '', ACC));
    out.push(this.rail('posters', t.rPosters, cat.slice(0, 7).map(o => this.card(o, 'posters')), 'poster'));
    const discs = this.kid() ? KID_CATS.slice(0, 3) : ['theatre', 'dance', 'comedy'];
    discs.forEach(d => {
      const items = cat.filter(o => o.cat === d);
      if (items.length) out.push(this.rail('d' + d, this.catLabel(d) + (' ' + t.onTheBill), items.map(o => this.card(o, 'd' + d)), 'card'));
    });
    out.push(this.rail('artists', t.rArtistsToFollow, ARTISTS.slice(0, 8).map(a => this.artistCard(a, 'hartists')), 'portrait'));
    return out;
  }
</script>

<script type="text/x-dc-extract">
  armPreview() {
    clearTimeout(this.prevT);
    if (this.state.preview) this.setState({ preview: false });
    if (this.props.autoplayPreview === false) return;
    this.prevT = setTimeout(() => { if (this.state.page === 'home') this.setState({ preview: true }); }, 4000);
  }
</script>
