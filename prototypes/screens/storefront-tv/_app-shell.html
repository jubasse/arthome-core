<script type="text/x-dc-extract">
  // ---------- lifecycle ----------
  componentDidMount() {
    this.loadArthome();
    this.root = document.querySelector('[data-tvroot]');
    this.onKeyDown = this.keyDown.bind(this);
    this.onKeyUp = this.keyUp.bind(this);
    document.addEventListener('keydown', this.onKeyDown, true);
    document.addEventListener('keyup', this.onKeyUp, true);
    if (this.state.page === 'signin') this.signT = setTimeout(() => this.signIn(), 14000);
    this.onMove = (e) => {
      const rail = document.querySelector('[data-side-rail]');
      let over = false;
      if (rail) {
        const b = rail.getBoundingClientRect();
        over = e.clientX >= b.left && e.clientX <= b.right && e.clientY >= b.top && e.clientY <= b.bottom;
      }
      if (!over) this.railLock = false;
      if (this.railLock) return;
      if (over !== this.state.railHover) this.setState({ railHover: over });
      if (over) {
        const item = e.target && e.target.closest ? e.target.closest('[data-fid][data-side]') : null;
        if (item && item !== document.activeElement) this.focusEl(item, true);
        else if (!item && !String(this.fid || '').indexOf('nav:')) { /* déjà dans la barre */ }
        else if (!item) {
          const cur2 = this.fids().filter(n => n.getAttribute('data-fid') === 'nav:' + this.navKey())[0];
          if (cur2) this.focusEl(cur2, true);
        }
      } else if (this.state.railHover || this.state.railOpen) {
        const nodes = this.fids();
        const back = (this.contentFid ? nodes.filter(n => n.getAttribute('data-fid') === this.contentFid)[0] : null) || nodes.filter(n => !n.getAttribute('data-side'))[0];
        if (back) this.focusEl(back, true);
        this.setState({ railHover: false, railOpen: false, focusFid: null });
      }
    };
    this.live = false;
    this.onLive = () => { this.live = true; };
    this.onDead = () => { this.live = false; };
    document.addEventListener('keydown', this.onLive, true);
    document.addEventListener('pointerdown', this.onLive, true);
    document.addEventListener('wheel', this.onLive, true);
    window.addEventListener('blur', this.onDead);
    document.addEventListener('mousemove', this.onMove);
    this.onWheel = (e) => {
      const s = this.state;
      if (s.page === 'gate' || s.page === 'signin') return;
      e.preventDefault();
      if (s.page === 'ambient') { this.nav = true; this.setState({ page: this.ambBack || 'home' }); return; }
      this.armIdle();
      const now = Date.now();
      const dx = e.deltaX, dy = e.deltaY;
      const axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      const d = axis === 'x' ? dx : dy;
      if (!d) return;
      if (axis !== this.wAxis || (this.wAcc || 0) * d < 0 || now - (this.wAt || 0) > 320) this.wAcc = 0;
      this.wAxis = axis;
      this.wAcc = (this.wAcc || 0) + d;
      if (Math.abs(this.wAcc) < 26 || now - (this.wAt || 0) < 90) return;
      const dir = axis === 'x' ? (this.wAcc > 0 ? 'right' : 'left') : (this.wAcc > 0 ? 'down' : 'up');
      this.wAcc = 0; this.wAt = now;
      if (s.page === 'player') { this.showCtrl(); return; }
      this.move(dir, false);
      const a = document.activeElement;
      if (!a || !a.getAttribute || !a.getAttribute('data-fid')) this.sync();
    };
    document.addEventListener('wheel', this.onWheel, { passive: false });
    this.fitT = () => this.fit();
    window.addEventListener('resize', this.fitT);
    const wrap = document.querySelector('[data-tvwrap]');
    if (window.ResizeObserver) {
      this.ro = new ResizeObserver(this.fitT);
      if (wrap) this.ro.observe(wrap);
    }
    /* Le cadre se met à l'échelle quand la coquille apparaît, pas au bout d'un
       délai : le catalogue met plus longtemps à charger à froid qu'à chaud, et
       [data-tvwrap] ne change pas de taille quand la racine se monte dedans —
       le ResizeObserver ne se redéclencherait jamais. */
    if (window.MutationObserver && wrap) {
      this.mo = new MutationObserver(() => {
        const root = this.R();

    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.fit());
    if (this.R() && this.ro) this.ro.observe(this.R());
    this.timer = setInterval(() => this.beat(), 1000);
    this.sync(true);
    this.armPreview();
    this.armIdle();
    this.noviceT = setTimeout(() => { if (this.state.novice) this.setState({ novice: false }); }, 30000);
  }
  componentWillUnmount() {
    document.removeEventListener('keydown', this.onKeyDown, true);
    document.removeEventListener('keyup', this.onKeyUp, true);
    document.removeEventListener('keydown', this.onLive, true);
    document.removeEventListener('pointerdown', this.onLive, true);
    document.removeEventListener('wheel', this.onLive, true);
    window.removeEventListener('blur', this.onDead);
    document.removeEventListener('mousemove', this.onMove);
    document.removeEventListener('wheel', this.onWheel);
    window.removeEventListener('resize', this.fitT);

    if (this.mo) this.mo.disconnect();
    clearInterval(this.timer); clearTimeout(this.prevT); clearTimeout(this.idleT); clearTimeout(this.hintT); clearTimeout(this.noviceT);
    clearTimeout(this.ctrlT); clearTimeout(this.leaveT); clearTimeout(this.infoT); clearTimeout(this.payT); clearTimeout(this.okT); clearTimeout(this.netT); clearTimeout(this.signT);
  }
  componentDidUpdate(prev) {
    const was = prev && prev.signedIn === true, now = this.props.signedIn === true;
    if (was !== now) {
      const p = this.state.page;
      if (now && p === 'signin') { this.stack = []; this.nav = true; this.setState({ page: 'gate', signinOk: false }); }
      else if (!now && (p === 'gate' || p === 'home')) { this.stack = []; this.mem = {}; this.nav = true; this.setState({ page: 'signin', signinOk: false, prof: null }); }
    }
    this.paintImgs(); this.sync(this.nav);
  }

  beat() {
    const s = this.state;
    if (s.page === 'player' && s.playing && !this.incident() && !s.ended) {
      const d = this.dur(this.cur());
      const np = s.pos + 1;
      if (np >= d) this.setState({ pos: d, playing: false, ended: true, ctrl: false });
      else this.setState({ pos: np });
    }
    if (s.page === 'ambient' && Date.now() - (this.ambAt || 0) > 7000) {
      this.ambAt = Date.now();
      this.setState({ ambIdx: (s.ambIdx + 1) % this.posterPool().length });
    }
  }
  armPreview() {
    clearTimeout(this.prevT);
    if (this.state.preview) this.setState({ preview: false });
    if (this.props.autoplayPreview === false) return;
    this.prevT = setTimeout(() => { if (this.state.page === 'home') this.setState({ preview: true }); }, 4000);
  }
  armIdle() {
    clearTimeout(this.idleT);
    this.idleT = setTimeout(() => {
      if (this.state.page !== 'player' && this.state.page !== 'ambient' && this.state.page !== 'gate') this.enterAmbient();
    }, 480000);
  }
  enterAmbient() { this.ambAt = Date.now(); this.memSave(); this.ambBack = this.state.page; this.nav = true; this.setState({ page: 'ambient' }); }

  paintImgs() {
    const root = this.R();
    if (!root) return;
    const list = root.querySelectorAll('img[data-img]');
    for (let i = 0; i < list.length; i++) {
      const el = list[i], v = el.getAttribute('data-img') || '';
      const want = (v.indexOf('{{') < 0 && v.length > 4) ? v : this.blank();
      if (el.getAttribute('src') !== want) el.setAttribute('src', want);
    }
  }
  fit() {
    const wrap = document.querySelector('[data-tvwrap]');
    const root = this.R();
    if (!wrap || !root) return;
    const kw = wrap.clientWidth / 1920, kh = wrap.clientHeight / 1080;
    const k = Math.min(kw > 0 ? kw : 1, kh > 0 ? kh : 1) || 1;
    this.scale = k;
    root.style.transform = k === 1 ? 'none' : 'scale(' + k + ')';
  }

        const list = hintsVisible ? hints : (this.lastHints || hints);
        if (!hintsVisible) return '0px';
        const w = list.reduce((acc, h) => acc + Math.max(42, 20 + String(h.key).length * 13) + 12 + String(h.label).length * 12.2 + 26, 0);
        return Math.round(w + 44 - 26) + 'px';
      })(),
      hintH: hintsVisible ? '58px' : '0px',
      hintTrans: (() => {
        const d = 650;
        const e = 'cubic-bezier(.86,0,.14,1)';
        return ['width ' + d + 'ms ' + e, 'height ' + d + 'ms ' + e, 'padding ' + d + 'ms ease', 'opacity ' + d + 'ms ease', 'transform ' + d + 'ms ' + e].join(', ');
      })(),
      safeOn: p.safeArea === true, netLost: s.netLost, quitHint: s.quitHint,
      previewOn: s.preview && page === 'home',
      hero: hero, fiche: fiche, art: art, liveHero: liveHero, schedule: schedule, head: head,
      tzNote: fr ? 'HEURES DANS VOTRE FUSEAU · EUROPE/PARIS' : 'TIMES IN YOUR ZONE · EUROPE/PARIS',
      nav: nav,
      accHoverBg: s.focusFid === 'nav:account' ? '#221F1B' : 'transparent',
      accCol: (s.focusFid === 'nav:account' || page === 'account') ? '#EDE7DC' : '#8B857C',
      accBar: s.focusFid === 'nav:account' ? '#EDE7DC' : (page === 'account' ? ACC : 'transparent'),
      goAccount: () => { this.closeRail(); this.go('account'); },
</script>
