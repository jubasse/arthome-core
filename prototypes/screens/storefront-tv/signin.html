<!-- ═══════════ signIn() — bascule à l'approbation (verbatim, L2322-2327) ═══════════ -->
<script type="text/x-dc-extract">
  signIn() {
    if (this.state.page !== 'signin' || this.state.signinOk) return;
    clearTimeout(this.signT);
    this.setState({ signinOk: true });
    setTimeout(() => { this.stack = []; this.nav = true; this.setState({ page: 'gate', signinOk: false }); }, 1100);
  }
</script>

<!-- ═══════════ qr() — tramage du QR (verbatim, L2350-2361) ═══════════ -->
<script type="text/x-dc-extract">
  qr(seed) {
    const N = 21, out = [];
    let h = 0; for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) % 99991;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const finder = (fx, fy) => (x >= fx && x < fx + 7 && y >= fy && y < fy + 7) ? ((x === fx || x === fx + 6 || y === fy || y === fy + 6) || (x >= fx + 2 && x <= fx + 4 && y >= fy + 2 && y <= fy + 4)) : null;
      let on = finder(0, 0); if (on === null) on = finder(14, 0); if (on === null) on = finder(0, 14);
      const quiet = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
      if (on === null) { on = quiet ? false : (((x * 7 + y * 13 + h + ((x * y) % 11)) % 5) < 2); }
      out.push({ i: y * N + x, o: on ? 1 : 0 });
    }
    return out;
  }
</script>
