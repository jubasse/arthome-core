<!-- ═══════════ Modèle de vue (verbatim, L2911-2922) ═══════════ -->
<script type="text/x-dc-extract">
    // ---- catégories, artistes, ma liste
    const visibleCats = this.kid() ? CATS.filter(c => KID_CATS.indexOf(c.id) > -1) : CATS;
    const catTiles = visibleCats.map(c => {
      const inCat = cat.filter(o => o.cat === c.id);
      const nLive = inCat.filter(o => this.st(o) === 'live').length;
      return {
        fid: 'cat:' + c.id, label: fr ? c.fr : c.en, img: U(PIC[CAT_PIC[c.id]], 1100),
        count: this.num(inCat.length) + ' ' + (inCat.length > 1 ? 'DATES' : 'DATE'),
        hasLive: nLive > 0, liveLabel: this.num(nLive) + ' ' + (fr ? 'EN DIRECT' : 'LIVE'),
        open: () => this.go('category', { cat: c.id })
      };
    });
</script>
