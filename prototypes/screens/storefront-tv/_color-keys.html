<script type="text/x-dc-extract">
  keyDown(e) {
    const k = e.key;
    const handled = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' ', 'Backspace', 'Escape', 'i', 'j', 'l', 'r', 'g', 'y', 'b'];
    if (handled.indexOf(k) < 0) return;
    e.preventDefault(); e.stopPropagation();
    this.armIdle();
    if (this.state.page === 'ambient') { this.setState({ page: this.ambBack || 'home' }); this.nav = true; return; }
    if (this.state.page === 'home' && this.state.preview) this.setState({ preview: false });
    const p = this.state.page;
    if (k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight') {
      if (p === 'player') { this.playerArrow(k, e.repeat); return; }
      this.move(k.slice(5).toLowerCase(), e.repeat);
      return;
    }
    if (k === 'Enter') {
      if (e.repeat) return;
      clearTimeout(this.okT);
      this.okLong = false;
      this.okT = setTimeout(() => { this.okLong = true; this.longOk(); }, 620);
      return;
    }
    if (k === ' ') { this.playPause(); return; }
    if (k === 'Backspace' || k === 'Escape') { this.back(); return; }
    if (k === 'i') {
      if (p === 'player') {
        if (this.state.panel === 'info') { this.closeInfo(); return; }
        clearTimeout(this.infoT);
        this.nav = true; this.setState({ panel: 'info', infoLeaving: false, ctrl: true }); this.showCtrl();
        return;
      }
      const on = !this.state.hintFull;
      clearTimeout(this.hintT);
      if (on) this.hintT = setTimeout(() => { if (this.state.hintFull) this.setState({ hintFull: false }); }, 60000);
      this.setState({ hintFull: on, novice: false });
      return;
    }
    if (k === 'j') { this.seek(-10, e.repeat); return; }
    if (k === 'l') { this.seek(10, e.repeat); return; }
    if (this.colorKeys()) {
      if (k === 'r' && p === 'player') { this.hideCtrl({ panel: null }); this.setState({ chat: !this.state.chat }); return; }
      if (k === 'g' && p === 'player') { this.setState({ subs: !this.state.subs, panel: 'subs', ctrl: true }); return; }
      if (k === 'y' && p === 'player') { this.setState({ panel: 'tracks', ctrl: true }); return; }
      if (k === 'b' && p === 'player') {
        if (this.state.panel === 'info') { this.closeInfo(); return; }
        clearTimeout(this.infoT);
        this.setState({ panel: 'info', infoLeaving: false, ctrl: true });
        return;
      }
      if (k === 'b' && p === 'title') { this.go('dateinfo', { pid: this.state.pid }); return; }
      if (k === 'b' && p === 'dateinfo') { this.back(); return; }
    }
  }
</script>
