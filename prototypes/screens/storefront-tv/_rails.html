  Consommé par : home, title, artist, live, category, replays
  Trois formes de carte : `card` (16/9), `poster` (2/3 vertical), `portrait` (rond).
  Contient aussi l'état de chargement (squelettes) et les rangées vides avec leur

  ⚠ EXTRACTION VERBATIM. Ne rien corriger dans ce fichier : l'original

<script type="text/x-dc-extract">
  // ---------- cards ----------
  card(o, ns) {
    const t = this.t(), st = this.st(o), out = this.outcome(o), owned = this.owns(o);
    const c = {
      fid: ns + ':' + o.id, id: o.id, img: this.img(o), poster: this.poster(o),
      title: this.title(o), ring: '#EDE7DC', playable: '', isLive: false, notLive: true,
      hasBadge: false, badge: '', badgeCol: '#C9C0B2', hasProg: false, progW: '0%',
      meta: this.catLabel(o.cat) + ' · ' + this.durLabel(o.dur),
      delay: '0ms',
      open: () => this.openShow(o)
    };
    if (st === 'live') {
      c.isLive = true; c.notLive = false; c.ring = LIVE;
      c.liveLabel = this.num(o.view);
      c.meta = this.catLabel(o.cat) + ' · ' + this.artistOf(o).name;
      if (owned) { c.playable = 'y'; c.open = () => this.openPlayer(o); }
      else c.badgeCol = GOLD;
    } else if (st === 'replay') {
      c.hasBadge = true; c.badgeCol = ACC; c.badge = t.expiresIn + ' ' + o.rep + ' ' + t.hours;
      c.meta = this.catLabel(o.cat) + ' · ' + this.artistOf(o).name;
      if (o.prog) { c.hasProg = true; c.progW = Math.round(o.prog * 100) + '%'; c.meta = this.durLabel(Math.round(o.dur * (1 - o.prog))) + ' ' + t.left; }
      c.playable = 'y'; c.open = () => this.openPlayer(o);
    } else if (st === 'soon') {
      c.meta = this.dayLabel(o.min) + ' · ' + this.clock(o.min) + ' · ' + this.artistOf(o).name;
      c.hasBadge = true;
      if (out === 'post') { c.badge = t.oPost; c.badgeCol = ACC; c.ring = ACC; }
      else if (o.seats === 0) { c.badge = t.kFull + (o.wait ? ' · ' + this.num(o.wait) : ''); c.badgeCol = '#9B948A'; }
      else if (o.seats < 30) { c.badge = t.kLast + ' · ' + o.seats; c.badgeCol = GOLD; c.ring = GOLD; }
      else if (owned) { c.badge = t.ownedSeat; c.badgeCol = GOLD; c.ring = GOLD; }
      else { c.badge = this.countdown(o.min); c.badgeCol = '#C9C0B2'; }
    } else {
      c.hasBadge = true; c.badge = out === 'cancel' ? t.oCancel : (out === 'stop' ? t.oStop : t.sEnded);
      c.badgeCol = out ? LIVE_INK : '#9B948A'; if (out) c.ring = LIVE;
      c.meta = this.dayLabel(o.min) + ' · ' + this.artistOf(o).name;
    }
    return c;
  }
  ticketCard(o, ns) {
    const t = this.t(), c = this.card(o, ns), st = this.st(o), out = this.outcome(o);
    if (out === 'post') { c.hasBadge = true; c.badge = t.oPost; c.badgeCol = ACC; c.ring = ACC; c.isLive = false; c.notLive = true; }
    else if (st === 'live') { c.hasBadge = false; c.playable = 'y'; c.open = () => this.openPlayer(o); }
    else if (st === 'soon' && o.min <= 30) { c.hasBadge = true; c.badge = t.kEnterOpen; c.badgeCol = OK; c.ring = OK; }
    else if (st === 'soon') { c.hasBadge = true; c.badge = this.countdown(o.min); c.badgeCol = GOLD; c.ring = GOLD; }
    return c;
  }
  artistCard(a, ns) {
    const t = this.t();
    const dates = this.catalogue().filter(o => o.ar === a.id && this.st(o) === 'soon').length;
    return {
      fid: ns + ':' + a.id, img: A(AVA[a.k]), title: a.name,
      meta: dates ? dates + ' ' + (dates > 1 ? t.datesUp : t.dateUp) : t.navReplaysUp,
      open: () => this.go('artist', { art: a.id })
    };
  }
  openShow(o) {
    if (this.st(o) === 'live' && this.owns(o)) return this.openPlayer(o);
    this.go('title', { pid: o.id });
  }
  openPlayer(o) {
    this.go('player', { pid: o.id, pos: o.prog ? Math.round(o.prog * o.dur * 60) : (this.st(o) === 'live' ? Math.round(-o.min * 60) : 0), playing: true, ctrl: true, panel: null, ended: false });
    clearTimeout(this.ctrlT);
    this.ctrlT = setTimeout(() => { if (this.state.page === 'player' && !this.state.panel) this.hideCtrl(); }, 2600);
  }
  toggleList(id) {
    const l = this.state.list;
    this.setState({ list: l.indexOf(id) > -1 ? l.filter(x => x !== id) : l.concat([id]) });
  }
  toggleFollow(id) {
    const f = this.follows();
    this.setState({ follows: f.indexOf(id) > -1 ? f.filter(x => x !== id) : f.concat([id]) });
  }
  diagNet() {
    clearTimeout(this.netT);
    this.setState({ netLost: true });
    this.netT = setTimeout(() => this.setState({ netLost: false }), 6000);
  }

</script>

<!-- ═══════════ Fabrique de rangées (verbatim, L2545-2660) ═══════════ -->
<script type="text/x-dc-extract">
  // ---------- rails ----------
  rail(key, label, items, kind, note, noteCol) {
    items.forEach((c, i) => { c.delay = Math.min(i, 7) * 34 + 'ms'; });
    return {
      key: key, label: label, count: items.length ? this.num(items.length) : '',
      note: note || '', noteCol: noteCol || '#857E73',
      items: items, isCard: kind === 'card' && items.length > 0,
      isPortrait: kind === 'portrait' && items.length > 0, isPoster: kind === 'poster' && items.length > 0,
      isEmpty: false, emptyText: '', emptyCta: '', emptyFid: key + ':empty', emptyGo: () => this.go('categories')
    };
  }
  emptyRail(key, label, text, cta, go) {
    const r = this.rail(key, label, [], 'card');
    r.isEmpty = true; r.emptyText = text; r.emptyCta = cta; r.emptyGo = go; r.count = '';
    return r;
  }
  homeRails() {
    const t = this.t(), cat = this.catalogue(), out = [];
    const resume = cat.filter(o => o.prog);
    if (resume.length) out.push(this.rail('resume', t.rResume, resume.map(o => this.card(o, 'resume')), 'card'));
    const live = cat.filter(o => this.st(o) === 'live');
    if (live.length) out.push(this.rail('onair', t.rOnAir, live.map(o => this.card(o, 'onair')), 'card', this.num(live.reduce((n, o) => n + o.view, 0)) + ' ' + t.viewersSuffix, LIVE_INK));
    else out.push(this.emptyRail('onair', t.rOnAir, t.nothingOnAirShort, t.seeTonight, () => this.go('live')));
    const mine = cat.filter(o => this.owns(o) && (this.st(o) === 'soon' || this.st(o) === 'live')).sort((a, b) => a.min - b.min);
    if (mine.length) out.push(this.rail('tickets', t.rTickets, mine.map(o => this.ticketCard(o, 'tickets')), 'card'));
    const tonight = cat.filter(o => this.st(o) === 'soon' && o.min < 1440).sort((a, b) => a.min - b.min);
    if (tonight.length) out.push(this.rail('tonight', t.rTonight, tonight.map(o => this.card(o, 'tonight')), 'card'));
    const f = this.follows();
    if (f.length) {
      const a = ARTISTS.filter(x => x.id === f[0])[0];
      const items = cat.filter(o => o.ar === a.id);
      if (items.length) out.push(this.rail('because', t.rBecause + ' ' + a.name, items.map(o => this.card(o, 'because')), 'card'));
    }
    const exp = cat.filter(o => this.st(o) === 'replay' && o.rep <= 48).sort((a, b) => a.rep - b.rep);
    if (exp.length) out.push(this.rail('expiring', t.rExpiring, exp.map(o => this.card(o, 'expiring')), 'card', '', ACC));
    out.push(this.rail('posters', t.rPosters, cat.slice(0, 7).map(o => this.card(o, 'posters')), 'poster'));
    const discs = this.kid() ? KID_CATS.slice(0, 3) : ['theatre', 'dance', 'comedy'];
    discs.forEach(d => {
      const items = cat.filter(o => o.cat === d);
      if (items.length) out.push(this.rail('d' + d, this.catLabel(d) + (' ' + t.onTheBill), items.map(o => this.card(o, 'd' + d)), 'card'));
    });
    out.push(this.rail('artists', t.rArtistsToFollow, ARTISTS.slice(0, 8).map(a => this.artistCard(a, 'hartists')), 'portrait'));
    return out;
  }
  pageRails() {
    const t = this.t(), s = this.state, p = s.page, cat = this.catalogue();
    if (p === 'home') return this.homeRails();
    if (p === 'title') {
      const o = this.cur(), out = [];
      const series = cat.filter(x => x.ar === o.ar && x.cat === o.cat && x.id !== o.id);
      if (series.length) out.push(this.rail('series', t.rSeries, series.map(x => this.card(x, 'series')), 'card'));
      const same = cat.filter(x => x.ar === o.ar && x.id !== o.id && series.indexOf(x) < 0);
      if (same.length) out.push(this.rail('same', t.rSame, same.map(x => this.card(x, 'same')), 'card'));
      const also = cat.filter(x => x.cat === o.cat && x.ar !== o.ar);
      if (also.length) out.push(this.rail('also', t.rSuggest, also.map(x => this.card(x, 'also')), 'card'));
      return out;
    }
    if (p === 'artist') {
      const a = ARTISTS.filter(x => x.id === s.art)[0], out = [];
      const up = cat.filter(o => o.ar === a.id && (this.st(o) === 'soon' || this.st(o) === 'live')).sort((x, y) => x.min - y.min);
      if (up.length) out.push(this.rail('adates', t.rArtistDates, up.map(o => this.card(o, 'adates')), 'card'));
      const rep = cat.filter(o => o.ar === a.id && this.st(o) === 'replay');
      if (rep.length) out.push(this.rail('areplays', t.rArtistReplays, rep.map(o => this.card(o, 'areplays')), 'card'));
      if (!up.length && !rep.length) out.push(this.emptyRail('anone', t.rArtistDates, t.artistNoDates, t.browseCategories, () => this.go('categories')));
      return out;
    }
    if (p === 'category') {
      const c = s.cat, out = [];
      const live = cat.filter(o => o.cat === c && this.st(o) === 'live');
      if (live.length) out.push(this.rail('clive', t.rCatLive, live.map(o => this.card(o, 'clive')), 'card', '', LIVE_INK));
      /* Les styles deviennent des rangées, pas un filtre : à la télécommande
         on descend pour découvrir, au lieu d'ouvrir un panneau puis de penser
         à le refermer. Les styles les mieux fournis d'abord, la traîne
         regroupée en fin de page pour ne pas empiler des rangées d'une carte. */
      const soon = cat.filter(o => o.cat === c && this.st(o) === 'soon').sort((a, b) => a.min - b.min);
      const byGenre = (GENRES[c] || [])
        .map(g => ({ id: g.id, items: soon.filter(o => o.gen === g.id) }))
        .filter(g => g.items.length)
        .map(g => Object.assign(g, { interest: this.genreInterest(g.items) }))
        .sort((x, y) => y.interest - x.interest || y.items.length - x.items.length);
      const strong = byGenre.filter(g => g.items.length >= 2).slice(0, 8);
      const rest = soon.filter(o => strong.every(g => g.id !== o.gen));
      if (strong.length > 1) {
        /* La taxonomie écrit les styles en minuscules, pour un usage en ligne
           dans une méta (« Pop · synth-pop »). En titre de rangée, la casse
           se règle ici, au point d'usage — jamais dans la taxonomie. */
        const asTitle = (x) => x ? x.charAt(0).toLocaleUpperCase(this.fr() ? 'fr-FR' : 'en-US') + x.slice(1) : x;
        strong.forEach(g => out.push(this.rail('cg:' + g.id, asTitle(this.genLabel(c, g.id)),
          g.items.map(o => this.card(o, 'cg:' + g.id)), 'card')));
        if (rest.length) out.push(this.rail('cgrest', t.rOtherStyles,
          rest.map(o => this.card(o, 'cgrest')), 'card'));
      } else if (soon.length) {
        /* Une discipline sans styles distincts garde sa rangée unique : la
           découper en une seule catégorie n'apprendrait rien. */
        out.push(this.rail('csoon', t.rCatSoon, soon.map(o => this.card(o, 'csoon')), 'card'));
      }
      const rep = cat.filter(o => o.cat === c && this.st(o) === 'replay');
      if (rep.length) out.push(this.rail('crep', t.rCatReplays, rep.map(o => this.card(o, 'crep')), 'card', '', ACC));
      const arts = ARTISTS.filter(a => cat.some(o => o.cat === c && o.ar === a.id));
      if (arts.length) out.push(this.rail('carts', t.rCatArtists, arts.map(a => this.artistCard(a, 'carts')), 'portrait'));
      if (!live.length && !soon.length && !rep.length) out.push(this.emptyRail('cnone', this.catLabel(c), t.catNoDates, t.seeAllCats, () => this.go('categories')));
      return out;
    }
    if (p === 'replays') {
      const rep = cat.filter(o => this.st(o) === 'replay');
      const soon = rep.filter(o => o.rep <= 48), rest = rep.filter(o => o.rep > 48);
      const out = [];
      if (soon.length) out.push(this.rail('rsoon', t.rExpiring, soon.map(o => this.card(o, 'rsoon')), 'card', '', ACC));
      if (rest.length) out.push(this.rail('rall', t.rAllReplays, rest.map(o => this.card(o, 'rall')), 'card'));
      out.push(this.rail('rposters', t.rPosters, rep.concat(cat.filter(o => this.st(o) === 'soon')).slice(0, 6).map(o => this.card(o, 'rposters')), 'poster'));
      if (!rep.length) return [this.emptyRail('rnone', t.nReplays, t.noReplay, t.browse, () => this.go('categories'))];
      return out;
    }
    return [];
  }

</script>
