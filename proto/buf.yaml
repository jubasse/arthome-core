version: v2
modules:
  - path: .
lint:
  use:
    - DEFAULT
breaking:
  use:
    - FILE
  # Les contextes « provisoires » ne bloquent pas encore sur la compatibilité :
  # leur palier n'est pas arrivé et aucun consommateur n'existe.
  # Voir architecture/events.md §5.1. Une ligne se retire quand son palier est livré.
  ignore:
    - arthome/streaming/v1
    - arthome/chat/v1
    - arthome/payouts/v1
    - arthome/notifications/v1
