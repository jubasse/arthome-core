version: v2
modules:
  - path: .
lint:
  use:
    - DEFAULT
breaking:
  use:
    - FILE
  # The "provisional" contexts do not yet block on compatibility: their
  # milestone has not arrived and no consumer exists.
  # See architecture/events.md §5.1. A line is removed when its milestone ships.
  ignore:
    - arthome/streaming/v1
    - arthome/chat/v1
    - arthome/payouts/v1
    - arthome/notifications/v1
