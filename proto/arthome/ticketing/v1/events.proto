// Events of the `ticketing` context — what the viewer buys, and what that
// purchase opens.
//
// This context absorbs the two orphans C7 (subscriptions) and C8 (shop).
// Its language is not "tickets": it is THE VIEWER'S COMMERCE.
// Reason: same Stripe customer, same order envelope, same payout flow, same
// refund policy — and `plan.opens[]` conditions the right to watch, which this
// context already serves.
//
// Kafka topics:
//   arthome.ticketing.date_sales    key date_id     12 partitions
//   arthome.ticketing.order         key order_id
//   arthome.ticketing.subscription  key account_id
//
// Maturity: STABLE (milestone 3).
syntax = "proto3";

package arthome.ticketing.v1;

import "arthome/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Closed vocabulary settled by `shared`: `enums.priceTier`.
enum PriceTier {
  PRICE_TIER_UNSPECIFIED = 0;
  PRICE_TIER_FULL = 1;
  PRICE_TIER_REDUCED = 2;
  PRICE_TIER_SUPPORT = 3;
}

// D-011: two DISTINCT orders, never a mixed one.
// They have neither the same guarantees (a seat has a capacity, a code, a
// cancellation window), nor the same shipping provider, nor the same payout
// recipient — and no mockup shows a mixed order.
enum OrderKind {
  ORDER_KIND_UNSPECIFIED = 0;
  ORDER_KIND_SEAT = 1;
  ORDER_KIND_MERCH = 2;
  ORDER_KIND_SUBSCRIPTION = 3;
}

// The `plans[]` vocabulary of `catalogue.json` has authority.
// E1 is the gravest divergence in the file: FOUR disjoint vocabularies coexist,
// `helpers.planOf()` falls ALL accounts back to `free`, and `plan.opens[]`
// conditions access to playback. That is an AUTHORISATION defect, not a display
// one. `monthly`, `season` and `none` are dropped: no data references them. A
// one-off seat is not a subscription, it is a way of buying: it does not belong
// in this vocabulary.
enum PlanTier {
  PLAN_TIER_UNSPECIFIED = 0;
  PLAN_TIER_FREE = 1;
  PLAN_TIER_PASS = 2;
  PLAN_TIER_PREMIUM = 3;
}

// The nine openings actually carried by `catalogue.json`.
// `multi_screen` is not a marketing line: it is an execution constraint, which
// forces a server-side count held by `streaming`.
enum PlanOpening {
  PLAN_OPENING_UNSPECIFIED = 0;
  PLAN_OPENING_BROWSE = 1;
  PLAN_OPENING_TRAILERS = 2;
  PLAN_OPENING_FREE_DATES = 3;
  PLAN_OPENING_REPLAYS = 4;
  PLAN_OPENING_NO_ADS = 5;
  PLAN_OPENING_ONE_LIVE_MONTH = 6;
  PLAN_OPENING_ALL_LIVES = 7;
  PLAN_OPENING_MULTI_SCREEN = 8;
  PLAN_OPENING_ARCHIVE = 9;
}

enum SubscriptionState {
  SUBSCRIPTION_STATE_UNSPECIFIED = 0;
  SUBSCRIPTION_STATE_ACTIVE = 1;
  SUBSCRIPTION_STATE_PAST_DUE = 2;
  SUBSCRIPTION_STATE_CANCELLED = 3;
  SUBSCRIPTION_STATE_TRIALING = 4;
}

// Five reasons found in the design, with distinct rules.
// LATE_RATE is PRO RATA of the time remaining: the price depends on the instant
// of reading, so it travels with its validity and is never a frozen string.
enum PromotionReason {
  PROMOTION_REASON_UNSPECIFIED = 0;
  PROMOTION_REASON_PRE_SALE = 1;
  PROMOTION_REASON_PREVIEW_NIGHT = 2;
  PROMOTION_REASON_DISCOVERY_RATE = 3;
  PROMOTION_REASON_FINAL_DATE = 4;
  PROMOTION_REASON_LATE_RATE = 5;
}

enum SeatCancelReason {
  SEAT_CANCEL_REASON_UNSPECIFIED = 0;
  SEAT_CANCEL_REASON_VIEWER_REQUEST = 1;
  SEAT_CANCEL_REASON_DATE_CANCELLED = 2;
  SEAT_CANCEL_REASON_ACCOUNT_DELETION = 3;
  SEAT_CANCEL_REASON_PAYMENT_FAILED = 4;
}

// The credit note is an INTERNAL CURRENCY, therefore a liability, therefore an
// aggregate. It appears in the storefront copy and nowhere else in the file:
// without this type, it would not exist in the contract.
enum CreditOrigin {
  CREDIT_ORIGIN_UNSPECIFIED = 0;
  CREDIT_ORIGIN_INTERRUPTED_DATE = 1;
  CREDIT_ORIGIN_GOODWILL = 2;
}

// ---------------------------------------------------------- tax
//
// THIS BLOCK IS THE ONLY IRREVERSIBLE PART OF THE WHOLE TAX CHAPTER.
// The model — who is liable, on what base — is a COMPUTATION: it can be redone.
// The buyer's location and the rate applied at the sale are DATED FACTS: if
// they are not captured at the instant of the sale, they exist nowhere, and
// reconstructing them is not expensive — it is IMPOSSIBLE. See
// adr-payments.md §5.0.

// Where a piece of location evidence comes from. The EU requires TWO
// NON-CONTRADICTORY pieces for a B2C sale — and Stripe Tax favours a single
// address instead of comparing them, so the evidence rule cannot be delegated
// to it: our own register carries it.
enum TaxEvidenceKind {
  TAX_EVIDENCE_KIND_UNSPECIFIED = 0;
  TAX_EVIDENCE_KIND_BILLING_ADDRESS = 1;
  TAX_EVIDENCE_KIND_IP_ADDRESS = 2;
  TAX_EVIDENCE_KIND_BANK_COUNTRY = 3;
  TAX_EVIDENCE_KIND_CARD_COUNTRY = 4;
  TAX_EVIDENCE_KIND_SIM_COUNTRY = 5;
  TAX_EVIDENCE_KIND_DECLARED_BY_BUYER = 6;
}

enum TaxJurisdictionLevel {
  TAX_JURISDICTION_LEVEL_UNSPECIFIED = 0;
  TAX_JURISDICTION_LEVEL_COUNTRY = 1;
  TAX_JURISDICTION_LEVEL_STATE = 2;
  TAX_JURISDICTION_LEVEL_COUNTY = 3;
  TAX_JURISDICTION_LEVEL_CITY = 4;
}

// The rate depends on the pair JURISDICTION x NATURE OF THE SUPPLY, never on a
// per-market constant. The Derby Quad v HMRC decision held that the
// theatre-ticket exemption DOES NOT EXTEND to a streamed live show: a
// performance ticket and live access to it are not the same supply.
enum TaxSupplyKind {
  TAX_SUPPLY_KIND_UNSPECIFIED = 0;
  TAX_SUPPLY_KIND_LIVE_STREAM_ACCESS = 1;
  TAX_SUPPLY_KIND_REPLAY_ACCESS = 2;
  TAX_SUPPLY_KIND_SUBSCRIPTION = 3;
  TAX_SUPPLY_KIND_MERCHANDISE = 4;
}

message TaxEvidence {
  TaxEvidenceKind kind = 1;
  // ISO 3166-1 alpha-2, as THIS piece indicates it — not the result.
  string country = 2;
  // ISO 3166-2 when the piece carries it.
  string subdivision = 3;
  // Where it came from, for audit: "stripe.payment_method", "edge.geoip",
  // "account.billing_address". Evidence with no provenance is not evidence.
  string source = 4;
  google.protobuf.Timestamp collected_at = 5;
}

// The BUYER's tax location, carried by the order.
// NOT a market identifier, NOT a plain country:
//   - in the United States, roughly 9,000 jurisdictions (state, county, city) —
//     a country allows NO computation at all, and the postal code is essential;
//   - in the EU, the evidence is twofold and must be kept.
//
// NOT TO BE CONFUSED with Connect's KYB/KYC, which is about the ARTIST
// (identity and business verification of the connected account) and has nothing
// to do with the VIEWER's location. The two are often confused.
message BuyerTaxLocation {
  string country = 1;
  // ISO 3166-2: US state, Canadian province, German Land.
  string subdivision = 2;
  // Essential to the US computation, where the rate changes from street to street.
  string postal_code = 3;
  string city = 4;

  // AT LEAST TWO for a B2C sale in the EU, non-contradictory.
  repeated TaxEvidence evidence = 5;
  // True when two pieces contradict each other: the sale goes through, the line
  // goes to review. Hiding the conflict would produce a false and silent
  // declaration.
  bool evidence_conflicting = 6;
  google.protobuf.Timestamp resolved_at = 7;
}

// One VAT line, per JURISDICTION — and not per billing market.
// The SHAPE is safe and will not move, whatever tax model is adopted: a
// single-rate model produces a one-line breakdown. The model itself is NOT
// settled — see adr-payments.md §5. `studio-web` found that the payouts mockup
// breaks down "by country of purchase" while the fixture applies a single rate
// to the gross: two incompatible statements, neither examined (D5).
message VatLine {
  // `market_id` removed: a billing market is a PRICING notion (which currency we
  // sell in), never a TAX notion. Number reserved — a field number is never
  // reused.
  reserved 1;
  reserved "market_id";

  // Rate in basis points: 550 = 5.5%. An integer, never a float: a
  // floating-point rate ends up producing a cent of drift.
  // It is the RATE APPLIED AT THE MOMENT OF THE SALE, kept on the line — not the
  // current rate. An invoice is kept for ten years; rates change.
  uint32 rate_bps = 2;
  arthome.common.v1.Money base = 3;
  arthome.common.v1.Money amount = 4;

  // "FR" · "US-CA-94103" · "CH-ZH". Precise enough to replay the computation.
  string jurisdiction_code = 5;
  TaxJurisdictionLevel jurisdiction_level = 6;
  // The rate depends on the jurisdiction x nature pair — see TaxSupplyKind.
  TaxSupplyKind supply_kind = 7;
}

message PriceTierAmount {
  PriceTier tier = 1;
  arthome.common.v1.Money amount = 2;
  bool active = 3;
}

message Promotion {
  PromotionReason reason = 1;
  arthome.common.v1.Money struck_price = 2;
  arthome.common.v1.Money current_price = 3;
  google.protobuf.Timestamp valid_from = 4;
  google.protobuf.Timestamp valid_until = 5;
}

// ------------------------------------------------------- capacity and prices

// THE most-consumed fact in the system: it feeds `catalog`'s public card, the
// search index, the studio agenda and `notifications`'s "almost full"
// threshold.
message DateSalesAvailabilityChanged {
  string date_id = 1;
  string channel_id = 2;
  uint32 seats_available = 3;
  uint32 waitlist_count = 4;
  // The fill RATE, not the capacity. The surface needs the rate; serving the
  // capacity and letting it be computed recreates the composed-in-two-places
  // value the project forbids — and the mockup proves it, by applying a constant
  // of 2,000 seats independent of the venue.
  uint32 fill_rate_bps = 5;
  // The headline price, promotion applied. Absent if no tier is active.
  arthome.common.v1.Money lowest_price = 6;
  bool sold_out = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

message DateSalesPricingChanged {
  string date_id = 1;
  string channel_id = 2;
  repeated PriceTierAmount tiers = 3;
  repeated Promotion promotions = 4;
  // True as soon as `catalog.publication.engaged` has been consumed: `ticketing`
  // applies ITS OWN lock, it asks `catalog` for nothing.
  bool prices_locked = 5;
  google.protobuf.Timestamp occurred_at = 6;
  arthome.common.v1.Actor changed_by = 7;
}

// Capacity widens BY TIERS and never shrinks after going on sale.
// Opening a tier notifies the waiting list IN THE SAME ACT, with a priority
// window: two calls would let the scarcity dissipate between them.
message DateSalesCapacitySet {
  string date_id = 1;
  string channel_id = 2;
  uint32 capacity_total = 3;
  // True beyond the technical provisioning threshold (10,000 concurrent
  // viewers): the infrastructure is provisioned in advance and a forecast far
  // above the real figure exposes you to a penalty. Threshold, provisioning,
  // revision deadline (72 h) and exposure are CONTRACT DATA, not constants copied
  // onto five surfaces.
  bool technical_provision_required = 4;
  google.protobuf.Timestamp provision_revisable_until = 5;
  google.protobuf.Timestamp occurred_at = 6;
  arthome.common.v1.Actor set_by = 7;
}

// ---------------------------------------------------------------- seat

message SeatActivated {
  string seat_id = 1;
  string order_id = 2;
  string date_id = 3;
  string account_id = 4;
  // The profile that bought, when the purchase comes from a shared television.
  string profile_id = 5;
  PriceTier tier = 6;
  // ISSUED BY THE SERVER. It appears identically on the web, on mobile and on
  // TV: the mockup computes it by hashing, which would give THREE different codes
  // for the same seat as soon as one surface changed function.
  string seat_code = 7;
  // The cancellation deadline, as an INSTANT. "Up to 1 h before the start" is a
  // domain rule, not a screen note.
  google.protobuf.Timestamp cancel_deadline = 8;
  google.protobuf.Timestamp occurred_at = 9;
}

message SeatCancelled {
  string seat_id = 1;
  string date_id = 2;
  string account_id = 3;
  SeatCancelReason reason = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

// ---------------------------------------------------------------- order

// The raw material of the right to a payout. `payouts` consumes only this and
// the refunds: it never rebuilds Stripe's ledger.
message OrderPaid {
  string order_id = 1;
  OrderKind kind = 2;
  // ONE merchandise order is SINGLE-SELLER: a basket spanning two channels
  // splits into two orders at payment. Business reason (two shipments, two
  // commissions) and technical reason (the Stripe model adopted allows only one
  // destination per payment).
  string channel_id = 3;
  // Present for ORDER_KIND_SEAT.
  string date_id = 4;
  string account_id = 5;

  arthome.common.v1.Money gross_ttc = 6;
  // Breakdown by jurisdiction. See VatLine.
  repeated VatLine vat = 7;
  arthome.common.v1.Money service_fee = 8;
  // Discount applied: subscription OR promotion, never both — the rule keeps the
  // one most favourable to the viewer, and it lives in @arthome/core.
  arthome.common.v1.Money discount = 9;
  // The share funded by an account credit rather than by Stripe. The artist's
  // payout does not depend on it: the platform funds that share out of its own
  // money (adr-payments.md §6).
  arthome.common.v1.Money credit_applied = 10;

  // The Stripe reference. We never rebuild its ledger: we RECONCILE ours with
  // it, and a period does not close with an unexplained gap.
  string payment_intent_ref = 11;
  google.protobuf.Timestamp paid_at = 12;

  // The tax location adopted, WITH ITS EVIDENCE. Three reasons not to rely on
  // Stripe's `Customer`: the invoice is kept for TEN YEARS and the Stripe object
  // only lives as long as we stay with Stripe; we need the HISTORICAL rate and
  // not the current one; and the retention obligation covers six items — date,
  // location evidence, nature of the product, applicable rate, VAT amount, total.
  // Our own register carries them.
  BuyerTaxLocation buyer_tax_location = 13;
}

message OrderRefunded {
  string order_id = 1;
  string channel_id = 2;
  arthome.common.v1.Money amount = 3;
  SeatCancelReason reason = 4;
  string refund_ref = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message CreditIssued {
  string credit_id = 1;
  string account_id = 2;
  // Recommended scope: the same channel. A credit usable elsewhere would force
  // the platform to fund another artist's share out of its own money. The
  // restriction is reversible; ignoring it is not.
  string channel_id = 3;
  arthome.common.v1.Money amount = 4;
  CreditOrigin origin = 5;
  string origin_date_id = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

// ---------------------------------------------------------------- subscription

// Consumed by `streaming` for its `entitlement_projection` — the one
// duplication of a `ticketing` datum I accept, because `streaming` is the only
// one that can decide an entitlement and the only one that issues a token.
message SubscriptionChanged {
  string account_id = 1;
  PlanTier plan = 2;
  SubscriptionState state = 3;
  repeated PlanOpening opens = 4;
  // Discount on SEATS, in basis points: 1000 = 10%.
  // Not to be confused with the 15% shop discount: two discounts, two bases, and
  // neither the rate nor the base coincides across the sources (E1).
  uint32 seat_discount_bps = 5;
  // Concurrent-screen ceiling, derived from PLAN_OPENING_MULTI_SCREEN.
  // `ticketing` publishes the ceiling; `streaming` enforces it.
  uint32 concurrent_streams_allowed = 6;
  google.protobuf.Timestamp current_period_end = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

// Opening a tier notifies the waiting list in the same act, with a priority
// window (2 h) before the public opening.
message WaitlistNotified {
  string date_id = 1;
  repeated string account_ids = 2;
  google.protobuf.Timestamp priority_until = 3;
  google.protobuf.Timestamp occurred_at = 4;
}
