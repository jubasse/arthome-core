// Events of the `streaming` context — the run, and the right to watch now.
//
// Kafka topic:
//   arthome.streaming.run   key date_id   12 partitions
//
// Maturity: PROVISIONAL (milestone 5). The media provider has not been chosen,
// and the capabilities declared — segment signing, DRM, renditions — will
// change the shape of the playback token. Freezing now means freezing against
// MediaMTX. `buf breaking` is ignored on this directory (see buf.yaml).
syntax = "proto3";

package arthome.streaming.v1;

import "arthome/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// The TECHNICAL axis, and nothing else.
// `postponed` and `cancelled` are REMOVED from this axis: they were echoes of
// `catalog.DateOutcome` lodged in the technical state — the same fault as
// `reported` in the sanctions field. A run desk has no "cancelled" state: it
// has a stage sending nothing (E4).
enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_IDLE = 1;
  RUN_STATE_REHEARSAL = 2;
  RUN_STATE_ON_AIR = 3;
  RUN_STATE_INTERRUPTED = 4;
  RUN_STATE_ENDED = 5;
}

// The ingest protocol DECIDES which metrics are actually available.
// `streaming.md` is categorical: jitter and lost packets exist only on WebRTC
// ingest; over RTMP, carried on TCP, they have no meaning.
enum IngestProtocol {
  INGEST_PROTOCOL_UNSPECIFIED = 0;
  INGEST_PROTOCOL_RTMPS = 1;
  INGEST_PROTOCOL_SRT = 2;
  INGEST_PROTOCOL_WHIP = 3;
}

// The monitor return path ACTUALLY open. The studio must KNOW it so as not to
// promise the operator a latency they do not have: WHEP under a second on WHIP
// ingest, LL-HLS at a few seconds on RTMP ingest.
// `streaming.md` refuses to create a media branch just to make a schema
// uniform: so the contract carries the truth, not uniformity.
enum MonitorPath {
  MONITOR_PATH_UNSPECIFIED = 0;
  MONITOR_PATH_WHEP = 1;
  MONITOR_PATH_LL_HLS = 2;
}

// The OUTCOME the viewer sees. Four values, those of
// `catalogue.incidentMessages`.
enum IncidentKind {
  INCIDENT_KIND_UNSPECIFIED = 0;
  INCIDENT_KIND_HOLD_SCREEN = 1;
  INCIDENT_KIND_POSTPONED = 2;
  INCIDENT_KIND_CANCELLED = 3;
  INCIDENT_KIND_INTERRUPTED = 4;
}

// The CAUSE, a NEW vocabulary distinct from the outcome.
// `catalogue.incidentMessages` knows only four entries, which are outcomes. The
// mobile run desk tells three more apart that exist in no vocabulary: feed lost
// at the venue, run desk disconnected, bitrate collapsed. `streaming.md` names
// a fourth, COMPATIBILITY_WORKER_FAILED: an FFmpeg worker must never die in
// silence, or the run desk sees a player that never starts with no cause.
enum IncidentCause {
  INCIDENT_CAUSE_UNSPECIFIED = 0;
  INCIDENT_CAUSE_VENUE_FEED_LOST = 1;
  INCIDENT_CAUSE_RUN_DESK_DISCONNECTED = 2;
  INCIDENT_CAUSE_BITRATE_COLLAPSED = 3;
  INCIDENT_CAUSE_COMPATIBILITY_WORKER_FAILED = 4;
  INCIDENT_CAUSE_PROVIDER_ERROR = 5;
  INCIDENT_CAUSE_MANUAL = 6;
}

// The AUTOMATIC standby screen — channel rule "if the feed is lost for more
// than 15 s" — produces an incident of the SAME NATURE as a manual trigger.
// That is the right answer to the "the run-desk operator is unreachable" case,
// and it is a server rule, not an application behaviour. The journal must
// nevertheless tell the two apart.
enum IncidentTrigger {
  INCIDENT_TRIGGER_UNSPECIFIED = 0;
  INCIDENT_TRIGGER_MANUAL = 1;
  INCIDENT_TRIGGER_AUTO = 2;
}

// ---------------------------------------------------------------- run

// Unlocks the publication checklist: `technical_check_passed` is one of the
// seven items, and it comes from here. `catalog` projects it, it does not ask
// for it.
message TechnicalCheckPassed {
  string date_id = 1;
  string channel_id = 2;
  IngestProtocol protocol = 3;
  google.protobuf.Timestamp passed_at = 4;
  arthome.common.v1.Actor checked_by = 5;
}

// Consumed by `catalog`, which moves the publication from `technical` to
// `live`. The "go on air" command goes to `streaming`, not to `catalog`: only
// `streaming` knows whether the feed is coming in. So two of the publication
// state machine's eight transitions are CAUSED by an event, which keeps
// `Publication` the aggregate of a single context.
message RunStarted {
  string date_id = 1;
  string channel_id = 2;
  IngestProtocol protocol = 3;
  MonitorPath monitor_path = 4;
  google.protobuf.Timestamp started_at = 5;
  arthome.common.v1.Actor started_by = 6;
}

message RunEnded {
  string date_id = 1;
  string channel_id = 2;
  google.protobuf.Timestamp ended_at = 3;
  uint32 duration_sec = 4;
  uint32 peak_viewers = 5;
  google.protobuf.Timestamp peak_at = 6;
  uint32 avg_viewers = 7;
  // The payout due date (14 days) runs from THE END OF THE LIVE SHOW, not from
  // the payment: so `payouts` consumes this event.
  google.protobuf.Timestamp occurred_at = 8;
}

message RunStateChanged {
  string date_id = 1;
  RunState state = 2;
  // Filled in only for RUN_STATE_INTERRUPTED.
  IncidentCause cause = 3;
  // True when the state is the one AFTER the grace period has absorbed the
  // glitch. A two-second network drop at the venue must produce neither an
  // incident on the run desk nor an HLS manifest restarted from zero: the studio
  // tells "glitch absorbed" apart from "publisher gone", and those are two
  // fields, not one.
  bool after_grace_period = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

// ---------------------------------------------------------------- incident

// The standby screen is a CLIENT-SIDE VEIL, never a feed switch: the control
// plane publishes the state, the player shows it over an intact video.
// Instant, identical on web, mobile and TV, and the media stays intact for the
// resume. Switching the upstream feed at a managed provider is slow and
// expensive.
message IncidentRaised {
  string incident_id = 1;
  string date_id = 2;
  string channel_id = 3;
  IncidentKind kind = 4;
  IncidentCause cause = 5;
  IncidentTrigger trigger = 6;
  // The message written by the run desk travels WITH the state, in the language
  // it was written in. It is content, not an i18n key: the catalogue supplies
  // templates per incident nature, which the run desk keeps or replaces.
  arthome.common.v1.LocalizedText message = 7;
  google.protobuf.Timestamp raised_at = 8;
  arthome.common.v1.Actor raised_by = 9;
}

// When the incident resolves, the state changes and the player REMOVES the
// veil. The client must not have to ask for a playback token again, or the
// resume costs a stream reload.
message IncidentResolved {
  string incident_id = 1;
  string date_id = 2;
  google.protobuf.Timestamp resolved_at = 3;
  arthome.common.v1.Actor resolved_by = 4;
}

// ---------------------------------------------------------------- replay

// The POLICY belongs to `catalog` (the promise), PUTTING IT ON SALE to
// `ticketing` (the price), the FILE and its EXPIRY to `streaming`.
// `expires_at` is derived from the end of the run and from `replay_window_hours`
// served by `catalog`: it is @arthome/core that decides the duration, otherwise
// the replay policy would end up encoded in a storage lifecycle, out of reach
// of the tests.
message ReplayAssetReady {
  string date_id = 1;
  string channel_id = 2;
  uint32 duration_sec = 3;
  google.protobuf.Timestamp available_from = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

message ReplayExpired {
  string date_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
}

// ---------------------------------------------------------------- chapters

// Posted from the run desk, carried into the replay. They carry their POSITION
// IN THE MEDIA: free now, unrecoverable later.
message ChapterPosted {
  string chapter_id = 1;
  string date_id = 2;
  // Identifier from the chapter vocabulary, never a written label.
  string chapter_vocab_id = 3;
  int32 at_media_sec = 4;
  google.protobuf.Timestamp occurred_at = 5;
  arthome.common.v1.Actor posted_by = 6;
}

message ChapterRemoved {
  string chapter_id = 1;
  string date_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// ---------------------------------------------------------------- audience

// ONCE PER MINUTE, not per second. The per-second counter travels over Redis
// (Socket.IO broadcast); only the per-minute aggregate enters the durable log.
// One sample per second per live show in Kafka is waste, and this is
// `streaming.md`'s Kafka/Redis boundary.
//
// The counter is ABSENT — never zero — when the date is not on air: the file's
// rule forbids "0 LIVE", and a zero reads as "nobody", not "not measured".
message ViewerCountSampled {
  string date_id = 1;
  // Start of the sampled minute, UTC.
  google.protobuf.Timestamp minute = 2;
  uint32 viewers = 3;
}
