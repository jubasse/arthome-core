// Events of the `identity` context — the person, the device, and the right to act.
//
// Kafka topics:
//   arthome.identity.account   key account_id
//   arthome.identity.device    key device_id
//   arthome.identity.channel   key channel_id
//
// Maturity: STABLE (milestone 2). `buf breaking` blocks any break.
syntax = "proto3";

package arthome.identity.v1;

import "arthome/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// The EIGHT canonical roles from `catalogue.json`.
// `studio-data.js`'s fold onto six personas is a presentation LABEL and appears
// in no payload: it crushes `director`, `video` and `sound` into a single "run
// desk", while `grants` tells them apart — `director` may invite `video` and
// `sound`, the other two may invite nobody. Authorising on the short role would
// grant an invitation right that does not exist (E6).
enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_ARTIST = 1;
  MEMBER_ROLE_PRODUCTION = 2;
  MEMBER_ROLE_COORDINATION = 3;
  MEMBER_ROLE_DIRECTOR = 4;
  MEMBER_ROLE_VIDEO = 5;
  MEMBER_ROLE_SOUND = 6;
  MEMBER_ROLE_MODERATION = 7;
  MEMBER_ROLE_TREASURY = 8;
}

// The post held on ONE date, as opposed to the role held in the channel.
// Two scales, two lifecycles: confusing them would turn revoking a stand-in
// into exclusion from the channel.
enum CrewRole {
  CREW_ROLE_UNSPECIFIED = 0;
  CREW_ROLE_DIRECTOR = 1;
  CREW_ROLE_VIDEO = 2;
  CREW_ROLE_SOUND = 3;
  CREW_ROLE_MODERATION = 4;
}

enum MembershipAction {
  MEMBERSHIP_ACTION_UNSPECIFIED = 0;
  MEMBERSHIP_ACTION_JOINED = 1;
  MEMBERSHIP_ACTION_ROLES_CHANGED = 2;
  MEMBERSHIP_ACTION_REMOVED = 3;
}

// A device IS a session (context-map §7.1). `catalogue.json` declares `devices`
// as an integer and `fixtures.js` as a list of objects: two shapes under one
// name (E13). The contract settles on the second.
enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_TV = 1;
  DEVICE_KIND_MOBILE = 2;
  DEVICE_KIND_TABLET = 3;
  DEVICE_KIND_DESKTOP = 4;
  DEVICE_KIND_STICK = 5;
  DEVICE_KIND_CONSOLE = 6;
  DEVICE_KIND_BOX = 7;
}

// ---------------------------------------------------------------- account

message AccountRegistered {
  string account_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string locale = 3;
  // ISO 3166-1 alpha-2, as resolved at sign-up. Used for territorial rights and
  // for the billing market; it is re-evaluated at every read.
  string country = 4;
}

// Entry point of the erasure saga. Deleting an account is a FINANCIAL command
// as much as a personal one: "deletion cancels unused seats", which triggers
// refunds, touches payouts already computed, and runs into the ten-year
// accounting retention. So it can be neither synchronous nor total
// (data-model.md §7.5).
message AccountDeletionRequested {
  string account_id = 1;
  google.protobuf.Timestamp requested_at = 2;
  // End of the grace period: the account is reactivable by simply signing in
  // until then. That is what makes the irreversible acceptable.
  google.protobuf.Timestamp grace_until = 3;
}

// End of the saga. Invoices keep their frozen content (a document is the one
// assumed exception to "never a formatted string transported"); chat messages
// are dissociated from the person, not deleted, while their 24-month retention
// runs.
message AccountAnonymised {
  string account_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
}

// ---------------------------------------------------------------- device

// Consumed by `streaming`, which invalidates this device's PLAYBACK LEASES.
// That is what makes "disconnect this device" actually stop playback on the
// television concerned, and not merely remove a row from a list.
// Visible at the next token renewal, so within 60 s at most.
message DeviceRevoked {
  string device_id = 1;
  string account_id = 2;
  DeviceKind kind = 3;
  google.protobuf.Timestamp occurred_at = 4;
  arthome.common.v1.Actor revoked_by = 5;
}

// Disconnecting ONE PROFILE from a shared device. This event WAS MISSING, and
// its absence emptied the Device / DeviceSession distinction of meaning:
// `DeviceRevoked` carries only `device_id`, so `streaming` had NO WAY to learn
// that a profile had been disconnected.
//
// The consequence, on the shared television that is the very reason for the
// cut: five profiles in a living room, somebody is watching under your profile,
// you choose "disconnect this profile" from the web — and the
// PlaybackSession(account, profile, device, date) lease kept renewing.
// Playback did not stop. And since the screen ceiling is 1 outside premium, you
// stayed locked out of your OWN account: the exact defect storefront-mobile Q5
// and storefront-tv Q9c asked us to avoid. The only way out was to revoke the
// device, which disconnects all five profiles.
//
// Consumed by `streaming`, which revokes the leases of the (device, profile)
// pair — and of those alone.
message DeviceSessionClosed {
  string device_id = 1;
  string account_id = 2;
  // THE GRAIN THAT WAS MISSING.
  string profile_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
  // True when the close comes from the device itself, false when it is commanded
  // remotely from another surface. Both exist, and the disconnected screen does
  // not show the same message.
  bool self_initiated = 5;
  arthome.common.v1.Actor closed_by = 6;
}

// ---------------------------------------------------------------- relations

// Following an artist and being alerted are TWO settings. The first is a
// catalogue relation, the second a flag carried by `notifications`.
// Confusing them would make it impossible to follow without being notified.
message ArtistFollowed {
  string account_id = 1;
  string artist_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

message ArtistUnfollowed {
  string account_id = 1;
  string artist_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// ---------------------------------------------------------------- channel

// The channel as a WORKSPACE. Its public face — name, biography, avatar,
// subscribers — belongs to `catalog.Artist`, in a 1:1 relation by `channel_id`.
// That is the cut that resolves C9: authorisation on one side, publication on
// the other, and no studio command crosses both.
message ChannelCreated {
  string channel_id = 1;
  string owner_account_id = 2;
  string owner_person_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message ChannelMembershipChanged {
  string channel_id = 1;
  string person_id = 2;
  // A SET of roles: one person holds several on the same channel, and the
  // studio's navigation is the UNION of their accesses, never a rank.
  // Empty when `action` is MEMBERSHIP_ACTION_REMOVED.
  repeated MemberRole roles = 3;
  MembershipAction action = 4;
  google.protobuf.Timestamp occurred_at = 5;
  arthome.common.v1.Actor changed_by = 6;
}

// Requires the recipient to be ALREADY a member and to have two-factor
// authentication. The bank account (payouts) and the public page (catalog)
// follow the transfer.
message ChannelOwnershipTransferred {
  string channel_id = 1;
  string from_person_id = 2;
  string to_person_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

// The one-off stand-in: scoped to ONE date, expiry explicit and SERVED.
// "Expires at curtain-down + 1 h" is a screen sentence; the contract carries
// the instant.
message DateAccessGranted {
  string grant_id = 1;
  string channel_id = 2;
  string date_id = 3;
  string person_id = 4;
  CrewRole crew_role = 5;
  google.protobuf.Timestamp expires_at = 6;
  arthome.common.v1.Actor granted_by = 7;
}

message DateAccessRevoked {
  string grant_id = 1;
  string channel_id = 2;
  string date_id = 3;
  string person_id = 4;
  google.protobuf.Timestamp occurred_at = 5;
  // True when it is the lease expiring, and not a human act, that revoked the
  // access. The journal must tell the two apart.
  bool expired = 6;
}

// Rights change WHILE the application is open: an accepted invitation adds a
// channel to the picker, a one-off access expires on its own at curtain-down, a
// role is withdrawn. Without this counter, the person keeps a tab that opens a
// 403 and discovers it mid-shift.
// Carried on every HTTP response too, and pushed on the realtime channel.
message RightsVersionBumped {
  string account_id = 1;
  uint64 rights_version = 2;
  // The channels touched, so the client knows what to reload.
  repeated string channel_ids = 3;
  google.protobuf.Timestamp occurred_at = 4;
}
