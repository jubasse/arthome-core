// Events of the `payouts` context — what the platform owes a channel.
//
// Kafka topic:
//   arthome.payouts.payout   key channel_id
//
// STRIPE REMAINS THE SOURCE OF TRUTH FOR THE MOVEMENT OF MONEY. We never
// rebuild its ledger: we RECONCILE ours with it, and a period does not close
// with an unexplained gap.
//
// Maturity: PROVISIONAL. The tax question is settled in adr-payments.md §5
// (D-015, commissionnaire model), but its legal validation is not done: the VAT
// base and the liable party could still move the fields. The SHAPE — a
// breakdown per jurisdiction, each line carrying its own rate — is safe.
syntax = "proto3";

package arthome.payouts.v1;

import "arthome/common/v1/common.proto";
import "arthome/ticketing/v1/events.proto";
import "google/protobuf/timestamp.proto";

// `held` while an outcome is OPEN (postponed, interrupted);
// `refunded` if the date is cancelled;
// `suspended` while a change of bank details awaits its counter-signature.
// What has authority in `shared/` and what we port: commission 12%, delay
// 14 days, rounding to the unit on each component taken separately, withholding
// while an outcome is open.
enum PayoutState {
  PAYOUT_STATE_UNSPECIFIED = 0;
  PAYOUT_STATE_SCHEDULED = 1;
  PAYOUT_STATE_HELD = 2;
  PAYOUT_STATE_PAID = 3;
  PAYOUT_STATE_REFUNDED = 4;
  PAYOUT_STATE_SUSPENDED = 5;
}

message PayoutStateChanged {
  string payout_id = 1;
  string channel_id = 2;
  string date_id = 3;
  PayoutState state = 4;

  arthome.common.v1.Money gross_ttc = 5;
  // Breakdown PER JURISDICTION, each line carrying its base, its rate and its
  // amount. It holds whatever tax model is adopted: a single-rate model produces
  // a one-line breakdown. That is what reconciles the payouts mockup ("the
  // applicable rate is that of the buyer's country") with the fixture (a single
  // rate on the gross), without assuming which one is right.
  repeated arthome.ticketing.v1.VatLine vat = 6;
  arthome.common.v1.Money gross_ht = 7;

  // SERVED, never re-derived from commission / gross: the mockup re-derives it
  // and falls back to 12% by default when the gross is zero. 1200 = 12%.
  uint32 commission_rate_bps = 8;
  arthome.common.v1.Money commission = 9;
  arthome.common.v1.Money net = 10;
  arthome.common.v1.Money refunded = 11;
  arthome.common.v1.Money credited = 12;

  // End of the live show + 14 days. The due date runs from the END, not from the
  // payment: `payouts` consumes `streaming.run.ended.v1` to set it.
  google.protobuf.Timestamp due_at = 13;
  string stripe_transfer_ref = 14;
  google.protobuf.Timestamp occurred_at = 15;
}

// A REQUEST awaiting a second approval, with its own lifecycle and its own
// trace — not a write. Two actors, two distinct roles (owner AND treasury), a
// deadline, a trace. And it SUSPENDS the transfer in progress for the duration
// of the signature: a single write cannot carry that.
message BankChangeRequested {
  string request_id = 1;
  string channel_id = 2;
  // The last four characters only. A full IBAN has no business in an event
  // journal that gets replayed.
  string masked_account_tail = 3;
  google.protobuf.Timestamp requested_at = 4;
  arthome.common.v1.Actor requested_by = 5;
  google.protobuf.Timestamp expires_at = 6;
}

message BankChangeCountersigned {
  string request_id = 1;
  string channel_id = 2;
  google.protobuf.Timestamp countersigned_at = 3;
  arthome.common.v1.Actor countersigned_by = 4;
}

// A period does not close with an unexplained gap: this event routes an alert
// to the `treasury` role.
message ReconciliationDiscrepancyFound {
  string period_id = 1;
  string channel_id = 2;
  arthome.common.v1.Money expected = 3;
  arthome.common.v1.Money observed = 4;
  arthome.common.v1.Money discrepancy = 5;
  google.protobuf.Timestamp found_at = 6;
}
