// Événements du contexte `catalog` — ce qui est publié.
//
// Sujets Kafka :
//   arthome.catalog.date          clé date_id     12 partitions
//   arthome.catalog.show          clé show_id
//   arthome.catalog.artist        clé artist_id
//   arthome.catalog.saved_search  clé account_id
//
// Maturité : STABLE (palier 2).
syntax = "proto3";

package arthome.catalog.v1;

import "arthome/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// L'ACTE de la chaîne. Vocabulaire de `catalogue.json`, qui fait autorité (D2) :
// `replay-online` dit ce que `replay` ne dit pas — la rediffusion est EN VENTE.
// Les tables parallèles des deux maquettes de studio (`hidden`, `sched`, `tech`,
// `done`) ne sont jamais reprises.
enum PublicationState {
  PUBLICATION_STATE_UNSPECIFIED = 0;
  PUBLICATION_STATE_DRAFT = 1;
  PUBLICATION_STATE_RESERVE = 2;
  PUBLICATION_STATE_SCHEDULED = 3;
  PUBLICATION_STATE_TECHNICAL = 4;
  PUBLICATION_STATE_LIVE = 5;
  PUBLICATION_STATE_ENDED = 6;
  PUBLICATION_STATE_REPLAY_ONLINE = 7;
}

// L'ISSUE. Trois axes existent sur une date sans hiérarchie écrite (E4) :
// `publication.state`, `run.state` et `outcome`. Le contrat l'écrit une fois :
//   outcome PRIME sur run.state, qui PRIME sur publication.state.
// L'issue est un FAIT sur la représentation : elle n'est jamais réécrite.
enum DateOutcome {
  DATE_OUTCOME_UNSPECIFIED = 0;
  DATE_OUTCOME_POSTPONED = 1;
  DATE_OUTCOME_CANCELLED = 2;
  DATE_OUTCOME_INTERRUPTED = 3;
}

// La PROMESSE faite avant l'achat — c'est elle qui justifie l'écart de tarif,
// et le dossier en fait un principe. La mise en vente est à `ticketing`,
// le fichier et son expiration à `streaming`.
// `sub`/`off` des maquettes mobile et de l'assistant de création ne sont pas du
// vocabulaire : `helpers.stateOf` teste littéralement `policy !== 'none'`, donc
// une date créée avec `off` ne serait jamais reconnue sans rediffusion (E2).
enum ReplayPolicy {
  REPLAY_POLICY_UNSPECIFIED = 0;
  REPLAY_POLICY_INCLUDED = 1;
  REPLAY_POLICY_SUBSCRIPTION = 2;
  REPLAY_POLICY_UNIT = 3;
  REPLAY_POLICY_NONE = 4;
}

enum RightsScope {
  RIGHTS_SCOPE_UNSPECIFIED = 0;
  RIGHTS_SCOPE_WORLDWIDE = 1;
  RIGHTS_SCOPE_RESTRICTED = 2;
}

// Un CODE, jamais une phrase. `geography.rightsPolicy.blackoutReasons[]` porte
// aujourd'hui `label` et `labelEn` — du texte rédigé DANS la donnée, alors que
// tout le reste passe par `enums.*`. C'est une fuite d'i18n dans le modèle, et
// elle est exactement du genre que « i18n par codes » existe pour interdire (E8).
enum BlackoutReason {
  BLACKOUT_REASON_UNSPECIFIED = 0;
  BLACKOUT_REASON_CO_PRODUCTION = 1;
  BLACKOUT_REASON_BROADCASTER = 2;
  BLACKOUT_REASON_FESTIVAL = 3;
}

// Vocabulaire RÉEL, corrigé : `taxonomy.json` déclare `none | light | helpful`,
// mais `essential` est employé par cinq spectacles, traduit dans l'i18n, et
// `hasLanguageBarrier` EN FAIT SON TEST ; `light` n'est employé nulle part (D1).
// Un vocabulaire fermé qui ne contient pas la valeur dont dépend la règle la
// plus visible de la surface n'est pas un vocabulaire fermé.
enum LanguageDependency {
  LANGUAGE_DEPENDENCY_UNSPECIFIED = 0;
  LANGUAGE_DEPENDENCY_NONE = 1;
  LANGUAGE_DEPENDENCY_HELPFUL = 2;
  LANGUAGE_DEPENDENCY_ESSENTIAL = 3;
}

// Ce que la publication ENGAGE. La publication ne verrouille rien qu'elle ne
// possède : elle publie un fait, et chaque propriétaire applique SON verrou.
// C'est la réponse au reproche « un agrégat à cheval sur trois contextes ».
enum PublicationEngagement {
  PUBLICATION_ENGAGEMENT_UNSPECIFIED = 0;
  PUBLICATION_ENGAGEMENT_PRICES = 1;    // consommé par ticketing
  PUBLICATION_ENGAGEMENT_REPLAY = 2;    // consommé par ticketing
  PUBLICATION_ENGAGEMENT_CHAT_MODE = 3; // consommé par chat
}

message TerritoryRights {
  RightsScope scope = 1;
  // ISO 3166-1 alpha-2. Vide quand `scope` vaut RIGHTS_SCOPE_WORLDWIDE.
  // Diffusion mondiale par défaut : une restriction est l'exception, et elle se
  // justifie par un motif codé.
  repeated string blackout_countries = 2;
  BlackoutReason reason = 3;
}

// ---------------------------------------------------------------- date

message DateDrafted {
  string date_id = 1;
  string channel_id = 2;
  string show_id = 3;
  string venue_id = 4;
  google.protobuf.Timestamp occurred_at = 5;
  arthome.common.v1.Actor drafted_by = 6;
}

// La publication engage le tarif affiché : `draft|reserve -> scheduled` est une
// transition SANS RETOUR. Le serveur refuse l'inverse avec un code et la
// promesse engagée en paramètre ; ne pas l'offrir dans l'interface est une
// politesse, pas une garantie.
message DateScheduled {
  string date_id = 1;
  string channel_id = 2;
  string show_id = 3;
  string venue_id = 4;

  // UTC. Jamais un décalage en minutes, jamais une heure murale formatée (D7).
  google.protobuf.Timestamp starts_at = 5;
  arthome.common.v1.VenueClock venue_clock = 6;
  uint32 runtime_min = 7;

  ReplayPolicy replay_policy = 8;
  uint32 replay_window_hours = 9;
  TerritoryRights rights = 10;

  // L'URL publique canonique de la date. SERVIE, jamais construite par une
  // surface : c'est elle qu'on partage, qu'on met en favori, vers quoi pointent
  // un rappel et une notification, et ce qu'on indexe. Sans elle, les quatre
  // pointent vers « la prochaine date », qui change.
  string canonical_url = 11;

  google.protobuf.Timestamp occurred_at = 12;
  arthome.common.v1.Actor scheduled_by = 13;
}

message PublicationEngaged {
  string date_id = 1;
  string channel_id = 2;
  repeated PublicationEngagement engaged = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

// La transition d'état de la publication. IL MANQUAIT, et son absence avait une
// conséquence précise : `draft -> reserve`, `scheduled <-> technical` et
// `ended -> replay-online` ne produisaient AUCUN événement, donc l'écran d'un
// second opérateur affichait indéfiniment l'état d'avant.
//
// Le scénario que `studio-web` a établi : A publie (version 7 -> 8, tarifs
// engagés, transition SANS RETOUR) ; l'écran de B affiche toujours BROUILLON
// avec ses deux transitions offertes ; B clique « Publier », croyant franchir
// le premier une porte irréversible, et l'apprend par une erreur — la
// tentative partant au journal à son nom. La sûreté était complète
// (`expectedVersion`, `STATE_CONFLICT`, `TRANSITION_IRREVERSIBLE`), la
// FRAÎCHEUR était entièrement absente.
//
// Routé vers la salle `channel:{id}` comme un correctif ordinaire
// { entity: "publication", id, op: "upsert", seq, patch } — voir realtime.md §3.1.
message PublicationStateChanged {
  string date_id = 1;
  string channel_id = 2;
  PublicationState from_state = 3;
  PublicationState to_state = 4;

  // La version APRÈS transition. C'est elle que le destinataire doit porter
  // dans son prochain `expectedVersion`, sinon son correctif appliqué le laisse
  // avec une version périmée et il repart en STATE_CONFLICT.
  uint64 version = 5;

  // Vrai quand la transition était sans retour. Le journal doit pouvoir
  // distinguer un passage ordinaire d'un engagement définitif.
  bool irreversible = 6;

  google.protobuf.Timestamp occurred_at = 7;
  arthome.common.v1.Actor changed_by = 8;
}

// Un report ne bouge pas d'argent : la place SUIT la nouvelle date, sans
// démarche. `notifications` déplace le rappel plutôt que de l'envoyer à vide.
message DateRescheduled {
  string date_id = 1;
  google.protobuf.Timestamp previous_starts_at = 2;
  google.protobuf.Timestamp new_starts_at = 3;
  arthome.common.v1.VenueClock new_venue_clock = 4;
  google.protobuf.Timestamp occurred_at = 5;
  arthome.common.v1.Actor rescheduled_by = 6;
}

// UN événement, QUATRE conséquences, et aucun des quatre consommateurs ne parle
// aux autres :
//   ticketing  rembourse (cancelled) / crédite (interrupted) / ne bouge pas (postponed)
//   payouts    retient, puis rembourse si annulée
//   catalog    l'issue remplace l'état sur CHAQUE CARTE, pas seulement sur la fiche
//   notifications  prévient les détenteurs
message DateOutcomeDeclared {
  string date_id = 1;
  string channel_id = 2;
  DateOutcome outcome = 3;

  // Le message écrit par la régie. C'est du CONTENU, pas un libellé : il voyage
  // avec sa langue de rédaction, comme un synopsis. Seule exception assumée à
  // « i18n par codes », avec les textes de la boîte du studio.
  arthome.common.v1.LocalizedText message = 4;

  // Présent seulement pour DATE_OUTCOME_POSTPONED.
  google.protobuf.Timestamp rescheduled_to = 5;

  google.protobuf.Timestamp declared_at = 6;
  // Réservé au propriétaire et à la production. Les autres rôles ne peuvent que
  // SIGNALER. Le journal est nominatif : une décision d'issue vaut plusieurs
  // milliers d'euros.
  arthome.common.v1.Actor declared_by = 7;
}

// REPLAY_POLICY_NONE est DÉFINITIF pour cette date : on ne peut pas activer
// ensuite une rediffusion qu'on a promis de ne pas faire, le tarif public en
// dépendait. Les autres valeurs se verrouillent à l'ouverture de la billetterie.
message DateReplayPolicySet {
  string date_id = 1;
  ReplayPolicy policy = 2;
  uint32 window_hours = 3;
  google.protobuf.Timestamp occurred_at = 4;
  arthome.common.v1.Actor set_by = 5;
}

message DateRightsChanged {
  string date_id = 1;
  TerritoryRights rights = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// ---------------------------------------------------------------- spectacle

message ShowPublished {
  string show_id = 1;
  string channel_id = 2;
  string artist_id = 3;
  string category_id = 4;
  // MULTIPLE. `taxonomy.json` le déclare « optionnel, multiple »,
  // `catalogue.json` le porte au singulier, et le filtre de recherche du web est
  // une multi-sélection : le contrat tranche pour le pluriel (E9).
  repeated string genre_ids = 5;
  repeated string tag_ids = 6;
  uint32 runtime_min = 7;
  LanguageDependency language_dependency = 8;
  // BCP 47.
  repeated string spoken_languages = 9;
  repeated string subtitle_languages = 10;
  repeated string surtitle_languages = 11;
  arthome.common.v1.MediaSet media = 12;
  google.protobuf.Timestamp occurred_at = 13;
}

message ShowUpdated {
  string show_id = 1;
  repeated string genre_ids = 2;
  repeated string tag_ids = 3;
  LanguageDependency language_dependency = 4;
  arthome.common.v1.MediaSet media = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

// ---------------------------------------------------------------- artiste

message ArtistUpdated {
  string artist_id = 1;
  string channel_id = 2;
  string category_id = 3;
  string country = 4;
  arthome.common.v1.MediaSet media = 5;
  bool verified = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

// ---------------------------------------------------- recherche enregistrée

// Déclenché par le PERCOLATOR de l'index quand une date NOUVELLE correspond à
// une recherche enregistrée. C'est ce qui permet à la page Compte d'afficher
// « nouvelles depuis votre dernière visite » sans dix agrégations par
// affichage : le compteur s'incrémente ici et se remet à zéro à la lecture.
message SavedSearchMatched {
  string saved_search_id = 1;
  string account_id = 2;
  string date_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
}
