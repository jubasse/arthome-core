// Events of the `catalog` context — what is published.
//
// Kafka topics:
//   arthome.catalog.date          key date_id     12 partitions
//   arthome.catalog.show          key show_id
//   arthome.catalog.artist        key artist_id
//   arthome.catalog.saved_search  key account_id
//
// Maturity: STABLE (milestone 2).
syntax = "proto3";

package arthome.catalog.v1;

import "arthome/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// The channel's ACT. Vocabulary from `catalogue.json`, which has authority (D2):
// `replay_online` says what `replay` does not — the replay is ON SALE.
// The parallel tables of the two studio mockups (`hidden`, `sched`, `tech`,
// `done`) are never adopted.
enum PublicationState {
  PUBLICATION_STATE_UNSPECIFIED = 0;
  PUBLICATION_STATE_DRAFT = 1;
  PUBLICATION_STATE_RESERVE = 2;
  PUBLICATION_STATE_SCHEDULED = 3;
  PUBLICATION_STATE_TECHNICAL = 4;
  PUBLICATION_STATE_LIVE = 5;
  PUBLICATION_STATE_ENDED = 6;
  PUBLICATION_STATE_REPLAY_ONLINE = 7;
}

// THE OUTCOME. Three axes exist on a date with no written hierarchy (E4):
// `publication.state`, `run.state` and `outcome`. The contract writes it once:
//   outcome OUTRANKS run.state, which OUTRANKS publication.state.
// The outcome is a FACT about the performance: it is never rewritten.
enum DateOutcome {
  DATE_OUTCOME_UNSPECIFIED = 0;
  DATE_OUTCOME_POSTPONED = 1;
  DATE_OUTCOME_CANCELLED = 2;
  DATE_OUTCOME_INTERRUPTED = 3;
}

// The PROMISE made before the purchase — it is what justifies the price
// difference, and the file makes it a principle. Putting it on sale belongs to
// `ticketing`, the file and its expiry to `streaming`.
// `sub`/`off` from the mobile mockup and the creation wizard are not
// vocabulary: `helpers.stateOf` literally tests `policy !== 'none'`, so a date
// created with `off` would never be recognised as having no replay (E2).
enum ReplayPolicy {
  REPLAY_POLICY_UNSPECIFIED = 0;
  REPLAY_POLICY_INCLUDED = 1;
  REPLAY_POLICY_SUBSCRIPTION = 2;
  REPLAY_POLICY_UNIT = 3;
  REPLAY_POLICY_NONE = 4;
}

enum RightsScope {
  RIGHTS_SCOPE_UNSPECIFIED = 0;
  RIGHTS_SCOPE_WORLDWIDE = 1;
  RIGHTS_SCOPE_RESTRICTED = 2;
}

// A CODE, never a sentence. `geography.rightsPolicy.blackoutReasons[]` today
// carries `label` and `labelEn` — prose written INTO the data, while all the
// rest goes through `enums.*`. That is an i18n leak into the model, and it is
// exactly the kind "i18n by codes" exists to forbid (E8).
enum BlackoutReason {
  BLACKOUT_REASON_UNSPECIFIED = 0;
  BLACKOUT_REASON_CO_PRODUCTION = 1;
  BLACKOUT_REASON_BROADCASTER = 2;
  BLACKOUT_REASON_FESTIVAL = 3;
}

// The REAL vocabulary, corrected: `taxonomy.json` declares `none | light |
// helpful`, but `essential` is used by five shows, translated in the i18n, and
// `hasLanguageBarrier` MAKES IT ITS TEST; `light` is used nowhere (D1).
// A closed vocabulary that does not contain the value the surface's most
// visible rule depends on is not a closed vocabulary.
enum LanguageDependency {
  LANGUAGE_DEPENDENCY_UNSPECIFIED = 0;
  LANGUAGE_DEPENDENCY_NONE = 1;
  LANGUAGE_DEPENDENCY_HELPFUL = 2;
  LANGUAGE_DEPENDENCY_ESSENTIAL = 3;
}

// What publication COMMITS. Publication locks nothing it does not own: it
// publishes a fact, and each owner applies ITS OWN lock.
// That is the answer to the charge of "an aggregate straddling three contexts".
enum PublicationEngagement {
  PUBLICATION_ENGAGEMENT_UNSPECIFIED = 0;
  PUBLICATION_ENGAGEMENT_PRICES = 1;    // consumed by ticketing
  PUBLICATION_ENGAGEMENT_REPLAY = 2;    // consumed by ticketing
  PUBLICATION_ENGAGEMENT_CHAT_MODE = 3; // consumed by chat
}

message TerritoryRights {
  RightsScope scope = 1;
  // ISO 3166-1 alpha-2. Empty when `scope` is RIGHTS_SCOPE_WORLDWIDE.
  // Worldwide broadcast by default: a restriction is the exception, and it is
  // justified by a coded reason.
  repeated string blackout_countries = 2;
  BlackoutReason reason = 3;
}

// ---------------------------------------------------------------- date

message DateDrafted {
  string date_id = 1;
  string channel_id = 2;
  string show_id = 3;
  string venue_id = 4;
  google.protobuf.Timestamp occurred_at = 5;
  arthome.common.v1.Actor drafted_by = 6;
}

// Publication commits the displayed price: `draft|reserve -> scheduled` is a
// ONE-WAY transition. The server refuses the reverse with a code and the
// promise made as a parameter; not offering it in the interface is a courtesy,
// not a guarantee.
message DateScheduled {
  string date_id = 1;
  string channel_id = 2;
  string show_id = 3;
  string venue_id = 4;

  // UTC. Never an offset in minutes, never a formatted wall-clock time (D7).
  google.protobuf.Timestamp starts_at = 5;
  arthome.common.v1.VenueClock venue_clock = 6;
  uint32 runtime_min = 7;

  ReplayPolicy replay_policy = 8;
  uint32 replay_window_hours = 9;
  TerritoryRights rights = 10;

  // The date's canonical public URL. SERVED, never built by a surface: it is
  // what gets shared, bookmarked, what a reminder and a notification point to,
  // and what gets indexed. Without it, all four point at "the next date", which
  // changes.
  string canonical_url = 11;

  google.protobuf.Timestamp occurred_at = 12;
  arthome.common.v1.Actor scheduled_by = 13;

  // Where the venue is, for the search filters by city and country: the name the venue holds,
  // and ISO 3166-1 alpha-2.
  string venue_city = 14;
  string venue_country = 15;
}

message PublicationEngaged {
  string date_id = 1;
  string channel_id = 2;
  repeated PublicationEngagement engaged = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

// The publication's state transition. IT WAS MISSING, and its absence had a
// precise consequence: `draft -> reserve`, `scheduled <-> technical` and
// `ended -> replay-online` produced NO event, so a second operator's screen
// showed the previous state indefinitely.
//
// The scenario `studio-web` established: A publishes (version 7 -> 8, prices
// committed, ONE-WAY transition); B's screen still shows DRAFT with its two
// offered transitions; B clicks "Publish", believing they are first through an
// irreversible door, and learns otherwise from an error — the attempt going to
// the journal under their name. The safety was complete (`expectedVersion`,
// `STATE_CONFLICT`, `TRANSITION_IRREVERSIBLE`), the FRESHNESS was entirely
// absent.
//
// Routed to the `channel:{id}` room as an ordinary correction
// { entity: "publication", id, op: "upsert", seq, patch } — see realtime.md §3.1.
message PublicationStateChanged {
  string date_id = 1;
  string channel_id = 2;
  PublicationState from_state = 3;
  PublicationState to_state = 4;

  // The version AFTER the transition. It is the one the recipient must carry in
  // their next `expectedVersion`, otherwise the correction they applied leaves
  // them with a stale version and they go straight back into STATE_CONFLICT.
  uint64 version = 5;

  // True when the transition was one-way. The journal must be able to tell an
  // ordinary move apart from a final commitment.
  bool irreversible = 6;

  google.protobuf.Timestamp occurred_at = 7;
  arthome.common.v1.Actor changed_by = 8;
}

// A postponement moves no money: the seat FOLLOWS the new date, with nothing
// to do. `notifications` moves the reminder rather than firing it into the void.
message DateRescheduled {
  string date_id = 1;
  google.protobuf.Timestamp previous_starts_at = 2;
  google.protobuf.Timestamp new_starts_at = 3;
  arthome.common.v1.VenueClock new_venue_clock = 4;
  google.protobuf.Timestamp occurred_at = 5;
  arthome.common.v1.Actor rescheduled_by = 6;
}

// ONE event, FOUR consequences, and none of the four consumers talks to the
// others:
//   ticketing      refunds (cancelled) / credits (interrupted) / does nothing (postponed)
//   payouts        withholds, then refunds if cancelled
//   catalog        the outcome replaces the state on EVERY CARD, not just the sheet
//   notifications  warns the seat holders
message DateOutcomeDeclared {
  string date_id = 1;
  string channel_id = 2;
  DateOutcome outcome = 3;

  // The message written by the run desk. It is CONTENT, not a label: it travels
  // with the language it was written in, like a synopsis. The one assumed
  // exception to "i18n by codes", together with the studio shop's texts.
  arthome.common.v1.LocalizedText message = 4;

  // Present only for DATE_OUTCOME_POSTPONED.
  google.protobuf.Timestamp rescheduled_to = 5;

  google.protobuf.Timestamp declared_at = 6;
  // Reserved to the owner and to production. The other roles can only REPORT.
  // The journal is by-name: an outcome decision is worth several thousand euros.
  arthome.common.v1.Actor declared_by = 7;
}

// REPLAY_POLICY_NONE is FINAL for this date: you cannot later enable a replay
// you promised not to make — the public price depended on it. The other values
// lock when the box office opens.
message DateReplayPolicySet {
  string date_id = 1;
  ReplayPolicy policy = 2;
  uint32 window_hours = 3;
  google.protobuf.Timestamp occurred_at = 4;
  arthome.common.v1.Actor set_by = 5;
}

message DateRightsChanged {
  string date_id = 1;
  TerritoryRights rights = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// ---------------------------------------------------------------- show

message ShowPublished {
  string show_id = 1;
  string channel_id = 2;
  string artist_id = 3;
  string category_id = 4;
  // MULTIPLE. `taxonomy.json` declares it "optional, multiple",
  // `catalogue.json` carries it in the singular, and the web search filter is a
  // multi-select: the contract settles on the plural (E9).
  repeated string genre_ids = 5;
  repeated string tag_ids = 6;
  uint32 runtime_min = 7;
  LanguageDependency language_dependency = 8;
  // BCP 47.
  repeated string spoken_languages = 9;
  repeated string subtitle_languages = 10;
  repeated string surtitle_languages = 11;
  arthome.common.v1.MediaSet media = 12;
  google.protobuf.Timestamp occurred_at = 13;
  // One entry per language that has copy (data-model.md §2.1). Carried so the index can
  // search and render a show without calling catalog (critical-rules #1).
  repeated arthome.common.v1.LocalizedText title = 14;
  repeated arthome.common.v1.LocalizedText synopsis = 15;
}

// Every field at its new value, not only the changed ones: a consumer replaces, never merges.
message ShowUpdated {
  string show_id = 1;
  repeated string genre_ids = 2;
  repeated string tag_ids = 3;
  LanguageDependency language_dependency = 4;
  arthome.common.v1.MediaSet media = 5;
  google.protobuf.Timestamp occurred_at = 6;
  repeated arthome.common.v1.LocalizedText title = 7;
  repeated arthome.common.v1.LocalizedText synopsis = 8;
}

// ---------------------------------------------------------------- artist

message ArtistUpdated {
  string artist_id = 1;
  string channel_id = 2;
  string category_id = 3;
  string country = 4;
  arthome.common.v1.MediaSet media = 5;
  bool verified = 6;
  google.protobuf.Timestamp occurred_at = 7;
}

// ---------------------------------------------------- saved search

// Raised by the index's PERCOLATOR when a NEW date matches a saved search.
// That is what lets the Account page show "new since your last visit" without
// ten aggregations per render: the counter increments here and resets to zero
// on read.
message SavedSearchMatched {
  string saved_search_id = 1;
  string account_id = 2;
  string date_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
}
