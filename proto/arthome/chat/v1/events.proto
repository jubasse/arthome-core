// Events of the `chat` context — speech in a channel, and its policing.
//
// Kafka topics:
//   arthome.chat.message     key date_id   12 partitions
//   arthome.chat.moderation  key date_id    6 partitions
//
// Kafka is the durable JOURNAL — moderation, audit, replay, history.
// Redis handles BROADCAST to connected clients. Confusing the two is the
// classic error, and `streaming.md` names it.
//
// Maturity: PROVISIONAL (milestone 5). Four sanction vocabularies existed; I
// settle three axes from them, but NO screen has ever exercised moderation as
// the viewer sees it — `storefront-mobile` verified that `chatOf` is never
// called in its mockup. A contract designed and not observed does not freeze.
syntax = "proto3";

package arthome.chat.v1;

import "arthome/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Vocabulary from `catalogue.json`, which has authority.
// Three parallel tables exist in the mockups — `free | emoji | off` on the web
// and the run-desk console, `read` instead of `read-only` — and the i18n
// resolves only the first set. It is defect D2 on another field (E2).
enum ChatMode {
  CHAT_MODE_UNSPECIFIED = 0;
  CHAT_MODE_OPEN = 1;
  CHAT_MODE_EMOJI = 2;
  CHAT_MODE_READ_ONLY = 3;
  CHAT_MODE_OFF = 4;
}

// AXIS 1 — the MESSAGE's state. Two values, and two only.
// `muted` and `banned` DISAPPEAR from this axis: they never had meaning here,
// they bear on the person. `ok` is renamed `published`, which is the i18n
// vocabulary and the only one that says what it does (D6, E3).
enum MessageState {
  MESSAGE_STATE_UNSPECIFIED = 0;
  MESSAGE_STATE_PUBLISHED = 1;
  MESSAGE_STATE_REMOVED = 2;
}

// AXIS 2 — the nature of the QUEUE ITEM.
// `reported` is a TRIAGE state, and it sat in the sanctions field: that is why
// the queue was built by filtering `state === 'reported'`, which is not a state
// filter but a kind filter. Separated here.
enum ModerationItemState {
  MODERATION_ITEM_STATE_UNSPECIFIED = 0;
  MODERATION_ITEM_STATE_REPORTED = 1;
  MODERATION_ITEM_STATE_CLAIMED = 2;
  MODERATION_ITEM_STATE_SETTLED = 3;
}

enum ModerationVerdict {
  MODERATION_VERDICT_UNSPECIFIED = 0;
  MODERATION_VERDICT_PUBLISH = 1;
  MODERATION_VERDICT_REMOVE = 2;
  MODERATION_VERDICT_MUTE = 3;
  MODERATION_VERDICT_BAN = 4;
}

// Vocabulary from `shared/catalogue.json` `moderationReasons`, which has
// authority — and which, unlike the other enums, had NO competitor here.
//
// An earlier version of this file dropped `insult` and `spoiler` and invented
// `hate` and `filter`. So it was THE CONTRACT holding a parallel table against
// `shared/`: exactly the charge this project lays at the mockups (E2),
// committed in the other direction.
//
// Two notes on what was removed:
//   - `spoiler` ("Gives the show away") is THE ONLY reason specific to live
//     performance, it is translated in `shared/i18n/studio.json`
//     (`enums.moderationReason.spoiler`), and nobody could have emitted it any
//     more;
//   - `filter` is not a reason, it is an ORIGIN — and the contract already
//     carries it correctly in `StateChangeOrigin`. Lodging it here as well would
//     give one field two axes, precisely the charge laid at `reported` in the
//     sanctions and at `postponed` in `run.state`.
//
// The "an unknown value is kept and treated as neutral" rule saved nothing
// here: the problem was not receiving `spoiler` without understanding it, it
// was that no emitter could produce it any more.
//
// Numbers 3 and 5 reserved: an enumeration number is never reused.
enum ModerationReason {
  reserved 3, 5;
  reserved "MODERATION_REASON_HATE", "MODERATION_REASON_FILTER";

  MODERATION_REASON_UNSPECIFIED = 0;
  MODERATION_REASON_SPAM = 1;
  MODERATION_REASON_HARASSMENT = 2;
  MODERATION_REASON_OFF_TOPIC = 4;
  MODERATION_REASON_INSULT = 6;
  MODERATION_REASON_SPOILER = 7;
}

// AXIS 3 — the sanction on the PERSON, WITHIN ONE CHANNEL.
// The same person is banned on one artist's channel and welcome on another's:
// that is why the sanction belongs to `chat` and not to `identity`. Lodging the
// sanction there would force every verdict — the most frequent act of a
// saturated live show — into a cross-service write to the most sensitive
// service in the system.
enum AudienceSanctionKind {
  AUDIENCE_SANCTION_KIND_UNSPECIFIED = 0;
  AUDIENCE_SANCTION_KIND_NONE = 1;
  AUDIENCE_SANCTION_KIND_MUTED = 2;
  AUDIENCE_SANCTION_KIND_BANNED = 3;
}

// Two vocabularies exist in the SAME mockup file (`souple/normale/haute` in
// channel settings, `basse/moyenne/haute` on the moderation page) and neither
// is in `shared/`. The contract fixes one.
enum FilterSeverity {
  FILTER_SEVERITY_UNSPECIFIED = 0;
  FILTER_SEVERITY_LOW = 1;
  FILTER_SEVERITY_MEDIUM = 2;
  FILTER_SEVERITY_HIGH = 3;
}

// Adding a word to the dictionary live RECLASSIFIES messages already
// published, if the retroactive option is on. The journal must tell an
// automatic reclassification apart from a human decision.
enum StateChangeOrigin {
  STATE_CHANGE_ORIGIN_UNSPECIFIED = 0;
  STATE_CHANGE_ORIGIN_HUMAN_VERDICT = 1;
  // A word added to the dictionary LIVE reclassifies messages already published.
  STATE_CHANGE_ORIGIN_RETROACTIVE_FILTER = 2;
  STATE_CHANGE_ORIGIN_AUTHOR_SANCTIONED = 3;
  // AUTOMATIC moderation, which acts at INGESTION — not after a report.
  // It is not built today; the shape must be able to accommodate it without a
  // contract change, which is cheap now and expensive later.
  // To be distinguished from RETROACTIVE_FILTER: that one reclassifies what
  // exists, this one decides on arrival.
  STATE_CHANGE_ORIGIN_AUTOMATIC_FILTER = 4;
}

// ---------------------------------------------------------------- policy

// Consumed by `catalog`: the public card carries `chatMode`, and the player
// needs it in the same round trip as the playback token.
message DateChatPolicyChanged {
  string date_id = 1;
  string channel_id = 2;
  ChatMode mode = 3;
  FilterSeverity filter_severity = 4;
  // Slow mode: minimum delay between two messages from the same person.
  uint32 slow_mode_sec = 5;
  // Reserved to seat holders.
  bool holders_only = 6;
  // True as soon as `catalog.publication.engaged` has been consumed. `chat`
  // applies ITS OWN lock: after the commitment you can still CLOSE a live chat,
  // never open it further.
  bool locked = 7;
  google.protobuf.Timestamp occurred_at = 8;
  arthome.common.v1.Actor changed_by = 9;
}

// ---------------------------------------------------------------- message

// Durable journal: replay playback, audit, history. BROADCAST to connected
// clients goes over Redis and does not enter here.
message MessagePosted {
  string message_id = 1;
  string date_id = 2;
  string channel_id = 3;
  string audience_member_id = 4;
  string author_handle = 5;

  // THE POSITION IN THE MEDIA, in seconds from curtain-up.
  // Without it, chat replayed over a replay is offset by however long the viewer
  // took to start playback. The mockups plan replays with chapters: the problem is
  // certain. It costs nothing if you think of it at the start, it is
  // unrecoverable later.
  int32 at_media_sec = 6;

  // The absolute instant, AS WELL: the studio timestamps in venue time and the
  // moderation journal needs it. Both are carried, never one alone.
  google.protobuf.Timestamp sent_at = 7;

  // Monotonic per date. It is the RESUME POINT of the realtime stream: a console
  // reopened at 21:40 must be able to replay from 20:30, and a mobile returning
  // from the background must know what it missed.
  uint64 seq = 8;

  arthome.common.v1.LocalizedText body = 9;
}

// A removed message that stays on screen is a moderation failure: this event
// must reach open screens in under two seconds.
// The PUBLIC surface never receives a removed message; the studio sees both
// states.
message MessageStateChanged {
  string message_id = 1;
  string date_id = 2;
  MessageState state = 3;
  StateChangeOrigin origin = 4;
  uint64 seq = 5;
  google.protobuf.Timestamp occurred_at = 6;
  arthome.common.v1.Actor changed_by = 7;
}

// ---------------------------------------------------------------- moderation

// The second verdict is REFUSED and carries the winning decision — author and
// verdict — so the screen can show "X has already deleted this message" instead
// of a bare failure. A bare refusal would force a second round trip in the
// middle of a live show.
//
// Claiming is a SHORT LEASE, not a write: a moderator whose phone dies must not
// freeze a row for the whole live show.
// "Claiming is not settling: as long as your colleague has returned no verdict,
// your sanction applies" — that is a supersession, hence a precedence rule, and
// it is why moderation commands are CONDITIONAL and not blindly idempotent
// (E3).
message ModerationSettled {
  string moderation_item_id = 1;
  string message_id = 2;
  string date_id = 3;
  string channel_id = 4;
  ModerationItemState state = 5;
  ModerationVerdict verdict = 6;
  ModerationReason reason = 7;
  uint32 reports_count = 8;
  int32 at_media_sec = 9;
  google.protobuf.Timestamp settled_at = 10;

  // Who settled. May be a NON-HUMAN actor: `Actor.surface` carries
  // SURFACE_SYSTEM, and `account_id` is then empty. No new shape is needed for an
  // automatic moderator to return a verdict.
  arthome.common.v1.Actor settled_by = 11;

  // THE ORIGIN OF THE SETTLEMENT, and it SURVIVES the settlement.
  // Without it, "removed by the filter, then confirmed by X" collapses into
  // "removed by X", and we lose what it takes to measure the filter's quality
  // later. Free now, unrecoverable later — the same reasoning as a message's
  // media anchor.
  StateChangeOrigin origin = 12;

  // Filled in when a human CONFIRMS (or overturns) an automatic decision.
  // The precedence is written in one direction only: a human may overturn an
  // automatic decision, NEVER the reverse — otherwise a retroactive filter would
  // erase a judgement already made.
  arthome.common.v1.Actor confirmed_by = 13;
  google.protobuf.Timestamp confirmed_at = 14;

  // THE SETTLEMENT AXIS, distinct from the version that carries the lease.
  // Only a verdict increments it; claiming then releasing does not touch it. It
  // is what a conditional command targets.
  // See data-model.md §6.1: a single counter cannot express "refuse if settled,
  // accept if merely claimed".
  uint64 decision_version = 15;
}

// A sanction carries an EXPIRY INSTANT, never a label: "no limit", 1 min,
// 10 min, 1 h and a free-form duration are one single field, computed once.
// `expires_at` absent = no limit.
message AudienceSanctioned {
  string audience_member_id = 1;
  string channel_id = 2;
  string account_id = 3;
  AudienceSanctionKind kind = 4;
  google.protobuf.Timestamp expires_at = 5;
  ModerationReason reason = 6;
  google.protobuf.Timestamp occurred_at = 7;
  arthome.common.v1.Actor sanctioned_by = 8;
}

message AudienceSanctionLifted {
  string audience_member_id = 1;
  string channel_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
  arthome.common.v1.Actor lifted_by = 4;
  // True when it is the expiry, and not a human act, that lifted the sanction.
  // The journal must tell the two apart.
  bool expired = 5;
}
