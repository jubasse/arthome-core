// Types shared by every context.
//
// Rules that govern this file:
//   - an amount is a whole minor unit + an ISO 4217 currency code;
//     never a formatted string — formatting is presentation;
//   - an instant is a `google.protobuf.Timestamp`, always in UTC;
//     crossing into JSON it becomes an ISO 8601 string;
//   - a time zone is an IANA identifier, never an offset in minutes (D3);
//   - an interface label NEVER travels: the API returns codes.
//     The only two exceptions are CONTENT and carry the language they were
//     written in: the standby-screen message written by the run desk, and the
//     studio shop's texts. Hence `LocalizedText`.
syntax = "proto3";

package arthome.common.v1;

// An amount. Canonical unit: the currency's smallest unit, as an integer.
message Money {
  // Cents for EUR and CHF. May be negative (credit note, refund).
  int64 amount_minor = 1;
  // ISO 4217, uppercase. "EUR", "CHF", "CAD".
  string currency_code = 2;
}

// A text that was WRITTEN, as opposed to an interface label.
// Appears only where a human wrote a sentence nobody will translate by key.
message LocalizedText {
  // BCP 47: "fr", "en".
  string content_language = 1;
  string text = 2;
}

// An image ALREADY produced at a size that is actually displayed.
// Never a URL recipe with a width template: on a 1 GB television, a 4K
// background decoded for a thumbnail costs as much as a full screen.
message ImageRendition {
  string url = 1;
  uint32 width_px = 2;
  uint32 height_px = 3;
}

// An entity's image set, in the two aspect ratios the surfaces display.
message MediaSet {
  // 16:9, smallest to largest.
  repeated ImageRendition wide = 1;
  // 2:3 or 3:4 depending on the surface, smallest to largest.
  repeated ImageRendition poster = 2;
}

// The surface an act was performed from. The studio journal is by-name AND
// situated: "who decided, when, from which surface".
enum Surface {
  SURFACE_UNSPECIFIED = 0;
  SURFACE_STOREFRONT_WEB = 1;
  SURFACE_STOREFRONT_MOBILE = 2;
  SURFACE_STOREFRONT_TV = 3;
  SURFACE_STUDIO_WEB = 4;
  SURFACE_STUDIO_MOBILE = 5;
  // A server rule: automatic standby screen, lease expiry, garbage collection.
  // A non-human actor is an actor all the same.
  SURFACE_SYSTEM = 6;
}

// Who caused the fact. Absent when the fact has no human author.
message Actor {
  // Empty for SURFACE_SYSTEM.
  string account_id = 1;
  // The person, when the act is a studio one. Empty on the storefront side.
  string person_id = 2;
  Surface surface = 3;
}

// The venue's time zone, served alongside the UTC instant it qualifies.
// "The viewer's time first, the venue's time second when it differs" is a
// principle of the file, and it is inapplicable if either one is missing. The
// instant itself is carried by the message that includes this block.
message VenueClock {
  // IANA identifier, "Europe/Paris". Never an abbreviation, never a stored
  // offset (D3): a frozen offset does not survive a daylight-saving change, and
  // a date scheduled six months out would display wrongly.
  string venue_timezone = 1;

  // The offset COMPUTED BY THE SERVER for the qualified instant, in minutes.
  // This is not a return to D3's frozen offset: it is a served value,
  // recomputed at every serve, never stored. It avoids bundling a time zone
  // database into five applications, so the computation happens only once.
  int32 venue_utc_offset_min = 2;
}
