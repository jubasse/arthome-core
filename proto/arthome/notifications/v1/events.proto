// Events of the `notifications` context — reaching a person outside the
// application.
//
// This context DOES NOT OWN the thresholds that trigger an alert: they are
// domain and live in @arthome/core — "30 minutes before", "85% of the seats",
// "6 hours before expiry", "queue beyond ten messages", "post unassigned at
// D-1". It reads them, it does not invent them. Copied per surface, they would
// diverge: the web would say 30 minutes, the TV 15, and mobile would be right
// by accident.
//
// Maturity: PROVISIONAL (milestone 6).
syntax = "proto3";

package arthome.notifications.v1;

import "google/protobuf/timestamp.proto";

// The THIRD channel is named nowhere in the file: the grid offers three
// channels per trigger, only two are named (`push`, `email`), and the phone
// field carries the note "for reminder SMS".
//
// I propose NOTIFICATION_CHANNEL_IN_APP and not `sms`. Reason: an SMS channel
// has a per-message cost, a regulation of its own (consent, hours, opt-out) and
// one more provider, for a value nothing has tested. `in_app` is free, already
// served by the existing notification centre, and promises nothing we cannot
// keep. TO BE CONFIRMED BY THE CHIEF: this is a proposal, not an observation.
enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_PUSH = 1;
  NOTIFICATION_CHANNEL_EMAIL = 2;
  NOTIFICATION_CHANNEL_IN_APP = 3;
}

enum DeliveryFailureReason {
  DELIVERY_FAILURE_REASON_UNSPECIFIED = 0;
  // Dead push token: the application was uninstalled or the token rotated.
  // Cleaning up is a consequence, not an error.
  DELIVERY_FAILURE_REASON_TOKEN_INVALID = 1;
  DELIVERY_FAILURE_REASON_PROVIDER_REJECTED = 2;
  DELIVERY_FAILURE_REASON_BOUNCED = 3;
  DELIVERY_FAILURE_REASON_RATE_LIMITED = 4;
}

message DeliveryFailed {
  string notification_id = 1;
  string account_id = 2;
  NotificationChannel channel = 3;
  DeliveryFailureReason reason = 4;
  // Present for NOTIFICATION_CHANNEL_PUSH. Consumed by `identity` to detach a
  // dead token from the device.
  string device_id = 5;
  google.protobuf.Timestamp occurred_at = 6;
}
