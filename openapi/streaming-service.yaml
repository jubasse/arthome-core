  /v1/playback/sessions/{sessionId}/renew:
    post:
      operationId: renewPlaybackTicket
      summary: Renews the token and extends the lease, without restarting playback.
      description: |
        **Every `PLAYBACK_RENEWAL_INTERVAL_SECONDS`**, for a token of `PLAYBACK_TOKEN_LIFETIME_SECONDS` and a
        lease of `PLAYBACK_LEASE_SECONDS` (`@arthome/core`). It is the renewal that carries the
        concurrent-screen limit, and it re-runs `decideWatch`: **the client learns within the renewal
        interval** that it is no longer entitled, while **the edge may keep serving it for up to the
        token's lifetime** (D-020).

        The response contains **nothing that would force a manifest reload**: the path is stable,
        only the signature changes.

        **A distinct refusal code per screen**: a generic code would produce a false one.

        **Refused (`403`).** `watch.seat_expired` · `watch.concurrent_limit_reached` (the session another
        device's opening took over, D-117) · `identity.signed_out_elsewhere` · `watch.preview_exhausted` ·
        `watch.date_interrupted` · `watch.live_ended`, and any other watch code, `watch.date_cancelled` on
        air included. `identity.signed_out_elsewhere` is what the television signed out from the web
        sees — **not a network error**. **Real window: up to `PLAYBACK_TOKEN_LIFETIME_SECONDS`** — see
        `revokeDevice`.
      x-arthome-maturity: provisional
      x-arthome-upstream:
      - streaming
      tags:
      - playback
      x-arthome-idempotency-exemption: |
        **A renewal must produce a fresh window, never a memorised one.** Returning the original
        response would return a token already part-spent — and, at the worst moment, an already
        expired one — when the call exists precisely to obtain a new one. It is also this renewal
        that carries the concurrent-screen limit: replaying it from a store would bypass the count.
      x-arthome-requires:
      - name: callerService
        issuers:
        - arthome.bff-storefront
      x-arthome-internal: true
      security:
      - internalToken: []
      parameters:
      - $ref: '#/components/parameters/PlaybackSessionId'
      - $ref: '#/components/parameters/ViewerCountry'
      - $ref: '#/components/parameters/Deadline'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ActorSurface'
      responses:
        '200':
          description: Token renewed.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PlaybackRenewal'
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T19:00:00.000Z'
                data:
                  expiresAt: '2026-09-21T19:07:45.000Z'
                  renewAfterSec: 45
                  leaseExpiresAt: '2026-09-21T19:07:15.000Z'
                  signature:
                    queryToken: Expires=1790000120&Signature=def
                    cookieSet: null
                  qualityCap: fhd
          headers:
            Cache-Control:
              description: Non-negotiable. It is what keeps the secret out of the cache and out of the app snapshot.
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'A BFF the route does not serve, or a caller the loaded record refuses: the service authorises for itself.'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ApiForbiddenError'
                - $ref: '#/components/schemas/IdentitySignedOutElsewhereError'
                - $ref: '#/components/schemas/WatchConcurrentLimitReachedError'
                - $ref: '#/components/schemas/WatchPreviewExhaustedError'
              examples:
                api.forbidden:
                  $ref: '#/components/examples/ApiForbiddenError'
                identity.signed_out_elsewhere:
                  $ref: '#/components/examples/IdentitySignedOutElsewhereError'
                watch.concurrent_limit_reached:
                  $ref: '#/components/examples/WatchConcurrentLimitReachedError'
