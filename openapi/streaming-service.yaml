                  description: |
                    The action that leads out of the dead end. A code, never a sentence, and never a dead screen.

                    **Not nullable, and that is the point of `none` being a member.** `decideWatch` returns
                    `none` when there is nothing to offer, so the absence is **spelled** rather than left to a
                    null. Nullable would make `null` and `none` two spellings of one state, and a third
                    meaning — "not denied" — would attach itself to whichever the writer had in mind.

                    **And an ALLOWED verdict carries a real action.** A viewer watching on `scope: preview`
                    gets the seat action beside it (`buy_seat`, `join_waitlist`, or `none` once on the waiting
                    list), before D-089's cutoff; past it, `see_other_dates`. A surface reading `null` as "no action" would be right for
                    `denialReasonCode`, where null genuinely means *not denied*, and would silently drop the
                    preview-to-purchase step — the one path that turns a free viewer into a paying one. The
                    two fields look alike and must not be read alike.

                    **The two vocabularies are coupled, and the coupling is data rather than prose.**
                    A fallback action exists to answer a denial reason, so the invariant is: every reason maps
                    to an action that leads out of it, and every action answers at least one reason.
                    **`WATCH_FALLBACK_FOR` in `@arthome/core` holds the mapping**, with a spec asserting both
                    directions and asserting that `decideWatch` never returns a pairing the table forbids.

                    **This description used to restate that table row by row, and that was a parallel literal
                    table** — eleven rows of it, written to prevent drift, in a document that cannot be
                    executed, next to a table that can. So it is gone: the rule is here, the rows are in core,
                    and a surface that needs to know which action answers which reason reads the constant.

                    **One row deserves its argument in the contract rather than in the domain**, because it is
                    a contract obligation and not a domain preference: `adr-stream-entitlement.md` §3.3
                    requires a `watch.concurrent_limit_reached` refusal to be served with the list of active
                    sessions *"so the surface can offer to release one. A bare refusal would leave the viewer
                    with no way out"*. This contract stated that refusal for its whole life and had no action
                    expressing the remedy, which is the dead end principle 8 forbids. `release_a_screen` is
                    what closes it.

