    get:
      operationId: getRunConsole
      summary: The state of the run — one call, the whole control-room screen.
      description: |
        **The return path actually open is served** (`monitorPath`): the studio must **know** it so
        as not to promise the operator a latency it does not have. The contract carries the truth, not
        uniformity — creating a media branch to make a schema uniform would cost more than it returns.

        **Two fields, not one**: `state` and `afterGracePeriod`. The studio distinguishes "hiccup
        absorbed" from "publisher gone", and a two-second network break in a room must produce neither
        an incident nor a manifest restarted from zero.

        **The stream key is never here**: it appears in no list payload.
