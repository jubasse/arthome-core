  /v1/dates/{dateId}/run/technical-check:
    post:
      operationId: runTechnicalCheck
      summary: Starts the technical check.
      description: |
        Its success **unlocks publication**: `technical_check_passed` is one of the seven checklist
        items, and it comes from here. `catalog` **projects** it, it does not ask for it.
        `idle → on_air` is refused as long as the check has never passed.

        **What it proves** (D-114): a feed received on the date's key, in a codec the chain carries,
        above a bitrate floor, the channel's recommended bitrate or, until a channel serves one,
        `TECHNICAL_CHECK_BITRATE_FLOOR_KBPS_DEFAULT`. `failures` is the closed vocabulary
        `TECHNICAL_CHECK_FAILURES`, in its order: `no_feed` comes alone, since nothing else was measured.
      x-arthome-maturity: provisional
      x-arthome-upstream:
      - streaming
      tags:
      - run
      x-arthome-requires:
      - name: callerService
        issuers:
        - arthome.bff-studio
      x-arthome-internal: true
      security:
      - internalToken: []
      parameters:
      - $ref: '#/components/parameters/DateId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Deadline'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ActorSurface'
      responses:
        '200':
          description: The check's result, and the pre-flight checklist.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        passed:
                          type: boolean
                        passedAt:
                          anyOf:
                          - type: string
                            format: date-time
                          - type: 'null'
                        failures:
                          type: array
                          items:
                            type: string
                            x-arthome-vocabulary:
                            - no_feed
                            - codec_not_carried
                            - bitrate_below_floor
                            x-arthome-vocabulary-source: TECHNICAL_CHECK_FAILURES
                        sample:
                          type: object
                          properties:
                            measuredAt:
                              type: string
                              format: date-time
                            source:
                              type: string
                              x-arthome-vocabulary:
                              - ingest_server
                              - client_submitted
                              x-arthome-vocabulary-source: none
                              x-arthome-vocabulary-reason: A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change.
                              description: |
                                `client_submitted` for the end-to-end latency, measured in the control room by
                                `RTCPeerConnection.getStats()` on the WHEP return path and **submitted** — never a native
                                figure presented as end-to-end. If it is not measured, it is **absent**.
                            ingestUpKbps:
                              description: |
                                A **server-side** observation. Never to be confused with `deviceUpKbps`, which measures the
                                phone's uplink and not the encoder: **two different bitrates never carry the same name**. Only
                                the first feeds the pre-flight checklist.
                              anyOf:
                              - type: integer
                              - type: 'null'
                            deviceUpKbps:
                              anyOf:
                              - type: integer
                              - type: 'null'
                            latencyMs:
                              anyOf:
                              - type: integer
                              - type: 'null'
                            droppedPct:
                              type:
                              - number
                              - 'null'
                            jitterMs:
                              description: '**Omitted** over RTMP — there is no sense in serving it.'
                              anyOf:
                              - type: integer
                              - type: 'null'
                            lostPackets:
                              description: '**Omitted** over RTMP.'
                              anyOf:
                              - type: integer
                              - type: 'null'
                            viewers:
                              description: '**Absent — never zero — when the date is not on air.**'
                              anyOf:
                              - type: integer
                              - type: 'null'
                          required:
                          - measuredAt
                          - source
                          additionalProperties: {}
                          description: |
                            **Every metric is nullable, and the absence means something.** Jitter and lost packets
                            **exist only on a WebRTC ingest**; over RTMP, carried on TCP, they have no meaning, and the
                            contract **omits** them rather than serving zero. A zero reads as "perfect", not as "not
                            measured".

                            `measuredAt` is the instant of measurement **at the ingest**, not on reception: it is what
                            lets you display "bitrate 8.9 Mb/s, measured 3 s ago" or "last measurement 2 min ago" instead
                            of "0 Mb/s", which is a lie.
                      additionalProperties: {}
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T19:00:00.000Z'
                data:
                  passed: true
                  passedAt: '2026-09-21T18:45:00Z'
                  failures: []
                  sample:
                    measuredAt: '2026-09-21T18:44:58Z'
                    source: ingest_server
                    ingestUpKbps: 9100
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            X-Arthome-Served-At:
              $ref: '#/components/headers/ServedAt'
