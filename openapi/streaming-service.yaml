info:
  title: Arthome Streaming service
  version: 1.0.0
  summary: 'Streaming''s internal API: what the two BFFs call, never a surface.'
  description: |
    Contract of the **streaming service** (D-121). Only the BFFs call it, with the internal token
    they mint; no surface does, and no route here is public. It is generated from
    `@arthome/contracts/streaming-service-api`, as the BFFs' documents are from theirs.

    ## One operation, two servers

    An operation a surface reaches through a BFF keeps, here, its operation id, its path, its body,
    its answer and its refusal codes: the BFF relays one shape, and its typed client calls this
    document's operation as the surface calls the BFF's. Only what no surface sees, the progress
    batch, is this document's alone.

    ## Who calls

    Every route names the BFFs it serves (`x-arthome-requires`, `callerService`): the run desk serves
    the studio BFF, playback and progress the storefront BFF (D-118). Any other caller is refused
    `403` `api.forbidden`. The caller is read from the token and nowhere else: a body's `profileId`
    or `deviceId` other than the token's is refused `403` `api.forbidden` too, and a route that reads
    the profile refuses a token that names none the same way: the body never picks the profile.

    ## What every call carries

    `x-arthome-deadline`, past which the service writes nothing and answers `504`
    `api.deadline_exceeded`; `x-arthome-actor-surface` on every write, the place the event it emits
    names; the surface's `Idempotency-Key`, relayed as is, on a write that takes one;
    `x-arthome-viewer-country` on every call that decides a watch verdict.

    ## Errors

    The envelope of every Arthome error, and no BFF code: `502`, `503` and `api.upstream_timeout`
    are the BFF's own, answered when this service fails or is too slow.
  contact:
    name: Arthome — architecture
  license:
    name: UNLICENSED
