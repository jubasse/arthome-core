            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ApiForbiddenError'
                - $ref: '#/components/schemas/WatchNoSeatError'
                - $ref: '#/components/schemas/WatchRoomNotOpenError'
                - $ref: '#/components/schemas/WatchOutOfTerritoryError'
                - $ref: '#/components/schemas/WatchSubscriptionRequiredError'
                - $ref: '#/components/schemas/WatchNoReplayError'
                - $ref: '#/components/schemas/WatchReplayNotOnSaleError'
                - $ref: '#/components/schemas/WatchPreviewExhaustedError'
                - $ref: '#/components/schemas/WatchConcurrentLimitReachedError'
                - $ref: '#/components/schemas/WatchDateCancelledError'
                - $ref: '#/components/schemas/WatchNotPublishedError'
                - $ref: '#/components/schemas/WatchSeatExpiredError'
                - $ref: '#/components/schemas/WatchDateInterruptedError'
                - $ref: '#/components/schemas/WatchLiveEndedError'
              examples:
