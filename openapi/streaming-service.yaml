            The **technical** axis, and nothing else. `postponed` and `cancelled` are **withdrawn** from
            it: they were echoes of the outcome lodged in the technical state. A control room has no
            "cancelled" state — it has a stage sending nothing.
        afterGracePeriod:
          type: boolean
        ingestProtocol:
          type: string
          x-arthome-vocabulary:
          - rtmps
          - srt
          - whip
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: 'A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared.'
          description: '**Decides which metrics are actually available.**'
        monitorPath:
          type: string
          x-arthome-vocabulary:
          - whep
          - ll_hls
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: 'A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared.'
          description: |
            The return path **actually open**. WHEP under a second on a WHIP ingest, LL-HLS at a few
            seconds on an RTMP ingest. **The studio must know it so as not to promise the operator a
            latency it does not have** — the contract carries the truth, not uniformity. On the native
            shell, `whep` is not promised at tier 5 (D-019).
        monitorUrl:
          format: uri
          type:
          - string
          - 'null'
        qualityLadder:
          type: array
          items:
            type: object
            properties:
              renditionId:
                type: string
              heightPx:
                type: integer
              enabled:
                type: boolean
            additionalProperties: {}
        cameras:
          type: array
          items:
            type: string
        startedAt:
          format: date-time
          type:
          - string
          - 'null'
        lastSample:
          type: object
          properties:
            measuredAt:
              type: string
              format: date-time
            source:
              type: string
              x-arthome-vocabulary:
              - ingest_server
              - client_submitted
              x-arthome-vocabulary-source: none
              x-arthome-vocabulary-reason: A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change.
              description: |
                `client_submitted` for the end-to-end latency, measured in the control room by
                `RTCPeerConnection.getStats()` on the WHEP return path and **submitted** — never a native
                figure presented as end-to-end. If it is not measured, it is **absent**.
            ingestUpKbps:
              description: |
                A **server-side** observation. Never to be confused with `deviceUpKbps`, which measures the
                phone's uplink and not the encoder: **two different bitrates never carry the same name**. Only
                the first feeds the pre-flight checklist.
              anyOf:
              - type: integer
              - type: 'null'
            deviceUpKbps:
              anyOf:
              - type: integer
              - type: 'null'
            latencyMs:
              anyOf:
              - type: integer
              - type: 'null'
            droppedPct:
              type:
              - number
              - 'null'
            jitterMs:
              description: '**Omitted** over RTMP — there is no sense in serving it.'
              anyOf:
              - type: integer
              - type: 'null'
            lostPackets:
              description: '**Omitted** over RTMP.'
              anyOf:
              - type: integer
              - type: 'null'
            viewers:
              description: '**Absent — never zero — when the date is not on air.**'
              anyOf:
              - type: integer
              - type: 'null'
          required:
          - measuredAt
          - source
          additionalProperties: {}
          description: |
            **Every metric is nullable, and the absence means something.** Jitter and lost packets
            **exist only on a WebRTC ingest**; over RTMP, carried on TCP, they have no meaning, and the
            contract **omits** them rather than serving zero. A zero reads as "perfect", not as "not
            measured".

            `measuredAt` is the instant of measurement **at the ingest**, not on reception: it is what
            lets you display "bitrate 8.9 Mb/s, measured 3 s ago" or "last measurement 2 min ago" instead
            of "0 Mb/s", which is a lie.
        incident:
          $ref: '#/components/schemas/StudioIncident'
        chapters:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              vocabId:
                type: string
              atMediaSec:
                type: integer
            additionalProperties: {}
        presence:
          description: |
            **Who is online on this channel, with their roles and their last activity.** It is the
            **snapshot** of what the `channel:{id}` room pushes every ~10 s, and a room that
            broadcasts a differential without exposing a snapshot is not a contract: a console
            opened at 21:40 had nothing to paint and stayed that way until the next change.

            It is **not cosmetic**. The cut confirmation reads "cutting ends the broadcast for N
            viewers · **M other people online**", and that sentence is the guard rail on the most
            destructive act in the run desk, **in a studio deliberately without a lock**. Unserved,
            the guard rail reads "0 other people online" — the same screen as "you are alone", and
            false.

            Composed by the BFF from `identity.GetChannelPresence`, which `context-map.md` §10.1
            already counts among the run desk's three internal calls. Fan-out 2 for this operation,
            under the threshold of 4.
          type: array
          items:
            type: object
            properties:
              personId:
                type: string
                format: uuid
              displayName:
                type: string
              roles:
                type: array
                items:
                  type: string
                  x-arthome-vocabulary:
                  - artist
                  - production
                  - coordination
                  - director
                  - video
                  - sound
                  - moderation
                  - treasury
                  x-arthome-vocabulary-source: MEMBER_ROLES
                description: |
                  **A set**, as everywhere else in this document: the eight canonical values, never the
                  fallback to six. Presence is read next to a cut button, and `director` there is not
                  `video`.
              lastActivityAt:
                type: string
                format: date-time
                description: |
                  **An instant, never "active 2 min ago".** The sentence belongs to the surface and is
                  computed against `servedAt`; the contract carries the instant, like every other
                  countdown here.
              isSelf:
                type: boolean
                description: |
                  **Served, because the sentence the screen shows says "M OTHER people online".** The
                  surface holds its own `personId` from the bootstrap and could subtract itself — and two
                  surfaces subtracting differently is exactly how a guard rail ends up off by one on the
                  one screen where it guards a cut.
            required:
            - personId
            - displayName
            - roles
            - lastActivityAt
            - isSelf
            additionalProperties: {}
            description: |
              A crew member online **on the channel**. The scope is the channel, not the date: presence
              follows the person, and the run desk is simply where it is read.
        chatThroughputPerMinute:
          description: |
            **Measured by the server, in a declared unit**: a 60 s sliding window, unit
            messages/minute, refreshed every 5 s. The console's switching threshold (60 msg/min) reads
            against **that measurement** — not against "number of messages ÷ hours elapsed", which is not
            the same thing.
          anyOf:
          - type: integer
          - type: 'null'
        grossRevenue:
          description: '**Absent** without `canRevenue`. The `:revenue` real-time room is separate for the same reason.'
          type: object
          properties:
            amountMinor:
              type: integer
              format: int64
              examples:
              - 2400
            currencyCode:
              type: string
              pattern: ^[A-Z]{3}$
              examples:
              - EUR
          required:
          - amountMinor
          - currencyCode
          additionalProperties: {}
          x-arthome-tax-basis: inclusive
          x-arthome-restricted: canRevenue
        version:
          type: integer
      required:
      - dateId
      - state
      - afterGracePeriod
      - ingestProtocol
      - monitorPath
      additionalProperties: {}
      description: |
        The state of the run, served in **one** call. The studio distinguishes **"hiccup absorbed"**
        from **"publisher gone"** — two fields, not one: a two-second network break in a room must
        produce neither an incident in the control room nor an HLS manifest restarted from zero.
    StudioIncident:
      anyOf:
      - type: object
        properties:
          id:
            type: string
            format: uuid
          kind:
            type: string
            x-arthome-vocabulary:
            - hold_screen
            - postponed
            - cancelled
            - interrupted
            x-arthome-vocabulary-source: INCIDENT_KINDS
            description: The **outcome** the viewer sees.
          cause:
            type: string
            x-arthome-vocabulary:
            - venue_feed_lost
            - run_desk_disconnected
            - bitrate_collapsed
            - compatibility_worker_failed
            - provider_error
            - manual
            x-arthome-vocabulary-source: INCIDENT_CAUSES
            description: |
              The **cause**, a distinct vocabulary. `compatibility_worker_failed` exists because a
              transcoding *worker* must never die silently — otherwise the control room sees a player that
              never starts, with no cause.
          trigger:
            type: string
            x-arthome-vocabulary:
            - manual
            - auto
            x-arthome-vocabulary-source: INCIDENT_TRIGGERS
            description: |
              The **automatic** holding screen produces an incident **of the same kind** as a manual
              trigger — that is the right answer to the "the stage manager is unreachable" case. The log
              must nonetheless tell the two apart.
          message:
            description: |
              Written by the control room: **content**, with its authoring language. The catalogue supplies
              **templates** per kind of incident, which the control room reuses or replaces.
            type: object
            properties:
              contentLanguage:
                type: string
                examples:
                - fr
              text:
                type: string
            required:
            - contentLanguage
            - text
            additionalProperties: {}
          raisedAt:
            type: string
            format: date-time
          raisedBy:
            type: object
            properties:
              accountId:
                format: uuid
                type:
                - string
                - 'null'
              personId:
                format: uuid
                type:
                - string
                - 'null'
              displayName:
                type:
                - string
                - 'null'
              surface:
                type: string
                x-arthome-vocabulary:
                - storefront_web
                - storefront_mobile
                - storefront_tv
                - studio_web
                - studio_mobile
                - system
                x-arthome-vocabulary-source: SURFACES
                description: |
                  **One vocabulary, six members** — `SURFACES` — with the narrowing said here rather than
                  written as a second, shorter list. A studio payload carries `studio_web`, `studio_mobile`
                  or `system` and never the three storefront surfaces, **by construction**: the actor is
                  whoever called this BFF. Declaring only three would be a second authored list for a field
                  the domain already defines, which is how E4 started.
            required:
            - surface
            additionalProperties: {}
            description: |
              Who caused the fact. **Empty for `system`** — a server rule (an automatic holding screen, a
              lease expiring) is an actor all the same, and the log must be able to tell it apart from a
              human decision.
        required:
        - id
        - kind
        - cause
        - trigger
        - raisedAt
        additionalProperties: {}
      - type: 'null'
      description: |
        **Cause and outcome are two vocabularies**, and conflating them was the original fault:
        `catalogue.incidentMessages` carries only four entries, **which are outcomes**.
    PlaybackTicket:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
          description: |
            **Recoverable after an OS kill.** The token being `no-store`, a client killed by the OS no
            longer has this `sessionId`: it could neither renew, nor release, nor point at its own
            session in the refusal list. Reopening with the **same `deviceId`** returns the same
            session — that is the mechanism, and it is declared.
        resumedExistingSession:
          description: |
            True when this opening **took over this device's existing lease** instead of opening a second
            one. This is what stops a household being blocked by its own ghost screens — and it is
            decisive for a `pass` subscriber, whose ceiling is **one** screen: without takeover,
            reopening the app after an OS kill locks them out of their own phone for the lease's lifetime
            (`PLAYBACK_LEASE_SECONDS`).
          type: boolean
        dateId:
          type: string
          format: uuid
        scope:
          type: string
          x-arthome-vocabulary:
          - full
          - preview
          x-arthome-vocabulary-source: WATCH_SCOPES
          x-arthome-vocabulary-narrowing: '`none` is a verdict, not a ticket: a ticket exists only where playback was allowed, so a scope of `none` here would be a token for watching nothing.'
          description: |
            **A strict narrowing of `WATCH_SCOPES`, and the missing member is the rule.** `none` is a
            verdict, not a ticket: a ticket exists only where playback was allowed, so a scope of
            `none` here would be a token for watching nothing. `WatchVerdict.scope` carries all three
            because a verdict can say no; this one cannot.

            `preview` for a non-holder, on air only (D-110). While the budget is spent its token expires at
            the earlier of `PLAYBACK_TOKEN_LIFETIME_SECONDS` and the seconds left (`previewTokenExpiresAt`):
            **reloading the page extends nothing**, and a reinstalled app resets no counter — the budget
            is **server-side**, per **account**.
        previewSecondsLeft:
          anyOf:
          - type: integer
          - type: 'null'
        protocol:
          type: string
          x-arthome-vocabulary:
          - hls
          - dash
          x-arthome-vocabulary-source: PLAYBACK_PROTOCOLS
        drmSystem:
          description: |
            **Chosen by the server for this device.** The fleet imposes HLS + FairPlay on tvOS and
            DASH + Widevine elsewhere, PlayReady on certain models: **a client that guesses gets it
            wrong**, and it gets it wrong on the devices we cannot test.
          x-arthome-vocabulary:
          - fairplay
          - widevine
          - playready
          x-arthome-vocabulary-source: DRM_SYSTEMS
          type:
          - string
          - 'null'
        qualityCap:
          type: string
          x-arthome-vocabulary:
          - sd
          - hd
          - fhd
          - uhd
          x-arthome-vocabulary-source: QUALITY_CAPS
          description: |
            The ceiling the device's **hardware** security level allows. An entry-level HDMI stick offers
            only software Widevine: the server **degrades cleanly** rather than refusing, and the surface
            **knows** it has been capped — so it does not offer "4K" in its quality panel.
        manifestUrl:
          type: string
          format: uri
          description: |
            **The path is stable and never carries the token.** A token in the path would force a
            manifest reload on every renewal, hence a micro-freeze every N minutes — visible on a static
            theatre shot. Stream paths are random and unpredictable.
        signature:
          type: object
          properties:
            queryToken:
              anyOf:
              - type: string
                format: password
                x-arthome-sensitive: true
              - type: 'null'
            cookieSet:
              type:
              - boolean
              - 'null'
          additionalProperties: {}
          description: 'The signature covers a **path prefix**: signing the manifest and leaving the segments open is signing nothing.'
        edgeRenewalMode:
          type: string
          x-arthome-vocabulary:
          - signed_cookie
          - query_token
          x-arthome-vocabulary-source: EDGE_RENEWAL_MODES
          description: |
            **Declared, never guessed**: the two mechanisms are not equally available. `signed_cookie` for
            a browser — a same-origin call resets the cookie, zero URL change, zero interruption.
            `query_token` for native players, which reapply the current token through their request
            filter. `AVPlayer` on tvOS does not share the WebView's cookies: it is
            `AVAssetResourceLoaderDelegate`, and that is **the point to validate on a real device before
            promising anything**.
        expiresAt:
          type: string
          format: date-time
          description: |
            **`PLAYBACK_TOKEN_LIFETIME_SECONDS`** (D-020). The client learns it is no longer entitled
            within the renewal interval, but the edge may keep serving it until the token in hand expires.
        renewAfterSec:
          type: integer
          examples:
          - 45
          description: '**`PLAYBACK_RENEWAL_INTERVAL_SECONDS`**, under the ceiling the TV requires: it is the renewal that carries the concurrent-screen limit.'
        leaseExpiresAt:
          type: string
          format: date-time
          description: |
            **`PLAYBACK_LEASE_SECONDS`.** It is the **lease** that carries the concurrent-screen limit, not a release command:
            a television gets unplugged, a set-top box loses power, the OS kills a mobile app without
            warning. `releasePlayback` speeds it up, **nothing depends on it**.
        resumePoint:
          description: |
            **A replay's only.** A live gives no control of playback and records no position (D-111),
            so a live's ticket carries none.
          anyOf:
          - type: object
            properties:
              positionSec:
                type: integer
              writtenAt:
                type: string
                format: date-time
            additionalProperties: {}
          - type: 'null'
        liveEdgeSec:
          anyOf:
          - type: integer
          - type: 'null'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
        audioTracks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              language:
                type: string
              kind:
                type: string
                x-arthome-vocabulary:
                - main
                - audio_description
                x-arthome-vocabulary-source: none
                x-arthome-vocabulary-reason: A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change.
            additionalProperties: {}
        subtitleTracks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              language:
                type: string
              kind:
                type: string
                x-arthome-vocabulary:
                - subtitles
                - captions
                - surtitles
                x-arthome-vocabulary-source: none
                x-arthome-vocabulary-reason: A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change.
            additionalProperties: {}
        chatMode:
          type: string
          x-arthome-vocabulary:
          - open
          - emoji
          - read_only
          - 'off'
          x-arthome-vocabulary-source: CHAT_MODES
        chatRateLimitPerSecond:
          type: integer
        incident:
          $ref: '#/components/schemas/Incident'
        date:
          type: object
          properties:
            id:
              type: string
              format: uuid
            showId:
              type: string
              format: uuid
            channelId:
              type: string
              format: uuid
            artist:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                  examples:
                  - Compagnie Verticale
                verified:
                  type: boolean
                avatar:
                  type: object
                  properties:
                    url:
                      type: string
                      format: uri
                    widthPx:
                      type: integer
                      minimum: 1
                    heightPx:
                      type: integer
                      minimum: 1
                  required:
                  - url
                  - widthPx
                  - heightPx
                  additionalProperties: {}
                  description: |
                    A visual **already rendered at a size actually displayed**, never a URL recipe with a width
                    template: on a television with 1 GB, a 4K backdrop decoded for a thumbnail costs as much as a
                    full screen.
              required:
              - id
              - name
              additionalProperties: {}
            slug:
              type: string
              examples:
              - '2026-09-21'
            canonicalUrl:
              type: string
              format: uri
              description: |
                **Served, never built by the surface.** It is what gets shared, bookmarked, what a reminder
                and a notification point at, and what gets indexed — and it is what the television encodes in
                a QR code for the Share action, since a television has neither a clipboard nor a useful
                messaging app.
            title:
              type: string
            categoryId:
              type: string
              examples:
              - dance-contemporary
            genreIds:
              description: '**Multiple**: a show is both "contemporary" and "repertoire" at once. The singular forbade it (E9).'
              type: array
              items:
                type: string
            tagIds:
              type: array
              items:
                type: string
            startsAt:
              type: string
              format: date-time
            venueClock:
              type: object
              properties:
                venueTimezone:
                  type: string
                  pattern: ^[A-Za-z][A-Za-z0-9_+-]*(?:\/[A-Za-z0-9_+-]+)+$
                  examples:
                  - Europe/Paris
                venueUtcOffsetMin:
                  type: integer
                  minimum: -720
                  maximum: 840
                  examples:
                  - 120
              required:
              - venueTimezone
              - venueUtcOffsetMin
              additionalProperties: {}
              description: |-
                The venue's timezone, served alongside the UTC instant it qualifies. The offset is
                **computed by the server for that instant**, never stored: this is not a return to a frozen
                offset, it is a served value, and it avoids embedding a timezone database in five
                applications.
            runtimeMin:
              type: integer
            venue:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                city:
                  type: string
                countryCode:
                  type: string
                  pattern: ^[A-Z]{2}$
              additionalProperties: {}
            roomOpensAt:
              type: string
              format: date-time
              description: |
                The **instant** the room opens, served. The surface schedules the switch locally, to the
                second, **without a single call**: a standby mode running for eight hours therefore makes no
                request at all.
            displayState:
              type: string
              x-arthome-vocabulary:
              - draft
              - reserve
              - scheduled
              - technical
              - room_open
              - live
              - replay
              - ended
              - postponed
              - cancelled
              - interrupted
              x-arthome-vocabulary-source: DISPLAY_STATES
              examples:
              - live
              description: |
                The **only** state value the cards display, and nobody recomposes it. Produced by
                `publicDisplayStateOf(publication, run, outcome, instants, now)` in `@arthome/core`. The
                hierarchy, written once: `outcome` outranks `run.state`, which outranks `publication.state`.

                **One vocabulary, eleven members, and the narrowing is said here rather than written as a
                second list.** A storefront never receives `draft`, `reserve` or `technical` — not by
                filtering, but **by construction**: a date reaches a public surface only once it is
                published, and a published date under technical check is shown on the time axis. Declaring only the eight would be a second authored list for a field the
                domain already defines, and two independently authored lists for one field is how E4
                started. A surface that wants to know what it can actually receive reads this sentence;
                the vocabulary stays the domain's.
            displayStateValidUntil:
              anyOf:
              - type: string
                format: date-time
              - type: 'null'
              description: |
                The instant the displayed state stops being true, the one `publicDisplayStateOf` returns.
                **`null` when only an event can change it**: an outcome, or a date fully over. Never an
                invented instant: a surface that re-runs the rule at a made-up time shows a false state.
            outcome:
              description: |
                The outcome **replaces the state on every card**, not only on the detail page. It is a fact
                about the performance, never erased; only a postponement can be followed by another outcome
                (D-076). A postponement moves the date to `rescheduledTo` and replaces the state only until the
                room opens there.
              x-arthome-vocabulary:
              - postponed
              - cancelled
              - interrupted
              x-arthome-vocabulary-source: DATE_OUTCOMES
              type:
              - string
              - 'null'
            rescheduledTo:
              anyOf:
              - type: string
                format: date-time
              - type: 'null'
            viewers:
              description: |
                **Absent — never zero — when the date is not on air.** A zero reads as "nobody", not as "not
                measured", and the brief's rule forbids "0 WATCHING".
              anyOf:
              - type: integer
              - type: 'null'
            availability:
              description: Projected from `ticketing`. Absent while no price is active.
              anyOf:
              - type: object
                properties:
                  seatsAvailable:
                    type: integer
                  waitlistCount:
                    type: integer
                  fillRateBps:
                    description: |
                      The **rate**, not the capacity. Serving the capacity and letting the client compute recreates
                      the value composed in two places, and the design proves it by applying a constant of 2,000
                      seats regardless of the venue.
                    type: integer
                  soldOut:
                    type: boolean
                  lowestPrice:
                    type: object
                    properties:
                      amountMinor:
                        type: integer
                        format: int64
                        examples:
                        - 2400
                      currencyCode:
                        type: string
                        pattern: ^[A-Z]{3}$
                        examples:
                        - EUR
                    required:
                    - amountMinor
                    - currencyCode
                    additionalProperties: {}
                    description: |-
                      An amount. **Integer minor unit** — cents for EUR and CHF — plus an ISO 4217 currency code.
                      Never a formatted string: formatting is presentation and happens client-side. May be negative
                      (credit, refund).

                      **`Money` says nothing about tax, and that is deliberate.** It carries credits, refunds,
                      commissions and payouts as well as prices. **A price, however, is tax-inclusive** (D-056),
                      and every field that is one says so where it is declared rather than relying on this shape —
                      a reader who assumes the wrong side of a VAT rate computes a total that is wrong by that
                      rate, and `Money` is not the place that can warn them.
                    x-arthome-tax-basis: inclusive
                  promotion:
                    anyOf:
                    - type: object
                      properties:
                        reason:
                          type: string
                          x-arthome-vocabulary:
                          - pre_sale
                          - preview_night
                          - discovery_rate
                          - final_date
                          - late_rate
                          x-arthome-vocabulary-source: PROMOTION_REASONS
                        struckPrice:
                          type: object
                          properties:
                            amountMinor:
                              type: integer
                              format: int64
                              examples:
                              - 2400
                            currencyCode:
                              type: string
                              pattern: ^[A-Z]{3}$
                              examples:
                              - EUR
