  /v1/playback/sessions/{sessionId}/release:
    post:
      operationId: releasePlayback
      summary: Releases a playback session — speeds things up, guarantees nothing.
      description: |
        **Nothing depends on it.** A television is unplugged, a set-top box cuts out, the operating
        system kills a mobile application without warning: it is the **lease** that expires (`PLAYBACK_LEASE_SECONDS`),
        never this call that closes. A session that only closed on a client event would leave a ghost
        screen, and the viewer would be refused their own second playback.

        The client can **resume its own session**, identified by `deviceId`: reopening the player on
        the same device reuses the lease instead of opening a second one.
      x-arthome-maturity: provisional
      x-arthome-upstream:
      - streaming
      tags:
      - playback
      x-arthome-idempotency-exemption: |
        **Idempotent by nature, and nothing depends on it.** Releasing twice leaves the same state,
        and it is the **expiring lease** that is authoritative — this call merely speeds things up. A
        key would protect an effect that has neither accumulation nor consequence.
      x-arthome-requires:
      - name: callerService
        issuers:
        - arthome.bff-storefront
      x-arthome-internal: true
      security:
      - internalToken: []
      parameters:
      - $ref: '#/components/parameters/PlaybackSessionId'
      - $ref: '#/components/parameters/Deadline'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ActorSurface'
      responses:
        '204':
          description: Done.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /v1/me/progress/{dateId}:
    put:
      operationId: recordPlaybackPosition
      summary: Records the playback position.
      description: |
        **The most frequent write in the system.** It carries **no** idempotency key: one key per
        30 s slice, per viewer and per live show would make the idempotency store the hottest table
        in `streaming`, to protect a write whose loss has no consequence.

        Expected cadence: **on pause, on exit, on end, and a 30-to-60 s heartbeat**, plus a **forced
        write when going to the background**.

        **A late write is accepted**: the last position must be taken even if it arrives **after** a
        `releasePlayback` — a television can be cut off at any moment.

        **Last writer wins, and the ordering comes from the server.**

        **No position is recorded during a live** (D-111): a live gives no control of playback, so no
        resume point comes from it. A write then is answered with the stored point, unchanged, so an old
        client stays harmless.

        **On the service, the profile is the token's** (`pro`), never the body's: a call whose token names
        no profile is refused `403` `api.forbidden`, and so is a body `profileId` other than the token's.
      x-arthome-maturity: provisional
      x-arthome-upstream:
      - streaming
      tags:
      - playback
      x-arthome-idempotency-exemption: |
        **The most frequent write in the system.** One key per 30-second slice, per viewer and per
        live show would make the idempotency store the hottest table in `streaming` — to protect a
        write whose loss has no consequence and whose rule is already "last writer wins, server
        ordering". The cost would be per minute of playback and per viewer.
      x-arthome-requires:
      - name: callerService
        issuers:
        - arthome.bff-storefront
      x-arthome-internal: true
      security:
      - internalToken: []
      parameters:
      - $ref: '#/components/parameters/DateId'
      - $ref: '#/components/parameters/Deadline'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ActorSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                positionSec:
                  type: integer
                  minimum: 0
                deviceId:
                  type: string
                  format: uuid
                completed:
                  default: false
                  type: boolean
              required:
              - positionSec
              - deviceId
            example:
              positionSec: 1840
              deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
              completed: false
      responses:
        '200':
          description: Position recorded, with the server ordering applied.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        positionSec:
                          type: integer
                        version:
                          type: integer
                      additionalProperties: {}
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T19:00:00.000Z'
                data:
                  positionSec: 1840
                  version: 212
          headers:
            Cache-Control:
              description: 'How long, and for whom, the answer may be kept: the route''s freshness family.'
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
  /v1/viewer-progress/batch:
    post:
      operationId: getViewerProgressBatch
      summary: A profile's points on many dates, in one read.
      description: |
        **The third per-viewer overlay** (`transport.md` §5.6): the storefront BFF merges the table
        into each card's `viewerProgress` by date id, so a screen of cards costs one call, never one per
        card. A date with no point is absent from the table.

        **On the service, the profile is the token's** (`pro`), never the body's: a call whose token names
        no profile is refused `403` `api.forbidden`, and so is a body `profileId` other than the token's.

        Refused, the storefront BFF serves the cards without the overlay (`degraded: ["viewerProgress"]`,
        `transport.md` §5.8).
      x-arthome-maturity: provisional
      x-arthome-upstream:
      - streaming
      tags:
      - playback
      x-arthome-idempotency-exemption: |
        A read, which writes nothing: it is a `POST` only because its ids do not fit in a query string
        (`transport.md` §5.6).
      x-arthome-requires:
      - name: callerService
        issuers:
        - arthome.bff-storefront
      x-arthome-budget-ms: 150
      x-arthome-internal: true
      security:
      - internalToken: []
      parameters:
      - $ref: '#/components/parameters/Deadline'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/ActorSurface'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profileId:
                  type: string
                  format: uuid
                dateIds:
                  minItems: 1
                  maxItems: 200
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
              - profileId
              - dateIds
            example:
              profileId: 019928b0-0000-7000-8000-000000000001
              dateIds:
              - 019928a0-7d31-7a10-b8c4-2f9e11a4c001
              - 019928a0-7d31-7a10-b8c4-2f9e11a4c002
      responses:
        '200':
          description: The points found, by date id; a date without one is absent.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      type: object
                      propertyNames:
                        type: string
                      additionalProperties:
                        $ref: '#/components/schemas/ViewerProgress'
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T19:00:00.000Z'
                data:
                  019928a0-7d31-7a10-b8c4-2f9e11a4c001:
                    positionSec: 1840
                    writtenAt: '2026-09-22T21:14:03.000Z'
                    completed: false
                    version: 212
          headers:
            Cache-Control:
              description: 'How long, and for whom, the answer may be kept: the route''s freshness family.'
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/DeadlineExceeded'
components:
  securitySchemes:
    internalToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        ES256, minted by the BFF for this service alone (`aud: arthome.streaming`) and short-lived
        (`transport.md` §5.2, `adr-auth.md` §8). It names the BFF (`iss`), the account (`sub`) and,
        when the session has them, the profile (`pro`) and the device (`did`): the route's principal.
  parameters:
    Deadline:
      name: x-arthome-deadline
      in: header
      required: true
      description: The RFC 3339 UTC instant after which the caller no longer waits. A service handed a past instant does nothing.
      schema:
        type: string
        format: date-time
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: |
        W3C trace context, created at the BFF when the surface sent none, and propagated unmodified
        (`transport.md` §5.2): it is the one the service injects into `outbox_event.tracecontext` at
        write time. A malformed one is never refused: a broken trace is an observability fault.
      schema:
        type: string
    ActorSurface:
      name: x-arthome-actor-surface
      in: header
      required: true
      description: |
        The surface the person wrote from, relayed by the BFF on every write (`transport.md` §5.2): the
        event the write emits names its actor's place (`common.proto` `Actor.surface`).
      schema:
        type: string
        enum:
        - storefront_web
        - storefront_mobile
        - storefront_tv
        - studio_web
        - studio_mobile
        - system
        x-arthome-vocabulary-source: SURFACES
        examples:
        - studio_web
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        The surface's key, relayed as is by the BFF (`transport.md` §5.2, §5.4): a key the BFF
        regenerated would protect nothing, since the surface is what replays. Scoped to the account the
        token names. A replayed key answers the first attempt's response, verbatim.
      schema:
        type: string
        format: uuid
        examples:
        - 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
    ViewerCountry:
      name: x-arthome-viewer-country
      in: header
      required: true
      description: |
        The viewer's country, ISO 3166-1 alpha-2, set by the BFF from the edge on every call that
        decides a watch verdict, or `ZZ` when the edge resolves none. It is resolved at every
        opening, never projected (`adr-stream-entitlement.md` §5): it changes between two reads.

        A date restricted by country refuses `ZZ` (`watch.out_of_territory`), failing closed for
        the rights holder; a date with no restriction ignores the header (`isAvailableIn`).
      schema:
        type: string
        pattern: ^[A-Z]{2}$
        examples:
        - FR
        - ZZ
    Surface:
      name: X-Arthome-Surface
      in: header
      required: true
      description: |
        The calling surface. It determines three **served** things, never guessed: the chat rate
        ceiling (television 2 msg/s, mobile 6, web 10), the size of the catch-up on entering a room
        (television 20 messages, 50 elsewhere) and which slice of the label and taxonomy catalogue to
        load.
        **A strict narrowing of `SURFACES`, and the strictness is the point.** The domain
        vocabulary has six members; this header accepts the three that can legitimately call the
        storefront BFF and **refuses the rest**, because an input is refused where an output is kept
        raw and treated as neutral. A studio surface reaching this header is not a value to tolerate,
        it is a caller in the wrong place.
      schema:
        type: string
        enum:
        - storefront_web
        - storefront_mobile
        - storefront_tv
        x-arthome-vocabulary-source: SURFACES
        x-arthome-vocabulary-narrowing: The three that may call the storefront BFF. A studio surface reaching this header is not a value to tolerate, it is a caller in the wrong place.
        examples:
        - storefront_tv
    DateId:
      name: dateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        examples:
        - 019928a0-7d31-7a10-b8c4-2f9e11a4c001
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlaybackSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    ServedAt:
      description: |
        Server instant **of this response**, sent with `Idempotency-Replayed`. On a replay it differs
        from the body's `servedAt`, which is the first attempt's: a replay proves an effect took
        place, it does not promise fresh data.
      schema:
        type: string
        format: date-time
    IdempotencyReplayed:
      description: Present and `true` when this answer replays the one stored for the same `Idempotency-Key`.
      schema:
        type: string
  responses:
    BadRequest:
      description: Refused by shape validation, a header included.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    const: api.schema_invalid
                  params:
                    type: object
                    properties:
                      issues:
                        type: array
                        items:
                          type: object
                          properties:
                            path:
                              type: array
                              items:
                                anyOf:
                                - type: string
                                - type: integer
                                  format: int64
                            rule:
                              type: string
                              x-arthome-vocabulary:
                              - too_small
                              - too_big
                              - invalid_type
                              - invalid_format
                              - invalid_value
                              - unrecognized_key
                              - custom
                              x-arthome-vocabulary-source: SCHEMA_ISSUE_RULES
                            minimum:
                              type: number
                            maximum:
                              type: number
                            inclusive:
                              type: boolean
                            format:
                              type: string
                            values:
                              type: array
                              items:
                                type:
                                - string
                                - number
                                - boolean
                                - 'null'
                          required:
                          - path
                          - rule
                          additionalProperties: {}
                    required:
                    - issues
                    additionalProperties: {}
                  traceId:
                    type: string
                    minLength: 1
                  nature:
                    type: string
                    x-arthome-vocabulary:
                    - refused
                    - unavailable
                    - offline_forbidden
                    x-arthome-vocabulary-source: FAILURE_NATURES
                    x-arthome-unknown-fallback: unavailable
                required:
                - code
                - params
                - traceId
                - nature
                additionalProperties: {}
              servedAt:
                type: string
                format: date-time
            required:
            - error
            - servedAt
            additionalProperties: {}
          example:
            error:
              code: api.schema_invalid
              nature: refused
              params:
                issues:
                - path:
                  - quantity
                  rule: too_small
                  minimum: 1
                  inclusive: true
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    Unauthorized:
      description: 'No internal token, or one refused: unsigned, expired, or minted for another service.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.unauthenticated
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    Forbidden:
      description: 'A BFF the route does not serve, or a caller the loaded record refuses: the service authorises for itself.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.forbidden
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    NotFound:
      description: Unknown record, or one that is not the caller's.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.not_found
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    Conflict:
      description: 'Refused by the state of the record or by a reused key: the `code` says which.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.idempotency_key_reused
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    PayloadTooLarge:
      description: The body is over the ceiling of the route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.payload_too_large
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    UnsupportedMediaType:
      description: The body is not `application/json`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.unsupported_media_type
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    InternalError:
      description: A fault of the service. The BFF answers its surface `502 api.upstream_unavailable`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.internal
              nature: unavailable
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    DeadlineExceeded:
      description: 'The deadline had passed: the service did nothing (`transport.md` §5.3).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.deadline_exceeded
              nature: unavailable
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
  schemas:
    EnvelopeMeta:
      type: object
