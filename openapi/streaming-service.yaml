  /v1/dates/{dateId}/run/go-on-air:
    post:
      operationId: goOnAir
      summary: Goes on air.
      description: |
        **The "go on air" command goes to `streaming`, not to `catalog`**: only `streaming` knows
        whether the feed is arriving. Publication **learns** of it afterwards, by event — two
        transitions out of eight are caused that way, which leaves `Publication` the aggregate of a
        single context.

        `idle → on_air` and `rehearsal → on_air` are **refused** `date.technical_check_required` if the
        technical check has never passed. Resuming after an incident (`interrupted → on_air`) needs
        none. `publication.transition_forbidden` comes when the date's publication cannot move to `live` from
        its current state.
