      description: |
        **`slug` et `canonicalUrl` étaient servis partout et acceptés nulle part.** Les
        identifiants de chemin sont des UUID ; les cinq occurrences de `slug` étaient toutes en
        sortie. Une notification poussée sur une application morte, un lien partagé, un favori,
        un résultat de moteur : tous livrent une **URL**, et rien au contrat ne savait la lire.

        Le trou dépassait le mobile : `canonicalUrl` est ce que le téléviseur encode dans le QR
        de l'action **Partager** — sur un téléviseur, partager ne peut pas vouloir dire copier un
        lien, il n'y a ni presse-papiers ni messagerie utile.

        **Résout, ne redirige pas.** La réponse nomme le type et l'identifiant, et la surface
        décide où aller : un lien profond mobile, une route Next et une page de téléviseur n'ont
        pas la même destination pour la même ressource.

        **Lecture publique** : un lien partagé s'ouvre avant toute connexion.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      x-arthome-freshness: 300
      security:
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - name: url
          in: query
          description: URL canonique complète. Exclusif avec `kind` + `slug`.
          schema: { type: string, format: uri }
        - name: kind
          in: query
          schema: { type: string, enum: [date, show, artist, category] }
        - name: slug
          in: query
          schema: { type: string }
      responses:
        '200':
          description: La ressource désignée, et de quoi peindre immédiatement.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
            Vary: { $ref: '#/components/headers/VaryAuth' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [kind, id, canonicalUrl]
                        properties:
                          kind: { type: string, x-arthome-vocabulary: [date, show, artist, category] }
                          id: { type: string }
                          canonicalUrl:
                            type: string
                            format: uri
                            description: |
                              **L'URL canonique de la cible**, qui peut différer de celle demandée :
                              un slug d'une autre langue, ou un slug remplacé, résout vers la forme
                              courante. C'est ce qui permet à la surface de corriger son URL plutôt
                              que d'en garder une périmée en favori.
                          date: { $ref: '#/components/schemas/DateCard' }
                          artist: { $ref: '#/components/schemas/ArtistSummary' }
              example:
                servedAt: '2026-09-21T18:02:50.000Z'
                data:
                  kind: date
                  id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  canonicalUrl: 'https://arthome.fr/fr/d/nuit-blanche-2026-09-21'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =============================================================== la date

  /v1/dates/{dateId}:
    get:
      operationId: getDateDetail
      tags: [date]
      summary: La fiche d'une date — série, suggestions, boutique, tarifs, dans la même réponse.
      description: |
        **Un appel**, et il doit être **bon marché** : la surface TV le pré-charge sur l'élément
        focalisé après stabilisation du focus, et un pré-chargement qui se paie deux fois est pire
        que pas de pré-chargement. D'où une validation de cache (`ETag`) et une fraîcheur déclarée.

        **Lecture publique.** Appelée **sans aucune authentification**, cette opération rend le
        **corps public** — identique pour tous les appelants anonymes, donc mutualisable dans un
        cache partagé. Les trois surcouches par spectateur (`watchVerdict`, `viewerRelations`,
        `viewerProgress`) sont alors **absentes**, jamais nulles. Appelée avec une session ou un
        jeton porteur, elle rend le corps public **plus** les surcouches, et devient privée.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog, ticketing, identity, streaming]
      # `chat` n'est PAS appelé : le régime de tchat est déjà PROJETÉ dans `date_detail_public`
      # par `chat.date_chat_policy_changed`. Il était à la fois projeté et appelé — un appel pour
      # une donnée qu'on possède déjà, et le seul écran du storefront à franchir le seuil de 4.
      security:
        # **Lecture publique.** L'absence totale d'authentification est un cas NOMINAL, pas une
        # erreur : cette lecture est la face indexable du produit, et le robot d'un moteur n'a ni
        # cookie, ni jeton porteur, ni moyen de s'en fabriquer un. Le mode visiteur emprunte le
        # même chemin. Voir « Lecture publique et lecture identifiée » en tête de document.
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      x-arthome-freshness: 60
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: La fiche.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
            Vary: { $ref: '#/components/headers/VaryAuth' }
            ETag: { schema: { type: string }, description: Validateur de cache, pour que le pré-chargement TV ne se paie pas deux fois. }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/DateDetail' }
              example:
                servedAt: '2026-09-21T18:02:21.000Z'
                validUntil: '2026-09-21T18:03:21.000Z'
                data:
                  id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  showId: 019928a0-7d31-7a10-b8c4-2f9e11a4c111
                  channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                  slug: nuit-blanche-2026-09-21
                  canonicalUrl: 'https://arthome.fr/fr/d/nuit-blanche-2026-09-21'
                  title: Nuit blanche
                  startsAt: '2026-09-21T19:00:00Z'
                  venueClock: { venueTimezone: Europe/Paris, venueUtcOffsetMin: 120 }
                  runtimeMin: 95
                  displayState: live
                  displayStateValidUntil: '2026-09-21T20:35:00Z'
                  replay: { policy: included, windowHours: 72 }
                  rights: { scope: restricted, blackoutCountries: [CA], reasonCode: broadcaster }
                  media: { wide: [], poster: [] }
                  totalSeriesDates: 3
                  watchVerdict:
                    allowed: false
                    advisory: true
                    reasonCode: NO_SEAT
                    fallbackAction: buy_seat
                    validUntil: '2026-09-21T18:03:21.000Z'
        '304': { description: Inchangé depuis l'`ETag` fourni. }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dates/{dateId}/availability:
    get:
      operationId: refreshDateAvailability
      tags: [commerce]
      summary: Rafraîchit jauge et prix avant de montrer un total.
      description: |
        Le seul appel légitime de l'écran de réservation d'un téléviseur : la date est déjà en
        main, seule la jauge bouge. `validUntil` est court (60 s) parce que le tarif « séance
        commencée » est **au prorata du temps restant**.

        **Lecture publique.** Appelée **sans aucune authentification**, cette opération rend le
        **corps public** — identique pour tous les appelants anonymes, donc mutualisable dans un
        cache partagé. Les trois surcouches par spectateur (`watchVerdict`, `viewerRelations`,
        `viewerProgress`) sont alors **absentes**, jamais nulles. Appelée avec une session ou un
        jeton porteur, elle rend le corps public **plus** les surcouches, et devient privée.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      security:
        # **Lecture publique.** L'absence totale d'authentification est un cas NOMINAL, pas une
        # erreur : cette lecture est la face indexable du produit, et le robot d'un moteur n'a ni
        # cookie, ni jeton porteur, ni moyen de s'en fabriquer un. Le mode visiteur emprunte le
        # même chemin. Voir « Lecture publique et lecture identifiée » en tête de document.
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      x-arthome-freshness: 15
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Jauge et tarifs à l'instant du service.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
            Vary: { $ref: '#/components/headers/VaryAuth' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          seatsAvailable: { type: integer }
                          waitlistCount: { type: integer }
                          fillRateBps: { type: integer }
                          soldOut: { type: boolean }
                          priceTiers: { type: array, items: { $ref: '#/components/schemas/PriceTier' } }
                          serviceFeePerSeat: { $ref: '#/components/schemas/Money' }
              example:
                servedAt: '2026-09-21T18:40:00.000Z'
                validUntil: '2026-09-21T18:41:00.000Z'
                data:
                  seatsAvailable: 42
                  waitlistCount: 0
                  fillRateBps: 8700
                  soldOut: false
                  priceTiers: [{ tier: full, amount: { amountMinor: 2400, currencyCode: EUR }, active: true }]
                  serviceFeePerSeat: { amountMinor: 150, currencyCode: EUR }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dates/{dateId}/seat-quote:
    post:
      operationId: quoteSeat
      tags: [commerce]
      summary: Le récapitulatif d'achat, composé côté serveur.
      description: |
        **Les quatre lignes viennent du contrat** : palier, frais de service, remise
        d'abonnement, promotion. La remise et la promotion **ne se cumulent pas** — la plus
        favorable au spectateur l'emporte, et la règle vit dans `@arthome/core` (D-017). Sinon
        elle serait écrite trois fois.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-idempotency-exemption: |
        **Un devis rejoué doit être frais, jamais mémorisé** — même raison qu'un renouvellement de
        jeton. Le devis tire sa valeur de son `validUntil` : rendre la réponse d'origine pourrait
        rendre un devis **déjà expiré**, ou un prix que la promotion au prorata a rendu faux. Et
        cette opération n'écrit rien : c'est une lecture, en `POST` parce que ses critères ne
        tiennent pas dans une chaîne de requête.
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, quantity]
              properties:
                tier: { type: string, enum: [full, reduced, support] }
                quantity: { type: integer, minimum: 1, maximum: 10 }
                contributionMinor:
                  type: [integer, 'null']
                  description: |
                    Contribution libre à la compagnie, pour une place gratuite. Le montant est
                    **ouvert** ; minimum et maximum sont des **règles du domaine**, pas des
                    attributs d'un champ de saisie, et le refus porte
                    **`CONTRIBUTION_OUT_OF_RANGE`**, avec les deux bornes en paramètres. Le code
                    était annoncé et jamais nommé — donc promis à être inventé trois fois.
                applyCreditId: { type: [string, 'null'], format: uuid }
            example: { tier: full, quantity: 2 }
      responses:
        '200':
          description: Devis.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/SeatQuote' }
              example:
                servedAt: '2026-09-21T18:41:10.000Z'
                validUntil: '2026-09-21T18:42:10.000Z'
                data:
                  lines:
                    - { kind: tier, amount: { amountMinor: 4800, currencyCode: EUR } }
                    - { kind: service_fee, amount: { amountMinor: 300, currencyCode: EUR } }
                    - { kind: subscription_discount, reasonCode: plan_pass, amount: { amountMinor: -480, currencyCode: EUR } }
                  total: { amountMinor: 4620, currencyCode: EUR }
                  validUntil: '2026-09-21T18:42:10.000Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # =============================================================== commandes d'argent

  /v1/orders/seats:
    post:
      operationId: purchaseSeat
      tags: [commerce]
      summary: Achète une ou plusieurs places.
      description: |
        **Un double clic ne crée jamais deux places** : `Idempotency-Key` est obligatoire, générée
        par la surface **avant l'envoi et persistée avant l'envoi**. Une clé rejouée rend la
        réponse de la première tentative, jamais une erreur — c'est la différence entre une reprise
        sûre et une place perdue.

        **Le prix attendu est envoyé et vérifié.** Le refus porte `PRICE_STALE`, **distinct** de
        l'échec de paiement, avec le prix courant en paramètre : avec cinq motifs de promotion
        dont un calculé au prorata du temps écoulé, l'écart entre le prix affiché et le prix valide
        est **structurel**, pas accidentel.

        **La commande rend l'état projeté, pas un accusé** : la place **et** la date à jour, pour
        que la surface repeigne en un seul aller-retour.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:tickets', 'date:{dateId}:availability']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dateId, tier, quantity, expectedTotal]
              properties:
                dateId: { type: string, format: uuid }
                tier: { type: string, enum: [full, reduced, support] }
                quantity: { type: integer, minimum: 1, maximum: 10 }
                expectedTotal: { $ref: '#/components/schemas/Money' }
                contributionMinor: { type: [integer, 'null'] }
                applyCreditId: { type: [string, 'null'], format: uuid }
                profileId: { type: [string, 'null'], format: uuid }
                declaredTaxLocation:
                  type: [object, 'null']
                  description: |
                    Localisation **déclarée par l'acheteur**, quand la surface la lui demande. Elle
                    entre au registre comme un élément de preuve parmi les autres
                    (`declared_by_buyer`) — **elle ne les remplace pas** : c'est le serveur qui
                    arbitre, et deux éléments qui se contredisent produisent
                    `evidenceConflicting`, jamais un refus d'achat.
                  properties:
                    country: { type: string, pattern: '^[A-Z]{2}$' }
                    subdivision: { type: [string, 'null'] }
                    postalCode: { type: [string, 'null'] }
            example:
              dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
              tier: full
              quantity: 2
              expectedTotal: { amountMinor: 4620, currencyCode: EUR }
      responses:
        '201':
          description: Places créées, et la date à jour.
          headers:
            X-Arthome-Served-At: { $ref: '#/components/headers/ServedAt' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [tickets, date, order]
                        properties:
                          tickets: { type: array, items: { $ref: '#/components/schemas/TicketCard' } }
                          date: { $ref: '#/components/schemas/DateCard' }
                          order: { $ref: '#/components/schemas/Order' }
              example:
                servedAt: '2026-09-21T18:41:30.000Z'
                data:
                  tickets:
                    - seatId: 019928f5-0000-7000-8000-000000000001
                      dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                      orderId: 019928f5-0000-7000-8000-0000000000aa
                      seatCode: ATH-7QK2-4M
                      tier: full
                      state: active
                      cancelDeadline: '2026-09-21T18:00:00Z'
                      date: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, displayState: live }
                  date: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, displayState: live }
                  order: { id: 019928f5-0000-7000-8000-0000000000aa, reference: ATH-2026-00042, kind: seat, state: paid, placedAt: '2026-09-21T18:41:30Z' }
        '202':
          description: |
            **Authentification forte requise** — la commande existe, le paiement n'est pas abouti.
            La surface présente l'élément de paiement avec le `clientSecret`, puis suit l'état par
            `getOrder`. Elle ne conclut **jamais** depuis le retour d'URL.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PaymentHandoff' } }
              example:
                servedAt: '2026-09-21T18:41:30.000Z'
                data:
                  orderId: 019928f5-0000-7000-8000-0000000000aa
                  state: awaiting_action
                  paymentIntentRef: pi_3Ab2Cd
                  clientSecret: pi_3Ab2Cd_secret_9f2
                  nextAction: { kind: redirect_to_url, redirectUrl: 'https://hooks.stripe.com/3ds/authenticate' }
                  returnUrl: 'https://arthome.fr/paiement/retour?order=019928f5-0000-7000-8000-0000000000aa'
                  expiresAt: '2026-09-21T19:11:30Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      tags: [commerce]
      summary: L'état d'une commande — **la seule source de vérité après un paiement**.
      description: |
        **C'est cette opération qui reprend une commande restée `awaiting_action`**, et c'est elle
        que la surface interroge au retour d'une authentification forte. Le retour d'URL dit **où
        aller** ; il ne dit jamais **ce qui a changé** : notre état n'avance que sur un webhook
        vérifié, jamais sur un paramètre de navigateur.

        **`no-store`** : l'état d'un paiement ne se met pas en cache.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: La commande, et ce qu'elle a produit quand elle est `paid`.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [order]
                        properties:
                          order: { $ref: '#/components/schemas/Order' }
                          tickets: { type: array, items: { $ref: '#/components/schemas/TicketCard' } }
                          handoff:
                            allOf: [{ $ref: '#/components/schemas/PaymentHandoff' }]
                            description: Présent tant que la commande est `awaiting_action` — c'est ce qui permet de **reprendre** une authentification abandonnée.
              example:
                servedAt: '2026-09-21T18:43:00.000Z'
                data:
                  order: { id: 019928f5-0000-7000-8000-0000000000aa, reference: ATH-2026-00042, kind: seat, state: paid, placedAt: '2026-09-21T18:41:30Z', invoiceAvailable: true }
                  tickets: []
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/payment-methods:
    post:
      operationId: addPaymentMethod
      tags: [account]
      summary: Enregistre un moyen de paiement depuis le web.
      description: |
        **La seule surface capable d'enregistrer une carte était celle qui n'a pas de clavier.**
        L'intention `payment_method` existait pour l'appairage du téléviseur, et la section
        Sécurité du compte affichait « Moyens de paiement · Gérer » sans qu'aucune commande ne
        l'atteigne.

        **Aucun numéro de carte ne touche notre domaine** : la commande rend un `clientSecret` de
        configuration, et l'élément de paiement de la surface s'en charge — c'est ce qui garde le
        périmètre de conformité au plus étroit.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:payment-methods']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnPath]
              properties:
                returnPath: { type: string, description: Chemin **relatif** dans la surface. Une adresse absolue est refusée. }
                setAsDefault: { type: boolean, default: false }
            example: { returnPath: /compte/securite, setAsDefault: true }
      responses:
        '201':
          description: Configuration ouverte. La surface présente l'élément de paiement.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [setupIntentRef, clientSecret, returnUrl]
                        properties:
                          setupIntentRef: { type: string }
                          clientSecret: { type: string }
                          returnUrl: { type: string, format: uri }
                          expiresAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:55:20.000Z'
                data:
                  setupIntentRef: seti_1Ab2Cd
                  clientSecret: seti_1Ab2Cd_secret_7f3
                  returnUrl: 'https://arthome.fr/compte/securite?setup=seti_1Ab2Cd'
                  expiresAt: '2026-09-21T19:25:20Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/payment-methods/{paymentMethodId}:
    delete:
      operationId: removePaymentMethod
      tags: [account]
      summary: Retire un moyen de paiement.
      description: |
        **Refusée si c'est le dernier moyen d'un abonnement actif** (`PAYMENT_METHOD_IN_USE`) :
        retirer en silence la seule carte d'un abonnement produirait un échec de prélèvement et
        une formule résiliée sans que personne l'ait voulu.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - name: paymentMethodId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Moyen retiré. Rejouée sur un moyen déjà retiré, elle réussit.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { removed: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:56:00.000Z'
                data: { removed: true }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/seats/{seatId}/cancel:
    post:
      operationId: cancelSeat
      tags: [commerce]
      summary: Annule une place avant son échéance.
      description: |
        L'échéance est **servie comme un instant** sur la place (`cancelDeadline`), jamais comme la
        phrase « jusqu'à 1 h avant ». Le refus après échéance porte son propre code et l'instant
        en paramètre.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:tickets', 'date:{dateId}:availability']
      parameters:
        - name: seatId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reasonCode: { type: string, enum: [viewer_request] }
            example: { reasonCode: viewer_request }
      responses:
        '200':
          description: Place annulée, avec le remboursement et son code de délai.
          # Le refus après échéance porte `CANCEL_DEADLINE_PASSED`, avec l'instant en paramètre.
          # Il était annoncé — « le refus après échéance a son propre code » — et nommé nulle part :
          # un code non nommé est un code inventé trois fois.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          ticket: { $ref: '#/components/schemas/TicketCard' }
                          date: { $ref: '#/components/schemas/DateCard' }
              example:
                servedAt: '2026-09-21T17:10:00.000Z'
                data:
                  ticket:
                    seatId: 019928f5-0000-7000-8000-000000000001
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    seatCode: ATH-7QK2-4M
                    tier: full
                    state: refunded
                    date: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001 }
                    refund:
                      amount: { amountMinor: 2400, currencyCode: EUR }
                      delayCode: refund_delay_business_days_3_5
                      method: original_payment_method
                  date: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/dates/{dateId}/waitlist:
    put:
      operationId: joinWaitlist
      tags: [commerce]
      summary: S'inscrit en liste d'attente.
      description: |
        **Une mise en état, pas une bascule** : deux envois laissent une inscription. La réponse
        **dit le rang, ou dit qu'elle ne le dit pas** — elle ne reste jamais muette. La fenêtre de
        priorité (2 h) est servie, jamais codée sur la surface.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Inscrit.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [joined, rankDisclosed]
                        properties:
                          joined: { type: boolean }
                          rankDisclosed: { type: boolean }
                          rank: { type: [integer, 'null'] }
                          priorityWindowHours: { type: integer }
                          date: { $ref: '#/components/schemas/DateCard' }
              example:
                servedAt: '2026-09-21T18:42:00.000Z'
                data: { joined: true, rankDisclosed: true, rank: 14, priorityWindowHours: 2 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: leaveWaitlist
      tags: [commerce]
      summary: Se retire de la liste d'attente.
      description: |
        **Une mise en état**, comme l'inscription. Rejouée sur une inscription déjà retirée, elle
        réussit — une file hors ligne rejoue, et un échec y serait un faux négatif.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Retiré. Une suppression rejouée sur une inscription déjà retirée **réussit**, elle n'échoue pas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { joined: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:43:00.000Z'
                data: { joined: false }
        '404': { $ref: '#/components/responses/NotFound' }

  # =============================================================== panier et boutique

  /v1/cart:
    get:
      operationId: getCart
      tags: [commerce]
      summary: Le panier du compte, scindé par vendeur.
      description: |
        Le panier vit **sur le compte**, pas sur le navigateur : il est persistant dans l'en-tête, il
        se monte sur plusieurs sessions depuis la boutique d'un direct, et les trois storefronts le
        montrent. Il est servi **déjà scindé par vendeur**, parce que c'est ainsi qu'il sera payé.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Le panier.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Cart' } }
              example:
                servedAt: '2026-09-21T18:44:00.000Z'
                data: { lines: [], vendorGroups: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/cart/lines:
    post:
      operationId: addCartLine
      tags: [commerce]
      summary: Ajoute une ligne au panier.
      description: |
        Une ligne référence une **variante**, jamais un article nu : un t-shirt sans taille n'est
        pas vendable. Les frais de port ne sont **pas** calculés ici — ils le sont au devis.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:cart']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, variantId, quantity]
              properties:
                itemId: { type: string, format: uuid }
                variantId: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 20 }
            example: { itemId: 019928a0-7d31-7a10-b8c4-2f9e11a4d001, variantId: M, quantity: 1 }
      responses:
        '200':
          description: Le panier à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Cart' } }
              example:
                servedAt: '2026-09-21T18:44:20.000Z'
                data:
                  lines: [{ id: 019928f6-0000-7000-8000-000000000001, itemId: 019928a0-7d31-7a10-b8c4-2f9e11a4d001, variantId: M, channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222, quantity: 1, unitPrice: { amountMinor: 2500, currencyCode: EUR }, version: 1 }]
                  vendorGroups: [{ channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222, lineIds: [019928f6-0000-7000-8000-000000000001] }]
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/cart/lines/{lineId}:
    patch:
      operationId: updateCartLine
      tags: [commerce]
      summary: Modifie la quantité d'une ligne.
      description: |
        **Conflit entre deux appareils : par ligne, dernier écrivain gagne, et le rang vient du
        serveur** — `version`, jamais une date du téléphone, dont l'horloge dérive et saute.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - name: lineId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, expectedVersion]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 20 }
                expectedVersion: { type: integer }
            example: { quantity: 2, expectedVersion: 1 }
      responses:
        '200':
          description: Le panier à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Cart' } }
              example:
                servedAt: '2026-09-21T18:44:40.000Z'
                data: { lines: [], vendorGroups: [] }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeCartLine
      tags: [commerce]
      summary: Retire une ligne du panier.
      description: |
        Rejouée sur une ligne déjà retirée, elle **réussit**. Rend le panier entier, scindé par
        vendeur, pour que la surface repeigne sans second aller-retour.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - name: lineId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Le panier à jour. Un retrait rejoué sur une ligne déjà retirée **réussit**.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Cart' } }
              example:
                servedAt: '2026-09-21T18:45:00.000Z'
                data: { lines: [], vendorGroups: [] }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cart/quote:
    post:
      operationId: quoteCart
      tags: [commerce]
      summary: Le devis opposable du panier, par vendeur.
      description: |
        **Le total présenté est celui qui sera débité**, pendant 15 minutes. Le port est calculé
        **ici**, pas à l'ajout. Un panier à deux chaînes rend **deux groupes** : il se scindera en
        deux commandes au paiement.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-idempotency-exemption: |
        **Un devis rejoué doit être frais, jamais mémorisé.** Le total présenté est celui qui sera
        débité, et cette promesse tient **quinze minutes** : servir un devis mémorisé rendrait un
        total dont la fenêtre est entamée, voire close — c'est-à-dire un devis opposable qui ne
        l'est plus. Le rejeu produit donc un nouveau devis, avec sa propre fenêtre.
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingCountryCode]
              properties:
                shippingCountryCode: { type: string, pattern: '^[A-Z]{2}$' }
                shippingPostalCode: { type: [string, 'null'] }
            example: { shippingCountryCode: FR, shippingPostalCode: '75011' }
      responses:
        '200':
          description: Devis.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/CartQuote' } }
              example:
                servedAt: '2026-09-21T18:45:20.000Z'
                validUntil: '2026-09-21T19:00:20.000Z'
                data:
                  validUntil: '2026-09-21T19:00:20.000Z'
                  groups:
                    - channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                      subtotal: { amountMinor: 5000, currencyCode: EUR }
                      shipping: { amountMinor: 590, currencyCode: EUR }
                      discount: { reasonCode: plan_shop_discount, amount: { amountMinor: -750, currencyCode: EUR } }
                      total: { amountMinor: 4840, currencyCode: EUR }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/orders/merch:
    post:
      operationId: checkoutCart
      tags: [commerce]
      summary: Paie le panier — une commande par vendeur.
      description: |
        **Le panier est vidé par la réponse**, jamais par une temporisation locale.

        **Le contrat tranche l'échec partiel** : une ligne en rupture **refuse la commande de son
        groupe en bloc**, avec `params.unavailableLineIds`, et ne l'ampute pas. Motif : une
        commande amputée débite un montant que le spectateur n'a pas vu, et le devis est
        opposable — l'amputer le rendrait faux.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:orders', 'account:cart']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, shippingAddress]
              properties:
                quoteId: { type: string, format: uuid }
                shippingAddress:
                  type: object
                  required: [line1, city, postalCode, countryCode]
                  properties:
                    line1: { type: string }
                    line2: { type: [string, 'null'] }
                    city: { type: string }
                    postalCode: { type: string }
                    countryCode: { type: string, pattern: '^[A-Z]{2}$' }
            example:
              quoteId: 019928f6-1111-7000-8000-000000000001
              shippingAddress: { line1: '12 rue du Théâtre', city: Paris, postalCode: '75011', countryCode: FR }
      responses:
        '201':
          description: Une commande par vendeur.
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [orders, cart]
                        properties:
                          orders: { type: array, items: { $ref: '#/components/schemas/Order' } }
                          cart: { $ref: '#/components/schemas/Cart' }
              example:
                servedAt: '2026-09-21T18:46:00.000Z'
                data:
                  orders: [{ id: 019928f6-2222-7000-8000-000000000001, reference: ATH-2026-00043, kind: merch, state: paid, placedAt: '2026-09-21T18:46:00Z' }]
                  cart: { lines: [], vendorGroups: [] }
        '202':
          description: '**Authentification forte requise.** Voir `PaymentHandoff` — le retour d''URL ne conclut rien, `getOrder` fait foi.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PaymentHandoff' } }
              example:
                servedAt: '2026-09-21T18:46:00.000Z'
                data:
                  orderId: 019928f6-2222-7000-8000-000000000001
                  state: awaiting_action
                  paymentIntentRef: pi_3Ef4Gh
                  clientSecret: pi_3Ef4Gh_secret_1a2
                  nextAction: { kind: redirect_to_url, redirectUrl: 'https://hooks.stripe.com/3ds/authenticate' }
                  returnUrl: 'https://arthome.fr/paiement/retour?order=019928f6-2222-7000-8000-000000000001'
                  expiresAt: '2026-09-21T19:16:00Z'
        '409':
          description: |
            `CHECKOUT_LINE_UNAVAILABLE` (avec `unavailableLineIds`), `QUOTE_ADDRESS_MISMATCH`, ou
            `PRICE_STALE`.

            **`QUOTE_ADDRESS_MISMATCH` ferme un trou** : le devis calcule le port sur un pays et un
            code postal, le paiement reçoit une adresse complète, et rien n'imposait qu'elles
            correspondent. **Un devis opposable dont l'adresse change entre-temps n'est plus
            opposable** — il faut un nouveau devis, pas un débit silencieusement différent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: QUOTE_ADDRESS_MISMATCH, nature: refused, params: { quotedCountryCode: FR, quotedPostalCode: '75011' }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:46:00.000Z'
        '410': { $ref: '#/components/responses/Gone' }

  /v1/subscription:
    put:
      operationId: setSubscriptionPlan
      tags: [commerce]
      summary: Souscrit ou change de formule.
      description: |
        **Une mise en état**, pas une bascule. L'effet est **immédiatement visible** sur les prix
        affichés : `x-arthome-invalidates` nomme les lectures qui deviennent fausses, pour que la
        surface invalide juste ce qu'il faut. Le droit de **lecture**, lui, n'est jamais décidé
        ici : il est rendu par `streaming` à l'ouverture du lecteur, sur la donnée fraîche.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:subscription', 'home:rails', 'account:tickets']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planTier]
              properties:
                planTier: { type: string, enum: [free, pass, premium] }
                paymentMethodRef: { type: [string, 'null'] }
            example: { planTier: premium, paymentMethodRef: pm_1Ab2Cd }
      responses:
        '200':
          description: Abonnement à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Subscription' } }
              example:
                servedAt: '2026-09-21T18:47:00.000Z'
                data: { planTier: premium, state: active, startedAt: '2026-09-21T18:47:00Z', currentPeriodEnd: '2026-10-21T18:47:00Z', cancelAtPeriodEnd: false }
        '202':
          description: '**Authentification forte requise.** Voir `PaymentHandoff` — le retour d''URL ne conclut rien, `getOrder` fait foi.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PaymentHandoff' } }
              example:
                servedAt: '2026-09-21T18:47:00.000Z'
                data:
                  orderId: 019928f7-3333-7000-8000-000000000001
                  state: awaiting_action
                  paymentIntentRef: pi_3Ij5Kl
                  clientSecret: pi_3Ij5Kl_secret_3c4
                  nextAction: { kind: redirect_to_url, redirectUrl: 'https://hooks.stripe.com/3ds/authenticate' }
                  returnUrl: 'https://arthome.fr/paiement/retour?order=019928f7-3333-7000-8000-000000000001'
                  expiresAt: '2026-09-21T19:17:00Z'
        '402':
          description: Paiement refusé par le prestataire. **Distinct** d'un refus métier.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: PAYMENT_DECLINED, nature: refused, params: { declineCode: insufficient_funds }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:47:00.000Z'
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: cancelSubscription
      tags: [commerce]
      summary: Résilie l'abonnement au terme de la période.
      description: |
        La résiliation prend effet **au terme de la période** : les droits courent jusqu'à
        `currentPeriodEnd`, et le contrat le sert comme un **instant** plutôt que de laisser cinq
        surfaces calculer « il vous reste 12 jours ».
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:subscription']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Résiliation enregistrée. Les droits courent jusqu'à `currentPeriodEnd`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Subscription' } }
              example:
                servedAt: '2026-09-21T18:48:00.000Z'
                data: { planTier: premium, state: active, currentPeriodEnd: '2026-10-21T18:47:00Z', cancelAtPeriodEnd: true }
        '409': { $ref: '#/components/responses/Conflict' }

  # =============================================================== lecture

  /v1/playback/{dateId}/open:
    post:
      operationId: openPlayback
      tags: [playback]
      summary: Le verdict opposable, le jeton, le bail, et tout l'écran du lecteur.
      description: |
        **C'est la seule évaluation du droit qui fasse autorité**, parce que c'est la seule qui
        produit un jeton. Le verdict servi sur une carte est indicatif (`advisory: true`) ; celui-
        ci ne l'est pas.

        **Le droit est revérifié au démarrage de la lecture, jamais hérité du catalogue** : le
        pays du spectateur change entre les deux — déplacement, itinérance, réseau d'entreprise —
        et sur mobile ce délai se compte en heures.

        **Budget ≤ 1 s.** Toute la matière de l'écran arrive ici : chapitres, pistes, régime de
        tchat, incident en cours, point de reprise, bord du direct, DRM, plafond de qualité.
        Aucun panneau du lecteur ne doit déclencher un appel de plus.

        **`Cache-Control: no-store`.** Un droit relu depuis le disque est un droit faux.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      x-arthome-idempotency-exemption: |
        **L'idempotence y serait redondante, parce que la reprise la porte déjà.** Une ouverture
        sur un `deviceId` qui tient un bail vivant **reprend ce bail** et rend le même
        `sessionId` : l'effet d'un second appel est celui du premier, par construction et non par
        mémorisation. Y ajouter une clé mémoriserait en plus un `PlaybackTicket` — donc un jeton
        signé et son instant d'expiration — dans un magasin de 24 heures, pour une réponse dont le
        contrat dit qu'elle ne se met **jamais** en cache.
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, kind]
              properties:
                deviceId:
                  type: string
                  format: uuid
                  description: |
                    **C'est lui qui porte la reprise.** Une ouverture sur un `deviceId` qui tient
                    déjà un bail vivant pour cette date **reprend ce bail** et rend le même
                    `sessionId` ; elle n'en ouvre pas un second et ne consomme pas un écran de
                    plus. La promesse « tu peux reprendre ta propre session, identifiée par
                    l'appareil » était écrite dans les réponses aux surfaces et n'était portée
                    nulle part au contrat.
                kind: { type: string, enum: [live, replay] }
                profileId: { type: [string, 'null'], format: uuid }
                capabilities:
                  type: object
                  description: |
                    Ce que l'appareil **sait faire**, déclaré. Le serveur choisit protocole, DRM et
                    plafond de qualité ; **un client qui devine se trompe**, et il se trompe sur
                    les appareils qu'on ne peut pas tester.
                  properties:
                    drmSystems: { type: array, items: { type: string, enum: [fairplay, widevine, playready] } }
                    hardwareSecureDecode: { type: boolean }
                    maxHeightPx: { type: integer }
            example:
              deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
              kind: live
              capabilities: { drmSystems: [fairplay], hardwareSecureDecode: true, maxHeightPx: 2160 }
      responses:
        '200':
          description: Droit accordé. Le jeton, le bail et l'écran complet.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
              description: '`no-store` n''est pas une optimisation : c''est ce qui tient le jeton hors du cache HTTP et hors de l''instantané d''application pris au passage en arrière-plan.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PlaybackTicket' } }
              example:
                servedAt: '2026-09-21T19:05:00.000Z'
                validUntil: '2026-09-21T19:07:00.000Z'
                data:
                  sessionId: 019928f7-0000-7000-8000-000000000001
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  scope: full
                  protocol: hls
                  drmSystem: fairplay
                  qualityCap: fhd
                  manifestUrl: 'https://cdn.arthome.fr/playback/a9f1c0/master.m3u8'
                  signature: { queryToken: 'Expires=1790000000&Signature=abc', cookieSet: null }
                  edgeRenewalMode: query_token
                  expiresAt: '2026-09-21T19:07:00.000Z'
                  renewAfterSec: 45
                  leaseExpiresAt: '2026-09-21T19:06:30.000Z'
                  chatMode: open
                  chatRateLimitPerSecond: 2
                  liveEdgeSec: 6
                  chapters: []
                  audioTracks: [{ id: fr-main, language: fr, kind: main }]
                  subtitleTracks: []
                  incident: null
        '403':
          description: |
            Droit refusé. Le `code` est l'un des dix du vocabulaire fermé, et chacun produit un
            écran différent. Sur `CONCURRENT_LIMIT_REACHED`, `params.activeSessions` porte la
            **liste des sessions actives** pour que la surface propose d'en libérer une : un refus
            nu laisserait le spectateur sans issue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: CONCURRENT_LIMIT_REACHED
                  nature: refused
                  params:
                    allowed: 2
                    activeSessions:
                      - { sessionId: 019928f7-0000-7000-8000-0000000000aa, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77, isCurrentDevice: false, deviceLabel: 'Téléviseur du salon', city: Paris, openedAt: '2026-09-21T19:00:00Z' }
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-09-21T19:05:00.000Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/playback/sessions/{sessionId}/renew:
    post:
      operationId: renewPlaybackTicket
      tags: [playback]
      summary: Renouvelle le jeton et prolonge le bail, sans redémarrer la lecture.
      description: |
        **Toutes les 45 s**, pour un jeton de 120 s et un bail de 90 s. C'est le renouvellement
        qui porte la limite d'écrans simultanés : **la fenêtre pendant laquelle on regarde un flux
        auquel on n'a plus droit est exactement l'intervalle de renouvellement.**

        La réponse ne contient **rien qui forcerait un rechargement de manifeste** : le chemin est
        stable, seule la signature change.

        **Quatre codes de refus distincts**, parce que la surface affiche quatre messages
        différents. Un code générique en produirait un faux trois fois sur quatre.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      x-arthome-idempotency-exemption: |
        **Un renouvellement doit produire une fenêtre fraîche, jamais une fenêtre mémorisée.**
        Rendre la réponse d'origine rendrait un jeton déjà entamé — et, au pire moment, un jeton
        déjà expiré — alors que l'appel existe précisément pour en obtenir un neuf. C'est aussi ce
        renouvellement qui porte la limite d'écrans simultanés : le rejouer depuis un magasin
        contournerait le décompte.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Jeton renouvelé.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PlaybackRenewal' } }
              example:
                servedAt: '2026-09-21T19:05:45.000Z'
                data:
                  expiresAt: '2026-09-21T19:07:45.000Z'
                  renewAfterSec: 45
                  leaseExpiresAt: '2026-09-21T19:07:15.000Z'
                  signature: { queryToken: 'Expires=1790000120&Signature=def', cookieSet: null }
                  qualityCap: fhd
        '403':
          description: |
            Renouvellement refusé. `SEAT_EXPIRED` · `CONCURRENT_LIMIT_REACHED` ·
            `SIGNED_OUT_ELSEWHERE` · `PREVIEW_EXHAUSTED` · `DATE_INTERRUPTED`.
            `SIGNED_OUT_ELSEWHERE` est ce que voit le téléviseur déconnecté depuis le web — **pas
            une erreur réseau**. **Fenêtre réelle : jusqu'à 120 s** — voir `revokeDevice`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: SIGNED_OUT_ELSEWHERE, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T19:06:30.000Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/playback/sessions/{sessionId}/release:
    post:
      operationId: releasePlayback
      tags: [playback]
      summary: Libère une session de lecture — accélère, ne garantit rien.
      description: |
        **Rien n'en dépend.** Un téléviseur se débranche, une box se coupe, le système tue une
        application mobile sans préavis : c'est le **bail** qui expire (90 s), jamais cet appel
        qui ferme. Une session qui ne se fermerait que sur un événement du client laisserait un
        écran fantôme, et le spectateur se verrait refuser sa propre seconde lecture.

        Le client peut **reprendre sa propre session**, identifiée par `deviceId` : rouvrir le
        lecteur sur le même appareil réutilise le bail au lieu d'en ouvrir un second.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      x-arthome-idempotency-exemption: |
        **Idempotente par nature, et rien n'en dépend.** Libérer deux fois laisse le même état, et
        c'est le **bail qui expire** qui fait foi — cet appel ne fait qu'accélérer. Une clé
        protégerait un effet qui n'a ni cumul ni conséquence.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Libérée, ou déjà libérée — les deux réussissent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { released: { type: boolean } } }
              example:
                servedAt: '2026-09-21T20:40:00.000Z'
                data: { released: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/progress/{dateId}:
    put:
      operationId: recordPlaybackPosition
      tags: [playback]
      summary: Enregistre la position de lecture.
      description: |
        **L'écriture la plus fréquente du système.** Elle ne porte **pas** de clé d'idempotence :
        une clé par tranche de 30 s, par spectateur et par direct ferait du magasin d'idempotence
        la table la plus chaude de `streaming`, pour protéger une écriture dont la perte est sans
        conséquence.

        Cadence attendue : **sur pause, sur sortie, sur fin, et un battement de 30 à 60 s**, plus
        une **écriture forcée au passage en arrière-plan**.

        **L'écriture tardive est acceptée** : la dernière position doit être prise même si elle
        arrive **après** un `releasePlayback` — une TV peut être coupée à tout moment.

        **Dernier écrivain gagne, et le rang vient du serveur.**
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      x-arthome-idempotency-exemption: |
        **L'écriture la plus fréquente du système.** Une clé par tranche de 30 secondes, par
        spectateur et par direct ferait du magasin d'idempotence la table la plus chaude de
        `streaming` — pour protéger une écriture dont la perte est sans conséquence et dont la
        règle est déjà « dernier écrivain gagne, rang serveur ». Le coût serait par minute de
        lecture et par spectateur.
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionSec, deviceId]
              properties:
                positionSec: { type: integer, minimum: 0 }
                deviceId: { type: string, format: uuid }
                completed: { type: boolean, default: false }
            example: { positionSec: 1840, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77, completed: false }
      responses:
        '200':
          description: Position enregistrée, avec le rang serveur retenu.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          positionSec: { type: integer }
                          version: { type: integer }
              example:
                servedAt: '2026-09-21T19:35:00.000Z'
                data: { positionSec: 1840, version: 212 }
        '404': { $ref: '#/components/responses/NotFound' }

  # =============================================================== tchat

  /v1/dates/{dateId}/chat/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: La fenêtre glissante du tchat, au curseur.
      description: |
        **Pas de pagination remontante sur un tchat de direct** : personne ne remonte un tchat à
        la télécommande, et sur les trois surfaces c'est une fenêtre glissante. L'historique
        complet se lit sur la **rediffusion**, rejoué par `atMediaSec`.

        Le rattrapage à l'entrée est **servi par surface** : 20 messages sur TV, 50 ailleurs.
        **Aucun message retiré n'atteint une surface publique** — la modération est un état côté
        `chat`, et le flux servi est déjà filtré.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: sinceSeq
          in: query
          description: Reprise par numéro d'ordre, après une coupure de canal.
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Messages.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
                      page: { $ref: '#/components/schemas/CursorPageInfo' }
              example:
                servedAt: '2026-09-21T19:36:00.000Z'
                lastEventSeq: 41287
                items:
                  - id: 019928f8-0000-7000-8000-000000000001
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    seq: 41287
                    authorHandle: '@marie.j'
                    atMediaSec: 2160
                    sentAt: '2026-09-21T19:35:58Z'
                    badge: published
                    body: { contentLanguage: fr, text: 'Quelle lumière.' }
                page: { hasMore: true, nextCursor: null, prevCursor: null }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Publie un message de tchat.
      description: |
        **Jamais mise en file hors ligne** : un message rejoué dix minutes plus tard n'a plus de
        sens. Il est **abandonné**, pas mis en file.

        La position dans le média (`atMediaSec`) est **fournie par le client**, parce que lui seul
        sait où en est sa lecture ; l'instant absolu est posé par le serveur. Les deux voyagent,
        jamais l'un seul.

        La **limite de débit est dans le contrat**, pas seulement appliquée : `CHAT_RATE_LIMITED`
        porte `retryAfterMs`, pour que la surface **désactive la saisie proprement** au lieu
        d'enchaîner les refus.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, atMediaSec]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
                atMediaSec: { type: integer, minimum: 0 }
            example: { text: 'Quelle lumière.', atMediaSec: 2160 }
      responses:
        '201':
          description: Message publié.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ChatMessage' } }
              example:
                servedAt: '2026-09-21T19:36:02.000Z'
                data:
                  id: 019928f8-0000-7000-8000-000000000002
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  seq: 41288
                  authorHandle: '@marie.j'
                  atMediaSec: 2160
                  sentAt: '2026-09-21T19:36:02Z'
                  badge: published
                  body: { contentLanguage: fr, text: 'Quelle lumière.' }
        '403':
          description: Régime de tchat fermé, réserve aux détenteurs, ou personne sanctionnée dans cette chaîne.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: CHAT_HOLDERS_ONLY, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T19:36:02.000Z'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/dates/{dateId}/chat/reactions:
    post:
      operationId: sendReaction
      tags: [chat]
      summary: Envoie une réaction, et rend le quota restant.
      description: |
        **Le quota voyage avec la réponse** — combien il en reste, quand il se recharge — pour que
        la surface **désactive** le contrôle plutôt que de le laisser échouer. Une action inerte
        est proscrite par le dossier ; une action qui échoue en silence est pire. **Une seule
        réaction en vol à la fois.**
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      x-arthome-idempotency-exemption: |
        **Le quota borne déjà l'effet**, et il est servi avec la réponse. Une clé rejouée rendrait
        un quota **périmé** — « il vous en reste 17 » alors qu'il en reste 12 —, ce qui est pire
        que pas de réponse du tout : la surface désactive son contrôle sur ce nombre.
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reactionId, atMediaSec]
              properties:
                reactionId: { type: string, enum: [applause, heart, bravo, laugh, wow, sad] }
                atMediaSec: { type: integer, minimum: 0 }
            example: { reactionId: applause, atMediaSec: 2165 }
      responses:
        '200':
          description: Réaction prise, quota restant.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ReactionQuota' } }
              example:
                servedAt: '2026-09-21T19:36:05.000Z'
                data: { remaining: 17, rechargesAt: '2026-09-21T19:41:05Z' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/chat/messages/{messageId}/report:
    post:
      operationId: reportChatMessage
      tags: [chat]
      summary: Signale un message à la modération.
      description: Le signalement crée une **ligne de file** (`reported`), pas une sanction. Les trois axes ne s'empilent jamais.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: |
                    **Le vocabulaire de `shared/`, qui fait autorité et n'avait aucun concurrent.**
                    `spoiler` — « divulgue le spectacle » — est le seul motif propre au spectacle
                    vivant et il est traduit dans l'i18n ; il avait disparu, comme `insult`. `hate`
                    et `filter` avaient été inventés, et `filter` n'est pas un motif mais une
                    **origine** — le contrat la porte déjà correctement ailleurs, et la mettre
                    aussi dans `reason` donnait deux axes à un champ.
                  enum: [spam, insult, spoiler, off-topic, harassment]
            example: { reason: harassment }
      responses:
        '202':
          description: Signalement enregistré. Un second signalement du même compte n'en crée pas un deuxième.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { reported: { type: boolean } } }
              example:
                servedAt: '2026-09-21T19:37:00.000Z'
                data: { reported: true }
        '404': { $ref: '#/components/responses/NotFound' }

  # =============================================================== appairage

  /v1/pairings:
    post:
      operationId: createPairing
      tags: [pairing]
      summary: Ouvre un appairage d'appareil, pour l'une des cinq intentions.
      description: |
        **Une commande, une forme, un automate, cinq intentions.** Le téléviseur n'accepte aucune
        saisie au-delà de six caractères : tout paiement passe par là, donc par le téléphone.

        **`signin` est le seul vrai RFC 8628** ; les quatre autres sont des **rendez-vous de
        transaction** — acheter depuis un téléviseur déjà connecté n'est pas une demande de jeton.
        Ce qui est unique, c'est l'automate ; ce qui diffère, c'est l'effet de l'approbation.

        **Pour `seat`, la durée de l'appairage est la durée d'un maintien de places posé par
        `ticketing` à la création** : sans ce maintien, la jauge affichée sur le téléviseur est
        fausse pendant cinq minutes — exactement le défaut que la TV signale.

        `signin` s'ouvre avec le **jeton d'appareil seul**, sans session. Les quatre autres
        exigent une session sur le téléviseur.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, ticketing]
      security:
        - deviceToken: []
        - bearerToken: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent, deviceId]
              properties:
                intent: { type: string, enum: [signin, seat, plan, payment_method, merch] }
                deviceId: { type: string, format: uuid }
                payload:
                  type: object
                  additionalProperties: true
                  description: |
                    Dépend de l'intention et reste **opaque à `identity`**, qui le relaie au
                    service cible. `identity` ne connaît ni les places, ni les formules, ni les
                    paiements : il porte un rendez-vous et un pointeur.
            example:
              intent: seat
              deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
              payload: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, tier: full, quantity: 2 }
      responses:
        '201':
          description: Appairage ouvert. Le code, le QR complet, l'expiration et l'intervalle d'interrogation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/DevicePairing' } }
              example:
                servedAt: '2026-09-21T18:50:00.000Z'
                data:
                  pairingId: 019928f9-0000-7000-8000-000000000001
                  intent: seat
                  userCode: K7M2PQ
                  verificationUri: 'https://arthome.fr/appairage'
                  verificationUriComplete: 'https://arthome.fr/appairage?code=K7M2PQ'
                  expiresAt: '2026-09-21T18:55:00.000Z'
                  pollIntervalSec: 2
                  state: pending
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/pairings/{pairingId}:
    get:
      operationId: pollPairing
      tags: [pairing]
      summary: Interroge l'issue d'un appairage — et compose l'écran de confirmation.
      description: |
        **Interrogation périodique conforme à RFC 8628, pas le canal temps réel.** Faire entrer une
        identité d'appareil dans l'espace de noms WebSocket au moment de `signin` élargirait sa
        surface d'attaque pour gagner quelques centaines de millisecondes.

        L'exigence « bascule en deux secondes au plus » est tenue par une **décroissance servie** :
        `pollIntervalSec` vaut 2 pendant les 60 premières secondes, puis 5 — donc modérable par le
        serveur, et trente requêtes au plus par appairage. **La surface n'interroge jamais plus
        vite que l'intervalle servi.**

        **Fonctionne avec le seul jeton d'appareil**, sans session : c'est ce qui permet le
        rattachement après un redémarrage du téléviseur.

        La réponse est **complète** : l'écran de confirmation coûte **zéro appel de plus**.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, ticketing, catalog]
      security:
        - deviceToken: []
        - bearerToken: []
        - sessionCookie: []
      parameters:
        - name: pairingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: L'issue, et ce qu'elle a produit.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PairingOutcome' } }
              example:
                servedAt: '2026-09-21T18:52:10.000Z'
                data:
                  pairingId: 019928f9-0000-7000-8000-000000000001
                  intent: seat
                  state: approved
                  pollIntervalSec: 5
                  ticket:
                    seatId: 019928f5-0000-7000-8000-000000000001
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    seatCode: ATH-7QK2-4M
                    tier: full
                    state: active
                    date: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001 }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429':
          description: '`slow_down` de RFC 8628. La surface **ralentit**, elle ne réessaie pas plus vite.'
          headers:
            Retry-After-Ms: { $ref: '#/components/headers/RetryAfterMs' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: PAIRING_SLOW_DOWN, nature: unavailable, params: { retryAfterMs: 5000 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:52:10.000Z'
    delete:
      operationId: cancelPairing
      tags: [pairing]
      summary: Ferme un appairage en attente.
      description: Déclenché par le bouton Retour. Le téléviseur quitte souvent sans attendre la réponse.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security:
        - deviceToken: []
        - bearerToken: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: pairingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Annulé, ou déjà tranché — **un second appel rend l'issue d'origine, jamais une erreur**.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PairingOutcome' } }
              example:
                servedAt: '2026-09-21T18:53:00.000Z'
                data: { pairingId: 019928f9-0000-7000-8000-000000000001, intent: seat, state: cancelled, pollIntervalSec: 5 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            **`PAIRING_EXECUTION_ENGAGED` — l'appairage n'est plus annulable.** Le téléphone est
            entré dans le parcours de paiement ; l'annuler ici orphelinerait un achat en vol.

            **Ce que la surface fait de ce refus** : elle **reste sur l'écran d'attente** et
            continue d'interroger. Elle ne revient pas en arrière. C'est le seul cas du contrat
            où un appui sur Retour ne remonte pas d'un niveau, et la raison est écrite : on ne
            laisse pas une télécommande annuler un paiement qu'elle a elle-même déclenché.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: PAIRING_EXECUTION_ENGAGED
                  nature: refused
                  params: { state: engaged, engagedAt: '2026-09-21T18:52:04Z' }
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-09-21T18:52:06.000Z'

  /v1/pairings/{pairingId}/engagement:
    post:
      operationId: engagePairing
      tags: [pairing]
      summary: Marque l'appairage comme engagé — à l'entrée du parcours de paiement.
      description: |
        **Cette opération existe pour fermer une course qui coûte de l'argent réel.**

        La séquence sans elle : le spectateur scanne le QR, paie sur son téléphone, et appuie sur
        **Retour** pendant que le paiement s'exécute. La télévision envoie son `DELETE` ;
        `ticketing` a déjà encaissé ; la décision arrive ensuite et reçoit `410`. **La place est
        payée, le téléphone affiche un échec, la télévision est revenue en arrière, et l'argent
        est parti.** Le contrat traitait l'ordre inverse — approbation puis annulation — et pas
        celui-ci, qui est pourtant le plus probable des deux : l'exécution d'un paiement dure des
        secondes, l'appui sur Retour est instantané.

        **Appelée par le BFF au nom du téléphone**, au moment où celui-ci entre dans le parcours
        de paiement — donc **avant** que `ticketing` exécute, et non après. Elle fait passer
        l'appairage de `pending` à `engaged`, et à partir de là `cancelPairing` répond `409`.

        **Elle ne s'applique qu'aux quatre intentions d'achat.** `signin` n'engage aucun argent :
        un appairage de connexion reste annulable jusqu'à sa décision, et l'appeler dessus est
        refusé.

        **Idempotente** : un second appel sur un appairage déjà `engaged` rend le même état, pas
        une erreur — le téléphone peut rejouer son entrée de parcours sur un réseau qui bascule.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: pairingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: [string, 'null']
                  description: Trace facultative du parcours engagé, pour le journal.
            example: {}
      responses:
        '200':
          description: Appairage engagé, donc non annulable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PairingOutcome' } }
              example:
                servedAt: '2026-09-21T18:52:04.000Z'
                data: { pairingId: 019928f9-0000-7000-8000-000000000001, intent: seat, state: engaged, pollIntervalSec: 2 }
        '403':
          description: '`PAIRING_IDENTITY_MISMATCH`, ou `PAIRING_INTENT_NOT_ENGAGEABLE` sur `signin`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: PAIRING_INTENT_NOT_ENGAGEABLE, nature: refused, params: { intent: signin }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:52:04.000Z'
        '410': { $ref: '#/components/responses/Gone' }

  /v1/pairings/{pairingId}/decision:
    post:
      operationId: decidePairing
      tags: [pairing]
      summary: Approuve ou refuse un appairage, depuis le téléphone.
      description: |
        **La garde de propriété est écrite chez nous, pas déléguée.** CVE-2026-45337 a montré ce
        que coûte son relâchement : le plugin traitait toute session authentifiée comme
        propriétaire de tout code en attente.

        Trois vérifications, dans cet ordre : l'appairage est `pending` **ou `engaged`** et non
        expiré — un appairage engagé est précisément celui dont on attend la décision ; si
        `intent = signin`, une session valide quelconque suffit — **c'est le cas nominal, et c'est
        même le sens d'« ajouter un compte »** ; sinon, le porteur **est** le profil qui a ouvert
        l'appairage, sous peine de `PAIRING_IDENTITY_MISMATCH`.

        **Pas de bascule implicite de profil.** Elle ferait payer le mauvais moyen de paiement,
        créditerait les mauvais droits et livrerait la place au mauvais compte — dans un salon, au
        moment précis où deux personnes regardent le même écran. Le téléphone propose « changer de
        compte » : un geste de la personne, jamais du système.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: pairingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, deny] }
                outcomeRef:
                  type: [string, 'null']
                  description: |
                    Le pointeur **opaque** vers ce que le parcours normal du téléphone a produit —
                    posé par le BFF après que `ticketing` a exécuté, avec **sa propre**
                    `Idempotency-Key`. Aucune duplication de la billetterie : `ticketing`
                    n'implémente **aucun** code court.
            example: { decision: approve, outcomeRef: seat:019928f5-0000-7000-8000-000000000001 }
      responses:
        '200':
          description: Décision enregistrée.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PairingOutcome' } }
              example:
                servedAt: '2026-09-21T18:52:00.000Z'
                data: { pairingId: 019928f9-0000-7000-8000-000000000001, intent: seat, state: approved, pollIntervalSec: 5 }
        '403':
          description: '`PAIRING_IDENTITY_MISMATCH` — le porteur n''est pas le profil qui a ouvert l''appairage. Impossible sur `signin`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: PAIRING_IDENTITY_MISMATCH, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:52:00.000Z'
        '410': { $ref: '#/components/responses/Gone' }

  /v1/account-deep-link:
    get:
      operationId: getAccountDeepLink
      tags: [pairing]
      summary: Le QR de renvoi vers la gestion du compte — ce qui n'est PAS un appairage.
      description: |
        **Rien n'attend, l'écran ne bascule pas, aucune ligne d'appairage n'est ouverte.** Deux
        formes distinctes au contrat, séparées par le **nom** et non par une option — sinon on
        implémentera une attente là où il n'y en a pas.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Le lien.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/AccountDeepLink' } }
              example:
                servedAt: '2026-09-21T18:54:00.000Z'
                data: { url: 'https://arthome.fr/compte' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # =============================================================== compte

  /v1/me/account:
    get:
      operationId: getAccountScreen
      tags: [account]
      summary: L'agrégat des onze sections du compte, en un appel.
      description: |
        Les onze sections partagent **une seule** forme de compte. Elles ne justifient ni onze
        appels ni onze schémas : huit sont des projections de celle-ci. Seules les recherches
        enregistrées, les commandes et les notifications sont paginées à part.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, ticketing, notifications]
      x-arthome-freshness: 300
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Le compte.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/AccountScreen' } }
              example:
                servedAt: '2026-09-21T18:55:00.000Z'
                data:
                  profile: { publicHandle: '@marie.j', displayName: Marie J., email: marie@example.org, emailVerified: true, phoneVerified: false, memberNumber: A-004212 }
                  subscription: { planTier: pass, state: active, currentPeriodEnd: '2026-10-21T00:00:00Z', cancelAtPeriodEnd: false }
                  credits: []
                  devices: []
                  consents: { purposes: { audience: true, perso: true, partners: false, ads: false }, textVersion: 3, recordedAt: '2026-05-02T09:12:00Z' }
                  deletion: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/tickets:
    get:
      operationId: listMyTickets
      tags: [account]
      summary: Mes places, à venir ou passées, déjà ordonnées par le serveur.
      description: |
        L'ordre est **serveur** : une date portant une issue remonte, parce qu'elle appelle un
        geste. Aucune surface ne réordonne.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing, catalog, streaming]
      x-arthome-freshness: 60
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CursorDirection'
        - $ref: '#/components/parameters/Limit'
        - name: window
          in: query
          schema: { type: string, enum: [upcoming, past], default: upcoming }
      responses:
        '200':
          description: Page de places.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/TicketCard' } }
                      page: { $ref: '#/components/schemas/CursorPageInfo' }
              example:
                servedAt: '2026-09-21T18:56:00.000Z'
                items: []
                page: { hasMore: false, emptyReason: no_ticket_yet, emptyActionCode: browse_catalog }
