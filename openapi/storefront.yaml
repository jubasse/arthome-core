  /v1/me/deletion:
    post:
      operationId: requestAccountDeletion
      summary: Requests deletion of the account.
      description: |
        **A financial command as much as a personal one.** "Deletion cancels unused seats": it
        therefore triggers refunds, touches payouts that may already be computed, and runs into the
        ten-year accounting retention. It **can be neither synchronous nor total**.

        The sequence is a **persistent saga**: the account moves to `deletion_requested`, sign-ins
        are blocked, `ticketing` cancels and refunds, `payouts` recomputes; a **30-day grace period**
        runs, during which the account is **reactivated by simply signing in** — which is what makes
        the irreversible acceptable; at the end, `identity` **anonymises** instead of deleting.
        Invoices keep their frozen contents.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - identity
      tags:
      - account
      security:
      - sessionCookie: []
        csrfToken: []
      - bearerToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmHandle:
                  type: string
              required:
              - confirmHandle
            example:
              confirmHandle: '@marie.j'
      responses:
        '202':
          description: Request recorded, with the end of the grace period.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        state:
                          type: string
                        graceUntil:
                          type: string
                          format: date-time
                        cancelledSeatsCount:
                          type: integer
                      additionalProperties: {}
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T19:13:00.000Z'
                data:
                  state: requested
                  graceUntil: '2026-10-21T19:13:00Z'
                  cancelledSeatsCount: 2
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    delete:
      operationId: cancelAccountDeletion
      summary: Cancels the deletion request during the grace period.
      description: |
        The account is **reactivated by simply signing in** during the 30 days of grace, and that is
        exactly what makes the irreversible acceptable. What this command **does not undo**: seats
        already cancelled and refunded. The contract says so rather than letting anyone assume
        otherwise.
