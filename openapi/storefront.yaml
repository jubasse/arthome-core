                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-09-21T18:52:00.000Z'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/account-deep-link:
    get:
      operationId: getAccountDeepLink
      summary: The QR that hands off to account management — what is NOT a pairing.
      description: |
        **Nothing is waiting, the screen does not switch, no pairing row is opened.** Two distinct
        shapes in the contract, separated by **name** and not by an option — otherwise someone will
        implement a wait where there is none.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - identity
      tags:
      - pairing
      parameters:
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AccountDeepLink'
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:54:00.000Z'
                data:
                  url: https://arthome.fr/compte
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-arthome_session
      description: |
        Opaque `better-auth` session, carried by an `HttpOnly`/`Secure`/`SameSite=Lax` cookie. This
        is the form chosen for `storefront-web`, which renders on the server and whose cached
        functions can read neither cookie nor header on the static render path.

        **`__Host-`, on every cookie of this mode**: the browser then accepts it only `Secure`, on
        path `/` and with no `Domain`, so a sibling subdomain cannot plant a session (its own, with
        its CSRF pair) for the BFF to act on.

        **In this mode, a request that writes carries `X-Arthome-Csrf`**: the value of the
        `__Host-arthome_csrf` cookie the BFF sets beside the session cookie, readable by the page and bound
        to that session. Without it, or with another session's, the BFF answers `403`
        `api.forbidden`. Each such write declares it: the `csrfToken` scheme beside this one, and
        the `CsrfRefused` response. `GET`, `HEAD` and `OPTIONS` carry none, and neither does a request without
        the session cookie: sign-up and sign-in are what set it. `signOut` needs none either: a
        forged one ends a session and grants nothing, and a browser that lost its CSRF cookie must
        still be able to sign out.
    csrfToken:
      type: apiKey
      in: header
      name: X-Arthome-Csrf
      description: |
        The `__Host-arthome_csrf` cookie's value, echoed by a write made with the session cookie
        (see `sessionCookie`). Required together with it, never with a bearer token.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        The same session, carried in `Authorization: Bearer` by `better-auth`'s `bearer` plugin
        (`set-auth-token` header on return). This is the form chosen for `storefront-mobile` and
        `storefront-tv`, kept in the native store (Keychain / Keystore), **never in
        `localStorage`**.
    deviceToken:
      type: apiKey
      in: header
      name: X-Arthome-Device-Token
      description: |
        ES256 JWT, `aud: "arthome.device"`, 180 days, **rotated on every use**, carrying `device_id`
        and nothing else. Obtained on first launch through `registerDevice`, **before any session**.
        It is not a session: it opens only pairing, pairing polling and the public bootstrap, and
        **opens no personal data** — in particular not the real-time channel (`adr-auth.md` §4/Q3,
        §5.3).
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: |
        W3C trace context. Created by the surface when it can, otherwise by the BFF. It is
        propagated to the service and injected into `outbox_event.tracecontext` **at write time**:
        injected later, the link is definitively lost.
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        examples:
        - 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    Surface:
      name: X-Arthome-Surface
      in: header
      required: true
      description: |
        The calling surface. It determines three **served** things, never guessed: the chat rate
        ceiling (television 2 msg/s, mobile 6, web 10), the size of the catch-up on entering a room
        (television 20 messages, 50 elsewhere) and which slice of the label and taxonomy catalogue to
        load.
        **A strict narrowing of `SURFACES`, and the strictness is the point.** The domain
        vocabulary has six members; this header accepts the three that can legitimately call the
        storefront BFF and **refuses the rest**, because an input is refused where an output is kept
        raw and treated as neutral. A studio surface reaching this header is not a value to tolerate,
        it is a caller in the wrong place.
      schema:
        type: string
        enum:
        - storefront_web
        - storefront_mobile
        - storefront_tv
        x-arthome-vocabulary-source: SURFACES
        x-arthome-vocabulary-narrowing: The three that may call the storefront BFF. A studio surface reaching this header is not a value to tolerate, it is a caller in the wrong place.
        examples:
        - storefront_tv
    ViewerTimezone:
      name: X-Arthome-Timezone
      in: header
      required: false
      description: |
        The viewer's IANA timezone, when the surface knows it. The server groups tonight's grid **in
        the viewer's local time**: the grouping depends on the timezone, and Next's server rendering
        does not know the visitor's.
      schema:
        type: string
        examples:
        - Europe/Paris
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 **generated by the surface before sending and persisted before sending**. A replayed
        key returns the original response, verbatim, with `Idempotency-Replayed: true` — never a
        duplicate error. Lifetime **24 h**, which covers an offline queue replayed after a night.
        See `architecture/transport.md` §5.4.
      schema:
        type: string
        format: uuid
        examples:
        - 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
    AdmissionToken:
      name: X-Arthome-Admission-Token
      in: header
      required: false
      description: |
        The admission out of a date's sales queue, as `getSalesQueuePosition` serves it: opaque to the
        surface, bound to one account and one date, and valid until its `expiresAt`. Required on
        `purchaseSeat`, and on `createPairing` for a `seat` (D-086), while that date's queue is armed;
        ignored otherwise. Provisional with the queue (D-081).
      schema:
        type: string
        minLength: 1
    LateEntryAcknowledged:
      name: X-Arthome-Late-Entry-Acknowledged
      in: header
      required: false
      description: |
        **Required once the live has started** (D-089): the buyer was told what they missed, as
        `SeatQuote.lateEntry` says it. Without it the purchase is refused with `409`
        `order.late_entry_unacknowledged` before any seat is held; any value but `true` is `400`.
        Ignored before the start. In a header, like the admission, so the idempotency fingerprint
        never covers it: a purchase placed before the start and retried after it adds it under the
        same key. A replayed key answers its original response without it.
      schema:
        type: string
        const: 'true'
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        **Opaque** cursor, Base64-encoded over `(created_at, id)`. Bidirectional and **independent of
        page size**: changing `limit` between two calls does not invalidate it, which is exactly what
        a screen rotation produces. Valid 24 h.
      schema:
        type: string
        examples:
        - eyJjIjoiMjAyNi0wOS0yMVQyMDowMDowMFoiLCJpIjoiMDE5OTI4ZjQifQ
    CursorDirection:
      name: direction
      in: query
      required: false
      description: Direction of travel. `backward` moves towards the most recent.
      schema:
        default: forward
        type: string
        enum:
        - forward
        - backward
        x-arthome-vocabulary-source: none
        x-arthome-vocabulary-reason: A sort or filter key. It is a property of THIS endpoint's list — which orders it offers — not of the domain, and adding one is an endpoint change rather than a vocabulary change.
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Requested page size. Display density (`tiles` / `list` on mobile) varies it; the cursor
        survives that.
      schema:
        default: 20
        type: integer
        minimum: 1
        maximum: 50
    DateId:
      name: dateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        examples:
        - 019928a0-7d31-7a10-b8c4-2f9e11a4c001
    ArtistId:
      name: artistId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      description: '**Stable** discipline identifier, never an array index.'
      schema:
        type: string
        examples:
        - dance-contemporary
  headers:
    ServedAt:
      description: |
        Server instant **of this response**. On a response replayed by idempotency, it differs from
        the body's `servedAt`, which is the first attempt's: a replay proves an effect took place, it
        does not promise fresh data.
      schema:
        type: string
        format: date-time
    IdempotencyReplayed:
      description: Present and `true` when the body is the memorised response of an earlier attempt.
      schema:
        type: boolean
    RetryAfterMs:
      description: Wait before retrying, in milliseconds. Used to disable a control cleanly rather than stack up refusals.
      schema:
        type: integer
        minimum: 0
    CacheControlPublic:
      description: |
        Set by the BFF. **`public` only on an anonymous read** — the body is then identical for every
        caller, hence shareable in a common cache and in Next's render cache. As soon as a session or
        a bearer token accompanies the request, the body carries the per-viewer overlays and the
        header becomes `private`: **serving a personalised body as `public` would be a leak, not an
        optimisation.**
      schema:
        type: string
        examples:
        - public, max-age=60
    VaryAuth:
      description: |
        **`Cookie, Authorization, X-Arthome-Device-Token, X-Arthome-Surface`.** Without this `Vary`,
        an intermediate cache would serve an anonymous visitor someone else's personalised body. The
        first three separate public from identified; `X-Arthome-Surface` separates the chat ceilings
        and the label catalogue slices, which differ per surface.
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request, or refused by shape validation.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code:
                    type: string
                    const: api.schema_invalid
                  params:
                    type: object
                    properties:
                      issues:
                        type: array
                        items:
                          type: object
                          properties:
                            path:
                              type: array
                              items:
                                anyOf:
                                - type: string
                                - type: integer
                                  format: int64
                            rule:
                              type: string
                              x-arthome-vocabulary:
                              - too_small
                              - too_big
                              - invalid_type
                              - invalid_format
                              - invalid_value
                              - unrecognized_key
                              - custom
                              x-arthome-vocabulary-source: SCHEMA_ISSUE_RULES
                            minimum:
                              type: number
                            maximum:
                              type: number
                            inclusive:
                              type: boolean
                            format:
                              type: string
                            values:
                              type: array
                              items:
                                type:
                                - string
                                - number
                                - boolean
                                - 'null'
                          required:
                          - path
                          - rule
                          additionalProperties: {}
                    required:
                    - issues
                    additionalProperties: {}
                  traceId:
                    type: string
                    minLength: 1
                    examples:
                    - 4bf92f3577b34da6a3ce929d0e0e4736
                    description: |
                      The `trace-id` part of the `traceparent`. Readable and copyable from the error screen: on
                      mobile it is the only link between "my application crashed" and a server log.
                  nature:
                    type: string
                    x-arthome-vocabulary:
                    - refused
                    - unavailable
                    - offline_forbidden
                    x-arthome-vocabulary-source: FAILURE_NATURES
                    x-arthome-unknown-fallback: unavailable
                    examples:
                    - refused
                    description: |
                      The decision the person has to make. `refused`: do not retry, understand. `unavailable`:
                      retry. `offline_forbidden`: a **local** refusal, before anything is sent — **never emitted by
                      the server**, present in the vocabulary so the surface has only one error shape to render.

                      **Open vocabulary on read, and this is where it matters most.** An unknown nature —
                      `degraded`, `needs_reauth` — is treated as **`unavailable`**, hence retryable. A frozen
                      `enum` here would make a television on an earlier version reject the whole envelope: it would
                      not lose a card, it would lose its ability to **read errors**, precisely when something is
                      already wrong, and on a fleet we cannot update.
                required:
                - code
                - params
                - traceId
                - nature
                additionalProperties: {}
              servedAt:
                type: string
                format: date-time
            required:
            - error
            - servedAt
            additionalProperties: {}
          example:
            error:
              code: api.schema_invalid
              nature: refused
              params:
                issues:
                - path:
                  - quantity
                  rule: too_small
                  minimum: 1
                  inclusive: true
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    Unauthorized:
      description: No valid session, or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.unauthenticated
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    CsrfRefused:
      description: |
        A write with the session cookie came without its `X-Arthome-Csrf` token, or with another
        session's (`api.forbidden`). A write with a bearer token never meets it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.forbidden
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    Forbidden:
      description: Session valide, droit absent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.forbidden
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    NotFound:
      description: Ressource inconnue.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.not_found
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    Conflict:
      description: |
        Definitive business refusal. The `code` says which one, and `params` carries what the screen
        must display — never a sentence.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: order.price_stale
              nature: refused
              params:
                expectedAmountMinor: 2400
                currentAmountMinor: 2900
                currencyCode: EUR
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    Gone:
      description: The targeted cursor, pairing or replay has expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.cursor_too_old
              nature: refused
              params:
                maxAgeHours: 24
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    TooManyRequests:
      description: Rate limit reached. `params.retryAfterMs` allows the control to be disabled instead of stacking up refusals.
      headers:
        Retry-After-Ms:
          $ref: '#/components/headers/RetryAfterMs'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: chat.rate_limited
              nature: unavailable
              params:
                retryAfterMs: 3000
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    Unavailable:
      description: |
        Our servers. `nature: "unavailable"` is what lets the surface say "our servers" rather than
        "your connection" — a transport failure, by contrast, has no body and reads as "your
        connection".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.service_unavailable
              nature: unavailable
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    PayloadTooLarge:
      description: The body is over the ceiling of the route (1 MiB unless the route says otherwise).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.payload_too_large
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    UnsupportedMediaType:
      description: The body is not `application/json`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.unsupported_media_type
              nature: refused
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    InternalError:
      description: A fault of ours, never retried as is.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.internal
              nature: unavailable
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    BadGateway:
      description: A service behind the BFF failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.upstream_unavailable
              nature: unavailable
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
    GatewayTimeout:
      description: The BFF stopped waiting for a service, or the deadline was already past. A command is retried with its `Idempotency-Key`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: api.upstream_timeout
              nature: unavailable
              params: {}
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'
  schemas:
    EnvelopeMeta:
      type: object
      properties:
        servedAt:
          type: string
          format: date-time
          examples:
          - '2026-09-21T20:31:04.118Z'
          description: |
            Server instant. **Every** displayed countdown is computed against it, never against the
            client's clock.
        validUntil:
          description: |
            Present as soon as a perishable value is in the response. Past that instant, the surface
            **calls the same `@arthome/core` function again** with the inputs it already has — it does
            not rewrite the rule, it re-runs it.
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          format: date-time
          examples:
          - '2026-09-21T20:31:34.118Z'
        lastEventSeq:
          description: Sequence number of the last event applied to the read model. Resume point.
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
        degraded:
          examples:
          - - viewerProgress
          description: |
            The **optional** parts that could not be composed. The response is served anyway: a
            per-viewer overlay that fails degrades the card, it does not sink the screen.
          type: array
          items:
            type: string
      required:
      - servedAt
      additionalProperties: {}
    CursorPageInfo:
      type: object
      properties:
        nextCursor:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]+=*$
          - type: 'null'
        prevCursor:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]+=*$
          - type: 'null'
        hasMore:
          type: boolean
        approximateTotal:
          examples:
          - 428
          description: |
            **Approximate and bounded** count. It is exact up to the threshold served as
            `DomainConstants.searchExactTotalLimit`, and beyond it the contract promises only that the
            true count is **at least** the value served — `totalIsLowerBound` says so. That is what
            makes "See more · N remaining" honest without promising an exact count an index does not
            give.

            **The threshold is served, not written here, and no engine is named.** A number carved into
            a description is a constant with no owning document (rule 15), and a vendor's parameter
            named in a contract is the search engine's shape showing through the boundary — it would
            have to be renamed the day the engine changes, in a document a generated client carries.
          anyOf:
          - type: integer
          - type: 'null'
        totalIsLowerBound:
          description: When true, `approximateTotal` is a **lower bound**, not a total.
          default: false
          type: boolean
        emptyReason:
          description: |
            Why the list is empty. An empty list without a reason forces the surface to guess and to
            write a generic empty state, which the brief forbids. Each value produces a different screen,
            **with an action that leads out of the dead end**.
          x-arthome-vocabulary:
          - no_match_for_query
          - no_match_with_filters
          - nothing_in_category_yet
          - no_live_in_category
          - no_upcoming_in_category
          - no_replay_in_category
          - no_followed_artist
          - no_followed_artist_live
          - no_order_yet
          - no_ticket_yet
          - no_replay_available
          - empty_cart
          - no_saved_search
          - no_watchlist_entry
          x-arthome-vocabulary-source: EMPTY_REASONS
          type:
          - string
          - 'null'
        emptyActionCode:
          description: |
            The code of the action that leads out of the dead end ("see the categories", "browse"). It
            is a **served action code**, not a sentence and not a constant copied across five
            surfaces.
          type:
          - string
          - 'null'
      required:
      - hasMore
      additionalProperties: {}
    Error:
      type: object
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$
          x-arthome-vocabulary:
          - api.unauthenticated
          - api.token_expired
          - api.forbidden
          - api.not_found
          - api.rate_limited
          - api.schema_invalid
          - api.internal
          - api.service_unavailable
          - api.upstream_unavailable
          - api.cursor_too_old
          - api.sort_key_forbidden
          - api.period_filter_required
          - api.rights_version_stale
          - api.idempotency_key_reused
          - api.idempotency_in_flight
          - api.deadline_exceeded
          - api.upstream_timeout
          - api.payload_too_large
          - api.unsupported_media_type
          - api.reauthentication_required
          - identity.email_taken
          - identity.handle_taken
          - identity.invalid_credentials
          - identity.two_factor_required
          - identity.signed_out_elsewhere
          - identity.verification_link_invalid
          - pairing.slow_down
          - pairing.identity_mismatch
          - pairing.intent_not_engageable
          - pairing.execution_engaged
          - chat.holders_only
          - chat.rate_limited
          - moderation.already_claimed
          - moderation.already_settled
          - moderation.automatic_cannot_override_human
          - moderation.decision_version_stale
          - artist.slug_taken
          - date.has_sold_seats
          - date.outcome_decision_forbidden
          - date.prices_locked
          - date.prices_currency_mismatch
          - date.replay_policy_final
          - date.technical_check_required
          - date.technical_provision_required
          - date.provision_deadline_passed
          - date.provision_below_capacity
          - date.stream_key_rotation_during_run
          - date.postponement_limit_reached
          - channel.has_open_obligations
          - channel.crew_role_reserved
          - channel.role_not_assignable
          - channel.transfer_target_ineligible
          - channel.same_actor_forbidden
          - payout.reconciliation_discrepancy_unexplained
          - order.quote_address_mismatch
          - order.sold_out
          - order.payment_declined
          - order.price_stale
          - order.plan_unavailable
          - order.contribution_out_of_range
          - order.checkout_line_unavailable
          - order.sales_queue_admission_required
          - order.late_entry_unacknowledged
          - order.sales_closed
          - seat.cancel_deadline_passed
          - payment_method.in_use
          - capacity.tier_must_widen
          - content.empty_in_both_languages
          - hold.quantity_invalid
          - media.size_invalid
          - media.url_empty
          - order.quantity_invalid
          - pairing_code.ambiguous_glyph
          - publication.checklist_incomplete
          - publication.promise_unacknowledged
          - publication.transition_forbidden
          - publication.transition_irreversible
          - search.unknown_flag
          - seat_code.malformed
          - state.conflict
          - watch.no_seat
          - watch.room_not_open
          - watch.out_of_territory
          - watch.subscription_required
          - watch.no_replay
          - watch.replay_expired
          - watch.replay_not_on_sale
          - watch.preview_exhausted
          - watch.concurrent_limit_reached
          - watch.date_cancelled
          - watch.not_published
          x-arthome-vocabulary-source: ERROR_CODES
          examples:
          - publication.transition_irreversible
          description: |
            Closed vocabulary, i18n by codes. **Never a sentence.** A code unknown to one version of the
            application falls back on the snapshot embedded at build time — that is an operating
            condition on mobile, where store review is slow.
        params:
          type: object
          properties: {}
          additionalProperties: {}
          examples:
          - from: scheduled
            to: reserve
            promise: prices_engaged
          description: The message's parameters, never the message.
        traceId:
          type: string
          minLength: 1
          examples:
          - 4bf92f3577b34da6a3ce929d0e0e4736
          description: |
            The `trace-id` part of the `traceparent`. Readable and copyable from the error screen: on
            mobile it is the only link between "my application crashed" and a server log.
        nature:
          type: string
          x-arthome-vocabulary:
          - refused
          - unavailable
          - offline_forbidden
          x-arthome-vocabulary-source: FAILURE_NATURES
          x-arthome-unknown-fallback: unavailable
          examples:
          - refused
          description: |
            The decision the person has to make. `refused`: do not retry, understand. `unavailable`:
            retry. `offline_forbidden`: a **local** refusal, before anything is sent — **never emitted by
            the server**, present in the vocabulary so the surface has only one error shape to render.

            **Open vocabulary on read, and this is where it matters most.** An unknown nature —
            `degraded`, `needs_reauth` — is treated as **`unavailable`**, hence retryable. A frozen
            `enum` here would make a television on an earlier version reject the whole envelope: it would
            not lose a card, it would lose its ability to **read errors**, precisely when something is
            already wrong, and on a fleet we cannot update.
      required:
      - code
      - params
      - traceId
      - nature
      additionalProperties: {}
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
        servedAt:
          type: string
          format: date-time
      required:
      - error
      - servedAt
      additionalProperties: {}
    Money:
      type: object
      properties:
        amountMinor:
          type: integer
          format: int64
          examples:
          - 2400
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}$
          examples:
          - EUR
      required:
      - amountMinor
      - currencyCode
      additionalProperties: {}
      description: |-
        An amount. **Integer minor unit** — cents for EUR and CHF — plus an ISO 4217 currency code.
        Never a formatted string: formatting is presentation and happens client-side. May be negative
        (credit, refund).

        **`Money` says nothing about tax, and that is deliberate.** It carries credits, refunds,
        commissions and payouts as well as prices. **A price, however, is tax-inclusive** (D-056),
        and every field that is one says so where it is declared rather than relying on this shape —
        a reader who assumes the wrong side of a VAT rate computes a total that is wrong by that
        rate, and `Money` is not the place that can warn them.
    LocalizedText:
      type: object
      properties:
        contentLanguage:
          type: string
          examples:
          - fr
        text:
          type: string
      required:
      - contentLanguage
      - text
      additionalProperties: {}
      description: |
        **Authored** text, as opposed to an interface label. It travels with the language it was
        written in. The only two accepted exceptions to "i18n by codes": the hold-screen message
        written by the control room, and the studio inbox texts.
    ImageRendition:
      type: object
      properties:
        url:
          type: string
          format: uri
        widthPx:
          type: integer
          minimum: 1
        heightPx:
          type: integer
          minimum: 1
      required:
      - url
      - widthPx
      - heightPx
      additionalProperties: {}
      description: |
        A visual **already rendered at a size actually displayed**, never a URL recipe with a width
        template: on a television with 1 GB, a 4K backdrop decoded for a thumbnail costs as much as a
        full screen.
    MediaSet:
      type: object
      properties:
        wide:
          description: 16:9, smallest to largest.
          type: array
          items:
            $ref: '#/components/schemas/ImageRendition'
        poster:
          description: 2:3 or 3:4 depending on the surface, smallest to largest.
          type: array
          items:
            $ref: '#/components/schemas/ImageRendition'
      additionalProperties: {}
    VenueClock:
      type: object
      properties:
        venueTimezone:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_+-]*(?:\/[A-Za-z0-9_+-]+)+$
          examples:
          - Europe/Paris
        venueUtcOffsetMin:
          type: integer
          minimum: -720
          maximum: 840
          examples:
          - 120
      required:
      - venueTimezone
      - venueUtcOffsetMin
      additionalProperties: {}
      description: |-
        The venue's timezone, served alongside the UTC instant it qualifies. The offset is
        **computed by the server for that instant**, never stored: this is not a return to a frozen
        offset, it is a served value, and it avoids embedding a timezone database in five
        applications.
    SessionMode:
      type: string
      enum:
      - cookie
      - bearer
      - device
      x-arthome-vocabulary-source: SESSION_MODES
      description: |
        **An explicit, validated parameter, never inferred from the `User-Agent`** — that is
        forgeable, and a bypassable heuristic does not count as an answer.

        `cookie` for the web surfaces; `bearer` for the native shells, where
        `capacitor://localhost` is a third-party context on iOS and no cookie would survive;
        `device` for the television, which has **neither cookie nor token** at the moment it opens a
        sign-in pairing — which is what device identity solves.
    SessionEstablished:
      oneOf:
      - $ref: '#/components/schemas/SessionEstablishedCookie'
      - $ref: '#/components/schemas/SessionEstablishedBearer'
      discriminator:
        propertyName: mode
        mapping:
          cookie: '#/components/schemas/SessionEstablishedCookie'
          bearer: '#/components/schemas/SessionEstablishedBearer'
          device: '#/components/schemas/SessionEstablishedBearer'
      description: |
        **Invariant: a response never carries both a cookie and a token.** Two bearers for one
        session means **two revocations to maintain and one that will be forgotten** — that is what
        stops a session surviving its own sign-out. So this is not a schema with an optional field:
        it is **two schemas**, discriminated by mode.
    SessionEstablishedCookie:
      type: object
      properties:
        mode:
          type: string
          const: cookie
        viewerContext:
          description: |
            **Projected, never the authentication library's raw shape.** The surface receives the context
            it uses everywhere else, and does not have two session shapes to know about.
          $ref: '#/components/schemas/ViewerContext'
      required:
      - mode
      - viewerContext
      additionalProperties: {}
      description: |
        The cookie is set in a `Set-Cookie` header — `HttpOnly`, `Secure`, `SameSite=Lax`, on the
        **BFF's domain**. **Nothing in the body**: no token, no session identifier.
    SessionEstablishedBearer:
      type: object
      properties:
        mode:
          type: string
          x-arthome-vocabulary:
          - bearer
          - device
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: 'A narrowing of a vocabulary named elsewhere in this document, with the reason in the description above: the members left out are the rule, not an omission.'
          description: |
            **A narrowing of `SessionMode` to the two token-bearing modes.** `cookie` is absent
            because a cookie response carries **nothing in the body** — that is the whole point of the
            split — so this branch cannot describe it. `device` shares this schema rather than having
            its own: a device session is token-shaped, and the discriminator maps both values here.

            The studio has no such branch because it has no device sessions; only a television carries
            a device token.
        accessToken:
          type: string
        refreshToken:
          description: |
            **Always `null` on the storefront.** The session slides instead: seven days, renewed by
            use at most once a day (`adr-auth.md` §6.1), so the access token is the session and no
            operation takes a refresh token.
          type:
          - string
          - 'null'
        expiresAt:
          type: string
          format: date-time
        viewerContext:
          $ref: '#/components/schemas/ViewerContext'
      required:
      - mode
      - accessToken
      - expiresAt
      - viewerContext
      additionalProperties: {}
      description: |
        Opaque token in the body, **no cookie**. The client stores it in the native store —
        Keychain, Keystore, `@capacitor/preferences` — **never in `localStorage`**, which is tied to
        the origin, can be cleared by the system, and travels in no way at all.
    DomainConstants:
      type: object
      properties:
        roomOpensMinutesBefore:
          type: integer
          examples:
          - 30
        cancelDeadlineMinutesBefore:
          type: integer
          examples:
          - 60
        scarcityThresholdBps:
          type: integer
          examples:
          - 8500
          description: Fill rate above which a date is "nearly sold out", in basis points.
        billboardPreviewDelaySec:
          type: integer
          examples:
          - 4
        waitlistPriorityWindowHours:
          type: integer
          examples:
          - 2
        chatRateLimitPerSecond:
          type: integer
          examples:
          - 2
          description: Ceiling **enforced at the source**, for the calling surface — television 2, mobile 6, web 10.
        chatCatchUpMessages:
          description: Number of catch-up messages served on entering a room — television 20, elsewhere 50.
          type: integer
          examples:
          - 20
        reactionQuotaPerDate:
          description: |
            **Optional, and absent today.** The product owner has decided a graduated rate in place of a
            per-date quota; no document owns its numbers yet, and `sendReaction` serves what remains
            (`realtime.md` §2.3). Never null: a null quota would read as no quota at all.
          type: integer
        reminderLeadMinutes:
          type: integer
          examples:
          - 30
        replayExpiryWarningHours:
          type: integer
          examples:
          - 6
        previewSecondsTotal:
          description: |
            **The total of the free preview.** `WatchVerdict.previewSecondsLeft` served the **remainder**
            and nothing served the total: the countdown "4 min 12 left" had a remainder with no
            denominator, and the copy says "the first 5 minutes". Rule 15 — the constant had no owning
            document.
          type: integer
          examples:
          - 300
        searchExactTotalLimit:
          description: |
            **The threshold beyond which `approximateTotal` becomes a lower bound.** It was carved into
            the prose as "exact up to 10,000": we were serving the default of a search engine parameter,
            in a vendor's name. Served as a constant, it survives a change of engine.
          type: integer
          examples:
          - 10000
        creditDelayCode:
          description: |
            The refund delay is a **code**, never the sentence "3 to 5 business days" — which is a
            policy, hence translatable, hence i18n.
          type: string
          examples:
          - refund_delay_business_days_3_5
      required:
      - roomOpensMinutesBefore
      - cancelDeadlineMinutesBefore
      - scarcityThresholdBps
      - billboardPreviewDelaySec
      - waitlistPriorityWindowHours
      - chatRateLimitPerSecond
      - reminderLeadMinutes
      - replayExpiryWarningHours
      additionalProperties: {}
      description: |
        The domain constants, **served**. They live in `@arthome/core` and are copied nowhere:
        copied, "the web will say 30 minutes, the television 15, and mobile will be right by
        accident" (E11, `storefront-mobile` Q10).
    LabelArtifactRef:
      type: object
      properties:
        domain:
          type: string
          x-arthome-vocabulary:
          - common
          - storefront
          - studio
          - taxonomy
          - system
          x-arthome-vocabulary-source: MESSAGE_DOMAINS
          examples:
          - storefront
          description: |
            **Which catalogue this reference is for**, served rather than recoverable by taking the
            URL apart. The theme lived only inside the path (`/i18n/studio/fr/v41.json`), so a client
            caching catalogues by theme had to parse a string to learn what it was holding — which is
            `imageUrl(kind, key, width)` in another costume, and the same rule answers it: **a value
            recoverable only by parsing a string is a value the contract did not serve.**
        locale:
          type: string
          x-arthome-vocabulary:
          - fr
          - en
          x-arthome-vocabulary-source: LOCALES
          examples:
          - fr
          description: |
            **The domain declares exactly two**, and the contract says so rather than serving an
            open string: a surface choosing a fallback needs to know the set it is choosing from.
            Tolerant on output like every other served vocabulary — a third locale is kept raw and
            treated as neutral, never rejected.
        version:
          type: integer
          examples:
          - 41
        url:
          type: string
          format: uri
      required:
      - domain
      - locale
      - version
      - url
      additionalProperties: {}
      description: |
        The label catalogue is **not a service**: it is an immutable versioned artefact published on
        the CDN. The current version is served here, **never through a per-page call**, and every
        application embeds a build-time snapshot as a **mandatory fallback** — that is the only thing
        guaranteeing no raw code ever reaches the screen.
    ProfileSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples:
          - Marie
        kind:
          type: string
          x-arthome-vocabulary:
          - adult
          - child
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: 'An account-management shape, local to this endpoint: what the person asked for, not a fact the domain reasons about.'
          examples:
          - adult
        avatar:
          $ref: '#/components/schemas/ImageRendition'
        allowedCategoryIds:
          description: |
            Present for a child profile. Filtering the child catalogue happens **server-side**:
            otherwise a child's television downloads the adult catalogue in order to hide it.
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
      required:
      - id
      - name
      - kind
      additionalProperties: {}
      description: Up to five per account — a shared-television constraint, carried by the account.
    ViewerPreferences:
      type: object
      properties:
        account:
          type: object
          properties:
            interfaceLocale:
              type: string
              examples:
              - fr
            subtitlesDefault:
              type: boolean
            subtitleLanguage:
              description: |
                **Turning subtitles on and choosing their language are two settings.** The contract carried
                only the boolean; the design carries a language. A viewer who wants English subtitles on a
                French show was inexpressible.
              examples:
              - fr
              type:
              - string
              - 'null'
            audioDescription:
              type: boolean
            liveOpenBehaviour:
              type: string
              x-arthome-vocabulary:
              - peek
              - muted
              - 'off'
              x-arthome-vocabulary-source: none
              x-arthome-vocabulary-reason: A presentation choice the contract serves so that five surfaces do not each invent one. The domain has no opinion on it.
            chatOpenByDefault:
              type: boolean
            readingTimezone:
              description: The **same field** as the studio's reading timezone — one account, one carrier.
              type: string
              examples:
              - Europe/Paris
          additionalProperties: {}
        device:
          type: object
          properties:
            defaultQuality:
              type: string
              x-arthome-vocabulary:
              - auto
              - low
              - medium
              - high
              x-arthome-vocabulary-source: none
              x-arthome-vocabulary-reason: A presentation choice the contract serves so that five surfaces do not each invent one. The domain has no opinion on it.
            subtitleSizeStep:
              type: integer
            reduceMotion:
              type: boolean
            autoplayPreview:
              type: boolean
            dataSaver:
              type: boolean
          additionalProperties: {}
      additionalProperties: {}
      description: |
        **Two scopes, settled field by field** (`storefront-tv` Q8). Language, default subtitles,
        audio description, behaviour when a live show opens and the reading timezone depend on the
        **person**; default quality, subtitle size, reduced motion and automatic preview depend on
        the **device** and the room. A single scope would be wrong half the time.

        The resource is **additive and tolerant**: a key unknown to one version of the application is
        neither rejected nor erased on the next write — otherwise the mobile version stuck in store
        review overwrites settings made from the web.
    ViewerContext:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        signedIn:
          type: boolean
        currentProfileId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSummary'
        account:
          anyOf:
          - type: object
            properties:
              publicHandle:
                type: string
                examples:
                - '@marie.j'
              memberNumber:
                type: string
              emailVerified:
                type: boolean
            additionalProperties: {}
          - type: 'null'
        plan:
          description: |
            The **displayed** plan, served to paint prices and badges. It **never** decides a right to
            watch: that right is returned by `streaming` when the player opens, on fresh data
            (`adr-auth.md` §7.1).
          anyOf:
          - type: object
            properties:
              tier:
                type: string
                x-arthome-vocabulary:
                - free
                - pass
                - premium
                x-arthome-vocabulary-source: PLAN_TIERS
              state:
                type: string
                x-arthome-vocabulary:
                - active
                - past_due
                - cancelled
                - trialing
                x-arthome-vocabulary-source: SUBSCRIPTION_STATES
              seatDiscountBps:
                type: integer
                examples:
                - 1000
              concurrentStreamsAllowed:
                type: integer
                examples:
                - 2
            additionalProperties: {}
          - type: 'null'
        preferences:
          $ref: '#/components/schemas/ViewerPreferences'
        constants:
          $ref: '#/components/schemas/DomainConstants'
        labelCatalog:
          anyOf:
          - $ref: '#/components/schemas/LabelArtifactRef'
          - type: 'null'
          description: |
            **Null: nothing newer than the snapshot embedded at build time**, which the surface then
            uses. A real state, not a gap: before the first publication, or for a surface or a locale
            nothing was published for (`context-map.md` §1.8).
        taxonomyArtifact:
          anyOf:
          - $ref: '#/components/schemas/LabelArtifactRef'
          - type: 'null'
          description: |
            Same regime as the i18n catalogue, **served per slice and per surface**: mobile loads
            neither the studio vocabulary nor the television key table. 59.5 KB raw / 8.4 KB gzipped for
            the full slice — this is not an API call. Null as for `labelCatalog`: the embedded snapshot.
        realtime:
          description: Where to open **the single** real-time connection. Multiplexing is per room, never per connection.
          type: object
          properties:
            namespace:
              type: string
              examples:
              - /storefront
            pulseIntervalSec:
              type: integer
              examples:
              - 5
          additionalProperties: {}
      required:
      - deviceId
      - profiles
      - constants
      - labelCatalog
      - taxonomyArtifact
      additionalProperties: {}
      description: |
        The bootstrap payload. **A single call**, and it is the entire budget of the `boot` screen:
        the device's profiles, rights, preferences, domain constants, label catalogue version. The
        labels themselves come from the embedded snapshot — the version check **never** blocks the
        first render.
    ChangeFeed:
      type: object
      properties:
        invalidated:
          type: array
          items:
            type: string
            x-arthome-vocabulary:
            - date:{id}
            - date:{id}:availability
            - artist:{id}
            - category:{id}
            - account:tickets
            - account:orders
            - account:subscription
            - account:cart
            - account:profile
            - account:devices
            - account:payment-methods
            - home:rails
            x-arthome-vocabulary-source: none
            x-arthome-vocabulary-reason: |
              Cache tags, not a domain vocabulary. They name what a surface must revalidate, in
              Next's `revalidateTag` namespace convention, and the domain has no notion of them:
              `@arthome/core` knows a date, not `date:{id}`.
          examples:
          - - date:019928a0-7d31-7a10-b8c4-2f9e11a4c001
            - account:tickets
          description: |
            Tags **named by the contract**, never invented by a surface — otherwise mobile and television
            would invent others and Next's server rendering would call `revalidateTag` on keys nobody
            emits.

            **This list is the union of two families, and they are not symmetric with
            `x-arthome-invalidates`.** That extension names, on a write, the reads that write makes
            false — it therefore covers only what the caller **caused**. The three catalogue tags
            appear in no `x-arthome-invalidates` and that is not a gap: nothing on the storefront
            writes the catalogue. `date:{id}`, `artist:{id}` and `category:{id}` reach this feed
            because the **studio** published, which is the case the description above calls "what the
            storefront did not cause". Counting the two lists against each other therefore proves
            nothing; a tag missing from **this** list is the defect, because it is the list
            `revalidateTag` reads.

            The `{…}` placeholder is the identifier of the resource. In `x-arthome-invalidates` the
            same tag is written with the operation's own path parameter (`date:{dateId}:availability`)
            because that is what supplies the value; it is the same tag.
        complete:
          type: boolean
          description: |
            `false` means "too many changes, reload everything" — the same honesty as `resume:too_old`
            on the real-time channel. A client that does not know what it missed is worse than a client
            that reloads.
      required:
      - invalidated
      - complete
      additionalProperties: {}
      description: |
        **A list of invalidations, not the data.** On returning to the foreground, a surface
        revalidates half a dozen reads at once; refusing that burst means refusing to open the
        application. One request instead of twelve.
    WatchVerdict:
      type: object
      properties:
        allowed:
          type: boolean
        scope:
          description: |
            **`allowed` alone cannot say what kind of access was allowed**, and that was a real gap
            rather than a nicety. `PlaybackTicket` — the binding verdict — has carried `full` versus
            `preview` since it was written; this one, the advisory verdict a card is painted from,
            carried only a boolean. So a card for a subscription-required date with budget remaining
            had to infer preview-ness from `previewSecondsLeft > 0`, which is a rule evaluated on
            three storefronts instead of served once (rule 2), and the card must say "Watch 5 min
            free" rather than "Watch" **without a second call**.

            It is the same vocabulary as `PlaybackTicket.scope`, deliberately: two evaluation sites,
            one implementation, and now one shape.
          type: string
          x-arthome-vocabulary:
          - full
          - preview
          - none
          x-arthome-vocabulary-source: WATCH_SCOPES
          examples:
          - preview
        advisory:
          type: boolean
          description: |
            `true` everywhere in this document. The binding verdict is the one from `POST /v1/playback/{dateId}/open`.
        denialReasonCode:
          description: |
            The **same refusal vocabulary** as the player: a card announcing "subscription required" and
            a player refusing for the same reason say the same code. Each produces a different screen on
            the three storefronts; a generic code would produce a false one.

            **One dotted-lowercase form, like every other code.** This rides on `reasonParams`, which is
            the error envelope's `code` + `params` shape, and it stands beside `order.price_stale` and
            `api.cursor_too_old`. The declaration and the wire once disagreed on spelling, so
            `denialReasonCode === WatchDenialReason.NO_SEAT` compared `'NO_SEAT'` to `'no_seat'` and was
            **false for every value**, silently, across the storefront's entire refusal experience. A
            separator-insensitive comparison cannot see a case difference, which is why it outlived two
            passes looking for exactly this defect. D-067 settled it: the wire form is dotted lowercase
            and the accessor is SCREAMING_SNAKE, so nothing compares a literal.

            **`watch.not_published` is the eleventh**, and it was missing here for the same reason
            `displayState` was missing three members: `decideWatch` returns it for a `draft`, `reserve`
            or `technical` date, and the non-public states keep falling out of contracts because no
            public screen shows them.
          x-arthome-vocabulary:
          - watch.no_seat
          - watch.room_not_open
          - watch.out_of_territory
          - watch.subscription_required
          - watch.no_replay
          - watch.replay_expired
          - watch.replay_not_on_sale
          - watch.preview_exhausted
          - watch.concurrent_limit_reached
          - watch.date_cancelled
          - watch.not_published
          x-arthome-vocabulary-source: WATCH_DENIAL_REASONS
          examples:
          - watch.subscription_required
          type:
          - string
          - 'null'
        reasonParams:
          description: What the screen must display — the territory, the plan required, the expiry instant.
          type: object
          properties: {}
          additionalProperties: {}
        fallbackAction:
          description: |
            The action that leads out of the dead end. A code, never a sentence, and never a dead screen.

            **Not nullable, and that is the point of `none` being a member.** `decideWatch` returns
            `none` when there is nothing to offer, so the absence is **spelled** rather than left to a
            null. Nullable would make `null` and `none` two spellings of one state, and a third
            meaning — "not denied" — would attach itself to whichever the writer had in mind.

            **And an ALLOWED verdict carries a real action.** A viewer watching on `scope: preview`
            gets `buy_seat` beside it, before D-089's cutoff; past it, `see_other_dates`. A surface reading `null` as "no action" would be right for
            `denialReasonCode`, where null genuinely means *not denied*, and would silently drop the
            preview-to-purchase step — the one path that turns a free viewer into a paying one. The
            two fields look alike and must not be read alike.

            **The two vocabularies are coupled, and the coupling is data rather than prose.**
            A fallback action exists to answer a denial reason, so the invariant is: every reason maps
            to an action that leads out of it, and every action answers at least one reason.
            **`WATCH_FALLBACK_FOR` in `@arthome/core` holds the mapping**, with a spec asserting both
            directions and asserting that `decideWatch` never returns a pairing the table forbids.

            **This description used to restate that table row by row, and that was a parallel literal
            table** — eleven rows of it, written to prevent drift, in a document that cannot be
            executed, next to a table that can. So it is gone: the rule is here, the rows are in core,
            and a surface that needs to know which action answers which reason reads the constant.

            **One row deserves its argument in the contract rather than in the domain**, because it is
            a contract obligation and not a domain preference: `adr-stream-entitlement.md` §3.3
            requires a `watch.concurrent_limit_reached` refusal to be served with the list of active
            sessions *"so the surface can offer to release one. A bare refusal would leave the viewer
            with no way out"*. This contract stated that refusal for its whole life and had no action
            expressing the remedy, which is the dead end principle 8 forbids. `release_a_screen` is
            what closes it.

            **`watch_preview` is not here, and the round trip that removed it is worth recording.** It
            crossed this boundary three times in a day because two people were each answering the
            other's last message instead of the code. The test that ends that, and the one this
            contract now defers to: **does a function return it?** `decideWatch` does not — the free
            preview is expressed by an **allowed** verdict carrying `scope: preview` on both the live
            and the replay path, with `buy_seat` beside it before D-089's cutoff, `see_other_dates` past it. A preview a viewer can still watch is not
            a way out of a refusal, because there is no refusal.

            What the member was compensating for is the finding worth keeping: `WatchVerdict` had no
            way to say "allowed, but only as a preview", so preview-ness was inferred from
            `previewSecondsLeft > 0` on three storefronts instead of being served once. The fix was the
            `scope` field, not a fallback action. **When a vocabulary member answers nothing, look for
            the field that is missing.**
          type: string
          x-arthome-vocabulary:
          - buy_seat
          - join_waitlist
          - subscribe
          - see_replay_policy
          - see_other_dates
          - release_a_screen
          - none
          x-arthome-vocabulary-source: WATCH_FALLBACK_ACTIONS
        previewSecondsLeft:
          description: |
            Remaining preview budget, **counted server-side, per account** — not per device, otherwise a
            household with four devices gets four previews; not per date alone, it is `(account, date)`.
            Reloading the page extends nothing.
          anyOf:
          - type: integer
          - type: 'null'
        validUntil:
          type: string
          format: date-time
      required:
      - allowed
      - advisory
      - validUntil
      additionalProperties: {}
      description: |
        The right to watch, a **first-class shape**, served per date. It exists at **two evaluation
        sites for one implementation** (`decideWatch` in `@arthome/core`):

        - **here**, composed by the BFF from its batched reads — **advisory and not binding**, and
          the contract declares it so with `advisory: true`. It serves to paint the card without a
          second round trip, which the television requires;
        - **when the player opens**, by `streaming`, from its own projected copies. **This is the
          only evaluation that is authoritative**, because it is the only one that produces a token.

        **It is never cached to disk.** It expires, it depends on territory, it depends on the screen
        limit: a right read back from disk is a false right. `validUntil` never exceeds 60 seconds.
    DateCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        showId:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        artist:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              examples:
              - Compagnie Verticale
            verified:
              type: boolean
            avatar:
              $ref: '#/components/schemas/ImageRendition'
          required:
          - id
          - name
          additionalProperties: {}
        slug:
          type: string
          examples:
          - '2026-09-21'
        canonicalUrl:
          type: string
          format: uri
          description: |
            **Served, never built by the surface.** It is what gets shared, bookmarked, what a reminder
            and a notification point at, and what gets indexed — and it is what the television encodes in
            a QR code for the Share action, since a television has neither a clipboard nor a useful
            messaging app.
        title:
          type: string
        categoryId:
          type: string
          examples:
          - dance-contemporary
        genreIds:
          description: '**Multiple**: a show is both "contemporary" and "repertoire" at once. The singular forbade it (E9).'
          type: array
          items:
            type: string
        tagIds:
          type: array
          items:
            type: string
        startsAt:
          type: string
          format: date-time
        venueClock:
          $ref: '#/components/schemas/VenueClock'
        runtimeMin:
          type: integer
        venue:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            city:
              type: string
            countryCode:
              type: string
              pattern: ^[A-Z]{2}$
          additionalProperties: {}
        roomOpensAt:
          type: string
          format: date-time
          description: |
            The **instant** the room opens, served. The surface schedules the switch locally, to the
            second, **without a single call**: a standby mode running for eight hours therefore makes no
            request at all.
        displayState:
          type: string
          x-arthome-vocabulary:
          - draft
          - reserve
          - scheduled
          - technical
          - room_open
          - live
          - replay
          - ended
          - postponed
          - cancelled
          - interrupted
          x-arthome-vocabulary-source: DISPLAY_STATES
          examples:
          - live
          description: |
            The **only** state value the cards display, and nobody recomposes it. Produced by
            `publicDisplayStateOf(publication, run, outcome, instants, now)` in `@arthome/core`. The
            hierarchy, written once: `outcome` outranks `run.state`, which outranks `publication.state`.

            **One vocabulary, eleven members, and the narrowing is said here rather than written as a
            second list.** A storefront never receives `draft`, `reserve` or `technical` — not by
            filtering, but **by construction**: a date reaches a public surface only once it is
            published, and a published date under technical check is shown on the time axis. Declaring only the eight would be a second authored list for a field the
            domain already defines, and two independently authored lists for one field is how E4
            started. A surface that wants to know what it can actually receive reads this sentence;
            the vocabulary stays the domain's.
        displayStateValidUntil:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: |
            The instant the displayed state stops being true, the one `publicDisplayStateOf` returns.
            **`null` when only an event can change it**: an outcome, or a date fully over. Never an
            invented instant: a surface that re-runs the rule at a made-up time shows a false state.
        outcome:
          description: |
            The outcome **replaces the state on every card**, not only on the detail page. It is a fact
            about the performance, never erased; only a postponement can be followed by another outcome
            (D-076). A postponement moves the date to `rescheduledTo` and replaces the state only until the
            room opens there.
          x-arthome-vocabulary:
          - postponed
          - cancelled
          - interrupted
          x-arthome-vocabulary-source: DATE_OUTCOMES
          type:
          - string
          - 'null'
        rescheduledTo:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        viewers:
          description: |
            **Absent — never zero — when the date is not on air.** A zero reads as "nobody", not as "not
            measured", and the brief's rule forbids "0 WATCHING".
          anyOf:
          - type: integer
          - type: 'null'
        availability:
          description: Projected from `ticketing`. Absent while no price is active.
          anyOf:
          - type: object
            properties:
              seatsAvailable:
                type: integer
              waitlistCount:
                type: integer
              fillRateBps:
                description: |
                  The **rate**, not the capacity. Serving the capacity and letting the client compute recreates
                  the value composed in two places, and the design proves it by applying a constant of 2,000
                  seats regardless of the venue.
                type: integer
              soldOut:
                type: boolean
              lowestPrice:
                x-arthome-tax-basis: inclusive
                $ref: '#/components/schemas/Money'
              promotion:
                anyOf:
                - type: object
                  properties:
                    reason:
                      type: string
                      x-arthome-vocabulary:
                      - pre_sale
                      - preview_night
                      - discovery_rate
                      - final_date
                      - late_rate
                      x-arthome-vocabulary-source: PROMOTION_REASONS
                    struckPrice:
                      x-arthome-tax-basis: inclusive
                      $ref: '#/components/schemas/Money'
                    currentPrice:
                      x-arthome-tax-basis: inclusive
                      $ref: '#/components/schemas/Money'
                    validUntil:
                      type: string
                      format: date-time
                  additionalProperties: {}
                - type: 'null'
            additionalProperties: {}
          - type: 'null'
        replay:
          type: object
          properties:
            policy:
              type: string
              x-arthome-vocabulary:
              - included
              - subscription
              - unit
              - none
              x-arthome-vocabulary-source: REPLAY_POLICIES
            windowHours:
              anyOf:
              - type: integer
              - type: 'null'
            availableFrom:
              anyOf:
              - type: string
                format: date-time
              - type: 'null'
            expiresAt:
              description: Derived from the end of the live show and `windowHours`. Served as an instant, never as "41 h left".
              anyOf:
              - type: string
                format: date-time
              - type: 'null'
            unitPrice:
              x-arthome-tax-basis: inclusive
              $ref: '#/components/schemas/Money'
          required:
          - policy
          additionalProperties: {}
          description: |
            The **promise** made before purchase — it is what justifies the price difference. `none` is
            **final** for this date.
        rights:
          type: object
          properties:
            scope:
              type: string
              x-arthome-vocabulary:
              - worldwide
              - restricted
              x-arthome-vocabulary-source: RIGHTS_SCOPES
            blackoutCountries:
              type: array
              items:
                type: string
                pattern: ^[A-Z]{2}$
            blackoutReasonCode:
              description: 'A **code**, never a sentence. The current data carries `label`/`labelEn` authored inside the data: an i18n leak (E8).'
              x-arthome-vocabulary:
              - co_production
              - broadcaster
              - festival
              x-arthome-vocabulary-source: BLACKOUT_REASONS
              type:
              - string
              - 'null'
          required:
          - scope
          additionalProperties: {}
        chatMode:
          type: string
          x-arthome-vocabulary:
          - open
          - emoji
          - read_only
          - 'off'
          x-arthome-vocabulary-source: CHAT_MODES
        media:
          $ref: '#/components/schemas/MediaSet'
        languageDependency:
          type: string
          x-arthome-vocabulary:
          - none
          - helpful
          - essential
          x-arthome-vocabulary-source: LANGUAGE_DEPENDENCIES
        watchVerdict:
          description: |
            Per-viewer overlay. **Absent — not null — on an anonymous read**, which makes the public body
            identical for every caller and therefore shareable in a common cache.
          $ref: '#/components/schemas/WatchVerdict'
        viewerRelations:
          description: |
            Per-viewer overlay, merged from a **batched** read, never one call per card. **Absent on an
            anonymous read.**
          anyOf:
          - type: object
            properties:
              inWatchlist:
                type: boolean
              reminderSet:
                type: boolean
              followsArtist:
                type: boolean
            additionalProperties: {}
          - type: 'null'
        viewerProgress:
          description: Per-viewer overlay. **Absent on an anonymous read.**
          anyOf:
          - type: object
            properties:
              positionSec:
                type: integer
              durationSec:
                type: integer
              completed:
                type: boolean
            additionalProperties: {}
          - type: 'null'
      required:
      - id
      - showId
      - channelId
      - slug
      - canonicalUrl
      - title
      - startsAt
      - venueClock
      - runtimeMin
      - displayState
      - displayStateValidUntil
      - replay
      - rights
      - media
      additionalProperties: {}
      description: |
        **The most consumed shape in the product.** It must stand alone: a card never triggers a call
        in order to paint itself.

        It carries the **inputs** of the perishable rules **and** their result at serving time **and**
        the instant that result stops being true. That is what lets a response cached for eight hours
        stay correct: the surface calls the same `@arthome/core` function again once
        `displayStateValidUntil` has passed, it does not rewrite the rule.

        **No ticketing or control-room field appears here** (E8): no `sold`, no `revenue`, no
        `publication`, no `publishedBy`.
