          schema: { type: string, enum: [expiring_first, recent, popularity], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A sort or filter key. It is a property of THIS endpoint's list — which orders it offers — not of the domain, and adding one is an endpoint change rather than a vocabulary change.", default: expiring_first }
