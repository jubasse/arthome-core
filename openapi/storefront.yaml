                    properties:
                      groups: { type: array, items: { $ref: '#/components/schemas/ShowGroup' } }
                      artists: { type: array, items: { $ref: '#/components/schemas/ArtistSummary' } }
                      facets: { type: array, items: { $ref: '#/components/schemas/Facet' } }
                      structuredFilters: { type: array, items: { $ref: '#/components/schemas/StructuredFilter' } }
                      page: { $ref: '#/components/schemas/CursorPageInfo' }
              example:
                servedAt: '2026-09-21T18:02:19.000Z'
