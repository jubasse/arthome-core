        # erreur : cette lecture est la face indexable du produit, et le robot d'un moteur n'a ni
        # cookie, ni jeton porteur, ni moyen de s'en fabriquer un. Le mode visiteur emprunte le
        # même chemin. Voir « Lecture publique et lecture identifiée » en tête de document.
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      x-arthome-freshness: 60
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string, minLength: 2 }
        - name: tab
          in: query
          schema: { type: string, enum: [best, lives, replays, artists], default: best }
        - name: sort
          in: query
          description: '**Cinq tris**, pas quatre : `price_desc` existe dans la conception, au même titre que les autres.'
          schema: { type: string, enum: [relevance, soon, popularity, price_asc, price_desc], default: relevance }
        - name: filters
          in: query
          description: |
            Critères, dans la grammaire **publiée** ci-contre. Ce paramètre était une chaîne libre :
            sur le paramètre le plus important de l'écran le plus utilisé, cela signifiait que zod
            ne validait rien et que trois surfaces le sérialiseraient de trois façons — alors qu'une
            forme normalisée **existe déjà**, puisque `normalizeSearchCriteria()` en produit la
            signature dans `@arthome/core`. C'est cette forme-là qui est publiée, et c'est la même
            que `SavedSearch.criteria`.
          schema: { $ref: '#/components/schemas/SearchCriteria' }
      responses:
