      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: A link was queued for sending, or the address is already verified.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        queued:
                          type: boolean
                      required:
                      - queued
                      additionalProperties: {}
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:06:00.000Z'
                data:
                  queued: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/forget-password:
    post:
      operationId: requestPasswordReset
      summary: Requests a password reset link.
      description: |
        **Always answers `202`, whether the account exists or not.** Distinguishing the two would
        tell an attacker which emails are registered.

        **The email's link points at the surface, never at the API** — `arthome.fr/reset?token=…` —
        and therefore **per product and per language**. The library's default builds it from its own
        base address and would land the person on an API.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - identity
      tags:
      - account
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                locale:
                  type: string
                  enum:
                  - fr
                  - en
                  x-arthome-vocabulary-source: LOCALES
                  description: |
                    **The domain declares exactly two.** This one is an **input**, so the enum is strict:
                    a locale we cannot render is refused rather than silently answered in another
                    language.
                  examples:
                  - fr
              required:
              - email
            example:
              email: marie@example.org
              locale: fr
      responses:
        '202':
          description: Request accepted — the answer is the same in both cases.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        accepted:
                          type: boolean
                      additionalProperties: {}
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:01:00.000Z'
                data:
                  accepted: true
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Sets a new password from a reset token.
      description: |
        **Does not open a session.** The person signs in again, which proves the new password works
        and avoids an email link becoming a session bearer. The token is single-use and
        short-lived.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - identity
      tags:
      - account
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
              required:
              - token
              - password
            example:
              token: rst_9f2ac1
              password: a-new-password
      responses:
        '200':
          description: Password changed. **All other sessions are revoked** — a password changed after a theft must close the door.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        changed:
                          type: boolean
                        otherSessionsRevoked:
                          type: integer
                      additionalProperties: {}
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:02:00.000Z'
                data:
                  changed: true
                  otherSessionsRevoked: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/auth/social/{provider}/start:
    post:
      operationId: startSocialSignIn
      summary: Starts a social sign-in — the surfaces never talk to the provider.
      description: |
        **The OAuth client is confidential and server-side.** No application embeds a secret: that
        is the only defensible form on a distributed binary, and the redirect is registered **once
        per provider**, on the BFF's domain.

        **The deep link on return never carries the token.** It carries only a **single-use opaque
        state**, which the application then exchanges for its token over direct TLS with the BFF
        (`/v1/auth/exchange`). The return URL travels through the operating system, can be logged,
        and can be opened by another application.

        **Per surface**: browsers follow an ordinary redirect; native shells open the **system
        browser**, never their WebView, and come back through a universal link. **The television
        does no OAuth**: it goes through pairing, intent `signin`.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - identity
      tags:
      - account
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - facebook
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: An external provider or platform identifier. It is their vocabulary, not ours, and it changes when they change.
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  $ref: '#/components/schemas/SessionMode'
                deviceId:
                  anyOf:
                  - type: string
                    format: uuid
                  - type: 'null'
                returnPath:
                  description: |
                    **Relative** return path inside the surface. An absolute address is refused: the allowlist
                    is made of **literal strings**, never of a pattern.
                  type:
                  - string
                  - 'null'
              required:
              - mode
            example:
              mode: bearer
              deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
              returnPath: /compte
      responses:
        '200':
          description: The authorization address to open, and the opaque state that will come back.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        authorizationUrl:
                          type: string
                          format: uri
                        state:
                          type: string
                          description: '**Opaque, single-use, short-lived.** It carries nothing meaningful.'
                        expiresAt:
                          type: string
                          format: date-time
                      required:
                      - authorizationUrl
                      - state
                      - expiresAt
                      additionalProperties: {}
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:03:00.000Z'
                data:
                  authorizationUrl: https://api.arthome.fr/v1/auth/social/google/redirect?state=ott_9f2ac1
                  state: ott_9f2ac1
                  expiresAt: '2026-09-21T18:13:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/auth/exchange:
    post:
      operationId: exchangeOneTimeToken
      summary: Exchanges the opaque state from the return for a session.
      description: |
        **This is what makes the journey replayable if the operating system kills the application
        during the detour**: the pending state lives server-side, not in application memory. On
        return, the deep link says **where to go**, and this exchange says **what changed**.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - identity
      tags:
      - account
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                mode:
                  $ref: '#/components/schemas/SessionMode'
                deviceId:
                  anyOf:
                  - type: string
                    format: uuid
                  - type: 'null'
              required:
              - state
              - mode
            example:
              state: ott_9f2ac1
              mode: bearer
              deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
      responses:
        '200':
          description: Session opened in the requested mode.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SessionEstablished'
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:03:40.000Z'
                data:
                  mode: bearer
                  accessToken: sess_4d77e2
                  expiresAt: '2026-09-28T18:03:40Z'
                  viewerContext:
                    deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                    signedIn: true
                    profiles: []
                    constants:
                      roomOpensMinutesBefore: 30
                      cancelDeadlineMinutesBefore: 60
                      scarcityThresholdBps: 8500
                      billboardPreviewDelaySec: 4
                      waitlistPriorityWindowHours: 2
                      chatRateLimitPerSecond: 6
                      reminderLeadMinutes: 30
                      replayExpiryWarningHours: 6
                    labelCatalog:
                      locale: fr
                      version: 41
                      url: https://cdn.arthome.fr/i18n/storefront/fr/v41.json
                    taxonomyArtifact:
                      locale: fr
                      version: 12
                      url: https://cdn.arthome.fr/taxonomy/fr/v12.json
        '410':
          $ref: '#/components/responses/Gone'
  /v1/auth/change-password:
    post:
      operationId: changePassword
      summary: Changes the password from the account.
      description: |
        **The current password is required**, and that is not a formality: without it, a stolen
        session would be enough to lock the owner out of their own account.

        **Other sessions are revoked** — this is the gesture one makes on suspecting a theft, and
        leaving the other bearers untouched would empty it of meaning. The current session survives:
        you do not sign yourself out by changing your password.
