  /v1/viewer-context:
    get:
      operationId: getViewerContext
      tags: [bootstrap]
      summary: The bootstrap — the entire budget of the start-up screen.
      description: |
        **A single call.** Device profiles, rights, preferences, domain constants, version of the
        label catalogue and of the taxonomy. The labels themselves come from the snapshot embedded
        at build time: the version check **never blocks** the first render.

        If this call fails, the surface must still display a **readable** message — not a raw code,
        not a blank screen. That is what makes the embedded snapshot mandatory rather than merely
        desirable.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      x-arthome-freshness: 300
      security:
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ViewerTimezone'
      responses:
        '200':
          description: Viewer context.
          headers:
            X-Arthome-Served-At: { $ref: '#/components/headers/ServedAt' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ViewerContext' }
              example:
                servedAt: '2026-09-21T18:02:12.400Z'
                data:
                  deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                  signedIn: true
                  currentProfileId: 019928f4-2a11-7000-8000-000000000001
                  profiles:
                    - { id: 019928f4-2a11-7000-8000-000000000001, name: Marie, kind: adult }
                  plan: { tier: pass, state: active, seatDiscountBps: 1000, concurrentStreamsAllowed: 1 }
                  constants:
                    roomOpensMinutesBefore: 30
                    cancelDeadlineMinutesBefore: 60
                    scarcityThresholdBps: 8500
                    billboardPreviewDelaySec: 4
                    waitlistPriorityWindowHours: 2
                    chatRateLimitPerSecond: 2
                    chatCatchUpMessages: 20
                    reactionQuotaPerDate: 20
                    reminderLeadMinutes: 30
                    replayExpiryWarningHours: 6
                    previewSecondsTotal: 300
                    searchExactTotalLimit: 10000
                    creditDelayCode: refund_delay_business_days_3_5
                  labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                  taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
                  realtime: { namespace: /storefront, pulseIntervalSec: 5 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/changes:
    get:
      operationId: listChanges
      tags: [bootstrap]
      summary: The invalidations since a given instant — not the data.
      description: |
        **One request instead of twelve.** On returning to the foreground, every observed read
        revalidates at the same time; an account screen shows half a dozen, a category page as many.
        Refusing that burst means refusing to open the application.

        It is also the path by which the storefront learns what it **did not cause** — Kafka being
        forbidden outside inter-service traffic, it is the only one possible. For Next's server
        rendering, the same tags feed `revalidateTag`: they are **named by the contract**, never
        invented by a surface.

        ## This feed requires a credential, and the public side has no feed at all

        **The `401` is a ruling, not an oversight** (D-022's rule applied). This path answers "what
        changed **for you** since your cursor". A public invalidation stream would answer "what
        changed in the catalogue since T". They are **two resources**, and their cacheability
        requirements are opposite: this one must `Vary` on the credential and can never be
        edge-cached; a public one is worthless unless it is. Served from one path, the public half
        inherits the private half's `Vary`, so Next's server rendering would reach origin on every
        revalidation check — which is most of what this path exists to save.

        The direction was chosen on reversibility. Making this path anonymous **cannot be undone**:
        once clients call it without a credential, the credential cannot come back. Adding a
        separate public path later is **purely additive**.

        **The cost, named rather than shrugged at.** Signed-out pages have no invalidation path and
        fall back to **time-based revalidation** on their family's freshness — 60 s for `home` and
        the lists, 300 s for `category` and `artist` (§ the freshness table). A catalogue change is
        therefore visible to a signed-out reader in **up to one freshness window**, where a feed
        would cut it to the push latency. That is a performance property, not a contract property,
        and it is the number to beat: a measurement showing a public page stale past its window, or
        an origin-hit cost that the time-based fallback makes unacceptable, reopens this.

        **What it would take to fill the gap, and why the shape is not written here.** Nobody has
        designed a public catalogue-change stream: whether it is keyed on time or on entity, what
        window it covers, what a client that has been away for a week receives, and whether it is a
        feed at all rather than an `ETag` on each catalogue read. What has no source does not enter
        the contract, so the gap is named and the shape is left alone.
      x-arthome-maturity: stable
      x-arthome-upstream: [realtime]
      # This feed queries NO service: it reads the Redis resume buffer that the real-time
      # gateway already keeps per room (30 min / 5,000 events). It is the HTTP pull of the same
      # stream the channel pushes. Declaring it over four services described a composition that
      # does not happen, and would have counted it as a four-call screen.
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - name: since
          in: query
          required: true
          description: The `servedAt` of the client's last known response.
          schema: { type: string, format: date-time }
        - name: scope
          in: query
          required: false
          description: |
            Which invalidations to return. `profile` covers what follows the account — tickets,
            orders, subscription, cart — and is what a surface wants on returning to the
            foreground. `device` restricts the answer to what follows **this device**, and exists
            for the television, where five profiles share one device and a switch of profile must
            not force the other four to reload.

            A **closed** vocabulary, and legitimately so: this is an input, and the server must
            refuse a scope it does not know rather than silently widen the answer.
          schema: { type: string, enum: [profile, device], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "An account-management shape, local to this endpoint: what the person asked for, not a fact the domain reasons about.", default: profile }
      responses:
        '200':
          description: A list of invalidations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ChangeFeed' }
              example:
                servedAt: '2026-09-21T20:44:02.010Z'
                data:
                  invalidated: ['date:019928a0-7d31-7a10-b8c4-2f9e11a4c001', 'account:tickets']
                  complete: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # =============================================================== discovery

  /v1/home:
    get:
      operationId: getHomeScreen
      tags: [discovery]
      summary: Billboard and rails, composed and ordered by the server.
      description: |
        **One call.** Ten to thirteen rails, six to eight visible cards each, a cursor per rail:
        60 to 100 cards, on the order of 50 to 90 KB raw, under 15 KB once compressed.

        The BFF composes this model with **three per-viewer overlays, batched by id lists** — never
        one call per card. In steady state, the per-profile Redis cache (30 s TTL) brings the screen
        down to one or two internal calls.

        **Public read.** Called **with no authentication at all**, this operation returns the
        **public body** — identical for every anonymous caller, hence shareable in a common cache.
        The three per-viewer overlays (`watchVerdict`, `viewerRelations`, `viewerProgress`) are then
        **absent**, never null. Called with a session or a bearer token, it returns the public body
        **plus** the overlays, and becomes private.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog, ticketing, identity, streaming]
      security:
        # **Public read.** A complete absence of authentication is a NOMINAL case, not an
        # error: this read is the indexable face of the product, and a search engine's crawler
        # has neither cookie, nor bearer token, nor any way of minting one. Guest mode takes
        # the same path. See "Public read and identified read" at the top of the document.
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      x-arthome-freshness: 60
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ViewerTimezone'
      responses:
        '200':
          description: Home.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
            Vary: { $ref: '#/components/headers/VaryAuth' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/HomeScreen' }
              example:
                servedAt: '2026-09-21T18:02:13.900Z'
                validUntil: '2026-09-21T18:03:13.900Z'
                lastEventSeq: 918233
                degraded: []
                data:
                  billboard:
                    previewStartsAfterSec: 4
                    date:
                      id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                      showId: 019928a0-7d31-7a10-b8c4-2f9e11a4c111
                      channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                      slug: nuit-blanche-2026-09-21
                      canonicalUrl: 'https://arthome.fr/fr/d/nuit-blanche-2026-09-21'
                      title: Nuit blanche
                      startsAt: '2026-09-21T19:00:00Z'
                      venueClock: { venueTimezone: Europe/Paris, venueUtcOffsetMin: 120 }
                      runtimeMin: 95
                      roomOpensAt: '2026-09-21T18:30:00Z'
                      displayState: live
                      displayStateValidUntil: '2026-09-21T20:35:00Z'
                      replay: { policy: included, windowHours: 72 }
                      rights: { scope: worldwide, blackoutCountries: [] }
                      media: { wide: [], poster: [] }
                      viewers: 1842
                  rails:
                    - id: resume
                      titleCode: home.rail.resume
                      kind: resume
                      items: []
                      nextCursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/live:
    get:
      operationId: getLiveScreen
      tags: [discovery]
      summary: What is live now and tonight's grid, grouped in the viewer's local time.
      description: |
        **One call**, and the hourly grouping is **server-side**: it depends on the viewer's
        timezone, which the surface sends in a header. Grouped client-side it would be grouped five
        different ways, and Next's server rendering does not know the visitor's timezone.

        **Public read.** Called **with no authentication at all**, this operation returns the
        **public body** — identical for every anonymous caller, hence shareable in a common
        cache. The three per-viewer overlays (`watchVerdict`, `viewerRelations`,
        `viewerProgress`) are then **absent**, never null. Called with a session or a bearer
        token, it returns the public body **plus** the overlays, and becomes private.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog, ticketing, streaming, identity]
      security:
        # **Public read.** A complete absence of authentication is a NOMINAL case, not an
        # error: this read is the indexable face of the product, and a search engine's crawler
        # has neither cookie, nor bearer token, nor any way of minting one. Guest mode takes
        # the same path. See "Public read and identified read" at the top of the document.
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      x-arthome-freshness: 15
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ViewerTimezone'
      responses:
        '200':
          description: Tonight's grid.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
            Vary: { $ref: '#/components/headers/VaryAuth' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/LiveScreen' }
              example:
                servedAt: '2026-09-21T18:02:14.210Z'
                validUntil: '2026-09-21T18:02:29.210Z'
                data:
                  slots:
                    - localHourLabelKey: '20'
