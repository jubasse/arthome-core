  /v1/replays:
    get:
      operationId: listReplays
      tags: [discovery]
      summary: Les rediffusions en ligne, celles qui expirent d'abord — page de découverte, publique.
      description: |
        **C'est une page de découverte, pas « Mes rediffusions ».** La distinction n'est pas
        cosmétique : « Rediffusions » est une entrée permanente de la barre latérale d'un
        téléviseur, au même titre que « En direct » ou « Catégories », et elle n'est pas préfixée
        « Mes » — contrairement à « Mes places » et « Ma liste », qui le sont. Son contenu est le
        catalogue des rediffusions **en vente ou incluses**, y compris celles qu'on n'a jamais
        vues : c'est tout son intérêt.

        Trois raisons pour lesquelles les chemins existants ne s'y substituaient pas :
        `/v1/me/replays` rend ce qu'on **détient** et répond `401` à un visiteur — or sur un
        téléviseur la barre latérale est toujours là, et masquer une entrée selon la session fait
        changer le menu de taille sous le focus, ce qui casse la mémoire de focus ;
        `/v1/search?tab=replays` exige `q` d'au moins deux caractères, donc n'a pas de recherche
        vide ; et son unité paginée est le **spectacle**, alors qu'une fenêtre de rediffusion
        expire **par date** — regrouper par spectacle rend le tri « qui expire d'abord »
        inexprimable.

        **Lecture publique**, comme les neuf autres opérations de catalogue.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog, ticketing, streaming]
      x-arthome-freshness: 60
      security:
