      - sessionCookie: []
      - bearerToken: []
      - deviceToken: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: sort
        in: query
        description: '`expiring_first` is the default, and it is the sort the page announces.'
        schema:
          default: expiring_first
          type: string
          enum:
          - expiring_first
          - recent
          - popularity
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: A sort or filter key. It is a property of THIS endpoint's list — which orders it offers — not of the domain, and adding one is an endpoint change rather than a vocabulary change.
