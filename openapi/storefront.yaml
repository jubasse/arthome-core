  /v1/me/watchlist/{dateId}:
    put:
      operationId: addToWatchlist
      tags: [account]
      summary: Met une date de côté.
      description: |
        **Une mise en état, pas une bascule.** Deux envois du même geste laissent une seule
        entrée ; une bascule sur un réseau douteux inverserait le résultat. Rend la carte à jour,
        pour que la surface repeigne sans second aller-retour.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      x-arthome-invalidates: ['home:rails']
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: La carte à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/DateCard' } }
              example:
                servedAt: '2026-09-21T18:57:20.000Z'
                data: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, displayState: live, viewerRelations: { inWatchlist: true, reminderSet: false, followsArtist: false } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeFromWatchlist
      tags: [account]
      summary: Retire une date de ma liste.
      description: Rejouée sur une entrée déjà retirée, elle **réussit** — une suppression idempotente ne doit pas échouer.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: La carte à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/DateCard' } }
              example:
                servedAt: '2026-09-21T18:57:40.000Z'
                data: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, displayState: live, viewerRelations: { inWatchlist: false, reminderSet: false, followsArtist: false } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/follows:
    get:
      operationId: listFollowedArtists
      tags: [account]
      summary: Les artistes suivis — la page « Suivis », qui n'avait aucun point d'entrée.
      description: |
        **La page entière n'était pas servie.** `/v1/me/follows/{artistId}` n'exposait que `PUT` et
        `DELETE`, `/v1/artists` n'acceptait pas de filtre sur le suivi, et `AccountScreen` ne
        portait aucune liste. Le seul moyen de peindre l'écran était de parcourir `/v1/artists` en
        entier et de filtrer côté client — c'est-à-dire exactement ce que le contrat interdit
        ailleurs, et à juste titre.

        **Le rail `followed` de l'accueil ne s'y substituait pas** : il porte des `DateCard`, donc
        des dates annoncées, alors que la moitié de cette page est faite des artistes suivis **qui
        n'ont pas de date** — et il n'a ni tri, ni retrait sur place, ni états vides propres.

        Le contrat se contredisait d'ailleurs tout seul : `emptyReason` portait
        `no_followed_artist_live`, **un état vide pour une liste qu'aucune opération ne
        produisait**.

        Sert aussi `account/faves`, dont c'est la première des deux collections — la seconde étant
        `/v1/me/watchlist`.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, catalog, notifications]
      x-arthome-freshness: 60
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          schema: { type: string, enum: [alpha, followers, next_date], default: next_date }
        - name: liveOnly
          in: query
          description: '**La section « Suivis en direct »**, servie plutôt que filtrée côté client.'
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: |
            Page d'artistes suivis. Chacun porte `alertEnabled` — **suivre et être alerté sont deux
            réglages** — et `nextDate` quand il y en a une, ce qui donne la scission que l'écran
            affiche sans un appel par artiste.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ArtistSummary' } }
                      page: { $ref: '#/components/schemas/CursorPageInfo' }
              example:
                servedAt: '2026-09-21T18:58:40.000Z'
                items:
                  - id: 019928a0-7d31-7a10-b8c4-2f9e11a4c333
                    channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                    name: Compagnie Verticale
                    categoryId: dance-contemporary
                    followers: 4120
                    isLiveNow: true
                    followedByViewer: true
                    alertEnabled: true
                page: { hasMore: false, emptyReason: no_followed_artist, emptyActionCode: browse_artists }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/me/follows/{artistId}:
    put:
      operationId: followArtist
      tags: [account]
      summary: Suit un artiste.
      description: |
        **Suivre et être alerté sont deux réglages.** `followArtist` est une relation de
        catalogue ; l'alerte est un drapeau **par artiste suivi** porté par `notifications`
        (`alertEnabled` ci-dessous). Les confondre rendrait impossible de suivre un artiste sans
        être notifié — et la maquette mobile montre les deux séparément.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, notifications]
      x-arthome-invalidates: ['home:rails']
      parameters:
        - $ref: '#/components/parameters/ArtistId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                alertEnabled: { type: boolean, default: false }
            example: { alertEnabled: true }
      responses:
        '200':
          description: L'artiste à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ArtistSummary' } }
              example:
                servedAt: '2026-09-21T18:58:00.000Z'
                data: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c333, channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222, name: Compagnie Verticale, categoryId: dance-contemporary, followedByViewer: true }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unfollowArtist
      tags: [account]
      summary: Ne suit plus un artiste.
      description: |
        **Une mise en état, pas une bascule.** Rend l'artiste à jour, pour que la surface repeigne
        sans second aller-retour. Ne touche pas au drapeau d'alerte, qui est un réglage distinct
        porté par `notifications`.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/ArtistId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: L'artiste à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ArtistSummary' } }
              example:
                servedAt: '2026-09-21T18:58:20.000Z'
                data: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c333, channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222, name: Compagnie Verticale, categoryId: dance-contemporary, followedByViewer: false }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/reminders/{dateId}:
    put:
      operationId: setReminder
      tags: [account]
      summary: Pose un rappel daté sur une date.
      description: |
        **Un rappel est une promesse datée.** Si la date est reportée, le rappel **suit** le
        report ; si elle est annulée, il est **annulé** et non envoyé à vide. Le délai (30 min)
        est une constante de domaine **servie**, pas un choix de surface.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Rappel posé.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reminderSet: { type: boolean }
                          remindAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:59:00.000Z'
                data: { reminderSet: true, remindAt: '2026-09-21T18:30:00Z' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: clearReminder
      tags: [account]
      summary: Retire le rappel.
      description: |
        Retire le rappel. Rejouée sur un rappel déjà retiré, elle réussit — elle se met en file hors
        ligne, donc elle doit être sûre au rejeu.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Rappel retiré.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { reminderSet: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:59:20.000Z'
                data: { reminderSet: false }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/saved-searches:
    get:
      operationId: listSavedSearches
      tags: [account]
      summary: Mes recherches enregistrées, avec leur compteur de nouveautés.
      description: |
        **Zéro requête de comptage à l'ouverture.** Le compteur « nouvelles depuis votre dernière
        visite » est incrémenté par le *percolator* de l'index quand une date nouvelle correspond,
        et remis à zéro à la lecture. Les deux autres options coûteraient dix agrégations par
        affichage, pour une information dont personne ne mesurera l'exactitude.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      x-arthome-freshness: 300
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Les recherches enregistrées.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SavedSearch' } }
              example:
                servedAt: '2026-09-21T19:00:00.000Z'
                items:
                  - id: 019928fa-0000-7000-8000-000000000001
                    scope: search
                    name: Danse à Paris
                    criteria: { categoryIds: [dance-contemporary], cityIds: [paris] }
                    criteriaVersion: 2
                    criteriaSignature: 7f3a1c
                    stale: false
                    channels: [push]
                    active: true
                    newMatchesSinceLastVisit: 3
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createSavedSearch
      tags: [account]
      summary: Enregistre une recherche.
      description: |
        La **signature** est produite par `normalizeSearchCriteria()` dans `@arthome/core`, côté
        serveur, une seule fois. C'est elle qui déduplique : un rejeu ne crée **jamais** deux
        alertes identiques.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, criteria]
              properties:
                scope: { type: string, enum: [search, category] }
                categoryId: { type: [string, 'null'] }
                name: { type: [string, 'null'], maxLength: 80 }
                queryText: { type: [string, 'null'] }
                criteria: { type: object, additionalProperties: true }
                channels: { type: array, items: { type: string, enum: [push, email, in_app] } }
            example:
              scope: search
              name: Danse à Paris
              criteria: { categoryIds: [dance-contemporary], cityIds: [paris] }
              channels: [push]
      responses:
        '201':
          description: Recherche enregistrée.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SavedSearch' } }
              example:
                servedAt: '2026-09-21T19:00:20.000Z'
                data: { id: 019928fa-0000-7000-8000-000000000001, scope: search, name: Danse à Paris, criteria: {}, criteriaVersion: 2, criteriaSignature: 7f3a1c, channels: [push], active: true, newMatchesSinceLastVisit: 0 }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me/saved-searches/{savedSearchId}:
    patch:
      operationId: updateSavedSearch
      tags: [account]
      summary: Renomme, active, ou change les canaux d'une recherche enregistrée.
      description: |
        Écriture **champ par champ**, jamais document entier. Une recherche enregistrée se met en
        file hors ligne : un rejeu doit converger vers le même état, pas l'inverser.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - name: savedSearchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Écriture **champ par champ**, jamais document entier.
              properties:
                name: { type: [string, 'null'] }
                active: { type: boolean }
                channels: { type: array, items: { type: string, enum: [push, email, in_app] } }
            example: { active: false }
      responses:
        '200':
          description: La recherche à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SavedSearch' } }
              example:
                servedAt: '2026-09-21T19:01:00.000Z'
                data: { id: 019928fa-0000-7000-8000-000000000001, scope: search, criteria: {}, criteriaVersion: 2, criteriaSignature: 7f3a1c, channels: [push], active: false, newMatchesSinceLastVisit: 0 }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSavedSearch
      tags: [account]
      summary: Supprime une recherche enregistrée.
      description: '**Rejouée sur une entrée déjà supprimée, elle réussit** — c''est ce qu''une file hors ligne exige.'
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - name: savedSearchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Supprimée.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { deleted: { type: boolean } } }
              example:
                servedAt: '2026-09-21T19:01:20.000Z'
                data: { deleted: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/orders:
    get:
      operationId: listMyOrders
      tags: [account]
      summary: Mes commandes, y compris le reflet des commandes passées chez un tiers.
      description: |
        Une commande peut **ne pas être la nôtre**. `externalRef` est servi **avec son âge** : ce
        qu'on garantit, c'est la fraîcheur au moment de `syncedAt`, rien de plus. Quand l'hôte
        externe ne répond pas, l'âge grandit — **rien n'échoue**.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-freshness: 300
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page de commandes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            order: { $ref: '#/components/schemas/Order' }
                            external: { $ref: '#/components/schemas/ExternalOrderRef' }
                      page: { $ref: '#/components/schemas/CursorPageInfo' }
              example:
                servedAt: '2026-09-21T19:02:00.000Z'
                items:
                  - external: { externalRef: 'SHOP-9912', externalHost: 'boutique.compagnie-verticale.fr', state: external, syncedAt: '2026-09-20T22:14:00Z', syncSource: shopify }
                page: { hasMore: false, emptyReason: no_order_yet, emptyActionCode: browse_shop }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/notifications:
    get:
      operationId: listNotifications
      tags: [account]
      summary: Le centre de notifications, et le badge global.
      description: |
        Le badge `unreadCount` est **global**, pas celui de la page : sinon la surface afficherait
        « 3 » en n'ayant chargé que les vingt dernières.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      x-arthome-freshness: 60
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page de notifications, plus le nombre de non-lues **global** — pas celui de la page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page, unreadCount]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/NotificationEntry' } }
                      unreadCount: { type: integer }
                      page: { $ref: '#/components/schemas/CursorPageInfo' }
              example:
                servedAt: '2026-09-21T19:03:00.000Z'
                unreadCount: 2
                items: [{ id: 019928fb-0000-7000-8000-000000000001, triggerCode: date_starts_soon, params: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001 }, createdAt: '2026-09-21T18:30:00Z', read: false }]
                page: { hasMore: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: markNotificationsRead
      tags: [account]
      summary: Marque des notifications comme lues.
      description: '**Monotone : on ne dé-lit pas.** Rejouée, elle ne change rien — c''est ce qui la rend sûre en file hors ligne.'
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notificationIds: { type: array, items: { type: string, format: uuid } }
                all: { type: boolean, default: false }
            example: { all: true }
      responses:
        '200':
          description: Badge à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { unreadCount: { type: integer } } }
              example:
                servedAt: '2026-09-21T19:03:20.000Z'
                data: { unreadCount: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/profile:
    patch:
      operationId: updateProfile
      tags: [account]
      summary: Modifie l'identité affichée.
      description: '**Champ par champ**, jamais document entier, et conditionné par `expectedVersion` : deux appareils ne s''écrasent pas en silence.'
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      x-arthome-invalidates: ['account:profile']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                displayName: { type: string, maxLength: 80 }
                publicHandle: { type: string, pattern: '^@[a-z0-9._-]{3,30}$' }
                city: { type: [string, 'null'] }
            example: { expectedVersion: 7, displayName: 'Marie J.' }
      responses:
        '200':
          description: Profil à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      version: { type: integer }
                      data: { type: object, additionalProperties: true }
              example:
                servedAt: '2026-09-21T19:04:00.000Z'
                version: 8
                data: { displayName: 'Marie J.', publicHandle: '@marie.j' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me/preferences:
    patch:
      operationId: updatePreferences
      tags: [account]
      summary: Écrit une préférence, à sa portée.
      description: |
        **Deux portées, et le contrat les sépare champ par champ** : `account` suit la personne,
        `device` suit l'appareil et la pièce. Une portée unique se tromperait la moitié du temps.

        **Additive et tolérante** : une clé inconnue d'une version de l'application n'est ni
        rejetée ni effacée à la prochaine écriture — sinon la version mobile en revue de magasin
        écraserait les réglages posés depuis le web.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account: { type: object, additionalProperties: true }
                device: { type: object, additionalProperties: true }
                deviceId: { type: [string, 'null'], format: uuid }
            example: { device: { subtitleSizeStep: 2, reduceMotion: true }, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77 }
      responses:
        '200':
          description: Préférences à jour, les deux portées servies ensemble.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ViewerPreferences' } }
              example:
                servedAt: '2026-09-21T19:04:30.000Z'
                data:
                  account: { interfaceLocale: fr, readingTimezone: Europe/Paris }
                  device: { subtitleSizeStep: 2, reduceMotion: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/notification-preferences:
    patch:
      operationId: updateNotificationPreferences
      tags: [account]
      summary: Cinq déclencheurs, trois canaux, et les heures calmes.
      description: |
        **L'exception aux heures calmes est conditionnée à la détention d'une place** : c'est une
        règle métier, pas un réglage d'interface — on ne rate pas un spectacle qu'on a payé parce
        qu'il commence à 23 h 15. Les **seuils** qui déclenchent une alerte vivent dans
        `@arthome/core` et sont servis dans `ViewerContext` ; `notifications` les lit, il ne les
        invente pas.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                triggers:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string, enum: [push, email, in_app] }
                quietHours:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    fromHour: { type: integer, minimum: 0, maximum: 23 }
                    toHour: { type: integer, minimum: 0, maximum: 23 }
                    bypassWhenTicketHeld: { type: boolean }
            example: { triggers: { date_starts_soon: [push] }, quietHours: { enabled: true, fromHour: 23, toHour: 9, bypassWhenTicketHeld: true } }
      responses:
        '200':
          description: Préférences de notification à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/NotificationPreferences' } }
              example:
                servedAt: '2026-09-21T19:05:00.000Z'
                data: { triggers: { date_starts_soon: [push] }, quietHours: { enabled: true, fromHour: 23, toHour: 9, bypassWhenTicketHeld: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/consents:
    put:
      operationId: updateConsents
      tags: [account]
      summary: Enregistre les consentements, horodatés et versionnés par le serveur.
      description: |
        **Jamais mise en file hors ligne** : un consentement a une valeur probatoire, il doit être
        horodaté **par le serveur** et porter la **version du texte accepté**. Un consentement sans
        version ni date ne vaut rien. `ads` est à `false` par défaut, et ce défaut est **une
        décision du contrat**, pas un réglage.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purposes, textVersion]
              properties:
                purposes:
                  type: object
                  required: [audience, perso, partners, ads]
                  properties:
                    audience: { type: boolean }
                    perso: { type: boolean }
                    partners: { type: boolean }
                    ads: { type: boolean }
                cookieCategories: { type: object, additionalProperties: { type: boolean } }
                textVersion: { type: integer }
            example: { purposes: { audience: true, perso: true, partners: false, ads: false }, textVersion: 3 }
      responses:
        '200':
          description: Consentements enregistrés, avec l'horodatage serveur.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Consents' } }
              example:
                servedAt: '2026-09-21T19:05:30.000Z'
                data: { purposes: { audience: true, perso: true, partners: false, ads: false }, textVersion: 3, recordedAt: '2026-09-21T19:05:30Z' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/me/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [account]
      summary: Révoque un appareil — et coupe sa lecture.
      description: |
        **Un effet observable sur l'appareil visé, en 120 secondes au plus.** Révoquer supprime le
        `Device`, **toutes** ses `DeviceSession` **et ses baux de lecture** : `identity` publie
        `device_revoked`, `streaming` le consomme et refuse le **prochain renouvellement** de
        jeton. L'appareil affiche `SIGNED_OUT_ELSEWHERE`, **pas une erreur réseau**.

        **Jamais mise en file hors ligne** : c'est une commande de sécurité, elle doit échouer
        bruyamment plutôt que d'être rejouée à l'aveugle.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      x-arthome-invalidates: ['account:devices']
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: |
            Appareil révoqué. `playbackCutWithinSec` dit au bout de combien de temps la lecture
            s'arrête **réellement**.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
                          playbackCutWithinSec:
                            type: integer
                            description: |
                              **120, et non 60.** La révocation ne révoque pas le jeton en main :
                              elle **refuse le renouvellement suivant**. La signature de préfixe du
                              CDN expire avec le jeton, donc la périphérie continue de servir des
                              segments valides pendant toute la durée de vie du jeton détenu — soit
                              jusqu'à **120 s**, dans le cas où il vient d'être renouvelé à
                              l'instant de la révocation. En régime courant : 45 à 75 s.

                              Le 60 servi jusqu'ici était l'**intervalle de renouvellement**
                              présenté comme une garantie d'arrêt. C'était la règle 15 violée sur
                              une constante de sécurité, et le nombre plausible avait été retenu
                              parce qu'il satisfaisait la question posée.
                            examples: [120]
              example:
                servedAt: '2026-09-21T19:06:00.000Z'
                data: { devices: [], playbackCutWithinSec: 120 }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/device-sessions/{sessionId}:
    delete:
      operationId: signOutProfile
      tags: [account]
      summary: Déconnecte un profil de cet appareil — les autres restent connectés.
      description: |
        **Deux gestes, et ils ne font pas la même chose.** Celui-ci ferme une `DeviceSession` : le
        téléviseur de salon garde ses quatre autres profils. `revokeDevice` supprime l'appareil et
        tout ce qui s'y rattache.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Le contexte à jour, avec les profils restants.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ViewerContext' } }
              example:
                servedAt: '2026-09-21T19:06:30.000Z'
                data:
                  deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                  signedIn: true
                  profiles: []
                  constants: { roomOpensMinutesBefore: 30, cancelDeadlineMinutesBefore: 60, scarcityThresholdBps: 8500, billboardPreviewDelaySec: 4, waitlistPriorityWindowHours: 2, chatRateLimitPerSecond: 2, reactionQuotaPerDate: 20, reminderLeadMinutes: 30, replayExpiryWarningHours: 6 }
                  labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                  taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/exports:
    post:
      operationId: requestExport
      tags: [account]
      summary: Demande un export — données personnelles ou factures.
      description: |
        **Asynchrone.** Un FEC ou un export RGPD n'est pas une réponse HTTP : la commande rend un
        accusé et un identifiant, l'état est interrogeable, et le document arrive par une adresse
        signée de courte durée — **utilisable sans cookie de session**, parce qu'un export protégé
        par cookie est intéléchargeable depuis une coquille native.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, ticketing]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [personal_data, invoices] }
                fromDate: { type: [string, 'null'], format: date }
                toDate: { type: [string, 'null'], format: date }
            example: { kind: invoices, fromDate: '2026-01-01', toDate: '2026-09-21' }
      responses:
        '202':
          description: Demande acceptée.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ExportRequest' } }
              example:
                servedAt: '2026-09-21T19:07:00.000Z'
                data: { exportId: 019928fc-0000-7000-8000-000000000001, kind: invoices, state: queued, requestedAt: '2026-09-21T19:07:00Z' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/me/exports/{exportId}:
    get:
      operationId: getExport
      tags: [account]
      summary: L'état d'un export, et son adresse signée quand il est prêt.
      description: |
        L'export est un **travail asynchrone**. Tant qu'il n'est pas `ready`, `downloadUrl` est nul :
        le contrat ne sert jamais une adresse qui ne répondrait pas. L'adresse vaut 60 minutes et
        fonctionne **sans cookie de session**.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, ticketing]
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: L'état, et l'adresse si prête (60 min de validité).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ExportRequest' } }
              example:
                servedAt: '2026-09-21T19:12:00.000Z'
                data:
                  exportId: 019928fc-0000-7000-8000-000000000001
                  kind: invoices
                  state: ready
                  requestedAt: '2026-09-21T19:07:00Z'
                  downloadUrl: 'https://files.arthome.fr/exports/019928fc?sig=abc'
                  downloadExpiresAt: '2026-09-21T20:12:00Z'
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/deletion:
    post:
      operationId: requestAccountDeletion
      tags: [account]
      summary: Demande la suppression du compte.
      description: |
        **Une commande financière autant que personnelle.** « La suppression annule les places non
        utilisées » : elle déclenche donc des remboursements, touche des versements peut-être déjà
        calculés, et se heurte à la conservation comptable de dix ans. Elle **ne peut être ni
        synchrone ni totale**.

        Le déroulé est une **saga persistante** : le compte passe en `deletion_requested`, les
        connexions sont bloquées, `ticketing` annule et rembourse, `payouts` recalcule ; un **délai
        de grâce de 30 jours** court, pendant lequel le compte est **réactivable sur simple
        connexion** — c'est ce qui rend l'irréversible acceptable ; au terme, `identity`
        **anonymise** au lieu de supprimer. Les factures gardent leur contenu figé.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmHandle]
              properties:
                confirmHandle: { type: string }
            example: { confirmHandle: '@marie.j' }
      responses:
        '202':
          description: Demande enregistrée, avec la fin du délai de grâce.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          state: { type: string }
                          graceUntil: { type: string, format: date-time }
                          cancelledSeatsCount: { type: integer }
              example:
                servedAt: '2026-09-21T19:13:00.000Z'
                data: { state: requested, graceUntil: '2026-10-21T19:13:00Z', cancelledSeatsCount: 2 }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: cancelAccountDeletion
      tags: [account]
      summary: Annule la demande de suppression pendant le délai de grâce.
      description: |
        Le compte est **réactivable sur simple connexion** pendant les 30 jours de grâce, et c'est
        exactement ce qui rend l'irréversible acceptable. Ce que cette commande **ne défait pas** :
        les places déjà annulées et remboursées. Le contrat le dit plutôt que de le laisser croire.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Suppression annulée. Les places déjà remboursées ne reviennent pas — le contrat le dit plutôt que de le laisser croire.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { state: { type: string } } }
              example:
                servedAt: '2026-09-25T10:00:00.000Z'
                data: { state: active }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/support/requests:
    post:
      operationId: contactSupport
      tags: [account]
      summary: Ouvre une demande d'assistance, avec son contexte.
      description: |
        **Le sujet route, le contexte priorise.** « Les demandes liées à un live en cours sont
        traitées en priorité » : sans contexte attaché — date, place, commande — cette
        priorisation est impossible à tenir, et la copie promet quelque chose que le système ne
        sait pas faire.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, message]
              properties:
                topic:
                  type: string
                  enum: [ticketing_refund, playback_quality, replay, store_shipping, account_signin, personal_data]
                message: { type: string, minLength: 10, maxLength: 4000 }
                context:
                  type: object
                  properties:
                    dateId: { type: [string, 'null'], format: uuid }
                    seatId: { type: [string, 'null'], format: uuid }
                    orderId: { type: [string, 'null'], format: uuid }
                    traceId: { type: [string, 'null'] }
            example:
              topic: playback_quality
              message: "L'image se fige toutes les deux minutes depuis le début."
              context: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
      responses:
        '202':
          description: Demande ouverte, avec sa référence et sa priorité calculée côté serveur.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          requestId: { type: string, format: uuid }
                          reference: { type: string }
                          priorityCode: { type: string }
              example:
                servedAt: '2026-09-21T19:14:00.000Z'
                data: { requestId: 019928fd-0000-7000-8000-000000000001, reference: SUP-2026-0912, priorityCode: live_in_progress }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: arthome_session
      description: |
        Session opaque `better-auth`, portée par cookie `HttpOnly`/`Secure`/`SameSite=Lax`.
        C'est la forme retenue pour `storefront-web`, qui rend au serveur et dont une fonction
        mise en cache ne peut lire ni cookie ni en-tête sur le chemin de rendu statique.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Même session, portée en `Authorization: Bearer` par le plugin `bearer` de `better-auth`
        (en-tête `set-auth-token` au retour). C'est la forme retenue pour `storefront-mobile` et
        `storefront-tv`, conservée dans le magasin natif (Keychain / Keystore), **jamais dans
        `localStorage`**.
    deviceToken:
      type: apiKey
      in: header
      name: X-Arthome-Device-Token
      description: |
        JWT ES256, `aud: "arthome.device"`, 180 jours, **rotation à chaque usage**, portant
        `device_id` et rien d'autre. Obtenu au premier lancement par `registerDevice`, **avant
        toute session**. Il n'est pas une session : il ouvre uniquement l'appairage, son
        interrogation et l'amorçage public, et **n'ouvre aucune donnée personnelle** — en
        particulier pas le canal temps réel (`adr-auth.md` §4/Q3, §5.3).

  parameters:

    Traceparent:
      name: traceparent
      in: header
      required: false
      description: |
        Contexte de trace W3C. Créé par la surface quand elle sait le faire, sinon par le BFF.
        Il est propagé jusqu'au service et injecté dans `outbox_event.tracecontext` **au moment
        de l'écriture** : injecté plus tard, le lien est définitivement perdu.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
        examples: ['00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01']

    Surface:
      name: X-Arthome-Surface
      in: header
      required: true
      description: |
        La surface appelante. Elle décide de trois choses **servies**, jamais devinées : le
        plafond de débit du tchat (TV 2 msg/s, mobile 6, web 10), la taille du rattrapage à
        l'entrée d'une salle (TV 20 messages, 50 ailleurs) et la tranche de catalogue de
        libellés et de taxonomie à charger.
      schema:
        type: string
        enum: [storefront-web, storefront-mobile, storefront-tv]
        examples: [storefront-tv]

    ViewerTimezone:
      name: X-Arthome-Timezone
      in: header
      required: false
      description: |
        Fuseau IANA du spectateur, quand la surface le connaît. Le serveur groupe la grille du
        soir **à l'heure locale du spectateur** : le regroupement dépend du fuseau, et le rendu
        serveur de Next ne connaît pas celui du visiteur.
      schema:
        type: string
        examples: ['Europe/Paris']

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 **généré par la surface avant l'envoi et persisté avant l'envoi**. Une clé
        rejouée rend la réponse d'origine, verbatim, avec `Idempotency-Replayed: true` — jamais
        une erreur de doublon. Durée de vie **24 h**, ce qui couvre une file hors ligne rejouée
        après une nuit. Voir `architecture/transport.md` §5.4.
      schema:
        type: string
        format: uuid
        examples: ['019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77']

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Curseur **opaque** encodé en Base64 sur `(created_at, id)`. Bidirectionnel et
        **indépendant de la taille de page** : changer `limit` entre deux appels ne l'invalide
        pas, ce qui est exactement ce qu'une rotation d'écran produit. Valide 24 h.
      schema:
        type: string
        examples: ['eyJjIjoiMjAyNi0wOS0yMVQyMDowMDowMFoiLCJpIjoiMDE5OTI4ZjQifQ']

    CursorDirection:
      name: direction
      in: query
      required: false
      description: Sens de parcours. `backward` remonte vers le plus récent.
      schema:
        type: string
        enum: [forward, backward]
        default: forward

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Taille de page demandée. La densité d'affichage (`tiles` / `list` sur mobile) la fait
        varier ; le curseur y survit.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

    DateId:
      name: dateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        examples: ['019928a0-7d31-7a10-b8c4-2f9e11a4c001']

    ArtistId:
      name: artistId
      in: path
      required: true
      schema: { type: string, format: uuid }

    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Identifiant **stable** de discipline, jamais un indice de tableau.
      schema:
        type: string
        examples: ['dance-contemporary']

  headers:

    ServedAt:
      description: |
        Instant serveur **de cette réponse-ci**. Sur une réponse rejouée par idempotence, il
        diffère du `servedAt` du corps, qui est celui de la première tentative : un rejeu prouve
        qu'un effet a eu lieu, il ne promet pas une donnée fraîche.
      schema: { type: string, format: date-time }

    IdempotencyReplayed:
      description: Présent et à `true` quand le corps est la réponse mémorisée d'une tentative antérieure.
      schema: { type: boolean }

    RetryAfterMs:
      description: Délai d'attente avant de réessayer, en millisecondes. Sert à désactiver un contrôle proprement plutôt qu'à enchaîner les refus.
      schema: { type: integer, minimum: 0 }

    CacheControlPublic:
      description: |
        Posé par le BFF. **`public` uniquement sur une lecture anonyme** — le corps est alors
        identique pour tous les appelants, donc mutualisable dans un cache partagé et dans le
        cache de rendu de Next. Dès qu'une session ou un jeton porteur accompagne la requête, le
        corps porte les surcouches par spectateur et l'en-tête devient `private` : **servir en
        `public` un corps personnalisé serait une fuite, pas une optimisation.**
      schema: { type: string, examples: ['public, max-age=60'] }

    VaryAuth:
      description: |
        **`Cookie, Authorization, X-Arthome-Device-Token, X-Arthome-Surface`.** Sans ce `Vary`, un
        cache intermédiaire servirait à un visiteur anonyme le corps personnalisé d'un autre. Les
        trois premiers séparent public et identifié ; `X-Arthome-Surface` sépare les plafonds de
        tchat et les tranches de catalogue de libellés, qui diffèrent par surface.
      schema: { type: string }

  responses:

    BadRequest:
      description: Requête mal formée ou refusée par validation de forme.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: SCHEMA_INVALID
              nature: refused
              params: { fields: ['tier'] }
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'

    Unauthorized:
      description: Aucune session valide, ou jeton expiré.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: UNAUTHENTICATED, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    Forbidden:
      description: Session valide, droit absent.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: FORBIDDEN, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    NotFound:
      description: Ressource inconnue.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: NOT_FOUND, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    Conflict:
      description: |
        Refus métier définitif. Le `code` dit lequel, et `params` porte ce que l'écran doit
        afficher — jamais une phrase.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: PRICE_STALE
              nature: refused
              params: { expectedAmountMinor: 2400, currentAmountMinor: 2900, currencyCode: EUR }
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'

    Gone:
      description: Le curseur, l'appairage ou la rediffusion visés ont expiré.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: CURSOR_TOO_OLD, nature: refused, params: { maxAgeHours: 24 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    TooManyRequests:
      description: Limite de débit atteinte. `params.retryAfterMs` permet de désactiver le contrôle au lieu d'enchaîner les refus.
      headers:
        Retry-After-Ms: { $ref: '#/components/headers/RetryAfterMs' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: CHAT_RATE_LIMITED, nature: unavailable, params: { retryAfterMs: 3000 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    Unavailable:
      description: |
        Nos serveurs. `nature: "unavailable"` est ce qui permet à la surface de dire « nos
        serveurs » plutôt que « votre connexion » — un échec de transport, lui, n'a pas de corps
        et se lit comme « votre connexion ».
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: UPSTREAM_UNAVAILABLE, nature: unavailable, params: { service: catalog }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

  schemas:

    # ---------------------------------------------------------------- enveloppes

    EnvelopeMeta:
      type: object
      required: [servedAt]
      properties:
        servedAt:
          type: string
          format: date-time
          description: |
            Instant serveur. **Tout** décompte affiché se calcule contre lui, jamais contre
            l'horloge du client.
          examples: ['2026-09-21T20:31:04.118Z']
        validUntil:
          type: [string, 'null']
          format: date-time
          description: |
            Présent dès qu'une valeur périssable est dans la réponse. Passé cet instant, la
            surface **rappelle la même fonction de `@arthome/core`** avec les entrées qu'elle a
            déjà — elle ne réécrit pas la règle, elle la réexécute.
          examples: ['2026-09-21T20:31:34.118Z']
        lastEventSeq:
          type: [integer, 'null']
          format: int64
          description: Numéro du dernier événement appliqué au modèle de lecture. Point de reprise.
        degraded:
          type: array
          description: |
            Les parties **facultatives** qui n'ont pas pu être composées. La réponse est servie
            quand même : une surcouche par spectateur qui échoue dégrade la carte, elle ne coule
            pas l'écran.
          items: { type: string }
          examples: [['viewerProgress']]

    CursorPageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        prevCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        approximateTotal:
          type: [integer, 'null']
          description: |
            Effectif **approximatif et borné**. Exact jusqu'à 10 000 (`track_total_hits`), et
            au-delà le contrat ne promet que « au moins 10 000 » — `totalIsLowerBound` le dit.
            C'est ce qui rend « Voir plus · N restants » honnête sans promettre un comptage
            exact qu'un index ne donne pas.
          examples: [428]
        totalIsLowerBound:
          type: boolean
          default: false
          description: Quand vrai, `approximateTotal` est une **borne inférieure**, pas un total.
        emptyReason:
          type: [string, 'null']
          description: |
            Pourquoi la liste est vide. Une liste vide sans motif oblige la surface à deviner et
            à écrire un état vide générique, ce que le dossier interdit. Chaque valeur produit un
            écran différent, **avec une action qui sort de l'impasse**.
          x-arthome-vocabulary:
            [no_match_for_query, no_match_with_filters, nothing_in_category_yet,
             no_live_in_category, no_upcoming_in_category, no_replay_in_category,
             no_followed_artist, no_followed_artist_live, no_order_yet, no_ticket_yet,
             no_replay_available, empty_cart, no_saved_search, no_watchlist_entry]
        emptyActionCode:
          type: [string, 'null']
          description: |
            Le code de l'action qui sort de l'impasse (« voir les catégories », « parcourir »).
            C'est un **code d'action servi**, pas une phrase et pas une constante recopiée sur
            cinq surfaces.

    Error:
      type: object
      required: [code, nature, params, traceId]
      properties:
        code:
          type: string
          description: |
            Vocabulaire fermé, i18n par codes. **Jamais une phrase.** Un code inconnu d'une
            version d'application retombe sur l'instantané embarqué au build — c'est une
            condition d'exploitation sur mobile, où une revue de magasin est lente.
          examples: [TRANSITION_IRREVERSIBLE]
        nature:
          type: string
          description: |
            La décision que la personne doit prendre. `refused` : ne pas réessayer, comprendre.
            `unavailable` : réessayer. `offline_forbidden` : refus **local**, avant tout envoi —
            **jamais émis par le serveur**, présent au vocabulaire pour que la surface n'ait
            qu'une seule forme d'erreur à rendre.

            **Vocabulaire ouvert en lecture, et c'est l'endroit où cela compte le plus.** Une
            nature inconnue — `degraded`, `needs_reauth` — est traitée comme **`unavailable`**,
            donc réessayable. Un `enum` figé ici ferait rejeter l'enveloppe entière par un
            téléviseur d'une version antérieure : il ne perdrait pas une carte, il perdrait sa
            capacité à **lire les erreurs**, précisément au moment où quelque chose ne va déjà
            pas, et sur un parc qu'on ne peut pas mettre à jour.
          x-arthome-vocabulary: [refused, unavailable, offline_forbidden]
          x-arthome-unknown-fallback: unavailable
          examples: [refused]
        params:
          type: object
          additionalProperties: true
          description: Les paramètres du message, jamais le message.
          examples: [{ from: scheduled, to: reserve, promise: prices_engaged }]
        traceId:
          type: string
          description: |
            La partie `trace-id` du `traceparent`. Lisible et recopiable depuis l'écran
            d'erreur : sur mobile c'est le seul lien entre « mon application a planté » et un
            journal serveur.
          examples: ['4bf92f3577b34da6a3ce929d0e0e4736']

    ErrorEnvelope:
      type: object
      required: [error, servedAt]
      properties:
        error: { $ref: '#/components/schemas/Error' }
        servedAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- primitives

    Money:
      type: object
      required: [amountMinor, currencyCode]
      description: |
        Un montant. **Unité mineure entière** — centimes pour EUR et CHF — plus un code devise
        ISO 4217. Jamais une chaîne formatée : le formatage est de la présentation et se fait
        côté client. Peut être négatif (avoir, remboursement).
      properties:
        amountMinor: { type: integer, format: int64, examples: [2400] }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$', examples: [EUR] }

    LocalizedText:
      type: object
      required: [contentLanguage, text]
      description: |
        Un texte **rédigé**, par opposition à un libellé d'interface. Il voyage avec sa langue de
        rédaction. Les deux seules exceptions assumées à « i18n par codes » : le message d'écran
        d'attente écrit par la régie, et les textes de la boîte du studio.
      properties:
        contentLanguage: { type: string, examples: [fr] }
        text: { type: string }

    ImageRendition:
      type: object
      required: [url, widthPx, heightPx]
      description: |
        Un visuel **déjà décliné à une taille réellement affichée**, jamais une recette d'URL
        avec un gabarit de largeur : sur un téléviseur à 1 Go, un fond 4K décodé pour une
        vignette coûte autant qu'un plein écran.
      properties:
        url: { type: string, format: uri }
        widthPx: { type: integer, minimum: 1 }
        heightPx: { type: integer, minimum: 1 }

    MediaSet:
      type: object
      properties:
        wide:
          type: array
          description: 16/9, du plus petit au plus grand.
          items: { $ref: '#/components/schemas/ImageRendition' }
        poster:
          type: array
          description: 2/3 ou 3/4 selon la surface, du plus petit au plus grand.
          items: { $ref: '#/components/schemas/ImageRendition' }

    VenueClock:
      type: object
      required: [venueTimezone, venueUtcOffsetMin]
      description: |
        Le fuseau de la salle, servi à côté de l'instant UTC qu'il qualifie. Le décalage est
        **calculé par le serveur pour cet instant-là**, jamais stocké : ce n'est pas un retour au
        décalage figé, c'est une valeur servie, et elle évite d'embarquer une base de fuseaux
        dans cinq applications.
      properties:
        venueTimezone: { type: string, examples: ['Europe/Paris'] }
        venueUtcOffsetMin: { type: integer, examples: [120] }

    # ------------------------------------------------------------ authentification

    SessionMode:
      type: string
      description: |
        **Un paramètre explicite, validé, jamais déduit du `User-Agent`** — celui-ci est
        falsifiable, et une heuristique contournable ne compte pas comme réponse.

        `cookie` pour les surfaces web ; `bearer` pour les coquilles natives, où
        `capacitor://localhost` est un contexte tiers sur iOS et où aucun cookie ne survivrait ;
        `device` pour le téléviseur, qui n'a **ni cookie ni jeton** au moment où il ouvre un
        appairage de connexion — c'est ce que l'identité d'appareil résout.
      enum: [cookie, bearer, device]

    SessionEstablished:
      description: |
        **Invariant : une réponse ne porte jamais un cookie et un jeton à la fois.** Deux porteurs
        pour une session, c'est **deux révocations à tenir et une qu'on oubliera** — c'est ce qui
        empêche une session de survivre à sa propre déconnexion. Ce n'est donc pas un schéma avec
        un champ facultatif : ce sont **deux schémas**, discriminés par le mode.
      oneOf:
        - $ref: '#/components/schemas/SessionEstablishedCookie'
        - $ref: '#/components/schemas/SessionEstablishedBearer'
      discriminator:
        propertyName: mode
        mapping:
          cookie: '#/components/schemas/SessionEstablishedCookie'
          bearer: '#/components/schemas/SessionEstablishedBearer'
          device: '#/components/schemas/SessionEstablishedBearer'

    SessionEstablishedCookie:
      type: object
      required: [mode, viewerContext]
      description: |
        Le cookie est posé en en-tête `Set-Cookie` — `HttpOnly`, `Secure`, `SameSite=Lax`, sur le
        **domaine du BFF**. **Rien dans le corps** : pas de jeton, pas d'identifiant de session.
      properties:
        mode: { type: string, const: cookie }
        viewerContext:
          allOf: [{ $ref: '#/components/schemas/ViewerContext' }]
          description: |
            **Projeté, jamais la forme brute de la bibliothèque d'authentification.** La surface
            reçoit le contexte qu'elle utilise partout ailleurs, et n'a pas deux formes de session
            à connaître.

    SessionEstablishedBearer:
      type: object
      required: [mode, accessToken, expiresAt, viewerContext]
      description: |
        Jeton opaque dans le corps, **aucun cookie**. Le client le range dans le magasin natif —
        Keychain, Keystore, `@capacitor/preferences` — **jamais dans `localStorage`**, qui est lié
        à l'origine, vidable par le système, et ne voyage d'aucune façon.
      properties:
        mode: { type: string, x-arthome-vocabulary: [bearer, device] }
        accessToken: { type: string }
        refreshToken: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
        viewerContext: { $ref: '#/components/schemas/ViewerContext' }

    # ------------------------------------------------------- amorçage du spectateur

    DomainConstants:
      type: object
      description: |
        Les constantes de domaine, **servies**. Elles vivent dans `@arthome/core` et ne sont
        recopiées nulle part : recopiées, « le web dira 30 minutes, la TV 15, et le mobile aura
        raison par hasard » (E11, `storefront-mobile` Q10).
      required:
        [roomOpensMinutesBefore, cancelDeadlineMinutesBefore, scarcityThresholdBps,
         billboardPreviewDelaySec, waitlistPriorityWindowHours, chatRateLimitPerSecond,
         reactionQuotaPerDate, reminderLeadMinutes, replayExpiryWarningHours]
      properties:
        roomOpensMinutesBefore: { type: integer, examples: [30] }
        cancelDeadlineMinutesBefore: { type: integer, examples: [60] }
        scarcityThresholdBps:
          type: integer
          description: Taux de remplissage à partir duquel une date est « bientôt complète », en points de base.
          examples: [8500]
        billboardPreviewDelaySec: { type: integer, examples: [4] }
        waitlistPriorityWindowHours: { type: integer, examples: [2] }
        chatRateLimitPerSecond:
          type: integer
          description: Plafond **appliqué à la source**, pour la surface appelante — TV 2, mobile 6, web 10.
          examples: [2]
        chatCatchUpMessages:
          type: integer
          description: Nombre de messages de rattrapage servis à l'entrée d'une salle — TV 20, ailleurs 50.
          examples: [20]
        reactionQuotaPerDate: { type: integer, examples: [20] }
        reminderLeadMinutes: { type: integer, examples: [30] }
        replayExpiryWarningHours: { type: integer, examples: [6] }
        previewSecondsTotal:
          type: integer
          description: |
            **Le total de l'aperçu gratuit.** `WatchVerdict.previewSecondsLeft` servait le
            **reste** et rien ne servait le total : le décompte « il vous reste 4 min 12 » avait un
            reste sans dénominateur, et la copie dit « les 5 premières minutes ». Règle 15 — la
            constante n'avait pas de document propriétaire.
          examples: [300]
        searchExactTotalLimit:
          type: integer
          description: |
            **Le seuil au-delà duquel `approximateTotal` devient une borne inférieure.** Il était
            gravé dans la prose sous la forme « exact jusqu'à 10 000 » : on servait le défaut d'un
            paramètre de moteur de recherche, au nom d'un fournisseur. Servi comme constante, il
            survit au changement de moteur.
          examples: [10000]
        creditDelayCode:
          type: string
          description: |
            Le délai de remboursement est un **code**, jamais la phrase « 3 à 5 jours ouvrés » —
            qui est une politique, donc traduisible, donc i18n.
          examples: [refund_delay_business_days_3_5]

    LabelArtifactRef:
      type: object
      required: [locale, version, url]
      description: |
        Le catalogue de libellés n'est **pas un service** : c'est un artefact versionné immuable
        publié sur CDN. La version courante est servie ici, **jamais par un appel par page**, et
        chaque application embarque un instantané au build comme **repli obligatoire** — c'est la
        seule chose qui garantit qu'aucun code brut n'atteindra jamais l'écran.
      properties:
        locale: { type: string, examples: [fr] }
        version: { type: integer, examples: [41] }
        url: { type: string, format: uri }

    ProfileSummary:
      type: object
      required: [id, name, kind]
      description: Jusqu'à cinq par compte — contrainte du téléviseur partagé, portée par le compte.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: ['Marie'] }
        kind:
          type: string
          x-arthome-vocabulary: [adult, child]
          examples: [adult]
        avatar: { $ref: '#/components/schemas/ImageRendition' }
        allowedCategoryIds:
          type: [array, 'null']
          description: |
            Présent pour un profil enfant. Le filtrage du catalogue enfant se fait **côté
            serveur** : sinon la TV d'un enfant télécharge le catalogue adulte pour le masquer.
          items: { type: string }

    ViewerPreferences:
      type: object
      description: |
        **Deux portées, tranchées champ par champ** (`storefront-tv` Q8). La langue, les
        sous-titres par défaut, la description audio, le comportement à l'ouverture d'un direct
        et le fuseau de lecture dépendent de la **personne** ; la qualité par défaut, la taille
        des sous-titres, la réduction des animations et l'aperçu automatique dépendent de
        l'**appareil** et de la pièce. Une portée unique se tromperait la moitié du temps.

        La ressource est **additive et tolérante** : une clé inconnue d'une version de
        l'application n'est ni rejetée ni effacée à la prochaine écriture — sinon la version
        mobile en revue de magasin écrase les réglages posés depuis le web.
      properties:
        account:
          type: object
          properties:
            interfaceLocale: { type: string, examples: [fr] }
            subtitlesDefault: { type: boolean }
            subtitleLanguage:
              type: [string, 'null']
              description: |
                **Activer les sous-titres et choisir leur langue sont deux réglages.** Le contrat
                ne portait que le booléen ; la conception porte une langue. Un spectateur qui veut
                des sous-titres anglais sur un spectacle français n'était pas exprimable.
              examples: [fr]
            audioDescription: { type: boolean }
            liveOpenBehaviour:
              type: string
              x-arthome-vocabulary: [peek, muted, off]
            chatOpenByDefault: { type: boolean }
            readingTimezone:
              type: string
              description: Le **même champ** que le fuseau de lecture du studio — même compte, un seul porteur.
              examples: ['Europe/Paris']
        device:
          type: object
          properties:
            defaultQuality: { type: string, x-arthome-vocabulary: [auto, low, medium, high] }
            subtitleSizeStep: { type: integer }
            reduceMotion: { type: boolean }
            autoplayPreview: { type: boolean }
            dataSaver: { type: boolean }

    ViewerContext:
      type: object
      required: [deviceId, profiles, constants, labelCatalog, taxonomyArtifact]
      description: |
        La charge utile d'amorçage. **Un seul appel**, et c'est le budget entier de l'écran
        `boot` : profils de l'appareil, droits, préférences, constantes de domaine, version du
        catalogue de libellés. Les libellés eux-mêmes viennent de l'instantané embarqué — le
        contrôle de version ne bloque **jamais** le premier rendu.
      properties:
        deviceId: { type: string, format: uuid }
        signedIn: { type: boolean }
        currentProfileId: { type: [string, 'null'], format: uuid }
        profiles:
          type: array
          items: { $ref: '#/components/schemas/ProfileSummary' }
        account:
          type: [object, 'null']
          properties:
            publicHandle: { type: string, examples: ['@marie.j'] }
            memberNumber: { type: string }
            emailVerified: { type: boolean }
        plan:
          type: [object, 'null']
          description: |
            La formule **affichée**, servie pour peindre les prix et les badges. Elle ne décide
            **jamais** d'un droit de lecture : ce droit est rendu par `streaming` à l'ouverture
            du lecteur, sur la donnée fraîche (`adr-auth.md` §7.1).
          properties:
            tier: { type: string, x-arthome-vocabulary: [free, pass, premium] }
            state: { type: string, x-arthome-vocabulary: [active, past_due, cancelled, trialing] }
            seatDiscountBps: { type: integer, examples: [1000] }
            concurrentStreamsAllowed: { type: integer, examples: [2] }
        preferences: { $ref: '#/components/schemas/ViewerPreferences' }
        constants: { $ref: '#/components/schemas/DomainConstants' }
        labelCatalog: { $ref: '#/components/schemas/LabelArtifactRef' }
        taxonomyArtifact:
          allOf: [{ $ref: '#/components/schemas/LabelArtifactRef' }]
          description: |
            Même régime que l'i18n, **servi par tranche et par surface** : le mobile ne charge ni
            le vocabulaire du studio ni la table de touches TV. 59,5 Ko bruts / 8,4 Ko gzip pour
            la tranche complète — ce n'est pas un appel d'API.
        realtime:
          type: object
          description: Où ouvrir **l'unique** connexion temps réel. Le multiplexage se fait par salle, jamais par connexion.
          properties:
            namespace: { type: string, examples: ['/storefront'] }
            pulseIntervalSec: { type: integer, examples: [5] }

    ChangeFeed:
      type: object
      required: [invalidated, complete]
      description: |
        **Une liste d'invalidations, pas les données.** Au retour au premier plan, une surface
        revalide une demi-douzaine de lectures d'un coup ; refuser cette rafale, c'est refuser
        l'ouverture de l'application. Une requête au lieu de douze.
      properties:
        invalidated:
          type: array
          description: |
            Étiquettes **nommées par le contrat**, jamais inventées par une surface — sinon le
            mobile et la TV en inventeraient d'autres et le rendu serveur de Next appellerait
            `revalidateTag` sur des clés que personne n'émet.
          items:
            type: string
            x-arthome-vocabulary:
              ['date:{id}', 'date:{id}:availability', 'artist:{id}', 'category:{id}',
               'account:tickets', 'account:orders', 'account:subscription', 'home:rails']
          examples: [['date:019928a0-7d31-7a10-b8c4-2f9e11a4c001', 'account:tickets']]
        complete:
          type: boolean
          description: |
            `false` signifie « trop de changements, recharge tout » — la même honnêteté que
            `resume:too_old` sur le canal temps réel. Un client qui ne sait pas ce qu'il a manqué
            est pire qu'un client qui recharge.

    # ------------------------------------------------------------- la date publique

    WatchVerdict:
      type: object
      required: [allowed, advisory, validUntil]
      description: |
        Le droit de lire, **forme de premier ordre**, servi par date. Il existe à **deux sites
        d'évaluation pour une seule implémentation** (`decideWatch` dans `@arthome/core`) :

        - **ici**, composé par le BFF depuis ses lectures groupées — **indicatif et non
          opposable**, et le contrat le déclare tel par `advisory: true`. Il sert à peindre la
          carte sans second aller-retour, ce que la TV exige ;
        - **à l'ouverture du lecteur**, par `streaming`, depuis ses propres copies projetées.
          **C'est la seule évaluation qui fait autorité**, parce que c'est la seule qui produit
          un jeton.

        **Il ne se met jamais en cache sur disque.** Il expire, il dépend du territoire, il
        dépend de la limite d'écrans : un droit relu depuis le disque est un droit faux.
        `validUntil` ne dépasse jamais 60 secondes.
      properties:
        allowed: { type: boolean }
        advisory:
          type: boolean
          description: |
            `true` partout dans ce document. Le verdict opposable est celui de
            `POST /v1/playback/{dateId}/open`.
        reasonCode:
          type: [string, 'null']
          description: |
            Le **même vocabulaire de refus** que le lecteur : une carte qui annonce « abonnement
            requis » et un lecteur qui refuse pour la même raison disent le même code. Chacun
            produit un écran différent sur les trois storefronts ; un code générique en
            produirait un faux.
          x-arthome-vocabulary:
            [NO_SEAT, ROOM_NOT_OPEN, OUT_OF_TERRITORY, SUBSCRIPTION_REQUIRED, NO_REPLAY,
             REPLAY_EXPIRED, REPLAY_NOT_ON_SALE, PREVIEW_EXHAUSTED, CONCURRENT_LIMIT_REACHED,
             DATE_CANCELLED]
          examples: [SUBSCRIPTION_REQUIRED]
        reasonParams:
          type: object
          additionalProperties: true
          description: Ce que l'écran doit afficher — le territoire, la formule requise, l'instant d'expiration.
        fallbackAction:
          type: [string, 'null']
          description: L'action qui sort de l'impasse. Un code, jamais une phrase, et jamais un écran mort.
          x-arthome-vocabulary: [buy_seat, join_waitlist, subscribe, watch_preview, see_replay_policy, none]
        previewSecondsLeft:
          type: [integer, 'null']
          description: |
            Budget d'aperçu restant, **décompté côté serveur, par compte** — pas par appareil,
            sinon un foyer à quatre appareils obtient quatre aperçus ; pas par date seule, c'est
            `(compte, date)`. Recharger la page ne prolonge rien.
        validUntil: { type: string, format: date-time }

    DateCard:
      type: object
      required:
        [id, showId, channelId, slug, canonicalUrl, title, startsAt, venueClock, runtimeMin,
         displayState, displayStateValidUntil, replay, rights, media]
      description: |
        **La forme la plus consommée du produit.** Elle doit se suffire : une carte ne déclenche
        jamais un appel pour se peindre.

        Elle porte les **entrées** des règles périssables **et** leur résultat au moment du
        service **et** l'instant où ce résultat cesse d'être vrai. C'est ce qui permet à une
        réponse mise en cache huit heures de rester juste : la surface rappelle la même fonction
        de `@arthome/core` quand `displayStateValidUntil` est passé, elle ne réécrit pas la
        règle.

        **Aucun champ de billetterie ni de régie n'y figure** (E8) : ni `sold`, ni `revenue`, ni
        `publication`, ni `publishedBy`.
      properties:
        id: { type: string, format: uuid }
        showId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        artist:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, examples: ['Compagnie Verticale'] }
            verified: { type: boolean }
            avatar: { $ref: '#/components/schemas/ImageRendition' }
        slug: { type: string, examples: ['nuit-blanche-2026-09-21'] }
        canonicalUrl:
          type: string
          format: uri
          description: |
            **Servie, jamais construite par la surface.** C'est elle qu'on partage, qu'on met en
            favori, vers quoi pointent un rappel et une notification, et ce qu'on indexe — et
            c'est elle que la TV encode dans un QR pour l'action Partager, puisqu'il n'y a ni
            presse-papiers ni messagerie utile sur un téléviseur.
        title: { type: string }
        categoryId: { type: string, examples: ['dance-contemporary'] }
        genreIds:
          type: array
          description: '**Multiple** : un spectacle est à la fois « contemporain » et « répertoire ». Le singulier l''interdisait (E9).'
          items: { type: string }
        tagIds: { type: array, items: { type: string } }
        startsAt: { type: string, format: date-time }
        venueClock: { $ref: '#/components/schemas/VenueClock' }
        runtimeMin: { type: integer }
        venue:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            city: { type: string }
            countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        roomOpensAt:
          type: string
          format: date-time
          description: |
            L'**instant** d'ouverture de salle, servi. La surface programme la bascule localement,
            à la seconde, **sans un seul appel** : un mode veille qui tourne huit heures ne fait
            donc aucune requête.
        displayState:
          type: string
          description: |
            La **seule** valeur d'état que les cartes affichent, et personne ne la recompose.
            Produite par `displayStateOf(publication, run, outcome, instants, now)` dans
            `@arthome/core`. La hiérarchie, écrite une fois : `outcome` prime sur `run.state`,
            qui prime sur `publication.state`.
          x-arthome-vocabulary:
            [scheduled, room_open, live, replay, ended, postponed, cancelled, interrupted]
          examples: [live]
        displayStateValidUntil: { type: string, format: date-time }
        outcome:
          type: [string, 'null']
          description: |
            L'issue **remplace l'état sur chaque carte**, pas seulement sur la fiche. C'est un
            fait sur la représentation : jamais réécrit, jamais effacé.
          x-arthome-vocabulary: [postponed, cancelled, interrupted]
        rescheduledTo: { type: [string, 'null'], format: date-time }
        viewers:
          type: [integer, 'null']
          description: |
            **Absent — jamais zéro — quand la date n'est pas à l'antenne.** Un zéro se lit
            « personne », pas « non mesuré », et la règle du dossier interdit « 0 EN DIRECT ».
        availability:
          type: [object, 'null']
          description: Projeté depuis `ticketing`. Absent tant qu'aucun tarif n'est actif.
          properties:
            seatsAvailable: { type: integer }
            waitlistCount: { type: integer }
            fillRateBps:
              type: integer
              description: |
                Le **taux**, pas la capacité. Servir la capacité et laisser calculer recrée la
                valeur composée à deux endroits, et la maquette le prouve en appliquant une
                constante de 2 000 places indépendante de la salle.
            soldOut: { type: boolean }
            lowestPrice: { $ref: '#/components/schemas/Money' }
            promotion:
              type: [object, 'null']
              properties:
                reason:
                  type: string
                  x-arthome-vocabulary:
                    [pre_sale, preview_night, discovery_rate, final_date, late_rate]
                struckPrice: { $ref: '#/components/schemas/Money' }
                currentPrice: { $ref: '#/components/schemas/Money' }
                validUntil: { type: string, format: date-time }
        replay:
          type: object
          required: [policy]
          description: |
            La **promesse** faite avant l'achat — c'est elle qui justifie l'écart de tarif.
            `none` est **définitif** pour cette date.
          properties:
            policy:
              type: string
              x-arthome-vocabulary: [included, subscription, unit, none]
            windowHours: { type: [integer, 'null'] }
            availableFrom: { type: [string, 'null'], format: date-time }
            expiresAt:
              type: [string, 'null']
              format: date-time
              description: Dérivé de la fin du direct et de `windowHours`. Servi comme un instant, jamais « il reste 41 h ».
            unitPrice: { $ref: '#/components/schemas/Money' }
        rights:
          type: object
          required: [scope]
          properties:
            scope: { type: string, x-arthome-vocabulary: [worldwide, restricted] }
            blackoutCountries: { type: array, items: { type: string, pattern: '^[A-Z]{2}$' } }
            reasonCode:
              type: [string, 'null']
              description: 'Un **code**, jamais une phrase. Le jeu actuel porte `label`/`labelEn` rédigés dans la donnée : fuite d''i18n (E8).'
              x-arthome-vocabulary: [co-production, broadcaster, festival]
        chatMode:
          type: string
          x-arthome-vocabulary: [open, emoji, read_only, off]
        media: { $ref: '#/components/schemas/MediaSet' }
        languageDependency:
          type: string
          x-arthome-vocabulary: [none, helpful, essential]
        watchVerdict:
          allOf: [{ $ref: '#/components/schemas/WatchVerdict' }]
          description: |
            Surcouche par spectateur. **Absente — pas nulle — en lecture anonyme**, ce qui rend le
            corps public identique pour tous les appelants et donc mutualisable dans un cache
            partagé.
        viewerRelations:
          type: [object, 'null']
          description: |
            Surcouche par spectateur, fusionnée depuis une lecture **groupée par lot**, jamais un
            appel par carte. **Absente en lecture anonyme.**
          properties:
            inWatchlist: { type: boolean }
            reminderSet: { type: boolean }
            followsArtist: { type: boolean }
        viewerProgress:
          type: [object, 'null']
          description: Surcouche par spectateur. **Absente en lecture anonyme.**
          properties:
            positionSec: { type: integer }
            durationSec: { type: integer }
            completed: { type: boolean }

    DateDetail:
      allOf:
        - $ref: '#/components/schemas/DateCard'
        - type: object
          description: La fiche. Servie en **un** appel, avec sa série, le même artiste et les suggestions.
          properties:
            synopsis: { $ref: '#/components/schemas/LocalizedText' }
            castAndCrew:
              type: array
              items:
                type: object
                properties:
                  personId: { type: string, format: uuid }
                  name: { type: string }
                  roleCode: { type: string }
            spokenLanguages: { type: array, items: { type: string } }
            subtitleLanguages: { type: array, items: { type: string } }
            surtitleLanguages: { type: array, items: { type: string } }
            attributes:
              type: object
              additionalProperties: true
              description: Les sept groupes d'attributs. Distincts des **étiquettes** (`tagIds`) — collision de nom entre deux notions, séparée par le contrat.
            priceTiers:
              type: array
              items: { $ref: '#/components/schemas/PriceTier' }
            serviceFee:
              type: [object, 'null']
              description: |
                Le **barème** de frais de service, **par place**, servi par le contrat. Jamais une
                constante d'écran : le récapitulatif affiche une ligne « frais de service », elle
                doit être calculable une seule fois.
              properties:
                perSeat: { $ref: '#/components/schemas/Money' }
                capped: { $ref: '#/components/schemas/Money' }
            chapters:
              type: array
              items: { $ref: '#/components/schemas/Chapter' }
            seriesDates:
              type: array
              description: Les autres dates du même spectacle.
              items: { $ref: '#/components/schemas/DateCard' }
            totalSeriesDates:
              type: integer
              description: '« Toutes les dates (N) » : le N est **servi**, pas compté sur la tranche visible.'
            suggestions:
              type: array
              items: { $ref: '#/components/schemas/DateCard' }
            merchItems:
              type: array
              description: La boutique du spectacle, servie avec la fiche.
              items: { $ref: '#/components/schemas/MerchItem' }

    PriceTier:
      type: object
      required: [tier, amount, active]
      properties:
        tier: { type: string, x-arthome-vocabulary: [full, reduced, support] }
        amount: { $ref: '#/components/schemas/Money' }
        active: { type: boolean }
        validUntil:
          type: [string, 'null']
          format: date-time
          description: |
            Présent quand le prix courant dépend de l'instant — le tarif « séance commencée » est
            **au prorata du temps restant** et ne peut pas être une chaîne figée. 60 s.

    Chapter:
      type: object
      required: [id, vocabId, atMediaSec]
      properties:
        id: { type: string, format: uuid }
        vocabId:
          type: string
          description: Identifiant du vocabulaire de chapitres, **jamais un libellé rédigé**.
        atMediaSec:
          type: integer
          description: Position **dans le média**, pas heure d'envoi. Gratuit maintenant, irrattrapable ensuite.

    # ------------------------------------------------------ écrans composés

    Rail:
      type: object
      required: [id, titleCode, kind, itemKind, cardForm, items]
      description: |
        Une rangée d'accueil. **La composition et l'ordre sont serveur** : la maquette charge
        1 814 dates (1,79 Mo) et filtre côté client, ce que le contrat doit rendre impossible sur
        un appareil qui dispose de 300 à 500 Mo pour tout, vidéo comprise.
      properties:
        id: { type: string }
        titleCode:
          type: string
          description: Un **code** i18n, jamais un titre rédigé.
          examples: [home.rail.resume]
        kind:
          type: string
          description: |
            `my_seats` porte « Vos places » : elle n'est **pas** éditoriale mais personnelle, et son
            comportement lui est propre — la carte devient « Entrer dans la salle » à l'ouverture de
            la salle. La ranger sous `editorial` aurait effacé cette différence.
          x-arthome-vocabulary:
            [resume, live_now, my_seats, upcoming_tonight, followed, editorial, category,
             replay_expiring, artists_to_follow]
        itemKind:
          type: string
          description: |
            **Ce que la rangée porte.** Sans ce champ, une rangée d'artistes est inexprimable :
            `ArtistSummary` existe au contrat mais aucune rangée ne pouvait le transporter, et la
            surface aurait dû deviner le type sur l'identifiant de rangée — c'est-à-dire sur un
            littéral parallèle.
          x-arthome-vocabulary: [date, artist]
          examples: [date]
        cardForm:
          type: string
          description: |
            **La forme de carte est un choix éditorial, donc serveur**, au même titre que l'ordre
            des rangées. `poster` sert la rangée « Affiches » en 2/3 vertical, `portrait` les
            artistes en rond. Sans ce champ la surface choisirait sur l'identifiant de rangée, et
            *« la variété de format est ce qui empêche l'écran de ressembler à un tableur »* —
            neuf rangées de cartes 16/9 identiques, c'est le défaut n°1 d'un téléviseur.
          x-arthome-vocabulary: [wide, poster, portrait]
          examples: [wide]
        items:
          type: array
          description: |
            **Union discriminée par `itemKind`** : `DateCard` quand `itemKind` vaut `date`,
            `ArtistSummary` quand il vaut `artist`.
          items:
            oneOf:
              - $ref: '#/components/schemas/DateCard'
              - $ref: '#/components/schemas/ArtistSummary'
        total:
          type: [integer, 'null']
          description: |
            **L'effectif de la rangée, pas celui de la tranche servie.** Chaque rangée affiche un
            compteur à droite de son titre ; sans ce champ elle ne peut afficher que
            `items.length`, soit la taille de page — un chiffre faux. Même garantie que
            `CursorPageInfo.approximateTotal` : exact jusqu'à 10 000, borne inférieure au-delà.
        totalIsLowerBound: { type: boolean, default: false }
        nextCursor:
          type: [string, 'null']
          description: |
            Curseur **par rangée**, consommé par `extendRail`. Un rail est un extrait ; il ne se
            pagine pas à l'écran, il s'étend.

    HomeScreen:
      type: object
      required: [rails]
      properties:
        billboard:
          type: [object, 'null']
          description: |
            Le choix du billboard est **serveur**. `previewStartsAfterSec` est servi depuis les
            constantes de domaine, jamais codé sur la surface.
          properties:
            date: { $ref: '#/components/schemas/DateCard' }
            previewStartsAfterSec: { type: integer, examples: [4] }
            previewUrl: { type: [string, 'null'], format: uri }
        rails: { type: array, items: { $ref: '#/components/schemas/Rail' } }

    ScheduleSlot:
      type: object
      required: [localHourLabelKey, dates]
      description: |
        La grille du soir, **déjà groupée à l'heure locale du spectateur**. Le groupement dépend
        du fuseau : la surface l'envoie en en-tête, le serveur groupe. Une grille groupée côté
        client serait groupée cinq fois différemment.
      properties:
        localHourLabelKey: { type: string, examples: ['20'] }
        startsAt: { type: string, format: date-time }
        dates: { type: array, items: { $ref: '#/components/schemas/DateCard' } }

    LiveScreen:
      type: object
      required: [slots]
      properties:
        featured: { $ref: '#/components/schemas/DateCard' }
        slots: { type: array, items: { $ref: '#/components/schemas/ScheduleSlot' } }

    CategoryTile:
      type: object
      required: [id, universe, rank, datesCount, liveCount]
      description: |
        Les 21 disciplines, avec **famille et rang**. Le rang éditorial fait autorité : **aucune
        surface ne réordonne**. Servies en **un** appel, jamais un appel par tuile.
      properties:
        id: { type: string }
        universe: { type: string, x-arthome-vocabulary: [music, stage] }
        rank: { type: integer }
        datesCount: { type: integer }
        liveCount: { type: integer }
        media: { $ref: '#/components/schemas/MediaSet' }
        featured:
          type: boolean
          description: |
            Sélection éditoriale de tête de page, **servie comme une règle**, jamais codée en
            dur sur une surface (`storefront-tv` Q5).

    CategoryScreen:
      type: object
      required: [categoryId, sections]
      properties:
        categoryId: { type: string }
        hero: { $ref: '#/components/schemas/DateCard' }
        subGenres:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              rank: { type: integer }
        sections:
          type: array
          description: |
            Cinq sections bornées — `ov`, `live`, `up`, `rep`, `art`. La vue d'ensemble **ne se
            pagine pas** : une vue d'ensemble se borne (8 par section).
          items:
            type: object
            required: [id, items]
            properties:
              id: { type: string, x-arthome-vocabulary: [overview, live, upcoming, replays, artists] }
              titleCode: { type: string }
              items: { type: array, items: { $ref: '#/components/schemas/DateCard' } }
              nextCursor: { type: [string, 'null'] }
        facets: { type: array, items: { $ref: '#/components/schemas/Facet' } }

    ArtistSummary:
      type: object
      required: [id, channelId, name, categoryId]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        categoryId: { type: string }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        verified: { type: boolean }
        media: { $ref: '#/components/schemas/MediaSet' }
        followers:
          type: integer
          description: |
            Compteur **projeté**, avec sa fraîcheur déclarée. Un compteur faux de 3 % n'est pas
            grave ; un compteur qui diffère entre la fiche et la liste l'est — c'est pourquoi il
            vient d'une seule projection.
        avgViewers: { type: [integer, 'null'] }
        isLiveNow: { type: boolean }
        followedByViewer: { type: [boolean, 'null'] }
        alertEnabled:
          type: [boolean, 'null']
          description: |
            **Suivre et être alerté sont deux réglages**, et le contrat les sépare : `followedByViewer`
            est une relation de catalogue, `alertEnabled` un drapeau porté par `notifications`. Les
            confondre rendrait impossible de suivre un artiste sans être notifié — et la conception
            montre les deux séparément. **Absent en lecture anonyme.**
        nextDate:
          allOf: [{ $ref: '#/components/schemas/DateCard' }]
          description: |
            La prochaine date annoncée, quand il y en a une. Servie pour que la page « Suivis »
            distingue les artistes **qui ont une date** de ceux qui n'en ont pas — c'est la
            scission que l'écran affiche, et elle serait sinon calculée par un appel par artiste.

    ArtistDetail:
      allOf:
        - $ref: '#/components/schemas/ArtistSummary'
        - type: object
          properties:
            biography: { $ref: '#/components/schemas/LocalizedText' }
            joinedAt: { type: string, format: date-time }
            upcomingDates: { type: array, items: { $ref: '#/components/schemas/DateCard' } }
            pastDates: { type: array, items: { $ref: '#/components/schemas/DateCard' } }
            replays: { type: array, items: { $ref: '#/components/schemas/DateCard' } }
            merchItems: { type: array, items: { $ref: '#/components/schemas/MerchItem' } }

    Facet:
      type: object
      required: [facetId, values]
      description: |
        **Générique**, jamais une énumération de facettes au contrat : ajouter « accessible en
        fauteuil » ne doit pas être un changement de contrat. Les effectifs sont calculés sur la
        requête courante et rendus **dans la même réponse** que les résultats — pas de second
        appel.
      properties:
        facetId: { type: string, examples: [category] }
        values:
          type: array
          items:
            type: object
            required: [id, count]
            properties:
              id: { type: string }
              count: { type: integer }

    StructuredFilter:
      type: object
      description: |
        Les filtres qui ne sont **pas** des énumérations : intervalle de prix, intervalle de
        dates. Ils vivent à côté des facettes, jamais dedans.
      required: [filterId, kind]
      properties:
        filterId: { type: string, examples: [price] }
        kind: { type: string, x-arthome-vocabulary: [money_range, date_range, boolean] }
        min: { type: [integer, 'null'] }
        max: { type: [integer, 'null'] }

    SearchCriteria:
      type: object
      description: |
        **La grammaire des critères, publiée.** C'est la même forme partout : paramètre de
        `/v1/search`, paramètre de `/v1/categories/{id}`, et corps de `SavedSearch.criteria`. Une
        seule forme, donc une seule signature — et `criteriaSignature` ne peut la produire que
        parce que la forme est normalisée.

        **Toutes les valeurs sont des identifiants stables**, jamais des indices de tableau : une
        position ne survit ni à une URL partageable, ni à une recherche enregistrée, ni à
        l'insertion d'une discipline.
      additionalProperties: false
      properties:
        categoryIds: { type: array, items: { type: string } }
        genreIds: { type: array, items: { type: string } }
        tagIds: { type: array, items: { type: string } }
        artistIds: { type: array, items: { type: string, format: uuid } }
        cityIds: { type: array, items: { type: string } }
        countryCodes: { type: array, items: { type: string, pattern: '^[A-Z]{2}$' } }
        languageDependency: { type: array, items: { type: string, enum: [none, helpful, essential] } }
        replayPolicy: { type: array, items: { type: string, enum: [included, subscription, unit, none] } }
        displayStates: { type: array, items: { type: string, enum: [scheduled, room_open, live, replay, ended] } }
        priceMinMinor: { type: [integer, 'null'], minimum: 0 }
        priceMaxMinor: { type: [integer, 'null'], minimum: 0 }
        startsAfter: { type: [string, 'null'], format: date-time }
        startsBefore: { type: [string, 'null'], format: date-time }
        almostSoldOut: { type: [boolean, 'null'] }
        onPromotion: { type: [boolean, 'null'] }
        accessibility: { type: array, items: { type: string } }

    ShowGroup:
      type: object
      required: [showId, title, representativeDate, matchingDatesCount]
      description: |
        L'unité paginée de la recherche pour les onglets `best`, `lives` et `replays` est le
        **spectacle**, pas la date. Chaque groupe porte la date représentative retenue — la
        première qui satisfait les filtres, selon le tri courant — **et** le nombre total de
        dates du groupe qui satisfont les filtres : sans ce second nombre, « voir plus de dates
        (2) » est faux dès qu'un filtre est actif.
      properties:
        showId: { type: string, format: uuid }
        title: { type: string }
        representativeDate: { $ref: '#/components/schemas/DateCard' }
        matchingDatesCount: { type: integer, examples: [3] }

    # ---------------------------------------------------------------- commerce

    TicketCard:
      type: object
      required: [seatId, dateId, seatCode, tier, state, date]
      properties:
        seatId: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        seatCode:
          type: string
          description: |
            **Émis par le serveur**, toujours. Il s'affiche à l'identique sur le web, le mobile et
            la TV ; la maquette le calcule par hachage, ce qui donnerait **trois codes différents
            pour la même place** dès qu'une surface change de fonction de hachage.
          examples: ['ATH-7QK2-4M']
        tier: { type: string, x-arthome-vocabulary: [full, reduced, support] }
        state: { type: string, x-arthome-vocabulary: [held, active, cancelled, refunded, transferred, credited] }
        cancelDeadline:
          type: [string, 'null']
          format: date-time
          description: |
            Servi comme un **instant**. « Jusqu'à 1 h avant le début » est une règle de domaine,
            pas une mention d'écran.
        date: { $ref: '#/components/schemas/DateCard' }
        refund:
          type: [object, 'null']
          description: |
            Ce que le spectateur retrouve, et **où**. Le montant et un **code de délai** — jamais
            la phrase « 3 à 5 jours ouvrés », qui est une politique.
          properties:
            amount: { $ref: '#/components/schemas/Money' }
            delayCode: { type: string, examples: [refund_delay_business_days_3_5] }
            method: { type: string, x-arthome-vocabulary: [original_payment_method, account_credit] }

    MerchItem:
      type: object
      required: [id, channelId, label, source, state]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        showId: { type: [string, 'null'], format: uuid }
        label: { $ref: '#/components/schemas/LocalizedText' }
        variants:
          type: array
          description: |
            **Un t-shirt sans taille n'est pas vendable.** Le contrat porte les variantes ; une
            ligne de panier référence une variante, jamais un article nu.
          items:
            type: object
            required: [id, label, inStock]
            properties:
              id: { type: string }
              label: { type: string, examples: [M] }
              inStock: { type: boolean }
              price: { $ref: '#/components/schemas/Money' }
        price: { $ref: '#/components/schemas/Money' }
        state: { type: string, x-arthome-vocabulary: [on_sale, out_of_stock] }
        source:
          type: string
          description: |
            L'origine de l'article. Une source externe n'est pas vendue par nous : elle renvoie
            vers `merchantUrl`, et aucun panier ne l'accepte.
          x-arthome-vocabulary: [arthome, shopify, woocommerce, prestashop, drupal, api]
        merchantUrl: { type: [string, 'null'], format: uri }
        pinnedDuringLive: { type: boolean }
        media: { $ref: '#/components/schemas/MediaSet' }

    CartLine:
      type: object
      required: [id, itemId, variantId, quantity, channelId, unitPrice, version]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        variantId: { type: string }
        channelId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money' }
        version:
          type: integer
          description: |
            **Le rang vient du serveur.** Conflit entre deux appareils : par ligne, dernier
            écrivain gagne, arbitré par ce numéro de version — jamais par une date du téléphone,
            dont l'horloge dérive et saute.

    Cart:
      type: object
      required: [lines, vendorGroups]
      description: |
        **Le panier vit sur le compte, pas sur le navigateur** : la maquette affiche un panier
        persistant dans l'en-tête, il se monte sur plusieurs sessions depuis la boutique d'un
        direct, et les trois storefronts le montrent. Un panier local ne survivrait ni à une
        réinstallation ni à un changement d'appareil.
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        vendorGroups:
          type: array
          description: |
            **Une commande de marchandise est mono-vendeur.** Un panier contenant les articles de
            deux chaînes **se scinde en deux commandes au paiement**, chacune avec son port, sa
            commission et son versement. Deux justifications indépendantes : deux expéditions, et
            un `destination charge` Stripe n'admet **qu'une seule destination**.
          items:
            type: object
            properties:
              channelId: { type: string, format: uuid }
              lineIds: { type: array, items: { type: string, format: uuid } }

    CartQuote:
      type: object
      required: [groups, validUntil]
      description: |
        **Le devis est opposable** : le total présenté est celui qui sera débité. Les frais de
        port sont calculés **au devis**, pas à l'ajout. Au-delà de `validUntil`, un nouveau devis.
      properties:
        groups:
          type: array
          items:
            type: object
            required: [channelId, subtotal, total]
            properties:
              channelId: { type: string, format: uuid }
              subtotal: { $ref: '#/components/schemas/Money' }
              shipping: { $ref: '#/components/schemas/Money' }
              discount:
                type: [object, 'null']
                description: |
                  Remise **boutique** (15 %) ou promotion — **jamais les deux** : la plus
                  favorable au spectateur l'emporte, et la règle vit dans `@arthome/core`. À ne
                  pas confondre avec `seatDiscount` (10 / 20 %), qui porte sur les **places** :
                  deux remises, deux assiettes, et elles ne coïncident dans aucune source (E1).
                properties:
                  reasonCode: { type: string }
                  amount: { $ref: '#/components/schemas/Money' }
              total: { $ref: '#/components/schemas/Money' }
        validUntil: { type: string, format: date-time, description: 15 minutes. }

    SeatQuote:
      type: object
      required: [lines, total]
      description: |
        Le récapitulatif d'achat d'une place, **composé côté serveur**. Les quatre lignes viennent
        du contrat : `palier + frais de service − remise d'abonnement − promotion = total`. C'est
        exactement le cas « un total composé à deux endroits » que le dossier cite comme défaut
        typique, et il est fermé ici.
      properties:
        lines:
          type: array
          items:
            type: object
            required: [kind, amount]
            properties:
              kind: { type: string, x-arthome-vocabulary: [tier, service_fee, subscription_discount, promotion, credit_applied] }
              reasonCode: { type: [string, 'null'] }
              amount: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        validUntil: { type: string, format: date-time }

    TaxEvidence:
      type: object
      required: [kind, country, source, collectedAt]
      description: |
        **Un élément de preuve de localisation, avec sa provenance.** Une vente B2C dans l'Union
        exige **deux éléments non contradictoires** — et un prestataire de taxe privilégie en
        général une adresse unique au lieu de les comparer, donc la règle de preuve ne peut pas lui
        être déléguée : c'est notre registre qui la porte.

        `source` n'est pas décoratif : **une preuve sans provenance n'est pas une preuve**.
      properties:
        kind:
          type: string
          x-arthome-vocabulary:
            [billing_address, ip_address, bank_country, card_country, sim_country, declared_by_buyer]
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: Ce que **cet élément-là** indique — pas le résultat de l'arbitrage.
        subdivision: { type: [string, 'null'], description: 'ISO 3166-2, quand l''élément le porte.' }
        source: { type: string, examples: ['edge.geoip'] }
        collectedAt: { type: string, format: date-time }

    BuyerTaxLocation:
      type: object
      required: [country, evidence, evidenceConflicting]
      description: |
        **La localisation fiscale de l'acheteur, portée par la commande.** Ni un identifiant de
        marché, ni un simple pays : aux États-Unis le taux change d'une rue à l'autre, donc le code
        postal est indispensable ; dans l'Union la preuve est **double** et doit être conservée.

        **À ne pas confondre avec la vérification d'identité du compte connecté**, qui porte sur
        l'**artiste** et n'a rien à voir avec la localisation du **spectateur**. Les deux sont
        souvent confondues.
      properties:
        country: { type: string, pattern: '^[A-Z]{2}$' }
        subdivision: { type: [string, 'null'] }
        postalCode: { type: [string, 'null'] }
        city: { type: [string, 'null'] }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/TaxEvidence' }
        evidenceConflicting:
          type: boolean
          description: |
            Vrai quand deux éléments se contredisent. **La vente se fait quand même** et la ligne
            part en instruction : refuser l'achat punirait le spectateur d'une ambiguïté qui n'est
            pas la sienne, et masquer le conflit produirait une déclaration fausse et silencieuse.
        resolvedAt: { type: string, format: date-time }

    PaymentHandoff:
      type: object
      required: [orderId, state, paymentIntentRef, clientSecret, returnUrl]
      description: |
        **Le pas que le contrat n'avait pas, et sans lequel aucun paiement soumis à
        l'authentification forte européenne n'aboutit.** Le vocabulaire d'état portait
        `awaiting_action` ← « 3-D Secure en cours », et **aucune opération ne permettait ni
        d'atteindre cet état ni d'en sortir** : les trois commandes d'argent ne répondaient que
        `201 · paid`, sans `clientSecret`, sans `nextAction`, sans adresse de retour.

        Ce n'était pas un raffinement : une part significative des paiements par carte en Europe
        exige une authentification forte. Un parcours qui ne prévoit pas `requires_action`
        **échoue en production sur des paiements parfaitement valides**, et il échoue en
        silence — la commande reste `awaiting_action` et rien ne la reprend.

        **Le `clientSecret` est produit côté serveur** et ne sert qu'à l'élément de paiement de la
        surface ; il n'autorise rien d'autre et ne remplace aucune session.
      properties:
        orderId: { type: string, format: uuid }
        state: { type: string, x-arthome-vocabulary: [pending, awaiting_action, processing] }
        paymentIntentRef:
          type: string
          description: Référence **opaque** au domaine. Seul l'adaptateur sait la lire.
        clientSecret: { type: string }
        nextAction:
          type: [object, 'null']
          description: |
            Ce que la surface doit faire ensuite, **déclaré** plutôt que deviné : une redirection
            d'authentification forte, ou rien.
          properties:
            kind: { type: string, x-arthome-vocabulary: [redirect_to_url, use_stripe_sdk, none] }
            redirectUrl: { type: [string, 'null'], format: uri }
        returnUrl:
          type: string
          format: uri
          description: |
            **Où le fournisseur renvoie après l'authentification.** Liste d'autorisation en
            **chaînes littérales**, jamais un motif.

            **Et le retour ne confirme rien** : *un paiement confirmé par un paramètre d'URL est
            un paiement confirmé par le client*. Le retour dit **où aller** ; c'est
            `getOrder` — alimenté par le webhook vérifié — qui dit **ce qui a changé**.
        expiresAt: { type: string, format: date-time }

    Order:
      type: object
      required: [id, reference, kind, state, placedAt]
      properties:
        id: { type: string, format: uuid }
        reference:
          type: string
          description: Référence **lisible**, celle que le support lit au téléphone.
          examples: ['ATH-2026-00042']
        kind: { type: string, x-arthome-vocabulary: [seat, merch, subscription] }
        channelId: { type: string, format: uuid }
        state: { type: string, x-arthome-vocabulary: [pending, awaiting_action, processing, paid, failed, refunded, partially_refunded, disputed] }
        total: { $ref: '#/components/schemas/Money' }
        placedAt: { type: string, format: date-time }
        invoiceAvailable: { type: boolean }
        buyerTaxLocation:
          allOf: [{ $ref: '#/components/schemas/BuyerTaxLocation' }]
          description: |
            **Résolue et figée à l'instant de la vente.** Elle n'est pas relue plus tard : le pays
            d'un spectateur change entre deux lectures, et une facture se conserve dix ans.

    ExternalOrderRef:
      type: object
      required: [externalRef, externalHost, syncedAt]
      description: |
        Une commande passée sur la boutique propre de l'artiste est un **reflet en lecture
        seule** : ni facture, ni suivi, ni remboursement chez nous, et le contrat l'assume
        explicitement plutôt que de servir des champs vides. **Ce qu'on garantit** : la fraîcheur
        au moment de `syncedAt`, rien de plus. Quand l'hôte ne répond pas, le reflet est servi
        **avec son âge**, pas en erreur.
      properties:
        externalRef: { type: string }
        externalHost: { type: string }
        state:
          type: string
          const: external
          description: Vocabulaire **opaque** — nous ne connaissons pas les états de la boutique d'en face.
        syncedAt: { type: string, format: date-time }
        syncSource: { type: string }

    Plan:
      type: object
      required: [tier, price, opens, seatDiscountBps]
      properties:
        tier:
          type: string
          x-arthome-vocabulary: [free, pass, premium]
          description: |
            Le vocabulaire qui fait autorité. `monthly`, `season` et `none` sont **retirés** :
            aucune donnée ne les référence, et quatre vocabulaires disjoints faisaient retomber
            **tous** les comptes sur `free` — un défaut d'**autorisation**, pas d'affichage (E1).
        price: { $ref: '#/components/schemas/Money' }
        opens:
          type: array
          items:
            type: string
            description: |
              **Orthographe kebab, celle de la source qui fait autorité.** Le contrat portait
              `free_dates`, `no_ads`, `one_live_month`, `all_lives`, `multi_screen` en snake, là où
              `shared/catalogue.json` — déclaré faisant autorité sur le vocabulaire — porte
              `free-dates`, `no-ads`, `one-live-month`, `all-lives`, `multi-screen`.

              **Ce n'était pas cosmétique** : c'est le vocabulaire dont dépend `decideWatch`. Un
              `opens.includes('multi-screen')` sur une charge utile qui porte `multi_screen` rend
              `false` **en silence**, et tout le monde retombe à un écran — exactement la forme du
              défaut d'autorisation que le contrat avait corrigé sur les **formules** et
              réintroduit sur les **ouvertures**.
            x-arthome-vocabulary:
              [browse, trailers, free-dates, replays, no-ads, one-live-month, all-lives,
               multi-screen, archive]
        seatDiscountBps: { type: integer, examples: [2000] }
        concurrentStreamsAllowed:
          type: integer
          description: '`multi_screen` est une **contrainte d''exécution**, pas une ligne de marketing : `ticketing` publie le plafond, `streaming` le fait respecter.'

    Subscription:
      type: object
      required: [planTier, state, currentPeriodEnd]
      properties:
        planTier: { type: string, x-arthome-vocabulary: [free, pass, premium] }
        state: { type: string, x-arthome-vocabulary: [active, past_due, cancelled, trialing] }
        startedAt: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        paymentMethodRef: { type: [string, 'null'] }

    # ---------------------------------------------------------------- lecture

    PlaybackTicket:
      type: object
      required:
        [sessionId, dateId, scope, protocol, manifestUrl, signature, expiresAt, renewAfterSec,
         leaseExpiresAt, qualityCap, chatMode, edgeRenewalMode]
      description: |
        **Tout l'écran `player` dans une seule réponse** : chapitres, pistes, régime de tchat,
        incident en cours, point de reprise, bord du direct, DRM et plafond de qualité. Aucun
        panneau du lecteur ne doit déclencher un appel — sur TV une modale *est* une page, et le
        budget est d'un aller-retour.

        **Budget : ≤ 1 s**, dans un budget total d'environ 10 s jusqu'à la première image.

        **Jamais mis en cache** — `Cache-Control: no-store`. Un droit relu depuis le disque est
        un droit faux.
      properties:
        sessionId:
          type: string
          format: uuid
          description: |
            **Récupérable après une mise à mort par le système.** Le jeton étant `no-store`, un
            client tué par l'OS n'a plus ce `sessionId` : il ne pourrait ni renouveler, ni
            libérer, ni désigner sa propre session dans la liste du refus. Rouvrir avec le **même
            `deviceId`** rend la même session — c'est le mécanisme, et il est déclaré.
        resumedExistingSession:
          type: boolean
          description: |
            Vrai quand cette ouverture a **repris le bail existant** de cet appareil au lieu d'en
            ouvrir un second. C'est ce qui empêche un foyer d'être bloqué par ses propres écrans
            fantômes — et c'est décisif pour un abonné `pass`, dont le plafond est de **un** écran :
            sans reprise, rouvrir l'application après une mise à mort le verrouille hors de son
            propre téléphone pendant les quatre-vingt-dix secondes du bail.
        dateId: { type: string, format: uuid }
        scope:
          type: string
          x-arthome-vocabulary: [full, preview]
          description: |
            `preview` pour un non-détenteur. Son jeton expire à
            `min(now + 120 s, now + secondsLeft)` : **recharger la page ne prolonge rien**, et une
            application réinstallée ne remet aucun compteur à zéro — le budget est **serveur**,
            par **compte**.
        previewSecondsLeft: { type: [integer, 'null'] }
        protocol: { type: string, x-arthome-vocabulary: [hls, dash] }
        drmSystem:
          type: [string, 'null']
          description: |
            **Choisi par le serveur pour cet appareil.** Le parc impose HLS + FairPlay sur tvOS et
            DASH + Widevine ailleurs, PlayReady sur certaines références : **un client qui devine
            se trompe**, et il se trompe sur les appareils qu'on ne peut pas tester.
          x-arthome-vocabulary: [fairplay, widevine, playready]
        qualityCap:
          type: string
          description: |
            Le plafond que le niveau de sécurité **matériel** de l'appareil autorise. Une clé HDMI
            d'entrée de gamme n'offre que du Widevine logiciel : le serveur **dégrade proprement**
            plutôt que de refuser, et la surface **sait** qu'elle a été plafonnée — pour ne pas
            proposer « 4K » dans son panneau de qualité.
          x-arthome-vocabulary: [sd, hd, fhd, uhd]
        manifestUrl:
          type: string
          format: uri
          description: |
            **Le chemin est stable et ne porte jamais le jeton.** Un jeton dans le chemin
            forcerait un rechargement de manifeste à chaque renouvellement, donc un micro-gel
            toutes les N minutes — visible sur un plan fixe de théâtre. Les chemins de flux sont
            aléatoires et non prédictibles.
        signature:
          type: object
          description: 'La signature porte sur un **préfixe de chemin** : signer le manifeste et laisser les segments ouverts, c''est ne rien signer.'
          properties:
            queryToken: { type: [string, 'null'] }
            cookieSet: { type: [boolean, 'null'] }
        edgeRenewalMode:
          type: string
          description: |
            **Déclaré, jamais deviné** : les deux mécanismes ne sont pas également disponibles.
            `signed_cookie` pour un navigateur — un appel même-origine repose le cookie, zéro
            changement d'URL, zéro interruption. `query_token` pour les lecteurs natifs, qui
            ré-apposent le jeton courant par leur filtre de requêtes. `AVPlayer` sur tvOS ne
            partage pas les cookies du WebView : c'est `AVAssetResourceLoaderDelegate`, et c'est
            **le point à valider sur un appareil réel avant de promettre quoi que ce soit**.
          x-arthome-vocabulary: [signed_cookie, query_token]
        expiresAt:
          type: string
          format: date-time
          description: |
            **120 s.** La fenêtre pendant laquelle on regarde un flux auquel on n'a plus droit est
            l'intervalle de **renouvellement**, pas la durée du jeton.
        renewAfterSec:
          type: integer
          description: '**45 s**, sous le plafond de 60 s exigé par la TV : c''est le renouvellement qui porte la limite d''écrans simultanés.'
          examples: [45]
        leaseExpiresAt:
          type: string
          format: date-time
          description: |
            **90 s.** C'est le **bail** qui porte la limite d'écrans simultanés, pas une commande
            de libération : un téléviseur se débranche, une box se coupe, le système tue une
            application mobile sans préavis. `releasePlayback` accélère, **rien n'en dépend**.
        resumePoint:
          type: [object, 'null']
          properties:
            positionSec: { type: integer }
            writtenAt: { type: string, format: date-time }
        liveEdgeSec: { type: [integer, 'null'] }
        chapters: { type: array, items: { $ref: '#/components/schemas/Chapter' } }
        audioTracks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              language: { type: string }
              kind: { type: string, x-arthome-vocabulary: [main, audio_description] }
        subtitleTracks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              language: { type: string }
              kind: { type: string, x-arthome-vocabulary: [subtitles, captions, surtitles] }
        chatMode: { type: string, x-arthome-vocabulary: [open, emoji, read_only, off] }
        chatRateLimitPerSecond: { type: integer }
        incident: { $ref: '#/components/schemas/Incident' }
        date: { $ref: '#/components/schemas/DateCard' }

    PlaybackRenewal:
      type: object
      required: [expiresAt, renewAfterSec, leaseExpiresAt]
      description: |
        Renouvellement **partiel** : rien qui forcerait un rechargement de flux. Le refus porte
        l'un des quatre codes distincts — un code générique en produirait un faux trois fois sur
        quatre.
      properties:
        expiresAt: { type: string, format: date-time }
        renewAfterSec: { type: integer }
        leaseExpiresAt: { type: string, format: date-time }
        signature:
          type: object
          properties:
            queryToken: { type: [string, 'null'] }
            cookieSet: { type: [boolean, 'null'] }
        qualityCap: { type: string, x-arthome-vocabulary: [sd, hd, fhd, uhd] }

    ActivePlaybackSession:
      type: object
      required: [sessionId, deviceLabel, openedAt]
      description: |
        Servie **avec** le refus `CONCURRENT_LIMIT_REACHED`, pour que la surface propose d'en
        libérer une. Un refus nu laisserait le spectateur sans issue.
      properties:
        sessionId: { type: string, format: uuid }
        deviceId:
          type: string
          format: uuid
          description: |
            **Servi, parce que sans lui la liste n'est pas actionnable.** La surface doit pouvoir
            reconnaître **sa propre** session pour proposer « reprendre ici » plutôt que « libérer
            un autre écran », et un libellé d'appareil ne suffit pas : deux téléphones du même
            modèle portent le même.
        isCurrentDevice: { type: boolean }
        deviceLabel: { type: string, examples: ['Téléviseur du salon'] }
        city: { type: [string, 'null'] }
        openedAt: { type: string, format: date-time }

    Incident:
      type: [object, 'null']
      description: |
        **Un voile client, jamais une bascule de flux** : le plan de contrôle publie l'état, le
        lecteur l'affiche par-dessus une vidéo intacte. Instantané, identique sur les trois
        storefronts, et le média reste intact pour la reprise. Latence **≤ 2 s, non négociable**.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, x-arthome-vocabulary: [hold_screen, postponed, cancelled, interrupted] }
        message:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: |
            Écrit par la régie : c'est du **contenu**, pas une clé i18n, et il voyage avec sa
            langue de rédaction comme un synopsis. L'une des deux seules exceptions assumées à
            « i18n par codes ».
        raisedAt: { type: string, format: date-time }

    ChatMessage:
      type: object
      required: [id, dateId, seq, authorHandle, atMediaSec, sentAt, badge, body]
      properties:
        id: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        seq:
          type: integer
          format: int64
          description: Monotone par date. **Le point de reprise** du flux temps réel.
        authorHandle: { type: string, examples: ['@marie.j'] }
        authorRoleCode: { type: [string, 'null'], description: Présent pour un message d'équipe — ceux-ci passent toujours le plafond de débit. }
        atMediaSec:
          type: integer
          description: |
            **La position dans le média**, pas l'heure d'envoi. Sans elle, le tchat rejoué sur une
            rediffusion est décalé de tout ce que le spectateur a mis à lancer la lecture.
        sentAt:
          type: string
          format: date-time
          description: L'instant absolu, **en plus**. Les deux sont portés, jamais l'un seul.
        badge:
          type: string
          description: |
            La pastille unique, **dérivée** par `moderationBadgeOf` et **servie**, jamais
            recomposée. Préséance : banni > réduit au silence > retiré > publié. Trois axes
            séparés côté modèle — état du message, nature de la ligne de file, sanction sur la
            personne — jamais empilés.
          x-arthome-vocabulary: [published, removed, muted, banned]
        body: { $ref: '#/components/schemas/LocalizedText' }

    ReactionQuota:
      type: object
      required: [remaining, rechargesAt]
      description: |
        **Renvoyé avec la réponse.** La surface doit **désactiver** le contrôle plutôt que le
        laisser échouer : une action inerte est proscrite par le dossier, mais une action qui
        échoue en silence est pire. Une seule réaction en vol à la fois.
      properties:
        remaining: { type: integer }
        rechargesAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- appairage

    DevicePairing:
      type: object
      required: [pairingId, intent, userCode, verificationUri, verificationUriComplete, expiresAt, pollIntervalSec, state]
      description: |
        **Une primitive, cinq intentions.** Quatre des cinq ne sont pas des flux d'autorisation
        OAuth : acheter une place depuis un téléviseur déjà connecté n'est pas une demande de
        jeton, c'est un **rendez-vous de transaction**. Ce qui est unique, c'est l'automate ; ce
        qui diffère, c'est l'effet de l'approbation.
      properties:
        pairingId:
          type: string
          format: uuid
          description: |
            **Persisté par la surface**, pour se rattacher après un redémarrage plutôt que
            d'ouvrir un second appairage. Sans cela, un téléviseur redémarré pendant le paiement
            affiche l'accueil pendant que le paiement aboutit dans le vide.
        intent: { type: string, x-arthome-vocabulary: [signin, seat, plan, payment_method, merch] }
        userCode:
          type: string
          description: |
            Six caractères sur l'alphabet `ACDEFHJKLMNPQRTUVWXY23456789` (28 symboles,
            **28,8 bits**) déclaré par `adr-auth.md` §5.1 — `B`, `S`, `Z` et `G` en sont retirés
            parce qu'un code de téléviseur se lit souvent à voix haute à quelqu'un d'autre dans la
            pièce. Insensible à la casse, espaces et ponctuation de lisibilité ignorés.
          examples: ['K7M2PQ']
        verificationUri: { type: string, format: uri }
        verificationUriComplete:
          type: string
          format: uri
          description: '**Servie**, jamais fabriquée par la surface. C''est elle que la TV encode dans le QR.'
        expiresAt:
          type: string
          format: date-time
          description: |
            **Par intention, et servie** : `signin` 15 min (chercher son téléphone, faire une
            2FA) ; `seat` et `merch` **5 min** — au-delà, la jauge affichée n'est plus vraie ;
            `plan` et `payment_method` 10 min. Jamais codée sur la surface. **L'écran d'attente
            n'affiche pas de compte à rebours** : la TV s'en sert pour renoncer, pas pour
            inquiéter.
        pollIntervalSec:
          type: integer
          description: |
            **Décroissance servie par le serveur**, donc modérable : **2 s pendant les 60
            premières secondes**, puis 5 s. Trente requêtes au plus par appairage, et l'exigence
            « bascule en deux secondes au plus » est tenue **sans** faire entrer une identité
            d'appareil dans l'espace de noms WebSocket.
          examples: [2]
        state:
          type: string
          description: |
            **`engaged` est l'état qui protège l'argent.** Il est posé dès que le téléphone entre
            dans le parcours de paiement, et **avant** que `ticketing` exécute. À partir de là
            l'appairage n'est plus annulable : sans cet état, un appui sur Retour — la touche la
            plus sollicitée d'une télécommande — annule un appairage dont le paiement est déjà en
            vol, et la place est encaissée sans qu'aucun des deux écrans ne le dise.
          x-arthome-vocabulary: [pending, engaged, approved, denied, expired, cancelled, approved_with_failure]

    PairingOutcome:
      type: object
      required: [pairingId, intent, state, pollIntervalSec]
      description: |
        **L'écran `confirm` coûte zéro appel.** Tout vient d'ici, composé par le BFF à partir du
        pointeur opaque que `identity` a posé : une confirmation qui charge est une confirmation
        qu'on ne croit pas.

        **Cinq issues, cinq codes.** `approved_with_failure` dit « le téléphone a terminé, l'achat
        a échoué » — complet entre-temps, paiement refusé. Un code unique produirait un message
        faux quatre fois sur cinq, et la TV ne doit **jamais** afficher « réservée » dans ce cas.
      properties:
        pairingId: { type: string, format: uuid }
        intent: { type: string, x-arthome-vocabulary: [signin, seat, plan, payment_method, merch] }
        state:
          type: string
          description: |
            **`engaged` est l'état qui protège l'argent.** Il est posé dès que le téléphone entre
            dans le parcours de paiement, et **avant** que `ticketing` exécute. À partir de là
            l'appairage n'est plus annulable : sans cet état, un appui sur Retour — la touche la
            plus sollicitée d'une télécommande — annule un appairage dont le paiement est déjà en
            vol, et la place est encaissée sans qu'aucun des deux écrans ne le dise.
          x-arthome-vocabulary: [pending, engaged, approved, denied, expired, cancelled, approved_with_failure]
        pollIntervalSec: { type: integer }
        failureCode: { type: [string, 'null'], x-arthome-vocabulary: [SOLD_OUT, PAYMENT_DECLINED, PRICE_STALE, PLAN_UNAVAILABLE] }
        ticket: { $ref: '#/components/schemas/TicketCard' }
        order: { $ref: '#/components/schemas/Order' }
        subscription: { $ref: '#/components/schemas/Subscription' }
        viewerContext:
          allOf: [{ $ref: '#/components/schemas/ViewerContext' }]
          description: Présent pour `signin` approuvé — la TV n'a pas à réamorcer.

    AccountDeepLink:
      type: object
      required: [url]
      description: |
        **Ce qui n'est pas un appairage.** Le QR de la page compte renvoie vers la gestion du
        compte sur téléphone : rien n'attend, l'écran ne bascule pas, aucune ligne d'appairage
        n'est ouverte. Deux formes distinctes au contrat, sinon on implémentera une attente là où
        il n'y en a pas.
      properties:
        url: { type: string, format: uri }

    # ---------------------------------------------------------------- compte

    SavedSearch:
      type: object
      required: [id, scope, criteria, criteriaVersion, criteriaSignature, channels, active, newMatchesSinceLastVisit]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, x-arthome-vocabulary: [search, category] }
        categoryId: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        queryText: { type: [string, 'null'] }
        criteria:
          type: object
          additionalProperties: true
          description: |
            **Les valeurs de filtre sont des identifiants stables**, jamais des indices de
            tableau. La maquette filtre sur une position (`fCats: [1]`) ; une position ne survit
            ni à une URL partageable, ni à une recherche enregistrée, ni à l'insertion d'une
            discipline.
        criteriaVersion:
          type: integer
          description: |
            Quand la grammaire des filtres change, une recherche d'hier **s'exécute encore** si la
            migration est possible ; sinon elle se marque `stale` **et le dit**. Elle ne disparaît
            jamais en silence.
        criteriaSignature:
          type: string
          description: Produite par `normalizeSearchCriteria()` dans `@arthome/core`, une seule fois, **jamais côté client**. C'est elle qui répond « déjà enregistrée » et qui déduplique à l'écriture.
        stale: { type: boolean }
        channels:
          type: array
          items: { type: string, x-arthome-vocabulary: [push, email, in_app] }
        active: { type: boolean }
        newMatchesSinceLastVisit:
          type: integer
          description: |
            **« Nouvelles depuis votre dernière visite »**, incrémenté par le *percolator* de
            l'index et remis à zéro à la lecture. Dix recherches font alors **zéro** requête de
            comptage à l'ouverture de la page ; les deux autres options en coûtent dix.

    NotificationEntry:
      type: object
      required: [id, triggerCode, params, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        triggerCode: { type: string, examples: [date_starts_soon] }
        params: { type: object, additionalProperties: true }
        deepLink: { type: [string, 'null'], format: uri }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }

    NotificationPreferences:
      type: object
      description: Cinq déclencheurs × trois canaux, plus les heures calmes.
      properties:
        triggers:
          type: object
          additionalProperties:
            type: array
            items: { type: string, x-arthome-vocabulary: [push, email, in_app] }
        quietHours:
          type: object
          description: |
            23 h → 9 h par défaut, **avec l'exception conditionnée à la détention d'une place** —
            c'est une **règle métier**, pas un réglage d'interface : on ne rate pas un spectacle
            qu'on a payé parce qu'il commence à 23 h 15.
          properties:
            enabled: { type: boolean }
            fromHour: { type: integer, minimum: 0, maximum: 23 }
            toHour: { type: integer, minimum: 0, maximum: 23 }
            bypassWhenTicketHeld: { type: boolean }

    Consents:
      type: object
      description: |
        Quatre finalités et deux catégories de traceurs. **Horodatés par le serveur et versionnés
        avec la version du texte accepté** : un consentement sans version ni date ne vaut rien.
        `ads` est à `false` par défaut, et **ce défaut est une décision du contrat**, pas un
        réglage.
      properties:
        purposes:
          type: object
          properties:
            audience: { type: boolean }
            perso: { type: boolean }
            partners: { type: boolean }
            ads: { type: boolean, default: false }
        cookieCategories:
          type: object
          additionalProperties: { type: boolean }
        textVersion: { type: integer }
        recordedAt: { type: string, format: date-time }

    Device:
      type: object
      required: [id, kind, label, lastSeenAt, isCurrent]
      description: |
        L'appareil **enregistré**, durable, révocable, identifié **avant toute session**.
        Distinct de `DeviceSession`, qui est le couple (appareil, profil) : un téléviseur de
        salon porte jusqu'à cinq sessions sur un seul appareil.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, x-arthome-vocabulary: [tv, mobile, tablet, desktop, stick, console, box] }
        label: { type: string }
        city: { type: [string, 'null'] }
        lastSeenAt: { type: string, format: date-time }
        isCurrent: { type: boolean }
        sessions:
          type: array
          items:
            type: object
            required: [sessionId, profileId]
            properties:
              sessionId: { type: string, format: uuid }
              profileId: { type: string, format: uuid }
              profileName: { type: string }

    AccountScreen:
      type: object
      description: |
        **Un** agrégat pour les onze sections du compte. Elles ne justifient ni onze appels ni
        onze schémas : huit sont des projections de celui-ci, et seules `alerts`, `orders` et
        `privacy` introduisent des formes que rien d'autre ne porte — elles sont paginées à part.
      properties:
        profile:
          type: object
          properties:
            publicHandle: { type: string }
            displayName: { type: string }
            email: { type: string, format: email }
            emailVerified: { type: boolean }
            phone: { type: [string, 'null'] }
            phoneVerified: { type: boolean }
            memberNumber: { type: string }
            city: { type: [string, 'null'] }
        subscription: { $ref: '#/components/schemas/Subscription' }
        credits:
          type: array
          description: |
            L'avoir de compte — une **monnaie interne**, donc un passif. Émis pour une issue
            `interrupted`, **redéployable sur la chaîne émettrice seulement** (D-017), 12 mois.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              channelId: { type: string, format: uuid }
              amount: { $ref: '#/components/schemas/Money' }
              originCode: { type: string, x-arthome-vocabulary: [interrupted_date, goodwill] }
              expiresAt: { type: string, format: date-time }
        paymentMethods:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              brandCode: { type: string }
              last4: { type: string }
              expiryMonth: { type: integer }
              expiryYear: { type: integer }
        security:
          type: object
          properties:
            twoFactorEnabled: { type: boolean }
            passkeyCount: { type: integer }
            hasPassword: { type: boolean }
        devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
        preferences: { $ref: '#/components/schemas/ViewerPreferences' }
        notificationPreferences: { $ref: '#/components/schemas/NotificationPreferences' }
        consents: { $ref: '#/components/schemas/Consents' }
        deletion:
          type: [object, 'null']
          description: |
            La suppression de compte est une commande **financière** autant que personnelle : elle
            annule les places non utilisées, donc elle rembourse, donc elle touche des versements
            peut-être déjà calculés, et elle se heurte à la conservation comptable de dix ans.
            Elle est **asynchrone**, avec **30 jours de grâce** — réactivable sur simple connexion
            jusque-là — et elle **anonymise** au lieu de supprimer.
          properties:
            state: { type: string, x-arthome-vocabulary: [requested, anonymised] }
            requestedAt: { type: string, format: date-time }
            graceUntil: { type: string, format: date-time }

    ExportRequest:
      type: object
      required: [exportId, kind, state, requestedAt]
      description: |
        **Un FEC ou un export RGPD n'est pas une réponse HTTP.** La commande rend un accusé et un
        identifiant ; l'état est interrogeable ; le document arrive par une **adresse signée de
        courte durée** — utilisable **sans cookie de session**, parce qu'un export protégé par
        cookie est intéléchargeable depuis une coquille native.
      properties:
        exportId: { type: string, format: uuid }
        kind: { type: string, x-arthome-vocabulary: [personal_data, invoices] }
        state: { type: string, x-arthome-vocabulary: [queued, running, ready, failed, expired] }
        requestedAt: { type: string, format: date-time }
        downloadUrl: { type: [string, 'null'], format: uri }
        downloadExpiresAt: { type: [string, 'null'], format: date-time }
