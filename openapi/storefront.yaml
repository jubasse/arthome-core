  /v1/search:
    get:
      operationId: search
      tags: [discovery]
      summary: Full-text search, facets counted on the current query, grouping by show.
      description: |
        **The paginated unit is the show** for `best`, `lives` and `replays`; the `artists` tab
        paginates artists. The "soon" sort is that of the **representative date**, and the "this
        weekend" filter applies **before** grouping.

        Facet counts are computed on the current query and returned **in the same response**: no
        second call. The total count is **approximate and bounded** — exact up to the threshold served
        as `DomainConstants.searchExactTotalLimit`, a lower bound beyond it, and `totalIsLowerBound`
        says which of the two it is.

        **Budget ≤ 200 ms**: a television's on-screen keyboard produces one character per press and
        the results live as you type; beyond that, the visual feedback of typing comes adrift. The
        request is **cancellable** — the client closes the socket, the server gives up.

        **Public read.** Called **with no authentication at all**, this operation returns the
        **public body** — identical for every anonymous caller, hence shareable in a common
        cache. The three per-viewer overlays (`watchVerdict`, `viewerRelations`,
        `viewerProgress`) are then **absent**, never null. Called with a session or a bearer
        token, it returns the public body **plus** the overlays, and becomes private.
