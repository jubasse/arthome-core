  /v1/replays:
    get:
      operationId: listReplays
      summary: Replays online, the ones expiring first — a discovery page, public.
      description: |
        **This is a discovery page, not "My replays".** The distinction is not cosmetic: "Replays"
        is a permanent entry in a television's sidebar, exactly like "Live" or "Categories", and it
        is not prefixed "My" — unlike "My seats" and "My list", which are. Its content is the
        catalogue of replays **on sale or included**, including ones never watched: that is the
        whole point of it.

        Three reasons the existing paths were no substitute: `/v1/me/replays` returns what one
        **holds** and answers `401` to a visitor — yet on a television the sidebar is always there,
        and hiding an entry based on the session makes the menu change size under the focus, which
        breaks focus memory; `/v1/search?tab=replays` requires `q` of at least two characters, so
        it has no empty search; and its paginated unit is the **show**, whereas a replay window
        expires **per date** — grouping by show makes the "expiring first" sort inexpressible.

        **Public read**, like the nine other catalogue operations.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - catalog
      - ticketing
      - streaming
      x-arthome-freshness: 60
      tags:
      - discovery
      security:
