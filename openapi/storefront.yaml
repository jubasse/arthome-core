  /v1/resolve:
    get:
      operationId: resolvePublicLink
      summary: Resolves a canonical URL or a slug to the resource it designates.
      description: |
        **`slug` and `canonicalUrl` were served everywhere and accepted nowhere.** Path identifiers
        are UUIDs; all five occurrences of `slug` were on output. A notification pushed to a dead
        application, a shared link, a bookmark, a search engine result: all of them deliver a
        **URL**, and nothing in the contract knew how to read one.

        The gap went beyond mobile: `canonicalUrl` is what the television encodes in the QR code of
        the **Share** action — on a television, sharing cannot mean copying a link, there is neither
        a useful clipboard nor a messaging app.

        **Resolves, does not redirect.** The response names the type and the identifier, and the
        surface decides where to go: a mobile deep link, a Next route and a television page do not
        have the same destination for the same resource.

