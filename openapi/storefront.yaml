                  profile: { publicHandle: '@marie.j', displayName: Marie J., email: marie@example.org, emailVerified: true, phoneVerified: false, memberNumber: A-004212 }
                  subscription: { planTier: pass, state: active, currentPeriodEnd: '2026-10-21T00:00:00Z', cancelAtPeriodEnd: false }
