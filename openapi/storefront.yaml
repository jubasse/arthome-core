                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:01:40.000Z'
                validUntil: '2026-09-21T18:02:40.000Z'
                data:
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  armed: true
                  state: admitted
                  pollIntervalSec: 5
                  admission:
                    token: adm_v1.eyJkIjoiMDE5OTI4YTAiLCJhIjoiMDE5OTI4ZjQifQ.3kQx
                    expiresAt: '2026-09-21T18:02:40.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/orders/seats:
    post:
      operationId: purchaseSeat
      summary: Buys one or more seats.
      description: |
        **A double click never creates two seats**: `Idempotency-Key` is mandatory, generated by the
        surface **before sending and persisted before sending**. A replayed key returns the first
        attempt's response, never an error — that is the difference between safe resumption and a
        lost seat.

        **The expected price is sent and verified.** The refusal carries `order.price_stale`, **distinct**
        from a payment failure, with the current price as a parameter: with five promotion reasons,
        one of them computed pro rata to elapsed time, the gap between the displayed price and the
        valid price is **structural**, not accidental.

        **The command returns the projected state, not an acknowledgement**: the seat **and** the
        updated date, so the surface repaints in a single round trip.

        **While the date's sales queue is armed, the purchase carries its admission** (D-081,
        provisional), and without a valid one it is refused with `403`
        `order.sales_queue_admission_required`. A `403` because the admission is a time-boxed right
        that `ticketing` checks itself, like the others of that status; not a `409`, since nothing in
        the date conflicts with the request, and not a `429`, whose `unavailable` invites a retry that
        cannot succeed without an admission and would land on the date at its busiest.

        **The admission travels in a header, `X-Arthome-Admission-Token`, never in the body.** The
        idempotency fingerprint covers the body (`transport.md` §5.4), so a token there would turn the
        replay of a completed purchase, sent after the admission lapsed, into
        `api.idempotency_key_reused` instead of the original response. And it is a credential bound to
        an account and a date, which travels beside `X-Arthome-Device-Token`, not inside the order. A
        replayed key answers its original response without asking for an admission again.

        **Once the live has started, the purchase carries the buyer's acknowledgement** (D-089), in
        `X-Arthome-Late-Entry-Acknowledged: true`, once the surface has said what
        `SeatQuote.lateEntry` says. Without it the purchase is refused with `409`
        `order.late_entry_unacknowledged`, `startedAt`, `minutesElapsed` and `salesEndAt` in its
        params, before any seat is held. Seats sell until thirty minutes after the start; past it,
        `409` `order.sales_closed` with `salesEndAt`, never `order.sold_out`, which is the waiting
        list's cue.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - ticketing
      x-arthome-invalidates:
      - account:tickets
      - date:{dateId}:availability
      tags:
      - commerce
      security:
      - sessionCookie: []
        csrfToken: []
      - bearerToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/AdmissionToken'
      - $ref: '#/components/parameters/LateEntryAcknowledged'
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dateId:
                  type: string
                  format: uuid
                tier:
                  type: string
                  enum:
                  - full
                  - reduced
                  - support
                  x-arthome-vocabulary-source: PRICE_TIERS
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
                expectedTotal:
                  x-arthome-tax-basis: inclusive
                  $ref: '#/components/schemas/Money'
                contributionMinor:
                  anyOf:
                  - type: integer
                  - type: 'null'
                applyCreditId:
                  anyOf:
                  - type: string
                    format: uuid
                  - type: 'null'
                profileId:
                  anyOf:
                  - type: string
                    format: uuid
                  - type: 'null'
                declaredTaxLocation:
                  anyOf:
                  - type: object
                    properties:
                      country:
                        type: string
                        pattern: ^[A-Z]{2}$
                      subdivision:
                        type:
                        - string
                        - 'null'
                      postalCode:
                        type:
                        - string
                        - 'null'
                  - type: 'null'
                  description: |
                    Location **declared by the buyer**, when the surface asks for it. It enters the register as
                    one piece of evidence among the others (`declared_by_buyer`) — **it does not replace them**:
                    the server arbitrates, and two pieces of evidence that contradict each other produce
                    `evidenceConflicting`, never a refused purchase.
              required:
              - dateId
              - tier
              - quantity
              - expectedTotal
            example:
              dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
              tier: full
              quantity: 2
              expectedTotal:
                amountMinor: 4620
                currencyCode: EUR
      responses:
        '201':
          description: Seats created, and the updated date.
          headers:
            X-Arthome-Served-At:
              $ref: '#/components/headers/ServedAt'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        tickets:
                          type: array
                          items:
                            $ref: '#/components/schemas/TicketCard'
                        date:
                          $ref: '#/components/schemas/DateCard'
                        order:
                          $ref: '#/components/schemas/Order'
                      required:
                      - tickets
                      - date
                      - order
                      additionalProperties: {}
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:41:30.000Z'
                data:
                  tickets:
                  - seatId: 019928f5-0000-7000-8000-000000000001
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    orderId: 019928f5-0000-7000-8000-0000000000aa
                    seatCode: ATH-7QK2-4M
