        # **Public read.** A complete absence of authentication is a NOMINAL case, not an
        # error: this read is the indexable face of the product, and a search engine's crawler
        # has neither cookie, nor bearer token, nor any way of minting one. Guest mode takes
        # the same path. See "Public read and identified read" at the top of the document.
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      x-arthome-freshness: 60
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: q
          in: query
          schema: { type: string, minLength: 2 }
        - name: tab
          in: query
          schema: { type: string, enum: [best, lives, replays, artists], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A sort or filter key. It is a property of THIS endpoint's list — which orders it offers — not of the domain, and adding one is an endpoint change rather than a vocabulary change.", default: best }
        - name: sort
          in: query
          description: '**Five sorts**, not four: `price_desc` exists in the design, exactly like the other four.'
          schema: { type: string, enum: [relevance, soon, popularity, price_asc, price_desc], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A sort or filter key. It is a property of THIS endpoint's list — which orders it offers — not of the domain, and adding one is an endpoint change rather than a vocabulary change.", default: relevance }
        - name: filters
          in: query
          description: |
            Criteria, in the grammar **published** opposite. This parameter used to be a free string: on
            the most important parameter of the most used screen, that meant zod validated nothing and
            three surfaces would serialise it three ways — when a normalised shape **already exists**,
            since `normalizeSearchCriteria()` produces its signature in `@arthome/core`. That is the
            shape published here, and it is the same one as `SavedSearch.criteria`.
          schema: { $ref: '#/components/schemas/SearchCriteria' }
      responses:
        '200':
          description: Results, facets and structured filters.
