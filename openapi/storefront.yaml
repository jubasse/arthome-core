  /v1/search:
    get:
      operationId: search
      tags: [discovery]
      summary: Recherche plein texte, facettes comptées sur la requête courante, regroupement par spectacle.
      description: |
        **L'unité paginée est le spectacle** pour `best`, `lives` et `replays` ; l'onglet
        `artists` pagine des artistes. Le tri « bientôt » est celui de la **date
        représentative**, et le filtre « ce week-end » s'applique **avant** le regroupement.

        Les effectifs de facettes sont calculés sur la requête courante et rendus **dans la même
        réponse** : pas de second appel. L'effectif total est **approximatif et borné** — exact
        jusqu'à 10 000, « au moins 10 000 » au-delà, et `totalIsLowerBound` le dit.

        **Budget ≤ 200 ms** : le clavier à l'écran d'un téléviseur produit un caractère par
        pression et les résultats vivent en direct ; au-delà, le retour visuel de la frappe
        décroche. La requête est **annulable** — le client ferme la socket, le serveur abandonne.

        **Lecture publique.** Appelée **sans aucune authentification**, cette opération rend le
        **corps public** — identique pour tous les appelants anonymes, donc mutualisable dans un
        cache partagé. Les trois surcouches par spectateur (`watchVerdict`, `viewerRelations`,
        `viewerProgress`) sont alors **absentes**, jamais nulles. Appelée avec une session ou un
        jeton porteur, elle rend le corps public **plus** les surcouches, et devient privée.
      x-arthome-maturity: stable
