          type: string
          format: uri
      - name: kind
        in: query
        schema:
          type: string
          enum:
          - date
          - show
          - artist
          - category
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: A screen composition the server decides so that five surfaces do not each decide it differently.
      - name: slug
