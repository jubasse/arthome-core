                structuredFilters: [{ filterId: price, kind: money_range, min: 0, max: 9000 }]
                page: { hasMore: true, nextCursor: eyJjIjoiMjAyNi0wOS0yMVQyMDowMDowMFoifQ, approximateTotal: 10000, totalIsLowerBound: true }
