      summary: A date's page — series, suggestions, shop, prices, in the same response.
      description: |
        **One call**, and it must be **cheap**: the television surface prefetches it for the focused
        item once the focus has settled, and a prefetch paid for twice is worse than no prefetch at
        all. Hence a cache validator (`ETag`) and a declared freshness.

        **Public read.** Called **with no authentication at all**, this operation returns the
        **public body** — identical for every anonymous caller, hence shareable in a common
        cache. The three per-viewer overlays (`watchVerdict`, `viewerRelations`,
        `viewerProgress`) are then **absent**, never null. Called with a session or a bearer
        token, it returns the public body **plus** the overlays, and becomes private.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog, ticketing, identity, streaming]
      # `chat` is NOT called: the chat mode is already PROJECTED into `date_detail_public`
      # by `chat.date_chat_policy_changed`. It was both projected and called — one call for
      # data we already hold, and the storefront's only screen to cross the threshold of 4.
      security:
        # **Public read.** A complete absence of authentication is a NOMINAL case, not an
        # error: this read is the indexable face of the product, and a search engine's crawler
        # has neither cookie, nor bearer token, nor any way of minting one. Guest mode takes
        # the same path. See "Public read and identified read" at the top of the document.
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      x-arthome-freshness: 60
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The page.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
            Vary: { $ref: '#/components/headers/VaryAuth' }
            ETag: { schema: { type: string }, description: "Cache validator, so the TV prefetch is not paid for twice." }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/DateDetail' }
              example:
                servedAt: '2026-09-21T18:02:21.000Z'
                validUntil: '2026-09-21T18:03:21.000Z'
                data:
                  id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  showId: 019928a0-7d31-7a10-b8c4-2f9e11a4c111
                  channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                  slug: nuit-blanche-2026-09-21
                  canonicalUrl: 'https://arthome.fr/fr/d/nuit-blanche-2026-09-21'
                  title: Nuit blanche
                  startsAt: '2026-09-21T19:00:00Z'
                  venueClock: { venueTimezone: Europe/Paris, venueUtcOffsetMin: 120 }
                  runtimeMin: 95
                  displayState: live
                  displayStateValidUntil: '2026-09-21T20:35:00Z'
                  replay: { policy: included, windowHours: 72 }
                  rights: { scope: restricted, blackoutCountries: [CA], blackoutReasonCode: broadcaster }
                  media: { wide: [], poster: [] }
                  totalSeriesDates: 3
                  watchVerdict:
                    allowed: false
                    advisory: true
                    denialReasonCode: watch.no_seat
                    fallbackAction: buy_seat
                    validUntil: '2026-09-21T18:03:21.000Z'
        '304': { description: Unchanged since the `ETag` supplied. }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dates/{dateId}/availability:
    get:
      operationId: refreshDateAvailability
      tags: [commerce]
      summary: Refreshes capacity and prices before showing a total.
      description: |
        The only legitimate call from a television's booking screen: the date is already in hand,
        only the capacity moves. `validUntil` is short (60 s) because the "show already started"
        price is **pro rata to the time remaining**.

        **Public read.** Called **with no authentication at all**, this operation returns the
        **public body** — identical for every anonymous caller, hence shareable in a common
        cache. The three per-viewer overlays (`watchVerdict`, `viewerRelations`,
        `viewerProgress`) are then **absent**, never null. Called with a session or a bearer
        token, it returns the public body **plus** the overlays, and becomes private.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      security:
        # **Public read.** A complete absence of authentication is a NOMINAL case, not an
        # error: this read is the indexable face of the product, and a search engine's crawler
        # has neither cookie, nor bearer token, nor any way of minting one. Guest mode takes
        # the same path. See "Public read and identified read" at the top of the document.
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      x-arthome-freshness: 15
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Capacity and prices at the instant of serving.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
            Vary: { $ref: '#/components/headers/VaryAuth' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          seatsAvailable: { type: integer }
                          waitlistCount: { type: integer }
                          fillRateBps: { type: integer }
                          soldOut: { type: boolean }
                          priceTiers: { type: array, items: { $ref: '#/components/schemas/PriceTier' } }
                          serviceFeePerSeat:
                            $ref: '#/components/schemas/Money'
                            x-arthome-tax-basis: inclusive
              example:
                servedAt: '2026-09-21T18:40:00.000Z'
                validUntil: '2026-09-21T18:41:00.000Z'
                data:
                  seatsAvailable: 42
                  waitlistCount: 0
                  fillRateBps: 8700
                  soldOut: false
                  priceTiers: [{ tier: full, amount: { amountMinor: 2400, currencyCode: EUR }, active: true }]
                  serviceFeePerSeat: { amountMinor: 150, currencyCode: EUR }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dates/{dateId}/seat-quote:
    post:
      operationId: quoteSeat
      tags: [commerce]
      summary: The purchase summary, composed server-side.
      description: |
        **The four lines come from the contract**: tier, service fee, subscription discount,
        promotion. Discount and promotion **do not stack** — the one most favourable to the viewer
        wins, and the rule lives in `@arthome/core` (D-017). Otherwise it would be written three
        times.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-idempotency-exemption: |
        **A read disguised as a `POST`: it is a `POST` because its criteria do not fit in a URL, not
        because it writes.** A quote computes, it creates nothing — so there is no effect to
        deduplicate.

        **And a key would protect nothing here**, because freshness is already guaranteed elsewhere:
        the price carries its `validUntil`, and `expectedTotal` is **mandatory** at purchase — a
        stale price is refused by `order.price_stale` at the moment that matters, not at quoting time.

        **Worse: it would do harm.** The regime replays the original response **verbatim**, so a
        replayed quote would be a quote **already part-spent, or expired** — or a price that the
        pro-rata promotion has since made wrong. Same reason as a token renewal: what is being asked
        for is a fresh value.
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, quantity]
              properties:
                tier: { type: string, enum: [full, reduced, support], x-arthome-vocabulary-source: PRICE_TIERS }
                quantity: { type: integer, minimum: 1, maximum: 10 }
                contributionMinor:
                  type: [integer, 'null']
                  description: |
                    Free contribution to the company, for a free seat. The amount is **open**; minimum and
                    maximum are **domain rules**, not attributes of an input field, and the refusal carries
                    **`CONTRIBUTION_OUT_OF_RANGE`**, with both bounds as parameters. The code was announced and
                    never named — therefore destined to be invented three times.
                applyCreditId: { type: [string, 'null'], format: uuid }
            example: { tier: full, quantity: 2 }
      responses:
        '200':
          description: Devis.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/SeatQuote' }
              example:
                servedAt: '2026-09-21T18:41:10.000Z'
                validUntil: '2026-09-21T18:42:10.000Z'
                data:
                  lines:
                    - { kind: tier, amount: { amountMinor: 4800, currencyCode: EUR } }
                    - { kind: service_fee, amount: { amountMinor: 300, currencyCode: EUR } }
                    - { kind: subscription_discount, discountReasonCode: plan_pass, amount: { amountMinor: -480, currencyCode: EUR } }
                  total: { amountMinor: 4620, currencyCode: EUR }
                  validUntil: '2026-09-21T18:42:10.000Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # =============================================================== money commands

  /v1/orders/seats:
    post:
      operationId: purchaseSeat
      tags: [commerce]
      summary: Buys one or more seats.
      description: |
        **A double click never creates two seats**: `Idempotency-Key` is mandatory, generated by the
        surface **before sending and persisted before sending**. A replayed key returns the first
        attempt's response, never an error — that is the difference between safe resumption and a
        lost seat.

        **The expected price is sent and verified.** The refusal carries `order.price_stale`, **distinct**
        from a payment failure, with the current price as a parameter: with five promotion reasons,
        one of them computed pro rata to elapsed time, the gap between the displayed price and the
        valid price is **structural**, not accidental.

        **The command returns the projected state, not an acknowledgement**: the seat **and** the
        updated date, so the surface repaints in a single round trip.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:tickets', 'date:{dateId}:availability']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dateId, tier, quantity, expectedTotal]
              properties:
                dateId: { type: string, format: uuid }
                tier: { type: string, enum: [full, reduced, support], x-arthome-vocabulary-source: PRICE_TIERS }
                quantity: { type: integer, minimum: 1, maximum: 10 }
                expectedTotal:
                  $ref: '#/components/schemas/Money'
                  x-arthome-tax-basis: inclusive
                contributionMinor: { type: [integer, 'null'] }
                applyCreditId: { type: [string, 'null'], format: uuid }
                profileId: { type: [string, 'null'], format: uuid }
                declaredTaxLocation:
                  type: [object, 'null']
                  description: |
                    Location **declared by the buyer**, when the surface asks for it. It enters the register as
                    one piece of evidence among the others (`declared_by_buyer`) — **it does not replace them**:
                    the server arbitrates, and two pieces of evidence that contradict each other produce
                    `evidenceConflicting`, never a refused purchase.
                  properties:
                    country: { type: string, pattern: '^[A-Z]{2}$' }
                    subdivision: { type: [string, 'null'] }
                    postalCode: { type: [string, 'null'] }
            example:
              dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
              tier: full
              quantity: 2
              expectedTotal: { amountMinor: 4620, currencyCode: EUR }
      responses:
        '201':
          description: Seats created, and the updated date.
          headers:
            X-Arthome-Served-At: { $ref: '#/components/headers/ServedAt' }
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [tickets, date, order]
                        properties:
                          tickets: { type: array, items: { $ref: '#/components/schemas/TicketCard' } }
                          date: { $ref: '#/components/schemas/DateCard' }
                          order: { $ref: '#/components/schemas/Order' }
              example:
                servedAt: '2026-09-21T18:41:30.000Z'
                data:
                  tickets:
                    - seatId: 019928f5-0000-7000-8000-000000000001
                      dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                      orderId: 019928f5-0000-7000-8000-0000000000aa
                      seatCode: ATH-7QK2-4M
                      tier: full
                      state: active
                      cancelDeadline: '2026-09-21T18:00:00Z'
                      date: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, displayState: live }
                  date: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, displayState: live }
                  order: { id: 019928f5-0000-7000-8000-0000000000aa, reference: ATH-2026-00042, kind: seat, state: paid, placedAt: '2026-09-21T18:41:30Z' }
        '202':
          description: |
            **Strong authentication required** — the order exists, the payment is not complete. The
            surface presents the payment element with the `clientSecret`, then follows the state through
            `getOrder`. It **never** concludes from the return URL.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PaymentHandoff' } }
              example:
                servedAt: '2026-09-21T18:41:30.000Z'
                data:
                  orderId: 019928f5-0000-7000-8000-0000000000aa
                  state: awaiting_action
                  paymentIntentRef: pi_3Ab2Cd
                  clientSecret: pi_3Ab2Cd_secret_9f2
                  nextAction: { kind: redirect_to_url, redirectUrl: 'https://hooks.stripe.com/3ds/authenticate' }
                  returnUrl: 'https://arthome.fr/paiement/retour?order=019928f5-0000-7000-8000-0000000000aa'
                  expiresAt: '2026-09-21T19:11:30Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      tags: [commerce]
      summary: The state of an order — **the only source of truth after a payment**.
      description: |
        **This is the operation that resumes an order left in `awaiting_action`**, and it is the one
        the surface polls on return from strong authentication. The return URL says **where to go**;
        it never says **what changed**: our state only advances on a verified webhook, never on a
        browser parameter.

        **`no-store`**: the state of a payment is not cached.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The order, and what it produced once it is `paid`.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [order]
                        properties:
                          order: { $ref: '#/components/schemas/Order' }
                          tickets: { type: array, items: { $ref: '#/components/schemas/TicketCard' } }
                          handoff:
                            $ref: '#/components/schemas/PaymentHandoff'
                            description: Present while the order is `awaiting_action` — this is what allows an abandoned authentication to be **resumed**.
              example:
                servedAt: '2026-09-21T18:43:00.000Z'
                data:
                  order: { id: 019928f5-0000-7000-8000-0000000000aa, reference: ATH-2026-00042, kind: seat, state: paid, placedAt: '2026-09-21T18:41:30Z', invoiceAvailable: true }
                  tickets: []
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/payment-methods:
    post:
      operationId: addPaymentMethod
      tags: [account]
      summary: Registers a payment method from the web.
      description: |
        **The only surface able to register a card was the one with no keyboard.** The
        `payment_method` intent existed for television pairing, and the account's Security section
        displayed "Payment methods · Manage" without any command reaching it.

        **No card number touches our domain**: the command returns a setup `clientSecret`, and the
        surface's payment element takes it from there — that is what keeps the compliance scope as
        narrow as possible.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:payment-methods']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnPath]
              properties:
                returnPath: { type: string, description: '**Relative** path inside the surface. An absolute address is refused.' }
                setAsDefault: { type: boolean, default: false }
            example: { returnPath: /compte/securite, setAsDefault: true }
      responses:
        '201':
          description: Setup opened. The surface presents the payment element.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [setupIntentRef, clientSecret, returnUrl]
                        properties:
                          setupIntentRef: { type: string }
                          clientSecret: { type: string }
                          returnUrl: { type: string, format: uri }
                          expiresAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:55:20.000Z'
                data:
                  setupIntentRef: seti_1Ab2Cd
                  clientSecret: seti_1Ab2Cd_secret_7f3
                  returnUrl: 'https://arthome.fr/compte/securite?setup=seti_1Ab2Cd'
                  expiresAt: '2026-09-21T19:25:20Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/payment-methods/{paymentMethodId}:
    delete:
      operationId: removePaymentMethod
      tags: [account]
      summary: Removes a payment method.
      description: |
        **Refused if it is the last method of an active subscription** (`PAYMENT_METHOD_IN_USE`):
        silently removing a subscription's only card would produce a failed charge and a cancelled
        plan that nobody intended.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - name: paymentMethodId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Method removed. Replayed on an already-removed method, it succeeds.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { removed: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:56:00.000Z'
                data: { removed: true }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/seats/{seatId}/cancel:
    post:
      operationId: cancelSeat
      tags: [commerce]
      summary: Cancels a seat before its deadline.
      description: |
        The deadline is **served as an instant** on the seat (`cancelDeadline`), never as the
        sentence "up to 1 h before". The refusal after the deadline carries its own code and the
        instant as a parameter.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:tickets', 'date:{dateId}:availability']
      parameters:
        - name: seatId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cancelReasonCode:
                  type: string
                  description: |
                    **One member, and that is a question rather than a vocabulary.** A field whose
                    enum has a single value carries no information: every request that reaches this
                    path says the same thing. It is here because the audit line must record *who*
                    asked — and a viewer cancelling their own seat is the only actor this path has.

                    **What would make it a vocabulary is a second actor**, and there is one in the
                    domain already: the studio cancels seats too, through `refundSeat`, with its own
                    four-member `refundReasonCode`. If those two paths ever merge, this field becomes
                    the merged reason and the single member becomes the first of several. Until then
                    it is a placeholder that is honest about being one.
                  enum: [viewer_request]
                  x-arthome-vocabulary-source: none
                  x-arthome-vocabulary-reason: "A single-member enum: it records the actor on an audit line, and this path has exactly one actor. Flagged in the description as a question, not settled as a vocabulary."

            example: { cancelReasonCode: viewer_request }
      responses:
        '200':
          description: Seat cancelled, with the refund and its delay code.
          # The refusal after the deadline carries `CANCEL_DEADLINE_PASSED`, with the instant as a parameter.
          # It was announced — "the refusal after the deadline has its own code" — and named nowhere:
          # an unnamed code is a code invented three times.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          ticket: { $ref: '#/components/schemas/TicketCard' }
                          date: { $ref: '#/components/schemas/DateCard' }
              example:
                servedAt: '2026-09-21T17:10:00.000Z'
                data:
                  ticket:
                    seatId: 019928f5-0000-7000-8000-000000000001
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    seatCode: ATH-7QK2-4M
                    tier: full
                    state: refunded
                    date: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001 }
                    refund:
                      amount: { amountMinor: 2400, currencyCode: EUR }
                      delayCode: refund_delay_business_days_3_5
                      method: original_payment_method
                  date: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/dates/{dateId}/waitlist:
    put:
      operationId: joinWaitlist
      tags: [commerce]
      summary: S'inscrit en liste d'attente.
      description: |
        **A state assignment, not a toggle**: two submissions leave one registration. The response
        **states the rank, or states that it will not state it** — it is never silent. The priority
        window (2 h) is served, never hardcoded in the surface.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Inscrit.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [joined, rankDisclosed]
                        properties:
                          joined: { type: boolean }
                          rankDisclosed: { type: boolean }
                          rank: { type: [integer, 'null'] }
                          priorityWindowHours: { type: integer }
                          date: { $ref: '#/components/schemas/DateCard' }
              example:
                servedAt: '2026-09-21T18:42:00.000Z'
                data: { joined: true, rankDisclosed: true, rank: 14, priorityWindowHours: 2 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: leaveWaitlist
      tags: [commerce]
      summary: Leaves the waiting list.
      description: |
        **A state assignment**, like joining. Replayed on an already-removed registration, it
        succeeds — an offline queue replays, and a failure there would be a false negative.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Removed. A deletion replayed on an already-removed registration **succeeds**, it does not fail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { joined: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:43:00.000Z'
                data: { joined: false }
        '404': { $ref: '#/components/responses/NotFound' }

  # =============================================================== cart and shop

  /v1/cart:
    get:
      operationId: getCart
      tags: [commerce]
      summary: The account's cart, split by vendor.
      description: |
        The cart lives **on the account**, not in the browser: it is persistent in the header, it is
        built up across several sessions from a live show's shop, and all three storefronts display
        it. It is served **already split by vendor**, because that is how it will be paid.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The cart.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Cart' } }
              example:
                servedAt: '2026-09-21T18:44:00.000Z'
                data: { lines: [], vendorGroups: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/cart/lines:
    post:
      operationId: addCartLine
      tags: [commerce]
      summary: Adds a line to the cart.
      description: |
        A line references a **variant**, never a bare item: a T-shirt without a size is not
        sellable. Shipping is **not** computed here — it is computed at quoting time.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:cart']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, variantId, quantity]
              properties:
                itemId: { type: string, format: uuid }
                variantId: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 20 }
            example: { itemId: 019928a0-7d31-7a10-b8c4-2f9e11a4d001, variantId: M, quantity: 1 }
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Cart' } }
              example:
                servedAt: '2026-09-21T18:44:20.000Z'
                data:
                  lines: [{ id: 019928f6-0000-7000-8000-000000000001, itemId: 019928a0-7d31-7a10-b8c4-2f9e11a4d001, variantId: M, channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222, quantity: 1, unitPrice: { amountMinor: 2500, currencyCode: EUR }, version: 1 }]
                  vendorGroups: [{ channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222, lineIds: [019928f6-0000-7000-8000-000000000001] }]
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/cart/lines/{lineId}:
    patch:
      operationId: updateCartLine
      tags: [commerce]
      summary: Changes the quantity of a line.
      description: |
        **Conflict between two devices: per line, last writer wins, and the ordering comes from the
        server** — `version`, never a date from the phone, whose clock drifts and jumps.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - name: lineId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, expectedVersion]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 20 }
                expectedVersion: { type: integer }
            example: { quantity: 2, expectedVersion: 1 }
      responses:
        '200':
          description: The updated cart.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Cart' } }
              example:
                servedAt: '2026-09-21T18:44:40.000Z'
                data: { lines: [], vendorGroups: [] }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeCartLine
      tags: [commerce]
      summary: Removes a line from the cart.
      description: |
        Replayed on an already-removed line, it **succeeds**. Returns the whole cart, split by
        vendor, so the surface repaints without a second round trip.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - name: lineId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The updated cart. A removal replayed on an already-removed line **succeeds**.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Cart' } }
              example:
                servedAt: '2026-09-21T18:45:00.000Z'
                data: { lines: [], vendorGroups: [] }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/cart/quote:
    post:
      operationId: quoteCart
      tags: [commerce]
      summary: The cart's binding quote, per vendor.
      description: |
        **The total presented is the one that will be charged**, for 15 minutes. Shipping is computed
        **here**, not on adding. A cart spanning two channels returns **two groups**: it will split
        into two orders at payment.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-idempotency-exemption: |
        **A read disguised as a `POST`**, for the same reason as `quoteSeat`: the cart and the
        shipping address do not fit in a URL. A quote computes shipping and discounts; it creates
        neither an order nor a reservation.

        **A key would protect nothing here** — `checkoutCart` carries the `quoteId` and refuses a
        stale quote — **and it would do harm**: the total presented is the one that will be charged,
        and that promise holds for **fifteen minutes**. Serving a memorised quote would return a
        total whose window is part-spent or closed, that is, **a binding quote that no longer
        binds**. A replay therefore produces a fresh quote, with its own window.
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingCountryCode]
              properties:
                shippingCountryCode: { type: string, pattern: '^[A-Z]{2}$' }
                shippingPostalCode: { type: [string, 'null'] }
            example: { shippingCountryCode: FR, shippingPostalCode: '75011' }
      responses:
        '200':
          description: Devis.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/CartQuote' } }
              example:
                servedAt: '2026-09-21T18:45:20.000Z'
                validUntil: '2026-09-21T19:00:20.000Z'
                data:
                  validUntil: '2026-09-21T19:00:20.000Z'
                  groups:
                    - channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                      subtotal: { amountMinor: 5000, currencyCode: EUR }
                      shipping: { amountMinor: 590, currencyCode: EUR }
                      discount: { discountReasonCode: plan_shop_discount, amount: { amountMinor: -750, currencyCode: EUR } }
                      total: { amountMinor: 4840, currencyCode: EUR }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/orders/merch:
    post:
      operationId: checkoutCart
      tags: [commerce]
      summary: Pays for the cart — one order per vendor.
      description: |
        **The cart is emptied by the response**, never by a local timeout.

        **The contract settles partial failure**: an out-of-stock line **refuses its group's order
        outright**, with `params.unavailableLineIds`, and does not truncate it. Reason: a truncated
        order charges an amount the viewer never saw, and the quote is binding — truncating it would
        make it false.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:orders', 'account:cart']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId, shippingAddress]
              properties:
                quoteId: { type: string, format: uuid }
                shippingAddress:
                  type: object
                  required: [line1, city, postalCode, countryCode]
                  properties:
                    line1: { type: string }
                    line2: { type: [string, 'null'] }
                    city: { type: string }
                    postalCode: { type: string }
                    countryCode: { type: string, pattern: '^[A-Z]{2}$' }
            example:
              quoteId: 019928f6-1111-7000-8000-000000000001
              shippingAddress: { line1: '12 rue du Théâtre', city: Paris, postalCode: '75011', countryCode: FR }
      responses:
        '201':
          description: One order per vendor.
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [orders, cart]
                        properties:
                          orders: { type: array, items: { $ref: '#/components/schemas/Order' } }
                          cart: { $ref: '#/components/schemas/Cart' }
              example:
                servedAt: '2026-09-21T18:46:00.000Z'
                data:
                  orders: [{ id: 019928f6-2222-7000-8000-000000000001, reference: ATH-2026-00043, kind: merch, state: paid, placedAt: '2026-09-21T18:46:00Z' }]
                  cart: { lines: [], vendorGroups: [] }
        '202':
          description: '**Strong authentication required.** See `PaymentHandoff` — the return URL concludes nothing, `getOrder` is authoritative.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PaymentHandoff' } }
              example:
                servedAt: '2026-09-21T18:46:00.000Z'
                data:
                  orderId: 019928f6-2222-7000-8000-000000000001
                  state: awaiting_action
                  paymentIntentRef: pi_3Ef4Gh
                  clientSecret: pi_3Ef4Gh_secret_1a2
                  nextAction: { kind: redirect_to_url, redirectUrl: 'https://hooks.stripe.com/3ds/authenticate' }
                  returnUrl: 'https://arthome.fr/paiement/retour?order=019928f6-2222-7000-8000-000000000001'
                  expiresAt: '2026-09-21T19:16:00Z'
        '409':
          description: |
            `CHECKOUT_LINE_UNAVAILABLE` (with `unavailableLineIds`), `QUOTE_ADDRESS_MISMATCH`, or
            `order.price_stale`.

            **`QUOTE_ADDRESS_MISMATCH` closes a gap**: the quote computes shipping from a country and a
            postcode, the payment receives a full address, and nothing required them to match. **A
            binding quote whose address changes in between no longer binds** — it needs a new quote, not
            a silently different charge.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: order.quote_address_mismatch, nature: refused, params: { quotedCountryCode: FR, quotedPostalCode: '75011' }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:46:00.000Z'
        '410': { $ref: '#/components/responses/Gone' }

  /v1/subscription:
    put:
      operationId: setSubscriptionPlan
      tags: [commerce]
      summary: Subscribes or changes plan.
      description: |
        **A state assignment**, not a toggle. The effect is **immediately visible** on displayed
        prices: `x-arthome-invalidates` names the reads that become false, so the surface
        invalidates exactly what it must. The **right to watch**, on the other hand, is never
        decided here: it is returned by `streaming` when the player opens, on fresh data.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:subscription', 'home:rails', 'account:tickets']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planTier]
              properties:
                planTier: { type: string, enum: [free, pass, premium], x-arthome-vocabulary-source: PLAN_TIERS }
                paymentMethodRef: { type: [string, 'null'] }
            example: { planTier: premium, paymentMethodRef: pm_1Ab2Cd }
      responses:
        '200':
          description: Subscription updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Subscription' } }
              example:
                servedAt: '2026-09-21T18:47:00.000Z'
                data: { planTier: premium, state: active, startedAt: '2026-09-21T18:47:00Z', currentPeriodEnd: '2026-10-21T18:47:00Z', cancelAtPeriodEnd: false }
        '202':
          description: '**Strong authentication required.** See `PaymentHandoff` — the return URL concludes nothing, `getOrder` is authoritative.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PaymentHandoff' } }
              example:
                servedAt: '2026-09-21T18:47:00.000Z'
                data:
                  orderId: 019928f7-3333-7000-8000-000000000001
                  state: awaiting_action
                  paymentIntentRef: pi_3Ij5Kl
                  clientSecret: pi_3Ij5Kl_secret_3c4
                  nextAction: { kind: redirect_to_url, redirectUrl: 'https://hooks.stripe.com/3ds/authenticate' }
                  returnUrl: 'https://arthome.fr/paiement/retour?order=019928f7-3333-7000-8000-000000000001'
                  expiresAt: '2026-09-21T19:17:00Z'
        '402':
          description: Payment declined by the provider. **Distinct** from a business refusal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: order.payment_declined, nature: refused, params: { declineCode: insufficient_funds }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:47:00.000Z'
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: cancelSubscription
      tags: [commerce]
      summary: Cancels the subscription at the end of the period.
      description: |
        Cancellation takes effect **at the end of the period**: the rights run until
        `currentPeriodEnd`, and the contract serves it as an **instant** rather than letting five
        surfaces compute "12 days left".
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-invalidates: ['account:subscription']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cancellation recorded. Rights run until `currentPeriodEnd`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Subscription' } }
              example:
                servedAt: '2026-09-21T18:48:00.000Z'
                data: { planTier: premium, state: active, currentPeriodEnd: '2026-10-21T18:47:00Z', cancelAtPeriodEnd: true }
        '409': { $ref: '#/components/responses/Conflict' }

  # =============================================================== playback

  /v1/playback/{dateId}/open:
    post:
      operationId: openPlayback
      tags: [playback]
      summary: The binding verdict, the token, the lease, and the whole player screen.
      description: |
        **This is the only evaluation of the right that is authoritative**, because it is the only
        one that produces a token. The verdict served on a card is advisory (`advisory: true`); this
        one is not.

        **The right is rechecked when playback starts, never inherited from the catalogue**: the
        viewer's country changes between the two — travel, roaming, a corporate network — and on
        mobile that gap is measured in hours.

        **Budget ≤ 1 s.** All the screen's material arrives here: chapters, tracks, chat mode,
        ongoing incident, resume point, live edge, DRM, quality cap. No panel of the player should
        trigger another call.

        **`Cache-Control: no-store`.** A right read back from disk is a false right.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      x-arthome-idempotency-exemption: |
        **Idempotency would be redundant here, because resumption already provides it.** An opening
        on a `deviceId` that holds a live lease **resumes that lease** and returns the same
        `sessionId`: the effect of a second call is the effect of the first, by construction and not
        by memorisation. Adding a key would additionally memorise a `PlaybackTicket` — hence a signed
        token and its expiry instant — in a 24-hour store, for a response the contract says is
        **never** cached.
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, kind]
              properties:
                deviceId:
                  type: string
                  format: uuid
                  description: |
                    **This is what carries resumption.** An opening on a `deviceId` that already holds a live
                    lease for this date **resumes that lease** and returns the same `sessionId`; it does not open
                    a second one and does not consume another screen. The promise "you can resume your own
                    session, identified by the device" was written in the answers to the surfaces and was carried
                    nowhere in the contract.
                kind:
                  type: string
                  description: |
                    **A strict narrowing of `DISPLAY_STATES`, and the narrowing is the rule.** Only two
                    of the eleven states can be opened: you watch a date that is on air, or a replay.
                    The other nine are not refused here as unknown values, they are **not openable**.
                  enum: [live, replay]
                  x-arthome-vocabulary-source: DISPLAY_STATES
                  x-arthome-vocabulary-narrowing: "Only two of the eleven states can be opened. The other nine are not refused as unknown values, they are not openable."
                profileId: { type: [string, 'null'], format: uuid }
                capabilities:
                  type: object
                  description: |
                    What the device **can do**, declared. The server chooses protocol, DRM and quality cap; **a
                    client that guesses gets it wrong**, and it gets it wrong on the devices we cannot test.
                  properties:
                    drmSystems: { type: array, items: { type: string, enum: [fairplay, widevine, playready], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared." } }
                    hardwareSecureDecode: { type: boolean }
                    maxHeightPx: { type: integer }
            example:
              deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
              kind: live
              capabilities: { drmSystems: [fairplay], hardwareSecureDecode: true, maxHeightPx: 2160 }
      responses:
        '200':
          description: Right granted. The token, the lease and the complete screen.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
              description: '`no-store` is not an optimisation: it is what keeps the token out of the HTTP cache and out of the application snapshot taken when it goes to the background.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PlaybackTicket' } }
              example:
                servedAt: '2026-09-21T19:05:00.000Z'
                validUntil: '2026-09-21T19:07:00.000Z'
                data:
                  sessionId: 019928f7-0000-7000-8000-000000000001
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  scope: full
                  protocol: hls
                  drmSystem: fairplay
                  qualityCap: fhd
                  manifestUrl: 'https://cdn.arthome.fr/playback/a9f1c0/master.m3u8'
                  signature: { queryToken: 'Expires=1790000000&Signature=abc', cookieSet: null }
                  edgeRenewalMode: query_token
                  expiresAt: '2026-09-21T19:07:00.000Z'
                  renewAfterSec: 45
                  leaseExpiresAt: '2026-09-21T19:06:30.000Z'
                  chatMode: open
                  chatRateLimitPerSecond: 2
                  liveEdgeSec: 6
                  chapters: []
                  audioTracks: [{ id: fr-main, language: fr, kind: main }]
                  subtitleTracks: []
                  incident: null
        '403':
          description: |
            Right refused. The `code` is one of the ten in the closed vocabulary, and each produces a
            different screen. On `watch.concurrent_limit_reached`, `params.activeSessions` carries the **list
            of active sessions** so the surface can offer to release one: a bare refusal would leave the
            viewer with no way out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: watch.concurrent_limit_reached
                  nature: refused
                  params:
                    allowed: 2
                    activeSessions:
                      - { sessionId: 019928f7-0000-7000-8000-0000000000aa, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77, isCurrentDevice: false, deviceLabel: 'Téléviseur du salon', city: Paris, openedAt: '2026-09-21T19:00:00Z' }
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-09-21T19:05:00.000Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/playback/sessions/{sessionId}/renew:
    post:
      operationId: renewPlaybackTicket
      tags: [playback]
      summary: Renews the token and extends the lease, without restarting playback.
      description: |
        **Every 45 s**, for a 120 s token and a 90 s lease. It is the renewal that carries the
        concurrent-screen limit: **the window during which someone watches a stream they are no
        longer entitled to is exactly the renewal interval.**

        The response contains **nothing that would force a manifest reload**: the path is stable,
        only the signature changes.

        **Four distinct refusal codes**, because the surface displays four different messages. A
        generic code would produce a false one three times out of four.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      x-arthome-idempotency-exemption: |
        **A renewal must produce a fresh window, never a memorised one.** Returning the original
        response would return a token already part-spent — and, at the worst moment, an already
        expired one — when the call exists precisely to obtain a new one. It is also this renewal
        that carries the concurrent-screen limit: replaying it from a store would bypass the count.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Token renewed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PlaybackRenewal' } }
              example:
                servedAt: '2026-09-21T19:05:45.000Z'
                data:
                  expiresAt: '2026-09-21T19:07:45.000Z'
                  renewAfterSec: 45
                  leaseExpiresAt: '2026-09-21T19:07:15.000Z'
                  signature: { queryToken: 'Expires=1790000120&Signature=def', cookieSet: null }
                  qualityCap: fhd
        '403':
          description: |
            Renewal refused. `SEAT_EXPIRED` · `watch.concurrent_limit_reached` · `SIGNED_OUT_ELSEWHERE` ·
            `watch.preview_exhausted` · `DATE_INTERRUPTED`. `SIGNED_OUT_ELSEWHERE` is what the television
            signed out from the web sees — **not a network error**. **Real window: up to 120 s** — see
            `revokeDevice`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: identity.signed_out_elsewhere, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T19:06:30.000Z'
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/playback/sessions/{sessionId}/release:
    post:
      operationId: releasePlayback
      tags: [playback]
      summary: Releases a playback session — speeds things up, guarantees nothing.
      description: |
        **Nothing depends on it.** A television is unplugged, a set-top box cuts out, the operating
        system kills a mobile application without warning: it is the **lease** that expires (90 s),
        never this call that closes. A session that only closed on a client event would leave a ghost
        screen, and the viewer would be refused their own second playback.

        The client can **resume its own session**, identified by `deviceId`: reopening the player on
        the same device reuses the lease instead of opening a second one.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      x-arthome-idempotency-exemption: |
        **Idempotent by nature, and nothing depends on it.** Releasing twice leaves the same state,
        and it is the **expiring lease** that is authoritative — this call merely speeds things up. A
        key would protect an effect that has neither accumulation nor consequence.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Released, or already released — both succeed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { released: { type: boolean } } }
              example:
                servedAt: '2026-09-21T20:40:00.000Z'
                data: { released: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/progress/{dateId}:
    put:
      operationId: recordPlaybackPosition
      tags: [playback]
      summary: Records the playback position.
      description: |
        **The most frequent write in the system.** It carries **no** idempotency key: one key per
        30 s slice, per viewer and per live show would make the idempotency store the hottest table
        in `streaming`, to protect a write whose loss has no consequence.

        Expected cadence: **on pause, on exit, on end, and a 30-to-60 s heartbeat**, plus a **forced
        write when going to the background**.

        **A late write is accepted**: the last position must be taken even if it arrives **after** a
        `releasePlayback` — a television can be cut off at any moment.

        **Last writer wins, and the ordering comes from the server.**
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      x-arthome-idempotency-exemption: |
        **The most frequent write in the system.** One key per 30-second slice, per viewer and per
        live show would make the idempotency store the hottest table in `streaming` — to protect a
        write whose loss has no consequence and whose rule is already "last writer wins, server
        ordering". The cost would be per minute of playback and per viewer.
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionSec, deviceId]
              properties:
                positionSec: { type: integer, minimum: 0 }
                deviceId: { type: string, format: uuid }
                completed: { type: boolean, default: false }
            example: { positionSec: 1840, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77, completed: false }
      responses:
        '200':
          description: Position recorded, with the server ordering applied.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          positionSec: { type: integer }
                          version: { type: integer }
              example:
                servedAt: '2026-09-21T19:35:00.000Z'
                data: { positionSec: 1840, version: 212 }
        '404': { $ref: '#/components/responses/NotFound' }

  # =============================================================== chat

  /v1/dates/{dateId}/chat/messages:
    get:
      operationId: listChatMessages
      tags: [chat]
      summary: The chat's sliding window, by cursor.
      description: |
        **No backward pagination on a live chat**: nobody scrolls back through a chat with a remote
        control, and on all three surfaces it is a sliding window. The full history is read on the
        **replay**, replayed by `atMediaSec`.

        Catch-up on entry is **served per surface**: 20 messages on television, 50 elsewhere. **No
        removed message ever reaches a public surface** — moderation is a state on the `chat` side,
        and the stream served is already filtered.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: sinceSeq
          in: query
          description: Resume by sequence number, after a channel break.
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Messages.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
                      page: { $ref: '#/components/schemas/CursorPageInfo' }
              example:
                servedAt: '2026-09-21T19:36:00.000Z'
                lastEventSeq: 41287
                items:
                  - id: 019928f8-0000-7000-8000-000000000001
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    seq: 41287
                    authorHandle: '@marie.j'
                    atMediaSec: 2160
                    sentAt: '2026-09-21T19:35:58Z'
                    badge: published
                    body: { contentLanguage: fr, text: 'Quelle lumière.' }
                page: { hasMore: true, nextCursor: null, prevCursor: null }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Posts a chat message.
      description: |
        **Never queued offline**: a message replayed ten minutes later no longer means anything. It
        is **dropped**, not queued.

        The position in the media (`atMediaSec`) is **provided by the client**, because only the
        client knows where its playback has reached; the absolute instant is set by the server. Both
        travel, never one alone.

        The **rate limit is in the contract**, not merely enforced: `CHAT_RATE_LIMITED` carries
        `retryAfterMs`, so the surface can **disable the input cleanly** instead of stacking up
        refusals.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, atMediaSec]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
                atMediaSec: { type: integer, minimum: 0 }
            example: { text: 'Quelle lumière.', atMediaSec: 2160 }
      responses:
        '201':
          description: Message posted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ChatMessage' } }
              example:
                servedAt: '2026-09-21T19:36:02.000Z'
                data:
                  id: 019928f8-0000-7000-8000-000000000002
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  seq: 41288
                  authorHandle: '@marie.j'
                  atMediaSec: 2160
                  sentAt: '2026-09-21T19:36:02Z'
                  badge: published
                  body: { contentLanguage: fr, text: 'Quelle lumière.' }
        '403':
          description: Chat mode closed, holders only, or the person is sanctioned in this channel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: chat.holders_only, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T19:36:02.000Z'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/dates/{dateId}/chat/reactions:
    post:
      operationId: sendReaction
      tags: [chat]
      summary: Sends a reaction, and returns the remaining quota.
      description: |
        **The quota travels with the response** — how many are left, when it recharges — so that the
        surface can **disable** the control rather than let it fail. An inert action is forbidden by
        the brief; an action that fails silently is worse. **One reaction in flight at a time.**
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      x-arthome-idempotency-exemption: |
        **The quota already bounds the effect**, and it is served with the response. A replayed key
        would return a **stale** quota — "17 left" when 12 are left — which is worse than no response
        at all: the surface disables its control on that number.
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reactionId, atMediaSec]
              properties:
                reactionId: { type: string, enum: [applause, heart, bravo, laugh, wow, sad], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change." }
                atMediaSec: { type: integer, minimum: 0 }
            example: { reactionId: applause, atMediaSec: 2165 }
      responses:
        '200':
          description: Reaction accepted, remaining quota.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ReactionQuota' } }
              example:
                servedAt: '2026-09-21T19:36:05.000Z'
                data: { remaining: 17, rechargesAt: '2026-09-21T19:41:05Z' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/chat/messages/{messageId}/report:
    post:
      operationId: reportChatMessage
      tags: [chat]
      summary: Reports a message to moderation.
      description: A report creates a **queue row** (`reported`), not a sanction. The three axes never stack.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: |
                    **The vocabulary from `shared/`, which is authoritative and had no competitor.** `spoiler` —
                    "gives away the show" — is the only reason specific to live performance and it is translated
                    in the i18n catalogue; it had disappeared, as had `insult`. `hate` and `filter` had been
                    invented, and `filter` is not a reason but an **origin** — the contract already carries it
                    correctly elsewhere, and putting it in `reason` as well gave one field two axes.
                  enum: [spam, insult, spoiler, off_topic, harassment]
                  x-arthome-vocabulary-source: MODERATION_REASONS
            example: { reason: harassment }
      responses:
        '202':
          description: Report recorded. A second report from the same account does not create another.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { reported: { type: boolean } } }
              example:
                servedAt: '2026-09-21T19:37:00.000Z'
                data: { reported: true }
        '404': { $ref: '#/components/responses/NotFound' }

  # =============================================================== pairing

  /v1/pairings:
    post:
      operationId: createPairing
      tags: [pairing]
      summary: Opens a device pairing, for one of the five intents.
      description: |
        **One command, one shape, one state machine, five intents.** The television accepts no input
        beyond six characters: every payment goes through here, therefore through the phone.

        **`signin` is the only true RFC 8628**; the other four are **transaction appointments** —
        buying from an already signed-in television is not a token request. What is shared is the
        state machine; what differs is the effect of approval.

        **For `seat`, the pairing's lifetime is the lifetime of a seat hold placed by `ticketing` at
        creation**: without that hold, the capacity shown on the television is false for five
        minutes — exactly the defect the television reported.

        `signin` opens with the **device token alone**, without a session. The other four require a
        session on the television.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, ticketing]
      security:
        - deviceToken: []
        - bearerToken: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intent, deviceId]
              properties:
                intent: { type: string, enum: [signin, seat, plan, payment_method, merch], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change." }
                deviceId: { type: string, format: uuid }
                payload:
                  type: object
                  additionalProperties: true
                  description: |
                    Depends on the intent and stays **opaque to `identity`**, which relays it to the target
                    service. `identity` knows nothing of seats, plans or payments: it carries an appointment and
                    a pointer.
            example:
              intent: seat
              deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
              payload: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, tier: full, quantity: 2 }
      responses:
        '201':
          description: Pairing opened. The code, the complete QR, the expiry and the polling interval.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/DevicePairing' } }
              example:
                servedAt: '2026-09-21T18:50:00.000Z'
                data:
                  pairingId: 019928f9-0000-7000-8000-000000000001
                  intent: seat
                  userCode: K7M2PQ
                  verificationUri: 'https://arthome.fr/appairage'
                  verificationUriComplete: 'https://arthome.fr/appairage?code=K7M2PQ'
                  expiresAt: '2026-09-21T18:55:00.000Z'
                  pollIntervalSec: 2
                  state: pending
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/pairings/{pairingId}:
    get:
      operationId: pollPairing
      tags: [pairing]
      summary: Polls the outcome of a pairing — and composes the confirmation screen.
      description: |
        **RFC 8628-compliant polling, not the real-time channel.** Bringing a device identity into
        the WebSocket namespace at `signin` time would widen its attack surface to save a few hundred
        milliseconds.

        The requirement "switch within two seconds at most" is met by a **served decay**:
        `pollIntervalSec` is 2 for the first 60 seconds, then 5 — so it stays under the server's
        control, and it costs thirty requests per pairing at most. **The surface never polls faster
        than the interval it is served.**

        **Works with the device token alone**, without a session: that is what allows reattachment
        after the television restarts.

        The response is **complete**: the confirmation screen costs **zero further calls**.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, ticketing, catalog]
      security:
        - deviceToken: []
        - bearerToken: []
        - sessionCookie: []
      parameters:
        - name: pairingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The outcome, and what it produced.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PairingOutcome' } }
              example:
                servedAt: '2026-09-21T18:52:10.000Z'
                data:
                  pairingId: 019928f9-0000-7000-8000-000000000001
                  intent: seat
                  state: approved
                  pollIntervalSec: 5
                  ticket:
                    seatId: 019928f5-0000-7000-8000-000000000001
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    seatCode: ATH-7QK2-4M
                    tier: full
                    state: active
                    date: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001 }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429':
          description: 'RFC 8628 `slow_down`. The surface **slows down**, it does not retry faster.'
          headers:
            Retry-After-Ms: { $ref: '#/components/headers/RetryAfterMs' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: pairing.slow_down, nature: unavailable, params: { retryAfterMs: 5000 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:52:10.000Z'
    delete:
      operationId: cancelPairing
      tags: [pairing]
      summary: Closes a pending pairing.
      description: Triggered by the Back button. The television often leaves without waiting for the response.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security:
        - deviceToken: []
        - bearerToken: []
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: pairingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Cancelled, or already settled — **a second call returns the original outcome, never an error**.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PairingOutcome' } }
              example:
                servedAt: '2026-09-21T18:53:00.000Z'
                data: { pairingId: 019928f9-0000-7000-8000-000000000001, intent: seat, state: cancelled, pollIntervalSec: 5 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            **`PAIRING_EXECUTION_ENGAGED` — the pairing can no longer be cancelled.** The phone has
            entered the payment journey; cancelling here would orphan a purchase in flight.

            **What the surface does with this refusal**: it **stays on the waiting screen** and keeps
            polling. It does not go back. This is the only case in the contract where pressing Back does
            not go up one level, and the reason is written down: we do not let a remote control cancel a
            payment it triggered itself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: pairing.execution_engaged
                  nature: refused
                  params: { state: engaged, engagedAt: '2026-09-21T18:52:04Z' }
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-09-21T18:52:06.000Z'

  /v1/pairings/{pairingId}/engagement:
    post:
      operationId: engagePairing
      tags: [pairing]
      summary: Marks the pairing as engaged — on entering the payment journey.
      description: |
        **This operation exists to close a race that costs real money.**

        The sequence without it: the viewer scans the QR, pays on their phone, and presses **Back**
        while the payment is executing. The television sends its `DELETE`; `ticketing` has already
        charged; the decision arrives afterwards and receives `410`. **The seat is paid for, the
        phone shows a failure, the television has gone back, and the money is gone.** The contract
        handled the reverse order — approval then cancellation — and not this one, which is the more
        likely of the two: executing a payment takes seconds, pressing Back is instant.

        **Called by the BFF on the phone's behalf**, at the moment the phone enters the payment
        journey — hence **before** `ticketing` executes, not after. It moves the pairing from
        `pending` to `engaged`, and from then on `cancelPairing` answers `409`.

        **It applies only to the four purchase intents.** `signin` commits no money: a sign-in
        pairing stays cancellable until its decision, and calling this on one is refused.

        **Idempotent**: a second call on an already `engaged` pairing returns the same state, not an
        error — the phone may replay its entry into the journey on a network that switches over.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: pairingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: [string, 'null']
                  description: Optional trace of the engaged journey, for the audit log.
            example: {}
      responses:
        '200':
          description: Pairing engaged, therefore no longer cancellable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PairingOutcome' } }
              example:
                servedAt: '2026-09-21T18:52:04.000Z'
                data: { pairingId: 019928f9-0000-7000-8000-000000000001, intent: seat, state: engaged, pollIntervalSec: 2 }
        '403':
          description: '`PAIRING_IDENTITY_MISMATCH`, or `PAIRING_INTENT_NOT_ENGAGEABLE` on `signin`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: pairing.intent_not_engageable, nature: refused, params: { intent: signin }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:52:04.000Z'
        '410': { $ref: '#/components/responses/Gone' }

  /v1/pairings/{pairingId}/decision:
    post:
      operationId: decidePairing
      tags: [pairing]
      summary: Approves or denies a pairing, from the phone.
      description: |
        **The ownership guard is written by us, not delegated.** CVE-2026-45337 showed what relaxing
        it costs: the plugin treated any authenticated session as the owner of any pending code.

        Three checks, in this order: the pairing is `pending` **or `engaged`** and not expired — an
        engaged pairing is precisely the one whose decision is awaited; if `intent = signin`, any
        valid session suffices — **that is the nominal case, and it is the very meaning of "add an
        account"**; otherwise, the bearer **is** the profile that opened the pairing, on pain of
        `PAIRING_IDENTITY_MISMATCH`.

        **No implicit profile switch.** It would charge the wrong payment method, credit the wrong
        rights and deliver the seat to the wrong account — in a living room, at the precise moment
        two people are watching the same screen. The phone offers "switch account": a gesture by the
        person, never by the system.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: pairingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, deny], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "The two answers this one command accepts. It is the command's shape, not a vocabulary: a third answer would be a third command." }
                outcomeRef:
                  type: [string, 'null']
                  description: |
                    The **opaque** pointer to what the phone's normal journey produced — set by the BFF after
                    `ticketing` has executed, with **its own** `Idempotency-Key`. No duplication of ticketing:
                    `ticketing` implements **no** short code.
            example: { decision: approve, outcomeRef: seat:019928f5-0000-7000-8000-000000000001 }
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/PairingOutcome' } }
              example:
                servedAt: '2026-09-21T18:52:00.000Z'
                data: { pairingId: 019928f9-0000-7000-8000-000000000001, intent: seat, state: approved, pollIntervalSec: 5 }
        '403':
          description: '`PAIRING_IDENTITY_MISMATCH` — the bearer is not the profile that opened the pairing. Impossible on `signin`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: pairing.identity_mismatch, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:52:00.000Z'
        '410': { $ref: '#/components/responses/Gone' }

  /v1/account-deep-link:
    get:
      operationId: getAccountDeepLink
      tags: [pairing]
      summary: The QR that hands off to account management — what is NOT a pairing.
      description: |
        **Nothing is waiting, the screen does not switch, no pairing row is opened.** Two distinct
        shapes in the contract, separated by **name** and not by an option — otherwise someone will
        implement a wait where there is none.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/AccountDeepLink' } }
              example:
                servedAt: '2026-09-21T18:54:00.000Z'
                data: { url: 'https://arthome.fr/compte' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # =============================================================== account

  /v1/me/account:
    get:
      operationId: getAccountScreen
