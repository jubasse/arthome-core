  /v1/me/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      summary: Revokes a device — and cuts its playback.
      description: |
        **An observable effect on the targeted device, within 120 seconds at most.** Revoking
        removes the `Device`, **all** its `DeviceSession`s **and its playback leases**: `identity`
        publishes `device_revoked`, `streaming` consumes it and refuses the **next renewal** of the
        token. The device displays `identity.signed_out_elsewhere`, **not a network error**.

        **Never queued offline**: this is a security command, it must fail loudly rather than be
        replayed blind.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - identity
      x-arthome-invalidates:
      - account:devices
      tags:
      - account
      security:
      - sessionCookie: []
        csrfToken: []
      - bearerToken: []
      parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: |
            Device revoked. `playbackCutWithinSec` states how long playback **actually** takes to
            stop.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        devices:
                          type: array
                          items:
                            $ref: '#/components/schemas/Device'
                        playbackCutWithinSec:
                          type: integer
                          description: |
                            **120, not 60.** Revocation does not revoke the token in hand: it **refuses the next
                            renewal**. The CDN's prefix signature expires with the token, so the edge keeps serving valid
                            segments for the whole lifetime of the token held — that is, up to **120 s**, in the case
                            where it has just been renewed at the instant of revocation. In steady state: 45 to 75 s.

                            The 60 served until now was the **renewal interval** presented as a guarantee of stopping.
                            That was rule 15 violated on a security constant, and the plausible number had been kept
                            because it satisfied the question that was asked.
                          examples:
                          - 120
                      additionalProperties: {}
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T19:06:00.000Z'
                data:
                  devices: []
                  playbackCutWithinSec: 120
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
