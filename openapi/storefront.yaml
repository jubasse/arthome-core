openapi: 3.1.1

info:
  title: Arthome Storefront BFF
  version: 1.0.0
  summary: Le contrat unique des trois surfaces publiques — web, mobile, téléviseur.
  description: |
    Contrat du **BFF storefront**. Il sert `storefront-web` (Next.js), `storefront-mobile`
    (React Native) et `storefront-tv` (react-native-tvos). Ces trois surfaces partagent un seul
    document : ce qui diffère entre elles est un **paramètre** (`X-Arthome-Surface`), jamais une
    forme.

    ## Ce document est généré, il ne s'écrit pas

    La source est zod, dans `@arthome/contracts` ; ce document est produit par
    `z.toJSONSchema()`. Trois conséquences qui se voient dans ce qui suit :

    - **aucune date n'est un `z.date()`** et **aucun schéma de frontière ne porte de
      `z.transform()`** : les deux sont inconvertibles. Les instants sont des chaînes
      `date-time` (RFC 3339, UTC).
    - un schéma de **requête** est converti avec `io: "input"`, un schéma de **réponse** avec
      `io: "output"`. Se tromper produit une documentation fausse.
    - le document régénéré doit être **identique** au document commité. C'est une porte de
      `definition-of-done.md`.

    ## Vocabulaires fermés, et la survie du parc

    Un vocabulaire fermé apparaît sous deux formes, et **ce n'est pas la même**.

    - en **entrée** (ce que le client envoie) : `enum` strict. Une valeur inconnue est refusée
      avec `SCHEMA_INVALID`.
    - en **sortie** (ce que le serveur rend) : `type: string` accompagné de
      `x-arthome-vocabulary`, qui énumère les valeurs connues **à titre documentaire**. Une
      surface qui reçoit une valeur absente de cette liste **la conserve brute et la traite comme
      neutre** ; elle ne rejette jamais, et surtout elle ne fait pas échouer la page entière.

    Le motif est `storefront-tv` Q12 : une version publiée aujourd'hui tourne dans des salons
    dans un an, et le jour où le catalogue gagne une 22ᵉ discipline, ces téléviseurs la
    recevront. La sévérité porte sur la **forme** — champs obligatoires, types — jamais sur le
    **membre** d'un vocabulaire.

    ## Lecture publique et lecture identifiée — deux corps, un chemin

    **Dix opérations de catalogue s'appellent sans aucune authentification**, et c'est un cas
    **nominal** : `home`, `live`, `categories`, `categories/{id}`, `artists`, `artists/{id}`,
    `dates/{id}`, `dates/{id}/availability`, `search`, `plans`. Cette surface existe pour être
    indexée — le dossier la définit par « référencement et rendu serveur décisifs » — et le robot
    d'un moteur n'a ni cookie, ni jeton porteur, ni la moindre raison d'en fabriquer un. Le **mode
    visiteur** emprunte exactement le même chemin.

    Le même chemin rend **deux corps**, et la différence est déclarée :

    | Appelée | Corps | `Cache-Control` |
    |---|---|---|
    | sans aucune authentification | **corps public** — `watchVerdict`, `viewerRelations` et `viewerProgress` sont **absents** | `public, max-age=<fraîcheur>` |
    | avec session, jeton porteur ou jeton d'appareil | corps public **plus** les trois surcouches | `private, max-age=<fraîcheur>` |

    **Le corps public est identique pour tous les appelants anonymes.** C'est ce qui le rend
    mutualisable : une fonction de rendu mise en cache ne peut lire ni cookie ni en-tête, donc
    elle est anonyme par construction, et elle peut mettre ce corps en cache sans risque. Servir
    en `public` un corps qui varie par spectateur serait **une fuite, pas une optimisation** — et
    c'est l'unique raison d'être du `Vary` déclaré sur ces dix réponses.

    **Un champ absent n'est jamais un champ nul** : la règle de projection vaut ici comme côté
    studio. Une surface qui reçoit le corps public sait qu'elle n'a pas demandé les surcouches ;
    elle ne les distingue pas d'un droit refusé.

    **L'absence de justificatif n'est jamais un `401`.** Un `401` sur ces dix chemins signifie
    qu'un justificatif a été **présenté et refusé** — expiré, malformé, mauvaise audience.

    ## Ce que toute réponse porte

    `servedAt` sur **toute** réponse ; `validUntil` dès qu'une valeur périssable est présente ;
    `lastEventSeq` sur tout modèle de lecture alimenté par un flux. Tout décompte affiché se
    calcule contre `servedAt`, **jamais** contre l'horloge du client — celle d'un téléphone
    dérive en veille, saute au changement de fuseau, et son porteur peut la régler.

    ## Erreurs

    Une seule enveloppe, jusqu'à Traefik inclus : `code`, `nature`, `params`, `traceId`. Un
    échec de validation se traduit en **code**, jamais en message anglais de zod. `nature` vaut
    `refused` (le serveur a dit non définitivement), `unavailable` (réessayer) ou
    `offline_forbidden` — cette dernière n'est **jamais émise par le serveur** : c'est la nature
    d'un refus local, produit par la surface avant tout envoi, et elle est au vocabulaire pour
    que la surface n'ait qu'une seule forme d'erreur à rendre.

    ## Pagination (D-010)

    Le storefront pagine **au curseur**, opaque, encodé en Base64 sur la clé composite
    `(created_at, id)`. Il est **bidirectionnel**, **indépendant de la taille de page** — une
    rotation d'écran ne l'invalide pas — et il vit **24 heures**. Au-delà : `410`
    `CURSOR_TOO_OLD`, qui exige un rechargement complet et le dit.

    ## Maturité

    Les points d'entrée servis par `identity`, `catalog` et `ticketing` sont **stables** :
    `oasdiff breaking` bloque toute rupture. Ceux servis par `streaming`, `chat`, `payouts` et
    `notifications` sont **provisoires** : `oasdiff` y est en avertissement. Chaque opération
    porte `x-arthome-maturity`.
  contact:
    name: Arthome — architecture
  license:
    name: UNLICENSED

servers:
  - url: https://api.arthome.fr
    description: production
  - url: https://api.staging.arthome.fr
    description: recette
  - url: http://localhost:3001
    description: développement local (docker compose)

tags:
  - name: bootstrap
    description: Amorçage, contexte du spectateur, invalidations.
  - name: discovery
    description: Accueil, direct, disciplines, artistes, recherche.
  - name: date
    description: La fiche d'une date, et ce qui s'y rattache.
  - name: commerce
    description: Places, panier, marchandise, abonnement.
  - name: playback
    description: Droit de lire, jeton, session, position de reprise.
  - name: chat
    description: Parole du spectateur pendant un direct.
  - name: pairing
    description: Appairage d'appareil (RFC 8628) — les cinq intentions.
  - name: account
    description: Compte, préférences, sécurité, données personnelles.

security:
  - sessionCookie: []
  - bearerToken: []

paths:

  # =============================================================== amorçage

  /v1/devices:
    post:
      operationId: registerDevice
      tags: [bootstrap]
      summary: Enregistre l'appareil et rend son jeton d'appareil.
      description: |
        **Appelé au premier lancement, avant toute session.** L'identité d'appareil est une notion
        du contrat, et elle est nécessaire à quatre choses que les surfaces demandent : ouvrir et
        interroger un appairage, se nommer dans « appareils connectés », être révoquée, et porter
        une limite de débit ailleurs que sur l'adresse IP — qu'un foyer derrière un NAT partage.

        Elle **n'est pas une session** et n'ouvre aucune donnée personnelle ; en particulier elle
        n'ouvre pas le canal temps réel.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, label]
              properties:
                kind: { type: string, enum: [tv, mobile, tablet, desktop, stick, console, box] }
                label: { type: string, maxLength: 80 }
                osVersion: { type: string }
                appVersion: { type: string }
            example: { kind: tv, label: 'Téléviseur du salon', osVersion: 'tvOS 19.2', appVersion: '1.4.0' }
      responses:
        '201':
          description: Appareil enregistré. Le jeton est à conserver dans le magasin natif.
          headers:
            X-Arthome-Served-At: { $ref: '#/components/headers/ServedAt' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [deviceId, deviceToken, expiresAt]
                        properties:
                          deviceId: { type: string, format: uuid }
                          deviceToken: { type: string }
                          expiresAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:02:11.004Z'
                data:
                  deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                  deviceToken: eyJhbGciOiJFUzI1NiIsImtpZCI6ImRldi0yMDI2LTA5In0
                  expiresAt: '2027-03-20T18:02:11.004Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/auth/sign-up:
    post:
      operationId: signUp
      tags: [account]
      summary: Crée un compte par courriel et mot de passe.
      description: |
        **Relais documenté vers `identity`, et le relais est obligatoire, pas préférable.** Trois
        raisons, dont la première vient de notre propre outillage :

        1. **zod est la source et l'OpenAPI en est généré.** Un relais transparent n'a pas de
           schéma, donc **n'apparaîtrait pas dans ce document** — les six contrats manquants
           resteraient manquants. C'est l'argument décisif ;
        2. **l'i18n par codes.** La bibliothèque d'authentification répond des phrases anglaises
           (`"Invalid email or password"`), ce que l'enveloppe d'erreur interdit. Le BFF traduit en
           **codes**, enveloppe comprise ;
        3. **la limitation de débit par `device_id`**, que la bibliothèque ne sait pas faire : ses
           plafonds sont par adresse ou par session, et un salon derrière un NAT partage son
           adresse.

        Le cookie, quand il y en a un, est posé sur le **domaine du BFF** — c'est ce qui permet au
        rendu serveur de le lire, et ce qui garde la règle critique 1 sans exception par la porte
        de l'authentification.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, mode, acceptedTermsVersion]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                displayName: { type: string, maxLength: 80 }
                mode: { $ref: '#/components/schemas/SessionMode' }
                deviceId: { type: [string, 'null'], format: uuid }
                acceptedTermsVersion:
                  type: integer
                  description: '**Horodaté par le serveur, versionné** : un consentement sans version ni date ne vaut rien.'
            example: { email: marie@example.org, password: 'un-mot-de-passe-long', displayName: 'Marie J.', mode: cookie, acceptedTermsVersion: 3 }
      responses:
        '201':
          description: Compte créé et session ouverte, dans le mode demandé.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SessionEstablished' } }
              example:
                servedAt: '2026-09-21T18:00:00.000Z'
                data:
                  mode: cookie
                  viewerContext:
                    deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                    signedIn: true
                    profiles: []
                    constants: { roomOpensMinutesBefore: 30, cancelDeadlineMinutesBefore: 60, scarcityThresholdBps: 8500, billboardPreviewDelaySec: 4, waitlistPriorityWindowHours: 2, chatRateLimitPerSecond: 10, reactionQuotaPerDate: 20, reminderLeadMinutes: 30, replayExpiryWarningHours: 6 }
                    labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                    taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`EMAIL_TAKEN` — un **code**, pas la phrase anglaise de la bibliothèque.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: EMAIL_TAKEN, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:00:00.000Z'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [account]
      summary: Ouvre une session par courriel et mot de passe.
      description: |
        Même relais, même traduction en codes : `INVALID_CREDENTIALS` ne distingue **jamais** un
        courriel inconnu d'un mot de passe faux — la distinction dirait à un attaquant quels
        comptes existent.

        `TWO_FACTOR_REQUIRED` est un refus **intermédiaire**, pas un échec : il porte un
        `challengeId` à présenter à `/v1/auth/two-factor/verify`.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      x-arthome-idempotency-exemption: |
        **Seule écriture des deux contrats sans `Idempotency-Key`, et c'est délibéré.** Le régime
        d'idempotence rend la réponse d'origine **verbatim** ; sur une ouverture de session, cela
        reviendrait à **rendre un jeton sans avoir vérifié les justificatifs**. Une clé volée
        deviendrait un porteur de session.

        Les cinq autres routes d'authentification la portent, elles, parce qu'un rejeu y rend la
        réponse d'origine plutôt qu'un `410` ou un second effet — c'est la reprise sûre. Une
        connexion, non : elle doit **toujours** ré-authentifier. La protection contre le
        double-envoi est ici la limitation de débit par `device_id`, pas le magasin d'idempotence.
      security: []
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, mode]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                mode: { $ref: '#/components/schemas/SessionMode' }
                deviceId: { type: [string, 'null'], format: uuid }
            example: { email: marie@example.org, password: 'un-mot-de-passe-long', mode: bearer, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77 }
      responses:
        '200':
          description: Session ouverte, dans le mode demandé.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SessionEstablished' } }
              example:
                servedAt: '2026-09-21T18:00:10.000Z'
                data:
                  mode: bearer
                  accessToken: sess_9f2ac1b4
                  refreshToken: refr_4d77e2
                  expiresAt: '2026-09-28T18:00:10Z'
                  viewerContext:
                    deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                    signedIn: true
                    profiles: []
                    constants: { roomOpensMinutesBefore: 30, cancelDeadlineMinutesBefore: 60, scarcityThresholdBps: 8500, billboardPreviewDelaySec: 4, waitlistPriorityWindowHours: 2, chatRateLimitPerSecond: 6, reactionQuotaPerDate: 20, reminderLeadMinutes: 30, replayExpiryWarningHours: 6 }
                    labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                    taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
        '401':
          description: '`INVALID_CREDENTIALS`, ou `TWO_FACTOR_REQUIRED` avec son `challengeId`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: TWO_FACTOR_REQUIRED, nature: refused, params: { challengeId: chl_7ab2 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:00:10.000Z'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [account]
      summary: Ferme la session courante — et rien d'autre.
      description: |
        **Le piège que cette opération existe pour éviter.** Le `signOut` de la bibliothèque
        d'authentification révoque **toutes** les sessions de l'utilisateur. Sur un téléviseur
        partagé à cinq profils, ce n'est jamais ce qu'on veut : on déconnecterait le salon entier.

        **Deux gestes, deux routes, jamais l'une pour l'autre** :
        - **celle-ci** ferme la session courante ;
        - **`DELETE /v1/me/device-sessions/{sessionId}`** déconnecte **un profil** d'un appareil
          (`multi-session.revoke`), les autres comptes restant connectés ;
        - **`DELETE /v1/me/devices/{deviceId}`** supprime l'appareil, toutes ses sessions **et ses
          baux de lecture**.

        **L'ordre compte en mode `bearer`** : la session est détruite côté serveur **puis** le
        client efface son magasin natif. Effacer le magasin n'est pas révoquer. En mode `cookie`,
        le cookie est effacé **avec exactement les attributs qui l'ont posé** — sans quoi il n'est
        pas effacé.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Session close. Rejouée, elle réussit.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { signedOut: { type: boolean } } }
              example:
                servedAt: '2026-09-21T23:00:00.000Z'
                data: { signedOut: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/forget-password:
    post:
      operationId: requestPasswordReset
      tags: [account]
      summary: Demande un lien de réinitialisation.
      description: |
        **Répond toujours `202`, que le compte existe ou non.** Distinguer les deux dirait à un
        attaquant quels courriels sont inscrits.

        **Le lien du courriel pointe la surface, jamais l'API** — `arthome.fr/reset?token=…` — et
        donc **par produit et par langue**. Le défaut de la bibliothèque le construit depuis sa
        propre adresse de base et mènerait la personne sur une API.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                locale: { type: string, examples: [fr] }
            example: { email: marie@example.org, locale: fr }
      responses:
        '202':
          description: Demande prise en compte — la réponse est la même dans les deux cas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { accepted: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:01:00.000Z'
                data: { accepted: true }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [account]
      summary: Pose un nouveau mot de passe depuis un jeton de réinitialisation.
      description: |
        **N'ouvre pas de session.** La personne se reconnecte, ce qui garantit que le nouveau mot
        de passe fonctionne et évite qu'un lien de courriel devienne un porteur de session.
        Le jeton est à usage unique et de courte durée.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
            example: { token: rst_9f2ac1, password: 'un-nouveau-mot-de-passe' }
      responses:
        '200':
          description: Mot de passe changé. **Toutes les autres sessions sont révoquées** — un mot de passe changé après un vol doit fermer la porte.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { changed: { type: boolean }, otherSessionsRevoked: { type: integer } } }
              example:
                servedAt: '2026-09-21T18:02:00.000Z'
                data: { changed: true, otherSessionsRevoked: 3 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/auth/social/{provider}/start:
    post:
      operationId: startSocialSignIn
      tags: [account]
      summary: Démarre une connexion sociale — les surfaces ne parlent jamais au fournisseur.
      description: |
        **Le client OAuth est confidentiel et côté serveur.** Aucune application n'embarque de
        secret : c'est la seule forme défendable sur un binaire distribué, et la redirection est
        enregistrée **une fois par fournisseur**, sur le domaine du BFF.

        **Le lien profond de retour ne porte jamais le jeton.** Il ne porte qu'un **état opaque à
        usage unique**, que l'application échange ensuite contre son jeton en TLS direct avec le
        BFF (`/v1/auth/exchange`). L'URL de retour transite par le système, peut être journalisée,
        et peut être ouverte par une autre application.

        **Par surface** : les navigateurs suivent une redirection ordinaire ; les coquilles
        natives ouvrent le **navigateur système**, jamais leur WebView, et reviennent par lien
        universel. **Le téléviseur ne fait pas d'OAuth** : il passe par l'appairage, intention
        `signin`.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, facebook] }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: '#/components/schemas/SessionMode' }
                deviceId: { type: [string, 'null'], format: uuid }
                returnPath:
                  type: [string, 'null']
                  description: |
                    Chemin **relatif** de retour dans la surface. Une adresse absolue est refusée :
                    la liste d'autorisation est faite de **chaînes littérales**, jamais d'un motif.
            example: { mode: bearer, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77, returnPath: /compte }
      responses:
        '200':
          description: L'adresse d'autorisation à ouvrir, et l'état opaque qui reviendra.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [authorizationUrl, state, expiresAt]
                        properties:
                          authorizationUrl: { type: string, format: uri }
                          state: { type: string, description: '**Opaque, à usage unique, de courte durée.** Il ne porte rien de signifiant.' }
                          expiresAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:03:00.000Z'
                data:
                  authorizationUrl: 'https://api.arthome.fr/v1/auth/social/google/redirect?state=ott_9f2ac1'
                  state: ott_9f2ac1
                  expiresAt: '2026-09-21T18:13:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/auth/exchange:
    post:
      operationId: exchangeOneTimeToken
      tags: [account]
      summary: Échange l'état opaque du retour contre une session.
      description: |
        **C'est ce qui rend le parcours rejouable si le système tue l'application pendant le
        détour** : l'état d'attente vit côté serveur, pas en mémoire d'application. Au retour, le
        lien profond dit **où aller**, et cet échange dit **ce qui a changé**.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, mode]
              properties:
                state: { type: string }
                mode: { $ref: '#/components/schemas/SessionMode' }
                deviceId: { type: [string, 'null'], format: uuid }
            example: { state: ott_9f2ac1, mode: bearer, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77 }
      responses:
        '200':
          description: Session ouverte dans le mode demandé.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SessionEstablished' } }
              example:
                servedAt: '2026-09-21T18:03:40.000Z'
                data:
                  mode: bearer
                  accessToken: sess_4d77e2
                  expiresAt: '2026-09-28T18:03:40Z'
                  viewerContext:
                    deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                    signedIn: true
                    profiles: []
                    constants: { roomOpensMinutesBefore: 30, cancelDeadlineMinutesBefore: 60, scarcityThresholdBps: 8500, billboardPreviewDelaySec: 4, waitlistPriorityWindowHours: 2, chatRateLimitPerSecond: 6, reactionQuotaPerDate: 20, reminderLeadMinutes: 30, replayExpiryWarningHours: 6 }
                    labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                    taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/auth/password:
    patch:
      operationId: changePassword
      tags: [account]
      summary: Change le mot de passe depuis le compte.
      description: |
        **Le mot de passe courant est exigé**, et ce n'est pas une formalité : sans lui, une
        session volée suffirait à verrouiller le compte de son propriétaire.

        **Les autres sessions sont révoquées** — c'est le geste qu'on fait quand on soupçonne un
        vol, et le laisser sans effet sur les autres porteurs le viderait de son sens. La session
        courante survit : on ne se déconnecte pas soi-même en changeant son mot de passe.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
                revokeOtherSessions: { type: boolean, default: true }
            example: { currentPassword: 'ancien-mot-de-passe', newPassword: 'un-nouveau-mot-de-passe' }
      responses:
        '200':
          description: Mot de passe changé.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { changed: { type: boolean }, otherSessionsRevoked: { type: integer } } }
              example:
                servedAt: '2026-09-21T18:57:00.000Z'
                data: { changed: true, otherSessionsRevoked: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/two-factor:
    post:
      operationId: enableTwoFactor
      tags: [account]
      summary: Active la double authentification et rend les codes de secours.
      description: |
        **Les codes de secours ne sont rendus qu'ici, une seule fois.** Ils ne sont jamais relus :
        le serveur n'en garde que des empreintes. Une opération qui saurait les redire saurait les
        lire, et ce ne serait plus un second facteur.

        La double authentification est une **précondition** du transfert de propriété d'une
        chaîne côté studio : le contrat le refuse sans elle.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: Réauthentification — c'est une opération sensible. }
            example: { password: 'un-mot-de-passe-long' }
      responses:
        '201':
          description: Secret à enrôler et codes de secours, rendus **une seule fois**.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [otpauthUri, backupCodes]
                        properties:
                          otpauthUri: { type: string }
                          backupCodes: { type: array, items: { type: string } }
              example:
                servedAt: '2026-09-21T18:58:00.000Z'
                data:
                  otpauthUri: 'otpauth://totp/Arthome:marie%40example.org?secret=JBSWY3DP&issuer=Arthome'
                  backupCodes: ['7K2M-9QP4', 'X3N8-2VTR']
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: disableTwoFactor
      tags: [account]
      summary: Désactive la double authentification.
      description: '**Réauthentification exigée** : désactiver un second facteur est exactement ce qu''un voleur de session tenterait en premier.'
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
            example: { password: 'un-mot-de-passe-long' }
      responses:
        '200':
          description: Double authentification désactivée.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { twoFactorEnabled: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:58:30.000Z'
                data: { twoFactorEnabled: false }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/two-factor/verify:
    post:
      operationId: verifyTwoFactor
      tags: [account]
      summary: Répond au défi de double authentification, et ouvre la session.
      description: |
        Suite de `TWO_FACTOR_REQUIRED`. Le `challengeId` est **de courte durée et à usage
        unique** ; un code de secours consommé ne se rejoue pas.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code, mode]
              properties:
                challengeId: { type: string }
                code: { type: string }
                mode: { $ref: '#/components/schemas/SessionMode' }
                deviceId: { type: [string, 'null'], format: uuid }
            example: { challengeId: chl_7ab2, code: '318204', mode: cookie }
      responses:
        '200':
          description: Session ouverte, dans le mode demandé.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SessionEstablished' } }
              example:
                servedAt: '2026-09-21T18:00:25.000Z'
                data:
                  mode: cookie
                  viewerContext:
                    deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                    signedIn: true
                    profiles: []
                    constants: { roomOpensMinutesBefore: 30, cancelDeadlineMinutesBefore: 60, scarcityThresholdBps: 8500, billboardPreviewDelaySec: 4, waitlistPriorityWindowHours: 2, chatRateLimitPerSecond: 10, reactionQuotaPerDate: 20, reminderLeadMinutes: 30, replayExpiryWarningHours: 6 }
                    labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                    taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/me/passkeys:
    post:
      operationId: addPasskey
      tags: [account]
      summary: Enrôle une clé d'accès.
      description: |
        Rend les options d'enrôlement produites par le serveur ; la surface les passe à l'API du
        navigateur ou du système, puis renvoie l'attestation à `PUT`. **Le secret ne quitte jamais
        le matériel.**
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 80 }
            example: { label: 'MacBook de Marie' }
      responses:
        '201':
          description: Options d'enrôlement, à usage unique.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
