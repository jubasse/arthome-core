  /v1/pairings:
    post:
      operationId: createPairing
      summary: Opens a device pairing, for one of the five intents.
      description: |
        **One command, one shape, one state machine, five intents.** The television accepts no input
        beyond six characters: every payment goes through here, therefore through the phone.

        **`signin` is the only true RFC 8628**; the other four are **transaction appointments** —
        buying from an already signed-in television is not a token request. What is shared is the
        state machine; what differs is the effect of approval.

        **For `seat`, the pairing's lifetime is the lifetime of a seat hold placed by `ticketing` at
        creation**: without that hold, the capacity shown on the television is false for five
        minutes — exactly the defect the television reported.

        `signin` opens with the **device token alone**, without a session. The other four require a
        session on the television.

        **A seat pairing goes through the date's sales queue like every other purchase** (D-086).
        While the queue is armed, the television shows it, and `seat` opens only with the admission
        in `X-Arthome-Admission-Token`, since opening is what places the hold; without one it is
        refused with `403` `order.sales_queue_admission_required`. First come, first served, with no
        way around it through the television.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - identity
      - ticketing
      tags:
      - pairing
      security:
      - deviceToken: []
      - bearerToken: []
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/AdmissionToken'
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent:
                  type: string
                  enum:
                  - signin
                  - seat
                  - plan
                  - payment_method
                  - merch
                  x-arthome-vocabulary-source: none
                  x-arthome-vocabulary-reason: A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change.
                deviceId:
                  type: string
                  format: uuid
                payload:
                  type: object
                  properties: {}
                  additionalProperties: {}
                  description: |
                    Depends on the intent and stays **opaque to `identity`**, which relays it to the target
                    service. `identity` knows nothing of seats, plans or payments: it carries an appointment and
                    a pointer.
              required:
              - intent
              - deviceId
            example:
              intent: seat
              deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
              payload:
                dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                tier: full
                quantity: 2
      responses:
        '201':
          description: Pairing opened. The code, the complete QR, the expiry and the polling interval.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DevicePairing'
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:50:00.000Z'
                data:
                  pairingId: 019928f9-0000-7000-8000-000000000001
                  intent: seat
                  userCode: K7M2PQ
                  verificationUri: https://arthome.fr/appairage
                  verificationUriComplete: https://arthome.fr/appairage?code=K7M2PQ
                  expiresAt: '2026-09-21T18:55:00.000Z'
                  pollIntervalSec: 2
                  state: pending
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `order.sales_queue_admission_required`: a `seat` pairing on a date whose sales queue is armed,
            without a valid admission (D-086). The television enters the queue and opens the pairing once
            admitted.

            Also `api.forbidden` when a write with the session cookie lacks its `X-Arthome-Csrf` token, or carries another session's (`CsrfRefused`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: order.sales_queue_admission_required
                  nature: refused
                  params:
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-09-21T18:50:00.000Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/pairings/{pairingId}:
    get:
      operationId: pollPairing
      summary: Polls the outcome of a pairing — and composes the confirmation screen.
      description: |
        **RFC 8628-compliant polling, not the real-time channel.** Bringing a device identity into
        the WebSocket namespace at `signin` time would widen its attack surface to save a few hundred
        milliseconds.

        The requirement "switch within two seconds at most" is met by a **served decay**:
        `pollIntervalSec` is 2 for the first 60 seconds, then 5 — so it stays under the server's
        control, and it costs thirty requests per pairing at most. **The surface never polls faster
        than the interval it is served.**

        **Works with the device token alone**, without a session: that is what allows reattachment
        after the television restarts.

        The response is **complete**: the confirmation screen costs **zero further calls**.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - identity
      - ticketing
      - catalog
      tags:
      - pairing
      security:
      - deviceToken: []
      - bearerToken: []
      - sessionCookie: []
      parameters:
      - name: pairingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The outcome, and what it produced.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PairingOutcome'
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:52:10.000Z'
                data:
                  pairingId: 019928f9-0000-7000-8000-000000000001
                  intent: seat
                  state: approved
                  pollIntervalSec: 5
                  ticket:
                    seatId: 019928f5-0000-7000-8000-000000000001
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    seatCode: ATH-7QK2-4M
                    tier: full
                    state: active
                    date:
                      id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          description: RFC 8628 `slow_down`. The surface **slows down**, it does not retry faster.
          headers:
            Retry-After-Ms:
              $ref: '#/components/headers/RetryAfterMs'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: pairing.slow_down
                  nature: unavailable
                  params:
                    retryAfterMs: 5000
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-09-21T18:52:10.000Z'
    delete:
      operationId: cancelPairing
      summary: Closes a pending pairing.
      description: Triggered by the Back button. The television often leaves without waiting for the response.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - identity
      tags:
      - pairing
      security:
      - deviceToken: []
      - bearerToken: []
      - sessionCookie: []
        csrfToken: []
      parameters:
      - name: pairingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled, or already settled — **a second call returns the original outcome, never an error**.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PairingOutcome'
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:53:00.000Z'
                data:
                  pairingId: 019928f9-0000-7000-8000-000000000001
                  intent: seat
                  state: cancelled
                  pollIntervalSec: 5
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            **`pairing.execution_engaged` — the pairing can no longer be cancelled.** The phone has
            entered the payment journey; cancelling here would orphan a purchase in flight.

            **What the surface does with this refusal**: it **stays on the waiting screen** and keeps
            polling. It does not go back. This is the only case in the contract where pressing Back does
            not go up one level, and the reason is written down: we do not let a remote control cancel a
            payment it triggered itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: pairing.execution_engaged
                  nature: refused
                  params:
                    state: engaged
                    engagedAt: '2026-09-21T18:52:04Z'
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-09-21T18:52:06.000Z'
  /v1/pairings/{pairingId}/engagement:
    post:
      operationId: engagePairing
      summary: Marks the pairing as engaged — on entering the payment journey.
      description: |
        **This operation exists to close a race that costs real money.**

        The sequence without it: the viewer scans the QR, pays on their phone, and presses **Back**
        while the payment is executing. The television sends its `DELETE`; `ticketing` has already
        charged; the decision arrives afterwards and receives `410`. **The seat is paid for, the
        phone shows a failure, the television has gone back, and the money is gone.** The contract
        handled the reverse order — approval then cancellation — and not this one, which is the more
        likely of the two: executing a payment takes seconds, pressing Back is instant.

        **Called by the BFF on the phone's behalf**, at the moment the phone enters the payment
        journey — hence **before** `ticketing` executes, not after. It moves the pairing from
        `pending` to `engaged`, and from then on `cancelPairing` answers `409`.

        **It applies only to the four purchase intents.** `signin` commits no money: a sign-in
        pairing stays cancellable until its decision, and calling this on one is refused.

        **Idempotent**: a second call on an already `engaged` pairing returns the same state, not an
        error — the phone may replay its entry into the journey on a network that switches over.
      x-arthome-maturity: stable
      x-arthome-upstream:
      - identity
      tags:
      - pairing
      security:
      - sessionCookie: []
        csrfToken: []
      - bearerToken: []
      parameters:
      - name: pairingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  description: Optional trace of the engaged journey, for the audit log.
                  type:
                  - string
                  - 'null'
            example: {}
      responses:
        '200':
          description: Pairing engaged, therefore no longer cancellable.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PairingOutcome'
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:52:04.000Z'
                data:
                  pairingId: 019928f9-0000-7000-8000-000000000001
                  intent: seat
                  state: engaged
                  pollIntervalSec: 2
        '403':
          description: |
            `pairing.identity_mismatch`, or `pairing.intent_not_engageable` on `signin`.

            Also `api.forbidden` when a write with the session cookie lacks its `X-Arthome-Csrf` token, or carries another session's (`CsrfRefused`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: pairing.intent_not_engageable
                  nature: refused
                  params:
                    intent: signin
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-09-21T18:52:04.000Z'
        '410':
          $ref: '#/components/responses/Gone'
  /v1/pairings/{pairingId}/decision:
    post:
      operationId: decidePairing
      summary: Approves or denies a pairing, from the phone.
      description: |
        **The ownership guard is written by us, not delegated.** CVE-2026-45337 showed what relaxing
        it costs: the plugin treated any authenticated session as the owner of any pending code.

        Three checks, in this order: the pairing is `pending` **or `engaged`** and not expired — an
        engaged pairing is precisely the one whose decision is awaited; if `intent = signin`, any
        valid session suffices — **that is the nominal case, and it is the very meaning of "add an
        account"**; otherwise, the bearer **is** the profile that opened the pairing, on pain of
        `pairing.identity_mismatch`.

        **No implicit profile switch.** It would charge the wrong payment method, credit the wrong
        rights and deliver the seat to the wrong account — in a living room, at the precise moment
        two people are watching the same screen. The phone offers "switch account": a gesture by the
        person, never by the system.
