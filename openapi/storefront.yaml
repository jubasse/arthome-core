  /v1/resolve:
    get:
      operationId: resolvePublicLink
      tags: [discovery]
      summary: Resolves a canonical URL or a slug to the resource it designates.
      description: |
        **`slug` and `canonicalUrl` were served everywhere and accepted nowhere.** Path identifiers
        are UUIDs; all five occurrences of `slug` were on output. A notification pushed to a dead
        application, a shared link, a bookmark, a search engine result: all of them deliver a
        **URL**, and nothing in the contract knew how to read one.

        The gap went beyond mobile: `canonicalUrl` is what the television encodes in the QR code of
        the **Share** action — on a television, sharing cannot mean copying a link, there is neither
        a useful clipboard nor a messaging app.

        **Resolves, does not redirect.** The response names the type and the identifier, and the
        surface decides where to go: a mobile deep link, a Next route and a television page do not
        have the same destination for the same resource.

        **Public read**: a shared link opens before any sign-in.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      x-arthome-freshness: 300
      security:
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - name: url
          in: query
          description: Full canonical URL. Mutually exclusive with `kind` + `slug`.
          schema: { type: string, format: uri }
        - name: kind
          in: query
          schema: { type: string, enum: [date, show, artist, category], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A screen composition the server decides so that five surfaces do not each decide it differently." }
        - name: slug
          in: query
          schema: { type: string }
      responses:
        '200':
          description: The designated resource, and enough to paint immediately.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
            Vary: { $ref: '#/components/headers/VaryAuth' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [kind, id, canonicalUrl]
                        properties:
                          kind: { type: string, x-arthome-vocabulary: [date, show, artist, category], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A screen composition the server decides so that five surfaces do not each decide it differently." }
                          id: { type: string }
                          canonicalUrl:
                            type: string
                            format: uri
                            description: |
                              **The target's canonical URL**, which may differ from the one requested: a slug in another
                              language, or a replaced slug, resolves to the current form. That is what lets the surface
                              correct its URL rather than keep a stale one bookmarked.
                          date: { $ref: '#/components/schemas/DateCard' }
                          artist: { $ref: '#/components/schemas/ArtistSummary' }
              example:
                servedAt: '2026-09-21T18:02:50.000Z'
                data:
                  kind: date
                  id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  canonicalUrl: 'https://arthome.fr/fr/d/nuit-blanche-2026-09-21'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

