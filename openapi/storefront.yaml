                          registrationOptions: { type: object, additionalProperties: true }
                          expiresAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:59:00.000Z'
                data:
                  registrationOptions: { challenge: 'k7M2pQ', rp: { id: arthome.fr, name: Arthome } }
                  expiresAt: '2026-09-21T19:04:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/passkeys/{passkeyId}:
    delete:
      operationId: removePasskey
      tags: [account]
      summary: Retire une clé d'accès.
      description: '**Refusée si c''est le dernier justificatif du compte** (`LAST_CREDENTIAL`) : un compte sans aucun moyen de connexion est un compte perdu.'
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Clé retirée.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { removed: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:59:30.000Z'
                data: { removed: true }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/viewer-context:
    get:
      operationId: getViewerContext
      tags: [bootstrap]
      summary: L'amorçage — le budget entier de l'écran de démarrage.
      description: |
        **Un seul appel.** Profils de l'appareil, droits, préférences, constantes de domaine,
        version du catalogue de libellés et de la taxonomie. Les libellés eux-mêmes viennent de
        l'instantané embarqué au build : le contrôle de version **ne bloque jamais** le premier
        rendu.

        Si cet appel échoue, la surface doit quand même afficher un message **lisible** — pas un
        code brut, pas un écran vide. C'est ce qui rend l'instantané embarqué obligatoire et pas
        seulement souhaitable.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      x-arthome-freshness: 300
      security:
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ViewerTimezone'
      responses:
        '200':
          description: Contexte du spectateur.
          headers:
            X-Arthome-Served-At: { $ref: '#/components/headers/ServedAt' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ViewerContext' }
              example:
                servedAt: '2026-09-21T18:02:12.400Z'
                data:
                  deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                  signedIn: true
                  currentProfileId: 019928f4-2a11-7000-8000-000000000001
                  profiles:
                    - { id: 019928f4-2a11-7000-8000-000000000001, name: Marie, kind: adult }
                  plan: { tier: pass, state: active, seatDiscountBps: 1000, concurrentStreamsAllowed: 1 }
                  constants:
                    roomOpensMinutesBefore: 30
                    cancelDeadlineMinutesBefore: 60
                    scarcityThresholdBps: 8500
                    billboardPreviewDelaySec: 4
                    waitlistPriorityWindowHours: 2
                    chatRateLimitPerSecond: 2
                    chatCatchUpMessages: 20
                    reactionQuotaPerDate: 20
                    reminderLeadMinutes: 30
                    replayExpiryWarningHours: 6
                    previewSecondsTotal: 300
                    searchExactTotalLimit: 10000
                    creditDelayCode: refund_delay_business_days_3_5
                  labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                  taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
                  realtime: { namespace: /storefront, pulseIntervalSec: 5 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/changes:
    get:
      operationId: listChanges
      tags: [bootstrap]
      summary: Les invalidations survenues depuis un instant — pas les données.
      description: |
        **Une requête au lieu de douze.** Au retour au premier plan, toutes les lectures observées
        se revalident en même temps ; un écran de compte en affiche une demi-douzaine, une page de
        catégorie autant. Refuser cette rafale, c'est refuser l'ouverture de l'application.

        C'est aussi le chemin par lequel le storefront apprend ce qu'il **n'a pas causé** — Kafka
        étant interdit hors inter-services, c'est le seul possible. Pour le rendu serveur de Next,
        les mêmes étiquettes alimentent `revalidateTag` : elles sont **nommées par le contrat**,
        jamais inventées par une surface.
      x-arthome-maturity: stable
      x-arthome-upstream: [realtime]
      # Ce flux n'interroge AUCUN service : il lit le tampon de reprise Redis que la passerelle
      # temps réel tient déjà par salle (30 min / 5 000 événements). C'est le tirage HTTP du même
      # flux que le canal pousse. Le déclarer sur quatre services décrivait une composition qui
      # n'a pas lieu, et l'aurait fait compter comme un écran à quatre appels.
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - name: since
          in: query
          required: true
          description: Le `servedAt` de la dernière réponse connue du client.
          schema: { type: string, format: date-time }
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [profile, device] , default: profile }
      responses:
        '200':
          description: Liste d'invalidations.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/ChangeFeed' }
              example:
                servedAt: '2026-09-21T20:44:02.010Z'
                data:
                  invalidated: ['date:019928a0-7d31-7a10-b8c4-2f9e11a4c001', 'account:tickets']
                  complete: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # =============================================================== découverte

  /v1/home:
    get:
      operationId: getHomeScreen
      tags: [discovery]
      summary: Billboard et rangées, composés et ordonnés par le serveur.
      description: |
        **Un appel.** Dix à treize rangées, six à huit cartes visibles chacune, curseur par
        rangée : 60 à 100 cartes, de l'ordre de 50 à 90 Ko bruts, sous 15 Ko une fois compressés.

        Le BFF compose ce modèle avec **trois surcouches par spectateur, groupées par lot
        d'identifiants** — jamais un appel par carte. En régime établi, le cache Redis par profil
        (TTL 30 s) ramène l'écran à un ou deux appels internes.

        **Lecture publique.** Appelée **sans aucune authentification**, cette opération rend le
        **corps public** — identique pour tous les appelants anonymes, donc mutualisable dans un
        cache partagé. Les trois surcouches par spectateur (`watchVerdict`, `viewerRelations`,
        `viewerProgress`) sont alors **absentes**, jamais nulles. Appelée avec une session ou un
        jeton porteur, elle rend le corps public **plus** les surcouches, et devient privée.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog, ticketing, identity, streaming]
      security:
        # **Lecture publique.** L'absence totale d'authentification est un cas NOMINAL, pas une
        # erreur : cette lecture est la face indexable du produit, et le robot d'un moteur n'a ni
        # cookie, ni jeton porteur, ni moyen de s'en fabriquer un. Le mode visiteur emprunte le
        # même chemin. Voir « Lecture publique et lecture identifiée » en tête de document.
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      x-arthome-freshness: 60
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ViewerTimezone'
      responses:
        '200':
          description: Accueil.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControlPublic' }
            Vary: { $ref: '#/components/headers/VaryAuth' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data: { $ref: '#/components/schemas/HomeScreen' }
              example:
                servedAt: '2026-09-21T18:02:13.900Z'
                validUntil: '2026-09-21T18:03:13.900Z'
                lastEventSeq: 918233
                degraded: []
                data:
                  billboard:
                    previewStartsAfterSec: 4
                    date:
                      id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                      showId: 019928a0-7d31-7a10-b8c4-2f9e11a4c111
                      channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                      slug: nuit-blanche-2026-09-21
                      canonicalUrl: 'https://arthome.fr/fr/d/nuit-blanche-2026-09-21'
                      title: Nuit blanche
                      startsAt: '2026-09-21T19:00:00Z'
                      venueClock: { venueTimezone: Europe/Paris, venueUtcOffsetMin: 120 }
                      runtimeMin: 95
                      roomOpensAt: '2026-09-21T18:30:00Z'
                      displayState: live
                      displayStateValidUntil: '2026-09-21T20:35:00Z'
                      replay: { policy: included, windowHours: 72 }
                      rights: { scope: worldwide, blackoutCountries: [] }
                      media: { wide: [], poster: [] }
                      viewers: 1842
                  rails:
                    - id: resume
                      titleCode: home.rail.resume
                      kind: resume
                      items: []
                      nextCursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/live:
    get:
      operationId: getLiveScreen
      tags: [discovery]
      summary: Le direct du moment et la grille du soir, groupée à l'heure locale du spectateur.
      description: |
        **Un appel**, et le regroupement horaire est **serveur** : il dépend du fuseau du
        spectateur, que la surface envoie en en-tête. Un groupement côté client serait groupé cinq
        fois différemment, et le rendu serveur de Next ne connaît pas le fuseau du visiteur.

        **Lecture publique.** Appelée **sans aucune authentification**, cette opération rend le
        **corps public** — identique pour tous les appelants anonymes, donc mutualisable dans un
        cache partagé. Les trois surcouches par spectateur (`watchVerdict`, `viewerRelations`,
        `viewerProgress`) sont alors **absentes**, jamais nulles. Appelée avec une session ou un
        jeton porteur, elle rend le corps public **plus** les surcouches, et devient privée.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog, ticketing, streaming, identity]
      security:
        # **Lecture publique.** L'absence totale d'authentification est un cas NOMINAL, pas une
        # erreur : cette lecture est la face indexable du produit, et le robot d'un moteur n'a ni
        # cookie, ni jeton porteur, ni moyen de s'en fabriquer un. Le mode visiteur emprunte le
        # même chemin. Voir « Lecture publique et lecture identifiée » en tête de document.
        - {}
        - sessionCookie: []
        - bearerToken: []
        - deviceToken: []
      x-arthome-freshness: 15
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/ViewerTimezone'
