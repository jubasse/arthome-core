                      dates: []
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/categories:
    get:
      operationId: listCategories
      tags: [discovery]
      summary: The 21 disciplines, with family, rank and counts.
      description: |
        **One call, not one per tile.** The editorial rank is authoritative and **no surface
        reorders**. The full taxonomy is not here: it is an **immutable versioned artefact** served
        by the CDN, referenced in `ViewerContext`.

        **Public read.** Called **with no authentication at all**, this operation returns the
        **public body** — identical for every anonymous caller, hence shareable in a common
        cache. The three per-viewer overlays (`watchVerdict`, `viewerRelations`,
        `viewerProgress`) are then **absent**, never null. Called with a session or a bearer
        token, it returns the public body **plus** the overlays, and becomes private.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
