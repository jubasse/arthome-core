            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          registrationOptions: { type: object, additionalProperties: true }
                          expiresAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:59:00.000Z'
                data:
                  registrationOptions: { challenge: 'k7M2pQ', rp: { id: arthome.fr, name: Arthome } }
                  expiresAt: '2026-09-21T19:04:00Z'
