        '200':
          description: Page of dates set aside.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/DateCard' } }
                      page: { $ref: '#/components/schemas/CursorPageInfo' }
              example:
                servedAt: '2026-09-21T18:57:00.000Z'
                items: []
                page: { hasMore: false }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/watchlist/{dateId}:
    put:
      operationId: addToWatchlist
      tags: [account]
      summary: Sets a date aside.
      description: |
        **A state assignment, not a toggle.** Two submissions of the same gesture leave a single
        entry; a toggle on an unreliable network would invert the result. Returns the updated card,
        so the surface repaints without a second round trip.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      x-arthome-invalidates: ['home:rails']
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The updated card.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/DateCard' } }
              example:
                servedAt: '2026-09-21T18:57:20.000Z'
                data: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, displayState: live, viewerRelations: { inWatchlist: true, reminderSet: false, followsArtist: false } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: removeFromWatchlist
      tags: [account]
      summary: Removes a date from my list.
      description: Replayed on an already-removed entry, it **succeeds** — an idempotent deletion must not fail.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The updated card.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/DateCard' } }
              example:
                servedAt: '2026-09-21T18:57:40.000Z'
                data: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, displayState: live, viewerRelations: { inWatchlist: false, reminderSet: false, followsArtist: false } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/follows:
    get:
      operationId: listFollowedArtists
      tags: [account]
      summary: Followed artists — the "Following" page, which had no entry point.
      description: |
        **The whole page was unserved.** `/v1/me/follows/{artistId}` exposed only `PUT` and
        `DELETE`, `/v1/artists` accepted no filter on following, and `AccountScreen` carried no list.
        The only way to paint the screen was to walk `/v1/artists` in full and filter client-side —
        that is, exactly what the contract forbids elsewhere, and rightly so.

        **The home page's `followed` rail was no substitute**: it carries `DateCard`s, hence
        announced dates, whereas half of this page is made of followed artists **with no date** — and
        it has no sort, no remove-in-place, and no empty states of its own.

        The contract in fact contradicted itself: `emptyReason` carried `no_followed_artist_live`,
        **an empty state for a list no operation produced**.

        It also serves `account/faves`, of whose two collections this is the first — the second being
        `/v1/me/watchlist`.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, catalog, notifications]
      x-arthome-freshness: 60
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: sort
          in: query
          schema: { type: string, enum: [alpha, followers, next_date], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A sort or filter key. It is a property of THIS endpoint's list — which orders it offers — not of the domain, and adding one is an endpoint change rather than a vocabulary change.", default: next_date }
        - name: liveOnly
          in: query
          description: '**The "Following live" section**, served rather than filtered client-side.'
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: |
            Page of followed artists. Each carries `alertEnabled` — **following and being alerted are two
            settings** — and `nextDate` when there is one, which gives the split the screen displays
            without a call per artist.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/ArtistSummary' } }
                      page: { $ref: '#/components/schemas/CursorPageInfo' }
              example:
                servedAt: '2026-09-21T18:58:40.000Z'
                items:
                  - id: 019928a0-7d31-7a10-b8c4-2f9e11a4c333
                    channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                    name: Compagnie Verticale
                    categoryId: dance-contemporary
                    followers: 4120
                    isLiveNow: true
                    followedByViewer: true
                    alertEnabled: true
                page: { hasMore: false, emptyReason: no_followed_artist, emptyActionCode: browse_artists }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/me/follows/{artistId}:
    put:
      operationId: followArtist
      tags: [account]
      summary: Follows an artist.
      description: |
        **Following and being alerted are two settings.** `followArtist` is a catalogue relation; the
        alert is a flag **per followed artist** carried by `notifications` (`alertEnabled` below).
        Conflating them would make it impossible to follow an artist without being notified — and the
        mobile design shows the two separately.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, notifications]
      x-arthome-invalidates: ['home:rails']
      parameters:
        - $ref: '#/components/parameters/ArtistId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                alertEnabled: { type: boolean, default: false }
            example: { alertEnabled: true }
      responses:
        '200':
          description: The updated artist.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ArtistSummary' } }
              example:
                servedAt: '2026-09-21T18:58:00.000Z'
                data: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c333, channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222, name: Compagnie Verticale, categoryId: dance-contemporary, followedByViewer: true }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: unfollowArtist
      tags: [account]
      summary: Unfollows an artist.
      description: |
        **A state assignment, not a toggle.** Returns the updated artist, so the surface repaints
        without a second round trip. It does not touch the alert flag, which is a distinct setting
        carried by `notifications`.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/ArtistId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The updated artist.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ArtistSummary' } }
              example:
                servedAt: '2026-09-21T18:58:20.000Z'
                data: { id: 019928a0-7d31-7a10-b8c4-2f9e11a4c333, channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222, name: Compagnie Verticale, categoryId: dance-contemporary, followedByViewer: false }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/reminders/{dateId}:
    put:
      operationId: setReminder
      tags: [account]
      summary: Sets a dated reminder on a date.
      description: |
        **A reminder is a dated promise.** If the date is postponed, the reminder **follows** the
        postponement; if it is cancelled, the reminder is **cancelled** and not sent into the void.
        The lead time (30 min) is a **served** domain constant, not a surface choice.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Reminder set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          reminderSet: { type: boolean }
                          remindAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:59:00.000Z'
                data: { reminderSet: true, remindAt: '2026-09-21T18:30:00Z' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: clearReminder
      tags: [account]
      summary: Clears the reminder.
      description: |
        Clears the reminder. Replayed on an already-cleared reminder, it succeeds — it is queued
        offline, so it must be safe on replay.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Reminder cleared.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { reminderSet: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:59:20.000Z'
                data: { reminderSet: false }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/saved-searches:
    get:
      operationId: listSavedSearches
      tags: [account]
      summary: My saved searches, with their new-match counter.
      description: |
        **Zero counting queries on opening.** The "new since your last visit" counter is incremented
        by the index's percolator when a new date matches, and reset to zero on read. The two other
        options would cost ten aggregations per display, for a figure whose accuracy nobody will ever
        measure.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      x-arthome-freshness: 300
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The saved searches.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/SavedSearch' } }
              example:
                servedAt: '2026-09-21T19:00:00.000Z'
                items:
                  - id: 019928fa-0000-7000-8000-000000000001
                    scope: search
                    name: Danse à Paris
                    criteria: { categoryIds: [dance-contemporary], cityIds: [paris] }
                    criteriaVersion: 2
                    criteriaSignature: 7f3a1c
                    stale: false
                    channels: [push]
                    active: true
                    newMatchesSinceLastVisit: 3
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createSavedSearch
      tags: [account]
      summary: Saves a search.
      description: |
        The **signature** is produced by `normalizeSearchCriteria()` in `@arthome/core`,
        server-side, once. It is what deduplicates: a replay **never** creates two identical
        alerts.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, criteria]
              properties:
                scope: { type: string, enum: [search, category], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change." }
                categoryId: { type: [string, 'null'] }
                name: { type: [string, 'null'], maxLength: 80 }
                queryText: { type: [string, 'null'] }
                criteria: { type: object, additionalProperties: true }
                channels: { type: array, items: { type: string, enum: [push, email, in_app], x-arthome-vocabulary-source: NOTIFICATION_CHANNELS } }
            example:
              scope: search
              name: Danse à Paris
              criteria: { categoryIds: [dance-contemporary], cityIds: [paris] }
              channels: [push]
      responses:
        '201':
          description: Search saved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SavedSearch' } }
              example:
                servedAt: '2026-09-21T19:00:20.000Z'
                data: { id: 019928fa-0000-7000-8000-000000000001, scope: search, name: Danse à Paris, criteria: {}, criteriaVersion: 2, criteriaSignature: 7f3a1c, channels: [push], active: true, newMatchesSinceLastVisit: 0 }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me/saved-searches/{savedSearchId}:
    patch:
      operationId: updateSavedSearch
      tags: [account]
      summary: Renames, activates, or changes the channels of a saved search.
      description: |
        **Field-by-field** write, never a whole document. A saved search is queued offline: a replay
        must converge to the same state, not invert it.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - name: savedSearchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: '**Field-by-field** write, never a whole document.'
              properties:
                name: { type: [string, 'null'] }
                active: { type: boolean }
                channels: { type: array, items: { type: string, enum: [push, email, in_app], x-arthome-vocabulary-source: NOTIFICATION_CHANNELS } }
            example: { active: false }
      responses:
        '200':
          description: The updated search.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SavedSearch' } }
              example:
                servedAt: '2026-09-21T19:01:00.000Z'
                data: { id: 019928fa-0000-7000-8000-000000000001, scope: search, criteria: {}, criteriaVersion: 2, criteriaSignature: 7f3a1c, channels: [push], active: false, newMatchesSinceLastVisit: 0 }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSavedSearch
      tags: [account]
      summary: Deletes a saved search.
      description: '**Replayed on an already-deleted entry, it succeeds** — that is what an offline queue requires.'
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - name: savedSearchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { deleted: { type: boolean } } }
              example:
                servedAt: '2026-09-21T19:01:20.000Z'
                data: { deleted: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/orders:
    get:
      operationId: listMyOrders
      tags: [account]
      summary: My orders, including the reflection of orders placed with a third party.
      description: |
        An order may **not be ours**. `externalRef` is served **with its age**: what we guarantee is
        freshness as of `syncedAt`, nothing more. When the external host does not answer, the age
        grows — **nothing fails**.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      x-arthome-freshness: 300
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of orders.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            order: { $ref: '#/components/schemas/Order' }
                            external: { $ref: '#/components/schemas/ExternalOrderRef' }
                      page: { $ref: '#/components/schemas/CursorPageInfo' }
              example:
                servedAt: '2026-09-21T19:02:00.000Z'
                items:
                  - external: { externalRef: 'SHOP-9912', externalHost: 'boutique.compagnie-verticale.fr', state: external, syncedAt: '2026-09-20T22:14:00Z', syncSource: shopify }
                page: { hasMore: false, emptyReason: no_order_yet, emptyActionCode: browse_shop }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/notifications:
    get:
      operationId: listNotifications
      tags: [account]
      summary: The notification centre, and the global badge.
      description: |
        The `unreadCount` badge is **global**, not the page's: otherwise the surface would display
        "3" having loaded only the last twenty.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      x-arthome-freshness: 60
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of notifications, plus the **global** unread count — not the page's.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page, unreadCount]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/NotificationEntry' } }
                      unreadCount: { type: integer }
                      page: { $ref: '#/components/schemas/CursorPageInfo' }
              example:
                servedAt: '2026-09-21T19:03:00.000Z'
                unreadCount: 2
                items: [{ id: 019928fb-0000-7000-8000-000000000001, triggerCode: date_starts_soon, params: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001 }, createdAt: '2026-09-21T18:30:00Z', read: false }]
                page: { hasMore: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: markNotificationsRead
      tags: [account]
      summary: Marks notifications as read.
      description: '**Monotonic: one does not un-read.** Replayed, it changes nothing — which is what makes it safe in an offline queue.'
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notificationIds: { type: array, items: { type: string, format: uuid } }
                all: { type: boolean, default: false }
            example: { all: true }
      responses:
        '200':
          description: Badge updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { unreadCount: { type: integer } } }
              example:
                servedAt: '2026-09-21T19:03:20.000Z'
                data: { unreadCount: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/profile:
    patch:
      operationId: updateProfile
      tags: [account]
      summary: Changes the displayed identity.
      description: '**Field by field**, never a whole document, and conditioned on `expectedVersion`: two devices do not silently overwrite each other.'
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      x-arthome-invalidates: ['account:profile']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                displayName: { type: string, maxLength: 80 }
                publicHandle: { type: string, pattern: '^@[a-z0-9._-]{3,30}$' }
                city: { type: [string, 'null'] }
            example: { expectedVersion: 7, displayName: 'Marie J.' }
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      version: { type: integer }
                      data: { type: object, additionalProperties: true }
              example:
                servedAt: '2026-09-21T19:04:00.000Z'
                version: 8
                data: { displayName: 'Marie J.', publicHandle: '@marie.j' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me/preferences:
    patch:
      operationId: updatePreferences
      tags: [account]
      summary: Writes a preference, at its scope.
      description: |
        **Two scopes, and the contract separates them field by field**: `account` follows the
        person, `device` follows the device and the room. A single scope would be wrong half the
        time.

        **Additive and tolerant**: a key unknown to one version of the application is neither
        rejected nor erased on the next write — otherwise the mobile version stuck in store review
        would overwrite settings made from the web.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account: { type: object, additionalProperties: true }
                device: { type: object, additionalProperties: true }
                deviceId: { type: [string, 'null'], format: uuid }
            example: { device: { subtitleSizeStep: 2, reduceMotion: true }, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77 }
      responses:
        '200':
          description: Preferences updated, both scopes served together.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ViewerPreferences' } }
              example:
                servedAt: '2026-09-21T19:04:30.000Z'
                data:
                  account: { interfaceLocale: fr, readingTimezone: Europe/Paris }
                  device: { subtitleSizeStep: 2, reduceMotion: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/notification-preferences:
    patch:
      operationId: updateNotificationPreferences
      tags: [account]
      summary: Five triggers, three channels, and quiet hours.
      description: |
        **The quiet-hours exception is conditioned on holding a seat**: that is a business rule, not
        an interface setting — one does not miss a show one paid for because it starts at 11:15 pm.
        The **thresholds** that fire an alert live in `@arthome/core` and are served in
        `ViewerContext`; `notifications` reads them, it does not invent them.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                triggers:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string, enum: [push, email, in_app], x-arthome-vocabulary-source: NOTIFICATION_CHANNELS }
                quietHours:
                  type: object
                  properties:
                    enabled: { type: boolean }
                    fromHour: { type: integer, minimum: 0, maximum: 23 }
                    toHour: { type: integer, minimum: 0, maximum: 23 }
                    bypassWhenTicketHeld: { type: boolean }
            example: { triggers: { date_starts_soon: [push] }, quietHours: { enabled: true, fromHour: 23, toHour: 9, bypassWhenTicketHeld: true } }
      responses:
        '200':
          description: Notification preferences updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/NotificationPreferences' } }
              example:
                servedAt: '2026-09-21T19:05:00.000Z'
                data: { triggers: { date_starts_soon: [push] }, quietHours: { enabled: true, fromHour: 23, toHour: 9, bypassWhenTicketHeld: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/consents:
    put:
      operationId: updateConsents
      tags: [account]
      summary: Records consents, timestamped and versioned by the server.
      description: |
        **Never queued offline**: a consent has evidential value, it must be timestamped **by the
        server** and carry the **version of the text accepted**. A consent without a version or a
        date is worth nothing. `ads` defaults to `false`, and that default is **a contract
        decision**, not a setting.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purposes, textVersion]
              properties:
                purposes:
                  type: object
                  required: [audience, perso, partners, ads]
                  properties:
                    audience: { type: boolean }
                    perso: { type: boolean }
                    partners: { type: boolean }
                    ads: { type: boolean }
                cookieCategories: { type: object, additionalProperties: { type: boolean } }
                textVersion: { type: integer }
            example: { purposes: { audience: true, perso: true, partners: false, ads: false }, textVersion: 3 }
      responses:
        '200':
          description: Consents recorded, with the server timestamp.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Consents' } }
              example:
                servedAt: '2026-09-21T19:05:30.000Z'
                data: { purposes: { audience: true, perso: true, partners: false, ads: false }, textVersion: 3, recordedAt: '2026-09-21T19:05:30Z' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/me/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [account]
      summary: Revokes a device — and cuts its playback.
      description: |
        **An observable effect on the targeted device, within 120 seconds at most.** Revoking
        removes the `Device`, **all** its `DeviceSession`s **and its playback leases**: `identity`
        publishes `device_revoked`, `streaming` consumes it and refuses the **next renewal** of the
        token. The device displays `SIGNED_OUT_ELSEWHERE`, **not a network error**.

        **Never queued offline**: this is a security command, it must fail loudly rather than be
        replayed blind.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      x-arthome-invalidates: ['account:devices']
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: |
            Device revoked. `playbackCutWithinSec` states how long playback **actually** takes to
            stop.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
                          playbackCutWithinSec:
                            type: integer
                            description: |
                              **120, not 60.** Revocation does not revoke the token in hand: it **refuses the next
                              renewal**. The CDN's prefix signature expires with the token, so the edge keeps serving valid
                              segments for the whole lifetime of the token held — that is, up to **120 s**, in the case
                              where it has just been renewed at the instant of revocation. In steady state: 45 to 75 s.

                              The 60 served until now was the **renewal interval** presented as a guarantee of stopping.
                              That was rule 15 violated on a security constant, and the plausible number had been kept
                              because it satisfied the question that was asked.
                            examples: [120]
              example:
                servedAt: '2026-09-21T19:06:00.000Z'
                data: { devices: [], playbackCutWithinSec: 120 }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/device-sessions/{sessionId}:
    delete:
      operationId: signOutProfile
      tags: [account]
      summary: Signs one profile out of this device — the others stay signed in.
      description: |
        **Two gestures, and they do not do the same thing.** This one closes a `DeviceSession`: the
        living-room television keeps its four other profiles. `revokeDevice` removes the device and
        everything attached to it.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The updated context, with the remaining profiles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ViewerContext' } }
              example:
                servedAt: '2026-09-21T19:06:30.000Z'
                data:
                  deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                  signedIn: true
                  profiles: []
                  constants: { roomOpensMinutesBefore: 30, cancelDeadlineMinutesBefore: 60, scarcityThresholdBps: 8500, billboardPreviewDelaySec: 4, waitlistPriorityWindowHours: 2, chatRateLimitPerSecond: 2, reactionQuotaPerDate: 20, reminderLeadMinutes: 30, replayExpiryWarningHours: 6 }
                  labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                  taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/exports:
    post:
      operationId: requestExport
      tags: [account]
      summary: Requests an export — personal data or invoices.
      description: |
        **Asynchronous.** A tax ledger or a GDPR export is not an HTTP response: the command returns
        an acknowledgement and an identifier, the state is pollable, and the document arrives through
        a short-lived signed address — **usable without a session cookie**, because an export
        protected by a cookie is undownloadable from a native shell.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, ticketing]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [personal_data, invoices], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A document or export format. It names an accounting tool or a file type, which is the outside world's vocabulary rather than ours." }
                fromDate: { type: [string, 'null'], format: date }
                toDate: { type: [string, 'null'], format: date }
            example: { kind: invoices, fromDate: '2026-01-01', toDate: '2026-09-21' }
      responses:
        '202':
          description: Request accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ExportRequest' } }
              example:
                servedAt: '2026-09-21T19:07:00.000Z'
                data: { exportId: 019928fc-0000-7000-8000-000000000001, kind: invoices, state: queued, requestedAt: '2026-09-21T19:07:00Z' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/me/exports/{exportId}:
    get:
      operationId: getExport
      tags: [account]
      summary: The state of an export, and its signed address once ready.
      description: |
        An export is an **asynchronous job**. Until it is `ready`, `downloadUrl` is null: the
        contract never serves an address that would not answer. The address is valid for 60 minutes
        and works **without a session cookie**.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, ticketing]
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The state, and the address once ready (valid 60 min).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ExportRequest' } }
              example:
                servedAt: '2026-09-21T19:12:00.000Z'
                data:
                  exportId: 019928fc-0000-7000-8000-000000000001
                  kind: invoices
                  state: ready
                  requestedAt: '2026-09-21T19:07:00Z'
                  downloadUrl: 'https://files.arthome.fr/exports/019928fc?sig=abc'
                  downloadExpiresAt: '2026-09-21T20:12:00Z'
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/me/deletion:
    post:
      operationId: requestAccountDeletion
      tags: [account]
      summary: Requests deletion of the account.
      description: |
        **A financial command as much as a personal one.** "Deletion cancels unused seats": it
        therefore triggers refunds, touches payouts that may already be computed, and runs into the
        ten-year accounting retention. It **can be neither synchronous nor total**.

        The sequence is a **persistent saga**: the account moves to `deletion_requested`, sign-ins
        are blocked, `ticketing` cancels and refunds, `payouts` recomputes; a **30-day grace period**
        runs, during which the account is **reactivated by simply signing in** — which is what makes
        the irreversible acceptable; at the end, `identity` **anonymises** instead of deleting.
        Invoices keep their frozen contents.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmHandle]
              properties:
                confirmHandle: { type: string }
            example: { confirmHandle: '@marie.j' }
      responses:
        '202':
          description: Request recorded, with the end of the grace period.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          state: { type: string }
                          graceUntil: { type: string, format: date-time }
                          cancelledSeatsCount: { type: integer }
              example:
                servedAt: '2026-09-21T19:13:00.000Z'
                data: { state: requested, graceUntil: '2026-10-21T19:13:00Z', cancelledSeatsCount: 2 }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: cancelAccountDeletion
      tags: [account]
      summary: Cancels the deletion request during the grace period.
      description: |
        The account is **reactivated by simply signing in** during the 30 days of grace, and that is
        exactly what makes the irreversible acceptable. What this command **does not undo**: seats
        already cancelled and refunded. The contract says so rather than letting anyone assume
        otherwise.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Deletion cancelled. Seats already refunded do not come back — the contract says so rather than letting anyone assume otherwise.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { state: { type: string } } }
              example:
                servedAt: '2026-09-25T10:00:00.000Z'
                data: { state: active }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/support/requests:
    post:
      operationId: contactSupport
      tags: [account]
      summary: Opens a support request, with its context.
      description: |
        **The topic routes, the context prioritises.** "Requests related to a live show in progress
        are handled first": without attached context — date, seat, order — that prioritisation is
        impossible to honour, and the copy promises something the system cannot do.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, message]
              properties:
                topic:
                  type: string
                  enum: [ticketing_refund, playback_quality, replay, store_shipping, account_signin, personal_data]
                  x-arthome-vocabulary-source: none
                  x-arthome-vocabulary-reason: "An account-management shape, local to this endpoint: what the person asked for, not a fact the domain reasons about."
                message: { type: string, minLength: 10, maxLength: 4000 }
                context:
                  type: object
                  properties:
                    dateId: { type: [string, 'null'], format: uuid }
                    seatId: { type: [string, 'null'], format: uuid }
                    orderId: { type: [string, 'null'], format: uuid }
                    traceId: { type: [string, 'null'] }
            example:
              topic: playback_quality
              message: "L'image se fige toutes les deux minutes depuis le début."
              context: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
      responses:
        '202':
          description: Request opened, with its reference and its priority computed server-side.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          requestId: { type: string, format: uuid }
                          reference: { type: string }
                          priorityCode: { type: string }
              example:
                servedAt: '2026-09-21T19:14:00.000Z'
                data: { requestId: 019928fd-0000-7000-8000-000000000001, reference: SUP-2026-0912, priorityCode: live_in_progress }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: arthome_session
      description: |
        Opaque `better-auth` session, carried by an `HttpOnly`/`Secure`/`SameSite=Lax` cookie. This
        is the form chosen for `storefront-web`, which renders on the server and whose cached
        functions can read neither cookie nor header on the static render path.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        The same session, carried in `Authorization: Bearer` by `better-auth`'s `bearer` plugin
        (`set-auth-token` header on return). This is the form chosen for `storefront-mobile` and
        `storefront-tv`, kept in the native store (Keychain / Keystore), **never in
        `localStorage`**.
    deviceToken:
      type: apiKey
      in: header
      name: X-Arthome-Device-Token
      description: |
        ES256 JWT, `aud: "arthome.device"`, 180 days, **rotated on every use**, carrying `device_id`
        and nothing else. Obtained on first launch through `registerDevice`, **before any session**.
        It is not a session: it opens only pairing, pairing polling and the public bootstrap, and
        **opens no personal data** — in particular not the real-time channel (`adr-auth.md` §4/Q3,
        §5.3).

  parameters:

    Traceparent:
      name: traceparent
      in: header
      required: false
      description: |
        W3C trace context. Created by the surface when it can, otherwise by the BFF. It is
        propagated to the service and injected into `outbox_event.tracecontext` **at write time**:
        injected later, the link is definitively lost.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
        examples: ['00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01']

    Surface:
      name: X-Arthome-Surface
      in: header
      required: true
      description: |
        The calling surface. It determines three **served** things, never guessed: the chat rate
        ceiling (television 2 msg/s, mobile 6, web 10), the size of the catch-up on entering a room
        (television 20 messages, 50 elsewhere) and which slice of the label and taxonomy catalogue to
        load.
        **A strict narrowing of `SURFACES`, and the strictness is the point.** The domain
        vocabulary has six members; this header accepts the three that can legitimately call the
        storefront BFF and **refuses the rest**, because an input is refused where an output is kept
        raw and treated as neutral. A studio surface reaching this header is not a value to tolerate,
        it is a caller in the wrong place.
      schema:
        type: string
        enum: [storefront_web, storefront_mobile, storefront_tv]
        x-arthome-vocabulary-source: SURFACES
        x-arthome-vocabulary-narrowing: "The three that may call the storefront BFF. A studio surface reaching this header is not a value to tolerate, it is a caller in the wrong place."
        examples: [storefront_tv]

    ViewerTimezone:
      name: X-Arthome-Timezone
      in: header
      required: false
      description: |
        The viewer's IANA timezone, when the surface knows it. The server groups tonight's grid **in
        the viewer's local time**: the grouping depends on the timezone, and Next's server rendering
        does not know the visitor's.
      schema:
        type: string
        examples: ['Europe/Paris']

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 **generated by the surface before sending and persisted before sending**. A replayed
        key returns the original response, verbatim, with `Idempotency-Replayed: true` — never a
        duplicate error. Lifetime **24 h**, which covers an offline queue replayed after a night.
        See `architecture/transport.md` §5.4.
      schema:
        type: string
        format: uuid
        examples: ['019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77']

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        **Opaque** cursor, Base64-encoded over `(created_at, id)`. Bidirectional and **independent of
        page size**: changing `limit` between two calls does not invalidate it, which is exactly what
        a screen rotation produces. Valid 24 h.
      schema:
        type: string
        examples: ['eyJjIjoiMjAyNi0wOS0yMVQyMDowMDowMFoiLCJpIjoiMDE5OTI4ZjQifQ']

    CursorDirection:
      name: direction
      in: query
      required: false
      description: Direction of travel. `backward` moves towards the most recent.
      schema:
        type: string
        enum: [forward, backward]
        x-arthome-vocabulary-source: none
        x-arthome-vocabulary-reason: "A sort or filter key. It is a property of THIS endpoint's list — which orders it offers — not of the domain, and adding one is an endpoint change rather than a vocabulary change."
        default: forward

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Requested page size. Display density (`tiles` / `list` on mobile) varies it; the cursor
        survives that.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

    DateId:
      name: dateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        examples: ['019928a0-7d31-7a10-b8c4-2f9e11a4c001']

    ArtistId:
      name: artistId
      in: path
      required: true
      schema: { type: string, format: uuid }

    CategoryId:
      name: categoryId
      in: path
      required: true
      description: '**Stable** discipline identifier, never an array index.'
      schema:
        type: string
        examples: ['dance-contemporary']

  headers:

    ServedAt:
      description: |
        Server instant **of this response**. On a response replayed by idempotency, it differs from
        the body's `servedAt`, which is the first attempt's: a replay proves an effect took place, it
        does not promise fresh data.
      schema: { type: string, format: date-time }

    IdempotencyReplayed:
      description: Present and `true` when the body is the memorised response of an earlier attempt.
      schema: { type: boolean }

    RetryAfterMs:
      description: Wait before retrying, in milliseconds. Used to disable a control cleanly rather than stack up refusals.
      schema: { type: integer, minimum: 0 }

    CacheControlPublic:
      description: |
        Set by the BFF. **`public` only on an anonymous read** — the body is then identical for every
        caller, hence shareable in a common cache and in Next's render cache. As soon as a session or
        a bearer token accompanies the request, the body carries the per-viewer overlays and the
        header becomes `private`: **serving a personalised body as `public` would be a leak, not an
        optimisation.**
      schema: { type: string, examples: ['public, max-age=60'] }

    VaryAuth:
      description: |
        **`Cookie, Authorization, X-Arthome-Device-Token, X-Arthome-Surface`.** Without this `Vary`,
        an intermediate cache would serve an anonymous visitor someone else's personalised body. The
        first three separate public from identified; `X-Arthome-Surface` separates the chat ceilings
        and the label catalogue slices, which differ per surface.
      schema: { type: string }

  responses:

    BadRequest:
      description: Malformed request, or refused by shape validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: api.schema_invalid
              nature: refused
              params: { fields: ['tier'] }
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'

    Unauthorized:
      description: No valid session, or expired token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: api.unauthenticated, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    Forbidden:
      description: Session valide, droit absent.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: api.forbidden, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    NotFound:
      description: Ressource inconnue.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: api.not_found, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    Conflict:
      description: |
        Definitive business refusal. The `code` says which one, and `params` carries what the screen
        must display — never a sentence.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: order.price_stale
              nature: refused
              params: { expectedAmountMinor: 2400, currentAmountMinor: 2900, currencyCode: EUR }
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'

    Gone:
      description: The targeted cursor, pairing or replay has expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: api.cursor_too_old, nature: refused, params: { maxAgeHours: 24 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    TooManyRequests:
      description: Rate limit reached. `params.retryAfterMs` allows the control to be disabled instead of stacking up refusals.
      headers:
        Retry-After-Ms: { $ref: '#/components/headers/RetryAfterMs' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: chat.rate_limited, nature: unavailable, params: { retryAfterMs: 3000 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    Unavailable:
      description: |
        Our servers. `nature: "unavailable"` is what lets the surface say "our servers" rather than
        "your connection" — a transport failure, by contrast, has no body and reads as "your
        connection".
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: api.upstream_unavailable, nature: unavailable, params: { service: catalog }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

  schemas:

    # ----------------------------------------------------------------- envelopes

    EnvelopeMeta:
      type: object
      required: [servedAt]
      properties:
        servedAt:
          type: string
          format: date-time
          description: |
            Server instant. **Every** displayed countdown is computed against it, never against the
            client's clock.
          examples: ['2026-09-21T20:31:04.118Z']
        validUntil:
          type: [string, 'null']
          format: date-time
          description: |
            Present as soon as a perishable value is in the response. Past that instant, the surface
            **calls the same `@arthome/core` function again** with the inputs it already has — it does
            not rewrite the rule, it re-runs it.
          examples: ['2026-09-21T20:31:34.118Z']
        lastEventSeq:
          type: [integer, 'null']
          format: int64
          description: Sequence number of the last event applied to the read model. Resume point.
        degraded:
          type: array
          description: |
            The **optional** parts that could not be composed. The response is served anyway: a
            per-viewer overlay that fails degrades the card, it does not sink the screen.
          items: { type: string }
          examples: [['viewerProgress']]

    CursorPageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]+=*$' }
        prevCursor: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]+=*$' }
        hasMore: { type: boolean }
        approximateTotal:
          type: [integer, 'null']
          description: |
            **Approximate and bounded** count. It is exact up to the threshold served as
            `DomainConstants.searchExactTotalLimit`, and beyond it the contract promises only that the
            true count is **at least** the value served — `totalIsLowerBound` says so. That is what
            makes "See more · N remaining" honest without promising an exact count an index does not
            give.

            **The threshold is served, not written here, and no engine is named.** A number carved into
            a description is a constant with no owning document (rule 15), and a vendor's parameter
            named in a contract is the search engine's shape showing through the boundary — it would
            have to be renamed the day the engine changes, in a document a generated client carries.
          examples: [428]
        totalIsLowerBound:
          type: boolean
          default: false
          description: When true, `approximateTotal` is a **lower bound**, not a total.
        emptyReason:
          type: [string, 'null']
          description: |
            Why the list is empty. An empty list without a reason forces the surface to guess and to
            write a generic empty state, which the brief forbids. Each value produces a different screen,
            **with an action that leads out of the dead end**.
          x-arthome-vocabulary:
            [no_match_for_query, no_match_with_filters, nothing_in_category_yet,
             no_live_in_category, no_upcoming_in_category, no_replay_in_category,
             no_followed_artist, no_followed_artist_live, no_order_yet, no_ticket_yet,
             no_replay_available, empty_cart, no_saved_search, no_watchlist_entry]
          x-arthome-vocabulary-source: EMPTY_REASONS
        emptyActionCode:
          type: [string, 'null']
          description: |
            The code of the action that leads out of the dead end ("see the categories", "browse"). It
            is a **served action code**, not a sentence and not a constant copied across five
            surfaces.

    Error:
      type: object
      required: [code, nature, params, traceId]
      properties:
        code:
          type: string
          description: |
            Closed vocabulary, i18n by codes. **Never a sentence.** A code unknown to one version of the
            application falls back on the snapshot embedded at build time — that is an operating
            condition on mobile, where store review is slow.
          examples: [publication.transition_irreversible]
          pattern: '^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$'
          x-arthome-vocabulary: [api.unauthenticated, api.forbidden, api.not_found, api.rate_limited, api.schema_invalid, api.upstream_unavailable, api.cursor_too_old, api.sort_key_forbidden, api.period_filter_required, api.rights_version_stale, identity.email_taken, identity.two_factor_required, identity.signed_out_elsewhere, pairing.slow_down, pairing.identity_mismatch, pairing.intent_not_engageable, pairing.execution_engaged, chat.holders_only, chat.rate_limited, moderation.already_claimed, moderation.already_settled, moderation.automatic_cannot_override_human, moderation.decision_version_stale, date.has_sold_seats, date.outcome_decision_forbidden, date.prices_locked, date.replay_policy_final, date.technical_check_required, date.technical_provision_required, date.stream_key_rotation_during_run, channel.has_open_obligations, channel.crew_role_reserved, channel.role_not_assignable, channel.transfer_target_ineligible, channel.same_actor_forbidden, payout.reconciliation_discrepancy_unexplained, order.quote_address_mismatch, order.sold_out, order.payment_declined, order.price_stale, order.plan_unavailable, capacity.tier_must_widen, content.empty_in_both_languages, hold.quantity_invalid, media.size_invalid, media.url_empty, order.quantity_invalid, pairing_code.ambiguous_glyph, publication.checklist_incomplete, publication.transition_forbidden, publication.transition_irreversible, search.unknown_flag, seat_code.malformed, watch.no_seat, watch.room_not_open, watch.out_of_territory, watch.subscription_required, watch.no_replay, watch.replay_expired, watch.replay_not_on_sale, watch.preview_exhausted, watch.concurrent_limit_reached, watch.date_cancelled, watch.not_published]
          x-arthome-vocabulary-source: ERROR_CODES
        nature:
          type: string
          description: |
            The decision the person has to make. `refused`: do not retry, understand. `unavailable`:
            retry. `offline_forbidden`: a **local** refusal, before anything is sent — **never emitted by
            the server**, present in the vocabulary so the surface has only one error shape to render.

            **Open vocabulary on read, and this is where it matters most.** An unknown nature —
            `degraded`, `needs_reauth` — is treated as **`unavailable`**, hence retryable. A frozen
            `enum` here would make a television on an earlier version reject the whole envelope: it would
            not lose a card, it would lose its ability to **read errors**, precisely when something is
            already wrong, and on a fleet we cannot update.
          x-arthome-vocabulary: [refused, unavailable, offline_forbidden]
          x-arthome-vocabulary-source: FAILURE_NATURES
          x-arthome-unknown-fallback: unavailable
          examples: [refused]
        params:
          type: object
          additionalProperties: true
          description: The message's parameters, never the message.
          examples: [{ from: scheduled, to: reserve, promise: prices_engaged }]
        traceId:
          type: string
          minLength: 1
          description: |
            The `trace-id` part of the `traceparent`. Readable and copyable from the error screen: on
            mobile it is the only link between "my application crashed" and a server log.
          examples: ['4bf92f3577b34da6a3ce929d0e0e4736']

    ErrorEnvelope:
      type: object
      required: [error, servedAt]
      properties:
        error: { $ref: '#/components/schemas/Error' }
        servedAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- primitives

    Money:
      type: object
      required: [amountMinor, currencyCode]
      description: |
        An amount. **Integer minor unit** — cents for EUR and CHF — plus an ISO 4217 currency code.
        Never a formatted string: formatting is presentation and happens client-side. May be negative
        (credit, refund).

        **`Money` says nothing about tax, and that is deliberate.** It carries credits, refunds,
        commissions and payouts as well as prices. **A price, however, is tax-inclusive** (D-056),
        and every field that is one says so where it is declared rather than relying on this shape —
        a reader who assumes the wrong side of a VAT rate computes a total that is wrong by that
        rate, and `Money` is not the place that can warn them.
      properties:
        amountMinor: { type: integer, format: int64, examples: [2400] }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$', examples: [EUR] }

    LocalizedText:
      type: object
      required: [contentLanguage, text]
      description: |
        **Authored** text, as opposed to an interface label. It travels with the language it was
        written in. The only two accepted exceptions to "i18n by codes": the hold-screen message
        written by the control room, and the studio inbox texts.
      properties:
        contentLanguage: { type: string, examples: [fr] }
        text: { type: string }

    ImageRendition:
      type: object
      required: [url, widthPx, heightPx]
      description: |
        A visual **already rendered at a size actually displayed**, never a URL recipe with a width
        template: on a television with 1 GB, a 4K backdrop decoded for a thumbnail costs as much as a
        full screen.
      properties:
        url: { type: string, format: uri }
        widthPx: { type: integer, minimum: 1 }
        heightPx: { type: integer, minimum: 1 }

    MediaSet:
      type: object
      properties:
        wide:
          type: array
          description: 16:9, smallest to largest.
          items: { $ref: '#/components/schemas/ImageRendition' }
        poster:
          type: array
          description: 2:3 or 3:4 depending on the surface, smallest to largest.
          items: { $ref: '#/components/schemas/ImageRendition' }

    VenueClock:
      type: object
      required: [venueTimezone, venueUtcOffsetMin]
      description: |
        The venue's timezone, served alongside the UTC instant it qualifies. The offset is
        **computed by the server for that instant**, never stored: this is not a return to a frozen
        offset, it is a served value, and it avoids embedding a timezone database in five
        applications.
      properties:
        venueTimezone:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_+-]*(?:\/[A-Za-z0-9_+-]+)+$'
          examples: ['Europe/Paris']
        venueUtcOffsetMin: { type: integer, minimum: -720, maximum: 840, examples: [120] }

    # -------------------------------------------------------------- authentication

    SessionMode:
      type: string
      description: |
        **An explicit, validated parameter, never inferred from the `User-Agent`** — that is
        forgeable, and a bypassable heuristic does not count as an answer.

        `cookie` for the web surfaces; `bearer` for the native shells, where
        `capacitor://localhost` is a third-party context on iOS and no cookie would survive;
        `device` for the television, which has **neither cookie nor token** at the moment it opens a
        sign-in pairing — which is what device identity solves.
      enum: [cookie, bearer, device]
      x-arthome-vocabulary-source: none
      x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change."

    SessionEstablished:
      description: |
        **Invariant: a response never carries both a cookie and a token.** Two bearers for one
        session means **two revocations to maintain and one that will be forgotten** — that is what
        stops a session surviving its own sign-out. So this is not a schema with an optional field:
        it is **two schemas**, discriminated by mode.
      oneOf:
        - $ref: '#/components/schemas/SessionEstablishedCookie'
        - $ref: '#/components/schemas/SessionEstablishedBearer'
      discriminator:
        propertyName: mode
        mapping:
          cookie: '#/components/schemas/SessionEstablishedCookie'
          bearer: '#/components/schemas/SessionEstablishedBearer'
          device: '#/components/schemas/SessionEstablishedBearer'

    SessionEstablishedCookie:
      type: object
      required: [mode, viewerContext]
      description: |
        The cookie is set in a `Set-Cookie` header — `HttpOnly`, `Secure`, `SameSite=Lax`, on the
        **BFF's domain**. **Nothing in the body**: no token, no session identifier.
      properties:
        mode: { type: string, const: cookie }
        viewerContext:
          $ref: '#/components/schemas/ViewerContext'
          description: |
            **Projected, never the authentication library's raw shape.** The surface receives the context
            it uses everywhere else, and does not have two session shapes to know about.

    SessionEstablishedBearer:
      type: object
      required: [mode, accessToken, expiresAt, viewerContext]
      description: |
        Opaque token in the body, **no cookie**. The client stores it in the native store —
        Keychain, Keystore, `@capacitor/preferences` — **never in `localStorage`**, which is tied to
        the origin, can be cleared by the system, and travels in no way at all.
      properties:
        mode:
          type: string
          description: |
            **A narrowing of `SessionMode` to the two token-bearing modes.** `cookie` is absent
            because a cookie response carries **nothing in the body** — that is the whole point of the
            split — so this branch cannot describe it. `device` shares this schema rather than having
            its own: a device session is token-shaped, and the discriminator maps both values here.

            The studio has no such branch because it has no device sessions; only a television carries
            a device token.
          x-arthome-vocabulary: [bearer, device]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A narrowing of a vocabulary named elsewhere in this document, with the reason in the description above: the members left out are the rule, not an omission."
        accessToken: { type: string }
        refreshToken: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
        viewerContext: { $ref: '#/components/schemas/ViewerContext' }

    # ------------------------------------------------------------- viewer bootstrap

    DomainConstants:
      type: object
      description: |
        The domain constants, **served**. They live in `@arthome/core` and are copied nowhere:
        copied, "the web will say 30 minutes, the television 15, and mobile will be right by
        accident" (E11, `storefront-mobile` Q10).
      required:
        [roomOpensMinutesBefore, cancelDeadlineMinutesBefore, scarcityThresholdBps,
         billboardPreviewDelaySec, waitlistPriorityWindowHours, chatRateLimitPerSecond,
         reactionQuotaPerDate, reminderLeadMinutes, replayExpiryWarningHours]
      properties:
        roomOpensMinutesBefore: { type: integer, examples: [30] }
        cancelDeadlineMinutesBefore: { type: integer, examples: [60] }
        scarcityThresholdBps:
          type: integer
          description: Fill rate above which a date is "nearly sold out", in basis points.
          examples: [8500]
        billboardPreviewDelaySec: { type: integer, examples: [4] }
        waitlistPriorityWindowHours: { type: integer, examples: [2] }
        chatRateLimitPerSecond:
          type: integer
          description: Ceiling **enforced at the source**, for the calling surface — television 2, mobile 6, web 10.
          examples: [2]
        chatCatchUpMessages:
          type: integer
          description: Number of catch-up messages served on entering a room — television 20, elsewhere 50.
          examples: [20]
        reactionQuotaPerDate: { type: integer, examples: [20] }
        reminderLeadMinutes: { type: integer, examples: [30] }
        replayExpiryWarningHours: { type: integer, examples: [6] }
        previewSecondsTotal:
          type: integer
          description: |
            **The total of the free preview.** `WatchVerdict.previewSecondsLeft` served the **remainder**
            and nothing served the total: the countdown "4 min 12 left" had a remainder with no
            denominator, and the copy says "the first 5 minutes". Rule 15 — the constant had no owning
            document.
          examples: [300]
        searchExactTotalLimit:
          type: integer
          description: |
            **The threshold beyond which `approximateTotal` becomes a lower bound.** It was carved into
            the prose as "exact up to 10,000": we were serving the default of a search engine parameter,
            in a vendor's name. Served as a constant, it survives a change of engine.
          examples: [10000]
        creditDelayCode:
          type: string
          description: |
            The refund delay is a **code**, never the sentence "3 to 5 business days" — which is a
            policy, hence translatable, hence i18n.
          examples: [refund_delay_business_days_3_5]

    LabelArtifactRef:
      type: object
      required: [domain, locale, version, url]
      description: |
        The label catalogue is **not a service**: it is an immutable versioned artefact published on
        the CDN. The current version is served here, **never through a per-page call**, and every
        application embeds a build-time snapshot as a **mandatory fallback** — that is the only thing
        guaranteeing no raw code ever reaches the screen.
      properties:
        domain:
          type: string
          description: |
            **Which catalogue this reference is for**, served rather than recoverable by taking the
            URL apart. The theme lived only inside the path (`/i18n/studio/fr/v41.json`), so a client
            caching catalogues by theme had to parse a string to learn what it was holding — which is
            `imageUrl(kind, key, width)` in another costume, and the same rule answers it: **a value
            recoverable only by parsing a string is a value the contract did not serve.**
          x-arthome-vocabulary: [common, storefront, studio, taxonomy, system]
          x-arthome-vocabulary-source: MESSAGE_DOMAINS
          examples: [storefront]
        locale:
          type: string
          description: |
            **The domain declares exactly two**, and the contract says so rather than serving an
            open string: a surface choosing a fallback needs to know the set it is choosing from.
            Tolerant on output like every other served vocabulary — a third locale is kept raw and
            treated as neutral, never rejected.
          x-arthome-vocabulary: [fr, en]
          x-arthome-vocabulary-source: LOCALES
          examples: [fr]
        version: { type: integer, examples: [41] }
        url: { type: string, format: uri }

    ProfileSummary:
      type: object
      required: [id, name, kind]
      description: Up to five per account — a shared-television constraint, carried by the account.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: ['Marie'] }
        kind:
          type: string
          x-arthome-vocabulary: [adult, child]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "An account-management shape, local to this endpoint: what the person asked for, not a fact the domain reasons about."
          examples: [adult]
        avatar: { $ref: '#/components/schemas/ImageRendition' }
        allowedCategoryIds:
          type: [array, 'null']
          description: |
            Present for a child profile. Filtering the child catalogue happens **server-side**:
            otherwise a child's television downloads the adult catalogue in order to hide it.
          items: { type: string }

    ViewerPreferences:
      type: object
      description: |
        **Two scopes, settled field by field** (`storefront-tv` Q8). Language, default subtitles,
        audio description, behaviour when a live show opens and the reading timezone depend on the
        **person**; default quality, subtitle size, reduced motion and automatic preview depend on
        the **device** and the room. A single scope would be wrong half the time.

        The resource is **additive and tolerant**: a key unknown to one version of the application is
        neither rejected nor erased on the next write — otherwise the mobile version stuck in store
        review overwrites settings made from the web.
      properties:
        account:
          type: object
          properties:
            interfaceLocale: { type: string, examples: [fr] }
            subtitlesDefault: { type: boolean }
            subtitleLanguage:
              type: [string, 'null']
              description: |
                **Turning subtitles on and choosing their language are two settings.** The contract carried
                only the boolean; the design carries a language. A viewer who wants English subtitles on a
                French show was inexpressible.
              examples: [fr]
            audioDescription: { type: boolean }
            liveOpenBehaviour:
              type: string
              x-arthome-vocabulary: [peek, muted, 'off']
              x-arthome-vocabulary-source: none
              x-arthome-vocabulary-reason: "A presentation choice the contract serves so that five surfaces do not each invent one. The domain has no opinion on it."
            chatOpenByDefault: { type: boolean }
            readingTimezone:
              type: string
              description: The **same field** as the studio's reading timezone — one account, one carrier.
              examples: ['Europe/Paris']
        device:
          type: object
          properties:
            defaultQuality: { type: string, x-arthome-vocabulary: [auto, low, medium, high], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A presentation choice the contract serves so that five surfaces do not each invent one. The domain has no opinion on it." }
            subtitleSizeStep: { type: integer }
            reduceMotion: { type: boolean }
            autoplayPreview: { type: boolean }
            dataSaver: { type: boolean }

    ViewerContext:
      type: object
      required: [deviceId, profiles, constants, labelCatalog, taxonomyArtifact]
      description: |
        The bootstrap payload. **A single call**, and it is the entire budget of the `boot` screen:
        the device's profiles, rights, preferences, domain constants, label catalogue version. The
        labels themselves come from the embedded snapshot — the version check **never** blocks the
        first render.
      properties:
        deviceId: { type: string, format: uuid }
        signedIn: { type: boolean }
        currentProfileId: { type: [string, 'null'], format: uuid }
        profiles:
          type: array
          items: { $ref: '#/components/schemas/ProfileSummary' }
        account:
          type: [object, 'null']
          properties:
            publicHandle: { type: string, examples: ['@marie.j'] }
            memberNumber: { type: string }
            emailVerified: { type: boolean }
        plan:
          type: [object, 'null']
          description: |
            The **displayed** plan, served to paint prices and badges. It **never** decides a right to
            watch: that right is returned by `streaming` when the player opens, on fresh data
            (`adr-auth.md` §7.1).
          properties:
            tier: { type: string, x-arthome-vocabulary: [free, pass, premium], x-arthome-vocabulary-source: PLAN_TIERS }
            state: { type: string, x-arthome-vocabulary: [active, past_due, cancelled, trialing], x-arthome-vocabulary-source: SUBSCRIPTION_STATES }
            seatDiscountBps: { type: integer, examples: [1000] }
            concurrentStreamsAllowed: { type: integer, examples: [2] }
        preferences: { $ref: '#/components/schemas/ViewerPreferences' }
        constants: { $ref: '#/components/schemas/DomainConstants' }
        labelCatalog: { $ref: '#/components/schemas/LabelArtifactRef' }
        taxonomyArtifact:
          $ref: '#/components/schemas/LabelArtifactRef'
          description: |
            Same regime as the i18n catalogue, **served per slice and per surface**: mobile loads
            neither the studio vocabulary nor the television key table. 59.5 KB raw / 8.4 KB gzipped for
            the full slice — this is not an API call.
        realtime:
          type: object
          description: Where to open **the single** real-time connection. Multiplexing is per room, never per connection.
          properties:
            namespace: { type: string, examples: ['/storefront'] }
            pulseIntervalSec: { type: integer, examples: [5] }

    ChangeFeed:
      type: object
      required: [invalidated, complete]
      description: |
        **A list of invalidations, not the data.** On returning to the foreground, a surface
        revalidates half a dozen reads at once; refusing that burst means refusing to open the
        application. One request instead of twelve.
      properties:
        invalidated:
          type: array
          description: |
            Tags **named by the contract**, never invented by a surface — otherwise mobile and television
            would invent others and Next's server rendering would call `revalidateTag` on keys nobody
            emits.

            **This list is the union of two families, and they are not symmetric with
            `x-arthome-invalidates`.** That extension names, on a write, the reads that write makes
            false — it therefore covers only what the caller **caused**. The three catalogue tags
            appear in no `x-arthome-invalidates` and that is not a gap: nothing on the storefront
            writes the catalogue. `date:{id}`, `artist:{id}` and `category:{id}` reach this feed
            because the **studio** published, which is the case the description above calls "what the
            storefront did not cause". Counting the two lists against each other therefore proves
            nothing; a tag missing from **this** list is the defect, because it is the list
            `revalidateTag` reads.

            The `{…}` placeholder is the identifier of the resource. In `x-arthome-invalidates` the
            same tag is written with the operation's own path parameter (`date:{dateId}:availability`)
            because that is what supplies the value; it is the same tag.
          items:
            type: string
            x-arthome-vocabulary:
              ['date:{id}', 'date:{id}:availability', 'artist:{id}', 'category:{id}',
               'account:tickets', 'account:orders', 'account:subscription', 'account:cart',
               'account:profile', 'account:devices', 'account:payment-methods', 'home:rails']
            x-arthome-vocabulary-source: none
            x-arthome-vocabulary-reason: |
              Cache tags, not a domain vocabulary. They name what a surface must revalidate, in
              Next's `revalidateTag` namespace convention, and the domain has no notion of them:
              `@arthome/core` knows a date, not `date:{id}`.
          examples: [['date:019928a0-7d31-7a10-b8c4-2f9e11a4c001', 'account:tickets']]
        complete:
          type: boolean
          description: |
            `false` means "too many changes, reload everything" — the same honesty as `resume:too_old`
            on the real-time channel. A client that does not know what it missed is worse than a client
            that reloads.

    # ------------------------------------------------------------- the public date

    WatchVerdict:
      type: object
      required: [allowed, advisory, validUntil]
      description: |
        The right to watch, a **first-class shape**, served per date. It exists at **two evaluation
        sites for one implementation** (`decideWatch` in `@arthome/core`):

        - **here**, composed by the BFF from its batched reads — **advisory and not binding**, and
          the contract declares it so with `advisory: true`. It serves to paint the card without a
          second round trip, which the television requires;
        - **when the player opens**, by `streaming`, from its own projected copies. **This is the
          only evaluation that is authoritative**, because it is the only one that produces a token.

        **It is never cached to disk.** It expires, it depends on territory, it depends on the screen
        limit: a right read back from disk is a false right. `validUntil` never exceeds 60 seconds.
      properties:
        allowed: { type: boolean }
        scope:
          type: string
          description: |
            **`allowed` alone cannot say what kind of access was allowed**, and that was a real gap
            rather than a nicety. `PlaybackTicket` — the binding verdict — has carried `full` versus
            `preview` since it was written; this one, the advisory verdict a card is painted from,
            carried only a boolean. So a card for a subscription-required date with budget remaining
            had to infer preview-ness from `previewSecondsLeft > 0`, which is a rule evaluated on
            three storefronts instead of served once (rule 2), and the card must say "Watch 5 min
            free" rather than "Watch" **without a second call**.

            It is the same vocabulary as `PlaybackTicket.scope`, deliberately: two evaluation sites,
            one implementation, and now one shape.
          x-arthome-vocabulary: [full, preview, none]
          x-arthome-vocabulary-source: WATCH_SCOPES
          examples: [preview]
        advisory:
          type: boolean
          description: |
            `true` everywhere in this document. The binding verdict is the one from `POST /v1/playback/{dateId}/open`.
        denialReasonCode:
          type: [string, 'null']
          description: |
            The **same refusal vocabulary** as the player: a card announcing "subscription required" and
            a player refusing for the same reason say the same code. Each produces a different screen on
            the three storefronts; a generic code would produce a false one.

            **`SCREAMING_SNAKE`, and that is a family rather than a preference.** This rides on
            `reasonParams`, which is the error envelope's `code` + `params` shape, and it stands beside
            `order.price_stale`, `STATE_CONFLICT` and `CURSOR_TOO_OLD`. It is a refusal-code family, not a
            domain vocabulary — which is why `@arthome/core` now exports it in this case too. It spent
            this whole contract's life lowercase there, so `denialReasonCode === WatchDenialReason.watch.no_seat`
            was **false for all ten values**, silently, on the entire refusal experience of the
            storefront. A separator-insensitive comparison cannot see a case difference, which is why
            this one outlived two passes that were looking for exactly this defect.

            **`watch.not_published` is the eleventh**, and it was missing here for the same reason
            `displayState` was missing three members: `decideWatch` returns it for a `draft`, `reserve`
            or `technical` date, and the non-public states keep falling out of contracts because no
            public screen shows them.
          x-arthome-vocabulary:
            [watch.no_seat, watch.room_not_open, watch.out_of_territory, watch.subscription_required, watch.no_replay,
             watch.replay_expired, watch.replay_not_on_sale, watch.preview_exhausted, watch.concurrent_limit_reached,
             watch.date_cancelled, watch.not_published]
          x-arthome-vocabulary-source: WATCH_DENIAL_REASONS
          examples: [watch.subscription_required]
        reasonParams:
          type: object
          additionalProperties: true
          description: What the screen must display — the territory, the plan required, the expiry instant.
        fallbackAction:
          type: string
          description: |
            The action that leads out of the dead end. A code, never a sentence, and never a dead screen.

            **Not nullable, and that is the point of `none` being a member.** `decideWatch` returns
            `none` when there is nothing to offer, so the absence is **spelled** rather than left to a
            null. Nullable would make `null` and `none` two spellings of one state, and a third
            meaning — "not denied" — would attach itself to whichever the writer had in mind.

            **And an ALLOWED verdict carries a real action.** A viewer watching on `scope: preview`
            gets `buy_seat` beside it. A surface reading `null` as "no action" would be right for
            `denialReasonCode`, where null genuinely means *not denied*, and would silently drop the
            preview-to-purchase step — the one path that turns a free viewer into a paying one. The
            two fields look alike and must not be read alike.

            **The two vocabularies are coupled, and the coupling is data rather than prose.**
            A fallback action exists to answer a denial reason, so the invariant is: every reason maps
            to an action that leads out of it, and every action answers at least one reason.
            **`WATCH_FALLBACK_FOR` in `@arthome/core` holds the mapping**, with a spec asserting both
            directions and asserting that `decideWatch` never returns a pairing the table forbids.

            **This description used to restate that table row by row, and that was a parallel literal
            table** — eleven rows of it, written to prevent drift, in a document that cannot be
            executed, next to a table that can. So it is gone: the rule is here, the rows are in core,
            and a surface that needs to know which action answers which reason reads the constant.

            **One row deserves its argument in the contract rather than in the domain**, because it is
            a contract obligation and not a domain preference: `adr-stream-entitlement.md` §3.3
            requires a `watch.concurrent_limit_reached` refusal to be served with the list of active
            sessions *"so the surface can offer to release one. A bare refusal would leave the viewer
            with no way out"*. This contract stated that refusal for its whole life and had no action
            expressing the remedy, which is the dead end principle 8 forbids. `release_a_screen` is
            what closes it.

            **`watch_preview` is not here, and the round trip that removed it is worth recording.** It
            crossed this boundary three times in a day because two people were each answering the
            other's last message instead of the code. The test that ends that, and the one this
            contract now defers to: **does a function return it?** `decideWatch` does not — the free
            preview is expressed by an **allowed** verdict carrying `scope: preview` on both the live
            and the replay path, with `buy_seat` beside it. A preview a viewer can still watch is not
            a way out of a refusal, because there is no refusal.

            What the member was compensating for is the finding worth keeping: `WatchVerdict` had no
            way to say "allowed, but only as a preview", so preview-ness was inferred from
            `previewSecondsLeft > 0` on three storefronts instead of being served once. The fix was the
            `scope` field, not a fallback action. **When a vocabulary member answers nothing, look for
            the field that is missing.**
          x-arthome-vocabulary:
            [buy_seat, join_waitlist, subscribe, see_replay_policy, see_other_dates,
             release_a_screen, none]
          x-arthome-vocabulary-source: WATCH_FALLBACK_ACTIONS
        previewSecondsLeft:
          type: [integer, 'null']
          description: |
            Remaining preview budget, **counted server-side, per account** — not per device, otherwise a
            household with four devices gets four previews; not per date alone, it is `(account, date)`.
            Reloading the page extends nothing.
        validUntil: { type: string, format: date-time }

    DateCard:
      type: object
      required:
        [id, showId, channelId, slug, canonicalUrl, title, startsAt, venueClock, runtimeMin,
         displayState, displayStateValidUntil, replay, rights, media]
      description: |
        **The most consumed shape in the product.** It must stand alone: a card never triggers a call
        in order to paint itself.

        It carries the **inputs** of the perishable rules **and** their result at serving time **and**
        the instant that result stops being true. That is what lets a response cached for eight hours
        stay correct: the surface calls the same `@arthome/core` function again once
        `displayStateValidUntil` has passed, it does not rewrite the rule.

        **No ticketing or control-room field appears here** (E8): no `sold`, no `revenue`, no
        `publication`, no `publishedBy`.
      properties:
        id: { type: string, format: uuid }
        showId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        artist:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, examples: ['Compagnie Verticale'] }
            verified: { type: boolean }
            avatar: { $ref: '#/components/schemas/ImageRendition' }
        slug: { type: string, examples: ['nuit-blanche-2026-09-21'] }
        canonicalUrl:
          type: string
          format: uri
          description: |
            **Served, never built by the surface.** It is what gets shared, bookmarked, what a reminder
            and a notification point at, and what gets indexed — and it is what the television encodes in
            a QR code for the Share action, since a television has neither a clipboard nor a useful
            messaging app.
        title: { type: string }
        categoryId: { type: string, examples: ['dance-contemporary'] }
        genreIds:
          type: array
          description: '**Multiple**: a show is both "contemporary" and "repertoire" at once. The singular forbade it (E9).'
          items: { type: string }
        tagIds: { type: array, items: { type: string } }
        startsAt: { type: string, format: date-time }
        venueClock: { $ref: '#/components/schemas/VenueClock' }
        runtimeMin: { type: integer }
        venue:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            city: { type: string }
            countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        roomOpensAt:
          type: string
          format: date-time
          description: |
            The **instant** the room opens, served. The surface schedules the switch locally, to the
            second, **without a single call**: a standby mode running for eight hours therefore makes no
            request at all.
        displayState:
          type: string
          description: |
            The **only** state value the cards display, and nobody recomposes it. Produced by
            `displayStateOf(publication, run, outcome, instants, now)` in `@arthome/core`. The hierarchy,
            written once: `outcome` outranks `run.state`, which outranks `publication.state`.

            **One vocabulary, eleven members, and the narrowing is said here rather than written as a
            second list.** A storefront never receives `draft`, `reserve` or `technical` — not by
            filtering, but **by construction**: a date reaches a public surface only once it is
            published. Declaring only the eight would be a second authored list for a field the
            domain already defines, and two independently authored lists for one field is how E4
            started. A surface that wants to know what it can actually receive reads this sentence;
            the vocabulary stays the domain's.
          x-arthome-vocabulary:
            [draft, reserve, scheduled, technical, room_open, live, replay, ended,
             postponed, cancelled, interrupted]
          x-arthome-vocabulary-source: DISPLAY_STATES
          examples: [live]
        displayStateValidUntil: { type: string, format: date-time }
        outcome:
          type: [string, 'null']
          description: |
            The outcome **replaces the state on every card**, not only on the detail page. It is a fact
            about the performance: never rewritten, never erased.
          x-arthome-vocabulary: [postponed, cancelled, interrupted]
          x-arthome-vocabulary-source: DATE_OUTCOMES
        rescheduledTo: { type: [string, 'null'], format: date-time }
        viewers:
          type: [integer, 'null']
          description: |
            **Absent — never zero — when the date is not on air.** A zero reads as "nobody", not as "not
            measured", and the brief's rule forbids "0 WATCHING".
        availability:
          type: [object, 'null']
          description: Projected from `ticketing`. Absent while no price is active.
          properties:
            seatsAvailable: { type: integer }
            waitlistCount: { type: integer }
            fillRateBps:
              type: integer
              description: |
                The **rate**, not the capacity. Serving the capacity and letting the client compute recreates
                the value composed in two places, and the design proves it by applying a constant of 2,000
                seats regardless of the venue.
            soldOut: { type: boolean }
            lowestPrice:
              $ref: '#/components/schemas/Money'
              x-arthome-tax-basis: inclusive
            promotion:
              type: [object, 'null']
              properties:
                reason:
                  type: string
                  x-arthome-vocabulary:
                    [pre_sale, preview_night, discovery_rate, final_date, late_rate]
                  x-arthome-vocabulary-source: PROMOTION_REASONS
                struckPrice:
                  $ref: '#/components/schemas/Money'
                  x-arthome-tax-basis: inclusive
                currentPrice:
                  $ref: '#/components/schemas/Money'
                  x-arthome-tax-basis: inclusive
                validUntil: { type: string, format: date-time }
        replay:
          type: object
          required: [policy]
          description: |
            The **promise** made before purchase — it is what justifies the price difference. `none` is
            **final** for this date.
          properties:
            policy:
              type: string
              x-arthome-vocabulary: [included, subscription, unit, none]
              x-arthome-vocabulary-source: REPLAY_POLICIES
            windowHours: { type: [integer, 'null'] }
            availableFrom: { type: [string, 'null'], format: date-time }
            expiresAt:
              type: [string, 'null']
              format: date-time
              description: Derived from the end of the live show and `windowHours`. Served as an instant, never as "41 h left".
            unitPrice:
              $ref: '#/components/schemas/Money'
              x-arthome-tax-basis: inclusive
        rights:
          type: object
          required: [scope]
          properties:
            scope: { type: string, x-arthome-vocabulary: [worldwide, restricted], x-arthome-vocabulary-source: RIGHTS_SCOPES }
            blackoutCountries: { type: array, items: { type: string, pattern: '^[A-Z]{2}$' } }
            blackoutReasonCode:
              type: [string, 'null']
              description: 'A **code**, never a sentence. The current data carries `label`/`labelEn` authored inside the data: an i18n leak (E8).'
              x-arthome-vocabulary: [co_production, broadcaster, festival]
              x-arthome-vocabulary-source: BLACKOUT_REASONS
        chatMode:
          type: string
          x-arthome-vocabulary: [open, emoji, read_only, 'off']
          x-arthome-vocabulary-source: CHAT_MODES
        media: { $ref: '#/components/schemas/MediaSet' }
        languageDependency:
          type: string
          x-arthome-vocabulary: [none, helpful, essential]
          x-arthome-vocabulary-source: LANGUAGE_DEPENDENCIES
        watchVerdict:
          $ref: '#/components/schemas/WatchVerdict'
          description: |
            Per-viewer overlay. **Absent — not null — on an anonymous read**, which makes the public body
            identical for every caller and therefore shareable in a common cache.
        viewerRelations:
          type: [object, 'null']
          description: |
            Per-viewer overlay, merged from a **batched** read, never one call per card. **Absent on an
            anonymous read.**
          properties:
            inWatchlist: { type: boolean }
            reminderSet: { type: boolean }
            followsArtist: { type: boolean }
        viewerProgress:
          type: [object, 'null']
          description: Per-viewer overlay. **Absent on an anonymous read.**
          properties:
            positionSec: { type: integer }
            durationSec: { type: integer }
            completed: { type: boolean }

    DateDetail:
      allOf:
        - $ref: '#/components/schemas/DateCard'
        - type: object
          description: The detail page. Served in **one** call, with its series, the same artist and the suggestions.
          properties:
            synopsis: { $ref: '#/components/schemas/LocalizedText' }
            castAndCrew:
              type: array
              items:
                type: object
                properties:
                  personId: { type: string, format: uuid }
                  name: { type: string }
                  roleCode: { type: string }
            spokenLanguages: { type: array, items: { type: string } }
            subtitleLanguages: { type: array, items: { type: string } }
            surtitleLanguages: { type: array, items: { type: string } }
            attributes:
              type: object
              additionalProperties: true
              description: The seven attribute groups. Distinct from **tags** (`tagIds`) — a name collision between two notions, separated by the contract.
            priceTiers:
              type: array
              items: { $ref: '#/components/schemas/PriceTier' }
            serviceFee:
              type: [object, 'null']
              description: |
                The service-fee **scale**, **per seat**, served by the contract. Never a screen constant: the
                summary displays a "service fee" line, and it must be computable once only.
              properties:
                perSeat:
                  $ref: '#/components/schemas/Money'
                  x-arthome-tax-basis: inclusive
                capped:
                  $ref: '#/components/schemas/Money'
                  x-arthome-tax-basis: inherited
            chapters:
              type: array
              items: { $ref: '#/components/schemas/Chapter' }
            seriesDates:
              type: array
              description: The other dates of the same show.
              items: { $ref: '#/components/schemas/DateCard' }
            totalSeriesDates:
              type: integer
              description: '"All dates (N)": the N is **served**, not counted from the visible slice.'
            suggestions:
              type: array
              items: { $ref: '#/components/schemas/DateCard' }
            merchItems:
              type: array
              description: The show's shop, served with the detail page.
              items: { $ref: '#/components/schemas/MerchItem' }

    PriceTier:
      type: object
      x-arthome-price-basis: tax_inclusive
      required: [tier, amount, active]
      properties:
        tier: { type: string, x-arthome-vocabulary: [full, reduced, support], x-arthome-vocabulary-source: PRICE_TIERS }
        amount:
          $ref: '#/components/schemas/Money'
          x-arthome-tax-basis: inherited
        active: { type: boolean }
        validUntil:
          type: [string, 'null']
          format: date-time
          description: |
            Present when the current price depends on the instant — the "show already started" price is
            **pro rata to the time remaining** and cannot be a frozen string. 60 s.

    Chapter:
      type: object
      required: [id, vocabId, atMediaSec]
      properties:
        id: { type: string, format: uuid }
        vocabId:
          type: string
          description: Chapter vocabulary identifier, **never an authored label**.
        atMediaSec:
          type: integer
          description: Position **in the media**, not the time it was posted. Free now, unrecoverable later.

    # ------------------------------------------------------ composed screens

    Rail:
      type: object
      required: [id, titleCode, kind, itemKind, cardForm, items]
      description: |
        A home rail. **Composition and order are server-side**: the design loads 1,814 dates
        (1.79 MB) and filters client-side, which the contract must make impossible on a device that
        has 300 to 500 MB for everything, video included.
      properties:
        id: { type: string }
        titleCode:
          type: string
          description: An i18n **code**, never an authored title.
          examples: [home.rail.resume]
        kind:
          type: string
          description: |
            `my_seats` carries "Your seats": it is **not** editorial but personal, and its behaviour is
            its own — the card becomes "Enter the room" when the room opens. Filing it under `editorial`
            would have erased that difference.
          x-arthome-vocabulary:
            [resume, live_now, my_seats, upcoming_tonight, followed, editorial, category,
             replay_expiring, artists_to_follow]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A screen composition the server decides so that five surfaces do not each decide it differently. The domain has no opinion on which rails exist."
        itemKind:
          type: string
          description: |
            **What the rail carries.** Without this field, an artist rail is inexpressible:
            `ArtistSummary` exists in the contract but no rail could transport it, and the surface would
            have had to guess the type from the rail identifier — that is, from a parallel literal.
          x-arthome-vocabulary: [date, artist]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A screen composition the server decides so that five surfaces do not each decide it differently. The domain has no opinion on which rails exist."
          examples: [date]
        cardForm:
          type: string
          description: |
            **The card form is an editorial choice, hence server-side**, exactly like the order of the
            rails. `poster` serves the "Posters" rail in vertical 2:3, `portrait` the artists as circles.
            Without this field the surface would choose from the rail identifier, and *"variety of format
            is what stops the screen looking like a spreadsheet"* — nine rails of identical 16:9 cards is
            a television's defect number one.
          x-arthome-vocabulary: [wide, poster, portrait]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A presentation choice the contract serves so that five surfaces do not each invent one. The domain has no opinion on it."
          examples: [wide]
        items:
          type: array
          description: |
            **Union discriminated by `itemKind`**: `DateCard` when `itemKind` is `date`,
            `ArtistSummary` when it is `artist`.
          items:
            oneOf:
              - $ref: '#/components/schemas/DateCard'
              - $ref: '#/components/schemas/ArtistSummary'
        total:
          type: [integer, 'null']
          description: |
            **The rail's count, not the served slice's.** Every rail displays a counter to the right of
            its title; without this field it can only display `items.length`, that is, the page size — a
            false number. Same guarantee as `CursorPageInfo.approximateTotal`: exact up to the served
            threshold, a lower bound beyond it.
        totalIsLowerBound: { type: boolean, default: false }
        nextCursor:
          type: [string, 'null']
          description: |
            **Per-rail** cursor, consumed by `extendRail`. A rail is an excerpt; it does not paginate on
            screen, it extends.

    HomeScreen:
      type: object
      required: [rails]
      properties:
        billboard:
          type: [object, 'null']
          description: |
            The choice of billboard is **server-side**. `previewStartsAfterSec` is served from the domain
            constants, never hardcoded in the surface.
          properties:
            date: { $ref: '#/components/schemas/DateCard' }
            previewStartsAfterSec: { type: integer, examples: [4] }
            previewUrl: { type: [string, 'null'], format: uri }
        rails: { type: array, items: { $ref: '#/components/schemas/Rail' } }

    ScheduleSlot:
      type: object
      required: [localHourLabelKey, dates]
      description: |
        Tonight's grid, **already grouped in the viewer's local time**. The grouping depends on the
        timezone: the surface sends it in a header, the server groups. A grid grouped client-side
        would be grouped five different ways.
      properties:
        localHourLabelKey: { type: string, examples: ['20'] }
        startsAt: { type: string, format: date-time }
        dates: { type: array, items: { $ref: '#/components/schemas/DateCard' } }

    LiveScreen:
      type: object
      required: [slots]
      properties:
        featured: { $ref: '#/components/schemas/DateCard' }
        slots: { type: array, items: { $ref: '#/components/schemas/ScheduleSlot' } }

    CategoryTile:
      type: object
      required: [id, universe, rank, datesCount, liveCount]
      description: |
        The 21 disciplines, with **family and rank**. The editorial rank is authoritative: **no
        surface reorders**. Served in **one** call, never one call per tile.
      properties:
        id: { type: string }
        universe: { type: string, x-arthome-vocabulary: [music, stage], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A screen composition the server decides so that five surfaces do not each decide it differently." }
        rank: { type: integer }
        datesCount: { type: integer }
        liveCount: { type: integer }
        media: { $ref: '#/components/schemas/MediaSet' }
        featured:
          type: boolean
          description: |
            Editorial selection for the top of the page, **served as a rule**, never hardcoded in a
            surface (`storefront-tv` Q5).

    CategoryScreen:
      type: object
      required: [categoryId, sections]
      properties:
        categoryId: { type: string }
        hero: { $ref: '#/components/schemas/DateCard' }
        subGenres:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              rank: { type: integer }
        sections:
          type: array
          description: |
            Five bounded sections — `overview`, `live`, `upcoming`, `replays`, `artists`. The overview **does not
            paginate**: an overview is bounded (8 per section).
          items:
            type: object
            required: [id, items]
            properties:
              id: { type: string, x-arthome-vocabulary: [overview, live, upcoming, replays, artists], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A screen composition the server decides so that five surfaces do not each decide it differently." }
              titleCode: { type: string }
              items: { type: array, items: { $ref: '#/components/schemas/DateCard' } }
              nextCursor: { type: [string, 'null'] }
        facets: { type: array, items: { $ref: '#/components/schemas/Facet' } }

    ArtistSummary:
      type: object
      required: [id, channelId, name, categoryId]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        categoryId: { type: string }
        countryCode: { type: string, pattern: '^[A-Z]{2}$' }
        verified: { type: boolean }
        media: { $ref: '#/components/schemas/MediaSet' }
        followers:
          type: integer
          description: |
            **Projected** counter, with its declared freshness. A counter wrong by 3% does not matter; a
            counter that differs between the detail page and the list does — which is why it comes from a
            single projection.
        avgViewers: { type: [integer, 'null'] }
        isLiveNow: { type: boolean }
        followedByViewer: { type: [boolean, 'null'] }
        alertEnabled:
          type: [boolean, 'null']
          description: |
            **Following and being alerted are two settings**, and the contract separates them:
            `followedByViewer` is a catalogue relation, `alertEnabled` a flag carried by `notifications`.
            Conflating them would make it impossible to follow an artist without being notified — and the
            design shows the two separately. **Absent on an anonymous read.**
        nextDate:
          $ref: '#/components/schemas/DateCard'
          description: |
            The next announced date, when there is one. Served so that the "Following" page distinguishes
            artists **who have a date** from those who do not — that is the split the screen displays, and
            it would otherwise be computed by one call per artist.

    ArtistDetail:
      allOf:
        - $ref: '#/components/schemas/ArtistSummary'
        - type: object
          properties:
            biography: { $ref: '#/components/schemas/LocalizedText' }
            joinedAt: { type: string, format: date-time }
            upcomingDates: { type: array, items: { $ref: '#/components/schemas/DateCard' } }
            pastDates: { type: array, items: { $ref: '#/components/schemas/DateCard' } }
            replays: { type: array, items: { $ref: '#/components/schemas/DateCard' } }
            merchItems: { type: array, items: { $ref: '#/components/schemas/MerchItem' } }

    Facet:
      type: object
      required: [facetId, values]
      description: |
        **Generic**, never an enumeration of facets in the contract: adding "wheelchair accessible"
        must not be a contract change. The counts are computed on the current query and returned **in
        the same response** as the results — no second call.
      properties:
        facetId: { type: string, examples: [category] }
        values:
          type: array
          items:
            type: object
            required: [id, count]
            properties:
              id: { type: string }
              count: { type: integer }

    StructuredFilter:
      type: object
      description: |
        The filters that are **not** enumerations: price range, date range. They live beside the
        facets, never inside them.
      required: [filterId, kind]
      properties:
        filterId: { type: string, examples: [price] }
        kind: { type: string, x-arthome-vocabulary: [money_range, date_range, boolean], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A screen composition the server decides so that five surfaces do not each decide it differently." }
        min: { type: [integer, 'null'] }
        max: { type: [integer, 'null'] }

    SearchCriteria:
      type: object
      description: |
        **The criteria grammar, published.** It is the same shape everywhere: parameter of
        `/v1/search`, parameter of `/v1/categories/{id}`, and body of `SavedSearch.criteria`. One
        shape, therefore one signature — and `criteriaSignature` can only produce it because the
        shape is normalised.

        **Every value is a stable identifier**, never an array index: a position survives neither a
        shareable URL, nor a saved search, nor the insertion of a discipline.
      additionalProperties: false
      properties:
        categoryIds: { type: array, items: { type: string } }
        genreIds: { type: array, items: { type: string } }
        tagIds: { type: array, items: { type: string } }
        artistIds: { type: array, items: { type: string, format: uuid } }
        cityIds: { type: array, items: { type: string } }
        countryCodes: { type: array, items: { type: string, pattern: '^[A-Z]{2}$' } }
        languageDependency: { type: array, items: { type: string, enum: [none, helpful, essential], x-arthome-vocabulary-source: LANGUAGE_DEPENDENCIES } }
        replayPolicy: { type: array, items: { type: string, enum: [included, subscription, unit, none], x-arthome-vocabulary-source: REPLAY_POLICIES } }
        displayStates:
          type: array
          description: |
            **A strict narrowing of `DISPLAY_STATES`** to the five a public search can filter on. The
            other six are either non-public (`draft`, `reserve`, `technical`) or outcomes that replace
            the state on the card rather than being searched for (`postponed`, `cancelled`,
            `interrupted`). A filter on a state no public list can contain returns nothing and says
            nothing, which is worse than refusing it.
          items: { type: string, enum: [scheduled, room_open, live, replay, ended], x-arthome-vocabulary-source: DISPLAY_STATES, x-arthome-vocabulary-narrowing: "The five a public search can filter on. The other six are non-public states or outcomes that replace the state on the card, so a filter on them returns nothing and says nothing." }
        priceMinMinor: { type: [integer, 'null'], minimum: 0 }
        priceMaxMinor: { type: [integer, 'null'], minimum: 0 }
        startsAfter: { type: [string, 'null'], format: date-time }
        startsBefore: { type: [string, 'null'], format: date-time }
        almostSoldOut: { type: [boolean, 'null'] }
        onPromotion: { type: [boolean, 'null'] }
        accessibility: { type: array, items: { type: string } }

    ShowGroup:
      type: object
      required: [showId, title, representativeDate, matchingDatesCount]
      description: |
        The paginated unit of search for the `best`, `lives` and `replays` tabs is the **show**, not
        the date. Each group carries the representative date chosen — the first that satisfies the
        filters, under the current sort — **and** the total number of dates in the group that satisfy
        the filters: without that second number, "see 2 more dates" is wrong as soon as a filter is
        active.
      properties:
        showId: { type: string, format: uuid }
        title: { type: string }
        representativeDate: { $ref: '#/components/schemas/DateCard' }
        matchingDatesCount: { type: integer, examples: [3] }

    # ---------------------------------------------------------------- commerce

    TicketCard:
      type: object
      required: [seatId, dateId, seatCode, tier, state, date]
      properties:
        seatId: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        seatCode:
          type: string
          description: |
            **Issued by the server**, always. It displays identically on web, mobile and television; the
            design computes it by hashing, which would give **three different codes for the same seat** as
            soon as one surface changed its hash function.
          examples: ['ATH-7QK2-4M']
        tier: { type: string, x-arthome-vocabulary: [full, reduced, support], x-arthome-vocabulary-source: PRICE_TIERS }
        state: { type: string, x-arthome-vocabulary: [held, active, cancelled, refunded, transferred, credited], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A state machine local to this resource. It is the contract's own, not the domain's: the domain owns the facts, this owns how far a request has got." }
        cancelDeadline:
          type: [string, 'null']
          format: date-time
          description: |
            Served as an **instant**. "Up to 1 h before the start" is a domain rule, not a screen
            caption.
        date: { $ref: '#/components/schemas/DateCard' }
        refund:
          type: [object, 'null']
          description: |
            What the viewer gets back, and **where**. The amount and a **delay code** — never the
            sentence "3 to 5 business days", which is a policy.
          properties:
            amount:
              $ref: '#/components/schemas/Money'
              x-arthome-tax-basis: inherited
            delayCode: { type: string, examples: [refund_delay_business_days_3_5] }
            method: { type: string, x-arthome-vocabulary: [original_payment_method, account_credit], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "Mirrors the payment provider's state machine. Theirs to change, ours to reflect — inventing a member here would describe a state their API never sends." }

    MerchItem:
      type: object
      required: [id, channelId, label, source, state]
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        showId: { type: [string, 'null'], format: uuid }
        label: { $ref: '#/components/schemas/LocalizedText' }
        variants:
          type: array
          description: |
            **A T-shirt without a size is not sellable.** The contract carries the variants; a cart line
            references a variant, never a bare item.
          items:
            type: object
            required: [id, label, inStock]
            properties:
              id: { type: string }
              label: { type: string, examples: [M] }
              inStock: { type: boolean }
              price:
                $ref: '#/components/schemas/Money'
                x-arthome-tax-basis: inclusive
        price:
          $ref: '#/components/schemas/Money'
          x-arthome-tax-basis: inclusive
        state: { type: string, x-arthome-vocabulary: [on_sale, out_of_stock], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A state machine local to this resource. It is the contract's own, not the domain's: the domain owns the facts, this owns how far a request has got." }
        source:
          type: string
          description: |
            The item's origin. An external source is not sold by us: it links out to `merchantUrl`, and
            no cart accepts it.
          x-arthome-vocabulary: [arthome, shopify, woocommerce, prestashop, drupal, api]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "An external provider or platform identifier. It is their vocabulary, not ours, and it changes when they change."
        merchantUrl: { type: [string, 'null'], format: uri }
        pinnedDuringLive: { type: boolean }
        media: { $ref: '#/components/schemas/MediaSet' }

    CartLine:
      type: object
      required: [id, itemId, variantId, quantity, channelId, unitPrice, version]
      properties:
        id: { type: string, format: uuid }
        itemId: { type: string, format: uuid }
        variantId: { type: string }
        channelId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        unitPrice:
          $ref: '#/components/schemas/Money'
          x-arthome-tax-basis: inclusive
        version:
          type: integer
          description: |
            **The ordering comes from the server.** Conflict between two devices: per line, last writer
            wins, arbitrated by this version number — never by a date from the phone, whose clock drifts
            and jumps.

    Cart:
      type: object
      required: [lines, vendorGroups]
      description: |
        **The cart lives on the account, not in the browser**: the design shows a persistent cart in
        the header, it is built up across several sessions from a live show's shop, and all three
        storefronts display it. A local cart would survive neither a reinstall nor a change of
        device.
      properties:
        lines: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        vendorGroups:
          type: array
          description: |
            **A merchandise order is single-vendor.** A cart holding items from two channels **splits
            into two orders at payment**, each with its own shipping, commission and payout. Two
            independent justifications: two shipments, and a Stripe `destination charge` admits **only one
            destination**.
          items:
            type: object
            properties:
              channelId: { type: string, format: uuid }
              lineIds: { type: array, items: { type: string, format: uuid } }

    CartQuote:
      type: object
      required: [groups, validUntil]
      description: |
        **The quote is binding**: the total presented is the one that will be charged. Shipping is
        computed **at quoting time**, not on adding. Past `validUntil`, a new quote.
      properties:
        groups:
          type: array
          items:
            type: object
            required: [channelId, subtotal, total]
            properties:
              channelId: { type: string, format: uuid }
              subtotal:
                $ref: '#/components/schemas/Money'
                x-arthome-tax-basis: inclusive
              shipping:
                $ref: '#/components/schemas/Money'
                x-arthome-tax-basis: inclusive
              discount:
                type: [object, 'null']
                description: |
                  **Shop** discount (15%) or promotion — **never both**: the one most favourable to the viewer
                  wins, and the rule lives in `@arthome/core`. Not to be confused with `seatDiscount`
                  (10 / 20%), which applies to **seats**: two discounts, two bases, and they coincide in no
                  source (E1).
                properties:
                  discountReasonCode: { type: string }
                  amount:
                    $ref: '#/components/schemas/Money'
                    x-arthome-tax-basis: inherited
              total:
                $ref: '#/components/schemas/Money'
                x-arthome-tax-basis: inclusive
        validUntil: { type: string, format: date-time, description: 15 minutes. }

    SeatQuote:
      type: object
      required: [lines, total]
      description: |
        The purchase summary for a seat, **composed server-side**. The four lines come from the
        contract: `tier + service fee − subscription discount − promotion = total`. This is exactly
        the "a total composed in two places" case the brief cites as a typical defect, and it is
        closed here.

        **Prices are tax-inclusive (D-056), so the VAT does not move the total — and it is served
        anyway**, in `vatIncluded`. EU invoicing requires the line, and the artist needs it. **A total
        that does not change is exactly why someone will be tempted to omit it.**

        **It is a separate field rather than a fifth line, and that is the point.** `lines` are
        addends; a VAT line inside them would be summed by somebody, on some surface, eventually —
        and the total would be wrong by a VAT rate in the direction nobody checks, because it would
        look larger rather than smaller. What is already inside a total cannot sit in the list of
        things added to it.
      properties:
        vatIncluded:
          type: array
          description: |
            **Already inside `total`, never added to it.** One line per jurisdiction, computed at the
            instant of sale from `BuyerTaxLocation` — which is why it appears here and **never on the
            catalogue**: a price carrying its VAT would be a price that varies by viewer, and the
            catalogue would stop being publicly cacheable. That cacheability is the reason tax-inclusive
            pricing was chosen.
          items:
            type: object
            required: [rateBps, amount, jurisdictionCode]
            properties:
              rateBps: { type: integer, examples: [550] }
              amount:
                $ref: '#/components/schemas/Money'
                x-arthome-tax-basis: inherited
              jurisdictionCode: { type: string, examples: [FR] }
        lines:
          type: array
          items:
            type: object
            required: [kind, amount]
            properties:
              kind: { type: string, x-arthome-vocabulary: [tier, service_fee, subscription_discount, promotion, credit_applied], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change." }
              discountReasonCode: { type: [string, 'null'] }
              amount:
                $ref: '#/components/schemas/Money'
                x-arthome-tax-basis: inherited
        total:
          $ref: '#/components/schemas/Money'
          x-arthome-tax-basis: inclusive
        validUntil: { type: string, format: date-time }

    TaxEvidence:
      type: object
      required: [kind, country, source, collectedAt]
      description: |
        **One item of location evidence, with its provenance.** A B2C sale inside the Union
        requires **two non-contradictory items** — and a tax provider generally prefers a single
        address over comparing them, so the evidence rule cannot be delegated to it: our own
        register carries it.

        `source` is not decorative: **evidence without provenance is not evidence**.
      properties:
        kind:
          type: string
          x-arthome-vocabulary:
            [billing_address, ip_address, bank_country, card_country, sim_country, declared_by_buyer]
          x-arthome-vocabulary-source: TAX_EVIDENCE_KINDS
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: What **this item** indicates — not the outcome of the arbitration.
        subdivision:
          type: [string, 'null']
          maxLength: 8
          description: 'ISO 3166-2, when the item carries it.'
        source: { type: string, minLength: 1, maxLength: 64, examples: ['edge.geoip'] }
        collectedAt: { type: string, format: date-time }

    BuyerTaxLocation:
      type: object
      required: [country, evidence, evidenceConflicting]
      description: |
        **The buyer's tax location, carried by the order.** Neither a market identifier nor a plain
        country: in the United States the rate changes from one street to the next, so the postal
        code is indispensable; in the Union the evidence is **double** and must be retained.

        **Not to be confused with the identity verification of the signed-in account**, which bears
        on the **artist** and has nothing to do with the **viewer's** location. The two are often
        conflated.
      properties:
        country: { type: string, pattern: '^[A-Z]{2}$' }
        subdivision: { type: [string, 'null'], maxLength: 8 }
        postalCode: { type: [string, 'null'], maxLength: 16 }
        city: { type: [string, 'null'], maxLength: 128 }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/TaxEvidence' }
        evidenceConflicting:
          type: boolean
          description: |
            True when two items contradict each other. **The sale goes through anyway** and the line is
            flagged for review: refusing the purchase would punish the viewer for an ambiguity that is
            not theirs, and hiding the conflict would produce a false and silent declaration.
        resolvedAt: { type: string, format: date-time }

    PaymentHandoff:
      type: object
      required: [orderId, state, paymentIntentRef, clientSecret, returnUrl]
      description: |
        **The step the contract did not have, and without which no payment subject to European strong
        authentication completes.** The state vocabulary carried `awaiting_action` ← "3-D Secure in
        progress", and **no operation could either reach that state or leave it**: the three money
        commands only answered `201 · paid`, with no `clientSecret`, no `nextAction`, no return
        address.

        This was not a refinement: a significant share of card payments in Europe requires strong
        authentication. A flow that does not provide for `requires_action` **fails in production on
        perfectly valid payments**, and it fails silently — the order stays `awaiting_action` and
        nothing picks it up.

        **The `clientSecret` is produced server-side** and serves only the surface's payment element;
        it authorises nothing else and replaces no session.
      properties:
        orderId: { type: string, format: uuid }
        state: { type: string, x-arthome-vocabulary: [pending, awaiting_action, processing], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "Mirrors the payment provider's state machine. Theirs to change, ours to reflect — inventing a member here would describe a state their API never sends." }
        paymentIntentRef:
          type: string
          description: '**Opaque** reference to the domain. Only the adapter knows how to read it.'
        clientSecret: { type: string }
        nextAction:
          type: [object, 'null']
          description: |
            What the surface must do next, **declared** rather than guessed: a strong-authentication
            redirect, or nothing.
          properties:
            kind: { type: string, x-arthome-vocabulary: [redirect_to_url, use_stripe_sdk, none], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "Mirrors the payment provider's state machine. Theirs to change, ours to reflect — inventing a member here would describe a state their API never sends." }
            redirectUrl: { type: [string, 'null'], format: uri }
        returnUrl:
          type: string
          format: uri
          description: |
            **Where the provider returns after authentication.** Allowlist of **literal strings**, never
            a pattern.

            **And the return confirms nothing**: *a payment confirmed by a URL parameter is a payment
            confirmed by the client*. The return says **where to go**; it is `getOrder` — fed by the
            verified webhook — that says **what changed**.
        expiresAt: { type: string, format: date-time }

    Order:
      type: object
      required: [id, reference, kind, state, placedAt]
      properties:
        id: { type: string, format: uuid }
        reference:
          type: string
          description: '**Readable** reference, the one support reads out over the phone.'
          examples: ['ATH-2026-00042']
        kind: { type: string, x-arthome-vocabulary: [seat, merch, subscription], x-arthome-vocabulary-source: ORDER_KINDS }
        channelId: { type: string, format: uuid }
        state: { type: string, x-arthome-vocabulary: [pending, awaiting_action, processing, paid, failed, refunded, partially_refunded, disputed], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "Mirrors the payment provider's state machine. Theirs to change, ours to reflect — inventing a member here would describe a state their API never sends." }
        total:
          $ref: '#/components/schemas/Money'
          x-arthome-tax-basis: inclusive
        placedAt: { type: string, format: date-time }
        invoiceAvailable: { type: boolean }
        buyerTaxLocation:
          $ref: '#/components/schemas/BuyerTaxLocation'
          description: |
            **Resolved and frozen at the instant of the sale.** It is not reread later: a viewer's
            country changes between two reads, and an invoice is kept for ten years.

    ExternalOrderRef:
      type: object
      required: [externalRef, externalHost, syncedAt]
      description: |
        An order placed on the artist's own shop is a **read-only reflection**: no invoice, no
        tracking, no refund on our side, and the contract states that explicitly rather than serving
        empty fields. **What we guarantee**: freshness as of `syncedAt`, nothing more. When the host
        does not answer, the reflection is served **with its age**, not as an error.
      properties:
        externalRef: { type: string }
        externalHost: { type: string }
        state:
          type: string
          const: external
          description: '**Opaque** vocabulary — we do not know the other shop''s states.'
        syncedAt: { type: string, format: date-time }
        syncSource: { type: string }

    Plan:
      type: object
      required: [tier, price, opens, seatDiscountBps]
      properties:
        tier:
          type: string
          x-arthome-vocabulary: [free, pass, premium]
          x-arthome-vocabulary-source: PLAN_TIERS
          description: |
            The authoritative vocabulary. `monthly`, `season` and `none` are **withdrawn**: no data
            references them, and four disjoint vocabularies made **every** account fall back to `free` —
            an **authorisation** defect, not a display one (E1).
        price:
          $ref: '#/components/schemas/Money'
          x-arthome-tax-basis: inclusive
        opens:
          type: array
          items:
            type: string
            description: |
              **One spelling, and only one — which is the part that is not cosmetic.** This is the
              vocabulary `decideWatch` depends on. An `opens.includes('multi_screen')` over a payload
              carrying `multi_screen` returns `false` **silently**, and everyone falls back to one
              screen — the shape of the authorisation defect the contract had fixed on **plans** and
              reintroduced on **openings**. Whichever spelling wins, both sides must carry it.

              **The rule this motive used to give has been reversed, and it is recorded rather than
              quietly deleted.** It read "kebab spelling, that of the authoritative source", because
              `shared/catalogue.json` carries `free-dates`, `no-ads`, `one-live-month`, `all-lives`,
              `multi-screen` in kebab. D-034 settles it the other way, on a distinction worth keeping:
              `shared/` → `@arthome/core` is a **one-time port**, which already normalises by design
              (D1 drops `light` and adds `essential`, D7 turns relative offsets into instants), while
              `core` ↔ the wire is a **live boundary**, and only a live boundary turns a mapping into
              a parallel table with a codec's costume. `shared/` is a mockup and will never be a
              runtime participant, so it does not convert and everything downstream of it does.

              **K6 is untouched by this.** Its defect was the **divergence** — an
              `opens.includes(…)` returning `false` in silence — never the separator. It is closed by
              the two sides agreeing, and they now agree on `snake_case`.
            x-arthome-vocabulary:
              [browse, trailers, free_dates, replays, no_ads, one_live_month, all_lives,
               multi_screen, archive]
            x-arthome-vocabulary-source: PLAN_OPENINGS
        seatDiscountBps: { type: integer, examples: [2000] }
        concurrentStreamsAllowed:
          type: integer
          description: '`multi_screen` is an **execution constraint**, not a marketing line: `ticketing` publishes the ceiling, `streaming` enforces it.'

    Subscription:
      type: object
      required: [planTier, state, currentPeriodEnd]
      properties:
        planTier: { type: string, x-arthome-vocabulary: [free, pass, premium], x-arthome-vocabulary-source: PLAN_TIERS }
        state: { type: string, x-arthome-vocabulary: [active, past_due, cancelled, trialing], x-arthome-vocabulary-source: SUBSCRIPTION_STATES }
        startedAt: { type: string, format: date-time }
        currentPeriodEnd: { type: string, format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        paymentMethodRef: { type: [string, 'null'] }

    # --------------------------------------------------------------- playback

    PlaybackTicket:
      type: object
      required:
        [sessionId, dateId, scope, protocol, manifestUrl, signature, expiresAt, renewAfterSec,
         leaseExpiresAt, qualityCap, chatMode, edgeRenewalMode]
      description: |
        **The whole `player` screen in a single response**: chapters, tracks, chat regime, ongoing
        incident, resume point, live edge, DRM and quality ceiling. No player panel may trigger a
        call — on television a modal *is* a page, and the budget is one round trip.

        **Budget: ≤ 1 s**, within a total budget of about 10 s to first frame.

        **Never cached** — `Cache-Control: no-store`. A right reread from disk is a false right.
      properties:
        sessionId:
          type: string
          format: uuid
          description: |
            **Recoverable after an OS kill.** The token being `no-store`, a client killed by the OS no
            longer has this `sessionId`: it could neither renew, nor release, nor point at its own
            session in the refusal list. Reopening with the **same `deviceId`** returns the same
            session — that is the mechanism, and it is declared.
        resumedExistingSession:
          type: boolean
          description: |
            True when this opening **took over this device's existing lease** instead of opening a second
            one. This is what stops a household being blocked by its own ghost screens — and it is
            decisive for a `pass` subscriber, whose ceiling is **one** screen: without takeover,
            reopening the app after an OS kill locks them out of their own phone for the ninety seconds
            of the lease.
        dateId: { type: string, format: uuid }
        scope:
          type: string
          x-arthome-vocabulary: [full, preview]
          x-arthome-vocabulary-source: WATCH_SCOPES
          x-arthome-vocabulary-narrowing: "`none` is a verdict, not a ticket: a ticket exists only where playback was allowed, so a scope of `none` here would be a token for watching nothing."
          description: |
            **A strict narrowing of `WATCH_SCOPES`, and the missing member is the rule.** `none` is a
            verdict, not a ticket: a ticket exists only where playback was allowed, so a scope of
            `none` here would be a token for watching nothing. `WatchVerdict.scope` carries all three
            because a verdict can say no; this one cannot.

            `preview` for a non-holder. Its token expires at `min(now + 120 s, now + secondsLeft)`:
            **reloading the page extends nothing**, and a reinstalled app resets no counter — the budget
            is **server-side**, per **account**.
        previewSecondsLeft: { type: [integer, 'null'] }
        protocol: { type: string, x-arthome-vocabulary: [hls, dash], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared." }
        drmSystem:
          type: [string, 'null']
          description: |
            **Chosen by the server for this device.** The fleet imposes HLS + FairPlay on tvOS and
            DASH + Widevine elsewhere, PlayReady on certain models: **a client that guesses gets it
            wrong**, and it gets it wrong on the devices we cannot test.
          x-arthome-vocabulary: [fairplay, widevine, playready]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared."
        qualityCap:
          type: string
          description: |
            The ceiling the device's **hardware** security level allows. An entry-level HDMI stick offers
            only software Widevine: the server **degrades cleanly** rather than refusing, and the surface
            **knows** it has been capped — so it does not offer "4K" in its quality panel.
          x-arthome-vocabulary: [sd, hd, fhd, uhd]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared."
        manifestUrl:
          type: string
          format: uri
          description: |
            **The path is stable and never carries the token.** A token in the path would force a
            manifest reload on every renewal, hence a micro-freeze every N minutes — visible on a static
            theatre shot. Stream paths are random and unpredictable.
        signature:
          type: object
          description: 'The signature covers a **path prefix**: signing the manifest and leaving the segments open is signing nothing.'
          properties:
            queryToken: { type: [string, 'null'] }
            cookieSet: { type: [boolean, 'null'] }
        edgeRenewalMode:
          type: string
          description: |
            **Declared, never guessed**: the two mechanisms are not equally available. `signed_cookie` for
            a browser — a same-origin call resets the cookie, zero URL change, zero interruption.
            `query_token` for native players, which reapply the current token through their request
            filter. `AVPlayer` on tvOS does not share the WebView's cookies: it is
            `AVAssetResourceLoaderDelegate`, and that is **the point to validate on a real device before
            promising anything**.
          x-arthome-vocabulary: [signed_cookie, query_token]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared."
        expiresAt:
          type: string
          format: date-time
          description: |
            **120 s.** The window during which one watches a stream one is no longer entitled to is the
            **renewal** interval, not the token's lifetime.
        renewAfterSec:
          type: integer
          description: '**45 s**, under the 60 s ceiling the TV requires: it is the renewal that carries the concurrent-screen limit.'
          examples: [45]
        leaseExpiresAt:
          type: string
          format: date-time
          description: |
            **90 s.** It is the **lease** that carries the concurrent-screen limit, not a release command:
            a television gets unplugged, a set-top box loses power, the OS kills a mobile app without
            warning. `releasePlayback` speeds it up, **nothing depends on it**.
        resumePoint:
          type: [object, 'null']
          properties:
            positionSec: { type: integer }
            writtenAt: { type: string, format: date-time }
        liveEdgeSec: { type: [integer, 'null'] }
        chapters: { type: array, items: { $ref: '#/components/schemas/Chapter' } }
        audioTracks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              language: { type: string }
              kind: { type: string, x-arthome-vocabulary: [main, audio_description], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change." }
        subtitleTracks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              language: { type: string }
              kind:
                type: string
                x-arthome-vocabulary: [subtitles, captions, surtitles]
                x-arthome-vocabulary-source: none
                x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change."
        chatMode: { type: string, x-arthome-vocabulary: [open, emoji, read_only, 'off'], x-arthome-vocabulary-source: CHAT_MODES }
        chatRateLimitPerSecond: { type: integer }
        incident: { $ref: '#/components/schemas/Incident' }
        date: { $ref: '#/components/schemas/DateCard' }

    PlaybackRenewal:
      type: object
      required: [expiresAt, renewAfterSec, leaseExpiresAt]
      description: |
        **Partial** renewal: nothing that would force a stream reload. The refusal carries one of the
        four distinct codes — a generic code would produce a false one three times out of four.
      properties:
        expiresAt: { type: string, format: date-time }
        renewAfterSec: { type: integer }
        leaseExpiresAt: { type: string, format: date-time }
        signature:
          type: object
          properties:
            queryToken: { type: [string, 'null'] }
            cookieSet: { type: [boolean, 'null'] }
        qualityCap: { type: string, x-arthome-vocabulary: [sd, hd, fhd, uhd], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared." }

    ActivePlaybackSession:
      type: object
      required: [sessionId, deviceLabel, openedAt]
      description: |
        Served **with** the `watch.concurrent_limit_reached` refusal, so the surface can offer to release
        one. A bare refusal would leave the viewer with no way out.
      properties:
        sessionId: { type: string, format: uuid }
        deviceId:
          type: string
          format: uuid
          description: |
            **Served, because without it the list is not actionable.** The surface must be able to
            recognise **its own** session in order to offer "resume here" rather than "release another
            screen", and a device label is not enough: two phones of the same model carry the same one.
        isCurrentDevice: { type: boolean }
        deviceLabel: { type: string, examples: ['Téléviseur du salon'] }
        city: { type: [string, 'null'] }
        openedAt: { type: string, format: date-time }

    Incident:
      type: [object, 'null']
      description: |
        **A client-side veil, never a stream switch**: the control room publishes the state, the
        player displays it over an untouched video. Instant, identical on all three storefronts, and
        the media stays intact for the resume. Latency **≤ 2 s, non-negotiable**.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, x-arthome-vocabulary: [hold_screen, postponed, cancelled, interrupted], x-arthome-vocabulary-source: INCIDENT_KINDS }
        message:
          $ref: '#/components/schemas/LocalizedText'
          description: |
            Written by the control room: it is **content**, not an i18n key, and it travels with its
            authoring language like a synopsis. One of the only two acknowledged exceptions to "i18n by
            codes".
        raisedAt: { type: string, format: date-time }

    ChatMessage:
      type: object
      required: [id, dateId, seq, authorHandle, atMediaSec, sentAt, badge, body]
      properties:
        id: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        seq:
          type: integer
          format: int64
          description: Monotonic per date. **The resume point** of the real-time stream.
        authorHandle: { type: string, examples: ['@marie.j'] }
        authorRoleCode: { type: [string, 'null'], description: Present for a team message — those always clear the rate ceiling. }
        atMediaSec:
          type: integer
          description: |
            **The position in the media**, not the time it was sent. Without it, chat replayed over a
            recording is offset by however long the viewer took to start playback.
        sentAt:
          type: string
          format: date-time
          description: The absolute instant, **in addition**. Both are carried, never one alone.
        badge:
          type: string
          description: |
            The single badge, **derived** by `moderationBadgeOf` and **served**, never recomposed.
            Precedence: banned > silenced > removed > published. Three separate axes on the model side —
            message state, nature of the queue line, sanction on the person — never stacked.
          x-arthome-vocabulary: [banned, muted, removed, published]
          x-arthome-vocabulary-source: MODERATION_BADGES
        body: { $ref: '#/components/schemas/LocalizedText' }

    ReactionQuota:
      type: object
      required: [remaining, rechargesAt]
      description: |
        **Returned with the response.** The surface must **disable** the control rather than let it
        fail: an inert action is proscribed by the brief, but an action that fails silently is worse.
        One reaction in flight at a time.
      properties:
        remaining: { type: integer }
        rechargesAt: { type: string, format: date-time }

    # ------------------------------------------------------------------ pairing

    DevicePairing:
      type: object
      required: [pairingId, intent, userCode, verificationUri, verificationUriComplete, expiresAt, pollIntervalSec, state]
      description: |
        **One primitive, five intents.** Four of the five are not OAuth authorisation flows: buying a
        seat from an already-signed-in television is not a token request, it is a **transaction
        rendezvous**. What is single is the state machine; what differs is the effect of approval.
      properties:
        pairingId:
          type: string
          format: uuid
          description: |
            **Persisted by the surface**, so it can reattach after a restart rather than opening a second
            pairing. Without it, a television restarted during payment shows the home screen while the
            payment completes into the void.
        intent: { type: string, x-arthome-vocabulary: [signin, seat, plan, payment_method, merch], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change." }
        userCode:
          type: string
          description: |
            Six characters over the alphabet `ACDEFHJKLMNPQRTUVWXY23456789` (28 symbols, **28.8 bits**)
            declared by `adr-auth.md` §5.1 — `B`, `S`, `Z` and `G` are removed from it because a
            television code is often read aloud to someone else in the room. Case-insensitive, spaces and
            readability punctuation ignored.
          examples: ['K7M2PQ']
        verificationUri: { type: string, format: uri }
        verificationUriComplete:
          type: string
          format: uri
          description: '**Served**, never built by the surface. It is what the TV encodes in the QR code.'
        expiresAt:
          type: string
          format: date-time
          description: |
            **Per intent, and served**: `signin` 15 min (fetch your phone, do a 2FA); `seat` and `merch`
            **5 min** — beyond that the displayed gauge is no longer true; `plan` and `payment_method`
            10 min. Never hardcoded in the surface. **The waiting screen shows no countdown**: the TV
            uses it to give up, not to worry the viewer.
        pollIntervalSec:
          type: integer
          description: |
            **Backoff served by the server**, hence tunable: **2 s for the first 60 seconds**, then 5 s.
            Thirty requests at most per pairing, and the "switch in two seconds at most" requirement is
            met **without** bringing a device identity into the WebSocket namespace.
          examples: [2]
        state:
          type: string
          description: |
            **`engaged` is the state that protects the money.** It is set as soon as the phone enters the
            payment flow, and **before** `ticketing` executes. From then on the pairing is no longer
            cancellable: without that state, a press on Back — the most used key on a remote — cancels a
            pairing whose payment is already in flight, and the seat is charged without either screen
            saying so.
          x-arthome-vocabulary: [pending, engaged, approved, denied, expired, cancelled, approved_with_failure]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A state machine local to this resource. It is the contract's own, not the domain's: the domain owns the facts, this owns how far a request has got."

    PairingOutcome:
      type: object
      required: [pairingId, intent, state, pollIntervalSec]
      description: |
        **The `confirm` screen costs zero calls.** Everything comes from here, composed by the BFF
        from the opaque pointer `identity` set: a confirmation that loads is a confirmation nobody
        believes.

        **Five outcomes, five codes.** `approved_with_failure` says "the phone finished, the purchase
        failed" — sold out in the meantime, payment declined. A single code would produce a false
        message four times out of five, and the TV must **never** display "reserved" in that case.
      properties:
        pairingId: { type: string, format: uuid }
        intent: { type: string, x-arthome-vocabulary: [signin, seat, plan, payment_method, merch], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change." }
        state:
          type: string
          description: |
            **`engaged` is the state that protects the money.** It is set as soon as the phone enters the
            payment flow, and **before** `ticketing` executes. From then on the pairing is no longer
            cancellable: without that state, a press on Back — the most used key on a remote — cancels a
            pairing whose payment is already in flight, and the seat is charged without either screen
            saying so.
          x-arthome-vocabulary: [pending, engaged, approved, denied, expired, cancelled, approved_with_failure]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A state machine local to this resource. It is the contract's own, not the domain's: the domain owns the facts, this owns how far a request has got."
        pollIntervalSec: { type: integer }
        failureCode: { type: [string, 'null'], x-arthome-vocabulary: [order.sold_out, order.payment_declined, order.price_stale, order.plan_unavailable], x-arthome-vocabulary-source: ORDER_ERROR_CODES, x-arthome-vocabulary-narrowing: "The four a purchase command can refuse with. `order.quote_address_mismatch` is not among them: it is raised by the quote, before a command exists to refuse." }
        ticket: { $ref: '#/components/schemas/TicketCard' }
        order: { $ref: '#/components/schemas/Order' }
        subscription: { $ref: '#/components/schemas/Subscription' }
        viewerContext:
          $ref: '#/components/schemas/ViewerContext'
          description: Present for an approved `signin` — the TV does not have to re-bootstrap.

    AccountDeepLink:
      type: object
      required: [url]
      description: |
        **What is not a pairing.** The QR code on the account page points at account management on a
        phone: nothing waits, the screen does not switch, no pairing row is opened. Two distinct
        shapes in the contract, otherwise someone will implement a wait where there is none.
      properties:
        url: { type: string, format: uri }

    # --------------------------------------------------------------- account

    SavedSearch:
      type: object
      required: [id, scope, criteria, criteriaVersion, criteriaSignature, channels, active, newMatchesSinceLastVisit]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, x-arthome-vocabulary: [search, category], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change." }
        categoryId: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        queryText: { type: [string, 'null'] }
        criteria:
          type: object
          additionalProperties: true
          description: |
            **Filter values are stable identifiers**, never array indices. The design filters on a
            position (`fCats: [1]`); a position survives neither a shareable URL, nor a saved search, nor
            the insertion of a discipline.
        criteriaVersion:
          type: integer
          description: |
            When the filter grammar changes, yesterday's search **still runs** if migration is possible;
            otherwise it marks itself `stale` **and says so**. It never disappears silently.
        criteriaSignature:
          type: string
          description: Produced by `normalizeSearchCriteria()` in `@arthome/core`, once only, **never client-side**. It is what answers "already saved" and what deduplicates on write.
        stale: { type: boolean }
        channels:
          type: array
          items: { type: string, x-arthome-vocabulary: [push, email, in_app], x-arthome-vocabulary-source: NOTIFICATION_CHANNELS }
        active: { type: boolean }
        newMatchesSinceLastVisit:
          type: integer
          description: |
            **"New since your last visit"**, incremented by the index's *percolator* and reset to zero on
            read. Ten searches then cost **zero** counting queries when the page opens; the other two
            options cost ten.

    NotificationEntry:
      type: object
      required: [id, triggerCode, params, createdAt, read]
      properties:
        id: { type: string, format: uuid }
        triggerCode: { type: string, examples: [date_starts_soon] }
        params: { type: object, additionalProperties: true }
        deepLink: { type: [string, 'null'], format: uri }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }

    NotificationPreferences:
      type: object
      description: Five triggers × three channels, plus quiet hours.
      properties:
        triggers:
          type: object
          additionalProperties:
            type: array
            items: { type: string, x-arthome-vocabulary: [push, email, in_app], x-arthome-vocabulary-source: NOTIFICATION_CHANNELS }
        quietHours:
          type: object
          description: |
            11 p.m. → 9 a.m. by default, **with the exception conditioned on holding a seat** — this is a
            **business rule**, not an interface setting: nobody misses a show they paid for because it
            starts at 11.15 p.m.
          properties:
            enabled: { type: boolean }
            fromHour: { type: integer, minimum: 0, maximum: 23 }
            toHour: { type: integer, minimum: 0, maximum: 23 }
            bypassWhenTicketHeld: { type: boolean }

    Consents:
      type: object
      description: |
        Four purposes and two tracker categories. **Timestamped by the server and versioned with the
        version of the text accepted**: a consent without a version or a date is worth nothing. `ads`
        is `false` by default, and **that default is a contract decision**, not a setting.
      properties:
        purposes:
          type: object
          properties:
            audience: { type: boolean }
            perso: { type: boolean }
            partners: { type: boolean }
            ads: { type: boolean, default: false }
        cookieCategories:
          type: object
          additionalProperties: { type: boolean }
        textVersion: { type: integer }
        recordedAt: { type: string, format: date-time }

    Device:
      type: object
      required: [id, kind, label, lastSeenAt, isCurrent]
      description: |
        The **registered** device, durable, revocable, identified **before any session**. Distinct
        from `DeviceSession`, which is the (device, profile) pair: a living-room television carries
        up to five sessions on a single device.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, x-arthome-vocabulary: [tv, mobile, tablet, desktop, stick, console, box], x-arthome-vocabulary-source: DEVICE_KINDS }
        label: { type: string }
        city: { type: [string, 'null'] }
        lastSeenAt: { type: string, format: date-time }
        isCurrent: { type: boolean }
        sessions:
          type: array
          items:
            type: object
            required: [sessionId, profileId]
            properties:
              sessionId: { type: string, format: uuid }
              profileId: { type: string, format: uuid }
              profileName: { type: string }

    AccountScreen:
      type: object
      description: |
        **One** aggregate for the account's eleven sections. They justify neither eleven calls nor
        eleven schemas: eight are projections of this one, and only `alerts`, `orders` and `privacy`
        introduce shapes nothing else carries — they are paginated separately.
      properties:
        profile:
          type: object
          properties:
            publicHandle: { type: string }
            displayName: { type: string }
            email: { type: string, format: email }
            emailVerified: { type: boolean }
            phone: { type: [string, 'null'] }
            phoneVerified: { type: boolean }
            memberNumber: { type: string }
            city: { type: [string, 'null'] }
        subscription: { $ref: '#/components/schemas/Subscription' }
        credits:
          type: array
          description: |
            Account credit — an **internal currency**, hence a liability. Issued for an `interrupted`
            outcome, **redeployable on the issuing chain only** (D-017), 12 months.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              channelId: { type: string, format: uuid }
              amount:
                $ref: '#/components/schemas/Money'
                x-arthome-tax-basis: inherited
              originCode: { type: string, x-arthome-vocabulary: [interrupted_date, goodwill], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change." }
              expiresAt: { type: string, format: date-time }
        paymentMethods:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              brandCode: { type: string }
              last4: { type: string }
              expiryMonth: { type: integer }
              expiryYear: { type: integer }
        security:
          type: object
          properties:
            twoFactorEnabled: { type: boolean }
            passkeyCount: { type: integer }
            hasPassword: { type: boolean }
        devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
        preferences: { $ref: '#/components/schemas/ViewerPreferences' }
        notificationPreferences: { $ref: '#/components/schemas/NotificationPreferences' }
        consents: { $ref: '#/components/schemas/Consents' }
        deletion:
          type: [object, 'null']
          description: |
            Account deletion is a **financial** command as much as a personal one: it cancels unused
            seats, therefore it refunds, therefore it touches payouts that may already have been
            computed, and it collides with ten-year accounting retention. It is **asynchronous**, with
            **30 days of grace** — reactivable on a simple sign-in until then — and it **anonymises**
            instead of deleting.
          properties:
            state: { type: string, x-arthome-vocabulary: [requested, anonymised], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A state machine local to this resource. It is the contract's own, not the domain's: the domain owns the facts, this owns how far a request has got." }
            requestedAt: { type: string, format: date-time }
            graceUntil: { type: string, format: date-time }

    ExportRequest:
      type: object
      required: [exportId, kind, state, requestedAt]
      description: |
        **A FEC file or a GDPR export is not an HTTP response.** The command returns an
        acknowledgement and an identifier; the state is queryable; the document arrives through a
        **short-lived signed URL** — usable **without a session cookie**, because an export protected
        by a cookie is undownloadable from a native shell.
      properties:
        exportId: { type: string, format: uuid }
        kind: { type: string, x-arthome-vocabulary: [personal_data, invoices], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A document or export format. It names an accounting tool or a file type, which is the outside world's vocabulary rather than ours." }
        state: { type: string, x-arthome-vocabulary: [queued, running, ready, failed, expired], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A state machine local to this resource. It is the contract's own, not the domain's: the domain owns the facts, this owns how far a request has got." }
        requestedAt: { type: string, format: date-time }
        downloadUrl: { type: [string, 'null'], format: uri }
        downloadExpiresAt: { type: [string, 'null'], format: date-time }
