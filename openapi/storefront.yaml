openapi: 3.1.1

info:
  title: Arthome Storefront BFF
  version: 1.0.0
  summary: The single contract for the three public surfaces — web, mobile, television.
  description: |
    Contract of the **storefront BFF**. It serves `storefront-web` (Next.js),
    `storefront-mobile` (React Native) and `storefront-tv` (react-native-tvos). These three
    surfaces share one document: what differs between them is a **parameter**
    (`X-Arthome-Surface`), never a shape.

    ## This document is generated, it is not written

    The source is zod, in `@arthome/contracts`; this document is produced by `z.toJSONSchema()`.
    Three consequences, visible throughout what follows:

    - **no date is a `z.date()`** and **no boundary schema carries a `z.transform()`**: both are
      unconvertible. Instants are `date-time` strings (RFC 3339, UTC).
    - a **request** schema is converted with `io: "input"`, a **response** schema with
      `io: "output"`. Getting it backwards produces false documentation.
    - the regenerated document must be **identical** to the committed one. That is a gate in
      `definition-of-done.md`.

    ## Closed vocabularies, and the survival of the fleet

    A closed vocabulary appears in two forms, and **they are not the same**.

    - on **input** (what the client sends): strict `enum`. An unknown value is refused with
      `SCHEMA_INVALID`.
    - on **output** (what the server returns): `type: string` together with
      `x-arthome-vocabulary`, which lists the known values **for documentation only**. A surface
      that receives a value missing from that list **keeps it raw and treats it as neutral**; it
      never rejects, and above all it does not fail the whole page.

    The reason is `storefront-tv` Q12: a version published today will be running in living rooms
    a year from now, and the day the catalogue gains a 22nd discipline, those televisions will
    receive it. Strictness applies to the **shape** — required fields, types — never to the
    **member** of a vocabulary.

    ## A coded field is named after its vocabulary, never `reasonCode`

    `reasonCode` was carried by **five fields over four unrelated vocabularies** across the two
    contracts — playback refusals, blackout reasons, refund reasons, cancellation reasons — plus two
    price lines where it was a bare string. Nothing collided on the wire, since each lives in its own
    schema, and that is exactly what made it survive: **it was disambiguated only by where the reader
    was standing.** A generated client may hoist one `ReasonCode` type out of all of them, and a human
    reading both documents assumes one vocabulary and is wrong.

    So every coded field now names its own vocabulary — `denialReasonCode`, `blackoutReasonCode`,
    `refundReasonCode`, `cancelReasonCode`, `discountReasonCode` — which is the convention
    `failureCode`, `originCode` and `emptyReason` were already following. The generic name was the
    exception, not the rule.

    **The one place a bare `reasonCode` remains is inside `error.params`**, and it is not an exception
    to this: `params` is a bag whose keys are defined **per error `code`**, so the code that carries it
    is the disambiguator, stated rather than inferred.

    ## Public read and identified read — two bodies, one path

    **Ten catalogue operations are callable with no authentication at all**, and that is the
    **nominal** case: `home`, `live`, `categories`, `categories/{id}`, `artists`,
    `artists/{id}`, `dates/{id}`, `dates/{id}/availability`, `search`, `plans`. This surface
    exists to be indexed — the brief defines it by "search ranking and server rendering are
    decisive" — and a search engine's crawler has no cookie, no bearer token, and no reason
    whatsoever to manufacture one. **Guest mode** takes exactly the same path.

    The same path returns **two bodies**, and the difference is declared:

    | Called | Body | `Cache-Control` |
    |---|---|---|
    | with no authentication at all | **public body** — `watchVerdict`, `viewerRelations` and `viewerProgress` are **absent** | `public, max-age=<freshness>` |
    | with a session, bearer token or device token | public body **plus** the three overlays | `private, max-age=<freshness>` |

    **The public body is identical for every anonymous caller.** That is what makes it shareable:
    a cached render function can read neither cookie nor header, so it is anonymous by
    construction, and it can cache that body without risk. Serving as `public` a body that varies
    per viewer would be **a leak, not an optimisation** — and that is the sole reason for the
    `Vary` declared on these ten responses.

    **An absent field is never a null field**: the projection rule holds here as it does on the
    studio side. A surface receiving the public body knows it did not ask for the overlays; it
    does not confuse them with a refused right.

    **The absence of a credential is never a `401`.** A `401` on these ten paths means a
    credential was **presented and refused** — expired, malformed, wrong audience.

    ## What every response carries

    `servedAt` on **every** response; `validUntil` as soon as a perishable value is present;
    `lastEventSeq` on every read model fed by a stream. Every displayed countdown is computed
    against `servedAt`, **never** against the client's clock — a phone's clock drifts in standby,
    jumps on a timezone change, and its owner can set it.

    ## Errors

    One envelope, up to and including Traefik: `code`, `nature`, `params`, `traceId`. A
    validation failure translates into a **code**, never into a zod message in English. `nature`
    is `refused` (the server said no definitively), `unavailable` (retry) or
    `offline_forbidden` — the last one is **never emitted by the server**: it is the nature of a
    local refusal, produced by the surface before anything is sent, and it is in the vocabulary
    so that the surface has only one error shape to render.

    ## Pagination (D-010)

    The storefront paginates **by cursor**, opaque, Base64-encoded over the composite key
    `(created_at, id)`. It is **bidirectional**, **independent of page size** — a screen rotation
    does not invalidate it — and it lives **24 hours**. Beyond that: `410` `CURSOR_TOO_OLD`,
    which demands a full reload and says so.

    ## Maturity

    Endpoints served by `identity`, `catalog` and `ticketing` are **stable**: `oasdiff breaking`
    blocks any break. Those served by `streaming`, `chat`, `payouts` and `notifications` are
    **provisional**: `oasdiff` is a warning there. Every operation carries
    `x-arthome-maturity`.
  contact:
    name: Arthome — architecture
  license:
    name: UNLICENSED

servers:
  - url: https://api.arthome.fr
    description: production
  - url: https://api.staging.arthome.fr
    description: recette
  - url: http://localhost:3001
    description: local development (docker compose)

tags:
  - name: bootstrap
    description: Bootstrap, viewer context, invalidations.
  - name: discovery
    description: Home, live, disciplines, artists, search.
  - name: date
    description: A date's record, and everything attached to it.
  - name: commerce
    description: Seats, cart, merchandise, subscription.
  - name: playback
    description: Right to watch, token, session, resume position.
  - name: chat
    description: The viewer's voice during a live show.
  - name: pairing
    description: Device pairing (RFC 8628) — the five intents.
  - name: account
    description: Account, preferences, security, personal data.

security:
  - sessionCookie: []
  - bearerToken: []

paths:

  # =============================================================== bootstrap

  /v1/devices:
    post:
      operationId: registerDevice
      tags: [bootstrap]
      summary: Registers the device and returns its device token.
      description: |
        **Called on first launch, before any session.** Device identity is a contract notion, and
        it is required for four things the surfaces ask for: opening and polling a pairing, naming
        itself under "connected devices", being revoked, and carrying a rate limit somewhere other
        than the IP address — which a household behind a NAT shares.

        It **is not a session** and opens no personal data; in particular it does not open the
        real-time channel.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, label]
              properties:
                kind: { type: string, enum: [tv, mobile, tablet, desktop, stick, console, box], x-arthome-vocabulary-source: DEVICE_KINDS }
                label: { type: string, maxLength: 80 }
                osVersion: { type: string }
                appVersion: { type: string }
            example: { kind: tv, label: 'Téléviseur du salon', osVersion: 'tvOS 19.2', appVersion: '1.4.0' }
      responses:
        '201':
          description: Device registered. The token is to be kept in the native store.
          headers:
            X-Arthome-Served-At: { $ref: '#/components/headers/ServedAt' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [deviceId, deviceToken, expiresAt]
                        properties:
                          deviceId: { type: string, format: uuid }
                          deviceToken: { type: string }
                          expiresAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:02:11.004Z'
                data:
                  deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                  deviceToken: eyJhbGciOiJFUzI1NiIsImtpZCI6ImRldi0yMDI2LTA5In0
                  expiresAt: '2027-03-20T18:02:11.004Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/auth/sign-up:
    post:
      operationId: signUp
      tags: [account]
      summary: Creates an account with email and password.
      description: |
        **A documented relay to `identity`, and the relay is mandatory, not preferable.** Three
        reasons, the first of which comes from our own tooling:

        1. **zod is the source and the OpenAPI is generated from it.** A transparent relay has no
           schema, so it **would not appear in this document** — the six missing contracts would
           stay missing. That is the decisive argument;
        2. **i18n by codes.** The authentication library answers in English sentences
           (`"Invalid email or password"`), which the error envelope forbids. The BFF translates
           into **codes**, envelope included;
        3. **rate limiting per `device_id`**, which the library cannot do: its ceilings are per
           address or per session, and a living room behind a NAT shares its address.

        The cookie, when there is one, is set on the **BFF's domain** — that is what lets the
        server renderer read it, and what keeps critical rule 1 free of an exception through the
        authentication door.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, mode, acceptedTermsVersion]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                displayName: { type: string, maxLength: 80 }
                mode: { $ref: '#/components/schemas/SessionMode' }
                deviceId: { type: [string, 'null'], format: uuid }
                acceptedTermsVersion:
                  type: integer
                  description: '**Timestamped by the server, versioned**: a consent without a version or a date is worth nothing.'
            example: { email: marie@example.org, password: 'a-long-password', displayName: 'Marie J.', mode: cookie, acceptedTermsVersion: 3 }
      responses:
        '201':
          description: Account created and session opened, in the requested mode.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SessionEstablished' } }
              example:
                servedAt: '2026-09-21T18:00:00.000Z'
                data:
                  mode: cookie
                  viewerContext:
                    deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                    signedIn: true
                    profiles: []
                    constants: { roomOpensMinutesBefore: 30, cancelDeadlineMinutesBefore: 60, scarcityThresholdBps: 8500, billboardPreviewDelaySec: 4, waitlistPriorityWindowHours: 2, chatRateLimitPerSecond: 10, reactionQuotaPerDate: 20, reminderLeadMinutes: 30, replayExpiryWarningHours: 6 }
                    labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                    taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: '`EMAIL_TAKEN` — a **code**, not the library''s English sentence.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: identity.email_taken, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:00:00.000Z'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [account]
      summary: Opens a session with email and password.
      description: |
        Same relay, same translation into codes: `INVALID_CREDENTIALS` **never** distinguishes an
        unknown email from a wrong password — the distinction would tell an attacker which accounts
        exist.

        `TWO_FACTOR_REQUIRED` is an **intermediate** refusal, not a failure: it carries a
        `challengeId` to present to `/v1/auth/two-factor/verify`.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      x-arthome-idempotency-exemption: |
        **The one exemption that is not "nothing to deduplicate": this one is a prohibition.** The
        idempotency regime replays the original response **verbatim**; on a session opening, that
        would amount to **returning a token without having verified the credentials**. A replayed
        key would become a session bearer — and a stolen key, a stolen session.

        The five other authentication routes do carry the key, because a replay there returns the
        original response rather than a `410` or a second effect: that is safe resumption. A
        sign-in, no — it must **always** re-authenticate. The protection against double submission
        here is rate limiting per `device_id`, not the idempotency store.
      security: []
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, mode]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                mode: { $ref: '#/components/schemas/SessionMode' }
                deviceId: { type: [string, 'null'], format: uuid }
            example: { email: marie@example.org, password: 'a-long-password', mode: bearer, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77 }
      responses:
        '200':
          description: Session opened, in the requested mode.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SessionEstablished' } }
              example:
                servedAt: '2026-09-21T18:00:10.000Z'
                data:
                  mode: bearer
                  accessToken: sess_9f2ac1b4
                  refreshToken: refr_4d77e2
                  expiresAt: '2026-09-28T18:00:10Z'
                  viewerContext:
                    deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                    signedIn: true
                    profiles: []
                    constants: { roomOpensMinutesBefore: 30, cancelDeadlineMinutesBefore: 60, scarcityThresholdBps: 8500, billboardPreviewDelaySec: 4, waitlistPriorityWindowHours: 2, chatRateLimitPerSecond: 6, reactionQuotaPerDate: 20, reminderLeadMinutes: 30, replayExpiryWarningHours: 6 }
                    labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                    taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
        '401':
          description: '`INVALID_CREDENTIALS`, or `TWO_FACTOR_REQUIRED` with its `challengeId`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: identity.two_factor_required, nature: refused, params: { challengeId: chl_7ab2 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:00:10.000Z'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [account]
      summary: Closes the current session — and nothing else.
      description: |
        **The trap this operation exists to avoid.** The authentication library's `signOut` revokes
        **all** of the user's sessions. On a television shared by five profiles, that is never what
        anyone wants: it would sign out the whole living room.

        **Two gestures, two routes, never one for the other**:
        - **this one** closes the current session;
        - **`DELETE /v1/me/device-sessions/{sessionId}`** signs out **one profile** from a device
          (`multi-session.revoke`), the other accounts staying signed in;
        - **`DELETE /v1/me/devices/{deviceId}`** removes the device, all its sessions **and its
          playback leases**.

        **Order matters in `bearer` mode**: the session is destroyed server-side **then** the client
        clears its native store. Clearing the store is not revoking. In `cookie` mode, the cookie is
        cleared **with exactly the attributes that set it** — otherwise it is not cleared.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Session closed. Replayed, it succeeds.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { signedOut: { type: boolean } } }
              example:
                servedAt: '2026-09-21T23:00:00.000Z'
                data: { signedOut: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/forget-password:
    post:
      operationId: requestPasswordReset
      tags: [account]
      summary: Requests a password reset link.
      description: |
        **Always answers `202`, whether the account exists or not.** Distinguishing the two would
        tell an attacker which emails are registered.

        **The email's link points at the surface, never at the API** — `arthome.fr/reset?token=…` —
        and therefore **per product and per language**. The library's default builds it from its own
        base address and would land the person on an API.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                locale:
                  type: string
                  description: |
                    **The domain declares exactly two.** This one is an **input**, so the enum is strict:
                    a locale we cannot render is refused rather than silently answered in another
                    language.
                  enum: [fr, en]
                  x-arthome-vocabulary-source: LOCALES
                  examples: [fr]
            example: { email: marie@example.org, locale: fr }
      responses:
        '202':
          description: Request accepted — the answer is the same in both cases.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { accepted: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:01:00.000Z'
                data: { accepted: true }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [account]
      summary: Sets a new password from a reset token.
      description: |
        **Does not open a session.** The person signs in again, which proves the new password works
        and avoids an email link becoming a session bearer. The token is single-use and
        short-lived.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
            example: { token: rst_9f2ac1, password: 'a-new-password' }
      responses:
        '200':
          description: Password changed. **All other sessions are revoked** — a password changed after a theft must close the door.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { changed: { type: boolean }, otherSessionsRevoked: { type: integer } } }
              example:
                servedAt: '2026-09-21T18:02:00.000Z'
                data: { changed: true, otherSessionsRevoked: 3 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/auth/social/{provider}/start:
    post:
      operationId: startSocialSignIn
      tags: [account]
      summary: Starts a social sign-in — the surfaces never talk to the provider.
      description: |
        **The OAuth client is confidential and server-side.** No application embeds a secret: that
        is the only defensible form on a distributed binary, and the redirect is registered **once
        per provider**, on the BFF's domain.

        **The deep link on return never carries the token.** It carries only a **single-use opaque
        state**, which the application then exchanges for its token over direct TLS with the BFF
        (`/v1/auth/exchange`). The return URL travels through the operating system, can be logged,
        and can be opened by another application.

        **Per surface**: browsers follow an ordinary redirect; native shells open the **system
        browser**, never their WebView, and come back through a universal link. **The television
        does no OAuth**: it goes through pairing, intent `signin`.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, facebook], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "An external provider or platform identifier. It is their vocabulary, not ours, and it changes when they change." }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: '#/components/schemas/SessionMode' }
                deviceId: { type: [string, 'null'], format: uuid }
                returnPath:
                  type: [string, 'null']
                  description: |
                    **Relative** return path inside the surface. An absolute address is refused: the allowlist
                    is made of **literal strings**, never of a pattern.
            example: { mode: bearer, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77, returnPath: /compte }
      responses:
        '200':
          description: The authorization address to open, and the opaque state that will come back.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [authorizationUrl, state, expiresAt]
                        properties:
                          authorizationUrl: { type: string, format: uri }
                          state: { type: string, description: '**Opaque, single-use, short-lived.** It carries nothing meaningful.' }
                          expiresAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:03:00.000Z'
                data:
                  authorizationUrl: 'https://api.arthome.fr/v1/auth/social/google/redirect?state=ott_9f2ac1'
                  state: ott_9f2ac1
                  expiresAt: '2026-09-21T18:13:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/auth/exchange:
    post:
      operationId: exchangeOneTimeToken
      tags: [account]
      summary: Exchanges the opaque state from the return for a session.
      description: |
        **This is what makes the journey replayable if the operating system kills the application
        during the detour**: the pending state lives server-side, not in application memory. On
        return, the deep link says **where to go**, and this exchange says **what changed**.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, mode]
              properties:
                state: { type: string }
                mode: { $ref: '#/components/schemas/SessionMode' }
                deviceId: { type: [string, 'null'], format: uuid }
            example: { state: ott_9f2ac1, mode: bearer, deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77 }
      responses:
        '200':
          description: Session opened in the requested mode.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SessionEstablished' } }
              example:
                servedAt: '2026-09-21T18:03:40.000Z'
                data:
                  mode: bearer
                  accessToken: sess_4d77e2
                  expiresAt: '2026-09-28T18:03:40Z'
                  viewerContext:
                    deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                    signedIn: true
                    profiles: []
                    constants: { roomOpensMinutesBefore: 30, cancelDeadlineMinutesBefore: 60, scarcityThresholdBps: 8500, billboardPreviewDelaySec: 4, waitlistPriorityWindowHours: 2, chatRateLimitPerSecond: 6, reactionQuotaPerDate: 20, reminderLeadMinutes: 30, replayExpiryWarningHours: 6 }
                    labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                    taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/auth/password:
    patch:
      operationId: changePassword
      tags: [account]
      summary: Changes the password from the account.
      description: |
        **The current password is required**, and that is not a formality: without it, a stolen
        session would be enough to lock the owner out of their own account.

        **Other sessions are revoked** — this is the gesture one makes on suspecting a theft, and
        leaving the other bearers untouched would empty it of meaning. The current session survives:
        you do not sign yourself out by changing your password.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 12 }
                revokeOtherSessions: { type: boolean, default: true }
            example: { currentPassword: 'an-old-password', newPassword: 'a-new-password' }
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { changed: { type: boolean }, otherSessionsRevoked: { type: integer } } }
              example:
                servedAt: '2026-09-21T18:57:00.000Z'
                data: { changed: true, otherSessionsRevoked: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/auth/two-factor:
    post:
      operationId: enableTwoFactor
      tags: [account]
      summary: Enables two-factor authentication and returns the backup codes.
      description: |
        **The backup codes are returned here, once only.** They are never read back: the server
        keeps only hashes of them. An operation able to repeat them would be able to read them, and
        it would no longer be a second factor.

        Two-factor authentication is a **precondition** for transferring ownership of a channel on
        the studio side: the contract refuses it without one.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: Re-authentication — this is a sensitive operation. }
            example: { password: 'a-long-password' }
      responses:
        '201':
          description: Secret to enrol and backup codes, returned **once only**.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [otpauthUri, backupCodes]
                        properties:
                          otpauthUri: { type: string }
                          backupCodes: { type: array, items: { type: string } }
              example:
                servedAt: '2026-09-21T18:58:00.000Z'
                data:
                  otpauthUri: 'otpauth://totp/Arthome:marie%40example.org?secret=JBSWY3DP&issuer=Arthome'
                  backupCodes: ['7K2M-9QP4', 'X3N8-2VTR']
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: disableTwoFactor
      tags: [account]
      summary: Disables two-factor authentication.
      description: '**Re-authentication required**: disabling a second factor is exactly what a session thief would try first.'
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
            example: { password: 'a-long-password' }
      responses:
        '200':
          description: Two-factor authentication disabled.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { twoFactorEnabled: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:58:30.000Z'
                data: { twoFactorEnabled: false }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/auth/two-factor/verify:
    post:
      operationId: verifyTwoFactor
      tags: [account]
      summary: Answers the two-factor challenge, and opens the session.
      description: |
        Follows `TWO_FACTOR_REQUIRED`. The `challengeId` is **short-lived and single-use**; a
        consumed backup code cannot be replayed.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, code, mode]
              properties:
                challengeId: { type: string }
                code: { type: string }
                mode: { $ref: '#/components/schemas/SessionMode' }
                deviceId: { type: [string, 'null'], format: uuid }
            example: { challengeId: chl_7ab2, code: '318204', mode: cookie }
      responses:
        '200':
          description: Session opened, in the requested mode.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/SessionEstablished' } }
              example:
                servedAt: '2026-09-21T18:00:25.000Z'
                data:
                  mode: cookie
                  viewerContext:
                    deviceId: 019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77
                    signedIn: true
                    profiles: []
                    constants: { roomOpensMinutesBefore: 30, cancelDeadlineMinutesBefore: 60, scarcityThresholdBps: 8500, billboardPreviewDelaySec: 4, waitlistPriorityWindowHours: 2, chatRateLimitPerSecond: 10, reactionQuotaPerDate: 20, reminderLeadMinutes: 30, replayExpiryWarningHours: 6 }
                    labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/storefront/fr/v41.json' }
                    taxonomyArtifact: { locale: fr, version: 12, url: 'https://cdn.arthome.fr/taxonomy/fr/v12.json' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }

  /v1/me/passkeys:
    post:
      operationId: addPasskey
      tags: [account]
      summary: Enrols a passkey.
      description: |
        Returns the enrolment options produced by the server; the surface passes them to the browser
        or platform API, then returns the attestation to `PUT`. **The secret never leaves the
        hardware.**
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
