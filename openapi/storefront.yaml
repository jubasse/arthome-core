                  properties:
                    data:
                      $ref: '#/components/schemas/SeatQuote'
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:41:10.000Z'
                validUntil: '2026-09-21T18:42:10.000Z'
                data:
                  lines:
                  - kind: tier
                    amount:
                      amountMinor: 4800
                      currencyCode: EUR
                  - kind: service_fee
                    amount:
                      amountMinor: 300
                      currencyCode: EUR
                  - kind: subscription_discount
                    discountReasonCode: plan_pass
                    amount:
                      amountMinor: -480
                      currencyCode: EUR
                  total:
                    amountMinor: 4620
                    currencyCode: EUR
                  validUntil: '2026-09-21T18:42:10.000Z'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/dates/{dateId}/sales-queue/enter:
    post:
      operationId: enterSalesQueue
      summary: Enters a date's sales queue.
      description: |
        **A state assignment, not a toggle**: one entry per account and date, and entering again keeps
        the place already taken. The queue serves in arrival order (D-081). No `Idempotency-Key`: the
        entry makes a second call harmless by itself (see the exemption).

        **An admission that lapses unused sends the account to the end of the queue**, in the spirit
        of the waiting list's one chance per registration (D-083): a turn kept after it passed is
        taken from everyone behind.

        **A queue that is not armed admits nobody**: it answers `armed: false`, and the surface goes
        back to `purchaseSeat`, which needs no admission then. Admitting there would let an account
        collect admissions ahead of the arming and walk past the queue once it arms.

        **The session names the account, never the path**, and the response speaks of the caller's
        entry alone: nobody else's position, account or admission.
      x-arthome-maturity: provisional
      x-arthome-upstream:
      - ticketing
      x-arthome-idempotency-exemption: |
        **Idempotent by construction**: one entry per account and date, so a second call finds the
        first entry and answers its current state. A key would put a durable write per entrant in
        front of the queue built to shed that load, and would replay a position that is stale seconds
        after it was served.
      tags:
      - commerce
      security:
      - sessionCookie: []
        csrfToken: []
      - bearerToken: []
      parameters:
      - $ref: '#/components/parameters/DateId'
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The caller's entry, as `getSalesQueuePosition` serves it.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SalesQueuePosition'
                  required:
                  - data
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:00:02.000Z'
                validUntil: '2026-09-21T18:00:04.000Z'
                data:
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  armed: true
                  state: waiting
                  position: 2841
                  estimatedWaitSec: 95
                  pollIntervalSec: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRefused'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/dates/{dateId}/sales-queue:
    get:
      operationId: getSalesQueuePosition
      summary: Reads one's place in a date's sales queue, and the admission once it comes.
      description: |
        **Polled at the cadence it serves**: `pollIntervalSec` is the pairing's served decay
        (`adr-auth.md` §5.3), not a second one, and the surface never polls faster.

        **`validUntil` is the next poll while `waiting`, and the admission's `expiresAt` once
        `admitted`.** Either countdown is computed against `servedAt`.

        **`no-store`**: a position and an admission are one account's, and perishable.
      x-arthome-maturity: provisional
      x-arthome-upstream:
      - ticketing
      tags:
      - commerce
      parameters:
      - $ref: '#/components/parameters/DateId'
      - $ref: '#/components/parameters/Surface'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The caller's entry.
