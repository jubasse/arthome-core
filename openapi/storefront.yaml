        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tier:
                  type: string
                  enum:
                  - full
                  - reduced
                  - support
                  x-arthome-vocabulary-source: PRICE_TIERS
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
                contributionMinor:
                  anyOf:
                  - type: integer
                  - type: 'null'
                  description: |
                    Free contribution to the company, for a free seat. The amount is **open**; minimum and
                    maximum are **domain rules**, not attributes of an input field, and the refusal carries
                    **`order.contribution_out_of_range`**, with both bounds as parameters.
                applyCreditId:
                  anyOf:
                  - type: string
                    format: uuid
                  - type: 'null'
              required:
              - tier
              - quantity
            example:
              tier: full
              quantity: 2
      responses:
        '200':
          description: Devis.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EnvelopeMeta'
