                    data:
                      type: object
                      properties:
                        changed:
                          type: boolean
                        otherSessionsRevoked:
                          type: integer
                      additionalProperties: {}
                  additionalProperties: {}
              example:
                servedAt: '2026-09-21T18:57:00.000Z'
