          anyOf:
          - type: integer
          - type: 'null'
        isLiveNow:
          type: boolean
        followedByViewer:
          type:
          - boolean
          - 'null'
        alertEnabled:
          description: |
            **Following and being alerted are two settings**, and the contract separates them:
            `followedByViewer` is a catalogue relation, `alertEnabled` a flag carried by `notifications`.
            Conflating them would make it impossible to follow an artist without being notified — and the
            design shows the two separately. **Absent on an anonymous read.**
          type:
          - boolean
          - 'null'
        nextDate:
          description: |
            The next announced date, when there is one. Served so that the "Following" page distinguishes
            artists **who have a date** from those who do not — that is the split the screen displays, and
            it would otherwise be computed by one call per artist.
          $ref: '#/components/schemas/DateCard'
      required:
      - id
      - channelId
      - name
      - categoryId
      additionalProperties: {}
    ArtistDetail:
      allOf:
      - $ref: '#/components/schemas/ArtistSummary'
      - type: object
        properties:
          biography:
            $ref: '#/components/schemas/LocalizedText'
          joinedAt:
            type: string
            format: date-time
          upcomingDates:
            type: array
            items:
              $ref: '#/components/schemas/DateCard'
          pastDates:
            type: array
            items:
              $ref: '#/components/schemas/DateCard'
          replays:
            type: array
            items:
              $ref: '#/components/schemas/DateCard'
          merchItems:
            type: array
            items:
              $ref: '#/components/schemas/MerchItem'
        additionalProperties: {}
    Facet:
      type: object
      properties:
        facetId:
          type: string
          examples:
          - category
        values:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              count:
                type: integer
            required:
            - id
            - count
            additionalProperties: {}
      required:
      - facetId
      - values
      additionalProperties: {}
      description: |
        **Generic**, never an enumeration of facets in the contract: adding "wheelchair accessible"
        must not be a contract change. The counts are computed on the current query and returned **in
        the same response** as the results — no second call.
    StructuredFilter:
      type: object
      properties:
        filterId:
          type: string
          examples:
          - price
        kind:
          type: string
          x-arthome-vocabulary:
          - money_range
          - date_range
          - boolean
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: A screen composition the server decides so that five surfaces do not each decide it differently.
        min:
          anyOf:
          - type: integer
          - type: 'null'
        max:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - filterId
      - kind
      additionalProperties: {}
      description: |
        The filters that are **not** enumerations: price range, date range. They live beside the
        facets, never inside them.
    SearchCriteria:
      type: object
      properties:
        categoryIds:
          type: array
          items:
            type: string
        genreIds:
          type: array
          items:
            type: string
        tagIds:
          type: array
          items:
            type: string
        artistIds:
          type: array
          items:
            type: string
            format: uuid
        cityIds:
          type: array
          items:
            type: string
        countryCodes:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
        languageDependency:
          type: array
          items:
            type: string
            enum:
            - none
            - helpful
            - essential
            x-arthome-vocabulary-source: LANGUAGE_DEPENDENCIES
        replayPolicy:
          type: array
          items:
            type: string
            enum:
            - included
            - subscription
            - unit
            - none
            x-arthome-vocabulary-source: REPLAY_POLICIES
        displayStates:
          description: |
            **A strict narrowing of `DISPLAY_STATES`** to the five a public search can filter on. The
            other six are either non-public (`draft`, `reserve`, `technical`) or outcomes that replace
            the state on the card rather than being searched for (`postponed`, `cancelled`,
            `interrupted`). A filter on a state no public list can contain returns nothing and says
            nothing, which is worse than refusing it.
          type: array
          items:
            type: string
            enum:
            - scheduled
            - room_open
            - live
            - replay
            - ended
            x-arthome-vocabulary-source: DISPLAY_STATES
            x-arthome-vocabulary-narrowing: The five a public search can filter on. The other six are non-public states or outcomes that replace the state on the card, so a filter on them returns nothing and says nothing.
        priceMinMinor:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        priceMaxMinor:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        startsAfter:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        startsBefore:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        almostSoldOut:
          type:
          - boolean
          - 'null'
        onPromotion:
          type:
          - boolean
          - 'null'
        accessibility:
          type: array
          items:
            type: string
      additionalProperties: false
      description: |
        **The criteria grammar, published.** It is the same shape everywhere: parameter of
        `/v1/search`, parameter of `/v1/categories/{id}`, and body of `SavedSearch.criteria`. One
        shape, therefore one signature — and `criteriaSignature` can only produce it because the
        shape is normalised.

        **Every value is a stable identifier**, never an array index: a position survives neither a
        shareable URL, nor a saved search, nor the insertion of a discipline.
    ShowGroup:
      type: object
      properties:
        showId:
          type: string
          format: uuid
        title:
          type: string
        representativeDate:
          $ref: '#/components/schemas/DateCard'
        matchingDatesCount:
          type: integer
          examples:
          - 3
      required:
      - showId
      - title
      - representativeDate
      - matchingDatesCount
      additionalProperties: {}
      description: |
        The paginated unit of search for the `best`, `lives` and `replays` tabs is the **show**, not
        the date. Each group carries the representative date chosen — the first that satisfies the
        filters, under the current sort — **and** the total number of dates in the group that satisfy
        the filters: without that second number, "see 2 more dates" is wrong as soon as a filter is
        active.
    SalesQueuePosition:
      type: object
      properties:
        dateId:
          type: string
          format: uuid
        armed:
          type: boolean
          description: |
            Whether the date's queue is armed. `false`: `purchaseSeat` needs no admission, and the surface
            goes back to it.
        state:
          type: string
          x-arthome-vocabulary:
          - not_queued
          - waiting
          - admitted
          - lapsed
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: 'A state machine local to this resource. It is the contract''s own, not the domain''s: the domain owns the facts, this owns how far a request has got.'
          description: |
            `waiting`: `position` and `estimatedWaitSec` are served. `admitted`: `admission` is served.
            `lapsed`: the admission went unused past its `expiresAt`, and entering again joins the end of
            the queue. `not_queued`: the account has no entry.
        position:
          description: Present while `waiting`. `1` is admitted next.
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        estimatedWaitSec:
          description: |
            Present while `waiting`. **Served, from the rate the queue admits at**, so that no surface
            estimates it from `position` with a rate of its own.
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        pollIntervalSec:
          type: integer
          examples:
          - 2
          description: |
            The pairing's served decay (`DevicePairing.pollIntervalSec`), not a second cadence. The
            surface never polls faster than it is served.
        admission:
          description: |
            Present once `admitted`. The surface sends `token` as `X-Arthome-Admission-Token` on
            `purchaseSeat`, or on a `seat` `createPairing` (D-086), before `expiresAt`, counted against
            `servedAt`.
          anyOf:
          - type: object
            properties:
              token:
                type: string
                minLength: 1
              expiresAt:
                type: string
                format: date-time
            required:
            - token
            - expiresAt
            additionalProperties: {}
          - type: 'null'
      required:
      - dateId
      - armed
      - state
      - pollIntervalSec
      additionalProperties: {}
      description: |
        **One account's place in a date's sales queue**, and nothing about anyone else's. The queue
        serves in arrival order and protects latency; the capacity is held by `ticketing` whatever it
        says (`adr-ticketing.md` §4).
    TicketCard:
      type: object
      properties:
        seatId:
          type: string
          format: uuid
        dateId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        seatCode:
          type: string
          examples:
          - ATH-7QK2-4M
          description: |
            **Issued by the server**, always. It displays identically on web, mobile and television; the
            design computes it by hashing, which would give **three different codes for the same seat** as
            soon as one surface changed its hash function.
        tier:
          type: string
          x-arthome-vocabulary:
          - full
          - reduced
          - support
          x-arthome-vocabulary-source: PRICE_TIERS
        state:
          type: string
          x-arthome-vocabulary:
          - active
          - cancelled
          - refunded
          - transferred
          - credited
          x-arthome-vocabulary-source: SEAT_STATES
        cancelDeadline:
          description: |
            Served as an **instant**. "Up to 1 h before the start" is a domain rule, not a screen
            caption.
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        date:
          $ref: '#/components/schemas/DateCard'
        refund:
          description: |
            What the viewer gets back, and **where**. The amount and a **delay code** — never the
            sentence "3 to 5 business days", which is a policy.
          anyOf:
          - type: object
            properties:
              amount:
                x-arthome-tax-basis: inherited
                $ref: '#/components/schemas/Money'
              delayCode:
                type: string
                examples:
                - refund_delay_business_days_3_5
              method:
                type: string
                x-arthome-vocabulary:
                - original_payment_method
                - account_credit
                x-arthome-vocabulary-source: none
                x-arthome-vocabulary-reason: Mirrors the payment provider's state machine. Theirs to change, ours to reflect — inventing a member here would describe a state their API never sends.
              refundReasonCode:
                description: 'Why the seat was refunded: `date_cancelled` when its date was cancelled.'
                x-arthome-vocabulary:
                - viewer_request
                - date_cancelled
                - account_deletion
                - goodwill
                - duplicate
                - dispute
                - hold_expired_capacity_lost
                x-arthome-vocabulary-source: REFUND_REASONS
                type:
                - string
                - 'null'
            additionalProperties: {}
          - type: 'null'
      required:
      - seatId
      - dateId
      - seatCode
      - tier
      - state
      - date
      additionalProperties: {}
    MerchItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channelId:
          type: string
          format: uuid
        showId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        label:
          $ref: '#/components/schemas/LocalizedText'
        variants:
          description: |
            **A T-shirt without a size is not sellable.** The contract carries the variants; a cart line
            references a variant, never a bare item.
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
                examples:
                - M
              inStock:
                type: boolean
              price:
                x-arthome-tax-basis: inclusive
                $ref: '#/components/schemas/Money'
            required:
            - id
            - label
            - inStock
            additionalProperties: {}
        price:
          x-arthome-tax-basis: inclusive
          $ref: '#/components/schemas/Money'
        state:
          type: string
          x-arthome-vocabulary:
          - on_sale
          - out_of_stock
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: 'A state machine local to this resource. It is the contract''s own, not the domain''s: the domain owns the facts, this owns how far a request has got.'
        source:
          type: string
          x-arthome-vocabulary:
          - arthome
          - shopify
          - woocommerce
          - prestashop
          - drupal
          - api
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: An external provider or platform identifier. It is their vocabulary, not ours, and it changes when they change.
          description: |
            The item's origin. An external source is not sold by us: it links out to `merchantUrl`, and
            no cart accepts it.
        merchantUrl:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        pinnedDuringLive:
          type: boolean
        media:
          $ref: '#/components/schemas/MediaSet'
      required:
      - id
      - channelId
      - label
      - state
      - source
      additionalProperties: {}
    CartLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        variantId:
          type: string
        channelId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          x-arthome-tax-basis: inclusive
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          description: |
            **The ordering comes from the server.** Conflict between two devices: per line, last writer
            wins, arbitrated by this version number — never by a date from the phone, whose clock drifts
            and jumps.
      required:
      - id
      - itemId
      - variantId
      - channelId
      - quantity
      - unitPrice
      - version
      additionalProperties: {}
    Cart:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        vendorGroups:
          type: array
          items:
            type: object
            properties:
              channelId:
                type: string
                format: uuid
              lineIds:
                type: array
                items:
                  type: string
                  format: uuid
            additionalProperties: {}
          description: |
            **A merchandise order is single-vendor.** A cart holding items from two channels **splits
            into two orders at payment**, each with its own shipping, commission and payout. Two
            independent justifications: two shipments, and a Stripe `destination charge` admits **only one
            destination**.
      required:
      - lines
      - vendorGroups
      additionalProperties: {}
      description: |
        **The cart lives on the account, not in the browser**: the design shows a persistent cart in
        the header, it is built up across several sessions from a live show's shop, and all three
        storefronts display it. A local cart would survive neither a reinstall nor a change of
        device.
    CartQuote:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              channelId:
                type: string
                format: uuid
              subtotal:
                x-arthome-tax-basis: inclusive
                $ref: '#/components/schemas/Money'
              shipping:
                x-arthome-tax-basis: inclusive
                $ref: '#/components/schemas/Money'
              discount:
                description: |
                  **Shop** discount (15%) or promotion — **never both**: the one most favourable to the viewer
                  wins, and the rule lives in `@arthome/core`. Not to be confused with `seatDiscount`
                  (10 / 20%), which applies to **seats**: two discounts, two bases, and they coincide in no
                  source (E1).
                anyOf:
                - type: object
                  properties:
                    discountReasonCode:
                      type: string
                    amount:
                      x-arthome-tax-basis: inherited
                      $ref: '#/components/schemas/Money'
                  additionalProperties: {}
                - type: 'null'
              total:
                x-arthome-tax-basis: inclusive
                $ref: '#/components/schemas/Money'
            required:
            - channelId
            - subtotal
            - total
            additionalProperties: {}
        validUntil:
          type: string
          format: date-time
          description: 15 minutes.
      required:
      - groups
      - validUntil
      additionalProperties: {}
      description: |
        **The quote is binding**: the total presented is the one that will be charged. Shipping is
        computed **at quoting time**, not on adding. Past `validUntil`, a new quote.
    SeatQuote:
      type: object
      properties:
        vatIncluded:
          description: |
            **Already inside `total`, never added to it.** One line per jurisdiction, computed at the
            instant of sale from `BuyerTaxLocation` — which is why it appears here and **never on the
            catalogue**: a price carrying its VAT would be a price that varies by viewer, and the
            catalogue would stop being publicly cacheable. That cacheability is the reason tax-inclusive
            pricing was chosen.
          type: array
          items:
            type: object
            properties:
              rateBps:
                type: integer
                examples:
                - 550
              amount:
                x-arthome-tax-basis: inherited
                $ref: '#/components/schemas/Money'
              jurisdictionCode:
                type: string
                examples:
                - FR
            required:
            - rateBps
            - amount
            - jurisdictionCode
            additionalProperties: {}
        lines:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                x-arthome-vocabulary:
                - tier
                - service_fee
                - subscription_discount
                - promotion
                - credit_applied
                x-arthome-vocabulary-source: none
                x-arthome-vocabulary-reason: A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change.
              discountReasonCode:
                type:
                - string
                - 'null'
              amount:
                x-arthome-tax-basis: inherited
                $ref: '#/components/schemas/Money'
            required:
            - kind
            - amount
            additionalProperties: {}
        total:
          x-arthome-tax-basis: inclusive
          $ref: '#/components/schemas/Money'
        validUntil:
          type: string
          format: date-time
        lateEntry:
          description: |
            **Present once the live has started** (D-089): what the buyer has already missed, to be
            said loudly before they buy. A seat is sold until `salesEndAt`, thirty minutes after the
            start; `purchaseSeat` refuses a late entry the buyer did not acknowledge.
          anyOf:
          - type: object
            properties:
              startedAt:
                type: string
                format: date-time
              minutesElapsed:
                type: integer
                description: Whole minutes of the live already missed.
              salesEndAt:
                type: string
                format: date-time
            required:
            - startedAt
            - minutesElapsed
            - salesEndAt
            additionalProperties: {}
          - type: 'null'
      required:
      - lines
      - total
      additionalProperties: {}
      description: |
        The purchase summary for a seat, **composed server-side**. The four lines come from the
        contract: `tier + service fee − subscription discount − promotion = total`. This is exactly
        the "a total composed in two places" case the brief cites as a typical defect, and it is
        closed here.

        **Prices are tax-inclusive (D-056), so the VAT does not move the total — and it is served
        anyway**, in `vatIncluded`. EU invoicing requires the line, and the artist needs it. **A total
        that does not change is exactly why someone will be tempted to omit it.**

        **It is a separate field rather than a fifth line, and that is the point.** `lines` are
        addends; a VAT line inside them would be summed by somebody, on some surface, eventually —
        and the total would be wrong by a VAT rate in the direction nobody checks, because it would
        look larger rather than smaller. What is already inside a total cannot sit in the list of
        things added to it.
    TaxEvidence:
      type: object
      properties:
        kind:
          type: string
          x-arthome-vocabulary:
          - billing_address
          - ip_address
          - bank_country
          - card_country
          - sim_country
          - declared_by_buyer
          x-arthome-vocabulary-source: TAX_EVIDENCE_KINDS
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: What **this item** indicates — not the outcome of the arbitration.
        subdivision:
          description: ISO 3166-2, when the item carries it.
          anyOf:
          - type: string
            maxLength: 8
          - type: 'null'
        source:
          type: string
          minLength: 1
          maxLength: 64
          examples:
          - edge.geoip
        collectedAt:
          type: string
          format: date-time
      required:
      - kind
      - country
      - source
      - collectedAt
      additionalProperties: {}
      description: |-
        **One item of location evidence, with its provenance.** A B2C sale inside the Union
        requires **two non-contradictory items** — and a tax provider generally prefers a single
        address over comparing them, so the evidence rule cannot be delegated to it: our own
        register carries it.

        `source` is not decorative: **evidence without provenance is not evidence**.
    BuyerTaxLocation:
      type: object
      properties:
        country:
          type: string
          pattern: ^[A-Z]{2}$
        subdivision:
          anyOf:
          - type: string
            maxLength: 8
          - type: 'null'
        postalCode:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
        city:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/TaxEvidence'
        evidenceConflicting:
          type: boolean
          description: |-
            True when two items contradict each other. **The sale goes through anyway** and the line is
            flagged for review: refusing the purchase would punish the viewer for an ambiguity that is
            not theirs, and hiding the conflict would produce a false and silent declaration.
        resolvedAt:
          type: string
          format: date-time
      required:
      - country
      - evidence
      - evidenceConflicting
      additionalProperties: {}
      description: |-
        **The buyer's tax location, carried by the order.** Neither a market identifier nor a plain
        country: in the United States the rate changes from one street to the next, so the postal
        code is indispensable; in the Union the evidence is **double** and must be retained.

        **Not to be confused with the identity verification of the signed-in account**, which bears
        on the **artist** and has nothing to do with the **viewer's** location. The two are often
        conflated.
    PaymentHandoff:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        state:
          type: string
          x-arthome-vocabulary:
          - pending
          - awaiting_action
          - processing
          x-arthome-vocabulary-source: ORDER_STATES
          x-arthome-vocabulary-narrowing: 'The three in which an order still waits for its payment. A paid, failed or refunded order has no handoff: getOrder serves the order itself.'
        paymentIntentRef:
          type: string
          description: '**Opaque** reference to the domain. Only the adapter knows how to read it.'
        clientSecret:
          type: string
        nextAction:
          description: |
            What the surface must do next, **declared** rather than guessed: a strong-authentication
            redirect, or nothing.
          anyOf:
          - type: object
            properties:
              kind:
                type: string
                x-arthome-vocabulary:
                - redirect_to_url
                - use_stripe_sdk
                - none
                x-arthome-vocabulary-source: none
                x-arthome-vocabulary-reason: Mirrors the payment provider's state machine. Theirs to change, ours to reflect — inventing a member here would describe a state their API never sends.
              redirectUrl:
                anyOf:
                - type: string
                  format: uri
                - type: 'null'
            additionalProperties: {}
          - type: 'null'
        returnUrl:
          type: string
          format: uri
          description: |
            **Where the provider returns after authentication.** Allowlist of **literal strings**, never
            a pattern.

            **And the return confirms nothing**: *a payment confirmed by a URL parameter is a payment
            confirmed by the client*. The return says **where to go**; it is `getOrder` — fed by the
            verified webhook — that says **what changed**.
        expiresAt:
          type: string
          format: date-time
          description: |
            When the purchase intent expires. For a seat it is **the hold's instant**, one value carried
            by both, never a second duration (`data-model.md` §3.2).
      required:
      - orderId
      - state
      - paymentIntentRef
      - clientSecret
      - returnUrl
      additionalProperties: {}
      description: |
        **The step the contract did not have, and without which no payment subject to European strong
        authentication completes.** The state vocabulary carried `awaiting_action` ← "3-D Secure in
        progress", and **no operation could either reach that state or leave it**: the three money
        commands only answered `201 · paid`, with no `clientSecret`, no `nextAction`, no return
        address.

        This was not a refinement: a significant share of card payments in Europe requires strong
        authentication. A flow that does not provide for `requires_action` **fails in production on
        perfectly valid payments**, and it fails silently — the order stays `awaiting_action` and
        nothing picks it up.

        **The `clientSecret` is produced server-side** and serves only the surface's payment element;
        it authorises nothing else and replaces no session.
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          examples:
          - ATH-2026-00042
