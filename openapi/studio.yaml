      summary: Transfers ownership of the channel — two-stage.
      description: |
        **The recipient must already be a member and have two-factor authentication.** These are
        domain rules, not interface guards, and the refusal is **served with its reason**. The bank
        account (`payouts`) and the public page (`catalog`) **follow** the transfer, by event.
