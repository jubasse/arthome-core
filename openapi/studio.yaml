        state: { type: string, x-arthome-vocabulary: [on_sale, out_of_stock], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A state machine local to this resource. It is the contract's own, not the domain's: the domain owns the facts, this owns how far a request has got." }
        source:
