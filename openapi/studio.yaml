openapi: 3.1.1

info:
  title: Arthome Studio BFF
  version: 1.0.0
  summary: Le contrat des deux surfaces professionnelles — studio web et studio mobile.
  description: |
    Contrat du **BFF studio**. Il sert `studio-web` (Angular) et `studio-mobile` (Angular + Ionic
    + Capacitor). C'est un **BFF distinct** de celui du storefront, et ce n'est pas une commodité :
    les deux produits n'ont ni la même session (cookie contre jeton porteur), ni la même
    pagination (page + total contre curseur), ni la même enveloppe de projection (par rôle contre
    par spectateur), ni le même cycle de déploiement.

    ## La règle qui commande tout ce document : la projection par rôle est serveur

    `canRevenue` **ne masque pas une colonne : il décide de ce que la réponse contient.** Une
    régie qui recevrait le brut de billetterie dans sa charge utile et ne l'afficherait pas est
    une **fuite**, pas une règle — la charge utile est en clair dans un WebView, inspectable, et
    elle survit dans le cache HTTP du téléphone.

    Trois conséquences, portées partout dans ce document :

    - **un champ interdit est absent, jamais présent et nul.** Oui, cela implique des formes
      différentes pour le même écran selon le rôle, et c'est **voulu** ;
    - **une clé de tri sur un champ absent est refusée** (`SORT_KEY_FORBIDDEN`), jamais ignorée —
      un tri accepté en silence sur la recette trahit l'ordre des valeurs qu'on n'a pas le droit
      de montrer ;
    - **une notification ne porte jamais un montant si le rôle destinataire n'a pas
      `canRevenue`** : elle s'affiche sur un écran verrouillé.

    ## Huit rôles, jamais six

    L'autorisation porte sur les **huit** valeurs canoniques — `artist`, `production`,
    `coordination`, `director`, `video`, `sound`, `moderation`, `treasury`. Le repli à six
    personas est **un libellé de présentation** et n'apparaît dans aucune réponse : il confond
    `director`, `video` et `sound` sous « regie » et **efface le droit d'invitation de
    `director`**. Une personne tient un **ensemble** de rôles sur une chaîne, et sa navigation est
    l'**union** de leurs accès, jamais un rang.

    Deux échelles d'accès, jamais confondues : l'**appartenance à la chaîne**, permanente, et
    l'**accès ponctuel à une date**, qui expire à un instant servi. Les confondre ferait d'une
    révocation de renfort une exclusion de chaîne.

    ## Les droits bougent pendant la session

    Chaque réponse porte `X-Arthome-Rights-Version`. Quand elle change, la navigation est périmée :
    une invitation acceptée ajoute une chaîne au sélecteur, un accès ponctuel expire seul au
    tomber du rideau, un rôle est retiré. Sans ce compteur, la personne garde un onglet qui ouvre
    un 403 et le découvre **en pleine garde**. La fraîcheur maximale de l'autorisation est de
    **60 secondes**, durée du jeton interne frappé par le BFF.

    ## Trois régimes de commande, nommés

    - **conditionnelles** — la majorité des gestes de garde. Elles portent `expectedVersion`, et
      le serveur **refuse** si elle a changé. Le cas canonique est le verdict de modération : le
      second verdict est **refusé avec le verdict qui a gagné et le nom de qui l'a rendu**. Un
      rejeu idempotent aveugle produirait exactement le contraire ;
    - **baux** — « prendre en charge » n'est pas trancher. Un bail **expire de lui-même** : un
      modérateur dont le téléphone s'éteint ne gèle pas une ligne pendant tout le direct. Une
      prise en charge ne se met **jamais** en file hors ligne ;
    - **double détente** — changement de compte bancaire, transfert de propriété, invitation. Ils
      créent un **état d'attente** que le contrat porte, et le changement bancaire **suspend le
      virement en cours**.

    ## Pagination (D-010)

    **Page + total** partout — la maquette affiche « 1–8 SUR N » et énumère les numéros de page,
    donc elle a besoin du total et du nombre de pages. **Deux exceptions nommées, et pas une de
    plus** : la **file de modération** et le **tchat en direct** passent au **curseur**, parce que
    ce sont des flux et qu'une pagination par décalage y duplique et y saute **mécaniquement**,
    pas exceptionnellement.

    **Le journal reste en page + total, avec filtre de période obligatoire.** Personne ne pagine
    jusqu'au 50 000ᵉ élément d'un journal : on filtre par période d'abord. Le curseur y
    échangerait un problème qu'on n'a pas contre la perte des numéros de page, qui sont
    précisément l'affordance voulue.

    ## Erreurs

    Même enveloppe que le storefront : `code`, `nature`, `params`, `traceId`. `nature` est ce que
    la garde exige : `refused` (ne pas réessayer, comprendre), `unavailable` (réessayer),
    `offline_forbidden` (refus **local**, avant tout envoi — **jamais émis par le serveur**).
    C'est la décision qu'une personne d'astreinte doit prendre en dix secondes.

    ## Maturité

    `identity`, `catalog` et `ticketing` sont **stables** ; `streaming`, `chat`, `payouts` et
    `notifications` sont **provisoires**. Chaque opération porte `x-arthome-maturity`.
  contact:
    name: Arthome — architecture
  license:
    name: UNLICENSED

servers:
  - url: https://studio-api.arthome.fr
    description: production
  - url: https://studio-api.staging.arthome.fr
    description: recette
  - url: http://localhost:3002
    description: développement local (docker compose)

tags:
  - name: bootstrap
    description: Amorçage, droits effectifs, boîte, compteurs.
  - name: agenda
    description: Agenda de chaîne, gardes, tableau des événements.
  - name: publication
    description: Cycle de vie d'une date, machine à états, porte de publication.
  - name: ticketing
    description: Jauge, tarifs, contremarques, remboursements.
  - name: run
    description: Conduite du direct, santé, chapitres, incidents, clé de flux.
  - name: moderation
    description: File, verdicts, sanctions, dictionnaire.
  - name: crew
    description: Équipe, rôles, invitations, accès ponctuels.
  - name: payouts
    description: Versements, banque, réconciliation, exports comptables.
  - name: channel
    description: Identité publique, boutique, rediffusions, réglages, journal.

security:
  - sessionCookie: []
  - bearerToken: []

paths:

  # =============================================================== amorçage

  /v1/bootstrap:
    get:
      operationId: getStudioBootstrap
      tags: [bootstrap]
      summary: L'amorçage — la seule chose que le premier rendu attend.
      description: |
        **Un appel**, et rien n'est peint tant qu'il n'est pas là : la personne, **toutes** ses
        chaînes avec leurs rôles effectifs, `grants` **projetés sur ses rôles**, les préférences,
        la version des droits, les compteurs de pastilles et les constantes de domaine.

        **La racine est une personne, pas une chaîne.** Un régisseur indépendant peut être de
        garde sur deux directs le même soir, chez deux chaînes différentes.

        L'échec de cet appel est un **écran d'échec à part entière, avec l'identifiant de trace** :
        c'est le seul moment où la personne peut encore lire un numéro et le dicter au support.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: L'amorçage.
          headers:
            X-Arthome-Served-At: { $ref: '#/components/headers/ServedAt' }
            X-Arthome-Rights-Version: { $ref: '#/components/headers/RightsVersion' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/StudioBootstrap' } }
              example:
                servedAt: '2026-09-21T18:00:00.000Z'
                rightsVersion: 412
                data:
                  person: { personId: 019928b0-0000-7000-8000-000000000001, displayName: 'Claire D.', isFreelance: true, runsCalled: 84, readingTimezone: Europe/Paris }
                  rightsVersion: 412
                  channels:
                    - channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                      channelName: Compagnie Verticale
                      roles: [production, coordination]
                      isOwner: false
                      navigation: [dashboard, crew, events, stream, stats, tickets, store, replays, journal, help]
                      datePanes: [public, tickets, chat, tech, crew, replay]
                      canRevenue: true
                      canOps: true
                      canTech: true
                      canDecideOutcome: true
                      assignableRoles: [coordination, director, video, sound, moderation]
                      dateGrants: []
                  constants:
                    technicalProvisionThreshold: 10000
                    provisionRevisionHours: 72
                    waitlistPriorityWindowHours: 2
                    cancelDeadlineMinutesBefore: 60
                    payoutDelayDays: 14
                    commissionRateBps: 1200
                    chatBurstThresholdPerMinute: 60
                    holdScreenAutoAfterSec: 15
                    seasonBounds: { startsOn: '09-01', endsOn: '08-31' }
                  labelCatalog: { locale: fr, version: 41, url: 'https://cdn.arthome.fr/i18n/studio/fr/v41.json' }
                  counters: { moderationPending: 14, inboxUnread: 2, dutiesTonight: 3, invitationsPending: 1, datesToCover: 3, payoutsDue: 0 }
                  realtime: { namespace: /studio, pulseIntervalSec: 5 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /v1/inbox:
    get:
      operationId: listInbox
      tags: [bootstrap]
      summary: La boîte — invitations et alertes routées par rôle et par chaîne.
      description: |
        **Ouverte à tout le monde**, quel que soit le rôle. Le routage est décidé **côté
        serveur** : l'application ne filtre pas une file commune, sinon elle recevrait des alertes
        qu'elle n'a pas le droit de lire et se contenterait de ne pas les afficher — ce qui est
        une fuite, pas une règle.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page d'entrées de boîte.
          headers:
            X-Arthome-Rights-Version: { $ref: '#/components/headers/RightsVersion' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/InboxEntry' } }
                      page: { $ref: '#/components/schemas/OffsetPageInfo' }
              example:
                servedAt: '2026-09-21T18:00:10.000Z'
                rightsVersion: 412
                items:
                  - id: 019928b1-0000-7000-8000-000000000001
                    kind: invitation
                    channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                    body: { contentLanguage: fr, text: 'Compagnie Verticale vous invite comme coordination.' }
                    deepLinkCode: crew_invitation
                    createdAt: '2026-09-20T14:02:00Z'
                    read: false
                page: { page: 1, pageSize: 20, totalItems: 2, totalPages: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: markInboxRead
      tags: [bootstrap]
      summary: Marque des entrées de boîte comme lues.
      description: '**Monotone : on ne dé-lit pas.** Rejouée, elle ne change rien.'
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entryIds: { type: array, items: { type: string, format: uuid } }
                all: { type: boolean, default: false }
            example: { all: true }
      responses:
        '200':
          description: Compteurs à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/StudioCounters' } }
              example:
                servedAt: '2026-09-21T18:00:20.000Z'
                rightsVersion: 412
                data: { moderationPending: 14, inboxUnread: 0, dutiesTonight: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/duties:
    get:
      operationId: listDuties
      tags: [agenda]
      summary: Mes gardes — toutes chaînes confondues, avec les chevauchements.
      description: |
        `person_duties` est tenu par `identity` et porte **toutes** les chaînes accessibles. Le
        chevauchement est **servi** (`overlapsWith`), calculé une fois dans `@arthome/core` : une
        surface qui le recalculerait produirait une seconde implémentation de la règle.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, catalog, streaming]
      parameters:
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Les gardes de la période.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/Duty' } }
              example:
                servedAt: '2026-09-21T18:00:30.000Z'
                rightsVersion: 412
                items:
                  - dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                    channelName: Compagnie Verticale
                    title: Nuit blanche
                    crewRole: director
                    startsAt: '2026-09-21T19:00:00Z'
                    runState: idle
                    overlapsWith: []
                    accessExpiresAt: '2026-09-21T21:45:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # =============================================================== agenda et événements

  /v1/channels/{channelId}/events:
    get:
      operationId: listChannelEvents
      tags: [agenda]
      summary: Le tableau des événements — page + total, six clés de tri, filtre multi-états.
      description: |
        **Page + total** : la maquette affiche « 1–8 SUR N » et énumère les numéros de page. On
        épingle une page et on l'envoie à un collègue — c'est une affordance d'interface, et c'est
        la raison de la décision.

        **Le tri par état suit l'ordre canonique de la machine à états**, pas l'alphabet :
        `orderRank` voyage avec l'état pour cela.

        **Le tri par recette est refusé** (`SORT_KEY_FORBIDDEN`) aux rôles sans `canRevenue`, et le
        champ est **absent** de leurs lignes. Un tri accepté en silence trahirait l'ordre des
        valeurs qu'on n'a pas le droit de montrer.

        La scission temporelle (à venir / passé) et le filtre multi-états sont des **paramètres du
        contrat**, jamais un filtrage après rapatriement : « passé » porte sur tout l'historique
        de la chaîne.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog, ticketing]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: window
          in: query
          schema: { type: string, enum: [upcoming, past], default: upcoming }
        - name: states
          in: query
          description: Filtre **multi-états**, séparé par des virgules.
          schema: { type: string, examples: ['scheduled,technical'] }
        - name: q
          in: query
          description: Recherche libre sur le titre et les métadonnées, **côté serveur**.
          schema: { type: string }
      responses:
        '200':
          description: Page du tableau des événements, **projetée selon le rôle**.
          headers:
            X-Arthome-Rights-Version: { $ref: '#/components/headers/RightsVersion' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/EventsRow' } }
                      page: { $ref: '#/components/schemas/OffsetPageInfo' }
              example:
                servedAt: '2026-09-21T18:01:00.000Z'
                rightsVersion: 412
                items:
                  - dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    title: Nuit blanche
                    startsAt: '2026-09-21T19:00:00Z'
                    state: scheduled
                    orderRank: 3
                    lowestPrice: { amountMinor: 2400, currencyCode: EUR }
                    fillRateBps: 8700
                    seatsSold: 174
                    grossRevenue: { amountMinor: 417600, currencyCode: EUR }
                page: { page: 1, pageSize: 20, totalItems: 84, totalPages: 5 }
        '403':
          description: '`SORT_KEY_FORBIDDEN` quand la clé de tri porte sur un champ absent de cette projection.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: SORT_KEY_FORBIDDEN, nature: refused, params: { sortBy: grossRevenue }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:01:00.000Z'
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/channels/{channelId}/agenda:
    get:
      operationId: getChannelAgenda
      tags: [agenda]
      summary: L'agenda d'une chaîne, sur une période.
      description: |
        Composé par `catalog` et alimenté par `ticketing` pour la jauge et la recette. La recette
        est **absente** sans `canRevenue` — et c'est la raison pour laquelle l'agenda servi à une
        régie n'a pas de champ `grossRevenue`, tandis que celui servi à la trésorerie n'a pas de
        clé de flux.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog, ticketing]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Les dates de la période.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/EventsRow' } }
              example:
                servedAt: '2026-09-21T18:01:20.000Z'
                rightsVersion: 412
                items: []
        '404': { $ref: '#/components/responses/NotFound' }

  # =============================================================== publication

  /v1/channels/{channelId}/dates:
    post:
      operationId: createDateDraft
      tags: [publication]
      summary: Crée un brouillon de date — l'identifiant vient du domaine.
      description: |
        **L'identifiant est généré par le domaine (UUIDv7), pas par un défaut de base.** Le
        premier motif est ici : l'assistant de création annonce « brouillon enregistré » **avant
        tout aller-retour serveur**, et un identifiant du domaine permet de créer, enregistrer
        localement et synchroniser **sans clé de corrélation**. Les deux autres motifs : l'outbox
        exige que l'agrégat connaisse son identifiant avant l'insertion, et l'ordre temporel
        remplit bien les index.

        **La politique de rediffusion se choisit à la création**, parce que le tarif public en
        dépend. `none` est **définitif** pour cette date : on ne peut pas activer ensuite une
        rediffusion qu'on a promis de ne pas faire.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dateId, showId, venueId, startsAt, replayPolicy]
              properties:
                dateId:
                  type: string
                  format: uuid
                  description: '**Généré par le client** depuis `@arthome/core` (UUIDv7).'
                showId: { type: string, format: uuid }
                venueId: { type: string, format: uuid }
                startsAt: { type: string, format: date-time }
                replayPolicy: { type: string, enum: [included, subscription, unit, none] }
                replayWindowHours: { type: [integer, 'null'] }
            example:
              dateId: 019928c0-0000-7000-8000-000000000001
              showId: 019928a0-7d31-7a10-b8c4-2f9e11a4c111
              venueId: 019928a0-7d31-7a10-b8c4-2f9e11a4c444
              startsAt: '2026-11-04T19:30:00Z'
              replayPolicy: included
              replayWindowHours: 72
      responses:
        '201':
          description: Brouillon créé, avec sa publication et sa liste de contrôle.
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/DateSheet' } }
              example:
                servedAt: '2026-09-21T18:02:00.000Z'
                rightsVersion: 412
                data:
                  dateId: 019928c0-0000-7000-8000-000000000001
                  channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                  title: Nuit blanche
                  startsAt: '2026-11-04T19:30:00Z'
                  venueClock: { venueTimezone: Europe/Paris, venueUtcOffsetMin: 60 }
                  runtimeMin: 95
                  openPanes: [public, tickets, chat, tech, crew, replay]
                  publication:
                    dateId: 019928c0-0000-7000-8000-000000000001
                    state: draft
                    orderRank: 1
                    version: 1
                    checklist:
                      - { id: title_and_discipline, satisfied: true, source: catalog, blocking: true }
                      - { id: poster, satisfied: false, source: catalog, blocking: true }
                      - { id: at_least_one_active_price, satisfied: false, source: ticketing, blocking: true }
                      - { id: technical_check_passed, satisfied: false, source: streaming, blocking: true }
                      - { id: chapters_planned, satisfied: false, source: catalog, blocking: false }
                    offeredTransitions:
                      - { from: draft, to: reserve, irreversible: false }
                      - { from: draft, to: scheduled, irreversible: true, promiseCode: prices_engaged }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/dates/{dateId}/sheet:
    get:
      operationId: getDateSheet
      tags: [publication]
      summary: La fiche d'une date, et la liste des volets ouverts à cette personne.
      description: |
        **Un appel pour la fiche, puis un appel par volet ouvert, chez son propriétaire.** Un
        modérateur doit pouvoir charger le volet `chat` **sans** charger la fiche entière, sinon la
        billetterie transite pour rien.

        `openPanes` est **servi**, pas déduit : la découpe même de l'écran dépend des droits
        effectifs, et la vue d'ensemble n'apparaît qu'au-delà de trois volets ouverts.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
