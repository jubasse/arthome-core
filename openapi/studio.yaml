  /v1/dates/{dateId}/replay-window:
    post:
      operationId: reopenReplayWindow
      tags: [channel]
      summary: Reopens the replay window.
      description: |
        Possible **only** if the policy was not `none`: the promise made before the purchase does not
        reopen. The new expiry is **derived** from the end of the live show and the served window,
        never set by hand — otherwise the replay policy would end up encoded in a storage lifecycle,
        out of reach of the tests.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [additionalHours]
              properties:
                additionalHours: { type: integer, minimum: 1, maximum: 720 }
            example: { additionalHours: 48 }
      responses:
        "200":
          description: Window reopened, with the new **derived** expiry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expiresAt: { type: string, format: date-time }
                          windowHours: { type: integer }
              example:
                servedAt: "2026-09-22T10:00:00.000Z"
                rightsVersion: 412
                data: { expiresAt: "2026-09-26T21:30:00Z", windowHours: 120 }
        "409":
          description: "`REPLAY_POLICY_FINAL` when the policy was `none`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: date.replay_policy_final,
                    nature: refused,
                    params: { currentPolicy: none },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-22T10:00:00.000Z"

  /v1/channels/{channelId}/identity:
    patch:
      operationId: updateChannelIdentity
      tags: [channel]
      summary: Edits the channel's public face.
      description: |
        **A pure `catalog` write.** A channel has two faces, and the contract separates them: the
        channel **as an organisation** — members, roles, invitations, stream key — is authorisation,
        hence `identity`; the channel **as a public page** — name, biography, avatar, discipline — is
        catalogue, hence `catalog.Artist`, in a 1:1 relation by `channelId`.

        **No studio command crosses the two**, and that is the proof the cut is right: the Settings
        screen shows two blocks that never mix.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                publicName: { type: string, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9-]{3,80}$" }
                biography:
                  type: array
                  items:
                    type: object
                    required: [contentLanguage, text]
                    properties:
                      contentLanguage: { type: string }
                      text: { type: string, maxLength: 4000 }
                categoryId: { type: string }
                avatarAssetId: { type: [string, "null"], format: uuid }
            example:
              {
                expectedVersion: 5,
                publicName: Compagnie Verticale,
                categoryId: dance-contemporary,
              }
      responses:
        "200":
          description: Public identity up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      version: { type: integer }
                      data: { type: object, additionalProperties: true }
              example:
                servedAt: "2026-09-21T18:50:00.000Z"
                rightsVersion: 412
                version: 6
                data:
                  {
                    publicName: Compagnie Verticale,
                    slug: compagnie-verticale,
                    categoryId: dance-contemporary,
                  }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/preferences:
    patch:
      operationId: updateStudioPreferences
      tags: [bootstrap]
      summary: Writes one of the person's preferences — reading timezone, control-room layout.
      description: |
        **Two settings follow the person, not the channel**: the reading timezone and the
        control-room layout. The timezone is **the same field** as the storefront's — same account,
        one carrier only.

        **Never in `localStorage`**: it is bound to the origin, can be cleared by the OS, and travels
        in no way at all — yet the person moves from studio web to studio mobile within the same
        evening.

        **Additive and tolerant**: a key unknown to one version is neither rejected nor erased on the
        next write, otherwise the mobile version under store review would overwrite settings made from
        the web.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                readingTimezone: { type: string }
                runDeskLayout: { type: string }
                encodingProfileName: { type: string }
            example: { readingTimezone: Europe/Paris, runDeskLayout: compact }
      responses:
        "200":
          description: Preferences up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
              example:
                servedAt: "2026-09-21T18:51:00.000Z"
                rightsVersion: 412
                data: { readingTimezone: Europe/Paris, runDeskLayout: compact }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: arthome_studio_session
      description: |
        Opaque session, `HttpOnly`/`Secure`/`SameSite=Lax` cookie. This is `studio-web`'s form.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        **`studio-mobile` cannot hold its session in a cookie**: `capacitor://localhost` is a
        third-party context on iOS. The studio BFF therefore offers a **bearer-token** session
        alongside the cookie session — a refresh token bound to the device, kept in the native store
        (`@capacitor/preferences`, **never `localStorage`**), a short access token, revocation per
        device.

        On returning from the background with an expired token: **silent refresh**. A
        re-authentication while on duty is an operational fault. It is required only for
        **sensitive operations** — revealing or rotating a stream key, transferring ownership of a
        channel, changing a payout method — and it is then asked for **at the moment of the
        operation**, not on returning to a screen.

        Allowed origins on the CORS side, as **literal strings**: `capacitor://localhost` and
        `https://localhost`. A bare `localhost` entry covers neither, `*` is illegal with credentialed
        requests, and a framework that normalises the origin through a URL parser would reject
        `capacitor://`.

  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context, propagated down to the service and injected into the outbox **at write time**.
      schema:
        type: string
        pattern: "^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
        examples: ["00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"]

    Surface:
      name: X-Arthome-Surface
      in: header
      required: true
      description: |
        The calling surface. The studio log **names names and places them**: "who decided, when, from
        which surface". A non-human actor — an automatic holding screen, a lease expiring — is an
        actor all the same, and carries `system`.
      schema:
        type: string
        enum: [studio_web, studio_mobile]
        x-arthome-vocabulary-source: SURFACES
        x-arthome-vocabulary-narrowing: "The two that may call the studio BFF. An input refuses where an output keeps an unknown value raw."
        examples: [studio-mobile]

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 generated by the surface **before sending**. The rule counts twice over here: a mobile
        network replays, and a person who sees no answer presses twice. A replayed key returns the
        original response, verbatim. Lifetime 24 h.
      schema: { type: string, format: uuid, examples: ["019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77"] }

    IfRightsVersion:
      name: If-Rights-Version
      in: header
      required: false
      description: |
        **The rights version the client holds**, symmetric to `X-Arthome-Rights-Version` in the
        response. Without it, the server cannot tell "you never had that right" from "you had it two
        hundred milliseconds ago": **two of the three refusal codes were out of reach**, and only
        `FORBIDDEN` was left — that is, the very indistinction the three codes existed to remove.

        The difference, on duty, is not theoretical: on `FORBIDDEN` the application sends the
        operator back to the home screen as if they had never had the right; on
        `RIGHTS_VERSION_STALE` it reloads the bootstrap and **finds its place again**.

        **Which clock is authoritative**, since there were two: the server makes the client leave the
        real-time rooms **immediately**, but a command still goes through for up to 60 s, the lifetime
        of the internal token. It is **the command that is authoritative** — a refusal is only
        rendered when the owning service renders it, on the loaded resource. The console may therefore
        freeze before the writes stop, and that is the safe order: you stop showing before you stop
        acting.
      schema: { type: integer, format: int64, examples: [412] }

    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid, examples: ["019928a0-7d31-7a10-b8c4-2f9e11a4c222"] }

    DateId:
      name: dateId
      in: path
      required: true
      schema: { type: string, format: uuid, examples: ["019928a0-7d31-7a10-b8c4-2f9e11a4c001"] }

    Page:
      name: page
      in: query
      required: false
      description: "**Page number, from 1.** That is the affordance wanted: you pin a page and send it to a colleague."
      schema: { type: integer, minimum: 1, default: 1 }

    PageSize:
      name: pageSize
      in: query
      required: false
      description: "Small pages, and deliberately so: a thumb does not scan a hundred rows."
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

    SortBy:
      name: sortBy
      in: query
      required: false
      description: |
        Sort key. **A key bearing on a field absent from this role's projection is refused** with
        `SORT_KEY_FORBIDDEN`, never ignored.

        Sorting by **state** follows the **state machine's canonical order**, not alphabetical order:
        it is domain data, served with the state (`orderRank`), and not a table each surface would
        reinvent.
      schema: { type: string, examples: [startsAt] }

    SortDir:
      name: sortDir
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A sort or filter key. It is a property of THIS endpoint's list — which orders it offers — not of the domain, and adding one is an endpoint change rather than a vocabulary change.", default: asc }

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        **The only two exceptions to "page + total"**: the moderation queue and the live chat.
        Opaque Base64 cursor on `(created_at, id)`, valid 24 h, `410 api.cursor_too_old` beyond.
      schema: { type: string }

    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  headers:
    ServedAt:
      description: The server instant of this response. Every duty countdown refers to it, never to the workstation's clock.
      schema: { type: string, format: date-time }

    RightsVersion:
      description: |
        **Carried on every response.** When it changes, the navigation is stale: the client reloads
        the bootstrap. It is also pushed on the real-time channel, and the server makes the client
        leave a lost channel's rooms **without waiting for a reconnection**.
      schema: { type: integer, format: int64 }

    IdempotencyReplayed:
      description: Present and `true` when the body is the memorised response of an earlier attempt.
      schema: { type: boolean }

  responses:
    BadRequest:
      description: Malformed request, or a mandatory filter missing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: api.period_filter_required,
                nature: refused,
                params: { maxRangeDays: 92 },
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    Unauthorized:
      description: Aucune session valide.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: api.unauthenticated,
                nature: refused,
                params: {},
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    Forbidden:
      description: |
        Right absent, rights stale, access revoked, or channel left. Three distinct codes —
        `FORBIDDEN`, `RIGHTS_VERSION_STALE`, `CHANNEL_ACCESS_REVOKED` — because the person must know
        whether to reload, to phone someone, or to give up.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: api.rights_version_stale,
                nature: refused,
                params: { currentRightsVersion: 412 },
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    NotFound:
      description: Unknown resource, or outside this channel's perimeter.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: api.not_found,
                nature: refused,
                params: {},
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    Conflict:
      description: |
        A final business refusal, and the `code` says which. `STATE_CONFLICT` carries **the current
        state and version**; `TRANSITION_IRREVERSIBLE` carries the transition attempted **and the
        promise committed**; `MODERATION_ALREADY_SETTLED` carries **the winning verdict and its
        author**.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: moderation.already_settled
              nature: refused
              params: { verdict: remove, settledBy: "Claire D.", settledAt: "2026-09-21T20:30:58Z" }
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: "2026-09-21T20:31:04.118Z"

    Gone:
      description: Resume cursor too old — a full reload is required, and the surface **knows** it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: api.cursor_too_old,
                nature: refused,
                params: { maxAgeHours: 24 },
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    TooManyRequests:
      description: Rate limit reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: api.rate_limited,
                nature: unavailable,
                params: { retryAfterMs: 2000 },
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    Unavailable:
      description: 'Our servers. `nature: "unavailable"` lets someone on duty tell "retry" from "understand".'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: api.upstream_unavailable,
                nature: unavailable,
                params: { service: streaming },
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

  schemas:
    EnvelopeMeta:
      type: object
      required: [servedAt, rightsVersion]
      properties:
        servedAt:
          type: string
          format: date-time
          description: |
            The reference clock. The duty countdown, the length of a silencing, "the replay expires in
            41 h", the expiry of a one-off access: everything is counted against it and a measured offset,
            **never against the workstation's clock**.
          examples: ["2026-09-21T20:31:04.118Z"]
        validUntil: { type: [string, "null"], format: date-time }
        rightsVersion:
          type: integer
          format: int64
          description: "**On every response.** When it changes, the navigation is stale."
          examples: [412]
        lastEventSeq: { type: [integer, "null"], format: int64 }
        degraded:
          type: array
          items: { type: string }
          description: The optional parts that could not be composed. The console paints anyway.

    OffsetPageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      description: |
        **The total is exact**, not approximate: that is the difference from the storefront, and it
        is what "1–8 OF N" requires.
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
        emptyReason: { type: [string, "null"] }

    CursorPageInfo:
      type: object
      required: [hasMore]
      description: "The two exceptions: the moderation queue and the live chat."
      properties:
        nextCursor: { type: [string, "null"], pattern: '^[A-Za-z0-9_-]+=*$' }
        prevCursor: { type: [string, "null"], pattern: '^[A-Za-z0-9_-]+=*$' }
        hasMore: { type: boolean }
        pendingCount:
          type: [integer, "null"]
          description: |
            The **separate total**, for the badge. It is not counted over the current page: the bottom
            bar carries "in queue: 14", and **none of these numbers may require fetching a page**.

    Error:
      type: object
      required: [code, nature, params, traceId]
      properties:
        code:
          type: string
          description: |
            Closed vocabulary, i18n by codes, **with a snapshot embedded at build time as a mandatory
            fallback**. That is vital here: **a store review is slow**. If a new code arrives from the
            backend before the application is updated, the person on duty must see a sentence, not
            `moderation.verdict.conflict`.
          examples: [publication.checklist_incomplete]
          pattern: '^[a-z][a-z0-9_]*(?:\.[a-z][a-z0-9_]*)+$'
          x-arthome-vocabulary: [api.unauthenticated, api.forbidden, api.not_found, api.rate_limited, api.schema_invalid, api.internal, api.service_unavailable, api.upstream_unavailable, api.cursor_too_old, api.sort_key_forbidden, api.period_filter_required, api.rights_version_stale, identity.email_taken, identity.handle_taken, identity.two_factor_required, identity.signed_out_elsewhere, pairing.slow_down, pairing.identity_mismatch, pairing.intent_not_engageable, pairing.execution_engaged, chat.holders_only, chat.rate_limited, moderation.already_claimed, moderation.already_settled, moderation.automatic_cannot_override_human, moderation.decision_version_stale, date.has_sold_seats, date.outcome_decision_forbidden, date.prices_locked, date.replay_policy_final, date.technical_check_required, date.technical_provision_required, date.stream_key_rotation_during_run, channel.has_open_obligations, channel.crew_role_reserved, channel.role_not_assignable, channel.transfer_target_ineligible, channel.same_actor_forbidden, payout.reconciliation_discrepancy_unexplained, order.quote_address_mismatch, order.sold_out, order.payment_declined, order.price_stale, order.plan_unavailable, capacity.tier_must_widen, content.empty_in_both_languages, hold.quantity_invalid, media.size_invalid, media.url_empty, order.quantity_invalid, pairing_code.ambiguous_glyph, publication.checklist_incomplete, publication.transition_forbidden, publication.transition_irreversible, search.unknown_flag, seat_code.malformed, watch.no_seat, watch.room_not_open, watch.out_of_territory, watch.subscription_required, watch.no_replay, watch.replay_expired, watch.replay_not_on_sale, watch.preview_exhausted, watch.concurrent_limit_reached, watch.date_cancelled, watch.not_published]
          x-arthome-vocabulary-source: ERROR_CODES
        nature:
          type: string
          description: |
            `offline_forbidden` is a **local** refusal, never emitted by the server.

            **Open vocabulary on read.** An unknown nature is treated as **`unavailable`**, hence
            retryable. A frozen `enum` here would make an earlier version of the application reject the
            **whole** error envelope — that is, lose the ability to read errors at the precise moment
            something is wrong, on duty, on an application a store review takes days to replace.
          x-arthome-vocabulary: [refused, unavailable, offline_forbidden]
          x-arthome-vocabulary-source: FAILURE_NATURES
          x-arthome-unknown-fallback: unavailable
        params:
          type: object
          additionalProperties: true
          examples: [{ missing: [poster, capacity, technical_check_passed] }]
        traceId:
          type: string
          minLength: 1
          description: The one moment left where the person can read out a number and dictate it to support.
          examples: ["4bf92f3577b34da6a3ce929d0e0e4736"]

    ErrorEnvelope:
      type: object
      required: [error, servedAt]
      properties:
        error: { $ref: "#/components/schemas/Error" }
        servedAt: { type: string, format: date-time }

    Money:
      type: object
      required: [amountMinor, currencyCode]
      description: |
        An amount. **Integer minor unit** — cents for EUR and CHF — plus an ISO 4217 currency code.
        Never a formatted string: formatting is presentation and happens client-side. May be negative
        (credit, refund).

        **`Money` says nothing about tax, and that is deliberate.** It carries credits, refunds,
        commissions and payouts as well as prices. **A price, however, is tax-inclusive** (D-056),
        and every field that is one says so where it is declared rather than relying on this shape —
        a reader who assumes the wrong side of a VAT rate computes a total that is wrong by that
        rate, and `Money` is not the place that can warn them.
      properties:
        amountMinor: { type: integer, format: int64, examples: [2400] }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$", examples: [EUR] }

    LocalizedText:
      type: object
      required: [contentLanguage, text]
      description: |
        An **authored** text. The only two acknowledged exceptions to "i18n by codes": the holding
        screen message written by the control room, and the inbox texts.
      properties:
        contentLanguage: { type: string, examples: [fr] }
        text: { type: string }

    Actor:
      type: object
      required: [surface]
      description: |
        Who caused the fact. **Empty for `system`** — a server rule (an automatic holding screen, a
        lease expiring) is an actor all the same, and the log must be able to tell it apart from a
        human decision.
      properties:
        accountId: { type: [string, "null"], format: uuid }
        personId: { type: [string, "null"], format: uuid }
        displayName: { type: [string, "null"] }
        surface:
          type: string
          description: |
            **One vocabulary, six members** — `SURFACES` — with the narrowing said here rather than
            written as a second, shorter list. A studio payload carries `studio_web`, `studio_mobile`
            or `system` and never the three storefront surfaces, **by construction**: the actor is
            whoever called this BFF. Declaring only three would be a second authored list for a field
            the domain already defines, which is how E4 started.
          x-arthome-vocabulary:
            [storefront_web, storefront_mobile, storefront_tv, studio_web, studio_mobile, system]
          x-arthome-vocabulary-source: SURFACES

    SessionMode:
      type: string
      description: |
        **An explicit parameter, validated, never inferred from the `User-Agent`** — that one is
        forgeable. `cookie` for the studio web; `bearer` for the native shell, where
        `capacitor://localhost` is a third-party context on iOS and where no cookie would survive.
      enum: [cookie, bearer]
      x-arthome-vocabulary-source: SESSION_MODES
      x-arthome-vocabulary-narrowing: "Two of the three. The studio has no device sessions: only a television opens a sign-in pairing with neither cookie nor token, and a control room is not one."

    SessionEstablished:
      description: |
        **Invariant: a response never carries a cookie and a token at once.** Two bearers for one
        session means two revocations to keep up and one that will be forgotten. So these are **two
        schemas**, discriminated by the mode, and not one schema with an optional field.
      oneOf:
        - $ref: "#/components/schemas/SessionEstablishedCookie"
        - $ref: "#/components/schemas/SessionEstablishedBearer"
      discriminator:
        propertyName: mode
        mapping:
          cookie: "#/components/schemas/SessionEstablishedCookie"
          bearer: "#/components/schemas/SessionEstablishedBearer"

    SessionEstablishedCookie:
      type: object
      required: [mode, bootstrap]
      description: '`HttpOnly` `Secure` `SameSite=Lax` cookie on the **BFF''s domain**. **Nothing in the body.**'
      properties:
        mode: { type: string, const: cookie }
        bootstrap: { $ref: "#/components/schemas/StudioBootstrap" }

    SessionEstablishedBearer:
      type: object
      required: [mode, accessToken, expiresAt, bootstrap]
      description: |
        Opaque token in the body, **no cookie**, stored in the native store —
        `@capacitor/preferences`, **never `localStorage`**.
      properties:
        mode: { type: string, const: bearer }
        accessToken: { type: string }
        refreshToken: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
        bootstrap: { $ref: "#/components/schemas/StudioBootstrap" }

    # ---------------------------------------------------------- rights and bootstrap

    EffectiveRights:
      type: object
      required:
        [
          channelId,
          roles,
          navigation,
          datePanes,
          canRevenue,
          canOps,
          canTech,
          canDecideOutcome,
          assignableRoles,
        ]
      description: |
        **Computed once in `@arthome/core`, served by the BFF.** Never recomposed by a surface: the
        navigation is the **union** of the accesses of every role held, and a six-persona projection
        would erase `director`'s right to invite.
      properties:
        channelId: { type: string, format: uuid }
        channelName: { type: string }
        roles:
          type: array
          description: "**A set**, never a single role — one person holds several on the same channel."
          items:
            type: string
            x-arthome-vocabulary:
              [artist, production, coordination, director, video, sound, moderation, treasury]
            x-arthome-vocabulary-source: MEMBER_ROLES
          examples: [[production, coordination]]
        isOwner:
          type: boolean
          description: Exactly one row per channel. **Never removable, and their roles never editable.**
        navigation:
          type: array
          description: |
            The **open** entries, in the served canonical order. The surface neither orders nor
            filters.

            **The list is `NAVIGATION_ENTRIES` in `@arthome/core`, and the direction is not a
            preference**: critical rule 2 says a value displayed twice comes from core, so the
            contract follows core and never the reverse. It had drifted on two members, in the two
            ways a copied list always drifts — one missing, one renamed:

            - `team` was in core and absent here, while this document serves the team page
              (`listChannelMembers`). A screen with no way into it;
            - core says `moderation-page` where this document said `moderation`. That is the worse
              of the two, because both sides believed they shared the value. And the disambiguation
              is core's to keep: in **this** document `moderation` is already a **role** — one of
              the eight canonical values, in six places — so a navigation entry spelled the same
              way collides with a role inside one payload.
          items:
            type: string
            x-arthome-vocabulary:
              [
                agenda,
                dashboard,
                moderation_page,
                crew,
                events,
                stream,
                stats,
                tickets,
                store,
                replays,
                team,
                payouts,
                journal,
                settings,
                help,
              ]
            x-arthome-vocabulary-source: NAVIGATION_ENTRIES
        contextualPages:
          type: array
          description: |
            **The pages reached from another page, never listed in a menu** — and they need a rights
            carrier like the rest. `regie` is a stage manager's duty page, the one they open when the
            feed drops; `wizard` creates a date; `event` is the record; `inbox` is open to everyone,
            with no role condition.

            **They are not in `navigation`, and that is deliberate**: `navigation` populates the bar and
            the sheet, these four do not. Filing them together had produced the opposite mistake —
            `regie` had been removed from the vocabulary to make an inconsistency between two tables go
            away, that is, **the duty's main destination was deleted in order to silence the symptom
            that pointed at it**. The two tables are reconciled here, and the page is given back.
          items: { type: string, x-arthome-vocabulary: [regie, wizard, event, inbox], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change." }
          examples: [[regie, wizard, event, inbox]]
        tabBar:
          type: array
          description: |
            **The four tabs of the bottom bar, in their order, served.** This is **not** `navigation`
            truncated to four: the bar's order depends on the role, and the demonstration is arithmetic —
            for an artist, the first four entries of `navigation` give
            `dashboard · crew · events · stream`, where the bar must carry
            `dashboard · events · crew · tickets`. Two differences out of four: taking the head of
            `navigation` would put the control room in an artist's bar and push ticketing out of it —
            that is, what an artist looks at most.

            The table lives in `@arthome/core` and is **served** here, because the studio web orders the
            same menu: copied out, it would be implemented twice — which critical rule 2 forbids.
          items: { type: string }
          examples: [[dashboard, events, crew, tickets]]
        datePanes:
          type: array
          description: |
            The date-record panes open **to this person**. A detail screen whose very layout depends on
            rights: it is not only the root navigation that must know the rights before painting, it is
            every record too.
          items: { type: string, x-arthome-vocabulary: [public, tickets, chat, tech, crew, replay], x-arthome-vocabulary-source: DATE_PANES }
        canRevenue:
          type: boolean
          description: "**Decides the content of the response**, not its display."
        canOps: { type: boolean }
        canTech: { type: boolean }
        canDecideOutcome:
          type: boolean
          description: |
            Postpone, cancel, carry on with compensation — **reserved to the owner and to production**.
            The other roles can only **report**. An outcome decision is worth several thousand euros.
        assignableRoles:
          type: array
          description: |
            The projection of `grants` onto the roles held, **materialised** — never the `grants` table
            to be recomposed. `director` can invite `video` and `sound`; `video`, `sound`, `moderation`
            and `treasury` invite nobody.
          items: { type: string }
        dateGrants:
          type: array
          description: |
            The **one-off** accesses in force, scoped to a date, with their **instant** of expiry.
            "Expires at curtain call + 1 h" is a screen sentence; the contract carries the instant.
          items:
            type: object
            required: [grantId, dateId, crewRole, expiresAt]
            properties:
              grantId: { type: string, format: uuid }
              dateId: { type: string, format: uuid }
              crewRole: { type: string, x-arthome-vocabulary: [director, video, sound, moderation], x-arthome-vocabulary-source: CREW_ROLES }
              expiresAt: { type: string, format: date-time }

    StudioCounters:
      type: object
      description: |
        **The badges, served at bootstrap and kept up to date by the real-time channel.** None of
        these numbers may require fetching a page: otherwise the bottom bar costs five requests every
        time it opens.
      properties:
        moderationPending: { type: integer, examples: [14] }
        inboxUnread: { type: integer, examples: [2] }
        dutiesTonight: { type: integer, examples: [3] }
        invitationsPending: { type: integer }
        datesToCover: { type: integer }
        payoutsDue: { type: integer }

    StudioBootstrap:
      type: object
      required: [person, channels, rightsVersion, constants, labelCatalog, counters]
      description: |
        **The first paint waits for one thing only: this.** The tables are never read empty, and that
        is the right behaviour — but it imposes its own constraint: the bootstrap must be **small and
        fast**, because nothing is painted until it is there. Everything else — measurements, queue,
        statistics — arrives afterwards, screen by screen.

        **The root is not a channel, it is a person.** A freelance stage manager or moderator works
        across several channels the same evening; `channels[]` carries them all, with their effective
        rights.
      properties:
        person:
          type: object
          required: [personId, displayName]
          properties:
            personId: { type: string, format: uuid }
            displayName: { type: string }
            isFreelance: { type: boolean }
            runsCalled:
              type: integer
              description: "**A read model**, not a hand-written field: it increments on `run_ended`."
            readingTimezone:
              type: string
              description: "**The same field** as the storefronts reading timezone — same account, one carrier only."
              examples: ["Europe/Paris"]
        channels:
          type: array
          items: { $ref: "#/components/schemas/EffectiveRights" }
        personNavigation:
          type: array
          description: |
            **The entries that belong to the person, not to a channel.** `agenda` is served by
            `GET /v1/me/duties`, explicitly "across all channels"; `inbox` likewise, and it is open to
            everyone. Filing them under the **per-channel** `navigation` meant a person on three channels
            received the same entry three times — or zero times, which is what happened in the example
            this document served: a `video` role received `[events, stream, replays, help]`, with no
            `agenda`, although a stage manager's duty page is precisely that one. The `dutiesTonight`
            counter was served all the same, which presupposes that duties count.

            **Two vocabularies in one field, like `DashboardReminder.targetPage`, and here it is
            correct.** `agenda` and `help` are `NAVIGATION_ENTRIES`; `inbox` is a contextual page.
            They sit together because what they have in common is the **scope** — the person rather
            than the channel — not which menu they came from. Saying so is the difference between
            this and the `targetPage` defect, where the same merge had gone unremarked and one member
            was spelled wrong.
          items:
            type: string
            x-arthome-vocabulary: [agenda, inbox, help]
            x-arthome-vocabulary-source: none
            x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change."
          examples: [[agenda, inbox, help]]
        rightsVersion: { type: integer, format: int64 }
        constants:
          type: object
          description: |
            The domain constants, **served**. Technical-provision threshold, revision deadline,
            waiting-list priority window, season boundaries, chat rate ceiling, cancellation deadline.
            Copied out, these constants would diverge across five surfaces (E11).
          properties:
            technicalProvisionThreshold: { type: integer, examples: [10000] }
            provisionRevisionHours: { type: integer, examples: [72] }
            waitlistPriorityWindowHours: { type: integer, examples: [2] }
            cancelDeadlineMinutesBefore: { type: integer, examples: [60] }
            payoutDelayDays: { type: integer, examples: [14] }
            commissionRateBps: { type: integer, examples: [1200] }
            chatBurstThresholdPerMinute: { type: integer, examples: [60] }
            moderationQueueAlertThreshold:
              type: integer
              description: "**The \"queue beyond ten messages\" threshold**, one of the five notification thresholds that had no carrier. Rule 15."
              examples: [10]
            crewUnassignedAlertHoursBefore:
              type: integer
              description: "**The \"post unassigned at D-1\" delay**, the second of the two thresholds without a carrier."
              examples: [24]
            holdScreenAutoAfterSec:
              type: integer
              description: |
                "Automatic holding screen if the feed is lost for more than 15 s" is a **server rule**,
                carried as a channel default. It does not depend on a control-room workstation that might be
                the one that lost the network.
              examples: [15]
            seasonBounds:
              type: object
              description: "**1 September → 31 August**, the live-performance convention. Served, never guessed by five surfaces."
              properties:
                startsOn: { type: string, examples: ["09-01"] }
                endsOn: { type: string, examples: ["08-31"] }
        labelCatalog:
          type: object
          description: |
            An immutable versioned artifact, **served per surface**. The studio loads four themes —
            `studio`, `taxonomy`, `system`, `storefront` — and its number of enumeration keys is high: the
            split by surface exists precisely for that. **No service** serves it: it is a CDN artifact.
          properties:
            domain:
              type: string
              description: |
                **Which catalogue this reference is for**, served rather than recoverable by taking the
                URL apart. The theme lived only inside the path (`/i18n/studio/fr/v41.json`), so a client
                caching catalogues by theme had to parse a string to learn what it was holding — which is
                `imageUrl(kind, key, width)` in another costume, and the same rule answers it: **a value
                recoverable only by parsing a string is a value the contract did not serve.**
              x-arthome-vocabulary: [common, storefront, studio, taxonomy, system]
              x-arthome-vocabulary-source: MESSAGE_DOMAINS
              examples: [storefront]
            locale:
              type: string
              description: |
                **The domain declares exactly two**, and the contract says so rather than serving an
                open string: a surface choosing a fallback needs to know the set it is choosing from.
                Tolerant on output like every other served vocabulary — a third locale is kept raw and
                treated as neutral, never rejected.
              x-arthome-vocabulary: [fr, en]
              x-arthome-vocabulary-source: LOCALES
              examples: [fr]
            version: { type: integer }
            url: { type: string, format: uri }
        counters: { $ref: "#/components/schemas/StudioCounters" }
        realtime:
          type: object
          description: |
            **The subscription is per person, not per page.** A channel opened only on the channel
            currently displayed would miss the other one's incident — and on an already fragile mobile
            network, one subscription per channel would multiply the connections.
          properties:
            namespace: { type: string, examples: ["/studio"] }
            pulseIntervalSec:
              type: integer
              description: |
                **`ws:pulse` every 5 s**, and that is what makes silence diagnosable: no more pulse for
                15 s = **I am deaf**; a pulse with no health sample for 30 s = **the room has stopped
                sending**. Two states, two screens, no inference.
              examples: [5]

    # ------------------------------------------------ measurement: period, tiles, series

    PeriodBounds:
      type: object
      required: [from, to, days, datesCovered, preset]
      description: |
        **The period's effective bounds, computed by the server.** A custom range displays
        "94 days · 7 dates": both numbers are served, because they depend on the channel's calendar
        and because `SEASON` is a domain notion (1 September → 31 August) whose bounds are already
        served at bootstrap.
      properties:
        preset:
          {
            type: string,
            x-arthome-vocabulary: [last_7_days, last_30_days, last_90_days, season, custom], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A period selector for this screen. The bounds it resolves to are served (`seasonBounds`, `periodStart`/`periodEnd`); this only names which preset the person chose.",
          }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer, examples: [94] }
        datesCovered: { type: integer, examples: [7] }

    MetricTile:
      type: object
      required: [id, value, unit, series, seriesGranularity]
      description: |
        **A single template: identifier, value, unit, series.** Three things it does not carry, and
        each one is a decision:

        **1. No variation.** It is **derived** from the series by `trendOf` in `@arthome/core` — the
        average of the first half against the second, **nothing below 4 series points nor below a
        0.1% gap** — as a percentage except for fill rate, which is in **points**. Serving it on top
        of the series would be the same value computed in two places.

        **2. No literal unit.** `unit` is a **code**, and the period comes from the request. The
        design carried "over 30 d" hardcoded on a tile although a period selector sits beside it: the
        label would have lied from the first click.

        **3. The value is bounded by the period requested**, all six tiles without exception. The
        design froze `SUBSCRIBERS GAINED` at thirty days **and then multiplied it** by a period
        coefficient — a frozen counter, scaled. The contract aggregates over the period, or does not
        serve the tile.
      properties:
        id:
          type: string
          x-arthome-vocabulary:
            [
              shop_sales,
              followers_gained,
              replay_views,
              fill_rate,
              moderated_messages,
              signal_quality,
            ]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A screen composition the server decides so that five surfaces do not each decide it differently."
        value: { type: number }
        unit: { type: string, x-arthome-vocabulary: [currency_minor, count, percent, points], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A presentation choice the contract serves so that five surfaces do not each invent one. The domain has no opinion on it." }
        currencyCode: { type: [string, "null"], pattern: "^[A-Z]{3}$" }
        series:
          type: array
          description: |
            **The sparkline takes the last 14 points.** Serving more costs little and lets the client
            choose; serving fewer would make the variation inexpressible.
          items:
            type: object
            required: [at, value]
            properties:
              at: { type: string, format: date-time }
              value: { type: number }
              dateId: { type: [string, "null"], format: uuid }
        seriesGranularity:
          type: string
          description: |
            **Declared, because it is not obvious.** In the design the series is **one value per date**,
            never per day — a daily granularity appears nowhere in it. Declaring it makes `per_day`
            addable later **without breaking a client**: it reads what the server announces instead of
            assuming.
          x-arthome-vocabulary: [per_date, per_day]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A presentation choice the contract serves so that five surfaces do not each invent one. The domain has no opinion on it."
          examples: [per_date]

    DashboardReminder:
      type: object
      required: [id, kind, severity, textCode, params, targetPage, actionable]
      description: |
        **A routed list, like the inbox**: kind, severity, target and role scope decided
        **server-side**. `actionable` says whether the destination page is open to this person — the
        row stays visible otherwise, but is not clickable, and it is the server that knows, since it
        is the server that holds the effective rights.
      properties:
        id: { type: string }
        kind:
          type: string
          x-arthome-vocabulary:
            [
              publication_incomplete,
              technical_check_missing,
              moderator_unassigned,
              near_sold_out,
              moderation_backlog,
            ]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change."
        severity: { type: string, x-arthome-vocabulary: [info, warning, urgent], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A presentation choice the contract serves so that five surfaces do not each invent one. The domain has no opinion on it." }
        textCode: { type: string, description: "An i18n **code**, never the authored sentence." }
        params: { type: object, additionalProperties: true }
        targetPage:
          type: string
          description: |
            **The union of two vocabularies, and it carried a stale spelling of one of them.** A
            reminder points either at a menu entry (`NAVIGATION_ENTRIES` — `crew`, `events`,
            `moderation_page`) or at a contextual page (`event`, `regie`), because those are the two
            kinds of destination this studio has. It read `moderation` here while core and
            `EffectiveRights.navigation` read `moderation_page`, so a surface routing on this field
            matched nothing for that one destination — and `moderation_backlog` is the most frequent
            reminder the dashboard produces.
          x-arthome-vocabulary: [event, regie, crew, events, moderation_page]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change."
        dateId: { type: [string, "null"], format: uuid }
        countdownTo:
          type: [string, "null"]
          format: date-time
          description: "**An instant**, not a sentence: the countdown is computed against `servedAt`."
        actionable: { type: boolean }

    DashboardScreen:
      type: object
      required: [period, tiles, reminders]
      description: |
        **Most of this screen is a recomposition of collections already served.** This path carries
        only what had no carrier: the tiles aggregated over a period and the "to handle" list, which
        is an aggregation **at channel level** whose ingredients all existed without anyone bringing
        them together.

        The next dates, the countdown to curtain-up, revenue per date and the number of dates held in
        reserve **are not here**: they come from `listChannelEvents`, `listPayouts` and the channel's
        `serverTime`. Asking for them again would have been the value composed in two places that
        rule 2 forbids.
      properties:
        period: { $ref: "#/components/schemas/PeriodBounds" }
        tiles:
          type: array
          description: |
            **The tile is removed from the board, not emptied** — the same mechanism as everywhere else
            in the studio: a forbidden field is absent, never present and null. `artist` and `production`
            receive four of them, `treasury` three (not `canOps`).

            **Four tiles out of six are served, and that is a deliberate decision.**
            `moderated_messages` and `signal_quality` test the **primary** role — `mod` and `regie` — yet
            neither of those opens `dashboard`: they are **never** displayed. The contract serves what is
            reachable rather than carrying two dead tiles. They stay in the vocabulary, because the open
            question is a product one, not a contract one: **open `dashboard` to those two roles, or
            withdraw the tiles.**
          items: { $ref: "#/components/schemas/MetricTile" }
        reminders:
          type: array
          description: |
            Bounded to five, and to **two** rows coming from the publication checklists. The order is
            **served**: severity descending, then nearest deadline.
          items: { $ref: "#/components/schemas/DashboardReminder" }
        revenueByDate:
          type: [object, "null"]
          description: "**Absent** without `canRevenue`."
          properties:
            total:
              $ref: "#/components/schemas/Money"
              x-arthome-tax-basis: inclusive
            totalScope:
              type: string
              description: |
                **What the total counts, declared.** The design displays a total at the head of six rows
                without saying whether it is the sum of the six or the channel's total over the period — and
                the figure there is hardcoded, so it does not settle it. The contract serves `channel_period`
                and **says so**, rather than letting two surfaces add up six bars and arrive at a different
                number.
              x-arthome-vocabulary: [channel_period, listed_rows]
              x-arthome-vocabulary-source: none
              x-arthome-vocabulary-reason: "A screen composition the server decides so that five surfaces do not each decide it differently."
            items:
              type: array
              items:
                type: object
                properties:
                  dateId: { type: string, format: uuid }
                  title: { type: string }
                  startsAt: { type: string, format: date-time }
                  gross:
                    $ref: "#/components/schemas/Money"
                    x-arthome-tax-basis: inclusive

    StatsAudience:
      type: object
      required: [period, headline, fillByDate, audienceByDate]
      description: |
        **The provenance ring is not served, and that is not an oversight.** The design brings five
        labels — home, internal search, share, direct link, featured — and **nothing else**: the
        values there are hardcoded and **no attribution source exists** in the reference data.
        Carrying it would have been writing an intention and passing it off as a measurement — that
        is, letting a design's layout dictate an API's structure.

        **What it would take for it to exist**: provenance capture at the entry of the journey
        (campaign parameter, referrer, internal origin), carried through to the order and projected
        per date. That is a mechanism, not a field — and until it exists, the contract promises
        nothing.
      properties:
        period: { $ref: "#/components/schemas/PeriodBounds" }
        headline:
          type: object
          properties:
            viewersTotal:
              type: [integer, "null"]
              description: |
                **This is not a count of unique individuals**, and the name does not claim so here. It is
                the per-date sum of `max(live viewers, seats sold)` plus the replay views. The definition of a
                **unique** viewer exists nowhere in the sources; serving it under that name would have been a
                promise we do not keep.
            averageFillRateBps: { type: integer }
            datesCount:
              type: integer
              description: "**All** the channels dates over the period, with no state filter — the way the design counts them."
            netRevenue:
              $ref: "#/components/schemas/Money"
              x-arthome-tax-basis: exclusive
              description: "**Absent** without `canRevenue`."
        fillByDate:
          type: array
          items:
            type: object
            properties:
              dateId: { type: string, format: uuid }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              fillRateBps: { type: integer }
              seatsSold: { type: [integer, "null"] }
              capacityTotal: { type: [integer, "null"] }
              onSale: { type: boolean }
        audienceByDate:
          type: array
          description: |
            **`seatsSold` and `liveViewers` are two distinct fields.** The design displays "N viewers"
            and feeds it with seats sold: label and datum diverge there. The contract serves both
            separately and lets the surface choose what it names — instead of carving the confusion in
            stone.
          items:
            type: object
            properties:
              dateId: { type: string, format: uuid }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              displayState:
                {
                  type: string,
                  x-arthome-vocabulary:
                    [draft, reserve, scheduled, technical, room_open, live, replay, ended,
                     postponed, cancelled, interrupted], x-arthome-vocabulary-source: DISPLAY_STATES,
                }
              seatsSold: { type: integer }
              liveViewersPeak: { type: [integer, "null"] }
              replayViews: { type: [integer, "null"] }
              fillRateBps: { type: integer }

    StatsSeries:
      type: object
      required: [period, headline, series]
      description: |
        **The contract carries the grouping, the reference and both gaps — computed.** Not the
        ingredients: the choice of reference is a **domain rule**, and two surfaces would reimplement
        it differently.
      properties:
        period: { $ref: "#/components/schemas/PeriodBounds" }
        headline:
          type: object
          properties:
            seriesCount: { type: integer }
            bestFillRateBps: { type: [integer, "null"] }
            bestFillShowId: { type: [string, "null"], format: uuid }
            averageGapPoints:
              type: [number, "null"]
              description: |
                In **points**, between the reference and the ones that follow, across all series.
                **Null when no following date has sold** — "not yet measurable" is a state,
                not a zero.
            pendingDecisionCount:
              type: integer
              description: The dates **held in reserve**. Already obtainable through `listChannelEvents?state=reserve`; served here to save the banner a second call.
        series:
          type: array
          description: |
            **Grouped by `showId`**, never by title — the design groups by title, but the domain has a
            show and that is the right key. The `draft` and `technical` states are **excluded** from the
            grouping, and only groups of **more than one date** are series. An empty table is a **served
            case**: "no series" invites you to duplicate a date.
          items:
            type: object
            required: [showId, title, referenceDateId, dates]
            properties:
              showId: { type: string, format: uuid }
              title: { type: string }
              referenceDateId:
                type: string
                format: uuid
                description: |
                  **The first date that sold at least one seat**, failing that the first in the
                  group. It is not the first in chronological order, and that is the whole
                  difference: comparing against a date that sold nothing would make every following
                  series look like a success.
              dates:
                type: array
                items:
                  type: object
                  required: [dateId, startsAt, fillRateBps, isReference]
                  properties:
                    dateId: { type: string, format: uuid }
                    startsAt: { type: string, format: date-time }
                    displayState:
                      {
                        type: string,
                        x-arthome-vocabulary:
                          [
                            draft,
                            reserve,
                            scheduled,
                            technical,
                            room_open,
                            live,
                            replay,
                            ended,
                            postponed,
                            cancelled,
                            interrupted,
                          ], x-arthome-vocabulary-source: DISPLAY_STATES,
                      }
                    fillRateBps: { type: integer }
                    seatsSold: { type: integer }
                    revenue:
                      $ref: "#/components/schemas/Money"
                      x-arthome-tax-basis: inclusive
                      description: "**Absent** without `canRevenue`."
                    isReference: { type: boolean }
                    fillGapPoints:
                      type: [number, "null"]
                      description: |
                        Fill-rate gap **in points** against the reference.
                        **Null — hence nothing to display — when the date has no sales at all**: "there
                        is no gap to measure, it is a decision to be made, not a decline".
                    revenueGapPct:
                      type: [number, "null"]
                      description: Revenue gap as a **percentage**. **Absent** without `canRevenue`, null without sales.
                    canOpenSale:
                      type: boolean
                      description: True if the date is held in reserve **and** the person can open the sale. Served, because it is a right.

    # ---------------------------------------------------------- publication

    PublicationChecklistItem:
      type: object
      required: [id, satisfied, source, blocking]
      description: |
        **Nine items, the ones on the record** — not the four in the fixtures, which are an
        arbitrary subset. Served as a **list of identifiers**, never a percentage, which the client
        would compute.

        **Seven block publication and two do not.** `chapters_planned` and `moderator_assigned` are
        **non-blocking warnings**: a date must be publishable without chapters. They are in the same
        vocabulary because they are the same kind of thing on the same screen — the blocking part is
        a property of the item, not of the list, and splitting the list would make "publish —
        3 missing" count two things.

        **This description said "seven" while the vocabulary below listed nine**, and the count was
        the stale half: `moderator_assigned` is quoted elsewhere in this document as a checklist item
        that `datesToCover` counts against. A number in prose beside the list it counts is rule 15 in
        miniature, and it is corrected here rather than by making the list shorter.

        **Three of the nine are facts projected** from other contexts: `catalog` keeps them up to
        date by event, it asks nobody for them.
      properties:
        id:
          type: string
          x-arthome-vocabulary:
            [
              title_and_discipline,
              poster,
              description,
              at_least_one_active_price,
              capacity,
              technical_check_passed,
              chat_mode_set,
              chapters_planned,
              moderator_assigned,
            ]
          x-arthome-vocabulary-source: PUBLICATION_CHECKLIST_ITEMS
        satisfied: { type: boolean }
        source:
          type: string
          description: |
            **Which context owns the fact**, served because three of the nine items are **projected**
            rather than held: `catalog` keeps them up to date by event and asks nobody for them. It is
            four of the seven services and not a vocabulary of services — a context that never feeds
            the checklist has no member here, and gaining one would be a new projection rather than a
            new name.
          x-arthome-vocabulary: [catalog, ticketing, streaming, chat]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change."
        blocking:
          type: boolean
          description: |
            "Chapters planned" and "moderator assigned" are **non-blocking warnings**: one must be
            able to publish a date without chapters, and the studio must be able to do it.

    PublicationTransition:
      type: object
      required: [from, to, irreversible]
      description: |
        **The lock bears on the `from > to` pair, not on the state.** The fixtures encode a list of
        **states** and test whether the current state belongs to it; the design encodes **pairs**.
        Those are two semantics, and it is the second one that is right (E5).
      properties:
        from: { type: string }
        to: { type: string }
        irreversible: { type: boolean }
        promiseCode:
          type: [string, "null"]
          description: |
            The **promise committed**, which travels with the refusal and with the confirmation:
            `prices_engaged` for `draft|reserve → scheduled`, `replay_sold` for
            `ended → replay_online`. A code, never the sentence.
          x-arthome-vocabulary: [prices_engaged, replay_sold]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change."

    Publication:
      type: object
      required: [dateId, state, orderRank, version, checklist, offeredTransitions]
      properties:
        dateId: { type: string, format: uuid }
        state:
          type: string
          description: |
            The vocabulary of `catalogue.json`, which is authoritative. `replay_online` says what
            `replay` does not: **the replay is on sale**. The parallel tables in the two studio designs
            are never adopted.
          x-arthome-vocabulary: [draft, reserve, scheduled, technical, live, ended, replay_online]
          x-arthome-vocabulary-source: PUBLICATION_STATES
        orderRank:
          type: integer
          description: |
            **The rank travels with the state.** The event board sorts by state, and the order is the
            machine's, not the alphabet's. Without a served rank, every surface reinvents its own ordering
            table.
        version:
          type: integer
          description: |
            The studio is **multi-operator without a lock**: the arbitration is on the server. Every
            transition carries `expectedVersion`, and a command sent from `technical` while the current
            state is `live` is refused with `STATE_CONFLICT` **with the current state and version**.
        publishedAt: { type: [string, "null"], format: date-time }
        pricesLockedAt: { type: [string, "null"], format: date-time }
        replayOnlineAt: { type: [string, "null"], format: date-time }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/PublicationChecklistItem" }
        offeredTransitions:
          type: array
          description: |
            **Computed for this operator**, served with the state. Only the owner and production move a
            date; a control room sees the record and does not move it. Without this list, every surface
            recomputes the table — hence a second implementation of the rule, hence a guaranteed
            divergence.
          items: { $ref: "#/components/schemas/PublicationTransition" }
        lastActor: { $ref: "#/components/schemas/Actor" }

    DateSheet:
      type: object
      required: [dateId, publication, openPanes]
      description: |
        **Served pane by pane, not served whole and cut up at render time.** A moderator must be able
        to load the `chat` pane **without** loading the whole record, otherwise ticketing travels for
        nothing. One call for the record, then one call per open pane, at its owner.
      properties:
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        venueClock:
          type: object
          properties:
            venueTimezone: { type: string }
            venueUtcOffsetMin: { type: integer }
        runtimeMin: { type: integer }
        outcome:
          { type: [string, "null"], x-arthome-vocabulary: [postponed, cancelled, interrupted], x-arthome-vocabulary-source: DATE_OUTCOMES }
        displayState:
          type: string
          description: The composed value, served. Never recomposed by the surface.
          x-arthome-vocabulary:
            [draft, reserve, scheduled, technical, room_open, live, replay, ended,
             postponed, cancelled, interrupted]
          x-arthome-vocabulary-source: DISPLAY_STATES
        displayStateValidUntil: { type: string, format: date-time }
        publication: { $ref: "#/components/schemas/Publication" }
        openPanes:
          type: array
          description: The panes open **to this person**. The overview appears only beyond three panes.
          items: { type: string, x-arthome-vocabulary: [public, tickets, chat, tech, crew, replay], x-arthome-vocabulary-source: DATE_PANES }

    EventsRow:
      type: object
      required: [dateId, title, startsAt, state, orderRank]
      description: |
        A row of the event board. **Role projection decides what it contains**: `grossRevenue` is
        **absent** — not null — for a role without `canRevenue`, and a sort on that key is then
        **refused**.
      properties:
        dateId: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        state:
          {
            type: string,
            x-arthome-vocabulary:
              [draft, reserve, scheduled, technical, live, ended, replay_online], x-arthome-vocabulary-source: PUBLICATION_STATES,
          }
        orderRank: { type: integer }
        outcome: { type: [string, "null"] }
        displayState:
          type: string
          description: |
            **The composed value, served to the studio as to the storefront.** It is here that it counts
            most: the storefront has one axis to display, the studio has **three to reconcile** —
            `publication.state`, `run.state` and `outcome` — and the outcome labels **replace** the state
            (`CANCELLED AND REFUNDED`, `POSTPONED · SEATS STILL VALID`, `INTERRUPTED · CREDITS ISSUED`).
            Serving `state + orderRank + outcome` and letting the client compose was the second
            implementation that critical rule 2 forbids — on the surface where a mistake is not a
            mislabelled card but a control room on the wrong screen.
          x-arthome-vocabulary:
            [draft, reserve, scheduled, technical, room_open, live, replay, ended,
             postponed, cancelled, interrupted]
          x-arthome-vocabulary-source: DISPLAY_STATES
          examples: [live]
        displayStateValidUntil: { type: string, format: date-time }
        lowestPrice:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: inclusive
        fillRateBps: { type: [integer, "null"] }
        seatsSold: { type: [integer, "null"] }
        capacityTotal:
          type: [integer, "null"]
          description: |
            **The "next date" card displays "N / M seats"**, and `seatsSold` + `fillRateBps` did not
            give the M. A client deriving it (`seatsSold / fillRateBps`) would recompute a value the
            server already holds, with a division and a rounding thrown in. A field, not a route.
        grossRevenue:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: inclusive
          description: "**Absent** from the response when the role lacks `canRevenue`. Never present and null."

    Duty:
      type: object
      required: [dateId, channelId, crewRole, startsAt]
      description: |
        A duty. `person_duties` is held by `identity` and carries **all channels together**: a stage
        manager can be on duty for two live shows the same evening, and the banner flags the
        **overlap**.
      properties:
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        channelName: { type: string }
        title: { type: string }
        crewRole: { type: string, x-arthome-vocabulary: [director, video, sound, moderation], x-arthome-vocabulary-source: CREW_ROLES }
        startsAt: { type: string, format: date-time }
        venueClock:
          type: object
          description: |
            **The room's timezone, on the duty itself.** The duties screen is this surface's home
            screen, and for each row it displays the person's time **and** the room's time — "the
            viewer's time first, the room's time second when it differs". Without this block, rendering
            it took one call per duty: exactly the N+1 the bootstrap exists to kill, on the one screen a
            stage manager opens on arriving at a venue.
          properties:
            venueTimezone: { type: string, examples: ["Europe/Paris"] }
            venueUtcOffsetMin: { type: integer, examples: [120] }
        runtimeMin:
          type: [integer, "null"]
          description: The announced duration, the one the row displays.
        displayState:
          type: string
          x-arthome-vocabulary:
            [draft, reserve, scheduled, technical, room_open, live, replay, ended,
             postponed, cancelled, interrupted]
          x-arthome-vocabulary-source: DISPLAY_STATES
        runState:
          {
            type: [string, "null"],
            x-arthome-vocabulary: [idle, rehearsal, on_air, interrupted, ended], x-arthome-vocabulary-source: RUN_STATES,
          }
        overlapsWith:
          type: array
          description: "**Served**, never computed by the surface: `overlapsWith` lives in `@arthome/core`."
          items: { type: string, format: uuid }
        accessExpiresAt: { type: [string, "null"], format: date-time }

    # ------------------------------------------------------------ ticketing

    DateSalesPane:
      type: object
      required: [dateId, capacityTotal, seatsAvailable, priceTiers, pricesLocked]
      description: |
        The `tickets` pane. Capacity **widens in tiers and never shrinks** once the sale has opened;
        prices **lock when the sale opens**, the schedule **when it goes on air**. "Apply to the
        series" **excludes prices and capacity**: each date commits its own buyers.
      properties:
        dateId: { type: string, format: uuid }
        capacityTotal: { type: integer }
        capacityTiers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              capacity: { type: integer }
              openedAt: { type: [string, "null"], format: date-time }
        seatsAvailable: { type: integer }
        seatsSold: { type: integer }
        waitlistCount: { type: integer }
        fillRateBps: { type: integer }
        priceTiers:
          type: array
          items:
            type: object
            required: [tier, amount, active]
            properties:
              tier: { type: string, x-arthome-vocabulary: [full, reduced, support], x-arthome-vocabulary-source: PRICE_TIERS }
              amount:
                $ref: "#/components/schemas/Money"
                x-arthome-tax-basis: inherited
              active: { type: boolean }
        promotions:
          type: array
          items:
            type: object
            properties:
              reason:
                {
                  type: string,
                  x-arthome-vocabulary:
                    [pre_sale, preview_night, discovery_rate, final_date, late_rate], x-arthome-vocabulary-source: PROMOTION_REASONS,
                }
              struckPrice:
                $ref: "#/components/schemas/Money"
                x-arthome-tax-basis: inclusive
              currentPrice:
                $ref: "#/components/schemas/Money"
                x-arthome-tax-basis: inclusive
              validFrom: { type: string, format: date-time }
              validUntil: { type: string, format: date-time }
        serviceFeePerSeat:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: inclusive
          description: "**Per seat**, and the scale is served, never a screen constant."
        pricesLocked: { type: boolean }
        replayUnitPrice:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: inclusive
        complimentaries:
          type: array
          items:
            type: object
            properties:
              categoryId: { type: string }
              issued: { type: integer }
              allocated: { type: integer }
        technicalProvision:
          type: object
          description: |
            Beyond **10,000 seats**, the infrastructure is provisioned in advance; a forecast far above
            the real figure exposes you to a **penalty**; revisable up to **72 h** beforehand.
            **Threshold, provision, deadline and exposure are contract data**, not constants copied out
            across five surfaces.
          properties:
            required: { type: boolean }
            threshold: { type: integer }
            revisableUntil: { type: [string, "null"], format: date-time }
            malusExposure:
              $ref: "#/components/schemas/Money"
              x-arthome-tax-basis: inherited
        grossRevenue:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: inclusive
          description: "**Absent** when the role lacks `canRevenue`."
        version: { type: integer }

    # ----------------------------------------------------------- the run

    HealthSample:
      type: object
      required: [measuredAt, source]
      description: |
        **Every metric is nullable, and the absence means something.** Jitter and lost packets
        **exist only on a WebRTC ingest**; over RTMP, carried on TCP, they have no meaning, and the
        contract **omits** them rather than serving zero. A zero reads as "perfect", not as "not
        measured".

        `measuredAt` is the instant of measurement **at the ingest**, not on reception: it is what
        lets you display "bitrate 8.9 Mb/s, measured 3 s ago" or "last measurement 2 min ago" instead
        of "0 Mb/s", which is a lie.
      properties:
        measuredAt: { type: string, format: date-time }
        source:
          type: string
          description: |
            `client_submitted` for the end-to-end latency, measured in the control room by
            `RTCPeerConnection.getStats()` on the WHEP return path and **submitted** — never a native
            figure presented as end-to-end. If it is not measured, it is **absent**.
          x-arthome-vocabulary: [ingest_server, client_submitted]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change."
        ingestUpKbps:
          type: [integer, "null"]
          description: |
            A **server-side** observation. Never to be confused with `deviceUpKbps`, which measures the
            phone's uplink and not the encoder: **two different bitrates never carry the same name**. Only
            the first feeds the pre-flight checklist.
        deviceUpKbps: { type: [integer, "null"] }
        latencyMs: { type: [integer, "null"] }
        droppedPct: { type: [number, "null"] }
        jitterMs:
          {
            type: [integer, "null"],
            description: "**Omitted** over RTMP — there is no sense in serving it.",
          }
        lostPackets: { type: [integer, "null"], description: "**Omitted** over RTMP." }
        viewers:
          type: [integer, "null"]
          description: "**Absent — never zero — when the date is not on air.**"

    RunConsole:
      type: object
      required: [dateId, state, ingestProtocol, monitorPath, afterGracePeriod]
      description: |
        The state of the run, served in **one** call. The studio distinguishes **"hiccup absorbed"**
        from **"publisher gone"** — two fields, not one: a two-second network break in a room must
        produce neither an incident in the control room nor an HLS manifest restarted from zero.
      properties:
        dateId: { type: string, format: uuid }
        state:
          type: string
          description: |
            The **technical** axis, and nothing else. `postponed` and `cancelled` are **withdrawn** from
            it: they were echoes of the outcome lodged in the technical state. A control room has no
            "cancelled" state — it has a stage sending nothing.
          x-arthome-vocabulary: [idle, rehearsal, on_air, interrupted, ended]
          x-arthome-vocabulary-source: RUN_STATES
        afterGracePeriod: { type: boolean }
        ingestProtocol:
          type: string
          description: "**Decides which metrics are actually available.**"
          x-arthome-vocabulary: [rtmps, srt, whip]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared."
        monitorPath:
          type: string
          description: |
            The return path **actually open**. WHEP under a second on a WHIP ingest, LL-HLS at a few
            seconds on an RTMP ingest. **The studio must know it so as not to promise the operator a
            latency it does not have** — the contract carries the truth, not uniformity. On the native
            shell, `whep` is not promised at tier 5 (D-019).
          x-arthome-vocabulary: [whep, ll_hls]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared."
        monitorUrl: { type: [string, "null"], format: uri }
        qualityLadder:
          type: array
          items:
            type: object
            properties:
              renditionId: { type: string }
              heightPx: { type: integer }
              enabled: { type: boolean }
        cameras: { type: array, items: { type: string } }
        startedAt: { type: [string, "null"], format: date-time }
        lastSample: { $ref: "#/components/schemas/HealthSample" }
        incident: { $ref: "#/components/schemas/StudioIncident" }
        chapters:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              vocabId: { type: string }
              atMediaSec: { type: integer }
        presence:
          type: array
          description: |
            **Who is online on this channel, with their roles and their last activity.** It is the
            **snapshot** of what the `channel:{id}` room pushes every ~10 s, and a room that
            broadcasts a differential without exposing a snapshot is not a contract: a console
            opened at 21:40 had nothing to paint and stayed that way until the next change.

            It is **not cosmetic**. The cut confirmation reads "cutting ends the broadcast for N
            viewers · **M other people online**", and that sentence is the guard rail on the most
            destructive act in the run desk, **in a studio deliberately without a lock**. Unserved,
            the guard rail reads "0 other people online" — the same screen as "you are alone", and
            false.

            Composed by the BFF from `identity.GetChannelPresence`, which `context-map.md` §10.1
            already counts among the run desk's three internal calls. Fan-out 2 for this operation,
            under the threshold of 4.
          items: { $ref: "#/components/schemas/CrewPresence" }
        chatThroughputPerMinute:
          type: [integer, "null"]
          description: |
            **Measured by the server, in a declared unit**: a 60 s sliding window, unit
            messages/minute, refreshed every 5 s. The console's switching threshold (60 msg/min) reads
            against **that measurement** — not against "number of messages ÷ hours elapsed", which is not
            the same thing.
        grossRevenue:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: inclusive
          description: "**Absent** without `canRevenue`. The `:revenue` real-time room is separate for the same reason."
        version: { type: integer }

    CrewPresence:
      type: object
      required: [personId, displayName, roles, lastActivityAt, isSelf]
      description: |
        A crew member online **on the channel**. The scope is the channel, not the date: presence
        follows the person, and the run desk is simply where it is read.
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        roles:
          type: array
          description: |
            **A set**, as everywhere else in this document: the eight canonical values, never the
            fallback to six. Presence is read next to a cut button, and `director` there is not
            `video`.
          items:
            type: string
            x-arthome-vocabulary:
              [artist, production, coordination, director, video, sound, moderation, treasury]
            x-arthome-vocabulary-source: MEMBER_ROLES
        lastActivityAt:
          type: string
          format: date-time
          description: |
            **An instant, never "active 2 min ago".** The sentence belongs to the surface and is
            computed against `servedAt`; the contract carries the instant, like every other
            countdown here.
        isSelf:
          type: boolean
          description: |
            **Served, because the sentence the screen shows says "M OTHER people online".** The
            surface holds its own `personId` from the bootstrap and could subtract itself — and two
            surfaces subtracting differently is exactly how a guard rail ends up off by one on the
            one screen where it guards a cut.

    HealthSeries:
      type: object
      required: [windowSec, samples]
      description: |
        **The snapshot behind the differential.** `RunConsole.lastSample` is one point; this is the
        curve, over a window the server declares having applied.

        `peakViewers` and `peakViewersAt` are **served**: they are derived from the series and are
        therefore obtainable only through it, and the cut confirmation quotes the peak. Derived on
        two surfaces, they would be the same value computed twice — critical rule 2.
      properties:
        windowSec:
          type: integer
          description: |
            **The window actually applied**, not the one asked for. A request beyond the cap is not
            refused, it is answered with the truth about what it got: a cap a caller cannot see is a
            cap a caller will fight.
        samples:
          type: array
          description: |
            Oldest first. An empty array is a **served case** — the live show has not started, or no
            sample has arrived yet — and it is not the same thing as a flat curve at zero.
          items: { $ref: "#/components/schemas/HealthSample" }
        peakViewers:
          type: [integer, "null"]
          description: |
            **Null when no sample in the window carried a viewer count** — never zero, because a zero
            reads as "nobody watched" and that is a different statement.
        peakViewersAt: { type: [string, "null"], format: date-time }

    StudioIncident:
      type: [object, "null"]
      required: [id, kind, cause, trigger, raisedAt]
      description: |
        **Cause and outcome are two vocabularies**, and conflating them was the original fault:
        `catalogue.incidentMessages` carries only four entries, **which are outcomes**.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: The **outcome** the viewer sees.
          x-arthome-vocabulary: [hold_screen, postponed, cancelled, interrupted]
          x-arthome-vocabulary-source: INCIDENT_KINDS
        cause:
          type: string
          description: |
            The **cause**, a distinct vocabulary. `compatibility_worker_failed` exists because a
            transcoding *worker* must never die silently — otherwise the control room sees a player that
            never starts, with no cause.
          x-arthome-vocabulary:
            [
              venue_feed_lost,
              run_desk_disconnected,
              bitrate_collapsed,
              compatibility_worker_failed,
              provider_error,
              manual,
            ]
          x-arthome-vocabulary-source: INCIDENT_CAUSES
        trigger:
          type: string
          description: |
            The **automatic** holding screen produces an incident **of the same kind** as a manual
            trigger — that is the right answer to the "the stage manager is unreachable" case. The log
            must nonetheless tell the two apart.
          x-arthome-vocabulary: [manual, auto]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change."
        message:
          $ref: "#/components/schemas/LocalizedText"
          description: |
            Written by the control room: **content**, with its authoring language. The catalogue supplies
            **templates** per kind of incident, which the control room reuses or replaces.
        raisedAt: { type: string, format: date-time }
        raisedBy: { $ref: "#/components/schemas/Actor" }

    StreamKeyReveal:
      type: object
      required: [streamKey, ingestUrl, revealedAt]
      description: |
        **A secret displayed on a phone, in a room, often in front of a contractor.** Four
        guarantees: the key is **never** in a list payload; revealing it is a **separate command,
        audited and by name**; rotating it is immediate and the old one **stops broadcasting at
        once**; the response carries `Cache-Control: no-store`, so that it ends up neither in the
        phone's HTTP cache nor in the application snapshot the OS takes when it goes to the
        background.

        Assignment to the `director` slot — **which grants access to the key** — is reserved to
        `artist ∨ production`, and the contract makes that reason explicit rather than leaving it to
        be guessed.
      properties:
        streamKey: { type: string }
        ingestUrl: { type: string, format: uri }
        revealedAt: { type: string, format: date-time }

    # ---------------------------------------------------------- moderation

    ModerationItem:
      type: object
      required: [id, messageId, dateId, state, reportsCount, atMediaSec, version]
      description: |
        **Three axes, never stacked.** `state` is the nature of the **queue row** — which is why the
        queue was built by filtering `state === 'reported'`, which is not a state filter but a nature
        filter. The **message's** state and the sanction on the **person** are two other axes, carried
        elsewhere.
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        state: { type: string, x-arthome-vocabulary: [reported, claimed, settled], x-arthome-vocabulary-source: MODERATION_ITEM_STATES }
        reason:
          { type: string, x-arthome-vocabulary: [spam, insult, spoiler, off_topic, harassment], x-arthome-vocabulary-source: MODERATION_REASONS }
        reportsCount: { type: integer }
        atMediaSec: { type: integer }
        sentAt: { type: string, format: date-time }
        authorHandle: { type: string }
        authorSanction: { type: string, x-arthome-vocabulary: [none, muted, banned], x-arthome-vocabulary-source: AUDIENCE_SANCTIONS }
        body: { $ref: "#/components/schemas/LocalizedText" }
        claimedBy: { $ref: "#/components/schemas/Actor" }
        claimExpiresAt:
          type: [string, "null"]
          format: date-time
          description: |
            **A short lease**, renewed while the person is present, **released by the server** on
            expiry. Without it, a moderator who closes their browser freezes a row for the whole live
            show.
        verdict: { type: [string, "null"], x-arthome-vocabulary: [publish, remove, mute, ban], x-arthome-vocabulary-source: MODERATION_VERDICTS }
        settledBy: { $ref: "#/components/schemas/Actor" }
        settledAt: { type: [string, "null"], format: date-time }
        origin:
          type: string
          description: |
            The log must tell an **automatic reclassification** from a **human decision**.
            `retroactive_filter` marks the items produced by adding a word to the dictionary.

            **`automatic_filter` and `retroactive_filter` are two moments, not two names.**
            `automatic_filter` decides **at ingestion**, before anything is published;
            `retroactive_filter` **reclassifies what already exists**, when a word enters the
            dictionary. Collapsing them would lose the only distinction that makes the filter
            measurable.

            **Nothing produces `automatic_filter` today, and writing it now is the point.** It
            carries three constraints that are cheap today and unrecoverable later: an automatic
            moderator **takes no lease**, because there is nobody to hold one; precedence is
            **one-way**, a human overturns a machine and never the reverse; and the origin
            **survives the settlement**, so "removed by the filter, confirmed by X" does not collapse
            into "removed by X" — which is what it takes to measure how often the filter is right.
          x-arthome-vocabulary:
            [human_verdict, automatic_filter, retroactive_filter, author_sanctioned]
          x-arthome-vocabulary-source: STATE_CHANGE_ORIGINS
        version:
          type: integer
          description: |
            **Carries the lease, and nothing else.** A claim followed by a release increments it twice
            **without anything having been settled**.
        decisionVersion:
          type: integer
          description: |
            **Incremented only by a verdict.** It is on that axis that `settleModerationItem` sets its
            condition, and the reason is a design rule, not a convenience: "taking charge is not deciding
            — **as long as your colleague has rendered no verdict, your sanction applies**". A verdict
            must therefore be **accepted** while someone else holds the lease.

            With a single counter that was impossible: taking then releasing a lease moved the version
            from 1 to 3, and a verdict queued offline at `expectedVersion: 1` was refused **although
            nobody had settled anything** — in a live show at sixty messages a minute, rows change hands
            constantly, and the offline queue is the one concession granted to mobile. One counter cannot
            express "refuse if settled, accept if merely claimed".

            It is the doctrine of the three axes that the contract already applies to moderation, applied
            to the lock itself.

    AudienceMember:
      type: object
      required: [id, handle, sanction, messagesCount, present]
      description: |
        **A channel's audience is a collection queryable in its own right**, not a projection of the
        chat: the console looks for "a viewer present, **who has not written**".
      properties:
        id: { type: string, format: uuid }
        handle: { type: string, examples: ["@marie.j"] }
        sanction: { type: string, x-arthome-vocabulary: [none, muted, banned], x-arthome-vocabulary-source: AUDIENCE_SANCTIONS }
        sanctionExpiresAt:
          type: [string, "null"]
          format: date-time
          description: |
            **An instant, never a label.** "No limit", 1 min, 10 min, 1 h and a free-form duration are a
            single field, computed once. Absent = no limit.
        messagesCount: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        subscriberTier: { type: [string, "null"], x-arthome-vocabulary: [free, pass, premium], x-arthome-vocabulary-source: PLAN_TIERS }
        holdsSeat: { type: boolean }
        present:
          type: boolean
          description: Presence **on the live show in progress**.

    ChatPolicy:
      type: object
      required: [dateId, mode, filterSeverity, slowModeSec, holdersOnly, locked]
      properties:
        dateId: { type: string, format: uuid }
        mode: { type: string, x-arthome-vocabulary: [open, emoji, read_only, 'off'], x-arthome-vocabulary-source: CHAT_MODES }
        filterSeverity:
          type: string
          description: |
            **A single vocabulary.** Two coexisted in the same design file — "lenient/normal/high" in
            channel settings, "low/medium/high" on the moderation page — and neither was in the shared
            sources.
          x-arthome-vocabulary: [low, medium, high]
          x-arthome-vocabulary-source: FILTER_SEVERITIES
        slowModeSec: { type: integer }
        holdersOnly: { type: boolean }
        retroactiveFilter: { type: boolean }
        locked:
          type: boolean
          description: |
            True as soon as publication is committed. **`chat` applies its own lock**, it asks `catalog`
            for nothing: once committed, a live chat can still be **closed**, never opened wider.
        version: { type: integer }

    # ---------------------------------------------------------- team

    ChannelMember:
      type: object
      required: [personId, displayName, roles, isOwner, joinedAt]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: [string, "null"], format: email }
        roles:
          type: array
          description: "**A set.** The eight canonical values, never the fallback to six."
          items:
            {
              type: string,
              x-arthome-vocabulary:
                [artist, production, coordination, director, video, sound, moderation, treasury], x-arthome-vocabulary-source: MEMBER_ROLES,
            }
        isOwner:
          type: boolean
          description: "**Never removable, and their roles never editable.** `transferOwnership` moves the flag."
        joinedAt: { type: string, format: date-time }
        note: { type: [string, "null"] }
        invitationState:
          { type: [string, "null"], x-arthome-vocabulary: [pending, accepted, declined, expired], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A state machine local to this resource. It is the contract's own, not the domain's: the domain owns the facts, this owns how far a request has got." }
        version: { type: integer }

    DateAccessGrant:
      type: object
      required: [grantId, dateId, personId, crewRole, expiresAt]
      description: |
        The **one-off stand-in** — scoped to a date, expiry **served as an instant**, revocable
        **without touching channel membership**. Conflating it with a membership would turn revoking a
        stand-in into expulsion from the channel.
      properties:
        grantId: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        displayName: { type: string }
        crewRole: { type: string, x-arthome-vocabulary: [director, video, sound, moderation], x-arthome-vocabulary-source: CREW_ROLES }
        expiresAt: { type: string, format: date-time }
        grantedBy: { $ref: "#/components/schemas/Actor" }

    # ----------------------------------------------------------- money

    PayoutLine:
      type: object
      required:
        [payoutId, dateId, state, grossTtc, vat, grossHt, commissionRateBps, commission, net, dueAt]
      description: |
        **The breakdown by market is the shape, and it is safe under both tax models**: a
        single-rate model produces a one-line breakdown. A single scalar `vatAmount` would have been
        the only genuinely irreversible choice.

        The model adopted (D-015) is the **commissionaire**: base = the whole ticket, rate = that of
        the viewer's country, liable party = Arthome. **⚠ This is not tax advice** — to be validated
        by an adviser before any real money is taken.

        **Under tax-inclusive pricing (D-056) this breakdown stops being detail and becomes the
        explanation.** The artist's price is what the viewer pays, so `grossTtc` is fixed while the
        VAT inside it varies with the buyer's country — which means **`net` moves for two sales at the
        same advertised price.** A payout response without the per-jurisdiction lines is therefore
        **incomplete rather than merely terse**: the artist sees a number that changed and no reason
        for it, which is `planOf()` falling everyone back to `free` with money attached.

        `grossTtc → vat[] → grossHt → commission → net` is the whole derivation, and every step of it
        is served rather than recomputed.
      properties:
        payoutId: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        state:
          type: string
          description: |
            **Driven by the date's outcome**: `held` while an outcome is open, `refunded` if cancelled,
            `suspended` while a change of bank details awaits its counter-signature.
          x-arthome-vocabulary: [scheduled, held, paid, refunded, suspended]
          x-arthome-vocabulary-source: PAYOUT_STATES
        grossTtc:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: inclusive
          description: |
            **Tax-inclusive: what the viewer paid, and what the artist's price said.** Fixed across
            jurisdictions — it is `vat` and therefore `net` that move beneath it.
        vat:
          type: array
          description: |
            **One line per jurisdiction, and not per billing market.** `marketId` is withdrawn: a market
            is a notion of **price** — which currency you sell in — never a notion of **tax**. The key
            carried three values where the rule asks for thousands: a French viewer and a Belgian viewer
            both pay in the `eur` market, at two different rates, and a breakdown keyed by market cannot
            carry two `eur` lines without the key ceasing to be a key.

            **This is the only irreversible part of the tax chapter.** The model — who is liable, on what
            base — is a **calculation**: it can be redone. The rate applied to the sale and the
            jurisdiction that commands it are **dated facts**: not captured at the instant of the sale,
            they are not expensive to reconstruct, they are **impossible** to reconstruct.
          items:
            type: object
            required: [rateBps, base, amount, jurisdictionCode, jurisdictionLevel, supplyKind]
            properties:
              rateBps:
                type: integer
                description: |
                  Rate in basis points — 550 = 5.5%. **An integer, never a float**: in floating point it ends
                  up producing a one-cent discrepancy. And it is the rate **applied at the moment of the sale,
                  kept on the line** — not the current rate: an invoice is kept for ten years, rates change.
              base:
                $ref: "#/components/schemas/Money"
                x-arthome-tax-basis: exclusive
              amount:
                $ref: "#/components/schemas/Money"
                x-arthome-tax-basis: inherited
              jurisdictionCode:
                type: string
                description: "\"FR\" · \"US-CA-94103\" · \"CH-ZH\". **Precise enough to replay the calculation.**"
                examples: [FR]
              jurisdictionLevel:
                { type: string, x-arthome-vocabulary: [country, state, county, city], x-arthome-vocabulary-source: TAX_JURISDICTION_LEVELS }
              supplyKind:
                type: string
                description: |
                  **The rate depends on the jurisdiction × nature-of-supply pair**, never on a constant per
                  market: the exemption a theatre seat enjoys does not extend to watching it live — a seat and a
                  broadcast live show are not the same supply.
                x-arthome-vocabulary: [live_stream_access, replay_access, subscription, merchandise]
                x-arthome-vocabulary-source: TAX_SUPPLY_KINDS
        grossHt:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: exclusive
        commissionRateBps:
          type: integer
          description: |
            **Served, never re-derived from `commission / gross`** — the design re-derives it and falls
            back to 12% by default when the gross is null. **The commission is on the pre-tax amount**: on
            the tax-inclusive amount, the 12% announced to artists would vary with the buyer's country.
          examples: [1200]
        commission:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: exclusive
        net:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: exclusive
        refunded:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: inherited
        credited:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: inherited
        dueAt:
          type: string
          format: date-time
          description: "**End of the live show + 14 days.** The deadline runs from the end, not from the payment."
        stripeTransferRef: { type: [string, "null"] }
        reconciledAt: { type: [string, "null"], format: date-time }
        discrepancy:
          $ref: "#/components/schemas/Money"
          x-arthome-tax-basis: inherited
          description: "**A period does not close with an unexplained discrepancy.**"
        taxEvidenceConflicts:
          type: integer
          description: |
            The number of orders on this line whose buyer location evidence **contradicted itself**. The
            sale goes through, the line is flagged for review: **hiding the conflict would produce a false
            and silent declaration**, and it is the studio that must be able to see it before the period
            closes.

    BankChangeRequest:
      type: object
      required: [requestId, state, maskedAccountTail, requestedAt, expiresAt]
      description: |
        **An aggregate in its own right, not a field**: two actors, two distinct roles (owner **and**
        treasury), a delay, a trace — **and it suspends the payout in flight** for the duration of the
        signing. A write cannot carry that.
      properties:
        requestId: { type: string, format: uuid }
        state:
          {
            type: string,
            x-arthome-vocabulary: [pending_countersignature, countersigned, rejected, expired], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A state machine local to this resource. It is the contract's own, not the domain's: the domain owns the facts, this owns how far a request has got.",
          }
        maskedAccountTail:
          type: string
          description: "**The last four characters only.** A full IBAN has no business in a log that gets replayed."
          examples: ["4417"]
        requestedBy: { $ref: "#/components/schemas/Actor" }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        countersignedBy: { $ref: "#/components/schemas/Actor" }
        suspendsPayoutIds: { type: array, items: { type: string, format: uuid } }

    ExportJob:
      type: object
      required: [exportId, kind, state, requestedAt]
      description: |
        Over 24 months, an export is an **asynchronous job** (BullMQ **internal to its service**).
        The URL returned is **signed, short-lived, and usable without a session cookie** — an export
        protected by a cookie is undownloadable from the native shell. Proposed lifetime:
        **60 minutes**.
      properties:
        exportId: { type: string, format: uuid }
        kind:
          type: string
          x-arthome-vocabulary:
            [sales_csv, fec, sage, cegid, grouped_invoices, journal, schedule_ics, stats_csv]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A document or export format. It names an accounting tool or a file type, which is the outside world's vocabulary rather than ours."
        state: { type: string, x-arthome-vocabulary: [queued, running, ready, failed, expired], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A state machine local to this resource. It is the contract's own, not the domain's: the domain owns the facts, this owns how far a request has got." }
        requestedAt: { type: string, format: date-time }
        downloadUrl: { type: [string, "null"], format: uri }
        downloadExpiresAt: { type: [string, "null"], format: date-time }

    UploadTicket:
      type: object
      required: [uploadUrl, fields, expiresAt, assetId]
      description: |
        **Upload through a signed upload URL, obtained by a JSON command** — never `multipart` from
        a WebView. Proposed lifetime: **15 minutes**, long enough for a room's 4G, short enough not to
        be an access token in disguise.
      properties:
        assetId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        fields: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string, format: date-time }

    JournalEntry:
      type: object
      required: [id, nature, occurredAt, actor, code, params]
      description: |
        **Names names and places them**, kept for 24 months. An **attempt** to walk back a committed
        price appears in it too: that is in itself a piece of operational information.
      properties:
        id: { type: string, format: uuid }
        nature:
          type: string
          description: |
            **The five axes a studio log is filtered by**, and they are deliberately not the services
            that produced the entries: someone reading a log at midnight asks "what touched the
            money", not "what did `payouts` emit".

            **The abbreviations are a wart and they are named as one.** `mod` and `air` are the only
            shortened members in either contract — everything else spells `moderation` out, including
            the role, the tag and the page. A reader who writes `moderation` here gets nothing back,
            silently, which is the shape this whole document spent a week removing. They are kept for
            now because the filter is a query parameter on a path that already ships in fixtures; they
            should become `moderation` and `on_air` the first time that path changes — or sooner, on
            a second trigger that is likelier to arrive: **`on_air` has to be spelled out the day
            anything compares this field against `RUN_STATES.on_air`**, which is the most probable
            reason anyone touches it at all.

            **And `mod` is worse than inconsistent, it is a collision.** `moderation` survives as a
            bare value in `MEMBER_ROLES` because the field name disambiguates it. Here the field is
            `nature` and the value abbreviates a different concept, so the disambiguation that saved
            the role does not apply to the abbreviation of it.

            **`money` is not ours alone**: `@arthome/core` does not produce it, but the redaction rule
            is keyed to it — `data-model.md:624` and `context-map.md:402` both say the `money` kind is
            absent from the response without `canRevenue`. Renaming that one member would leave two
            domain documents describing a rule keyed to a string that no longer exists, with every
            gate green.
          x-arthome-vocabulary: [air, mod, event, access, money]
          x-arthome-vocabulary-source: none
          x-arthome-vocabulary-reason: "A vocabulary local to this contract: four of the five are endpoint concerns and a vocabulary of query filters does not belong in the domain. The exception is `money`, which @arthome/core does not produce but DOES reason about — data-model.md:624 and context-map.md:402 key the redaction rule to it, so the `money` kind is absent from the response without canRevenue. Renaming that one member silently falsifies two domain documents; the other four are ours alone."
        occurredAt: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Actor" }
        code: { type: string, description: "A **code**, never an authored sentence." }
        params: { type: object, additionalProperties: true }
        dateId: { type: [string, "null"], format: uuid }

    InboxEntry:
      type: object
      required: [id, kind, createdAt, read]
      description: |
        **Routed by role and by channel, server-side**: the application does not filter a common
        queue. And **never an amount if the recipient role lacks `canRevenue`**.
      properties:
        id: { type: string, format: uuid }
        kind:
          {
            type: string,
            x-arthome-vocabulary:
              [invitation, alert, duty, incident, payout, bank_change, reconciliation], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change.",
          }
        channelId: { type: [string, "null"], format: uuid }
        dateId: { type: [string, "null"], format: uuid }
        body:
          $ref: "#/components/schemas/LocalizedText"
          description: The inbox texts are one of the **only two** acknowledged exceptions to "i18n by codes".
        deepLinkCode: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }

