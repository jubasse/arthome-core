                email: { type: string, format: email }
                roles:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [artist, production, coordination, director, video, sound, moderation, treasury] }
                note: { type: [string, 'null'], maxLength: 200 }
            example: { email: yann@example.org, roles: [video], note: 'Renfort captation novembre' }
      responses:
        '201':
          description: Invitation envoyée, en attente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ChannelMember' } }
              example:
                servedAt: '2026-09-21T18:16:00.000Z'
                rightsVersion: 412
                data: { personId: 019928b2-0000-7000-8000-000000000001, displayName: yann@example.org, roles: [video], isOwner: false, joinedAt: '2026-09-21T18:16:00Z', invitationState: pending, version: 1 }
        '403':
          description: '`ROLE_NOT_ASSIGNABLE`, avec les rôles attribuables et l''interlocuteur.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: ROLE_NOT_ASSIGNABLE, nature: refused, params: { assignableRoles: [video, sound], contactRoles: [artist, production] }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:16:00.000Z'

  /v1/invitations/{invitationId}/response:
    post:
      operationId: respondToInvitation
      tags: [crew]
      summary: Accepte ou refuse une invitation.
      description: |
        L'acceptation publie l'appartenance **puis** un incrément de `rightsVersion` — c'est lui
        qui fait entrer la chaîne au sélecteur **sans rechargement**, et qui fait quitter les
        salles temps réel d'une chaîne perdue sans attendre une reconnexion.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accept, decline] }
            example: { decision: accept }
      responses:
        '200':
          description: Réponse enregistrée, avec la nouvelle version des droits.
          headers:
            X-Arthome-Rights-Version: { $ref: '#/components/headers/RightsVersion' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/EffectiveRights' } }
              example:
                servedAt: '2026-09-21T18:17:00.000Z'
                rightsVersion: 413
                data:
                  channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                  channelName: Compagnie Verticale
                  roles: [video]
                  isOwner: false
                  navigation: [events, stream, replays, help]
                  datePanes: [tech]
                  canRevenue: false
                  canOps: false
                  canTech: true
                  canDecideOutcome: false
                  assignableRoles: []
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/channels/{channelId}/members/{personId}:
    patch:
      operationId: changeMemberRoles
      tags: [crew]
      summary: Change l'ensemble de rôles d'un membre.
      description: |
        **Un ensemble, jamais un rôle unique.** Le propriétaire n'est **ni supprimable ni
        modifiable en rôles** : `transferOwnership` déplace le drapeau, et il exige que le
        destinataire soit **déjà membre** et dispose de la double authentification.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles, expectedVersion]
              properties:
                roles:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [artist, production, coordination, director, video, sound, moderation, treasury] }
                expectedVersion: { type: integer }
            example: { roles: [video, sound], expectedVersion: 2 }
      responses:
        '200':
          description: Membre à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ChannelMember' } }
              example:
                servedAt: '2026-09-21T18:18:00.000Z'
                rightsVersion: 412
                data: { personId: 019928b2-0000-7000-8000-000000000001, displayName: 'Yann P.', roles: [video, sound], isOwner: false, joinedAt: '2026-09-21T18:16:00Z', version: 3 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      operationId: removeMember
      tags: [crew]
      summary: Retire un membre de la chaîne.
      description: '**Le propriétaire n''est jamais retirable** : le refus porte `OWNER_NOT_REMOVABLE`.'
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: personId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Membre retiré.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { removed: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:19:00.000Z'
                rightsVersion: 412
                data: { removed: true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/dates/{dateId}/crew:
    post:
      operationId: grantDateAccess
      tags: [crew]
      summary: Affecte un renfort à une date, avec un instant d'expiration.
      description: |
        **Portée une date, expiration servie comme un instant.** « Expire au salut + 1 h » est une
        phrase d'écran ; le contrat porte l'instant. Révocable **sans toucher à l'appartenance à la
        chaîne** — les confondre ferait d'une révocation de renfort une exclusion.

        **L'affectation du créneau `director` donne accès à la clé de flux.** Elle est donc
        réservée à `artist ∨ production`, et le contrat rend **cette raison** explicite plutôt que
        de la laisser deviner.

        **Soixante secondes ne suffisent pas pour un accès qui expire** : le jeton interne porte les
        rôles, mais le service vérifie l'accès **borné dans le temps sur la ressource chargée**.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId, crewRole, expiresAt]
              properties:
                personId: { type: string, format: uuid }
                crewRole: { type: string, enum: [director, video, sound, moderation] }
                expiresAt: { type: string, format: date-time }
            example: { personId: 019928b2-0000-7000-8000-000000000001, crewRole: director, expiresAt: '2026-09-21T21:45:00Z' }
      responses:
        '201':
          description: Accès ponctuel accordé.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/DateAccessGrant' } }
              example:
                servedAt: '2026-09-21T18:20:00.000Z'
                rightsVersion: 412
                data:
                  grantId: 019928b3-0000-7000-8000-000000000001
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  personId: 019928b2-0000-7000-8000-000000000001
                  displayName: 'Yann P.'
                  crewRole: director
                  expiresAt: '2026-09-21T21:45:00Z'
                  grantedBy: { personId: 019928b0-0000-7000-8000-000000000001, displayName: 'Claire D.', surface: studio-web }
        '403':
          description: '`CREW_ROLE_RESERVED` — l''affectation `director` donne accès à la clé de flux.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: CREW_ROLE_RESERVED, nature: refused, params: { crewRole: director, reservedTo: [artist, production], reasonCode: grants_stream_key_access }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:20:00.000Z'

  /v1/date-access-grants/{grantId}:
    delete:
      operationId: revokeDateAccess
      tags: [crew]
      summary: Révoque un accès ponctuel, sans toucher à l'appartenance.
      description: |
        Le serveur fait **quitter les salles temps réel** de cette date sans attendre une
        reconnexion : c'est ce qui évite qu'une personne dont l'accès a expiré au tomber du rideau
        continue à voir une file.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Accès révoqué.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { revoked: { type: boolean } } }
              example:
                servedAt: '2026-09-21T21:46:00.000Z'
                rightsVersion: 413
                data: { revoked: true }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/channels/{channelId}/ownership-transfer:
    post:
      operationId: transferChannelOwnership
      tags: [crew]
      summary: Transfère la propriété de la chaîne — double détente.
      description: |
        **Le destinataire doit être déjà membre et disposer de la double authentification.** Ce
        sont des règles du domaine, pas des gardes d'interface, et le refus est **servi avec son
        motif**. Le compte bancaire (`payouts`) et la page publique (`catalog`) **suivent** le
        transfert, par événement.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toPersonId, reauthToken]
              properties:
                toPersonId: { type: string, format: uuid }
                reauthToken: { type: string }
            example: { toPersonId: 019928b2-0000-7000-8000-000000000001, reauthToken: ott_9f2ac1 }
      responses:
        '202':
          description: Transfert en attente d'acceptation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          state: { type: string }
                          expiresAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:21:00.000Z'
                rightsVersion: 412
                data: { state: pending_acceptance, expiresAt: '2026-09-28T18:21:00Z' }
        '409':
          description: '`TRANSFER_TARGET_INELIGIBLE` — pas membre, ou sans double authentification.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: TRANSFER_TARGET_INELIGIBLE, nature: refused, params: { reasonCode: two_factor_missing }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:21:00.000Z'

  /v1/channels/{channelId}:
    delete:
      operationId: deleteChannel
      tags: [channel]
      summary: Supprime une chaîne.
      description: |
        **Refusée tant qu'il reste une date en vente ou un versement dû.** Ces faits sont **projetés
        et tenus en local** par `identity` (`channel_dues`), jamais demandés en synchrone à
        `ticketing` ou `payouts` : c'est précisément le genre d'appel que « aucun appel synchrone
        entre services » interdit.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauthToken, confirmName]
              properties:
                reauthToken: { type: string }
                confirmName: { type: string }
            example: { reauthToken: ott_9f2ac1, confirmName: Compagnie Verticale }
      responses:
        '200':
          description: Chaîne supprimée.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { deleted: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:22:00.000Z'
                rightsVersion: 413
                data: { deleted: true }
        '409':
          description: '`CHANNEL_HAS_OPEN_OBLIGATIONS`, avec le détail.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: CHANNEL_HAS_OPEN_OBLIGATIONS, nature: refused, params: { datesOnSale: 3, payoutsDue: 1 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:22:00.000Z'

  # =============================================================== argent

  /v1/channels/{channelId}/payouts:
    get:
      operationId: listPayouts
      tags: [payouts]
      summary: Les versements dus, une ligne par date vendue.
      description: |
        **Un solde par devise, jamais un solde converti.** Une chaîne qui vend dans deux devises a
        **deux soldes** : convertir introduirait un taux, donc une date de change, donc un écart de
        réconciliation qu'on ne saurait pas expliquer. Stripe tient un solde par devise ; on le
        reflète, on ne l'agrège pas.

        **Réservé aux rôles avec `canRevenue`** — la page entière, pas seulement ses colonnes.
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: state
          in: query
          schema: { type: string, enum: [scheduled, held, paid, refunded, suspended] }
      responses:
        '200':
          description: Page de lignes de versement, et les soldes **par devise**.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page, balances]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PayoutLine' } }
                      balances:
                        type: array
                        description: '**Un solde par devise.** Jamais agrégés.'
                        items: { $ref: '#/components/schemas/Money' }
                      pendingBankChange: { $ref: '#/components/schemas/BankChangeRequest' }
                      page: { $ref: '#/components/schemas/OffsetPageInfo' }
              example:
                servedAt: '2026-09-21T18:25:00.000Z'
                rightsVersion: 412
                items:
                  - payoutId: 019928e5-0000-7000-8000-000000000001
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                    state: scheduled
                    grossTtc: { amountMinor: 417600, currencyCode: EUR }
                    vat:
                      - { marketId: eur, rateBps: 550, base: { amountMinor: 395830, currencyCode: EUR }, amount: { amountMinor: 21770, currencyCode: EUR } }
                    grossHt: { amountMinor: 395830, currencyCode: EUR }
                    commissionRateBps: 1200
                    commission: { amountMinor: 47500, currencyCode: EUR }
                    net: { amountMinor: 348330, currencyCode: EUR }
                    dueAt: '2026-10-05T21:30:00Z'
                balances: [{ amountMinor: 348330, currencyCode: EUR }]
                page: { page: 1, pageSize: 20, totalItems: 42, totalPages: 3 }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/channels/{channelId}/bank-change-requests:
    post:
      operationId: requestBankChange
      tags: [payouts]
      summary: Demande un changement de coordonnées bancaires — double signature.
      description: |
        **Un agrégat à part entière, pas une écriture.** Deux acteurs, deux rôles distincts
        (propriétaire **et** trésorerie), un délai, une trace — **et il suspend le virement en
        cours** le temps de la signature. Une écriture ne peut pas porter cela.

        Seuls les **quatre derniers caractères** du compte voyagent : un IBAN complet n'a rien à
        faire dans un journal d'événements qui se rejoue.

        **Le retour depuis un navigateur externe ne confirme rien** : l'état d'attente vit **côté
        serveur**, et au retour, « le lien profond dit où aller, le backend dit ce qui a changé ».
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stripeSetupRef, reauthToken]
              properties:
                stripeSetupRef: { type: string, description: Référence **opaque** du parcours hébergé. Aucun identifiant de prestataire ne traverse le domaine. }
                reauthToken: { type: string }
            example: { stripeSetupRef: seti_1Ab2Cd, reauthToken: ott_9f2ac1 }
      responses:
        '202':
          description: Demande créée, virements suspendus jusqu'à contre-signature.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/BankChangeRequest' } }
              example:
                servedAt: '2026-09-21T18:26:00.000Z'
                rightsVersion: 412
                data:
                  requestId: 019928e6-0000-7000-8000-000000000001
                  state: pending_countersignature
                  maskedAccountTail: '4417'
                  requestedBy: { personId: 019928b0-0000-7000-8000-000000000001, displayName: 'Claire D.', surface: studio-web }
                  requestedAt: '2026-09-21T18:26:00Z'
                  expiresAt: '2026-09-28T18:26:00Z'
                  suspendsPayoutIds: [019928e5-0000-7000-8000-000000000001]
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/bank-change-requests/{requestId}/countersign:
    post:
      operationId: countersignBankChange
      tags: [payouts]
      summary: Contre-signe un changement de coordonnées bancaires.
      description: |
        **Deux rôles distincts** : le propriétaire **et** la trésorerie. Une même personne ne peut
        pas signer les deux fois, même si elle tient les deux rôles — `SAME_ACTOR_FORBIDDEN`.
        C'est tout l'objet d'une double signature.
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reauthToken]
              properties:
                decision: { type: string, enum: [countersign, reject] }
                reauthToken: { type: string }
            example: { decision: countersign, reauthToken: ott_4d77e2 }
      responses:
        '200':
          description: Contre-signée, virements repris.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/BankChangeRequest' } }
              example:
                servedAt: '2026-09-21T18:30:00.000Z'
                rightsVersion: 412
                data:
                  requestId: 019928e6-0000-7000-8000-000000000001
                  state: countersigned
                  maskedAccountTail: '4417'
                  requestedAt: '2026-09-21T18:26:00Z'
                  expiresAt: '2026-09-28T18:26:00Z'
                  countersignedBy: { personId: 019928b4-0000-7000-8000-000000000001, displayName: 'Léa M.', surface: studio-web }
        '403':
          description: '`SAME_ACTOR_FORBIDDEN` — une double signature exige deux personnes.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: SAME_ACTOR_FORBIDDEN, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:30:00.000Z'
        '410': { $ref: '#/components/responses/Gone' }

  /v1/channels/{channelId}/reconciliation-periods/{periodId}/close:
    post:
      operationId: closeReconciliationPeriod
      tags: [payouts]
      summary: Clôt une période de rapprochement.
      description: |
        **Une période ne se clôt pas avec un écart non expliqué.** Le refus porte l'écart et les
        lignes concernées. On ne reconstruit jamais le grand livre du prestataire : on
        **réconcilie** le nôtre avec lui, et tout écart route une alerte vers `treasury`.
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - name: periodId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                explanations:
                  type: array
                  items:
                    type: object
                    properties:
                      payoutId: { type: string, format: uuid }
                      note: { type: string }
            example: { explanations: [] }
      responses:
        '200':
          description: Période close.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          periodId: { type: string }
                          closedAt: { type: string, format: date-time }
              example:
                servedAt: '2026-10-01T09:00:00.000Z'
                rightsVersion: 412
                data: { periodId: '2026-09', closedAt: '2026-10-01T09:00:00Z' }
        '409':
          description: '`RECONCILIATION_DISCREPANCY_UNEXPLAINED`, avec l''écart et les lignes.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: RECONCILIATION_DISCREPANCY_UNEXPLAINED
                  nature: refused
                  params: { discrepancyMinor: -1240, currencyCode: EUR, payoutIds: [019928e5-0000-7000-8000-000000000001] }
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-10-01T09:00:00.000Z'

  /v1/seats/{seatId}/refund:
    post:
      operationId: refundSeat
      tags: [ticketing]
      summary: Rembourse une place depuis le studio.
      description: |
        **Le remboursement rembourse aussi la commission** : nous ne gardons pas 12 % d'un
        spectacle qui n'a pas eu lieu. Ce n'est pas seulement décent, c'est ce que la copie promet.

        **Jamais mise en file hors ligne** : c'est une commande d'argent, elle se refuse
        localement avec `offline_forbidden`.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - name: seatId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: { type: string, enum: [goodwill, date_cancelled, duplicate, dispute] }
                partialAmountMinor: { type: [integer, 'null'], minimum: 1 }
            example: { reasonCode: goodwill }
      responses:
        '200':
          description: Remboursement enregistré, avec son effet sur le versement.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          refunded: { $ref: '#/components/schemas/Money' }
                          commissionRefunded: { $ref: '#/components/schemas/Money' }
                          payoutId: { type: [string, 'null'], format: uuid }
              example:
                servedAt: '2026-09-21T18:35:00.000Z'
                rightsVersion: 412
                data:
                  refunded: { amountMinor: 2400, currencyCode: EUR }
                  commissionRefunded: { amountMinor: 273, currencyCode: EUR }
                  payoutId: 019928e5-0000-7000-8000-000000000001
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/dates/{dateId}/complimentaries:
    post:
      operationId: issueComplimentary
      tags: [ticketing]
      summary: Émet des contremarques, par catégorie.
      description: |
        Les contremarques **par catégorie** sont l'une des six formes que les sources ne portaient
        pas. Elles entrent au contrat `ticketing` au palier 3, **marquées provisoires**.
      x-arthome-maturity: provisional
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, quantity]
              properties:
                categoryId: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 100 }
                note: { type: [string, 'null'] }
            example: { categoryId: press, quantity: 4, note: 'Invitations presse' }
      responses:
        '201':
          description: Contremarques émises.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          seatCodes: { type: array, items: { type: string } }
                          sales: { $ref: '#/components/schemas/DateSalesPane' }
              example:
                servedAt: '2026-09-21T18:36:00.000Z'
                rightsVersion: 412
                data:
                  seatCodes: [ATH-2P4K-8M, ATH-9L1D-3X]
                  sales: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, capacityTotal: 200, seatsAvailable: 24, priceTiers: [], pricesLocked: true, version: 14 }
        '409': { $ref: '#/components/responses/Conflict' }

  # =============================================================== chaîne

  /v1/channels/{channelId}/journal:
    get:
      operationId: listChannelJournal
      tags: [channel]
      summary: Le journal — page + total, **filtre de période obligatoire**.
      description: |
        **Le journal reste en page + total** (D-010), avec **filtre de période obligatoire**.
        Personne ne pagine jusqu'au 50 000ᵉ élément d'un journal de 24 mois : on filtre par période
        d'abord, ce qui garde les numéros de page — l'affordance voulue — et reste rapide. Passer
        au curseur échangerait un problème qu'on n'a pas contre la perte de ce qu'on voulait.

        `from` et `to` sont **requis**, et une plage trop large est refusée par
        `PERIOD_FILTER_REQUIRED` avec la plage maximale en paramètre.

        Il est **nominatif et situé**, conservé 24 mois. Les **tentatives** de marche arrière sur
        une transition engagée y figurent : c'est en soi une information de conduite.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity, catalog, chat, streaming, payouts]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: nature
          in: query
          schema: { type: string, enum: [air, mod, event, access, money] }
        - name: dateId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Page de journal, **projetée selon le rôle** — la nature `money` est absente sans `canRevenue`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/JournalEntry' } }
                      page: { $ref: '#/components/schemas/OffsetPageInfo' }
              example:
                servedAt: '2026-09-21T18:38:00.000Z'
                rightsVersion: 412
                items:
                  - id: 019928e7-0000-7000-8000-000000000001
                    nature: event
                    occurredAt: '2026-09-21T18:04:00Z'
                    actor: { personId: 019928b0-0000-7000-8000-000000000001, displayName: 'Claire D.', surface: studio-web }
                    code: publication.transition.applied
                    params: { from: reserve, to: scheduled }
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                page: { page: 1, pageSize: 20, totalItems: 812, totalPages: 41 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/channels/{channelId}/exports:
    post:
      operationId: requestChannelExport
      tags: [payouts]
      summary: Demande un export — journal des ventes, FEC, Sage, Cegid, factures groupées.
      description: |
        **Un travail asynchrone** (BullMQ **interne à son service**), jamais un téléchargement
        synchrone : sur 24 mois ce n'est pas tenable. L'adresse rendue est **signée, de courte
        durée, et utilisable sans cookie de session** — un export protégé par cookie est
        intéléchargeable depuis la coquille native.
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts, catalog, chat]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, from, to]
              properties:
                kind: { type: string, enum: [sales_csv, fec, sage, cegid, grouped_invoices, journal, schedule_ics, stats_csv] }
                from: { type: string, format: date }
                to: { type: string, format: date }
            example: { kind: fec, from: '2026-09-01', to: '2026-09-30' }
      responses:
        '202':
          description: Export mis en file.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ExportJob' } }
              example:
                servedAt: '2026-09-21T18:39:00.000Z'
                rightsVersion: 412
                data: { exportId: 019928e8-0000-7000-8000-000000000001, kind: fec, state: queued, requestedAt: '2026-09-21T18:39:00Z' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/exports/{exportId}:
    get:
      operationId: getChannelExport
      tags: [payouts]
      summary: L'état d'un export, et son adresse signée quand il est prêt.
      description: 'Tant qu''il n''est pas `ready`, `downloadUrl` est nul : le contrat ne sert jamais une adresse qui ne répondrait pas.'
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: L'état de l'export.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ExportJob' } }
              example:
                servedAt: '2026-09-21T18:44:00.000Z'
                rightsVersion: 412
                data:
                  exportId: 019928e8-0000-7000-8000-000000000001
                  kind: fec
                  state: ready
                  requestedAt: '2026-09-21T18:39:00Z'
                  downloadUrl: 'https://files.arthome.fr/exports/019928e8?sig=abc'
                  downloadExpiresAt: '2026-09-21T19:44:00Z'
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/uploads:
    post:
      operationId: createUploadTicket
      tags: [channel]
      summary: Obtient une adresse de dépôt signée pour un binaire.
      description: |
        **Jamais de `multipart` depuis un WebView.** Une commande JSON rend une adresse de dépôt
        signée, valable **15 minutes** — assez pour une 4G de salle, assez court pour ne pas être
        un jeton d'accès déguisé.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, contentType, sizeBytes]
              properties:
                purpose: { type: string, enum: [poster, wide, avatar, merch_image] }
                contentType: { type: string, enum: ['image/jpeg', 'image/png', 'image/webp'] }
                sizeBytes: { type: integer, minimum: 1, maximum: 20971520 }
            example: { purpose: poster, contentType: 'image/jpeg', sizeBytes: 842000 }
      responses:
        '201':
          description: Adresse de dépôt signée.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/UploadTicket' } }
              example:
                servedAt: '2026-09-21T18:45:00.000Z'
                rightsVersion: 412
                data:
                  assetId: 019928e9-0000-7000-8000-000000000001
                  uploadUrl: 'https://uploads.arthome.fr/putt/019928e9'
                  fields: { policy: eyJ..., signature: abc }
                  expiresAt: '2026-09-21T19:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/channels/{channelId}/merch-items:
    get:
      operationId: listChannelMerchItems
      tags: [channel]
      summary: Le catalogue boutique de la chaîne.
      description: '**Non paginé** — des dizaines d''articles. Une seule intégration externe à la fois par chaîne.'
      x-arthome-maturity: provisional
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Les articles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/MerchItemAdmin' } }
              example:
                servedAt: '2026-09-21T18:46:00.000Z'
                rightsVersion: 412
                items:
                  - id: 019928a0-7d31-7a10-b8c4-2f9e11a4d001
                    label: { contentLanguage: fr, text: 'T-shirt Nuit blanche' }
                    variants: [{ id: M, label: M, stock: 24, price: { amountMinor: 2500, currencyCode: EUR } }]
                    state: on_sale
                    source: arthome
                    version: 3
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: upsertMerchItem
      tags: [channel]
      summary: Crée ou met à jour un article de boutique.
      description: |
        **Un article sans variante n'est pas vendable.** Le libellé est **bilingue** ; l'absence de
        libellé anglais dans les sources est une **lacune de donnée** à combler au portage, pas une
        lacune de traduction.
      x-arthome-maturity: provisional
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, labels, variants]
              properties:
                itemId: { type: string, format: uuid }
                showId: { type: [string, 'null'], format: uuid }
                labels:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [contentLanguage, text]
                    properties:
                      contentLanguage: { type: string }
                      text: { type: string }
                variants:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, label, stock, priceMinor, currencyCode]
                    properties:
                      id: { type: string }
                      label: { type: string }
                      stock: { type: integer, minimum: 0 }
                      priceMinor: { type: integer, minimum: 0 }
                      currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
                expectedVersion: { type: [integer, 'null'] }
            example:
              itemId: 019928a0-7d31-7a10-b8c4-2f9e11a4d001
              labels: [{ contentLanguage: fr, text: 'T-shirt Nuit blanche' }, { contentLanguage: en, text: 'Nuit blanche tee' }]
              variants: [{ id: M, label: M, stock: 24, priceMinor: 2500, currencyCode: EUR }]
              expectedVersion: 3
      responses:
        '200':
          description: Article à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/MerchItemAdmin' } }
              example:
                servedAt: '2026-09-21T18:47:00.000Z'
                rightsVersion: 412
                data:
                  id: 019928a0-7d31-7a10-b8c4-2f9e11a4d001
                  label: { contentLanguage: fr, text: 'T-shirt Nuit blanche' }
                  variants: [{ id: M, label: M, stock: 24, price: { amountMinor: 2500, currencyCode: EUR } }]
                  state: on_sale
                  source: arthome
                  version: 4
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/dates/{dateId}/merch-pin:
    put:
      operationId: pinMerchDuringLive
      tags: [channel]
      summary: Épingle un article pendant le direct.
      description: '**Une mise en état** : épingler deux fois le même article ne l''épingle pas deux fois.'
      x-arthome-maturity: provisional
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId: { type: [string, 'null'], format: uuid, description: '`null` retire l''épinglage.' }
            example: { itemId: 019928a0-7d31-7a10-b8c4-2f9e11a4d001 }
      responses:
        '200':
          description: Épinglage à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { pinnedItemId: { type: [string, 'null'], format: uuid } } }
              example:
                servedAt: '2026-09-21T19:40:00.000Z'
                rightsVersion: 412
                data: { pinnedItemId: 019928a0-7d31-7a10-b8c4-2f9e11a4d001 }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dates/{dateId}/replay-window:
    post:
      operationId: reopenReplayWindow
      tags: [channel]
      summary: Rouvre la fenêtre de rediffusion.
      description: |
        Possible **seulement** si la politique n'était pas `none` : la promesse faite avant l'achat
        ne se rouvre pas. La nouvelle expiration est **dérivée** de la fin du direct et de la
        fenêtre servie, jamais posée à la main — sinon la politique de rediffusion finirait encodée
        dans un cycle de vie de stockage, hors de portée des tests.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [additionalHours]
              properties:
                additionalHours: { type: integer, minimum: 1, maximum: 720 }
            example: { additionalHours: 48 }
      responses:
        '200':
          description: Fenêtre rouverte, avec la nouvelle expiration **dérivée**.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expiresAt: { type: string, format: date-time }
                          windowHours: { type: integer }
              example:
                servedAt: '2026-09-22T10:00:00.000Z'
                rightsVersion: 412
                data: { expiresAt: '2026-09-26T21:30:00Z', windowHours: 120 }
        '409':
          description: '`REPLAY_POLICY_FINAL` quand la politique était `none`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: REPLAY_POLICY_FINAL, nature: refused, params: { currentPolicy: none }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-22T10:00:00.000Z'

  /v1/channels/{channelId}/identity:
    patch:
      operationId: updateChannelIdentity
      tags: [channel]
      summary: Modifie la face publique de la chaîne.
      description: |
        **Une écriture `catalog` pure.** La chaîne a deux visages, et le contrat les sépare : la
        chaîne **comme organisation** — membres, rôles, invitations, clé de flux — est de
        l'autorisation, donc `identity` ; la chaîne **comme page publique** — nom, biographie,
        avatar, discipline — est du catalogue, donc `catalog.Artist`, en relation 1:1 par
        `channelId`.

        **Aucune commande du studio ne traverse les deux**, et c'est la preuve que la coupe est
        juste : l'écran Réglages montre deux blocs qui ne se mélangent jamais.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                publicName: { type: string, maxLength: 120 }
                slug: { type: string, pattern: '^[a-z0-9-]{3,80}$' }
                biography:
                  type: array
                  items:
                    type: object
                    required: [contentLanguage, text]
                    properties:
                      contentLanguage: { type: string }
                      text: { type: string, maxLength: 4000 }
                categoryId: { type: string }
                avatarAssetId: { type: [string, 'null'], format: uuid }
            example: { expectedVersion: 5, publicName: Compagnie Verticale, categoryId: dance-contemporary }
      responses:
        '200':
          description: Identité publique à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      version: { type: integer }
                      data: { type: object, additionalProperties: true }
              example:
                servedAt: '2026-09-21T18:50:00.000Z'
                rightsVersion: 412
                version: 6
                data: { publicName: Compagnie Verticale, slug: compagnie-verticale, categoryId: dance-contemporary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/me/preferences:
    patch:
      operationId: updateStudioPreferences
      tags: [bootstrap]
      summary: Écrit une préférence de la personne — fuseau de lecture, disposition de régie.
      description: |
        **Deux réglages suivent la personne, pas la chaîne** : le fuseau de lecture et la
        disposition de régie. Le fuseau est **le même champ** que celui du storefront — même
        compte, un seul porteur.

        **Jamais dans `localStorage`** : il est lié à l'origine, vidable par le système, et ne
        voyage d'aucune façon — or la personne passe du studio web au studio mobile dans la même
        soirée.

        **Additive et tolérante** : une clé inconnue d'une version n'est ni rejetée ni effacée à la
        prochaine écriture, sinon la version mobile en revue de magasin écraserait les réglages
        posés depuis le web.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                readingTimezone: { type: string }
                runDeskLayout: { type: string }
                encodingProfileName: { type: string }
            example: { readingTimezone: Europe/Paris, runDeskLayout: compact }
      responses:
        '200':
          description: Préférences à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
              example:
                servedAt: '2026-09-21T18:51:00.000Z'
                rightsVersion: 412
                data: { readingTimezone: Europe/Paris, runDeskLayout: compact }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: arthome_studio_session
      description: |
        Session opaque, cookie `HttpOnly`/`Secure`/`SameSite=Lax`. C'est la forme de `studio-web`.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        **`studio-mobile` ne peut pas tenir sa session par cookie** : `capacitor://localhost` est
        un contexte tiers sur iOS. Le BFF studio offre donc une session **porteuse de jeton** à
        côté de la session par cookie — jeton de rafraîchissement lié à l'appareil, conservé dans
        le magasin natif (`@capacitor/preferences`, **jamais `localStorage`**), jeton d'accès
        court, révocation par appareil.

        Au retour d'arrière-plan avec jeton expiré : **rafraîchissement silencieux**. Une
        réauthentification en pleine garde est une faute d'exploitation. Elle n'est exigée que
        pour les **opérations sensibles** — révéler ou renouveler une clé de flux, transférer la
        propriété d'une chaîne, changer un moyen de versement — et elle est alors demandée **au
        moment de l'opération**, pas au retour d'écran.

        Origines autorisées côté CORS, en **chaînes littérales** : `capacitor://localhost` et
        `https://localhost`. Une entrée `localhost` nue n'en couvre aucune, `*` est illégal avec
        des requêtes créditées, et un cadre qui normalise l'origine par un analyseur d'URL
        rejetterait `capacitor://`.

  parameters:

    Traceparent:
      name: traceparent
      in: header
      required: false
      description: Contexte de trace W3C, propagé jusqu'au service et injecté dans l'outbox **à l'écriture**.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
        examples: ['00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01']

    Surface:
      name: X-Arthome-Surface
      in: header
      required: true
      description: |
        La surface appelante. Le journal du studio est **nominatif et situé** : « qui a décidé,
        quand, depuis quelle surface ». Un acteur non humain — écran d'attente automatique,
        expiration d'un bail — est un acteur quand même, et porte `system`.
      schema:
        type: string
        enum: [studio-web, studio-mobile]
        examples: [studio-mobile]

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 généré par la surface **avant l'envoi**. La règle compte doublement ici : un réseau
        mobile rejoue, et une personne qui ne voit pas de réponse appuie deux fois. Une clé
        rejouée rend la réponse d'origine, verbatim. Durée de vie 24 h.
      schema: { type: string, format: uuid, examples: ['019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77'] }

    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid, examples: ['019928a0-7d31-7a10-b8c4-2f9e11a4c222'] }

    DateId:
      name: dateId
      in: path
      required: true
      schema: { type: string, format: uuid, examples: ['019928a0-7d31-7a10-b8c4-2f9e11a4c001'] }

    Page:
      name: page
      in: query
      required: false
      description: '**Numéro de page, à partir de 1.** C''est l''affordance voulue : on épingle une page et on l''envoie à un collègue.'
      schema: { type: integer, minimum: 1, default: 1 }

    PageSize:
      name: pageSize
      in: query
      required: false
      description: 'Des pages petites, et c''est délibéré : un pouce ne parcourt pas cent lignes.'
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

    SortBy:
      name: sortBy
      in: query
      required: false
      description: |
        Clé de tri. **Une clé portant sur un champ absent de la projection de ce rôle est
        refusée** avec `SORT_KEY_FORBIDDEN`, jamais ignorée.

        Le tri par **état** suit l'**ordre canonique de la machine à états**, pas l'ordre
        alphabétique : c'est une donnée du domaine, servie avec l'état (`orderRank`), et non une
        table que chaque surface réinventerait.
      schema: { type: string, examples: [startsAt] }

    SortDir:
      name: sortDir
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: asc }

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        **Les deux seules exceptions à « page + total »** : file de modération et tchat en direct.
        Curseur opaque Base64 sur `(created_at, id)`, valide 24 h, `410 CURSOR_TOO_OLD` au-delà.
      schema: { type: string }

    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  headers:

    ServedAt:
      description: Instant serveur de cette réponse. Tout chronomètre de garde s'y réfère, jamais à l'horloge du poste.
      schema: { type: string, format: date-time }

    RightsVersion:
      description: |
        **Porté sur chaque réponse.** Quand il change, la navigation est périmée : le client
        recharge l'amorçage. Il est aussi poussé sur le canal temps réel, et le serveur fait
        quitter les salles d'une chaîne perdue **sans attendre une reconnexion**.
      schema: { type: integer, format: int64 }

    IdempotencyReplayed:
      description: Présent et à `true` quand le corps est la réponse mémorisée d'une tentative antérieure.
      schema: { type: boolean }

  responses:

    BadRequest:
      description: Requête mal formée, ou filtre obligatoire manquant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: PERIOD_FILTER_REQUIRED, nature: refused, params: { maxRangeDays: 92 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    Unauthorized:
      description: Aucune session valide.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: UNAUTHENTICATED, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    Forbidden:
      description: |
        Droit absent, droits périmés, accès révoqué, ou chaîne quittée. Trois codes distincts —
        `FORBIDDEN`, `RIGHTS_VERSION_STALE`, `CHANNEL_ACCESS_REVOKED` — parce que la personne doit
        savoir s'il faut recharger, appeler, ou renoncer.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: RIGHTS_VERSION_STALE, nature: refused, params: { currentRightsVersion: 412 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    NotFound:
      description: Ressource inconnue, ou hors du périmètre de cette chaîne.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: NOT_FOUND, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    Conflict:
      description: |
        Refus métier définitif, et le `code` dit lequel. `STATE_CONFLICT` porte **l'état et la
        version courants** ; `TRANSITION_IRREVERSIBLE` porte la transition visée **et la promesse
        engagée** ; `MODERATION_ALREADY_SETTLED` porte **le verdict gagnant et son auteur**.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error:
              code: MODERATION_ALREADY_SETTLED
              nature: refused
              params: { verdict: remove, settledBy: 'Claire D.', settledAt: '2026-09-21T20:30:58Z' }
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: '2026-09-21T20:31:04.118Z'

    Gone:
      description: Curseur de reprise trop ancien — rechargement complet exigé, et la surface le **sait**.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: CURSOR_TOO_OLD, nature: refused, params: { maxAgeHours: 24 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    TooManyRequests:
      description: Limite de débit atteinte.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: RATE_LIMITED, nature: unavailable, params: { retryAfterMs: 2000 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

    Unavailable:
      description: 'Nos serveurs. `nature: "unavailable"` permet à la garde de distinguer « réessayer » de « comprendre ».'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: { code: UPSTREAM_UNAVAILABLE, nature: unavailable, params: { service: streaming }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
            servedAt: '2026-09-21T20:31:04.118Z'

  schemas:

    EnvelopeMeta:
      type: object
      required: [servedAt, rightsVersion]
      properties:
        servedAt:
          type: string
          format: date-time
          description: |
            L'horloge de référence. Le chronomètre de garde, la durée d'une réduction au silence,
            « la rediffusion expire dans 41 h », l'expiration d'un accès ponctuel : tout se compte
            contre lui et un décalage mesuré, **jamais contre l'horloge du poste**.
          examples: ['2026-09-21T20:31:04.118Z']
        validUntil: { type: [string, 'null'], format: date-time }
        rightsVersion:
          type: integer
          format: int64
          description: '**Sur chaque réponse.** Quand il change, la navigation est périmée.'
          examples: [412]
        lastEventSeq: { type: [integer, 'null'], format: int64 }
        degraded:
          type: array
          items: { type: string }
          description: Les parties facultatives qui n'ont pas pu être composées. La console se peint quand même.

    OffsetPageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      description: |
        **Le total est exact**, pas approximatif : c'est la différence avec le storefront, et c'est
        ce que « 1–8 SUR N » exige.
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
        emptyReason: { type: [string, 'null'] }

    CursorPageInfo:
      type: object
      required: [hasMore]
      description: 'Les deux exceptions : file de modération et tchat en direct.'
      properties:
        nextCursor: { type: [string, 'null'] }
        prevCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        pendingCount:
          type: [integer, 'null']
          description: |
            Le **total séparé**, pour la pastille. Il ne se compte pas sur la page courante : la
            barre du bas porte « en file : 14 », et **aucun de ces nombres ne doit exiger de
            rapatrier une page**.

    Error:
      type: object
      required: [code, nature, params, traceId]
      properties:
        code:
          type: string
          description: |
            Vocabulaire fermé, i18n par codes, **avec instantané embarqué au build comme repli
            obligatoire**. C'est vital ici : **une revue de magasin est lente**. Si un code
            nouveau arrive du backend avant la mise à jour de l'application, la personne en garde
            doit voir une phrase, pas `moderation.verdict.conflict`.
          examples: [PUBLICATION_CHECKLIST_INCOMPLETE]
        nature:
          type: string
          enum: [refused, unavailable, offline_forbidden]
          description: '`offline_forbidden` est un refus **local**, jamais émis par le serveur.'
        params:
          type: object
          additionalProperties: true
          examples: [{ missing: [poster, capacity, technical_check_passed] }]
        traceId:
          type: string
          description: Le seul moment où la personne peut lire un numéro et le dicter au support.
          examples: ['4bf92f3577b34da6a3ce929d0e0e4736']

    ErrorEnvelope:
      type: object
      required: [error, servedAt]
      properties:
        error: { $ref: '#/components/schemas/Error' }
        servedAt: { type: string, format: date-time }

    Money:
      type: object
      required: [amountMinor, currencyCode]
      description: Unité mineure entière + code devise ISO 4217. Le formatage est du client.
      properties:
        amountMinor: { type: integer, format: int64, examples: [2400] }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$', examples: [EUR] }

    LocalizedText:
      type: object
      required: [contentLanguage, text]
      description: |
        Un texte **rédigé**. Deux seules exceptions assumées à « i18n par codes » : le message
        d'écran d'attente écrit par la régie, et les textes de la boîte.
      properties:
        contentLanguage: { type: string, examples: [fr] }
        text: { type: string }

    Actor:
      type: object
      required: [surface]
      description: |
        Qui a causé le fait. **Vide pour `system`** — une règle serveur (écran d'attente
        automatique, expiration d'un bail) est un acteur quand même, et le journal doit pouvoir la
        distinguer d'une décision humaine.
      properties:
        accountId: { type: [string, 'null'], format: uuid }
        personId: { type: [string, 'null'], format: uuid }
        displayName: { type: [string, 'null'] }
        surface: { type: string, x-arthome-vocabulary: [studio-web, studio-mobile, system] }

    # ---------------------------------------------------------- droits et amorçage

    EffectiveRights:
      type: object
      required: [channelId, roles, navigation, datePanes, canRevenue, canOps, canTech, canDecideOutcome, assignableRoles]
      description: |
        **Calculés une fois dans `@arthome/core`, servis par le BFF.** Jamais recomposés par une
        surface : la navigation est l'**union** des accès de tous les rôles tenus, et une
        projection à six personas effacerait le droit d'invitation de `director`.
      properties:
        channelId: { type: string, format: uuid }
        channelName: { type: string }
        roles:
          type: array
          description: '**Un ensemble**, jamais un rôle unique — une personne en tient plusieurs sur la même chaîne.'
          items:
            type: string
            x-arthome-vocabulary: [artist, production, coordination, director, video, sound, moderation, treasury]
          examples: [[production, coordination]]
        isOwner:
          type: boolean
          description: Exactement une ligne par chaîne. **Jamais retirable ni modifiable en rôles.**
        navigation:
          type: array
          description: Les entrées **ouvertes**, dans l'ordre canonique servi. La surface n'ordonne pas et ne filtre pas.
          items:
            type: string
            x-arthome-vocabulary:
              [agenda, dashboard, moderation, crew, events, stream, stats, tickets, store,
               replays, payouts, journal, settings, help]
        datePanes:
          type: array
          description: |
            Les volets de fiche de date ouverts **à cette personne**. Un écran de détail dont la
            découpe même dépend des droits : ce n'est pas seulement la navigation racine qui doit
            connaître les droits avant de peindre, c'est aussi chaque fiche.
          items: { type: string, x-arthome-vocabulary: [public, tickets, chat, tech, crew, replay] }
        canRevenue:
          type: boolean
          description: '**Décide du contenu de la réponse**, pas de son affichage.'
        canOps: { type: boolean }
        canTech: { type: boolean }
        canDecideOutcome:
          type: boolean
          description: |
            Reporter, annuler, poursuivre avec dédommagement — **réservé au propriétaire et à la
            production**. Les autres rôles ne peuvent que **signaler**. Une décision d'issue vaut
            plusieurs milliers d'euros.
        assignableRoles:
          type: array
          description: |
            La projection de `grants` sur les rôles tenus, **matérialisée** — jamais la table
            `grants` à recomposer. `director` peut inviter `video` et `sound` ; `video`, `sound`,
            `moderation` et `treasury` n'invitent personne.
          items: { type: string }
        dateGrants:
          type: array
          description: |
            Les accès **ponctuels** en cours, portée une date, avec leur **instant** d'expiration.
            « Expire au salut + 1 h » est une phrase d'écran ; le contrat porte l'instant.
          items:
            type: object
            required: [grantId, dateId, crewRole, expiresAt]
            properties:
              grantId: { type: string, format: uuid }
              dateId: { type: string, format: uuid }
              crewRole: { type: string, x-arthome-vocabulary: [director, video, sound, moderation] }
              expiresAt: { type: string, format: date-time }

    StudioCounters:
      type: object
      description: |
        **Les pastilles, servies à l'amorçage et tenues à jour par le canal temps réel.** Aucun de
        ces nombres ne doit exiger de rapatrier une page : sinon la barre du bas coûte cinq
        requêtes à chaque ouverture.
      properties:
        moderationPending: { type: integer, examples: [14] }
        inboxUnread: { type: integer, examples: [2] }
        dutiesTonight: { type: integer, examples: [3] }
        invitationsPending: { type: integer }
        datesToCover: { type: integer }
        payoutsDue: { type: integer }

    StudioBootstrap:
      type: object
      required: [person, channels, rightsVersion, constants, labelCatalog, counters]
      description: |
        **Le premier rendu n'attend qu'une chose : ceci.** Les tables ne sont jamais lues à vide,
        et c'est le bon comportement — mais il impose sa contrainte : l'amorçage doit être **petit
        et rapide**, parce que rien n'est peint tant qu'il n'est pas là. Tout le reste — mesures,
        file, statistiques — arrive après, par écran.

        **La racine n'est pas une chaîne, c'est une personne.** Un régisseur ou un modérateur
        indépendant intervient sur plusieurs chaînes le même soir ; `channels[]` les porte toutes,
        avec leurs droits effectifs.
      properties:
        person:
          type: object
          required: [personId, displayName]
          properties:
            personId: { type: string, format: uuid }
            displayName: { type: string }
            isFreelance: { type: boolean }
            runsCalled:
              type: integer
              description: '**Un modèle de lecture**, pas un champ écrit à la main : il s''incrémente sur `run_ended`.'
            readingTimezone:
              type: string
              description: '**Le même champ** que le fuseau de lecture du storefront — même compte, un seul porteur.'
              examples: ['Europe/Paris']
        channels:
          type: array
          items: { $ref: '#/components/schemas/EffectiveRights' }
        rightsVersion: { type: integer, format: int64 }
        constants:
          type: object
          description: |
            Les constantes de domaine, **servies**. Seuil de provision technique, échéance de
            révision, fenêtre de priorité de liste d'attente, bornes de saison, plafond de débit
            du tchat, échéance d'annulation. Constantes recopiées, elles divergeraient sur cinq
            surfaces (E11).
          properties:
            technicalProvisionThreshold: { type: integer, examples: [10000] }
            provisionRevisionHours: { type: integer, examples: [72] }
            waitlistPriorityWindowHours: { type: integer, examples: [2] }
            cancelDeadlineMinutesBefore: { type: integer, examples: [60] }
            payoutDelayDays: { type: integer, examples: [14] }
            commissionRateBps: { type: integer, examples: [1200] }
            chatBurstThresholdPerMinute: { type: integer, examples: [60] }
            holdScreenAutoAfterSec:
              type: integer
              description: |
                « Écran d'attente automatique si le flux se perd plus de 15 s » est une **règle
                serveur**, portée comme valeur par défaut de chaîne. Elle ne dépend pas d'un poste
                de régie qui pourrait être celui qui a perdu le réseau.
              examples: [15]
            seasonBounds:
              type: object
              description: '**1ᵉʳ septembre → 31 août**, convention du spectacle vivant. Servies, jamais devinées par cinq surfaces.'
              properties:
                startsOn: { type: string, examples: ['09-01'] }
                endsOn: { type: string, examples: ['08-31'] }
        labelCatalog:
          type: object
          description: |
            Artefact versionné immuable, **servi par surface**. Le studio charge quatre thèmes —
            `studio`, `taxonomy`, `system`, `storefront` — et son nombre de clés d'énumération est
            élevé : le découpage par surface existe précisément pour cela. **Aucun service** ne le
            sert : c'est un artefact CDN.
          properties:
            locale: { type: string }
            version: { type: integer }
            url: { type: string, format: uri }
        counters: { $ref: '#/components/schemas/StudioCounters' }
        realtime:
          type: object
          description: |
            **L'abonnement est par personne, pas par page.** Un canal ouvert seulement sur la
            chaîne affichée manquerait l'incident de l'autre — et sur un réseau mobile déjà
            fragile, un abonnement par chaîne multiplierait les connexions.
          properties:
            namespace: { type: string, examples: ['/studio'] }
            pulseIntervalSec:
              type: integer
              description: |
                **`ws:pulse` toutes les 5 s**, et c'est ce qui rend le silence diagnosticable :
                plus de pulse pendant 15 s = **je suis sourd** ; un pulse sans échantillon de santé
                depuis 30 s = **la salle n'envoie plus**. Deux états, deux écrans, aucune
                inférence.
              examples: [5]

    # ---------------------------------------------------------- publication

    PublicationChecklistItem:
      type: object
      required: [id, satisfied, source, blocking]
      description: |
        **Sept éléments, ceux de la fiche** — pas les quatre des fixtures, qui sont un
        sous-ensemble arbitraire. Servie comme une **liste d'identifiants**, jamais un
        pourcentage, que le client calculerait.

        **Trois des sept sont des faits projetés** depuis d'autres contextes : `catalog` les tient
        à jour par événement, il ne les demande à personne.
      properties:
        id:
          type: string
          x-arthome-vocabulary:
            [title_and_discipline, poster, description, at_least_one_active_price, capacity,
             technical_check_passed, chat_mode_set, chapters_planned, moderator_assigned]
        satisfied: { type: boolean }
        source: { type: string, x-arthome-vocabulary: [catalog, ticketing, streaming, chat] }
        blocking:
          type: boolean
          description: |
            « Chapitres prévus » et « modérateur affecté » sont des **avertissements non
            bloquants** : on doit pouvoir publier une date sans chapitres, et le studio doit
            pouvoir le faire.

    PublicationTransition:
      type: object
      required: [from, to, irreversible]
      description: |
        **Le verrou porte sur le couple `from > to`, pas sur l'état.** Les fixtures encodent une
        liste d'**états** et testent l'appartenance de l'état courant ; la maquette encode des
        **couples**. Ce sont deux sémantiques, et c'est la seconde qui est juste (E5).
      properties:
        from: { type: string }
        to: { type: string }
        irreversible: { type: boolean }
        promiseCode:
          type: [string, 'null']
          description: |
            La **promesse engagée**, qui voyage avec le refus et avec la confirmation :
            `prices_engaged` pour `draft|reserve → scheduled`, `replay_sold` pour
            `ended → replay-online`. Un code, jamais la phrase.
          x-arthome-vocabulary: [prices_engaged, replay_sold]

    Publication:
      type: object
      required: [dateId, state, orderRank, version, checklist, offeredTransitions]
      properties:
        dateId: { type: string, format: uuid }
        state:
          type: string
          description: |
            Vocabulaire de `catalogue.json`, qui fait autorité. `replay-online` dit ce que
            `replay` ne dit pas : **la rediffusion est en vente**. Les tables parallèles des deux
            maquettes de studio ne sont jamais reprises.
          x-arthome-vocabulary: [draft, reserve, scheduled, technical, live, ended, replay-online]
        orderRank:
          type: integer
          description: |
            **Le rang voyage avec l'état.** Le tableau des événements trie par état, et l'ordre est
            celui de la machine, pas l'alphabet. Sans rang servi, chaque surface réinvente sa
            table d'ordre.
        version:
          type: integer
          description: |
            Le studio est **multi-opérateurs sans verrou** : l'arbitrage est sur le serveur. Toute
            transition porte `expectedVersion`, et une commande partie de `technical` alors que
            l'état courant est `live` est refusée par `STATE_CONFLICT` **avec l'état et la version
            courants**.
        publishedAt: { type: [string, 'null'], format: date-time }
        pricesLockedAt: { type: [string, 'null'], format: date-time }
        replayOnlineAt: { type: [string, 'null'], format: date-time }
        checklist:
          type: array
          items: { $ref: '#/components/schemas/PublicationChecklistItem' }
        offeredTransitions:
          type: array
          description: |
            **Calculées pour cet opérateur**, servies avec l'état. Seuls le propriétaire et la
            production déplacent une date ; une régie voit la fiche et ne la déplace pas. Sans
            cette liste, chaque surface recalcule la table — donc une seconde implémentation de la
            règle, donc une divergence garantie.
          items: { $ref: '#/components/schemas/PublicationTransition' }
        lastActor: { $ref: '#/components/schemas/Actor' }

    DateSheet:
      type: object
      required: [dateId, publication, openPanes]
      description: |
        **Servie par volets, pas servie entière et découpée au rendu.** Un modérateur doit pouvoir
        charger le volet `chat` **sans** charger la fiche entière, sinon la billetterie transite
        pour rien. Un appel pour la fiche, puis un appel par volet ouvert, chez son propriétaire.
      properties:
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        venueClock:
          type: object
          properties:
            venueTimezone: { type: string }
            venueUtcOffsetMin: { type: integer }
        runtimeMin: { type: integer }
        outcome: { type: [string, 'null'], x-arthome-vocabulary: [postponed, cancelled, interrupted] }
        publication: { $ref: '#/components/schemas/Publication' }
        openPanes:
          type: array
          description: Les volets ouverts **à cette personne**. La vue d'ensemble n'apparaît qu'au-delà de trois volets.
          items: { type: string, x-arthome-vocabulary: [public, tickets, chat, tech, crew, replay] }

    EventsRow:
      type: object
      required: [dateId, title, startsAt, state, orderRank]
      description: |
        Une ligne du tableau des événements. **La projection par rôle décide de ce qu'elle
        contient** : `grossRevenue` est **absent** — pas nul — pour un rôle sans `canRevenue`, et
        un tri sur cette clé est alors **refusé**.
      properties:
        dateId: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        state: { type: string, x-arthome-vocabulary: [draft, reserve, scheduled, technical, live, ended, replay-online] }
        orderRank: { type: integer }
        outcome: { type: [string, 'null'] }
        lowestPrice: { $ref: '#/components/schemas/Money' }
        fillRateBps: { type: [integer, 'null'] }
        seatsSold: { type: [integer, 'null'] }
        grossRevenue:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: '**Absent** de la réponse quand le rôle n''a pas `canRevenue`. Jamais présent et nul.'

    Duty:
      type: object
      required: [dateId, channelId, crewRole, startsAt]
      description: |
        Une garde. `person_duties` est tenu par `identity` et porte **toutes chaînes confondues** :
        un régisseur peut être de garde sur deux directs le même soir, et le bandeau signale le
        **chevauchement**.
      properties:
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        channelName: { type: string }
        title: { type: string }
        crewRole: { type: string, x-arthome-vocabulary: [director, video, sound, moderation] }
        startsAt: { type: string, format: date-time }
        runState: { type: [string, 'null'], x-arthome-vocabulary: [idle, rehearsal, on_air, interrupted, ended] }
        overlapsWith:
          type: array
          description: '**Servi**, jamais calculé par la surface : `overlapsWith` vit dans `@arthome/core`.'
          items: { type: string, format: uuid }
        accessExpiresAt: { type: [string, 'null'], format: date-time }

    # ---------------------------------------------------------- billetterie

    DateSalesPane:
      type: object
      required: [dateId, capacityTotal, seatsAvailable, priceTiers, pricesLocked]
      description: |
        Le volet `tickets`. La jauge **s'élargit par paliers et ne se réduit jamais** après la mise
        en vente ; les tarifs **se verrouillent à la mise en vente**, l'horaire **à l'antenne**.
        « Appliquer à la série » **exclut les tarifs et la jauge** : chaque date engage ses propres
        acheteurs.
      properties:
        dateId: { type: string, format: uuid }
        capacityTotal: { type: integer }
        capacityTiers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              capacity: { type: integer }
              openedAt: { type: [string, 'null'], format: date-time }
        seatsAvailable: { type: integer }
        seatsSold: { type: integer }
        waitlistCount: { type: integer }
        fillRateBps: { type: integer }
        priceTiers:
          type: array
          items:
            type: object
            required: [tier, amount, active]
            properties:
              tier: { type: string, x-arthome-vocabulary: [full, reduced, support] }
              amount: { $ref: '#/components/schemas/Money' }
              active: { type: boolean }
        promotions:
          type: array
          items:
            type: object
            properties:
              reason: { type: string, x-arthome-vocabulary: [pre_sale, preview_night, discovery_rate, final_date, late_rate] }
              struckPrice: { $ref: '#/components/schemas/Money' }
              currentPrice: { $ref: '#/components/schemas/Money' }
              validFrom: { type: string, format: date-time }
              validUntil: { type: string, format: date-time }
        serviceFeePerSeat:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: '**Par place**, et le barème est servi, jamais une constante d''écran.'
        pricesLocked: { type: boolean }
        replayUnitPrice: { $ref: '#/components/schemas/Money' }
        complimentaries:
          type: array
          items:
            type: object
            properties:
              categoryId: { type: string }
              issued: { type: integer }
              allocated: { type: integer }
        technicalProvision:
          type: object
          description: |
            Au-delà de **10 000 places**, l'infrastructure se provisionne à l'avance ; un
            prévisionnel très au-dessus du réel expose à un **malus** ; révisable jusqu'à **72 h**
            avant. **Seuil, provision, échéance et exposition sont des données du contrat**, pas
            des constantes recopiées sur cinq surfaces.
          properties:
            required: { type: boolean }
            threshold: { type: integer }
            revisableUntil: { type: [string, 'null'], format: date-time }
            malusExposure: { $ref: '#/components/schemas/Money' }
        grossRevenue:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: '**Absent** quand le rôle n''a pas `canRevenue`.'
        version: { type: integer }

    # ---------------------------------------------------------- conduite

    HealthSample:
      type: object
      required: [measuredAt, source]
      description: |
        **Chaque métrique est nullable, et l'absence a un sens.** Le gigue et les paquets perdus
        **n'existent qu'en entrée WebRTC** ; en RTMP, transporté sur TCP, ils n'ont pas de sens, et
        le contrat les **omet** plutôt que de servir zéro. Un zéro se lit « parfait », pas « non
        mesuré ».

        `measuredAt` est l'instant de mesure **à l'ingest**, pas à la réception : c'est ce qui
        permet d'afficher « débit 8,9 Mb/s, mesuré il y a 3 s » ou « dernière mesure il y a
        2 min » au lieu de « 0 Mb/s », qui est un mensonge.
      properties:
        measuredAt: { type: string, format: date-time }
        source:
          type: string
          description: |
            `client_submitted` pour la latence bout-en-bout, mesurée côté régie par
            `RTCPeerConnection.getStats()` sur la voie WHEP et **soumise** — jamais un chiffre
            natif présenté comme bout-en-bout. Si elle n'est pas mesurée, elle est **absente**.
          x-arthome-vocabulary: [ingest_server, client_submitted]
        ingestUpKbps:
          type: [integer, 'null']
          description: |
            Observation **serveur**. À ne jamais confondre avec `deviceUpKbps`, qui mesure la
            liaison du téléphone et non l'encodeur : **deux débits différents ne portent jamais le
            même nom**. Seul le premier alimente la liste de pré-vol.
        deviceUpKbps: { type: [integer, 'null'] }
        latencyMs: { type: [integer, 'null'] }
        droppedPct: { type: [number, 'null'] }
        jitterMs: { type: [integer, 'null'], description: '**Omis** en RTMP — il n''y a pas de sens à le servir.' }
        lostPackets: { type: [integer, 'null'], description: '**Omis** en RTMP.' }
        viewers:
          type: [integer, 'null']
          description: '**Absent — jamais zéro — quand la date n''est pas à l''antenne.**'

    RunConsole:
      type: object
      required: [dateId, state, ingestProtocol, monitorPath, afterGracePeriod]
      description: |
        L'état de la conduite, servi en **un** appel. Le studio distingue **« accroc amorti »** de
        **« publieur parti »** — deux champs, pas un : une coupure réseau de deux secondes en salle
        ne doit produire ni incident en régie ni manifeste HLS reparti de zéro.
      properties:
        dateId: { type: string, format: uuid }
        state:
          type: string
          description: |
            L'axe **technique**, et rien d'autre. `postponed` et `cancelled` en sont **retirés** :
            c'étaient des échos de l'issue logés dans l'état technique. Une régie n'a pas d'état
            « annulée » — elle a un plateau qui n'envoie rien.
          x-arthome-vocabulary: [idle, rehearsal, on_air, interrupted, ended]
        afterGracePeriod: { type: boolean }
        ingestProtocol:
          type: string
          description: '**Décide des métriques réellement disponibles.**'
          x-arthome-vocabulary: [rtmps, srt, whip]
        monitorPath:
          type: string
          description: |
            La voie de retour **réellement ouverte**. WHEP sous la seconde sur entrée WHIP, LL-HLS
            à quelques secondes sur entrée RTMP. **Le studio doit le savoir pour ne pas promettre à
            l'opérateur une latence qu'il n'a pas** — le contrat porte la vérité, pas l'uniformité.
            Sur la coquille native, `whep` n'est pas promis au palier 5 (D-019).
          x-arthome-vocabulary: [whep, ll_hls]
        monitorUrl: { type: [string, 'null'], format: uri }
        qualityLadder:
          type: array
          items:
            type: object
            properties:
              renditionId: { type: string }
              heightPx: { type: integer }
              enabled: { type: boolean }
        cameras: { type: array, items: { type: string } }
        startedAt: { type: [string, 'null'], format: date-time }
        lastSample: { $ref: '#/components/schemas/HealthSample' }
        incident: { $ref: '#/components/schemas/StudioIncident' }
        chapters:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              vocabId: { type: string }
              atMediaSec: { type: integer }
        chatThroughputPerMinute:
          type: [integer, 'null']
          description: |
            **Mesuré par le serveur, dans une unité déclarée** : fenêtre glissante de 60 s, unité
            messages/minute, rafraîchi toutes les 5 s. Le seuil de bascule de la console (60
            msg/min) se lit contre **cette mesure-là** — pas contre « nombre de messages ÷ heures
            écoulées », qui n'est pas la même chose.
        grossRevenue:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: '**Absent** sans `canRevenue`. La salle temps réel `:revenue` est distincte pour la même raison.'
        version: { type: integer }

    StudioIncident:
      type: [object, 'null']
      required: [id, kind, cause, trigger, raisedAt]
      description: |
        **Cause et issue sont deux vocabulaires**, et les confondre était la faute d'origine :
        `catalogue.incidentMessages` ne porte que quatre entrées, **qui sont des issues**.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: L'**issue** visible du spectateur.
          x-arthome-vocabulary: [hold_screen, postponed, cancelled, interrupted]
        cause:
          type: string
          description: |
            La **cause**, vocabulaire distinct. `compatibility_worker_failed` existe parce qu'un
            *worker* de transcodage ne doit jamais mourir en silence — sinon la régie voit un
            lecteur qui ne démarre jamais, sans cause.
          x-arthome-vocabulary:
            [venue_feed_lost, run_desk_disconnected, bitrate_collapsed,
             compatibility_worker_failed, provider_error, manual]
        trigger:
          type: string
          description: |
            L'écran d'attente **automatique** produit un incident **de même nature** qu'un
            déclenchement manuel — c'est la bonne réponse au cas « le régisseur est injoignable ».
            Le journal doit néanmoins distinguer les deux.
          x-arthome-vocabulary: [manual, auto]
        message:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: |
            Écrit par la régie : du **contenu**, avec sa langue de rédaction. Le catalogue fournit
            des **modèles** par nature d'incident, que la régie reprend ou remplace.
        raisedAt: { type: string, format: date-time }
        raisedBy: { $ref: '#/components/schemas/Actor' }

    StreamKeyReveal:
      type: object
      required: [streamKey, ingestUrl, revealedAt]
      description: |
        **Un secret affiché sur un téléphone, dans une salle, souvent devant un prestataire.**
        Quatre garanties : la clé n'est **jamais** dans une charge utile de liste ; sa révélation
        est une **commande distincte, auditée et nominative** ; son renouvellement est immédiat et
        l'ancienne **cesse aussitôt de diffuser** ; la réponse porte `Cache-Control: no-store`,
        pour qu'elle ne se retrouve ni dans le cache HTTP du téléphone ni dans l'instantané
        d'application pris par le système au passage en arrière-plan.

        L'affectation du créneau `director` — **qui donne accès à la clé** — est réservée à
        `artist ∨ production`, et le contrat rend cette raison explicite plutôt que de la laisser
        deviner.
      properties:
        streamKey: { type: string }
        ingestUrl: { type: string, format: uri }
        revealedAt: { type: string, format: date-time }

    # ---------------------------------------------------------- modération

    ModerationItem:
      type: object
      required: [id, messageId, dateId, state, reportsCount, atMediaSec, version]
      description: |
        **Trois axes, jamais empilés.** `state` est la nature de la **ligne de file** — c'est pour
        cela que la file se construisait en filtrant `state === 'reported'`, ce qui n'est pas un
        filtre d'état mais un filtre de nature. L'état du **message** et la sanction sur la
        **personne** sont deux autres axes, portés ailleurs.
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        state: { type: string, x-arthome-vocabulary: [reported, claimed, settled] }
        reason: { type: string, x-arthome-vocabulary: [spam, harassment, hate, off_topic, filter] }
        reportsCount: { type: integer }
        atMediaSec: { type: integer }
        sentAt: { type: string, format: date-time }
        authorHandle: { type: string }
        authorSanction: { type: string, x-arthome-vocabulary: [none, muted, banned] }
        body: { $ref: '#/components/schemas/LocalizedText' }
        claimedBy: { $ref: '#/components/schemas/Actor' }
        claimExpiresAt:
          type: [string, 'null']
          format: date-time
          description: |
            **Un bail court**, renouvelé tant que la personne est présente, **libéré par le
            serveur** à l'expiration. Sans lui, un modérateur qui ferme son navigateur gèle une
            ligne pendant tout le direct.
        verdict: { type: [string, 'null'], x-arthome-vocabulary: [publish, remove, mute, ban] }
        settledBy: { $ref: '#/components/schemas/Actor' }
        settledAt: { type: [string, 'null'], format: date-time }
        origin:
          type: string
          description: |
            Le journal doit distinguer un **reclassement automatique** d'une **décision humaine**.
            `retroactive_filter` marque les éléments produits par l'ajout d'un mot au dictionnaire.
          x-arthome-vocabulary: [human_verdict, retroactive_filter, author_sanctioned]
        version:
          type: integer
          description: |
            **Les commandes de modération sont conditionnelles, jamais idempotentes aveugles.**
            « Prendre en charge n'est pas trancher » : c'est une préséance, donc une règle, donc un
            arbitrage serveur sur la version.

    AudienceMember:
      type: object
      required: [id, handle, sanction, messagesCount, present]
      description: |
        **Le public d'une chaîne est une collection interrogeable par elle-même**, pas une
        projection du tchat : la console cherche « un spectateur présent, **qui n'a pas écrit** ».
      properties:
        id: { type: string, format: uuid }
        handle: { type: string, examples: ['@marie.j'] }
        sanction: { type: string, x-arthome-vocabulary: [none, muted, banned] }
        sanctionExpiresAt:
          type: [string, 'null']
          format: date-time
          description: |
            **Un instant, jamais une étiquette.** « Sans limite », 1 min, 10 min, 1 h et la durée
            libre sont un seul champ, calculé une fois. Absent = sans limite.
        messagesCount: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        subscriberTier: { type: [string, 'null'], x-arthome-vocabulary: [free, pass, premium] }
        holdsSeat: { type: boolean }
        present:
          type: boolean
          description: Présence **sur le direct en cours**.

    ChatPolicy:
      type: object
      required: [dateId, mode, filterSeverity, slowModeSec, holdersOnly, locked]
      properties:
        dateId: { type: string, format: uuid }
        mode: { type: string, x-arthome-vocabulary: [open, emoji, read_only, off] }
        filterSeverity:
          type: string
          description: |
            **Un seul vocabulaire.** Deux coexistaient dans le même fichier de maquette —
            « souple/normale/haute » en réglages de chaîne, « basse/moyenne/haute » en page de
            modération — et aucun n'était dans les sources partagées.
          x-arthome-vocabulary: [low, medium, high]
        slowModeSec: { type: integer }
        holdersOnly: { type: boolean }
        retroactiveFilter: { type: boolean }
        locked:
          type: boolean
          description: |
            Vrai dès que la publication est engagée. **`chat` applique son propre verrou**, il ne
            demande rien à `catalog` : après engagement on peut toujours **fermer** un tchat en
            direct, jamais l'ouvrir davantage.
        version: { type: integer }

    # ---------------------------------------------------------- équipe

    ChannelMember:
      type: object
      required: [personId, displayName, roles, isOwner, joinedAt]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: [string, 'null'], format: email }
        roles:
          type: array
          description: '**Un ensemble.** Les huit valeurs canoniques, jamais le repli à six.'
          items: { type: string, x-arthome-vocabulary: [artist, production, coordination, director, video, sound, moderation, treasury] }
        isOwner:
          type: boolean
          description: '**Jamais retirable ni modifiable en rôles.** `transferOwnership` déplace le drapeau.'
        joinedAt: { type: string, format: date-time }
        note: { type: [string, 'null'] }
        invitationState: { type: [string, 'null'], x-arthome-vocabulary: [pending, accepted, declined, expired] }
        version: { type: integer }

    DateAccessGrant:
      type: object
      required: [grantId, dateId, personId, crewRole, expiresAt]
      description: |
        Le **renfort ponctuel** — portée une date, expiration **servie comme un instant**,
        révocable **sans toucher à l'appartenance à la chaîne**. Le confondre avec une
        appartenance ferait d'une révocation de renfort une exclusion de chaîne.
      properties:
        grantId: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        displayName: { type: string }
        crewRole: { type: string, x-arthome-vocabulary: [director, video, sound, moderation] }
        expiresAt: { type: string, format: date-time }
        grantedBy: { $ref: '#/components/schemas/Actor' }

    # ---------------------------------------------------------- argent

    PayoutLine:
      type: object
      required: [payoutId, dateId, state, grossTtc, vat, grossHt, commissionRateBps, commission, net, dueAt]
      description: |
        **La ventilation par marché est la forme, et elle est sûre dans les deux modèles
        fiscaux** : un modèle à taux unique produit une ventilation à une ligne. Un
        `vatAmount` scalaire unique aurait été le seul choix réellement irréversible.

        Le modèle retenu (D-015) est le **commissionnaire** : assiette = le billet entier, taux =
        celui du pays du spectateur, redevable = Arthome. **⚠ Ce n'est pas un avis fiscal** —
        à valider par un conseil avant tout encaissement réel.
      properties:
        payoutId: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        state:
          type: string
          description: |
            **Piloté par l'issue de la date** : `held` tant qu'une issue est ouverte, `refunded` si
            annulée, `suspended` tant qu'un changement de coordonnées bancaires attend sa
            contre-signature.
          x-arthome-vocabulary: [scheduled, held, paid, refunded, suspended]
        grossTtc: { $ref: '#/components/schemas/Money' }
        vat:
          type: array
          description: '**Une ligne par marché**, chacune avec son assiette, son taux et son montant.'
          items:
            type: object
            required: [marketId, rateBps, base, amount]
            properties:
              marketId: { type: string, examples: [eur] }
              rateBps: { type: integer, description: 'Taux en points de base — 550 = 5,5 %. **Un entier, jamais un flottant** : un taux en virgule flottante finit par produire un centime d''écart.' }
              base: { $ref: '#/components/schemas/Money' }
              amount: { $ref: '#/components/schemas/Money' }
        grossHt: { $ref: '#/components/schemas/Money' }
        commissionRateBps:
          type: integer
          description: |
            **Servi, jamais redérivé de `commission / gross`** — la maquette le redérive et
            retombe sur 12 % par défaut quand le brut est nul. **La commission porte sur le HT** :
            sur le TTC, les 12 % annoncés aux artistes varieraient avec le pays de l'acheteur.
          examples: [1200]
        commission: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        refunded: { $ref: '#/components/schemas/Money' }
        credited: { $ref: '#/components/schemas/Money' }
        dueAt:
          type: string
          format: date-time
          description: '**Fin du direct + 14 jours.** L''échéance court depuis la fin, pas depuis le paiement.'
        stripeTransferRef: { type: [string, 'null'] }
        reconciledAt: { type: [string, 'null'], format: date-time }
        discrepancy:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: '**Une période ne se clôt pas avec un écart non expliqué.**'

    BankChangeRequest:
      type: object
      required: [requestId, state, maskedAccountTail, requestedAt, expiresAt]
      description: |
        **Un agrégat à part entière, pas un champ** : deux acteurs, deux rôles distincts
        (propriétaire **et** trésorerie), un délai, une trace — **et il suspend le virement en
        cours** le temps de la signature. Une écriture ne peut pas porter cela.
      properties:
        requestId: { type: string, format: uuid }
        state: { type: string, x-arthome-vocabulary: [pending_countersignature, countersigned, rejected, expired] }
        maskedAccountTail:
          type: string
          description: '**Les quatre derniers caractères seulement.** Un IBAN complet n''a rien à faire dans un journal qui se rejoue.'
          examples: ['4417']
        requestedBy: { $ref: '#/components/schemas/Actor' }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        countersignedBy: { $ref: '#/components/schemas/Actor' }
        suspendsPayoutIds: { type: array, items: { type: string, format: uuid } }

    ExportJob:
      type: object
      required: [exportId, kind, state, requestedAt]
      description: |
        Sur 24 mois, un export est un **travail asynchrone** (BullMQ **interne à son service**).
        L'adresse rendue est **signée, de courte durée, et utilisable sans cookie de session** —
        un export protégé par cookie est intéléchargeable depuis la coquille native. Durée
        proposée : **60 minutes**.
      properties:
        exportId: { type: string, format: uuid }
        kind:
          type: string
          x-arthome-vocabulary: [sales_csv, fec, sage, cegid, grouped_invoices, journal, schedule_ics, stats_csv]
        state: { type: string, x-arthome-vocabulary: [queued, running, ready, failed, expired] }
        requestedAt: { type: string, format: date-time }
        downloadUrl: { type: [string, 'null'], format: uri }
        downloadExpiresAt: { type: [string, 'null'], format: date-time }

    UploadTicket:
      type: object
      required: [uploadUrl, fields, expiresAt, assetId]
      description: |
        **Téléversement par adresse de dépôt signée, obtenue par une commande JSON** — jamais de
        `multipart` depuis un WebView. Durée proposée : **15 minutes**, assez pour une 4G de salle,
        assez court pour ne pas être un jeton d'accès déguisé.
      properties:
        assetId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        fields: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string, format: date-time }

    JournalEntry:
      type: object
      required: [id, nature, occurredAt, actor, code, params]
      description: |
        **Nominatif et situé**, conservé 24 mois. Une **tentative** de marche arrière sur un tarif
        engagé y figure aussi : c'est en soi une information de conduite.
      properties:
        id: { type: string, format: uuid }
        nature: { type: string, x-arthome-vocabulary: [air, mod, event, access, money] }
        occurredAt: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/Actor' }
        code: { type: string, description: Un **code**, jamais une phrase rédigée. }
        params: { type: object, additionalProperties: true }
        dateId: { type: [string, 'null'], format: uuid }

    InboxEntry:
      type: object
      required: [id, kind, createdAt, read]
      description: |
        **Routée par rôle et par chaîne, côté serveur** : l'application ne filtre pas une file
        commune. Et **jamais de montant si le rôle destinataire n'a pas `canRevenue`**.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, x-arthome-vocabulary: [invitation, alert, duty, incident, payout, bank_change, reconciliation] }
        channelId: { type: [string, 'null'], format: uuid }
        dateId: { type: [string, 'null'], format: uuid }
        body:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: Les textes de la boîte sont l'une des **deux seules exceptions** assumées à « i18n par codes ».
        deepLinkCode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }

    MerchItemAdmin:
      type: object
      required: [id, label, variants, state, source]
      properties:
        id: { type: string, format: uuid }
        showId: { type: [string, 'null'], format: uuid }
        label:
          allOf: [{ $ref: '#/components/schemas/LocalizedText' }]
          description: '**Bilingue.** L''absence de libellé anglais dans les sources est une **lacune de donnée** à combler au portage, pas une lacune de traduction (E10).'
        variants:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              stock: { type: integer }
              price: { $ref: '#/components/schemas/Money' }
        state: { type: string, x-arthome-vocabulary: [on_sale, out_of_stock] }
        source:
          type: string
          description: '**Une seule intégration externe à la fois** par chaîne.'
          x-arthome-vocabulary: [arthome, shopify, woocommerce, prestashop, drupal, api]
        merchantUrl: { type: [string, 'null'], format: uri }
        pinnedDateId: { type: [string, 'null'], format: uuid }
        version: { type: integer }
