  # =============================================================== team and rights

  /v1/channels/{channelId}/members:
    get:
      operationId: listChannelMembers
      tags: [crew]
      summary: The team — page + total, with a served counter per role.
      description: |
        The **per-role counter** is a **served aggregation**, not a count over the current page: the
        role filter displays "production (4)", and that number bears on the whole team.

        The search covers the name, the email, the note and the role, **server-side**: the directory
        of contributors runs into the thousands, freelancers included.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
