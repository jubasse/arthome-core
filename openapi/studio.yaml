  /v1/dates/{dateId}/replay-policy:
    put:
      operationId: setDateReplayPolicy
      tags: [publication]
      summary: Sets the replay policy — the promise made before the purchase.
      description: |
        **`none` is final for this date.** You cannot later switch on a replay you promised not to
        make: the public price depended on it. The other values lock when ticketing opens.

        The contract separates three things the sources conflated: the **promise** belongs to
        `catalog`, the **sale** to `ticketing`, the **file and its expiry** to `streaming`.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy, expectedVersion]
              properties:
                policy: { type: string, enum: [included, subscription, unit, none], x-arthome-vocabulary-source: REPLAY_POLICIES }
                windowHours: { type: [integer, "null"], minimum: 1 }
                expectedVersion: { type: integer }
            example: { policy: unit, windowHours: 72, expectedVersion: 7 }
      responses:
        "200":
          description: Policy up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/Publication" } }
              example:
                servedAt: "2026-09-21T18:08:00.000Z"
                rightsVersion: 412
                data:
                  {
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001,
                    state: scheduled,
                    orderRank: 3,
                    version: 8,
                    checklist: [],
                    offeredTransitions: [],
                  }
        "409":
          description: "`REPLAY_POLICY_FINAL` when the policy was `none`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: date.replay_policy_final,
                    nature: refused,
                    params: { currentPolicy: none },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T18:08:00.000Z"

  /v1/dates/{dateId}:
    delete:
