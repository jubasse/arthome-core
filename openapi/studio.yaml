  /v1/channels/{channelId}/audience/{memberId}/sanction:
    put:
      operationId: sanctionAudienceMember
      tags: [moderation]
      summary: Sanctions a person — per channel, with an instant of expiry.
      description: |
        **The sanction bears on the person, within a channel**: the same person is banned at one
        artist's and welcome at another's. That is why it belongs to `chat` and not to `identity` —
        housing the sanction there would force every verdict, the most frequent gesture of a saturated
        live show, into a cross-service write to the most sensitive service in the system.

        **A sanction carries an instant of expiry, never a label.** "No limit", 1 min, 10 min, 1 h and
        a free-form duration are **a single field**, computed once.
