                  {
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001,
                    state: on_air,
                    afterGracePeriod: true,
                    ingestProtocol: rtmps,
                    monitorPath: ll_hls,
                    version: 5,
                  }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/dates/{dateId}/run/health-samples:
    post:
      operationId: submitHealthSample
      tags: [run]
      summary: Submits a measurement taken in the control room — the end-to-end latency.
      description: |
        **End-to-end latency is a dedicated measurement**, never a native figure presented as one.
        It is measured by `RTCPeerConnection.getStats()` on the WHEP return path and **submitted**,
        hence `source: client_submitted`. **If it is not measured, it is absent** — never replaced by
        a zero.

        `deviceUpKbps` measures the workstation's uplink, **not the encoder**: two different bitrates
        never carry the same name, and only `ingestUpKbps` feeds the pre-flight checklist.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      x-arthome-idempotency-exemption: |
        **One measurement per second per live show, loss-tolerant.** A replayed sample is one more
        sample in a series; a lost sample is missed by nobody. The series is **re-requested**, it is
        not replayed — that is already the channel's resume rule.
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [measuredAt]
              properties:
                measuredAt: { type: string, format: date-time }
                latencyMs: { type: [integer, "null"] }
                deviceUpKbps: { type: [integer, "null"] }
                jitterMs: { type: [integer, "null"] }
            example: { measuredAt: "2026-09-21T19:20:00Z", latencyMs: 820, deviceUpKbps: 4100 }
      responses:
        "202":
          description: Measurement accepted. A loss-tolerant write, with no idempotency key.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data: { type: object, properties: { accepted: { type: boolean } } }
              example:
                servedAt: "2026-09-21T19:20:01.000Z"
                rightsVersion: 412
                data: { accepted: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/dates/{dateId}/run/chapters:
    post:
      operationId: postChapter
      tags: [run]
      summary: Sets a chapter, at its position in the media.
      description: |
        A chapter carries `atMediaSec` — its **position in the media** — never the time it was set.
        It is free now and unrecoverable later: without it, a replay's chapters are offset by however
        long the control room took to set them.

        `vocabId` is a vocabulary identifier, **never an authored label**.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chapterId, vocabId, atMediaSec]
              properties:
                chapterId: { type: string, format: uuid }
                vocabId: { type: string }
                atMediaSec: { type: integer, minimum: 0 }
            example:
              {
                chapterId: 019928d0-0000-7000-8000-000000000001,
                vocabId: chapter.second_act,
                atMediaSec: 2760,
              }
      responses:
        "201":
          description: Chapter set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          vocabId: { type: string }
                          atMediaSec: { type: integer }
              example:
                servedAt: "2026-09-21T19:46:00.000Z"
                rightsVersion: 412
                data:
                  {
                    id: 019928d0-0000-7000-8000-000000000001,
                    vocabId: chapter.second_act,
                    atMediaSec: 2760,
                  }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/dates/{dateId}/run/chapters/{chapterId}:
    delete:
      operationId: removeChapter
      tags: [run]
      summary: Removes a chapter.
      description: Replayed on an already-removed chapter, it succeeds.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - name: chapterId
          in: path
          required: true
          schema: { type: string, format: uuid }
