  /v1/dates/{dateId}/crew:
    post:
      operationId: grantDateAccess
      tags: [crew]
      summary: Assigns a stand-in to a date, with an instant of expiry.
      description: |
        **Scoped to one date, expiry served as an instant.** "Expires at curtain call + 1 h" is a
        screen sentence; the contract carries the instant. Revocable **without touching channel
        membership** — conflating the two would turn revoking a stand-in into expulsion.

        **Assignment to the `director` slot grants access to the stream key.** It is therefore
        reserved to `artist ∨ production`, and the contract makes **that reason** explicit rather than
        leaving it to be guessed.

        **Sixty seconds is not good enough for an access that expires**: the internal token carries the
        roles, but the service checks the time-boxed access **on the loaded resource**.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId, crewRole, expiresAt]
              properties:
                personId: { type: string, format: uuid }
                crewRole: { type: string, enum: [director, video, sound, moderation] }
                expiresAt: { type: string, format: date-time }
            example:
              {
                personId: 019928b2-0000-7000-8000-000000000001,
                crewRole: director,
                expiresAt: "2026-09-21T21:45:00Z",
              }
      responses:
        "201":
          description: One-off access granted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/DateAccessGrant" } }
              example:
                servedAt: "2026-09-21T18:20:00.000Z"
                rightsVersion: 412
                data:
                  grantId: 019928b3-0000-7000-8000-000000000001
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  personId: 019928b2-0000-7000-8000-000000000001
                  displayName: "Yann P."
                  crewRole: director
