  /v1/dates/{dateId}/run/health-samples:
    post:
      operationId: submitHealthSample
      tags: [run]
      summary: Soumet une mesure prise côté régie — la latence bout-en-bout.
      description: |
        **La latence bout-en-bout est une mesure dédiée**, jamais un chiffre natif présenté comme
        tel. Elle est mesurée par `RTCPeerConnection.getStats()` sur la voie WHEP et **soumise**,
        d'où `source: client_submitted`. **Si elle n'est pas mesurée, elle est absente** — jamais
        remplacée par un zéro.

        `deviceUpKbps` mesure la liaison du poste, **pas l'encodeur** : deux débits différents ne
        portent jamais le même nom, et seul `ingestUpKbps` alimente la liste de pré-vol.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
