  /v1/dates/{dateId}/publication/transitions:
    post:
      operationId: moveDatePublicationState
      tags: [publication]
      summary: Moves the date through the state machine.
      description: |
        **Three guarantees, and not one of them is an interface courtesy.**

        1. **The server refuses the reverse transition.** Not offering it in the interface is not a
           guarantee. The refusal carries `TRANSITION_IRREVERSIBLE`, the transition attempted **and
           the promise committed** as parameters — `prices_engaged` for `draft|reserve → scheduled`,
           `replay_sold` for `ended → replay-online`. **The lock bears on the `from > to` pair, not
           on the state.**
        2. **It is conditional and versioned.** Two people can be on the record: a command sent from
           `technical` while the current state is `live` is refused with `STATE_CONFLICT`, **with the
           current state and version**. The studio is multi-operator without a lock; the arbitration
           is on the server.
        3. **`Idempotency-Key` is mandatory, not recommended**: the transition commits a public price
           or a sale.

        **The publication gate is served, not recomputed**: the refusal names the **missing** items as
        parameters, since the screen counts them ("publish — 3 missing"). Never a percentage, which
        the client would compute.

        **The attempt to go backwards is itself logged**: an attempt to walk back a committed price is
        in itself a piece of operational information.

        Two transitions are **not** commands: `technical → live` and `live → ended` are **caused by a
        `streaming` event**. Publication does not command the broadcast, it **learns** of it — only
        `streaming` knows whether the feed is arriving.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, expectedVersion]
              properties:
                to: { type: string, enum: [draft, reserve, scheduled, technical, replay-online] }
                expectedVersion: { type: integer }
                acknowledgedPromiseCode:
                  type: [string, "null"]
                  description: |
                    **Mandatory for a transition with no way back.** The confirmation carries the promise's
                    code, and its wording comes from the contract: the interface does not invent it.
                  enum: [prices_engaged, replay_sold, null]
            example: { to: scheduled, expectedVersion: 7, acknowledgedPromiseCode: prices_engaged }
      responses:
        "200":
          description: Transition applied. The publication up to date, with its newly offered transitions.
          headers:
            Idempotency-Replayed: { $ref: "#/components/headers/IdempotencyReplayed" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/Publication" } }
              example:
                servedAt: "2026-09-21T18:04:00.000Z"
                rightsVersion: 412
                data:
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  state: scheduled
                  orderRank: 3
                  version: 8
                  publishedAt: "2026-09-21T18:04:00Z"
                  pricesLockedAt: "2026-09-21T18:04:00Z"
                  checklist: []
                  offeredTransitions: [{ from: scheduled, to: technical, irreversible: false }]
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            `STATE_CONFLICT` (with the current state and version), `TRANSITION_IRREVERSIBLE` (with the
            promise committed), or `PUBLICATION_CHECKLIST_INCOMPLETE` (with the list of what is
            missing).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: PUBLICATION_CHECKLIST_INCOMPLETE
                  nature: refused
                  params: { missing: [poster, at_least_one_active_price, technical_check_passed] }
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: "2026-09-21T18:04:00.000Z"

  /v1/dates/{dateId}/prices:
    put:
      operationId: setDatePrices
      tags: [ticketing]
      summary: Sets a date's prices.
      description: |
        **`ticketing` applies its own lock**, it asks `catalog` for nothing: it refuses as soon as it
        has consumed `publication.engaged`, with its own code and its own trace. This is the answer to
        the reproach "an aggregate straddling three contexts" — publication publishes a fact, each
        owner locks what it owns.

        **"Apply to the series" excludes prices**: each date commits its own buyers.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tiers, expectedVersion]
              properties:
                expectedVersion: { type: integer }
                tiers:
                  type: array
                  items:
                    type: object
                    required: [tier, amountMinor, currencyCode, active]
                    properties:
                      tier: { type: string, enum: [full, reduced, support] }
                      amountMinor: { type: integer, minimum: 0 }
                      currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
                      active: { type: boolean }
            example:
              expectedVersion: 12
              tiers:
                - { tier: full, amountMinor: 2400, currencyCode: EUR, active: true }
                - { tier: reduced, amountMinor: 1600, currencyCode: EUR, active: true }
      responses:
        "200":
          description: Prices up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/DateSalesPane" } }
              example:
                servedAt: "2026-09-21T18:05:00.000Z"
                rightsVersion: 412
                data:
                  {
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001,
                    capacityTotal: 200,
                    seatsAvailable: 26,
                    priceTiers: [],
                    pricesLocked: false,
                    version: 13,
                  }
        "409":
          description: "`PRICES_LOCKED` when publication is committed, `STATE_CONFLICT` on a stale version."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: PRICES_LOCKED,
                    nature: refused,
                    params: { lockedAt: "2026-09-21T18:04:00Z" },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T18:05:00.000Z"

  /v1/dates/{dateId}/capacity-tiers:
    post:
      operationId: openCapacityTier
      tags: [ticketing]
      summary: Opens a capacity tier, and warns the waiting list in the same gesture.
      description: |
        **One transactional command, not two.** Two calls would let the scarcity dissipate between
        them: the priority window (2 h) is a **domain parameter**, served and not copied out.

        **Capacity widens in tiers and never shrinks** once the sale has opened: a reduction is
        refused with `CAPACITY_SHRINK_FORBIDDEN`.

        Beyond **10,000 seats**, the technical provision is required, revisable up to **72 h**
        beforehand; threshold, provision, deadline and exposure to the penalty are **contract data**.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [additionalCapacity, expectedVersion]
              properties:
                additionalCapacity: { type: integer, minimum: 1 }
                expectedVersion: { type: integer }
                notifyWaitlist: { type: boolean, default: true }
            example: { additionalCapacity: 50, expectedVersion: 12, notifyWaitlist: true }
      responses:
        "200":
          description: Tier opened and waiting list warned, in the same transaction.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          sales: { $ref: "#/components/schemas/DateSalesPane" }
                          waitlistNotified: { type: integer }
                          priorityUntil: { type: string, format: date-time }
              example:
                servedAt: "2026-09-21T18:06:00.000Z"
                rightsVersion: 412
                data:
                  sales:
                    {
                      dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001,
                      capacityTotal: 250,
                      seatsAvailable: 76,
                      priceTiers: [],
                      pricesLocked: true,
                      version: 13,
                    }
                  waitlistNotified: 12
                  priorityUntil: "2026-09-21T20:06:00Z"
        "409":
          description: "`CAPACITY_SHRINK_FORBIDDEN`, or `TECHNICAL_PROVISION_REQUIRED` beyond the threshold."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: TECHNICAL_PROVISION_REQUIRED,
                    nature: refused,
                    params: { threshold: 10000, revisableUntil: "2026-09-18T19:00:00Z" },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T18:06:00.000Z"

  /v1/dates/{dateId}/chat-policy:
    put:
      operationId: setDateChatPolicy
      tags: [moderation]
      summary: Sets the date's chat regime.
      description: |
        **`chat` applies its own lock.** Once publication is committed, a live chat can still be
        **closed**; it can no longer be **opened wider**. `chat` knows this because it consumed the
        event, not because it asked `catalog`.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                mode: { type: string, enum: [open, emoji, read_only, off] }
                filterSeverity: { type: string, enum: [low, medium, high] }
                slowModeSec: { type: integer, minimum: 0, maximum: 300 }
                holdersOnly: { type: boolean }
                retroactiveFilter: { type: boolean }
            example: { expectedVersion: 4, mode: emoji, slowModeSec: 10 }
      responses:
        "200":
          description: Regime up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/ChatPolicy" } }
              example:
                servedAt: "2026-09-21T18:07:00.000Z"
                rightsVersion: 412
                data:
                  {
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001,
                    mode: emoji,
                    filterSeverity: medium,
                    slowModeSec: 10,
                    holdersOnly: false,
                    locked: true,
                    version: 5,
                  }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/dates/{dateId}/replay-policy:
    put:
      operationId: setDateReplayPolicy
      tags: [publication]
      summary: Sets the replay policy — the promise made before the purchase.
      description: |
        **`none` is final for this date.** You cannot later switch on a replay you promised not to
        make: the public price depended on it. The other values lock when ticketing opens.

        The contract separates three things the sources conflated: the **promise** belongs to
        `catalog`, the **sale** to `ticketing`, the **file and its expiry** to `streaming`.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy, expectedVersion]
              properties:
                policy: { type: string, enum: [included, subscription, unit, none] }
                windowHours: { type: [integer, "null"], minimum: 1 }
                expectedVersion: { type: integer }
            example: { policy: unit, windowHours: 72, expectedVersion: 7 }
      responses:
        "200":
          description: Policy up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/Publication" } }
              example:
                servedAt: "2026-09-21T18:08:00.000Z"
                rightsVersion: 412
                data:
                  {
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001,
                    state: scheduled,
                    orderRank: 3,
                    version: 8,
                    checklist: [],
                    offeredTransitions: [],
                  }
        "409":
          description: "`REPLAY_POLICY_FINAL` when the policy was `none`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: REPLAY_POLICY_FINAL,
                    nature: refused,
                    params: { currentPolicy: none },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T18:08:00.000Z"

  /v1/dates/{dateId}:
    delete:
      operationId: deleteDate
      tags: [publication]
      summary: Deletes a date.
      description: |
        **Refused if seats remain sold**, and the refusal carries **the count** as a parameter: the
        screen must say "174 seats sold", not "not possible". It is a domain rule, not an interface
        guard, and the application must not try to check it on its own.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Date deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data: { type: object, properties: { deleted: { type: boolean } } }
              example:
                servedAt: "2026-09-21T18:09:00.000Z"
                rightsVersion: 412
                data: { deleted: true }
        "409":
          description: "`DATE_HAS_SOLD_SEATS`, with the count."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: DATE_HAS_SOLD_SEATS,
                    nature: refused,
                    params: { seatsSold: 174 },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T18:09:00.000Z"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/dates/{dateId}/duplicate:
    post:
      operationId: duplicateDate
      tags: [publication]
      summary: Duplicates a date, or applies it to the series.
      description: |
        **"Apply to the series" excludes prices and capacity** — never carried over, because each
        date commits its own buyers. The contract says so rather than leaving the interface to guess
        it.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newDateId, startsAt]
              properties:
                newDateId:
                  { type: string, format: uuid, description: Généré par le domaine côté client. }
                startsAt: { type: string, format: date-time }
                applyToSeries: { type: boolean, default: false }
            example:
              { newDateId: 019928c1-0000-7000-8000-000000000001, startsAt: "2026-11-05T19:30:00Z" }
      responses:
        "201":
          description: New date created, **without** the original's prices or capacity.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
