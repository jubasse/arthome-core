          description: A page of members, plus the head count per role.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [items, page, roleCounts]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/ChannelMember" } }
                      roleCounts: { type: object, additionalProperties: { type: integer } }
                      page: { $ref: "#/components/schemas/OffsetPageInfo" }
              example:
                servedAt: "2026-09-21T18:15:00.000Z"
                rightsVersion: 412
                items:
                  - personId: 019928b0-0000-7000-8000-000000000001
                    displayName: "Claire D."
                    email: claire@example.org
                    roles: [production, coordination]
