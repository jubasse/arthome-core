                retroactive: { type: boolean, default: false }
            example: { word: "exemple", retroactive: true }
      responses:
        "202":
          description: Word added; the reclassification runs in the background.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          word: { type: string }
                          reprocessing: { type: boolean }
                          estimatedAffectedMessages: { type: integer }
              example:
                servedAt: "2026-09-21T19:34:00.000Z"
