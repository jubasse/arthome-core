  /v1/moderation/items/{itemId}/claim:
    post:
      operationId: claimModerationItem
      tags: [moderation]
      summary: Prend en charge une ligne — un bail, pas une écriture.
      description: |
        **« Prendre en charge n'est pas trancher. »** C'est un **bail court**, renouvelé tant que
        la personne est présente et **libéré par le serveur** à l'expiration : un modérateur dont
        le téléphone s'éteint ne gèle pas une ligne pendant tout le direct.

        **Ne se met jamais en file hors ligne** : rejouée à la reconnexion, elle réclamerait une
        ligne que quelqu'un d'autre a déjà traitée.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Bail posé, avec son instant d'expiration.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ModerationItem' } }
              example:
                servedAt: '2026-09-21T19:30:10.000Z'
                rightsVersion: 412
                data:
                  id: 019928e0-0000-7000-8000-000000000001
                  messageId: 019928f8-0000-7000-8000-000000000009
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  state: claimed
                  reportsCount: 3
                  atMediaSec: 1812
