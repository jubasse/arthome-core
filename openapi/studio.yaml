              example:
                servedAt: "2026-09-21T18:10:00.000Z"
                rightsVersion: 412
                data:
                  dateId: 019928c1-0000-7000-8000-000000000001
                  channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                  title: Nuit blanche
                  startsAt: "2026-11-05T19:30:00Z"
                  openPanes: [public, tickets]
                  publication:
                    {
                      dateId: 019928c1-0000-7000-8000-000000000001,
                      state: draft,
                      orderRank: 1,
                      version: 1,
                      checklist: [],
                      offeredTransitions: [],
                    }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/dates/{dateId}/outcome:
    post:
      operationId: decideDateOutcome
      tags: [publication]
      summary: Declares a date's outcome — postpone, cancel, interrupt.
      description: |
        **Reserved to the owner and to production.** The other roles can only **report**. An outcome
        decision is worth several thousand euros, and the log names names.

        **One event, four consequences, and none of the four consumers talks to the others**:
        `ticketing` refunds (cancelled) / credits (interrupted) / **does not move** (postponed — the
        seat follows the new date); `payouts` withholds; `catalog` replaces the state **on every
        card**, not only on the record; `notifications` warns the holders.

        **A declared outcome is a fact: never rewritten, never erased.**

        The control room's message travels **with its authoring language**: it is content, not an i18n
        key.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, message, expectedVersion]
              properties:
                outcome: { type: string, enum: [postponed, cancelled, interrupted] }
                message:
                  type: object
                  required: [contentLanguage, text]
                  properties:
                    contentLanguage: { type: string }
                    text: { type: string, maxLength: 600 }
                rescheduledTo:
                  type: [string, "null"]
                  format: date-time
                  description: "**Required, and only permitted,** for `postponed`."
                expectedVersion: { type: integer }
            example:
              outcome: postponed
              message:
                { contentLanguage: fr, text: "Report au 4 novembre. Vos places restent valables." }
              rescheduledTo: "2026-11-04T19:30:00Z"
              expectedVersion: 8
      responses:
        "200":
          description: Outcome declared, and what it implies for the holders.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          outcome: { type: string }
                          declaredAt: { type: string, format: date-time }
                          moneyEffectCode:
                            type: string
                            description: "`full_refund` · `account_credit` · `no_movement`. A **code**, never a sentence."
                          affectedSeats: { type: integer }
              example:
                servedAt: "2026-09-21T20:50:00.000Z"
                rightsVersion: 412
                data:
                  {
                    outcome: postponed,
                    declaredAt: "2026-09-21T20:50:00Z",
                    moneyEffectCode: no_movement,
                    affectedSeats: 174,
                  }
        "403":
          description: "`OUTCOME_DECISION_FORBIDDEN` — this role can only report."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: OUTCOME_DECISION_FORBIDDEN,
                    nature: refused,
                    params: { canEscalateTo: [artist, production] },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T20:50:00.000Z"
        "409": { $ref: "#/components/responses/Conflict" }

  # =============================================================== conduite du direct

  /v1/dates/{dateId}/run:
    get:
      operationId: getRunConsole
      tags: [run]
      summary: The state of the run — one call, the whole control-room screen.
      description: |
        **The return path actually open is served** (`monitorPath`): the studio must **know** it so
        as not to promise the operator a latency it does not have. The contract carries the truth, not
        uniformity — creating a media branch to make a schema uniform would cost more than it returns.

        **Two fields, not one**: `state` and `afterGracePeriod`. The studio distinguishes "hiccup
        absorbed" from "publisher gone", and a two-second network break in a room must produce neither
        an incident nor a manifest restarted from zero.

        **The stream key is never here**: it appears in no list payload.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: The console.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/RunConsole" } }
              example:
                servedAt: "2026-09-21T19:20:00.000Z"
                validUntil: "2026-09-21T19:20:15.000Z"
                rightsVersion: 412
                data:
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  state: on_air
                  afterGracePeriod: true
                  ingestProtocol: rtmps
                  monitorPath: ll_hls
                  monitorUrl: "https://monitor.arthome.fr/a9f1c0/index.m3u8"
                  qualityLadder: [{ renditionId: "1080p", heightPx: 1080, enabled: true }]
                  startedAt: "2026-09-21T19:00:12Z"
                  lastSample:
                    measuredAt: "2026-09-21T19:19:57Z"
                    source: ingest_server
                    ingestUpKbps: 8900
                    latencyMs: null
                    droppedPct: 0.1
                    viewers: 1842
                  incident: null
                  chapters: []
                  chatThroughputPerMinute: 41
                  version: 3
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/dates/{dateId}/run/technical-check:
    post:
      operationId: runTechnicalCheck
      tags: [run]
      summary: Starts the technical check.
      description: |
        Its success **unlocks publication**: `technical_check_passed` is one of the seven checklist
        items, and it comes from here. `catalog` **projects** it, it does not ask for it.
        `idle → on_air` is refused as long as the check has never passed.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: The check's result, and the pre-flight checklist.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          passed: { type: boolean }
                          passedAt: { type: [string, "null"], format: date-time }
                          failures: { type: array, items: { type: string } }
                          sample: { $ref: "#/components/schemas/HealthSample" }
              example:
                servedAt: "2026-09-21T18:45:00.000Z"
                rightsVersion: 412
                data:
                  passed: true
                  passedAt: "2026-09-21T18:45:00Z"
                  failures: []
                  sample:
                    {
                      measuredAt: "2026-09-21T18:44:58Z",
                      source: ingest_server,
                      ingestUpKbps: 9100,
                    }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/dates/{dateId}/run/state:
    put:
      operationId: setRunState
      tags: [run]
      summary: Goes on air, rehearses, or cuts the broadcast.
      description: |
        **The "go on air" command goes to `streaming`, not to `catalog`**: only `streaming` knows
        whether the feed is arriving. Publication **learns** of it afterwards, by event — two
        transitions out of eight are caused that way, which leaves `Publication` the aggregate of a
        single context.

        `idle → on_air` is **refused** if the technical check has never passed.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, expectedVersion]
              properties:
                state: { type: string, enum: [idle, rehearsal, on_air, ended] }
                expectedVersion: { type: integer }
            example: { state: on_air, expectedVersion: 3 }
      responses:
        "200":
          description: The console up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/RunConsole" } }
              example:
                servedAt: "2026-09-21T19:00:12.000Z"
                rightsVersion: 412
                data:
                  {
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001,
                    state: on_air,
                    afterGracePeriod: true,
                    ingestProtocol: rtmps,
                    monitorPath: ll_hls,
                    version: 4,
                  }
        "409":
          description: "`TECHNICAL_CHECK_REQUIRED`, ou `STATE_CONFLICT`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: TECHNICAL_CHECK_REQUIRED,
                    nature: refused,
                    params: {},
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T19:00:12.000Z"

  /v1/dates/{dateId}/run/quality-profile:
    put:
      operationId: setQualityProfile
      tags: [run]
