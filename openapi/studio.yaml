      summary: Deletes a channel.
      description: |
        **Refused while a date remains on sale or a payout is owed.** These facts are **projected
        and held locally** by `identity` (`channel_dues`), never asked of `ticketing` or `payouts`
        synchronously: that is precisely the kind of call "no synchronous call between services"
        forbids.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
