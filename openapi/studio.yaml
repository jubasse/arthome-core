  # =============================================================== money

  /v1/channels/{channelId}/payouts:
    get:
      operationId: listPayouts
      tags: [payouts]
      summary: The payouts owed, one line per date sold.
      description: |
        **One balance per currency, never a converted balance.** A channel selling in two currencies
        has **two balances**: converting would introduce a rate, hence an exchange date, hence a
        reconciliation gap nobody could explain. Stripe keeps one balance per currency; we mirror it,
        we do not aggregate it.

        **Reserved to roles with `canRevenue`** — the whole page, not only its columns.
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortDir"
        - name: state
          in: query
          schema: { type: string, enum: [scheduled, held, paid, refunded, suspended], x-arthome-vocabulary-source: PAYOUT_STATES }
      responses:
        "200":
          description: A page of payout lines, and the balances **per currency**.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [items, page, balances]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/PayoutLine" } }
                      balances:
                        type: array
                        description: "**One balance per currency.** Never aggregated."
                        items:
                          $ref: "#/components/schemas/Money"
                          x-arthome-tax-basis: inclusive
                      pendingBankChange: { $ref: "#/components/schemas/BankChangeRequest" }
                      page: { $ref: "#/components/schemas/OffsetPageInfo" }
              example:
                servedAt: "2026-09-21T18:25:00.000Z"
                rightsVersion: 412
                items:
                  - payoutId: 019928e5-0000-7000-8000-000000000001
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                    state: scheduled
                    grossTtc: { amountMinor: 417600, currencyCode: EUR }
                    vat:
                      - {
                          rateBps: 550,
                          base: { amountMinor: 395830, currencyCode: EUR },
                          amount: { amountMinor: 21770, currencyCode: EUR },
                          jurisdictionCode: FR,
                          jurisdictionLevel: country,
                          supplyKind: live_stream_access,
                        }
                    grossHt: { amountMinor: 395830, currencyCode: EUR }
                    commissionRateBps: 1200
                    commission: { amountMinor: 47500, currencyCode: EUR }
                    net: { amountMinor: 348330, currencyCode: EUR }
                    dueAt: "2026-10-05T21:30:00Z"
                balances: [{ amountMinor: 348330, currencyCode: EUR }]
                page: { page: 1, pageSize: 20, totalItems: 42, totalPages: 3 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/channels/{channelId}/bank-change-requests:
    post:
      operationId: requestBankChange
      tags: [payouts]
      summary: Requests a change of bank details — dual signature.
      description: |
        **An aggregate in its own right, not a write.** Two actors, two distinct roles (owner **and**
        treasury), a delay, a trace — **and it suspends the payout in flight** for the duration of the
        signing. A write cannot carry that.

        Only the **last four characters** of the account travel: a full IBAN has no business in an
        event log that gets replayed.

        **The return from an external browser confirms nothing**: the pending state lives
        **server-side**, and on the way back, "the deep link says where to go, the backend says what
        changed".
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stripeSetupRef, reauthToken]
              properties:
                stripeSetupRef:
                  {
                    type: string,
                    description: '**Opaque** reference to the hosted flow. No provider identifier crosses the domain.,'
                  }
                reauthToken: { type: string }
            example: { stripeSetupRef: seti_1Ab2Cd, reauthToken: ott_9f2ac1 }
      responses:
        "202":
          description: Request created, transfers suspended until counter-signature.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/BankChangeRequest" } }
              example:
                servedAt: "2026-09-21T18:26:00.000Z"
                rightsVersion: 412
                data:
                  requestId: 019928e6-0000-7000-8000-000000000001
                  state: pending_countersignature
                  maskedAccountTail: "4417"
                  requestedBy:
                    {
                      personId: 019928b0-0000-7000-8000-000000000001,
                      displayName: "Claire D.",
                      surface: studio_web,
                    }
                  requestedAt: "2026-09-21T18:26:00Z"
                  expiresAt: "2026-09-28T18:26:00Z"
                  suspendsPayoutIds: [019928e5-0000-7000-8000-000000000001]
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/bank-change-requests/{requestId}/countersign:
    post:
      operationId: countersignBankChange
      tags: [payouts]
      summary: Counter-signs a change of bank details.
      description: |
        **Two distinct roles**: the owner **and** the treasury. One and the same person cannot sign
        both times, even holding both roles — `SAME_ACTOR_FORBIDDEN`. That is the entire point of a
        dual signature.
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reauthToken]
              properties:
                decision: { type: string, enum: [countersign, reject], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "The two answers this one command accepts. It is the command's shape, not a vocabulary: a third answer would be a third command." }
                reauthToken: { type: string }
            example: { decision: countersign, reauthToken: ott_4d77e2 }
      responses:
        "200":
          description: Counter-signed, transfers resumed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/BankChangeRequest" } }
              example:
                servedAt: "2026-09-21T18:30:00.000Z"
                rightsVersion: 412
                data:
                  requestId: 019928e6-0000-7000-8000-000000000001
                  state: countersigned
                  maskedAccountTail: "4417"
                  requestedAt: "2026-09-21T18:26:00Z"
                  expiresAt: "2026-09-28T18:26:00Z"
                  countersignedBy:
                    {
