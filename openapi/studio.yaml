                rightsVersion: 412
                data: { id: 019928e0-0000-7000-8000-000000000001, messageId: 019928f8-0000-7000-8000-000000000009, dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, state: reported, reportsCount: 3, atMediaSec: 1812, version: 3 }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/moderation/items/{itemId}/verdict:
    post:
      operationId: settleModerationItem
      tags: [moderation]
      summary: Rend un verdict — conditionnel, jamais idempotent aveugle.
      description: |
        **Le second verdict est refusé, et le refus transporte la décision gagnante** — auteur
        **et** verdict — pour que l'écran affiche « X a déjà supprimé ce message » au lieu d'un
        échec nu. Un refus nu obligerait à un second aller-retour en plein direct.

        **C'est pourquoi la commande est conditionnelle** (`expectedVersion`) et **non** idempotente
        aveugle : un rejeu idempotent écraserait le premier verdict, ce qui est exactement
        l'inverse de la règle.

        **Deux des quatre verdicts portent sur la personne, pas sur le message** : `mute` et `ban`
        composent avec la sanction de chaîne. Les trois axes — état du message, nature de la ligne
        de file, sanction sur la personne — ne s'empilent jamais.

        **Se met en file hors ligne**, avec les sanctions sur une personne nommée, et **rien
        d'autre** : c'est le seul geste de garde qu'une 4G de sous-sol doit pouvoir différer.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict, expectedVersion]
              properties:
                verdict: { type: string, enum: [publish, remove, mute, ban] }
                reason: { type: string, enum: [spam, harassment, hate, off_topic, filter] }
                muteUntil:
                  type: [string, 'null']
                  format: date-time
                  description: '**Un instant**, jamais une étiquette. Absent = sans limite.'
                expectedVersion: { type: integer }
            example: { verdict: mute, reason: harassment, muteUntil: '2026-09-21T20:30:00Z', expectedVersion: 2 }
      responses:
        '200':
          description: Verdict rendu.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ModerationItem' } }
              example:
                servedAt: '2026-09-21T19:31:20.000Z'
                rightsVersion: 412
                data:
                  id: 019928e0-0000-7000-8000-000000000001
                  messageId: 019928f8-0000-7000-8000-000000000009
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  state: settled
                  verdict: mute
                  reportsCount: 3
                  atMediaSec: 1812
                  settledBy: { personId: 019928b0-0000-7000-8000-000000000001, displayName: 'Claire D.', surface: studio-mobile }
                  settledAt: '2026-09-21T19:31:20Z'
                  origin: human_verdict
                  version: 3
        '409':
          description: '`MODERATION_ALREADY_SETTLED`, **avec le verdict gagnant et son auteur**.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: MODERATION_ALREADY_SETTLED
                  nature: refused
                  params: { verdict: remove, settledBy: 'Yann P.', settledAt: '2026-09-21T19:31:18Z' }
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-09-21T19:31:20.000Z'

