  /v1/channels/{channelId}/ownership-transfer:
    post:
      operationId: transferChannelOwnership
      tags: [crew]
      summary: Transfers ownership of the channel — two-stage.
      description: |
        **The recipient must already be a member and have two-factor authentication.** These are
        domain rules, not interface guards, and the refusal is **served with its reason**. The bank
        account (`payouts`) and the public page (`catalog`) **follow** the transfer, by event.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toPersonId, reauthToken]
              properties:
                toPersonId: { type: string, format: uuid }
                reauthToken: { type: string }
            example: { toPersonId: 019928b2-0000-7000-8000-000000000001, reauthToken: ott_9f2ac1 }
      responses:
        "202":
          description: Transfert en attente d'acceptation.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          state: { type: string }
                          expiresAt: { type: string, format: date-time }
              example:
                servedAt: "2026-09-21T18:21:00.000Z"
                rightsVersion: 412
                data: { state: pending_acceptance, expiresAt: "2026-09-28T18:21:00Z" }
        "409":
          description: "`TRANSFER_TARGET_INELIGIBLE` — not a member, or without two-factor authentication."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: TRANSFER_TARGET_INELIGIBLE,
