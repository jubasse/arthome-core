        "403":
          description: "`CREW_ROLE_RESERVED` — the `director` assignment grants access to the stream key."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: CREW_ROLE_RESERVED,
                    nature: refused,
                    params:
                      {
                        crewRole: director,
                        reservedTo: [artist, production],
                        reasonCode: grants_stream_key_access,
