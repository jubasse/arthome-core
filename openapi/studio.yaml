        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/channels/{channelId}/invitations:
    post:
      operationId: inviteMember
      tags: [crew]
      summary: Invites a person, into a role the inviter has the right to assign.
      description: |
        **`role ∈ assignableRoles` of the inviter**, a projection of `grants` onto the roles they
        hold. The refusal carries **the list of roles assignable from this level and whom to ask** — a
        bare refusal would force the person to guess.

        `director` can invite `video` and `sound`; `video`, `sound`, `moderation` and `treasury`
        invite nobody. **The fallback to six personas erases that right**, and that is why it appears
        in no response.

        **A two-stage command**: the invitation stays pending until the invitee answers, and it is
        **visible as such** in the member list.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, roles]
              properties:
                email: { type: string, format: email }
                roles:
                  type: array
                  minItems: 1
                  items:
                    {
                      type: string,
                      enum:
                        [
                          artist,
                          production,
                          coordination,
                          director,
                          video,
                          sound,
                          moderation,
                          treasury,
                        ], x-arthome-vocabulary-source: MEMBER_ROLES,
                    }
                note: { type: [string, "null"], maxLength: 200 }
            example: { email: yann@example.org, roles: [video], note: "Renfort captation novembre" }
      responses:
        "201":
          description: Invitation sent, pending.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/ChannelMember" } }
              example:
                servedAt: "2026-09-21T18:16:00.000Z"
                rightsVersion: 412
                data:
                  {
                    personId: 019928b2-0000-7000-8000-000000000001,
                    displayName: yann@example.org,
                    roles: [video],
                    isOwner: false,
                    joinedAt: "2026-09-21T18:16:00Z",
                    invitationState: pending,
                    version: 1,
                  }
        "403":
          description: "`ROLE_NOT_ASSIGNABLE`, with the assignable roles and whom to ask."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: channel.role_not_assignable,
                    nature: refused,
                    params: { assignableRoles: [video, sound], contactRoles: [artist, production] },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T18:16:00.000Z"

  /v1/invitations/{invitationId}/response:
