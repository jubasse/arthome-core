          description: '`MODERATION_ALREADY_CLAIMED`, avec le nom de qui tient le bail.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: MODERATION_ALREADY_CLAIMED, nature: refused, params: { claimedBy: 'Yann P.', claimExpiresAt: '2026-09-21T19:32:00Z' }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T19:30:10.000Z'
    delete:
      operationId: releaseModerationItem
      tags: [moderation]
      summary: Relâche la prise en charge.
      description: Accélère la libération ; **rien n'en dépend**, le bail expire de lui-même.
      x-arthome-maturity: provisional
