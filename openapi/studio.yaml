        "404": { $ref: "#/components/responses/NotFound" }

  /v1/channels/{channelId}/moderation/banned-words:
    post:
      operationId: addBannedWord
      tags: [moderation]
      summary: Adds a word to the dictionary — the reclassification is asynchronous.
      description: |
        **The ambiguity is settled: retroactive processing is asynchronous.** The command answers
        **immediately** with `reprocessing: true` and the **estimated** number of messages affected;
        the new queue items arrive over the real-time channel, marked `origin: retroactive_filter` so
        the log can tell them apart from a human decision.

        Reason: a synchronous reclassification over thousands of messages **would block the command in
        the middle of a live show**.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
