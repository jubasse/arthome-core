  /v1/channels/{channelId}/settings:
    get:
      operationId: getChannelSettings
      tags: [channel]
      summary: A channel's settings — the screen had nothing to read before writing.
      description: |
        `PATCH /channels/{id}/identity` existed **without a GET**. Two further blocks that had no
        carrier join it: the **moderation defaults**, and the **merchant integration** — one at a time
        per channel.

        The moderation block settles a defect the surface named: `filterSeverity`, `slowModeSec`,
        `holdersOnly` and `retroactiveFilter` lived **only** on `PUT /dates/{id}/chat-policy`, hence
        **per date, with a date's `expectedVersion`**. Yet off air there is no date to point at, and
        the design says the opposite in so many words: *"the dictionary, the severity and the
        sanctions stay editable off air — they will apply to the next live show"*. The dictionary was
        already at channel level; the other three were not.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog, chat, streaming, ticketing]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Public identity, moderation defaults, broadcast defaults, merchant integration.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          identity:
                            type: object
                            properties:
                              publicName: { type: string }
                              slug: { type: string }
                              categoryId: { type: string }
                              verified: { type: boolean }
                              version: { type: integer }
                          moderationDefaults:
                            type: object
                            description: |
                              **Inherited by a new date at creation**, never applied retroactively
                              to an existing date — otherwise a channel setting would change the
                              regime of a live show in progress.
                            properties:
                              filterSeverity:
                                { type: string, x-arthome-vocabulary: [low, medium, high], x-arthome-vocabulary-source: FILTER_SEVERITIES }
                              slowModeSec: { type: integer }
                              holdersOnly: { type: boolean }
                              retroactiveFilter: { type: boolean }
                              chatMode:
                                {
                                  type: string,
                                  x-arthome-vocabulary: [open, emoji, read_only, 'off'], x-arthome-vocabulary-source: CHAT_MODES,
                                }
                              version: { type: integer }
                          merchIntegration:
                            type: [object, "null"]
                            description: "**One at a time.** `null` when the shop is served by Arthome."
                            properties:
                              source:
                                {
                                  type: string,
                                  x-arthome-vocabulary:
                                    [shopify, woocommerce, prestashop, drupal, api], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "An external provider or platform identifier. It is their vocabulary, not ours, and it changes when they change.",
                                }
                              merchantUrl: { type: string, format: uri }
                              connectedAt: { type: string, format: date-time }
                              lastSyncedAt: { type: [string, "null"], format: date-time }
              example:
                servedAt: "2026-09-21T18:49:00.000Z"
                rightsVersion: 412
                data:
                  identity:
                    {
                      publicName: Compagnie Verticale,
                      slug: compagnie-verticale,
                      categoryId: dance-contemporary,
                      verified: true,
                      version: 5,
                    }
                  moderationDefaults:
                    {
                      filterSeverity: medium,
                      slowModeSec: 0,
                      holdersOnly: false,
                      retroactiveFilter: true,
                      chatMode: open,
                      version: 2,
                    }
                  merchIntegration: null
        "403": { $ref: "#/components/responses/Forbidden" }

    patch:
      operationId: updateChannelSettings
      tags: [channel]
      summary: Writes a channel's moderation and broadcast defaults.
      description: |
        **The write counterpart of `getChannelSettings`** — without it I had just created a
        read-only screen, that is, exactly the defect this batch corrects elsewhere.

        It settles the **off-air** gesture: filter severity, slow mode and holders-only are set here,
        at channel level, with no date to point at. The public identity stays on its own path,
        because it is a pure `catalog` write and because a channel's two faces never mix.

        **The defaults are inherited when a date is created, never applied retroactively**: a channel
        setting does not change the regime of a live show in progress.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat, streaming]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                moderationDefaults:
                  type: object
                  properties:
                    filterSeverity: { type: string, enum: [low, medium, high], x-arthome-vocabulary-source: FILTER_SEVERITIES }
                    slowModeSec: { type: integer, minimum: 0, maximum: 300 }
                    holdersOnly: { type: boolean }
                    retroactiveFilter: { type: boolean }
                    chatMode: { type: string, enum: [open, emoji, read_only, 'off'], x-arthome-vocabulary-source: CHAT_MODES }
                broadcastDefaults:
                  type: object
                  properties:
                    ingestProtocol: { type: string, enum: [rtmps, srt, whip], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared." }
                    holdScreenAutoAfterSec: { type: integer, minimum: 5, maximum: 120 }
            example:
              { expectedVersion: 2, moderationDefaults: { filterSeverity: high, slowModeSec: 5 } }
      responses:
        "200":
          description: Settings up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
              example:
                servedAt: "2026-09-21T18:49:30.000Z"
                rightsVersion: 412
                data:
                  moderationDefaults:
                    {
                      filterSeverity: high,
                      slowModeSec: 5,
                      holdersOnly: false,
                      retroactiveFilter: true,
                      chatMode: open,
                      version: 3,
                    }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/channels/{channelId}/journal:
    get:
      operationId: listChannelJournal
      tags: [channel]
      summary: The audit log — page + total, **mandatory period filter**.
      description: |
        **The audit log stays on page + total** (D-010), with a **mandatory period filter**. Nobody
        pages to the 50,000th entry of a 24-month log: you filter by period first, which keeps the
        page numbers — the affordance wanted — and stays fast. Moving to a cursor would trade a
        problem we do not have against the loss of what we wanted.

        `from` and `to` are **required**, and too wide a range is refused with
        `PERIOD_FILTER_REQUIRED`, with the maximum range as a parameter.

        It **names names and places them**, kept for 24 months. The **attempts** to walk back a
        committed transition appear in it: that is in itself a piece of operational information.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      # One call, not five. The audit log is attached to `identity` as a read model fed
      # ONLY by Kafka consumption: a single owner holds the exact total, the projection
      # by role and the sort, with no join at query time and without the BFF acquiring a
      # table of its own. The fan-out exception that used to stand here has no object any
      # more — and the system now has none at all, which is better than declaring one.
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: nature
          in: query
          schema:
            type: string
            enum: [air, mod, event, access, money]
            x-arthome-vocabulary-source: none
            x-arthome-vocabulary-reason: "A vocabulary local to this contract: four of the five are endpoint concerns and a vocabulary of query filters does not belong in the domain. The exception is `money`, which @arthome/core does not produce but DOES reason about — data-model.md:624 and context-map.md:402 key the redaction rule to it, so the `money` kind is absent from the response without canRevenue. Renaming that one member silently falsifies two domain documents; the other four are ours alone."
        - name: dateId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A page of the log, **projected according to the role** — the `money` kind is absent without `canRevenue`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } }
                      page: { $ref: "#/components/schemas/OffsetPageInfo" }
              example:
                servedAt: "2026-09-21T18:38:00.000Z"
                rightsVersion: 412
                items:
                  - id: 019928e7-0000-7000-8000-000000000001
                    nature: event
                    occurredAt: "2026-09-21T18:04:00Z"
                    actor:
                      {
                        personId: 019928b0-0000-7000-8000-000000000001,
                        displayName: "Claire D.",
                        surface: studio_web,
                      }
                    code: publication.transition.applied
                    params: { from: reserve, to: scheduled }
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                page: { page: 1, pageSize: 20, totalItems: 812, totalPages: 41 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/channels/{channelId}/exports:
    post:
      operationId: requestChannelExport
      tags: [payouts]
      summary: Requests an export — sales journal, FEC, Sage, Cegid, grouped invoices.
      description: |
        **An asynchronous job** (BullMQ **internal to its service**), never a synchronous download:
        over 24 months that is not tenable. The URL returned is **signed, short-lived, and usable
        without a session cookie** — an export protected by a cookie is undownloadable from the native
        shell.
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts, catalog, chat]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, from, to]
              properties:
                kind:
                  {
                    type: string,
                    enum:
                      [
                        sales_csv,
                        fec,
                        sage,
                        cegid,
                        grouped_invoices,
                        journal,
                        schedule_ics,
                        stats_csv,
                      ], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A document or export format. It names an accounting tool or a file type, which is the outside world's vocabulary rather than ours.",
                  }
                from: { type: string, format: date }
                to: { type: string, format: date }
            example: { kind: fec, from: "2026-09-01", to: "2026-09-30" }
      responses:
        "202":
          description: Export mis en file.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/ExportJob" } }
              example:
                servedAt: "2026-09-21T18:39:00.000Z"
                rightsVersion: 412
                data:
                  {
                    exportId: 019928e8-0000-7000-8000-000000000001,
                    kind: fec,
                    state: queued,
                    requestedAt: "2026-09-21T18:39:00Z",
                  }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/exports/{exportId}:
    get:
      operationId: getChannelExport
      tags: [payouts]
      summary: An export's state, and its signed URL once it is ready.
      description: "Until it is `ready`, `downloadUrl` is null: the contract never serves an address that would not answer."
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: The export's state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/ExportJob" } }
              example:
                servedAt: "2026-09-21T18:44:00.000Z"
                rightsVersion: 412
                data:
                  exportId: 019928e8-0000-7000-8000-000000000001
                  kind: fec
                  state: ready
                  requestedAt: "2026-09-21T18:39:00Z"
                  downloadUrl: "https://files.arthome.fr/exports/019928e8?sig=abc"
                  downloadExpiresAt: "2026-09-21T19:44:00Z"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/uploads:
    post:
      operationId: createUploadTicket
      tags: [channel]
      summary: Obtains a signed upload URL for a binary.
      description: |
        **Never `multipart` from a WebView.** A JSON command returns a signed upload URL, valid for
        **15 minutes** — long enough for a room's 4G, short enough not to be an access token in
        disguise.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, contentType, sizeBytes]
              properties:
                purpose:
                  type: string
                  enum: [poster, wide, avatar, merch_image]
                  x-arthome-vocabulary-source: none
                  x-arthome-vocabulary-reason: "A vocabulary local to this contract. The domain neither produces nor consumes these values — they describe what this endpoint offers, and a new member is an endpoint change."
                contentType: { type: string, enum: ["image/jpeg", "image/png", "image/webp"], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared." }
                sizeBytes: { type: integer, minimum: 1, maximum: 20971520 }
            example: { purpose: poster, contentType: "image/jpeg", sizeBytes: 842000 }
      responses:
        "201":
          description: Signed upload URL.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/UploadTicket" } }
              example:
                servedAt: "2026-09-21T18:45:00.000Z"
                rightsVersion: 412
                data:
                  assetId: 019928e9-0000-7000-8000-000000000001
                  uploadUrl: "https://uploads.arthome.fr/putt/019928e9"
                  fields: { policy: eyJ..., signature: abc }
                  expiresAt: "2026-09-21T19:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/channels/{channelId}/merch-items:
    get:
      operationId: listChannelMerchItems
      tags: [channel]
      summary: The channel's shop catalogue.
      description: "**Unpaginated** — dozens of items. One external integration at a time per channel."
      x-arthome-maturity: provisional
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/MerchItemAdmin" } }
              example:
                servedAt: "2026-09-21T18:46:00.000Z"
                rightsVersion: 412
                items:
                  - id: 019928a0-7d31-7a10-b8c4-2f9e11a4d001
                    label: { contentLanguage: fr, text: "T-shirt Nuit blanche" }
                    variants:
                      [
                        {
                          id: M,
                          label: M,
                          stock: 24,
                          price: { amountMinor: 2500, currencyCode: EUR },
                        },
                      ]
                    state: on_sale
                    source: arthome
                    version: 3
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: upsertMerchItem
      tags: [channel]
      summary: Creates or updates a shop item.
      description: |
        **An item without a variant is not sellable.** The label is **bilingual**; the absence of an
        English label in the sources is a **data gap** to be filled during the port, not a translation
        gap.
      x-arthome-maturity: provisional
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, labels, variants]
              properties:
                itemId: { type: string, format: uuid }
                showId: { type: [string, "null"], format: uuid }
                labels:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [contentLanguage, text]
                    properties:
                      contentLanguage: { type: string }
                      text: { type: string }
                variants:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, label, stock, priceMinor, currencyCode]
                    properties:
                      id: { type: string }
                      label: { type: string }
                      stock: { type: integer, minimum: 0 }
                      priceMinor: { type: integer, minimum: 0 }
                      currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
                expectedVersion: { type: [integer, "null"] }
            example:
              itemId: 019928a0-7d31-7a10-b8c4-2f9e11a4d001
              labels:
                [
                  { contentLanguage: fr, text: "T-shirt Nuit blanche" },
                  { contentLanguage: en, text: "Nuit blanche tee" },
                ]
              variants: [{ id: M, label: M, stock: 24, priceMinor: 2500, currencyCode: EUR }]
              expectedVersion: 3
      responses:
        "200":
          description: Item up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/MerchItemAdmin" } }
              example:
                servedAt: "2026-09-21T18:47:00.000Z"
                rightsVersion: 412
                data:
                  id: 019928a0-7d31-7a10-b8c4-2f9e11a4d001
                  label: { contentLanguage: fr, text: "T-shirt Nuit blanche" }
                  variants:
                    [
                      {
                        id: M,
                        label: M,
                        stock: 24,
                        price: { amountMinor: 2500, currencyCode: EUR },
                      },
                    ]
                  state: on_sale
                  source: arthome
                  version: 4
        "409": { $ref: "#/components/responses/Conflict" }

