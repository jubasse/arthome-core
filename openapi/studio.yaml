                error:
                  {
                    code: date.has_sold_seats,
                    nature: refused,
                    params: { seatsSold: 174 },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T18:09:00.000Z"
