                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/DateSheet' } }
              example:
                servedAt: '2026-09-21T18:03:00.000Z'
                rightsVersion: 412
                data:
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                  title: Nuit blanche
                  startsAt: '2026-09-21T19:00:00Z'
                  venueClock: { venueTimezone: Europe/Paris, venueUtcOffsetMin: 120 }
                  runtimeMin: 95
                  openPanes: [public, tickets, tech]
                  publication: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, state: scheduled, orderRank: 3, version: 7, checklist: [], offeredTransitions: [] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dates/{dateId}/panes/tickets:
    get:
      operationId: getDateTicketsPane
      tags: [ticketing]
      summary: Le volet billetterie d'une date.
      description: |
        Servi par `ticketing`, **projeté selon le rôle** : `grossRevenue` est absent sans
        `canRevenue`. Le volet est ouvert à `artist`, `production` et `treasury`.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Jauge, paliers, tarifs, promotions, provision technique.
          content:
            application/json:
              schema:
                allOf:
