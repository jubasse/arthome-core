  /v1/dates/{dateId}/publication/transitions:
    post:
      operationId: moveDatePublicationState
      tags: [publication]
      summary: Déplace la date dans la machine à états.
      description: |
        **Trois garanties, et aucune n'est une politesse d'interface.**

        1. **Le serveur refuse la transition inverse.** Ne pas l'offrir dans l'interface n'est pas
           une garantie. Le refus porte `TRANSITION_IRREVERSIBLE`, la transition visée **et la
           promesse engagée** en paramètres — `prices_engaged` pour `draft|reserve → scheduled`,
           `replay_sold` pour `ended → replay-online`. **Le verrou porte sur le couple `from > to`,
           pas sur l'état.**
        2. **Elle est conditionnelle et versionnée.** Deux personnes peuvent être sur la fiche :
           une commande partie de `technical` alors que l'état courant est `live` est refusée par
           `STATE_CONFLICT`, **avec l'état et la version courants**. Le studio est multi-opérateurs
           sans verrou ; l'arbitrage est sur le serveur.
        3. **`Idempotency-Key` est obligatoire, pas recommandée** : la transition engage un tarif
           public ou une vente.

        **La porte de publication est servie, pas recalculée** : le refus nomme les éléments
        **manquants** en paramètres, puisque l'écran les compte (« publier — 3 manques »). Jamais
        un pourcentage, que le client calculerait.

        **La tentative de marche arrière est elle-même journalisée** : une tentative de revenir sur
        un tarif engagé est en soi une information de conduite.

        Deux transitions ne sont **pas** des commandes : `technical → live` et `live → ended` sont
        **causées par un événement de `streaming`**. La publication ne commande pas l'antenne, elle
        l'**apprend** — seul `streaming` sait si le flux entre.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, expectedVersion]
              properties:
                to: { type: string, enum: [draft, reserve, scheduled, technical, replay-online] }
                expectedVersion: { type: integer }
                acknowledgedPromiseCode:
                  type: [string, 'null']
                  description: |
                    **Obligatoire pour une transition sans retour.** La confirmation porte le code
                    de la promesse, et son texte vient du contrat : l'interface ne l'invente pas.
                  enum: [prices_engaged, replay_sold, null]
            example: { to: scheduled, expectedVersion: 7, acknowledgedPromiseCode: prices_engaged }
      responses:
        '200':
          description: Transition appliquée. La publication à jour, avec ses nouvelles transitions offertes.
          headers:
            Idempotency-Replayed: { $ref: '#/components/headers/IdempotencyReplayed' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Publication' } }
              example:
                servedAt: '2026-09-21T18:04:00.000Z'
                rightsVersion: 412
                data:
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  state: scheduled
                  orderRank: 3
                  version: 8
                  publishedAt: '2026-09-21T18:04:00Z'
                  pricesLockedAt: '2026-09-21T18:04:00Z'
                  checklist: []
                  offeredTransitions: [{ from: scheduled, to: technical, irreversible: false }]
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            `STATE_CONFLICT` (avec l'état et la version courants), `TRANSITION_IRREVERSIBLE` (avec
            la promesse engagée), ou `PUBLICATION_CHECKLIST_INCOMPLETE` (avec la liste des
            manquants).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error:
                  code: PUBLICATION_CHECKLIST_INCOMPLETE
                  nature: refused
                  params: { missing: [poster, at_least_one_active_price, technical_check_passed] }
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: '2026-09-21T18:04:00.000Z'

  /v1/dates/{dateId}/prices:
    put:
      operationId: setDatePrices
      tags: [ticketing]
      summary: Fixe les tarifs d'une date.
      description: |
        **`ticketing` applique son propre verrou**, il ne demande rien à `catalog` : il refuse dès
        qu'il a consommé `publication.engaged`, avec son propre code et sa propre trace. C'est la
        réponse au reproche « un agrégat à cheval sur trois contextes » — la publication publie un
        fait, chaque propriétaire verrouille ce qu'il possède.

        **« Appliquer à la série » exclut les tarifs** : chaque date engage ses propres acheteurs.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tiers, expectedVersion]
              properties:
                expectedVersion: { type: integer }
                tiers:
                  type: array
                  items:
                    type: object
                    required: [tier, amountMinor, currencyCode, active]
                    properties:
                      tier: { type: string, enum: [full, reduced, support] }
                      amountMinor: { type: integer, minimum: 0 }
                      currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
                      active: { type: boolean }
            example:
              expectedVersion: 12
              tiers:
                - { tier: full, amountMinor: 2400, currencyCode: EUR, active: true }
                - { tier: reduced, amountMinor: 1600, currencyCode: EUR, active: true }
      responses:
        '200':
          description: Tarifs à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/DateSalesPane' } }
              example:
                servedAt: '2026-09-21T18:05:00.000Z'
                rightsVersion: 412
                data: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, capacityTotal: 200, seatsAvailable: 26, priceTiers: [], pricesLocked: false, version: 13 }
        '409':
          description: '`PRICES_LOCKED` quand la publication est engagée, `STATE_CONFLICT` sur version périmée.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: PRICES_LOCKED, nature: refused, params: { lockedAt: '2026-09-21T18:04:00Z' }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:05:00.000Z'

  /v1/dates/{dateId}/capacity-tiers:
    post:
      operationId: openCapacityTier
      tags: [ticketing]
      summary: Ouvre un palier de jauge, et prévient la liste d'attente dans le même geste.
      description: |
        **Une seule commande transactionnelle, pas deux.** Deux appels laisseraient la rareté se
        dissiper entre eux : la fenêtre de priorité (2 h) est un **paramètre de domaine**, servie
        et non recopiée.

        **La jauge s'élargit par paliers et ne se réduit jamais** après la mise en vente : une
        réduction est refusée par `CAPACITY_SHRINK_FORBIDDEN`.

        Au-delà de **10 000 places**, la provision technique est exigée, révisable jusqu'à **72 h**
        avant ; seuil, provision, échéance et exposition au malus sont **des données du contrat**.
      x-arthome-maturity: stable
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [additionalCapacity, expectedVersion]
              properties:
                additionalCapacity: { type: integer, minimum: 1 }
                expectedVersion: { type: integer }
                notifyWaitlist: { type: boolean, default: true }
            example: { additionalCapacity: 50, expectedVersion: 12, notifyWaitlist: true }
      responses:
        '200':
          description: Palier ouvert et liste d'attente prévenue, dans la même transaction.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          sales: { $ref: '#/components/schemas/DateSalesPane' }
                          waitlistNotified: { type: integer }
                          priorityUntil: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T18:06:00.000Z'
                rightsVersion: 412
                data:
                  sales: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, capacityTotal: 250, seatsAvailable: 76, priceTiers: [], pricesLocked: true, version: 13 }
                  waitlistNotified: 12
                  priorityUntil: '2026-09-21T20:06:00Z'
        '409':
          description: '`CAPACITY_SHRINK_FORBIDDEN`, ou `TECHNICAL_PROVISION_REQUIRED` au-delà du seuil.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: TECHNICAL_PROVISION_REQUIRED, nature: refused, params: { threshold: 10000, revisableUntil: '2026-09-18T19:00:00Z' }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:06:00.000Z'

  /v1/dates/{dateId}/chat-policy:
    put:
      operationId: setDateChatPolicy
      tags: [moderation]
      summary: Règle le régime de tchat de la date.
      description: |
        **`chat` applique son propre verrou.** Après engagement de la publication, on peut toujours
        **fermer** un tchat en direct ; on ne peut plus l'**ouvrir davantage**. `chat` le sait
        parce qu'il a consommé l'événement, pas parce qu'il a demandé à `catalog`.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                mode: { type: string, enum: [open, emoji, read_only, off] }
                filterSeverity: { type: string, enum: [low, medium, high] }
                slowModeSec: { type: integer, minimum: 0, maximum: 300 }
                holdersOnly: { type: boolean }
                retroactiveFilter: { type: boolean }
            example: { expectedVersion: 4, mode: emoji, slowModeSec: 10 }
      responses:
        '200':
          description: Régime à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/ChatPolicy' } }
              example:
                servedAt: '2026-09-21T18:07:00.000Z'
                rightsVersion: 412
                data: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, mode: emoji, filterSeverity: medium, slowModeSec: 10, holdersOnly: false, locked: true, version: 5 }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/dates/{dateId}/replay-policy:
    put:
      operationId: setDateReplayPolicy
      tags: [publication]
      summary: Fixe la politique de rediffusion — la promesse faite avant l'achat.
      description: |
        **`none` est définitif pour cette date.** On ne peut pas activer ensuite une rediffusion
        qu'on a promis de ne pas faire : le tarif public en dépendait. Les autres valeurs se
        verrouillent à l'ouverture de la billetterie.

        Le contrat sépare trois choses que les sources confondaient : la **promesse** est à
        `catalog`, la **mise en vente** à `ticketing`, le **fichier et son expiration** à
        `streaming`.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy, expectedVersion]
              properties:
                policy: { type: string, enum: [included, subscription, unit, none] }
                windowHours: { type: [integer, 'null'], minimum: 1 }
                expectedVersion: { type: integer }
            example: { policy: unit, windowHours: 72, expectedVersion: 7 }
      responses:
        '200':
          description: Politique à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/Publication' } }
              example:
                servedAt: '2026-09-21T18:08:00.000Z'
                rightsVersion: 412
                data: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, state: scheduled, orderRank: 3, version: 8, checklist: [], offeredTransitions: [] }
        '409':
          description: '`REPLAY_POLICY_FINAL` quand la politique était `none`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: REPLAY_POLICY_FINAL, nature: refused, params: { currentPolicy: none }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:08:00.000Z'

  /v1/dates/{dateId}:
    delete:
      operationId: deleteDate
      tags: [publication]
      summary: Supprime une date.
      description: |
        **Refusée s'il reste des places vendues**, et le refus porte **le nombre** en paramètre :
        l'écran doit dire « 174 places vendues », pas « impossible ». C'est une règle du domaine,
        pas une garde d'interface, et l'application ne doit pas essayer de la vérifier seule.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Date supprimée.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { deleted: { type: boolean } } }
              example:
                servedAt: '2026-09-21T18:09:00.000Z'
                rightsVersion: 412
                data: { deleted: true }
        '409':
          description: '`DATE_HAS_SOLD_SEATS`, avec le nombre.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: DATE_HAS_SOLD_SEATS, nature: refused, params: { seatsSold: 174 }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T18:09:00.000Z'
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dates/{dateId}/duplicate:
    post:
      operationId: duplicateDate
      tags: [publication]
      summary: Duplique une date, ou l'applique à la série.
      description: |
        **« Appliquer à la série » exclut les tarifs et la jauge** — jamais reportés, parce que
        chaque date engage ses propres acheteurs. Le contrat le dit plutôt que de laisser
        l'interface le deviner.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newDateId, startsAt]
              properties:
                newDateId: { type: string, format: uuid, description: Généré par le domaine côté client. }
                startsAt: { type: string, format: date-time }
                applyToSeries: { type: boolean, default: false }
            example: { newDateId: 019928c1-0000-7000-8000-000000000001, startsAt: '2026-11-05T19:30:00Z' }
      responses:
        '201':
          description: Nouvelle date créée, **sans** les tarifs ni la jauge de l'originale.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/DateSheet' } }
              example:
                servedAt: '2026-09-21T18:10:00.000Z'
                rightsVersion: 412
                data:
                  dateId: 019928c1-0000-7000-8000-000000000001
                  channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                  title: Nuit blanche
                  startsAt: '2026-11-05T19:30:00Z'
                  openPanes: [public, tickets]
                  publication: { dateId: 019928c1-0000-7000-8000-000000000001, state: draft, orderRank: 1, version: 1, checklist: [], offeredTransitions: [] }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/dates/{dateId}/outcome:
    post:
      operationId: decideDateOutcome
      tags: [publication]
      summary: Déclare l'issue d'une date — reporter, annuler, interrompre.
      description: |
        **Réservée au propriétaire et à la production.** Les autres rôles ne peuvent que
        **signaler**. Une décision d'issue vaut plusieurs milliers d'euros, et le journal est
        nominatif.

        **Un événement, quatre conséquences, et aucun des quatre consommateurs ne parle aux
        autres** : `ticketing` rembourse (annulée) / crédite (interrompue) / **ne bouge pas**
        (reportée — la place suit la nouvelle date) ; `payouts` retient ; `catalog` remplace
        l'état **sur chaque carte**, pas seulement sur la fiche ; `notifications` prévient les
        détenteurs.

        **Une issue déclarée est un fait : jamais réécrite, jamais effacée.**

        Le message de la régie voyage **avec sa langue de rédaction** : c'est du contenu, pas une
        clé i18n.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, message, expectedVersion]
              properties:
                outcome: { type: string, enum: [postponed, cancelled, interrupted] }
                message:
                  type: object
                  required: [contentLanguage, text]
                  properties:
                    contentLanguage: { type: string }
                    text: { type: string, maxLength: 600 }
                rescheduledTo:
                  type: [string, 'null']
                  format: date-time
                  description: '**Exigé et seulement permis** pour `postponed`.'
                expectedVersion: { type: integer }
            example:
              outcome: postponed
              message: { contentLanguage: fr, text: 'Report au 4 novembre. Vos places restent valables.' }
              rescheduledTo: '2026-11-04T19:30:00Z'
              expectedVersion: 8
      responses:
        '200':
          description: Issue déclarée, et ce qu'elle implique pour les détenteurs.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          outcome: { type: string }
                          declaredAt: { type: string, format: date-time }
                          moneyEffectCode:
                            type: string
                            description: '`full_refund` · `account_credit` · `no_movement`. Un **code**, jamais une phrase.'
                          affectedSeats: { type: integer }
              example:
                servedAt: '2026-09-21T20:50:00.000Z'
                rightsVersion: 412
                data: { outcome: postponed, declaredAt: '2026-09-21T20:50:00Z', moneyEffectCode: no_movement, affectedSeats: 174 }
        '403':
          description: '`OUTCOME_DECISION_FORBIDDEN` — ce rôle ne peut que signaler.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: OUTCOME_DECISION_FORBIDDEN, nature: refused, params: { canEscalateTo: [artist, production] }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T20:50:00.000Z'
        '409': { $ref: '#/components/responses/Conflict' }

  # =============================================================== conduite du direct

  /v1/dates/{dateId}/run:
    get:
      operationId: getRunConsole
      tags: [run]
      summary: L'état de la conduite — un appel, tout l'écran de régie.
      description: |
        **La voie de retour réellement ouverte est servie** (`monitorPath`) : le studio doit le
        **savoir** pour ne pas promettre à l'opérateur une latence qu'il n'a pas. Le contrat porte
        la vérité, pas l'uniformité — créer une branche média pour uniformiser un schéma coûterait
        plus qu'il ne rapporte.

        **Deux champs, pas un** : `state` et `afterGracePeriod`. Le studio distingue « accroc
        amorti » de « publieur parti », et une coupure réseau de deux secondes en salle ne doit
        produire ni incident ni manifeste reparti de zéro.

        **La clé de flux n'est jamais ici** : elle ne figure dans aucune charge utile de liste.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: La console.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/RunConsole' } }
              example:
                servedAt: '2026-09-21T19:20:00.000Z'
                validUntil: '2026-09-21T19:20:15.000Z'
                rightsVersion: 412
                data:
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  state: on_air
                  afterGracePeriod: true
                  ingestProtocol: rtmps
                  monitorPath: ll_hls
                  monitorUrl: 'https://monitor.arthome.fr/a9f1c0/index.m3u8'
                  qualityLadder: [{ renditionId: '1080p', heightPx: 1080, enabled: true }]
                  startedAt: '2026-09-21T19:00:12Z'
                  lastSample:
                    measuredAt: '2026-09-21T19:19:57Z'
                    source: ingest_server
                    ingestUpKbps: 8900
                    latencyMs: null
                    droppedPct: 0.1
                    viewers: 1842
                  incident: null
                  chapters: []
                  chatThroughputPerMinute: 41
                  version: 3
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dates/{dateId}/run/technical-check:
    post:
      operationId: runTechnicalCheck
      tags: [run]
      summary: Lance le contrôle technique.
      description: |
        Son succès **déverrouille la publication** : `technical_check_passed` est l'un des sept
        éléments de la liste de contrôle, et il vient d'ici. `catalog` le **projette**, il ne le
        demande pas. `idle → on_air` est refusé tant que le contrôle n'est jamais passé.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Résultat du contrôle, et la liste de pré-vol.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          passed: { type: boolean }
                          passedAt: { type: [string, 'null'], format: date-time }
                          failures: { type: array, items: { type: string } }
                          sample: { $ref: '#/components/schemas/HealthSample' }
              example:
                servedAt: '2026-09-21T18:45:00.000Z'
                rightsVersion: 412
                data:
                  passed: true
                  passedAt: '2026-09-21T18:45:00Z'
                  failures: []
                  sample: { measuredAt: '2026-09-21T18:44:58Z', source: ingest_server, ingestUpKbps: 9100 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/dates/{dateId}/run/state:
    put:
      operationId: setRunState
      tags: [run]
      summary: Passe à l'antenne, répète, ou coupe la diffusion.
      description: |
        **La commande « passer à l'antenne » va à `streaming`, pas à `catalog`** : seul `streaming`
        sait si le flux entre. La publication l'**apprend** ensuite, par événement — deux
        transitions sur huit sont causées ainsi, ce qui laisse `Publication` agrégat d'un seul
        contexte.

        `idle → on_air` est **refusé** si le contrôle technique n'est jamais passé.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, expectedVersion]
              properties:
                state: { type: string, enum: [idle, rehearsal, on_air, ended] }
                expectedVersion: { type: integer }
            example: { state: on_air, expectedVersion: 3 }
      responses:
        '200':
          description: La console à jour.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/RunConsole' } }
              example:
                servedAt: '2026-09-21T19:00:12.000Z'
                rightsVersion: 412
                data: { dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001, state: on_air, afterGracePeriod: true, ingestProtocol: rtmps, monitorPath: ll_hls, version: 4 }
        '409':
          description: '`TECHNICAL_CHECK_REQUIRED`, ou `STATE_CONFLICT`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: TECHNICAL_CHECK_REQUIRED, nature: refused, params: {}, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
                servedAt: '2026-09-21T19:00:12.000Z'

