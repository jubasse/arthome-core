                    params: { reasonCode: two_factor_missing },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T18:21:00.000Z"

  /v1/channels/{channelId}:
    delete:
      operationId: deleteChannel
