                    properties:
                      data: { type: object, properties: { deleted: { type: boolean } } }
              example:
                servedAt: "2026-09-21T19:47:00.000Z"
                rightsVersion: 412
                data: { deleted: true }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/dates/{dateId}/incidents:
    post:
      operationId: raiseIncident
      tags: [run]
      summary: Declares an incident and broadcasts the holding screen.
      description: |
        **A client-side veil, never a stream switch**: the control plane publishes the state, the
        player displays it **over an untouched video**. Instant, identical on all three storefronts,
        and the media stays intact for the resume.

        **Cause and outcome are two vocabularies**, and separating them was necessary: the four
        entries in the sources are **outcomes**, while the mobile control room distinguished three
        more **causes** that existed nowhere.

        The message travels **with its authoring language**. The catalogue supplies **templates** per
        kind of incident, which the control room reuses or replaces.

        **Broadcast latency: ≤ 2 s, non-negotiable** — the client-side veil depends on it.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incidentId, kind, cause, message]
              properties:
                incidentId: { type: string, format: uuid }
                kind: { type: string, enum: [hold_screen, postponed, cancelled, interrupted] }
                cause:
                  type: string
                  enum:
                    [
                      venue_feed_lost,
                      run_desk_disconnected,
                      bitrate_collapsed,
                      compatibility_worker_failed,
                      provider_error,
                      manual,
                    ]
                message:
                  type: object
                  required: [contentLanguage, text]
                  properties:
                    contentLanguage: { type: string }
                    text: { type: string, maxLength: 400 }
            example:
              incidentId: 019928d1-0000-7000-8000-000000000001
              kind: hold_screen
              cause: venue_feed_lost
              message:
                {
                  contentLanguage: fr,
                  text: "Interruption technique. Nous reprenons dans quelques instants.",
                }
      responses:
        "201":
          description: Incident raised, broadcast in under two seconds.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/StudioIncident" } }
              example:
                servedAt: "2026-09-21T19:52:00.000Z"
                rightsVersion: 412
                data:
                  id: 019928d1-0000-7000-8000-000000000001
                  kind: hold_screen
                  cause: venue_feed_lost
                  trigger: manual
                  message:
                    {
                      contentLanguage: fr,
                      text: "Interruption technique. Nous reprenons dans quelques instants.",
                    }
                  raisedAt: "2026-09-21T19:52:00Z"
                  raisedBy:
                    {
                      personId: 019928b0-0000-7000-8000-000000000001,
                      displayName: "Claire D.",
                      surface: studio-mobile,
                    }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/incidents/{incidentId}/resolve:
    post:
      operationId: resolveIncident
      tags: [run]
      summary: Resolves the incident and lifts the veil.
      description: |
        The player **lifts the veil** without asking for a new playback token: otherwise the resume
        would be paid for with a stream reload, on media that was never cut.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Incident resolved.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          resolvedAt: { type: string, format: date-time }
              example:
                servedAt: "2026-09-21T19:56:00.000Z"
                rightsVersion: 412
                data: { resolvedAt: "2026-09-21T19:56:00Z" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/incidents/{incidentId}/escalate:
    post:
      operationId: escalateIncidentToProduction
      tags: [run]
      summary: Escalation to production — the gesture of the roles that do not decide.
      description: |
        **What a role without `canDecideOutcome` can do.** It declares no outcome; it reports, and
        the alert is **routed by role and by channel, server-side**. Without this gesture, the only
        recourse of a stage manager alone in a room would be to phone someone.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 400 }
            example: { note: "Flux perdu depuis 4 minutes, la salle ne répond pas." }
      responses:
        "202":
          description: Escalation routed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          routedToRoles: { type: array, items: { type: string } }
              example:
                servedAt: "2026-09-21T19:57:00.000Z"
                rightsVersion: 412
                data: { routedToRoles: [artist, production] }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/dates/{dateId}/stream-key/reveal:
    post:
      operationId: revealStreamKey
      tags: [run]
      summary: Reveals the stream key — a separate command, audited, by name.
      description: |
        **It is a secret displayed on a phone, in a room, often in front of a contractor.** Four
        guarantees, and they are in the contract because none of them is verifiable client-side:

        - the key is **never** in a list payload;
        - revealing it is **this command**, separate, audited and by name;
        - the response carries **`Cache-Control: no-store`** — it must end up neither in the phone's
          HTTP cache, nor in the application snapshot the OS takes when it goes to the background;
        - **assignment to the `director` slot**, which grants access to the key, is reserved to
          `artist ∨ production`.

        **Re-authentication required**: this is a sensitive operation, and it is asked for **at the
        moment of the operation**, never on returning to a screen.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauthToken]
              properties:
                reauthToken:
                  {
                    type: string,
                    description: Single-use re-authentication token,
                    de courte durée.,
                  }
            example: { reauthToken: ott_9f2ac1 }
      responses:
        "200":
          description: The key, once, uncached.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
              description: Non-negotiable. It is what keeps the secret out of the cache and out of the app snapshot.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/StreamKeyReveal" } }
              example:
                servedAt: "2026-09-21T18:40:00.000Z"
                rightsVersion: 412
                data:
                  streamKey: sk_live_9f2ac1b4
                  ingestUrl: "rtmps://ingest.arthome.fr/live"
                  revealedAt: "2026-09-21T18:40:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/dates/{dateId}/stream-key/rotate:
    post:
      operationId: rotateStreamKey
      tags: [run]
      summary: Rotates the stream key — the old one stops broadcasting at once.
      description: |
        **Immediate**, and the contract says so: the old key stops broadcasting at once. Rotating
        **during a live show** cuts the ingest in progress — the refusal carries a distinct code
        (`STREAM_KEY_ROTATION_DURING_RUN`) rather than silently executing a command whose consequence
        is dead air.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauthToken]
              properties:
                reauthToken: { type: string }
                confirmDuringRun: { type: boolean, default: false }
            example: { reauthToken: ott_9f2ac1, confirmDuringRun: false }
      responses:
        "200":
          description: New key issued.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/StreamKeyReveal" } }
              example:
                servedAt: "2026-09-21T18:41:00.000Z"
                rightsVersion: 412
                data:
                  {
                    streamKey: sk_live_4d77e2,
                    ingestUrl: "rtmps://ingest.arthome.fr/live",
                    revealedAt: "2026-09-21T18:41:00Z",
                  }
        "409":
          description: "`STREAM_KEY_ROTATION_DURING_RUN` — confirm explicitly, or wait until the end."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: STREAM_KEY_ROTATION_DURING_RUN,
                    nature: refused,
                    params: { runState: on_air },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T19:41:00.000Z"

  # =============================================================== moderation

  /v1/channels/{channelId}/moderation/queue:
    get:
      operationId: listModerationQueue
      tags: [moderation]
      summary: The moderation queue — **by cursor**, the first exception to page + total.
      description: |
        **A moderation queue grows while it is being read.** Offset pagination duplicates rows there
        and skips others — **mechanically, not exceptionally**. It is a stream, even hosted in the
        studio, hence a cursor (D-010).

        The **separate total** (`pendingCount`) feeds the badge: it is not counted over the current
        page, otherwise the bottom bar would display the number of rows loaded.

        **Other people's claims are visible**: `claimedBy` and `claimExpiresAt` arrive on the same
        channel, with the name of whoever is acting. Without that, two moderators work blind to each
        other and collide on every row.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: dateId
          in: query
          schema: { type: string, format: uuid }
        - name: filter
          in: query
          schema: { type: string, enum: [all, pending, settled], default: pending }
        - name: q
          in: query
          description: '**Server-side** search on the nickname and the text.'
          schema: { type: string }
      responses:
        "200":
          description: A page of the queue, plus the total for the badge.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/ModerationItem" } }
                      page: { $ref: "#/components/schemas/CursorPageInfo" }
              example:
                servedAt: "2026-09-21T19:30:00.000Z"
                rightsVersion: 412
                lastEventSeq: 8812
                items:
                  - id: 019928e0-0000-7000-8000-000000000001
                    messageId: 019928f8-0000-7000-8000-000000000009
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                    state: reported
                    reason: harassment
                    reportsCount: 3
                    atMediaSec: 1812
                    sentAt: "2026-09-21T19:29:42Z"
                    authorHandle: "@anon.7742"
                    authorSanction: none
                    body: { contentLanguage: fr, text: "…" }
                    origin: human_verdict
                    version: 1
                page:
                  { hasMore: true, nextCursor: eyJjIjoiMjAyNi0wOS0yMVQxOTozMCJ9, pendingCount: 14 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410": { $ref: "#/components/responses/Gone" }

  /v1/moderation/items/{itemId}/claim:
    post:
      operationId: claimModerationItem
      tags: [moderation]
      summary: Claims a row — a lease, not a write.
      description: |
        **"Taking charge is not deciding."** It is a **short lease**, renewed while the person is
        present and **released by the server** on expiry: a moderator whose phone dies does not freeze
        a row for the whole live show.

        **Never queued offline**: replayed on reconnection, it would claim a row someone else has
        already handled.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Lease taken, with the instant it expires.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/ModerationItem" } }
              example:
                servedAt: "2026-09-21T19:30:10.000Z"
                rightsVersion: 412
                data:
                  id: 019928e0-0000-7000-8000-000000000001
                  messageId: 019928f8-0000-7000-8000-000000000009
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  state: claimed
                  reportsCount: 3
                  atMediaSec: 1812
                  claimedBy:
                    {
                      personId: 019928b0-0000-7000-8000-000000000001,
                      displayName: "Claire D.",
                      surface: studio-mobile,
                    }
                  claimExpiresAt: "2026-09-21T19:32:10Z"
                  version: 2
                  decisionVersion: 0
        "409":
          description: "`MODERATION_ALREADY_CLAIMED`, with the name of whoever holds the lease."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: MODERATION_ALREADY_CLAIMED,
                    nature: refused,
                    params: { claimedBy: "Yann P.", claimExpiresAt: "2026-09-21T19:32:00Z" },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T19:30:10.000Z"
    delete:
      operationId: releaseModerationItem
      tags: [moderation]
      summary: Releases the claim.
      description: Speeds up the release; **nothing depends on it**, the lease expires by itself.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Row released.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/ModerationItem" } }
              example:
                servedAt: "2026-09-21T19:31:00.000Z"
                rightsVersion: 412
                data:
                  {
                    id: 019928e0-0000-7000-8000-000000000001,
                    messageId: 019928f8-0000-7000-8000-000000000009,
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001,
                    state: reported,
                    reportsCount: 3,
                    atMediaSec: 1812,
                    version: 3,
                  }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/moderation/items/{itemId}/verdict:
    post:
      operationId: settleModerationItem
      tags: [moderation]
      summary: Renders a verdict — conditional, never a blind idempotent write.
      description: |
        **The second verdict is refused, and the refusal carries the winning decision** — author
        **and** verdict — so the screen can display "X has already deleted this message" instead of a
        bare failure. A bare refusal would force a second round trip in the middle of a live show.

        **This is why the command is conditional** (`expectedVersion`) and **not** a blind idempotent
        write: an idempotent replay would overwrite the first verdict, which is exactly the opposite
        of the rule.

        **Two of the four verdicts bear on the person, not on the message**: `mute` and `ban` compose
        with the channel sanction. The three axes — message state, nature of the queue row, sanction
        on the person — never stack.

        **Queued offline**, together with sanctions on a named person, and **nothing else**: it is the
        one gesture on shift that a basement 4G must be able to defer.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict, expectedDecisionVersion]
              properties:
                verdict: { type: string, enum: [publish, remove, mute, ban] }
                expectedDecisionVersion:
                  type: integer
                  description: |
                    **The settlement axis, not the lease axis.** A verdict is accepted as long as
                    no other verdict has been rendered — including when a colleague holds the row
                    claimed. Refused only by `MODERATION_ALREADY_SETTLED`, which carries the winning
                    verdict and its author.
                reason: { type: string, enum: [spam, insult, spoiler, off-topic, harassment] }
                muteUntil:
                  type: [string, "null"]
                  format: date-time
                  description: "**An instant**, never a label. Absent = no limit."
                expectedVersion: { type: integer }
            example:
              {
                verdict: mute,
                reason: harassment,
                muteUntil: "2026-09-21T20:30:00Z",
                expectedDecisionVersion: 0,
              }
      responses:
        "200":
          description: Verdict rendu.
          content:
