              example:
                servedAt: '2026-09-21T18:03:20.000Z'
                rightsVersion: 412
                data:
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  capacityTotal: 200
                  seatsAvailable: 26
