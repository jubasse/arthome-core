        required: true
        content:
          application/json:
            schema:
              type: object
              required: [measuredAt]
              properties:
                measuredAt: { type: string, format: date-time }
                latencyMs: { type: [integer, 'null'] }
                deviceUpKbps: { type: [integer, 'null'] }
                jitterMs: { type: [integer, 'null'] }
            example: { measuredAt: '2026-09-21T19:20:00Z', latencyMs: 820, deviceUpKbps: 4100 }
      responses:
        '202':
          description: Mesure prise en compte. Écriture tolérante à la perte, sans clé d'idempotence.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data: { type: object, properties: { accepted: { type: boolean } } }
              example:
                servedAt: '2026-09-21T19:20:01.000Z'
                rightsVersion: 412
                data: { accepted: true }
        '404': { $ref: '#/components/responses/NotFound' }

