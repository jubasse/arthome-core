                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          ingestUrl: { type: string, format: uri }
                          recommendedProtocol:
                            { type: string, x-arthome-vocabulary: [rtmps, srt, whip], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A transport or media capability, not a domain notion: the domain never chooses an ingest protocol, a container or a DRM system, and a new one appears because a device appeared." }
                          recommendedBitrateKbps: { type: integer }
                          lastMeasuredUpKbps: { type: [integer, "null"] }
