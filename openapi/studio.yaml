        Two tabs, one path. The `stats_csv` export already existed: **one could export a statistic
        one could not read.**

        The screen's title varies with the role — "Audience and revenue" under `canRevenue`,
        "Audience" otherwise — and it is the **projection** that decides it: without `canRevenue`, the
        revenue fields are **absent**, not masked.

        **Where viewers came from is not served**: see `StatsAudience`. It is the only point on these
        two screens that required a datum the system produces nowhere.
      x-arthome-maturity: provisional
      x-arthome-upstream: [catalog, ticketing, streaming]
