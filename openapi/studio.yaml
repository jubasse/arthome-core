      summary: A channel's replay catalogue — online and archived.
      description: |
        `reopenReplayWindow` allowed you to **reopen a window you could not see**. It is also the
        screen where you notice that a window closes in twenty-four hours — which the inbox already
        announces with an alert.

        Page + total, like every stable collection in the studio.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming, catalog, ticketing]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortDir"
        - name: state
          in: query
          schema: { type: string, enum: [online, expired, archived] }
      responses:
        "200":
          description: A page of replays, **projected according to the role** — revenue is absent without `canRevenue`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [items, page]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [dateId, title, state]
                          properties:
                            dateId: { type: string, format: uuid }
                            title: { type: string }
                            state:
                              { type: string, x-arthome-vocabulary: [online, expired, archived] }
                            expiresAt: { type: [string, "null"], format: date-time }
                            durationSec: { type: [integer, "null"] }
                            views: { type: [integer, "null"] }
                            revenue:
                              allOf: [{ $ref: "#/components/schemas/Money" }]
                              description: "**Absent** without `canRevenue`."
                      page: { $ref: "#/components/schemas/OffsetPageInfo" }
              example:
                servedAt: "2026-09-21T18:13:00.000Z"
                rightsVersion: 412
                items:
                  - {
                      dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001,
                      title: Nuit blanche,
                      state: online,
                      expiresAt: "2026-09-24T22:00:00Z",
                      durationSec: 5700,
                      views: 412,
                    }
                page: { page: 1, pageSize: 20, totalItems: 18, totalPages: 1 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/channels/{channelId}/ticketing:
    get:
      operationId: getChannelTicketing
      tags: [ticketing]
      summary: Ticketing at channel level — breakdown, waiting list, and the requests in flight.
      description: |
        The commands existed (`refundSeat`, `issueComplimentary`); **the collection they act on did
        not**. The "requests in flight" are the three the screen lists — refund, seat transfer, bank
        dispute — and two of them had no read surface at all.

        **Reserved to roles with `canRevenue`**: the whole page, not only its columns.
      x-arthome-maturity: provisional
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Breakdown by price tier, waiting lists, complimentary tickets, requests in flight.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          byTier:
                            type: array
                            items:
                              type: object
                              properties:
                                tier:
                                  { type: string, x-arthome-vocabulary: [full, reduced, support] }
                                seatsSold: { type: integer }
                                gross: { $ref: "#/components/schemas/Money" }
                          waitlistByDate:
                            type: array
                            items:
                              type: object
                              properties:
                                dateId: { type: string, format: uuid }
                                title: { type: string }
                                waitlistCount: { type: integer }
                          complimentaries:
                            type: array
                            items:
                              type: object
                              properties:
                                categoryId: { type: string }
                                issued: { type: integer }
                                allocated: { type: integer }
                          pendingRequests:
                            type: array
                            description: |
                              **The three kinds, in a single collection**: a refund requested, a
                              seat transfer to authorise, a bank dispute to answer within 24 h.
                              Two of them had no read path.
                            items:
                              type: object
                              required: [requestId, kind, openedAt]
                              properties:
                                requestId: { type: string, format: uuid }
                                kind:
                                  {
                                    type: string,
                                    x-arthome-vocabulary: [refund, seat_transfer, chargeback],
                                  }
                                dateId: { type: [string, "null"], format: uuid }
                                seatId: { type: [string, "null"], format: uuid }
                                amount: { $ref: "#/components/schemas/Money" }
                                openedAt: { type: string, format: date-time }
                                respondBy: { type: [string, "null"], format: date-time }
              example:
                servedAt: "2026-09-21T18:14:00.000Z"
                rightsVersion: 412
                data:
                  byTier:
                    [
                      {
                        tier: full,
                        seatsSold: 174,
                        gross: { amountMinor: 417600, currencyCode: EUR },
                      },
                    ]
                  waitlistByDate:
                    [
                      {
                        dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001,
                        title: Nuit blanche,
                        waitlistCount: 12,
                      },
                    ]
                  complimentaries: []
                  pendingRequests:
                    - {
                        requestId: 019928ea-0000-7000-8000-000000000001,
                        kind: chargeback,
                        seatId: 019928f5-0000-7000-8000-000000000001,
                        amount: { amountMinor: 2400, currencyCode: EUR },
                        openedAt: "2026-09-21T09:00:00Z",
                        respondBy: "2026-09-22T09:00:00Z",
                      }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/channels/{channelId}/settings:
    get:
      operationId: getChannelSettings
      tags: [channel]
      summary: A channel's settings — the screen had nothing to read before writing.
      description: |
        `PATCH /channels/{id}/identity` existed **without a GET**. Two further blocks that had no
        carrier join it: the **moderation defaults**, and the **merchant integration** — one at a time
        per channel.

        The moderation block settles a defect the surface named: `filterSeverity`, `slowModeSec`,
        `holdersOnly` and `retroactiveFilter` lived **only** on `PUT /dates/{id}/chat-policy`, hence
        **per date, with a date's `expectedVersion`**. Yet off air there is no date to point at, and
        the design says the opposite in so many words: *"the dictionary, the severity and the
        sanctions stay editable off air — they will apply to the next live show"*. The dictionary was
        already at channel level; the other three were not.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog, chat, streaming, ticketing]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Public identity, moderation defaults, broadcast defaults, merchant integration.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          identity:
                            type: object
                            properties:
                              publicName: { type: string }
                              slug: { type: string }
                              categoryId: { type: string }
                              verified: { type: boolean }
                              version: { type: integer }
                          moderationDefaults:
                            type: object
                            description: |
                              **Inherited by a new date at creation**, never applied retroactively
                              to an existing date — otherwise a channel setting would change the
                              regime of a live show in progress.
                            properties:
                              filterSeverity:
                                { type: string, x-arthome-vocabulary: [low, medium, high] }
                              slowModeSec: { type: integer }
                              holdersOnly: { type: boolean }
                              retroactiveFilter: { type: boolean }
                              chatMode:
                                {
                                  type: string,
                                  x-arthome-vocabulary: [open, emoji, read_only, off],
                                }
                              version: { type: integer }
                          merchIntegration:
                            type: [object, "null"]
                            description: "**One at a time.** `null` when the shop is served by Arthome."
                            properties:
                              source:
                                {
                                  type: string,
                                  x-arthome-vocabulary:
                                    [shopify, woocommerce, prestashop, drupal, api],
                                }
                              merchantUrl: { type: string, format: uri }
                              connectedAt: { type: string, format: date-time }
                              lastSyncedAt: { type: [string, "null"], format: date-time }
              example:
                servedAt: "2026-09-21T18:49:00.000Z"
                rightsVersion: 412
                data:
                  identity:
                    {
                      publicName: Compagnie Verticale,
                      slug: compagnie-verticale,
                      categoryId: dance-contemporary,
                      verified: true,
                      version: 5,
                    }
                  moderationDefaults:
                    {
                      filterSeverity: medium,
                      slowModeSec: 0,
                      holdersOnly: false,
                      retroactiveFilter: true,
                      chatMode: open,
                      version: 2,
                    }
                  merchIntegration: null
        "403": { $ref: "#/components/responses/Forbidden" }

    patch:
      operationId: updateChannelSettings
      tags: [channel]
      summary: Writes a channel's moderation and broadcast defaults.
      description: |
        **The write counterpart of `getChannelSettings`** — without it I had just created a
        read-only screen, that is, exactly the defect this batch corrects elsewhere.

        It settles the **off-air** gesture: filter severity, slow mode and holders-only are set here,
        at channel level, with no date to point at. The public identity stays on its own path,
        because it is a pure `catalog` write and because a channel's two faces never mix.

        **The defaults are inherited when a date is created, never applied retroactively**: a channel
        setting does not change the regime of a live show in progress.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat, streaming]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                moderationDefaults:
                  type: object
                  properties:
                    filterSeverity: { type: string, enum: [low, medium, high] }
                    slowModeSec: { type: integer, minimum: 0, maximum: 300 }
                    holdersOnly: { type: boolean }
                    retroactiveFilter: { type: boolean }
                    chatMode: { type: string, enum: [open, emoji, read_only, off] }
                broadcastDefaults:
                  type: object
                  properties:
                    ingestProtocol: { type: string, enum: [rtmps, srt, whip] }
                    holdScreenAutoAfterSec: { type: integer, minimum: 5, maximum: 120 }
            example:
              { expectedVersion: 2, moderationDefaults: { filterSeverity: high, slowModeSec: 5 } }
      responses:
        "200":
          description: Settings up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
              example:
                servedAt: "2026-09-21T18:49:30.000Z"
                rightsVersion: 412
                data:
                  moderationDefaults:
                    {
                      filterSeverity: high,
                      slowModeSec: 5,
                      holdersOnly: false,
                      retroactiveFilter: true,
                      chatMode: open,
                      version: 3,
                    }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/channels/{channelId}/journal:
    get:
      operationId: listChannelJournal
      tags: [channel]
      summary: The audit log — page + total, **mandatory period filter**.
      description: |
        **The audit log stays on page + total** (D-010), with a **mandatory period filter**. Nobody
        pages to the 50,000th entry of a 24-month log: you filter by period first, which keeps the
        page numbers — the affordance wanted — and stays fast. Moving to a cursor would trade a
        problem we do not have against the loss of what we wanted.

        `from` and `to` are **required**, and too wide a range is refused with
        `PERIOD_FILTER_REQUIRED`, with the maximum range as a parameter.

        It **names names and places them**, kept for 24 months. The **attempts** to walk back a
        committed transition appear in it: that is in itself a piece of operational information.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      # One call, not five. The audit log is attached to `identity` as a read model fed
      # ONLY by Kafka consumption: a single owner holds the exact total, the projection
      # by role and the sort, with no join at query time and without the BFF acquiring a
      # table of its own. The fan-out exception that used to stand here has no object any
      # more — and the system now has none at all, which is better than declaring one.
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: nature
          in: query
          schema: { type: string, enum: [air, mod, event, access, money] }
        - name: dateId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A page of the log, **projected according to the role** — the `money` kind is absent without `canRevenue`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } }
                      page: { $ref: "#/components/schemas/OffsetPageInfo" }
              example:
                servedAt: "2026-09-21T18:38:00.000Z"
                rightsVersion: 412
                items:
                  - id: 019928e7-0000-7000-8000-000000000001
                    nature: event
                    occurredAt: "2026-09-21T18:04:00Z"
                    actor:
                      {
                        personId: 019928b0-0000-7000-8000-000000000001,
                        displayName: "Claire D.",
                        surface: studio-web,
                      }
                    code: publication.transition.applied
                    params: { from: reserve, to: scheduled }
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                page: { page: 1, pageSize: 20, totalItems: 812, totalPages: 41 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/channels/{channelId}/exports:
    post:
      operationId: requestChannelExport
      tags: [payouts]
      summary: Requests an export — sales journal, FEC, Sage, Cegid, grouped invoices.
      description: |
        **An asynchronous job** (BullMQ **internal to its service**), never a synchronous download:
        over 24 months that is not tenable. The URL returned is **signed, short-lived, and usable
        without a session cookie** — an export protected by a cookie is undownloadable from the native
        shell.
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts, catalog, chat]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, from, to]
              properties:
                kind:
                  {
                    type: string,
                    enum:
                      [
                        sales_csv,
                        fec,
                        sage,
                        cegid,
                        grouped_invoices,
                        journal,
                        schedule_ics,
                        stats_csv,
                      ],
                  }
                from: { type: string, format: date }
                to: { type: string, format: date }
            example: { kind: fec, from: "2026-09-01", to: "2026-09-30" }
      responses:
        "202":
          description: Export mis en file.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/ExportJob" } }
              example:
                servedAt: "2026-09-21T18:39:00.000Z"
                rightsVersion: 412
                data:
                  {
                    exportId: 019928e8-0000-7000-8000-000000000001,
                    kind: fec,
                    state: queued,
                    requestedAt: "2026-09-21T18:39:00Z",
                  }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/exports/{exportId}:
    get:
      operationId: getChannelExport
      tags: [payouts]
      summary: An export's state, and its signed URL once it is ready.
      description: '"Until it is `ready`, `downloadUrl` is null: the contract never serves an address that would not answer."'
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - name: exportId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: The export's state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/ExportJob" } }
              example:
                servedAt: "2026-09-21T18:44:00.000Z"
                rightsVersion: 412
                data:
                  exportId: 019928e8-0000-7000-8000-000000000001
                  kind: fec
                  state: ready
                  requestedAt: "2026-09-21T18:39:00Z"
                  downloadUrl: "https://files.arthome.fr/exports/019928e8?sig=abc"
                  downloadExpiresAt: "2026-09-21T19:44:00Z"
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/uploads:
    post:
      operationId: createUploadTicket
      tags: [channel]
      summary: Obtains a signed upload URL for a binary.
      description: |
        **Never `multipart` from a WebView.** A JSON command returns a signed upload URL, valid for
        **15 minutes** — long enough for a room's 4G, short enough not to be an access token in
        disguise.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, contentType, sizeBytes]
              properties:
                purpose: { type: string, enum: [poster, wide, avatar, merch_image] }
                contentType: { type: string, enum: ["image/jpeg", "image/png", "image/webp"] }
                sizeBytes: { type: integer, minimum: 1, maximum: 20971520 }
            example: { purpose: poster, contentType: "image/jpeg", sizeBytes: 842000 }
      responses:
        "201":
          description: Signed upload URL.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/UploadTicket" } }
              example:
                servedAt: "2026-09-21T18:45:00.000Z"
                rightsVersion: 412
                data:
                  assetId: 019928e9-0000-7000-8000-000000000001
                  uploadUrl: "https://uploads.arthome.fr/putt/019928e9"
                  fields: { policy: eyJ..., signature: abc }
                  expiresAt: "2026-09-21T19:00:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/channels/{channelId}/merch-items:
    get:
      operationId: listChannelMerchItems
      tags: [channel]
      summary: The channel's shop catalogue.
      description: "**Unpaginated** — dozens of items. One external integration at a time per channel."
      x-arthome-maturity: provisional
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/MerchItemAdmin" } }
              example:
                servedAt: "2026-09-21T18:46:00.000Z"
                rightsVersion: 412
                items:
                  - id: 019928a0-7d31-7a10-b8c4-2f9e11a4d001
                    label: { contentLanguage: fr, text: "T-shirt Nuit blanche" }
                    variants:
                      [
                        {
                          id: M,
                          label: M,
                          stock: 24,
                          price: { amountMinor: 2500, currencyCode: EUR },
                        },
                      ]
                    state: on_sale
                    source: arthome
                    version: 3
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: upsertMerchItem
      tags: [channel]
      summary: Creates or updates a shop item.
      description: |
        **An item without a variant is not sellable.** The label is **bilingual**; the absence of an
        English label in the sources is a **data gap** to be filled during the port, not a translation
        gap.
      x-arthome-maturity: provisional
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, labels, variants]
              properties:
                itemId: { type: string, format: uuid }
                showId: { type: [string, "null"], format: uuid }
                labels:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [contentLanguage, text]
                    properties:
                      contentLanguage: { type: string }
                      text: { type: string }
                variants:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, label, stock, priceMinor, currencyCode]
                    properties:
                      id: { type: string }
                      label: { type: string }
                      stock: { type: integer, minimum: 0 }
                      priceMinor: { type: integer, minimum: 0 }
                      currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
                expectedVersion: { type: [integer, "null"] }
            example:
              itemId: 019928a0-7d31-7a10-b8c4-2f9e11a4d001
              labels:
                [
                  { contentLanguage: fr, text: "T-shirt Nuit blanche" },
                  { contentLanguage: en, text: "Nuit blanche tee" },
                ]
              variants: [{ id: M, label: M, stock: 24, priceMinor: 2500, currencyCode: EUR }]
              expectedVersion: 3
      responses:
        "200":
          description: Item up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/MerchItemAdmin" } }
              example:
                servedAt: "2026-09-21T18:47:00.000Z"
                rightsVersion: 412
                data:
                  id: 019928a0-7d31-7a10-b8c4-2f9e11a4d001
                  label: { contentLanguage: fr, text: "T-shirt Nuit blanche" }
                  variants:
                    [
                      {
                        id: M,
                        label: M,
                        stock: 24,
                        price: { amountMinor: 2500, currencyCode: EUR },
                      },
                    ]
                  state: on_sale
                  source: arthome
                  version: 4
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/dates/{dateId}/merch-pin:
    put:
      operationId: pinMerchDuringLive
      tags: [channel]
      summary: Pins an item during the live show.
      description: '"**A put**: pinning the same item twice does not pin it twice."'
      x-arthome-maturity: provisional
      x-arthome-upstream: [ticketing]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId:
                  {
                    type: [string, "null"],
                    format: uuid,
                    description: "`null` removes the pin.",
                  }
            example: { itemId: 019928a0-7d31-7a10-b8c4-2f9e11a4d001 }
      responses:
        "200":
          description: Pin up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data:
                        {
                          type: object,
                          properties: { pinnedItemId: { type: [string, "null"], format: uuid } },
                        }
              example:
                servedAt: "2026-09-21T19:40:00.000Z"
                rightsVersion: 412
                data: { pinnedItemId: 019928a0-7d31-7a10-b8c4-2f9e11a4d001 }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/dates/{dateId}/replay-window:
    post:
      operationId: reopenReplayWindow
      tags: [channel]
      summary: Reopens the replay window.
      description: |
        Possible **only** if the policy was not `none`: the promise made before the purchase does not
        reopen. The new expiry is **derived** from the end of the live show and the served window,
        never set by hand — otherwise the replay policy would end up encoded in a storage lifecycle,
        out of reach of the tests.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: "#/components/parameters/DateId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [additionalHours]
              properties:
                additionalHours: { type: integer, minimum: 1, maximum: 720 }
            example: { additionalHours: 48 }
      responses:
        "200":
          description: Window reopened, with the new **derived** expiry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expiresAt: { type: string, format: date-time }
                          windowHours: { type: integer }
              example:
                servedAt: "2026-09-22T10:00:00.000Z"
                rightsVersion: 412
                data: { expiresAt: "2026-09-26T21:30:00Z", windowHours: 120 }
        "409":
          description: "`REPLAY_POLICY_FINAL` when the policy was `none`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: REPLAY_POLICY_FINAL,
                    nature: refused,
                    params: { currentPolicy: none },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-22T10:00:00.000Z"

  /v1/channels/{channelId}/identity:
    patch:
      operationId: updateChannelIdentity
      tags: [channel]
      summary: Edits the channel's public face.
      description: |
        **A pure `catalog` write.** A channel has two faces, and the contract separates them: the
        channel **as an organisation** — members, roles, invitations, stream key — is authorisation,
        hence `identity`; the channel **as a public page** — name, biography, avatar, discipline — is
        catalogue, hence `catalog.Artist`, in a 1:1 relation by `channelId`.

        **No studio command crosses the two**, and that is the proof the cut is right: the Settings
        screen shows two blocks that never mix.
      x-arthome-maturity: stable
      x-arthome-upstream: [catalog]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                publicName: { type: string, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9-]{3,80}$" }
                biography:
                  type: array
                  items:
                    type: object
                    required: [contentLanguage, text]
                    properties:
                      contentLanguage: { type: string }
                      text: { type: string, maxLength: 4000 }
                categoryId: { type: string }
                avatarAssetId: { type: [string, "null"], format: uuid }
            example:
              {
                expectedVersion: 5,
                publicName: Compagnie Verticale,
                categoryId: dance-contemporary,
              }
      responses:
        "200":
          description: Public identity up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      version: { type: integer }
                      data: { type: object, additionalProperties: true }
              example:
                servedAt: "2026-09-21T18:50:00.000Z"
                rightsVersion: 412
                version: 6
                data:
                  {
                    publicName: Compagnie Verticale,
                    slug: compagnie-verticale,
                    categoryId: dance-contemporary,
                  }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/me/preferences:
    patch:
      operationId: updateStudioPreferences
      tags: [bootstrap]
      summary: Writes one of the person's preferences — reading timezone, control-room layout.
      description: |
        **Two settings follow the person, not the channel**: the reading timezone and the
        control-room layout. The timezone is **the same field** as the storefront's — same account,
        one carrier only.

        **Never in `localStorage`**: it is bound to the origin, can be cleared by the OS, and travels
        in no way at all — yet the person moves from studio web to studio mobile within the same
        evening.

        **Additive and tolerant**: a key unknown to one version is neither rejected nor erased on the
        next write, otherwise the mobile version under store review would overwrite settings made from
        the web.
      x-arthome-maturity: stable
      x-arthome-upstream: [identity]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                readingTimezone: { type: string }
                runDeskLayout: { type: string }
                encodingProfileName: { type: string }
            example: { readingTimezone: Europe/Paris, runDeskLayout: compact }
      responses:
        "200":
          description: Preferences up to date.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
              example:
                servedAt: "2026-09-21T18:51:00.000Z"
                rightsVersion: 412
                data: { readingTimezone: Europe/Paris, runDeskLayout: compact }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: arthome_studio_session
      description: |
        Opaque session, `HttpOnly`/`Secure`/`SameSite=Lax` cookie. This is `studio-web`'s form.
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        **`studio-mobile` cannot hold its session in a cookie**: `capacitor://localhost` is a
        third-party context on iOS. The studio BFF therefore offers a **bearer-token** session
        alongside the cookie session — a refresh token bound to the device, kept in the native store
        (`@capacitor/preferences`, **never `localStorage`**), a short access token, revocation per
        device.

        On returning from the background with an expired token: **silent refresh**. A
        re-authentication in the middle of a shift is an operational fault. It is required only for
        **sensitive operations** — revealing or rotating a stream key, transferring ownership of a
        channel, changing a payout method — and it is then asked for **at the moment of the
        operation**, not on returning to a screen.

        Allowed origins on the CORS side, as **literal strings**: `capacitor://localhost` and
        `https://localhost`. A bare `localhost` entry covers neither, `*` is illegal with credentialed
        requests, and a framework that normalises the origin through a URL parser would reject
        `capacitor://`.

  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context, propagated down to the service and injected into the outbox **at write time**.
      schema:
        type: string
        pattern: "^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$"
        examples: ["00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"]

    Surface:
      name: X-Arthome-Surface
      in: header
      required: true
      description: |
        The calling surface. The studio log **names names and places them**: "who decided, when, from
        which surface". A non-human actor — an automatic holding screen, a lease expiring — is an
        actor all the same, and carries `system`.
      schema:
        type: string
        enum: [studio-web, studio-mobile]
        examples: [studio-mobile]

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUIDv7 generated by the surface **before sending**. The rule counts twice over here: a mobile
        network replays, and a person who sees no answer presses twice. A replayed key returns the
        original response, verbatim. Lifetime 24 h.
      schema: { type: string, format: uuid, examples: ["019928f4-1b6c-7c3a-9f2e-6a1d0c4b8e77"] }

    IfRightsVersion:
      name: If-Rights-Version
      in: header
      required: false
      description: |
        **The rights version the client holds**, symmetric to `X-Arthome-Rights-Version` in the
        response. Without it, the server cannot tell "you never had that right" from "you had it two
        hundred milliseconds ago": **two of the three refusal codes were out of reach**, and only
        `FORBIDDEN` was left — that is, the very indistinction the three codes existed to remove.

        The difference, on shift, is not theoretical: on `FORBIDDEN` the application sends the
        operator back to the home screen as if they had never had the right; on
        `RIGHTS_VERSION_STALE` it reloads the bootstrap and **finds its place again**.

        **Which clock is authoritative**, since there were two: the server makes the client leave the
        real-time rooms **immediately**, but a command still goes through for up to 60 s, the lifetime
        of the internal token. It is **the command that is authoritative** — a refusal is only
        rendered when the owning service renders it, on the loaded resource. The console may therefore
        freeze before the writes stop, and that is the safe order: you stop showing before you stop
        acting.
      schema: { type: integer, format: int64, examples: [412] }

    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid, examples: ["019928a0-7d31-7a10-b8c4-2f9e11a4c222"] }

    DateId:
      name: dateId
      in: path
      required: true
      schema: { type: string, format: uuid, examples: ["019928a0-7d31-7a10-b8c4-2f9e11a4c001"] }

    Page:
      name: page
      in: query
      required: false
      description: '"**Page number, from 1.** That is the affordance wanted: you pin a page and send it to a colleague."'
      schema: { type: integer, minimum: 1, default: 1 }

    PageSize:
      name: pageSize
      in: query
      required: false
      description: '"Small pages, and deliberately so: a thumb does not scan a hundred rows."'
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

    SortBy:
      name: sortBy
      in: query
      required: false
      description: |
        Sort key. **A key bearing on a field absent from this role's projection is refused** with
        `SORT_KEY_FORBIDDEN`, never ignored.

        Sorting by **state** follows the **state machine's canonical order**, not alphabetical order:
        it is domain data, served with the state (`orderRank`), and not a table each surface would
        reinvent.
      schema: { type: string, examples: [startsAt] }

    SortDir:
      name: sortDir
      in: query
      required: false
      schema: { type: string, enum: [asc, desc], default: asc }

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        **The only two exceptions to "page + total"**: the moderation queue and the live chat.
        Opaque Base64 cursor on `(created_at, id)`, valid 24 h, `410 CURSOR_TOO_OLD` beyond.
      schema: { type: string }

    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  headers:
    ServedAt:
      description: The server instant of this response. Every shift countdown refers to it, never to the workstation's clock.
      schema: { type: string, format: date-time }

    RightsVersion:
      description: |
        **Carried on every response.** When it changes, the navigation is stale: the client reloads
        the bootstrap. It is also pushed on the real-time channel, and the server makes the client
        leave a lost channel's rooms **without waiting for a reconnection**.
      schema: { type: integer, format: int64 }

    IdempotencyReplayed:
      description: Present and `true` when the body is the memorised response of an earlier attempt.
      schema: { type: boolean }

  responses:
    BadRequest:
      description: Malformed request, or a mandatory filter missing.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: PERIOD_FILTER_REQUIRED,
                nature: refused,
                params: { maxRangeDays: 92 },
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    Unauthorized:
      description: Aucune session valide.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: UNAUTHENTICATED,
                nature: refused,
                params: {},
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    Forbidden:
      description: |
        Right absent, rights stale, access revoked, or channel left. Three distinct codes —
        `FORBIDDEN`, `RIGHTS_VERSION_STALE`, `CHANNEL_ACCESS_REVOKED` — because the person must know
        whether to reload, to phone someone, or to give up.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: RIGHTS_VERSION_STALE,
                nature: refused,
                params: { currentRightsVersion: 412 },
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    NotFound:
      description: Unknown resource, or outside this channel's perimeter.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: NOT_FOUND,
                nature: refused,
                params: {},
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    Conflict:
      description: |
        A final business refusal, and the `code` says which. `STATE_CONFLICT` carries **the current
        state and version**; `TRANSITION_IRREVERSIBLE` carries the transition attempted **and the
        promise committed**; `MODERATION_ALREADY_SETTLED` carries **the winning verdict and its
        author**.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: MODERATION_ALREADY_SETTLED
              nature: refused
              params: { verdict: remove, settledBy: "Claire D.", settledAt: "2026-09-21T20:30:58Z" }
              traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            servedAt: "2026-09-21T20:31:04.118Z"

    Gone:
      description: Resume cursor too old — a full reload is required, and the surface **knows** it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: CURSOR_TOO_OLD,
                nature: refused,
                params: { maxAgeHours: 24 },
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    TooManyRequests:
      description: Rate limit reached.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: RATE_LIMITED,
                nature: unavailable,
                params: { retryAfterMs: 2000 },
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

    Unavailable:
      description: 'Our servers. `nature: "unavailable"` lets a shift tell "retry" from "understand".'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              {
                code: UPSTREAM_UNAVAILABLE,
                nature: unavailable,
                params: { service: streaming },
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
              }
            servedAt: "2026-09-21T20:31:04.118Z"

  schemas:
    EnvelopeMeta:
      type: object
      required: [servedAt, rightsVersion]
      properties:
        servedAt:
          type: string
          format: date-time
          description: |
            The reference clock. The shift countdown, the length of a silencing, "the replay expires in
            41 h", the expiry of a one-off access: everything is counted against it and a measured offset,
            **never against the workstation's clock**.
          examples: ["2026-09-21T20:31:04.118Z"]
        validUntil: { type: [string, "null"], format: date-time }
        rightsVersion:
          type: integer
          format: int64
          description: "**On every response.** When it changes, the navigation is stale."
          examples: [412]
        lastEventSeq: { type: [integer, "null"], format: int64 }
        degraded:
          type: array
          items: { type: string }
          description: The optional parts that could not be composed. The console paints anyway.

    OffsetPageInfo:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      description: |
        **The total is exact**, not approximate: that is the difference from the storefront, and it
        is what "1–8 OF N" requires.
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
        emptyReason: { type: [string, "null"] }

    CursorPageInfo:
      type: object
      required: [hasMore]
      description: '"The two exceptions: the moderation queue and the live chat."'
      properties:
        nextCursor: { type: [string, "null"] }
        prevCursor: { type: [string, "null"] }
        hasMore: { type: boolean }
        pendingCount:
          type: [integer, "null"]
          description: |
            The **separate total**, for the badge. It is not counted over the current page: the bottom
            bar carries "in queue: 14", and **none of these numbers may require fetching a page**.

    Error:
      type: object
      required: [code, nature, params, traceId]
      properties:
        code:
          type: string
          description: |
            Closed vocabulary, i18n by codes, **with a snapshot embedded at build time as a mandatory
            fallback**. That is vital here: **a store review is slow**. If a new code arrives from the
            backend before the application is updated, the person on shift must see a sentence, not
            `moderation.verdict.conflict`.
          examples: [PUBLICATION_CHECKLIST_INCOMPLETE]
        nature:
          type: string
          description: |
            `offline_forbidden` is a **local** refusal, never emitted by the server.

            **Open vocabulary on read.** An unknown nature is treated as **`unavailable`**, hence
            retryable. A frozen `enum` here would make an earlier version of the application reject the
            **whole** error envelope — that is, lose the ability to read errors at the precise moment
            something is wrong, on shift, on an application a store review takes days to replace.
          x-arthome-vocabulary: [refused, unavailable, offline_forbidden]
          x-arthome-unknown-fallback: unavailable
        params:
          type: object
          additionalProperties: true
          examples: [{ missing: [poster, capacity, technical_check_passed] }]
        traceId:
          type: string
          description: The one moment left where the person can read out a number and dictate it to support.
          examples: ["4bf92f3577b34da6a3ce929d0e0e4736"]

    ErrorEnvelope:
      type: object
      required: [error, servedAt]
      properties:
        error: { $ref: "#/components/schemas/Error" }
        servedAt: { type: string, format: date-time }

    Money:
      type: object
      required: [amountMinor, currencyCode]
      description: Integer minor unit + ISO 4217 currency code. Formatting belongs to the client.
      properties:
        amountMinor: { type: integer, format: int64, examples: [2400] }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$", examples: [EUR] }

    LocalizedText:
      type: object
      required: [contentLanguage, text]
      description: |
        An **authored** text. The only two acknowledged exceptions to "i18n by codes": the holding
        screen message written by the control room, and the inbox texts.
      properties:
        contentLanguage: { type: string, examples: [fr] }
        text: { type: string }

    Actor:
      type: object
      required: [surface]
      description: |
        Who caused the fact. **Empty for `system`** — a server rule (an automatic holding screen, a
        lease expiring) is an actor all the same, and the log must be able to tell it apart from a
        human decision.
      properties:
        accountId: { type: [string, "null"], format: uuid }
        personId: { type: [string, "null"], format: uuid }
        displayName: { type: [string, "null"] }
        surface: { type: string, x-arthome-vocabulary: [studio-web, studio-mobile, system] }

    SessionMode:
      type: string
      description: |
        **An explicit parameter, validated, never inferred from the `User-Agent`** — that one is
        forgeable. `cookie` for the studio web; `bearer` for the native shell, where
        `capacitor://localhost` is a third-party context on iOS and where no cookie would survive.
      enum: [cookie, bearer]

    SessionEstablished:
      description: |
        **Invariant: a response never carries a cookie and a token at once.** Two bearers for one
        session means two revocations to keep up and one that will be forgotten. So these are **two
        schemas**, discriminated by the mode, and not one schema with an optional field.
      oneOf:
        - $ref: "#/components/schemas/SessionEstablishedCookie"
        - $ref: "#/components/schemas/SessionEstablishedBearer"
      discriminator:
        propertyName: mode
        mapping:
          cookie: "#/components/schemas/SessionEstablishedCookie"
          bearer: "#/components/schemas/SessionEstablishedBearer"

    SessionEstablishedCookie:
      type: object
      required: [mode, bootstrap]
      description: '`HttpOnly` `Secure` `SameSite=Lax` cookie on the **BFF''s domain**. **Nothing in the body.**'
      properties:
        mode: { type: string, const: cookie }
        bootstrap: { $ref: "#/components/schemas/StudioBootstrap" }

    SessionEstablishedBearer:
      type: object
      required: [mode, accessToken, expiresAt, bootstrap]
      description: |
        Opaque token in the body, **no cookie**, stored in the native store —
        `@capacitor/preferences`, **never `localStorage`**.
      properties:
        mode: { type: string, const: bearer }
        accessToken: { type: string }
        refreshToken: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
        bootstrap: { $ref: "#/components/schemas/StudioBootstrap" }

    # ---------------------------------------------------------- rights and bootstrap

    EffectiveRights:
      type: object
      required:
        [
          channelId,
          roles,
          navigation,
          datePanes,
          canRevenue,
          canOps,
          canTech,
          canDecideOutcome,
          assignableRoles,
        ]
      description: |
        **Computed once in `@arthome/core`, served by the BFF.** Never recomposed by a surface: the
        navigation is the **union** of the accesses of every role held, and a six-persona projection
        would erase `director`'s right to invite.
      properties:
        channelId: { type: string, format: uuid }
        channelName: { type: string }
        roles:
          type: array
          description: "**A set**, never a single role — one person holds several on the same channel."
          items:
            type: string
            x-arthome-vocabulary:
              [artist, production, coordination, director, video, sound, moderation, treasury]
          examples: [[production, coordination]]
        isOwner:
          type: boolean
          description: Exactly one row per channel. **Never removable, and their roles never editable.**
        navigation:
          type: array
          description: The **open** entries, in the served canonical order. The surface neither orders nor filters.
          items:
            type: string
            x-arthome-vocabulary:
              [
                agenda,
                dashboard,
                moderation,
                crew,
                events,
                stream,
                stats,
                tickets,
                store,
                replays,
                payouts,
                journal,
                settings,
                help,
              ]
        contextualPages:
          type: array
          description: |
            **The pages reached from another page, never listed in a menu** — and they need a rights
            carrier like the rest. `regie` is a stage manager's shift page, the one they open when the
            feed drops; `wizard` creates a date; `event` is the record; `inbox` is open to everyone,
            with no role condition.

            **They are not in `navigation`, and that is deliberate**: `navigation` populates the bar and
            the sheet, these four do not. Filing them together had produced the opposite mistake —
            `regie` had been removed from the vocabulary to make an inconsistency between two tables go
            away, that is, **the shift's main destination was deleted in order to silence the symptom
            that pointed at it**. The two tables are reconciled here, and the page is given back.
          items: { type: string, x-arthome-vocabulary: [regie, wizard, event, inbox] }
          examples: [[regie, wizard, event, inbox]]
        tabBar:
          type: array
          description: |
            **The four tabs of the bottom bar, in their order, served.** This is **not** `navigation`
            truncated to four: the bar's order depends on the role, and the demonstration is arithmetic —
            for an artist, the first four entries of `navigation` give
            `dashboard · crew · events · stream`, where the bar must carry
            `dashboard · events · crew · tickets`. Two differences out of four: taking the head of
            `navigation` would put the control room in an artist's bar and push ticketing out of it —
            that is, what an artist looks at most.

            The table lives in `@arthome/core` and is **served** here, because the studio web orders the
            same menu: copied out, it would be implemented twice — which critical rule 2 forbids.
          items: { type: string }
          examples: [[dashboard, events, crew, tickets]]
        datePanes:
          type: array
          description: |
            The date-record panes open **to this person**. A detail screen whose very layout depends on
            rights: it is not only the root navigation that must know the rights before painting, it is
            every record too.
          items: { type: string, x-arthome-vocabulary: [public, tickets, chat, tech, crew, replay] }
        canRevenue:
          type: boolean
          description: "**Decides the content of the response**, not its display."
        canOps: { type: boolean }
        canTech: { type: boolean }
        canDecideOutcome:
          type: boolean
          description: |
            Postpone, cancel, carry on with compensation — **reserved to the owner and to production**.
            The other roles can only **report**. An outcome decision is worth several thousand euros.
        assignableRoles:
          type: array
          description: |
            The projection of `grants` onto the roles held, **materialised** — never the `grants` table
            to be recomposed. `director` can invite `video` and `sound`; `video`, `sound`, `moderation`
            and `treasury` invite nobody.
          items: { type: string }
        dateGrants:
          type: array
          description: |
            The **one-off** accesses in force, scoped to a date, with their **instant** of expiry.
            "Expires at curtain call + 1 h" is a screen sentence; the contract carries the instant.
          items:
            type: object
            required: [grantId, dateId, crewRole, expiresAt]
            properties:
              grantId: { type: string, format: uuid }
              dateId: { type: string, format: uuid }
              crewRole: { type: string, x-arthome-vocabulary: [director, video, sound, moderation] }
              expiresAt: { type: string, format: date-time }

    StudioCounters:
      type: object
      description: |
        **The badges, served at bootstrap and kept up to date by the real-time channel.** None of
        these numbers may require fetching a page: otherwise the bottom bar costs five requests every
        time it opens.
      properties:
        moderationPending: { type: integer, examples: [14] }
        inboxUnread: { type: integer, examples: [2] }
        dutiesTonight: { type: integer, examples: [3] }
        invitationsPending: { type: integer }
        datesToCover: { type: integer }
        payoutsDue: { type: integer }

    StudioBootstrap:
      type: object
      required: [person, channels, rightsVersion, constants, labelCatalog, counters]
      description: |
        **The first paint waits for one thing only: this.** The tables are never read empty, and that
        is the right behaviour — but it imposes its own constraint: the bootstrap must be **small and
        fast**, because nothing is painted until it is there. Everything else — measurements, queue,
        statistics — arrives afterwards, screen by screen.

        **The root is not a channel, it is a person.** A freelance stage manager or moderator works
        across several channels the same evening; `channels[]` carries them all, with their effective
        rights.
      properties:
        person:
          type: object
          required: [personId, displayName]
          properties:
            personId: { type: string, format: uuid }
            displayName: { type: string }
            isFreelance: { type: boolean }
            runsCalled:
              type: integer
              description: '"**A read model**, not a hand-written field: it increments on `run_ended`."'
            readingTimezone:
              type: string
              description: "**The same field** as the storefronts reading timezone — same account, one carrier only."
              examples: ["Europe/Paris"]
        channels:
          type: array
          items: { $ref: "#/components/schemas/EffectiveRights" }
        personNavigation:
          type: array
          description: |
            **The entries that belong to the person, not to a channel.** `agenda` is served by
            `GET /v1/me/duties`, explicitly "across all channels"; `inbox` likewise, and it is open to
            everyone. Filing them under the **per-channel** `navigation` meant a person on three channels
            received the same entry three times — or zero times, which is what happened in the example
            this document served: a `video` role received `[events, stream, replays, help]`, with no
            `agenda`, although a stage manager's shift page is precisely that one. The `dutiesTonight`
            counter was served all the same, which presupposes that shifts count.
          items: { type: string, x-arthome-vocabulary: [agenda, inbox, help] }
          examples: [[agenda, inbox, help]]
        rightsVersion: { type: integer, format: int64 }
        constants:
          type: object
          description: |
            The domain constants, **served**. Technical-provision threshold, revision deadline,
            waiting-list priority window, season boundaries, chat rate ceiling, cancellation deadline.
            Copied out, these constants would diverge across five surfaces (E11).
          properties:
            technicalProvisionThreshold: { type: integer, examples: [10000] }
            provisionRevisionHours: { type: integer, examples: [72] }
            waitlistPriorityWindowHours: { type: integer, examples: [2] }
            cancelDeadlineMinutesBefore: { type: integer, examples: [60] }
            payoutDelayDays: { type: integer, examples: [14] }
            commissionRateBps: { type: integer, examples: [1200] }
            chatBurstThresholdPerMinute: { type: integer, examples: [60] }
            moderationQueueAlertThreshold:
              type: integer
              description: "**The \"queue beyond ten messages\" threshold**, one of the five notification thresholds that had no carrier. Rule 15."
              examples: [10]
            crewUnassignedAlertHoursBefore:
              type: integer
              description: "**The \"post unassigned at D-1\" delay**, the second of the two thresholds without a carrier."
              examples: [24]
            holdScreenAutoAfterSec:
              type: integer
              description: |
                "Automatic holding screen if the feed is lost for more than 15 s" is a **server rule**,
                carried as a channel default. It does not depend on a control-room workstation that might be
                the one that lost the network.
              examples: [15]
            seasonBounds:
              type: object
              description: "**1 September → 31 August**, the live-performance convention. Served, never guessed by five surfaces."
              properties:
                startsOn: { type: string, examples: ["09-01"] }
                endsOn: { type: string, examples: ["08-31"] }
        labelCatalog:
          type: object
          description: |
            An immutable versioned artifact, **served per surface**. The studio loads four themes —
            `studio`, `taxonomy`, `system`, `storefront` — and its number of enumeration keys is high: the
            split by surface exists precisely for that. **No service** serves it: it is a CDN artifact.
          properties:
            locale: { type: string }
            version: { type: integer }
            url: { type: string, format: uri }
        counters: { $ref: "#/components/schemas/StudioCounters" }
        realtime:
          type: object
          description: |
            **The subscription is per person, not per page.** A channel opened only on the channel
            currently displayed would miss the other one's incident — and on an already fragile mobile
            network, one subscription per channel would multiply the connections.
          properties:
            namespace: { type: string, examples: ["/studio"] }
            pulseIntervalSec:
              type: integer
              description: |
                **`ws:pulse` every 5 s**, and that is what makes silence diagnosable: no more pulse for
                15 s = **I am deaf**; a pulse with no health sample for 30 s = **the room has stopped
                sending**. Two states, two screens, no inference.
              examples: [5]

    # ------------------------------------------------ measurement: period, tiles, series

    PeriodBounds:
      type: object
      required: [from, to, days, datesCovered, preset]
      description: |
        **The period's effective bounds, computed by the server.** A custom range displays
        "94 days · 7 dates": both numbers are served, because they depend on the channel's calendar
        and because `SEASON` is a domain notion (1 September → 31 August) whose bounds are already
        served at bootstrap.
      properties:
        preset:
          {
            type: string,
            x-arthome-vocabulary: [last_7_days, last_30_days, last_90_days, season, custom],
          }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer, examples: [94] }
        datesCovered: { type: integer, examples: [7] }

    MetricTile:
      type: object
      required: [id, value, unit, series, seriesGranularity]
      description: |
        **A single template: identifier, value, unit, series.** Three things it does not carry, and
        each one is a decision:

        **1. No variation.** It is **derived** from the series by `trendOf` in `@arthome/core` — the
        average of the first half against the second, **nothing below 4 series points nor below a
        0.1% gap** — as a percentage except for fill rate, which is in **points**. Serving it on top
        of the series would be the same value computed in two places.

        **2. No literal unit.** `unit` is a **code**, and the period comes from the request. The
        design carried "over 30 d" hardcoded on a tile although a period selector sits beside it: the
        label would have lied from the first click.

        **3. The value is bounded by the period requested**, all six tiles without exception. The
        design froze `SUBSCRIBERS GAINED` at thirty days **and then multiplied it** by a period
        coefficient — a frozen counter, scaled. The contract aggregates over the period, or does not
        serve the tile.
      properties:
        id:
          type: string
          x-arthome-vocabulary:
            [
              shop_sales,
              followers_gained,
              replay_views,
              fill_rate,
              moderated_messages,
              signal_quality,
            ]
        value: { type: number }
        unit: { type: string, x-arthome-vocabulary: [currency_minor, count, percent, points] }
        currencyCode: { type: [string, "null"], pattern: "^[A-Z]{3}$" }
        series:
          type: array
          description: |
            **The sparkline takes the last 14 points.** Serving more costs little and lets the client
            choose; serving fewer would make the variation inexpressible.
          items:
            type: object
            required: [at, value]
            properties:
              at: { type: string, format: date-time }
              value: { type: number }
              dateId: { type: [string, "null"], format: uuid }
        seriesGranularity:
          type: string
          description: |
            **Declared, because it is not obvious.** In the design the series is **one value per date**,
            never per day — a daily granularity appears nowhere in it. Declaring it makes `per_day`
            addable later **without breaking a client**: it reads what the server announces instead of
            assuming.
          x-arthome-vocabulary: [per_date, per_day]
          examples: [per_date]

    DashboardReminder:
      type: object
      required: [id, kind, severity, textCode, params, targetPage, actionable]
      description: |
        **A routed list, like the inbox**: kind, severity, target and role scope decided
        **server-side**. `actionable` says whether the destination page is open to this person — the
        row stays visible otherwise, but is not clickable, and it is the server that knows, since it
        is the server that holds the effective rights.
      properties:
        id: { type: string }
        kind:
          type: string
          x-arthome-vocabulary:
            [
              publication_incomplete,
              technical_check_missing,
              moderator_unassigned,
              near_sold_out,
              moderation_backlog,
            ]
        severity: { type: string, x-arthome-vocabulary: [info, warning, urgent] }
        textCode: { type: string, description: Un **code** i18n, jamais la phrase rédigée. }
        params: { type: object, additionalProperties: true }
        targetPage: { type: string, x-arthome-vocabulary: [event, regie, crew, events, moderation] }
        dateId: { type: [string, "null"], format: uuid }
        countdownTo:
          type: [string, "null"]
          format: date-time
          description: '"**An instant**, not a sentence: the countdown is computed against `servedAt`."'
        actionable: { type: boolean }

    DashboardScreen:
      type: object
      required: [period, tiles, reminders]
      description: |
        **Most of this screen is a recomposition of collections already served.** This path carries
        only what had no carrier: the tiles aggregated over a period and the "to handle" list, which
        is an aggregation **at channel level** whose ingredients all existed without anyone bringing
        them together.

        The next dates, the countdown to curtain-up, revenue per date and the number of dates held in
        reserve **are not here**: they come from `listChannelEvents`, `listPayouts` and the channel's
        `serverTime`. Asking for them again would have been the value composed in two places that
        rule 2 forbids.
      properties:
        period: { $ref: "#/components/schemas/PeriodBounds" }
        tiles:
          type: array
          description: |
            **The tile is removed from the board, not emptied** — the same mechanism as everywhere else
            in the studio: a forbidden field is absent, never present and null. `artist` and `production`
            receive four of them, `treasury` three (not `canOps`).

            **Four tiles out of six are served, and that is a deliberate decision.**
            `moderated_messages` and `signal_quality` test the **primary** role — `mod` and `regie` — yet
            neither of those opens `dashboard`: they are **never** displayed. The contract serves what is
            reachable rather than carrying two dead tiles. They stay in the vocabulary, because the open
            question is a product one, not a contract one: **open `dashboard` to those two roles, or
            withdraw the tiles.**
          items: { $ref: "#/components/schemas/MetricTile" }
        reminders:
          type: array
          description: |
            Bounded to five, and to **two** rows coming from the publication checklists. The order is
            **served**: severity descending, then nearest deadline.
          items: { $ref: "#/components/schemas/DashboardReminder" }
        revenueByDate:
          type: [object, "null"]
          description: "**Absent** without `canRevenue`."
          properties:
            total: { $ref: "#/components/schemas/Money" }
            totalScope:
              type: string
              description: |
                **What the total counts, declared.** The design displays a total at the head of six rows
                without saying whether it is the sum of the six or the channel's total over the period — and
                the figure there is hardcoded, so it does not settle it. The contract serves `channel_period`
                and **says so**, rather than letting two surfaces add up six bars and arrive at a different
                number.
              x-arthome-vocabulary: [channel_period, listed_rows]
            items:
              type: array
              items:
                type: object
                properties:
                  dateId: { type: string, format: uuid }
                  title: { type: string }
                  startsAt: { type: string, format: date-time }
                  gross: { $ref: "#/components/schemas/Money" }

    StatsAudience:
      type: object
      required: [period, headline, fillByDate, audienceByDate]
      description: |
        **The provenance ring is not served, and that is not an oversight.** The design brings five
        labels — home, internal search, share, direct link, featured — and **nothing else**: the
        values there are hardcoded and **no attribution source exists** in the reference data.
        Carrying it would have been writing an intention and passing it off as a measurement — that
        is, letting a design's layout dictate an API's structure.

        **What it would take for it to exist**: provenance capture at the entry of the journey
        (campaign parameter, referrer, internal origin), carried through to the order and projected
        per date. That is a mechanism, not a field — and until it exists, the contract promises
        nothing.
      properties:
        period: { $ref: "#/components/schemas/PeriodBounds" }
        headline:
          type: object
          properties:
            viewersTotal:
              type: [integer, "null"]
              description: |
                **This is not a count of unique individuals**, and the name does not claim so here. It is
                the per-date sum of `max(live viewers, seats sold)` plus the replay views. The definition of a
                **unique** viewer exists nowhere in the sources; serving it under that name would have been a
                promise we do not keep.
            averageFillRateBps: { type: integer }
            datesCount:
              type: integer
              description: "**All** the channels dates over the period, with no state filter — the way the design counts them."
            netRevenue:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              description: "**Absent** without `canRevenue`."
        fillByDate:
          type: array
          items:
            type: object
            properties:
              dateId: { type: string, format: uuid }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              fillRateBps: { type: integer }
              seatsSold: { type: [integer, "null"] }
              capacityTotal: { type: [integer, "null"] }
              onSale: { type: boolean }
        audienceByDate:
          type: array
          description: |
            **`seatsSold` and `liveViewers` are two distinct fields.** The design displays "N viewers"
            and feeds it with seats sold: label and datum diverge there. The contract serves both
            separately and lets the surface choose what it names — instead of carving the confusion in
            stone.
          items:
            type: object
            properties:
              dateId: { type: string, format: uuid }
              title: { type: string }
              startsAt: { type: string, format: date-time }
              displayState:
                {
                  type: string,
                  x-arthome-vocabulary:
                    [scheduled, room_open, live, replay, ended, postponed, cancelled, interrupted],
                }
              seatsSold: { type: integer }
              liveViewersPeak: { type: [integer, "null"] }
              replayViews: { type: [integer, "null"] }
              fillRateBps: { type: integer }

    StatsSeries:
      type: object
      required: [period, headline, series]
      description: |
        **The contract carries the grouping, the reference and both gaps — computed.** Not the
        ingredients: the choice of reference is a **domain rule**, and two surfaces would reimplement
        it differently.
      properties:
        period: { $ref: "#/components/schemas/PeriodBounds" }
        headline:
          type: object
          properties:
            seriesCount: { type: integer }
            bestFillRateBps: { type: [integer, "null"] }
            bestFillShowId: { type: [string, "null"], format: uuid }
            averageGapPoints:
              type: [number, "null"]
              description: |
                In **points**, between the reference and the ones that follow, across all series.
                **Null when no following date has sold** — "not yet measurable" is a state,
                not a zero.
            pendingDecisionCount:
              type: integer
              description: The dates **held in reserve**. Already obtainable through `listChannelEvents?state=reserve`; served here to save the banner a second call.
        series:
          type: array
          description: |
            **Grouped by `showId`**, never by title — the design groups by title, but the domain has a
            show and that is the right key. The `draft` and `technical` states are **excluded** from the
            grouping, and only groups of **more than one date** are series. An empty table is a **served
            case**: "no series" invites you to duplicate a date.
          items:
            type: object
            required: [showId, title, referenceDateId, dates]
            properties:
              showId: { type: string, format: uuid }
              title: { type: string }
              referenceDateId:
                type: string
                format: uuid
                description: |
                  **The first date that sold at least one seat**, failing that the first in the
                  group. It is not the first in chronological order, and that is the whole
                  difference: comparing against a date that sold nothing would make every following
                  series look like a success.
              dates:
                type: array
                items:
                  type: object
                  required: [dateId, startsAt, fillRateBps, isReference]
                  properties:
                    dateId: { type: string, format: uuid }
                    startsAt: { type: string, format: date-time }
                    displayState:
                      {
                        type: string,
                        x-arthome-vocabulary:
                          [
                            scheduled,
                            room_open,
                            live,
                            replay,
                            ended,
                            postponed,
                            cancelled,
                            interrupted,
                          ],
                      }
                    fillRateBps: { type: integer }
                    seatsSold: { type: integer }
                    revenue:
                      allOf: [{ $ref: "#/components/schemas/Money" }]
                      description: "**Absent** without `canRevenue`."
                    isReference: { type: boolean }
                    fillGapPoints:
                      type: [number, "null"]
                      description: |
                        Fill-rate gap **in points** against the reference.
                        **Null — hence nothing to display — when the date has no sales at all**: "there
                        is no gap to measure, it is a decision to be made, not a decline".
                    revenueGapPct:
                      type: [number, "null"]
                      description: Revenue gap as a **percentage**. **Absent** without `canRevenue`, null without sales.
                    canOpenSale:
                      type: boolean
                      description: True if the date is held in reserve **and** the person can open the sale. Served, because it is a right.

    # ---------------------------------------------------------- publication

    PublicationChecklistItem:
      type: object
      required: [id, satisfied, source, blocking]
      description: |
        **Seven items, the ones on the record** — not the four in the fixtures, which are an
        arbitrary subset. Served as a **list of identifiers**, never a percentage, which the client
        would compute.

        **Three of the seven are facts projected** from other contexts: `catalog` keeps them up to
        date by event, it asks nobody for them.
      properties:
        id:
          type: string
          x-arthome-vocabulary:
            [
              title_and_discipline,
              poster,
              description,
              at_least_one_active_price,
              capacity,
              technical_check_passed,
              chat_mode_set,
              chapters_planned,
              moderator_assigned,
            ]
        satisfied: { type: boolean }
        source: { type: string, x-arthome-vocabulary: [catalog, ticketing, streaming, chat] }
        blocking:
          type: boolean
          description: |
            "Chapters planned" and "moderator assigned" are **non-blocking warnings**: one must be
            able to publish a date without chapters, and the studio must be able to do it.

    PublicationTransition:
      type: object
      required: [from, to, irreversible]
      description: |
        **The lock bears on the `from > to` pair, not on the state.** The fixtures encode a list of
        **states** and test whether the current state belongs to it; the design encodes **pairs**.
        Those are two semantics, and it is the second one that is right (E5).
      properties:
        from: { type: string }
        to: { type: string }
        irreversible: { type: boolean }
        promiseCode:
          type: [string, "null"]
          description: |
            The **promise committed**, which travels with the refusal and with the confirmation:
            `prices_engaged` for `draft|reserve → scheduled`, `replay_sold` for
            `ended → replay-online`. A code, never the sentence.
          x-arthome-vocabulary: [prices_engaged, replay_sold]

    Publication:
      type: object
      required: [dateId, state, orderRank, version, checklist, offeredTransitions]
      properties:
        dateId: { type: string, format: uuid }
        state:
          type: string
          description: |
            The vocabulary of `catalogue.json`, which is authoritative. `replay-online` says what
            `replay` does not: **the replay is on sale**. The parallel tables in the two studio designs
            are never adopted.
          x-arthome-vocabulary: [draft, reserve, scheduled, technical, live, ended, replay-online]
        orderRank:
          type: integer
          description: |
            **The rank travels with the state.** The event board sorts by state, and the order is the
            machine's, not the alphabet's. Without a served rank, every surface reinvents its own ordering
            table.
        version:
          type: integer
          description: |
            The studio is **multi-operator without a lock**: the arbitration is on the server. Every
            transition carries `expectedVersion`, and a command sent from `technical` while the current
            state is `live` is refused with `STATE_CONFLICT` **with the current state and version**.
        publishedAt: { type: [string, "null"], format: date-time }
        pricesLockedAt: { type: [string, "null"], format: date-time }
        replayOnlineAt: { type: [string, "null"], format: date-time }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/PublicationChecklistItem" }
        offeredTransitions:
          type: array
          description: |
            **Computed for this operator**, served with the state. Only the owner and production move a
            date; a control room sees the record and does not move it. Without this list, every surface
            recomputes the table — hence a second implementation of the rule, hence a guaranteed
            divergence.
          items: { $ref: "#/components/schemas/PublicationTransition" }
        lastActor: { $ref: "#/components/schemas/Actor" }

    DateSheet:
      type: object
      required: [dateId, publication, openPanes]
      description: |
        **Served pane by pane, not served whole and cut up at render time.** A moderator must be able
        to load the `chat` pane **without** loading the whole record, otherwise ticketing travels for
        nothing. One call for the record, then one call per open pane, at its owner.
      properties:
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        venueClock:
          type: object
          properties:
            venueTimezone: { type: string }
            venueUtcOffsetMin: { type: integer }
        runtimeMin: { type: integer }
        outcome:
          { type: [string, "null"], x-arthome-vocabulary: [postponed, cancelled, interrupted] }
        displayState:
          type: string
          description: The composed value, served. Never recomposed by the surface.
          x-arthome-vocabulary:
            [scheduled, room_open, live, replay, ended, postponed, cancelled, interrupted]
        displayStateValidUntil: { type: string, format: date-time }
        publication: { $ref: "#/components/schemas/Publication" }
        openPanes:
          type: array
          description: The panes open **to this person**. The overview appears only beyond three panes.
          items: { type: string, x-arthome-vocabulary: [public, tickets, chat, tech, crew, replay] }

    EventsRow:
      type: object
      required: [dateId, title, startsAt, state, orderRank]
      description: |
        A row of the event board. **Role projection decides what it contains**: `grossRevenue` is
        **absent** — not null — for a role without `canRevenue`, and a sort on that key is then
        **refused**.
      properties:
        dateId: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        state:
          {
            type: string,
            x-arthome-vocabulary:
              [draft, reserve, scheduled, technical, live, ended, replay-online],
          }
        orderRank: { type: integer }
        outcome: { type: [string, "null"] }
        displayState:
          type: string
          description: |
            **The composed value, served to the studio as to the storefront.** It is here that it counts
            most: the storefront has one axis to display, the studio has **three to reconcile** —
            `publication.state`, `run.state` and `outcome` — and the outcome labels **replace** the state
            (`CANCELLED AND REFUNDED`, `POSTPONED · SEATS STILL VALID`, `INTERRUPTED · CREDITS ISSUED`).
            Serving `state + orderRank + outcome` and letting the client compose was the second
            implementation that critical rule 2 forbids — on the surface where a mistake is not a
            mislabelled card but a control room on the wrong screen.
          x-arthome-vocabulary:
            [scheduled, room_open, live, replay, ended, postponed, cancelled, interrupted]
          examples: [live]
        displayStateValidUntil: { type: string, format: date-time }
        lowestPrice: { $ref: "#/components/schemas/Money" }
        fillRateBps: { type: [integer, "null"] }
        seatsSold: { type: [integer, "null"] }
        capacityTotal:
          type: [integer, "null"]
          description: |
            **The "next date" card displays "N / M seats"**, and `seatsSold` + `fillRateBps` did not
            give the M. A client deriving it (`seatsSold / fillRateBps`) would recompute a value the
            server already holds, with a division and a rounding thrown in. A field, not a route.
        grossRevenue:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "**Absent** from the response when the role lacks `canRevenue`. Never present and null."

    Duty:
      type: object
      required: [dateId, channelId, crewRole, startsAt]
      description: |
        A shift. `person_duties` is held by `identity` and carries **all channels together**: a stage
        manager can be on shift for two live shows the same evening, and the banner flags the
        **overlap**.
      properties:
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        channelName: { type: string }
        title: { type: string }
        crewRole: { type: string, x-arthome-vocabulary: [director, video, sound, moderation] }
        startsAt: { type: string, format: date-time }
        venueClock:
          type: object
          description: |
            **Le fuseau de la salle, sur la garde elle-même.** L'écran des gardes est l'écran
            d'accueil de cette surface, et il affiche pour chaque ligne l'heure de la personne
            **et** l'heure de salle — « l'heure du spectateur d'abord, l'heure de salle en second
            quand elle diffère ». Sans ce bloc, le rendre demandait un appel par garde :
            exactement le N+1 que l'amorçage existe pour tuer, sur le seul écran qu'un régisseur
            ouvre en arrivant dans une salle.
          properties:
            venueTimezone: { type: string, examples: ["Europe/Paris"] }
            venueUtcOffsetMin: { type: integer, examples: [120] }
        runtimeMin:
          type: [integer, "null"]
          description: La durée annoncée, que la ligne affiche.
        displayState:
          type: string
          x-arthome-vocabulary:
            [scheduled, room_open, live, replay, ended, postponed, cancelled, interrupted]
        runState:
          {
            type: [string, "null"],
            x-arthome-vocabulary: [idle, rehearsal, on_air, interrupted, ended],
          }
        overlapsWith:
          type: array
          description: "**Servi**, jamais calculé par la surface : `overlapsWith` vit dans `@arthome/core`."
          items: { type: string, format: uuid }
        accessExpiresAt: { type: [string, "null"], format: date-time }

    # ---------------------------------------------------------- billetterie

    DateSalesPane:
      type: object
      required: [dateId, capacityTotal, seatsAvailable, priceTiers, pricesLocked]
      description: |
        Le volet `tickets`. La jauge **s'élargit par paliers et ne se réduit jamais** après la mise
        en vente ; les tarifs **se verrouillent à la mise en vente**, l'horaire **à l'antenne**.
        « Appliquer à la série » **exclut les tarifs et la jauge** : chaque date engage ses propres
        acheteurs.
      properties:
        dateId: { type: string, format: uuid }
        capacityTotal: { type: integer }
        capacityTiers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              capacity: { type: integer }
              openedAt: { type: [string, "null"], format: date-time }
        seatsAvailable: { type: integer }
        seatsSold: { type: integer }
        waitlistCount: { type: integer }
        fillRateBps: { type: integer }
        priceTiers:
          type: array
          items:
            type: object
            required: [tier, amount, active]
            properties:
              tier: { type: string, x-arthome-vocabulary: [full, reduced, support] }
              amount: { $ref: "#/components/schemas/Money" }
              active: { type: boolean }
        promotions:
          type: array
          items:
            type: object
            properties:
              reason:
                {
                  type: string,
                  x-arthome-vocabulary:
                    [pre_sale, preview_night, discovery_rate, final_date, late_rate],
                }
              struckPrice: { $ref: "#/components/schemas/Money" }
              currentPrice: { $ref: "#/components/schemas/Money" }
              validFrom: { type: string, format: date-time }
              validUntil: { type: string, format: date-time }
        serviceFeePerSeat:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "**Par place**, et le barème est servi, jamais une constante d'écran."
        pricesLocked: { type: boolean }
        replayUnitPrice: { $ref: "#/components/schemas/Money" }
        complimentaries:
          type: array
          items:
            type: object
            properties:
              categoryId: { type: string }
              issued: { type: integer }
              allocated: { type: integer }
        technicalProvision:
          type: object
          description: |
            Au-delà de **10 000 places**, l'infrastructure se provisionne à l'avance ; un
            prévisionnel très au-dessus du réel expose à un **malus** ; révisable jusqu'à **72 h**
            avant. **Seuil, provision, échéance et exposition sont des données du contrat**, pas
            des constantes recopiées sur cinq surfaces.
          properties:
            required: { type: boolean }
            threshold: { type: integer }
            revisableUntil: { type: [string, "null"], format: date-time }
            malusExposure: { $ref: "#/components/schemas/Money" }
        grossRevenue:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "**Absent** quand le rôle n'a pas `canRevenue`."
        version: { type: integer }

    # ---------------------------------------------------------- conduite

    HealthSample:
      type: object
      required: [measuredAt, source]
      description: |
        **Chaque métrique est nullable, et l'absence a un sens.** Le gigue et les paquets perdus
        **n'existent qu'en entrée WebRTC** ; en RTMP, transporté sur TCP, ils n'ont pas de sens, et
        le contrat les **omet** plutôt que de servir zéro. Un zéro se lit « parfait », pas « non
        mesuré ».

        `measuredAt` est l'instant de mesure **à l'ingest**, pas à la réception : c'est ce qui
        permet d'afficher « débit 8,9 Mb/s, mesuré il y a 3 s » ou « dernière mesure il y a
        2 min » au lieu de « 0 Mb/s », qui est un mensonge.
      properties:
        measuredAt: { type: string, format: date-time }
        source:
          type: string
          description: |
            `client_submitted` pour la latence bout-en-bout, mesurée côté régie par
            `RTCPeerConnection.getStats()` sur la voie WHEP et **soumise** — jamais un chiffre
            natif présenté comme bout-en-bout. Si elle n'est pas mesurée, elle est **absente**.
          x-arthome-vocabulary: [ingest_server, client_submitted]
        ingestUpKbps:
          type: [integer, "null"]
          description: |
            Observation **serveur**. À ne jamais confondre avec `deviceUpKbps`, qui mesure la
            liaison du téléphone et non l'encodeur : **deux débits différents ne portent jamais le
            même nom**. Seul le premier alimente la liste de pré-vol.
        deviceUpKbps: { type: [integer, "null"] }
        latencyMs: { type: [integer, "null"] }
        droppedPct: { type: [number, "null"] }
        jitterMs:
          {
            type: [integer, "null"],
            description: "**Omis** en RTMP — il n'y a pas de sens à le servir.",
          }
        lostPackets: { type: [integer, "null"], description: "**Omis** en RTMP." }
        viewers:
          type: [integer, "null"]
          description: "**Absent — jamais zéro — quand la date n'est pas à l'antenne.**"

    RunConsole:
      type: object
      required: [dateId, state, ingestProtocol, monitorPath, afterGracePeriod]
      description: |
        L'état de la conduite, servi en **un** appel. Le studio distingue **« accroc amorti »** de
        **« publieur parti »** — deux champs, pas un : une coupure réseau de deux secondes en salle
        ne doit produire ni incident en régie ni manifeste HLS reparti de zéro.
      properties:
        dateId: { type: string, format: uuid }
        state:
          type: string
          description: |
            L'axe **technique**, et rien d'autre. `postponed` et `cancelled` en sont **retirés** :
            c'étaient des échos de l'issue logés dans l'état technique. Une régie n'a pas d'état
            « annulée » — elle a un plateau qui n'envoie rien.
          x-arthome-vocabulary: [idle, rehearsal, on_air, interrupted, ended]
        afterGracePeriod: { type: boolean }
        ingestProtocol:
          type: string
          description: "**Décide des métriques réellement disponibles.**"
          x-arthome-vocabulary: [rtmps, srt, whip]
        monitorPath:
          type: string
          description: |
            La voie de retour **réellement ouverte**. WHEP sous la seconde sur entrée WHIP, LL-HLS
            à quelques secondes sur entrée RTMP. **Le studio doit le savoir pour ne pas promettre à
            l'opérateur une latence qu'il n'a pas** — le contrat porte la vérité, pas l'uniformité.
            Sur la coquille native, `whep` n'est pas promis au palier 5 (D-019).
          x-arthome-vocabulary: [whep, ll_hls]
        monitorUrl: { type: [string, "null"], format: uri }
        qualityLadder:
          type: array
          items:
            type: object
            properties:
              renditionId: { type: string }
              heightPx: { type: integer }
              enabled: { type: boolean }
        cameras: { type: array, items: { type: string } }
        startedAt: { type: [string, "null"], format: date-time }
        lastSample: { $ref: "#/components/schemas/HealthSample" }
        incident: { $ref: "#/components/schemas/StudioIncident" }
        chapters:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              vocabId: { type: string }
              atMediaSec: { type: integer }
        chatThroughputPerMinute:
          type: [integer, "null"]
          description: |
            **Mesuré par le serveur, dans une unité déclarée** : fenêtre glissante de 60 s, unité
            messages/minute, rafraîchi toutes les 5 s. Le seuil de bascule de la console (60
            msg/min) se lit contre **cette mesure-là** — pas contre « nombre de messages ÷ heures
            écoulées », qui n'est pas la même chose.
        grossRevenue:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "**Absent** sans `canRevenue`. La salle temps réel `:revenue` est distincte pour la même raison."
        version: { type: integer }

    StudioIncident:
      type: [object, "null"]
      required: [id, kind, cause, trigger, raisedAt]
      description: |
        **Cause et issue sont deux vocabulaires**, et les confondre était la faute d'origine :
        `catalogue.incidentMessages` ne porte que quatre entrées, **qui sont des issues**.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: L'**issue** visible du spectateur.
          x-arthome-vocabulary: [hold_screen, postponed, cancelled, interrupted]
        cause:
          type: string
          description: |
            La **cause**, vocabulaire distinct. `compatibility_worker_failed` existe parce qu'un
            *worker* de transcodage ne doit jamais mourir en silence — sinon la régie voit un
            lecteur qui ne démarre jamais, sans cause.
          x-arthome-vocabulary:
            [
              venue_feed_lost,
              run_desk_disconnected,
              bitrate_collapsed,
              compatibility_worker_failed,
              provider_error,
              manual,
            ]
        trigger:
          type: string
          description: |
            L'écran d'attente **automatique** produit un incident **de même nature** qu'un
            déclenchement manuel — c'est la bonne réponse au cas « le régisseur est injoignable ».
            Le journal doit néanmoins distinguer les deux.
          x-arthome-vocabulary: [manual, auto]
        message:
          allOf: [{ $ref: "#/components/schemas/LocalizedText" }]
          description: |
            Écrit par la régie : du **contenu**, avec sa langue de rédaction. Le catalogue fournit
            des **modèles** par nature d'incident, que la régie reprend ou remplace.
        raisedAt: { type: string, format: date-time }
        raisedBy: { $ref: "#/components/schemas/Actor" }

    StreamKeyReveal:
      type: object
      required: [streamKey, ingestUrl, revealedAt]
      description: |
        **Un secret affiché sur un téléphone, dans une salle, souvent devant un prestataire.**
        Quatre garanties : la clé n'est **jamais** dans une charge utile de liste ; sa révélation
        est une **commande distincte, auditée et nominative** ; son renouvellement est immédiat et
        l'ancienne **cesse aussitôt de diffuser** ; la réponse porte `Cache-Control: no-store`,
        pour qu'elle ne se retrouve ni dans le cache HTTP du téléphone ni dans l'instantané
        d'application pris par le système au passage en arrière-plan.

        L'affectation du créneau `director` — **qui donne accès à la clé** — est réservée à
        `artist ∨ production`, et le contrat rend cette raison explicite plutôt que de la laisser
        deviner.
      properties:
        streamKey: { type: string }
        ingestUrl: { type: string, format: uri }
        revealedAt: { type: string, format: date-time }

    # ---------------------------------------------------------- modération

    ModerationItem:
      type: object
      required: [id, messageId, dateId, state, reportsCount, atMediaSec, version]
      description: |
        **Trois axes, jamais empilés.** `state` est la nature de la **ligne de file** — c'est pour
        cela que la file se construisait en filtrant `state === 'reported'`, ce qui n'est pas un
        filtre d'état mais un filtre de nature. L'état du **message** et la sanction sur la
        **personne** sont deux autres axes, portés ailleurs.
      properties:
        id: { type: string, format: uuid }
        messageId: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        state: { type: string, x-arthome-vocabulary: [reported, claimed, settled] }
        reason:
          { type: string, x-arthome-vocabulary: [spam, insult, spoiler, off-topic, harassment] }
        reportsCount: { type: integer }
        atMediaSec: { type: integer }
        sentAt: { type: string, format: date-time }
        authorHandle: { type: string }
        authorSanction: { type: string, x-arthome-vocabulary: [none, muted, banned] }
        body: { $ref: "#/components/schemas/LocalizedText" }
        claimedBy: { $ref: "#/components/schemas/Actor" }
        claimExpiresAt:
          type: [string, "null"]
          format: date-time
          description: |
            **Un bail court**, renouvelé tant que la personne est présente, **libéré par le
            serveur** à l'expiration. Sans lui, un modérateur qui ferme son navigateur gèle une
            ligne pendant tout le direct.
        verdict: { type: [string, "null"], x-arthome-vocabulary: [publish, remove, mute, ban] }
        settledBy: { $ref: "#/components/schemas/Actor" }
        settledAt: { type: [string, "null"], format: date-time }
        origin:
          type: string
          description: |
            Le journal doit distinguer un **reclassement automatique** d'une **décision humaine**.
            `retroactive_filter` marque les éléments produits par l'ajout d'un mot au dictionnaire.
          x-arthome-vocabulary: [human_verdict, retroactive_filter, author_sanctioned]
        version:
          type: integer
          description: |
            **Porte le bail, et lui seul.** Une prise en charge puis un relâchement l'incrémentent
            deux fois **sans que rien n'ait été tranché**.
        decisionVersion:
          type: integer
          description: |
            **N'est incrémenté que par un verdict.** C'est sur cet axe-là que `settleModerationItem`
            conditionne, et la raison est une règle de la conception, pas une commodité :
            « prendre en charge n'est pas trancher — **tant que le confrère n'a pas rendu de
            verdict, votre sanction s'applique** ». Un verdict doit donc être **accepté** pendant
            qu'un autre tient le bail.

            Avec un compteur unique, c'était impossible : poser puis relâcher un bail faisait
            passer la version de 1 à 3, et un verdict mis en file hors ligne à `expectedVersion: 1`
            était refusé **alors que personne n'avait tranché** — sur un direct à soixante messages
            par minute, les lignes changent de bail sans arrêt, et la file hors ligne est la seule
            concession accordée au mobile. Un compteur ne peut pas exprimer « refuse si tranché,
            accepte si seulement réclamé ».

            C'est la doctrine des trois axes que le contrat applique déjà à la modération,
            appliquée au verrou lui-même.

    AudienceMember:
      type: object
      required: [id, handle, sanction, messagesCount, present]
      description: |
        **Le public d'une chaîne est une collection interrogeable par elle-même**, pas une
        projection du tchat : la console cherche « un spectateur présent, **qui n'a pas écrit** ».
      properties:
        id: { type: string, format: uuid }
        handle: { type: string, examples: ["@marie.j"] }
        sanction: { type: string, x-arthome-vocabulary: [none, muted, banned] }
        sanctionExpiresAt:
          type: [string, "null"]
          format: date-time
          description: |
            **Un instant, jamais une étiquette.** « Sans limite », 1 min, 10 min, 1 h et la durée
            libre sont un seul champ, calculé une fois. Absent = sans limite.
        messagesCount: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        subscriberTier: { type: [string, "null"], x-arthome-vocabulary: [free, pass, premium] }
        holdsSeat: { type: boolean }
        present:
          type: boolean
          description: Présence **sur le direct en cours**.

    ChatPolicy:
      type: object
      required: [dateId, mode, filterSeverity, slowModeSec, holdersOnly, locked]
      properties:
        dateId: { type: string, format: uuid }
        mode: { type: string, x-arthome-vocabulary: [open, emoji, read_only, off] }
        filterSeverity:
          type: string
          description: |
            **Un seul vocabulaire.** Deux coexistaient dans le même fichier de maquette —
            « souple/normale/haute » en réglages de chaîne, « basse/moyenne/haute » en page de
            modération — et aucun n'était dans les sources partagées.
          x-arthome-vocabulary: [low, medium, high]
        slowModeSec: { type: integer }
        holdersOnly: { type: boolean }
        retroactiveFilter: { type: boolean }
        locked:
          type: boolean
          description: |
            Vrai dès que la publication est engagée. **`chat` applique son propre verrou**, il ne
            demande rien à `catalog` : après engagement on peut toujours **fermer** un tchat en
            direct, jamais l'ouvrir davantage.
        version: { type: integer }

    # ---------------------------------------------------------- équipe

    ChannelMember:
      type: object
      required: [personId, displayName, roles, isOwner, joinedAt]
      properties:
        personId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: [string, "null"], format: email }
        roles:
          type: array
          description: "**Un ensemble.** Les huit valeurs canoniques, jamais le repli à six."
          items:
            {
              type: string,
              x-arthome-vocabulary:
                [artist, production, coordination, director, video, sound, moderation, treasury],
            }
        isOwner:
          type: boolean
          description: "**Jamais retirable ni modifiable en rôles.** `transferOwnership` déplace le drapeau."
        joinedAt: { type: string, format: date-time }
        note: { type: [string, "null"] }
        invitationState:
          { type: [string, "null"], x-arthome-vocabulary: [pending, accepted, declined, expired] }
        version: { type: integer }

    DateAccessGrant:
      type: object
      required: [grantId, dateId, personId, crewRole, expiresAt]
      description: |
        Le **renfort ponctuel** — portée une date, expiration **servie comme un instant**,
        révocable **sans toucher à l'appartenance à la chaîne**. Le confondre avec une
        appartenance ferait d'une révocation de renfort une exclusion de chaîne.
      properties:
        grantId: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        personId: { type: string, format: uuid }
        displayName: { type: string }
        crewRole: { type: string, x-arthome-vocabulary: [director, video, sound, moderation] }
        expiresAt: { type: string, format: date-time }
        grantedBy: { $ref: "#/components/schemas/Actor" }

    # ---------------------------------------------------------- argent

    PayoutLine:
      type: object
      required:
        [payoutId, dateId, state, grossTtc, vat, grossHt, commissionRateBps, commission, net, dueAt]
      description: |
        **La ventilation par marché est la forme, et elle est sûre dans les deux modèles
        fiscaux** : un modèle à taux unique produit une ventilation à une ligne. Un
        `vatAmount` scalaire unique aurait été le seul choix réellement irréversible.

        Le modèle retenu (D-015) est le **commissionnaire** : assiette = le billet entier, taux =
        celui du pays du spectateur, redevable = Arthome. **⚠ Ce n'est pas un avis fiscal** —
        à valider par un conseil avant tout encaissement réel.
      properties:
        payoutId: { type: string, format: uuid }
        dateId: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        state:
          type: string
          description: |
            **Piloté par l'issue de la date** : `held` tant qu'une issue est ouverte, `refunded` si
            annulée, `suspended` tant qu'un changement de coordonnées bancaires attend sa
            contre-signature.
          x-arthome-vocabulary: [scheduled, held, paid, refunded, suspended]
        grossTtc: { $ref: "#/components/schemas/Money" }
        vat:
          type: array
          description: |
            **Une ligne par juridiction, et non par marché de facturation.** `marketId` est
            retiré : un marché est une notion de **prix** — dans quelle devise on vend — jamais une
            notion de **taxe**. La clé portait trois valeurs là où la règle en demande des
            milliers : un spectateur français et un spectateur belge règlent tous deux dans le
            marché `eur`, à deux taux différents, et une ventilation dont la clé est le marché ne
            peut pas porter deux lignes `eur` sans que la clé cesse d'être une clé.

            **C'est la seule partie irréversible du chapitre fiscal.** Le modèle — qui est
            redevable, sur quelle assiette — est un **calcul** : il se refait. Le taux appliqué à
            la vente et la juridiction qui le commande sont des **faits datés** : non capturés à
            l'instant de la vente, ils ne sont pas coûteux à reconstituer, ils sont
            **impossibles** à reconstituer.
          items:
            type: object
            required: [rateBps, base, amount, jurisdictionCode, jurisdictionLevel, supplyKind]
            properties:
              rateBps:
                type: integer
                description: |
                  Taux en points de base — 550 = 5,5 %. **Un entier, jamais un flottant** : en
                  virgule flottante il finit par produire un centime d'écart. Et c'est le taux
                  **appliqué au moment de la vente, conservé sur la ligne** — pas le taux courant :
                  une facture se conserve dix ans, les taux changent.
              base: { $ref: "#/components/schemas/Money" }
              amount: { $ref: "#/components/schemas/Money" }
              jurisdictionCode:
                type: string
                description: "« FR » · « US-CA-94103 » · « CH-ZH ». **Assez précis pour rejouer le calcul.**"
                examples: [FR]
              jurisdictionLevel:
                { type: string, x-arthome-vocabulary: [country, state, county, city] }
              supplyKind:
                type: string
                description: |
                  **Le taux dépend du couple juridiction × nature de la prestation**, jamais d'une
                  constante par marché : l'exonération dont bénéficie une place de spectacle ne
                  s'étend pas à son accès en direct — une place et un direct diffusé ne sont pas
                  la même prestation.
                x-arthome-vocabulary: [live_stream_access, replay_access, subscription, merchandise]
        grossHt: { $ref: "#/components/schemas/Money" }
        commissionRateBps:
          type: integer
          description: |
            **Servi, jamais redérivé de `commission / gross`** — la maquette le redérive et
            retombe sur 12 % par défaut quand le brut est nul. **La commission porte sur le HT** :
            sur le TTC, les 12 % annoncés aux artistes varieraient avec le pays de l'acheteur.
          examples: [1200]
        commission: { $ref: "#/components/schemas/Money" }
        net: { $ref: "#/components/schemas/Money" }
        refunded: { $ref: "#/components/schemas/Money" }
        credited: { $ref: "#/components/schemas/Money" }
        dueAt:
          type: string
          format: date-time
          description: "**Fin du direct + 14 jours.** L'échéance court depuis la fin, pas depuis le paiement."
        stripeTransferRef: { type: [string, "null"] }
        reconciledAt: { type: [string, "null"], format: date-time }
        discrepancy:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "**Une période ne se clôt pas avec un écart non expliqué.**"
        taxEvidenceConflicts:
          type: integer
          description: |
            Le nombre de commandes de cette ligne dont les éléments de localisation de l'acheteur
            **se contredisaient**. La vente se fait, la ligne part en instruction : **masquer le
            conflit produirait une déclaration fausse et silencieuse**, et c'est le studio qui doit
            pouvoir la voir avant la clôture de période.

    BankChangeRequest:
      type: object
      required: [requestId, state, maskedAccountTail, requestedAt, expiresAt]
      description: |
        **Un agrégat à part entière, pas un champ** : deux acteurs, deux rôles distincts
        (propriétaire **et** trésorerie), un délai, une trace — **et il suspend le virement en
        cours** le temps de la signature. Une écriture ne peut pas porter cela.
      properties:
        requestId: { type: string, format: uuid }
        state:
          {
            type: string,
            x-arthome-vocabulary: [pending_countersignature, countersigned, rejected, expired],
          }
        maskedAccountTail:
          type: string
          description: "**Les quatre derniers caractères seulement.** Un IBAN complet n'a rien à faire dans un journal qui se rejoue."
          examples: ["4417"]
        requestedBy: { $ref: "#/components/schemas/Actor" }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        countersignedBy: { $ref: "#/components/schemas/Actor" }
        suspendsPayoutIds: { type: array, items: { type: string, format: uuid } }

    ExportJob:
      type: object
      required: [exportId, kind, state, requestedAt]
      description: |
        Sur 24 mois, un export est un **travail asynchrone** (BullMQ **interne à son service**).
        L'adresse rendue est **signée, de courte durée, et utilisable sans cookie de session** —
        un export protégé par cookie est intéléchargeable depuis la coquille native. Durée
        proposée : **60 minutes**.
      properties:
        exportId: { type: string, format: uuid }
        kind:
          type: string
          x-arthome-vocabulary:
            [sales_csv, fec, sage, cegid, grouped_invoices, journal, schedule_ics, stats_csv]
        state: { type: string, x-arthome-vocabulary: [queued, running, ready, failed, expired] }
        requestedAt: { type: string, format: date-time }
        downloadUrl: { type: [string, "null"], format: uri }
        downloadExpiresAt: { type: [string, "null"], format: date-time }

    UploadTicket:
      type: object
      required: [uploadUrl, fields, expiresAt, assetId]
      description: |
        **Téléversement par adresse de dépôt signée, obtenue par une commande JSON** — jamais de
        `multipart` depuis un WebView. Durée proposée : **15 minutes**, assez pour une 4G de salle,
        assez court pour ne pas être un jeton d'accès déguisé.
      properties:
        assetId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        fields: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string, format: date-time }

    JournalEntry:
      type: object
      required: [id, nature, occurredAt, actor, code, params]
      description: |
        **Nominatif et situé**, conservé 24 mois. Une **tentative** de marche arrière sur un tarif
        engagé y figure aussi : c'est en soi une information de conduite.
      properties:
        id: { type: string, format: uuid }
        nature: { type: string, x-arthome-vocabulary: [air, mod, event, access, money] }
        occurredAt: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Actor" }
        code: { type: string, description: Un **code**, jamais une phrase rédigée. }
        params: { type: object, additionalProperties: true }
        dateId: { type: [string, "null"], format: uuid }

    InboxEntry:
      type: object
      required: [id, kind, createdAt, read]
      description: |
        **Routée par rôle et par chaîne, côté serveur** : l'application ne filtre pas une file
        commune. Et **jamais de montant si le rôle destinataire n'a pas `canRevenue`**.
      properties:
        id: { type: string, format: uuid }
        kind:
          {
            type: string,
            x-arthome-vocabulary:
              [invitation, alert, duty, incident, payout, bank_change, reconciliation],
          }
        channelId: { type: [string, "null"], format: uuid }
        dateId: { type: [string, "null"], format: uuid }
        body:
          allOf: [{ $ref: "#/components/schemas/LocalizedText" }]
          description: Les textes de la boîte sont l'une des **deux seules exceptions** assumées à « i18n par codes ».
        deepLinkCode: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }

    MerchItemAdmin:
      type: object
      required: [id, label, variants, state, source]
      properties:
        id: { type: string, format: uuid }
        showId: { type: [string, "null"], format: uuid }
        label:
          allOf: [{ $ref: "#/components/schemas/LocalizedText" }]
          description: "**Bilingue.** L'absence de libellé anglais dans les sources est une **lacune de donnée** à combler au portage, pas une lacune de traduction (E10)."
        variants:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              stock: { type: integer }
              price: { $ref: "#/components/schemas/Money" }
        state: { type: string, x-arthome-vocabulary: [on_sale, out_of_stock] }
        source:
          type: string
          description: "**Une seule intégration externe à la fois** par chaîne."
          x-arthome-vocabulary: [arthome, shopify, woocommerce, prestashop, drupal, api]
        merchantUrl: { type: [string, "null"], format: uri }
        pinnedDateId: { type: [string, "null"], format: uuid }
        version: { type: integer }
