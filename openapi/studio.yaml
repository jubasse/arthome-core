        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dates/{dateId}/incidents:
    post:
      operationId: raiseIncident
      tags: [run]
      summary: Déclare un incident et diffuse l'écran d'attente.
      description: |
        **Un voile client, jamais une bascule de flux** : le plan de contrôle publie l'état, le
        lecteur l'affiche **par-dessus une vidéo intacte**. Instantané, identique sur les trois
        storefronts, et le média reste intact pour la reprise.

        **Cause et issue sont deux vocabulaires**, et les séparer était nécessaire : les quatre
        entrées des sources sont des **issues**, la régie mobile en distinguait trois **causes** de
        plus qui n'existaient nulle part.

        Le message voyage **avec sa langue de rédaction**. Le catalogue fournit des **modèles** par
        nature d'incident, que la régie reprend ou remplace.

        **Latence de diffusion : ≤ 2 s, non négociable** — le voile client en dépend.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [incidentId, kind, cause, message]
              properties:
                incidentId: { type: string, format: uuid }
                kind: { type: string, enum: [hold_screen, postponed, cancelled, interrupted] }
                cause:
                  type: string
                  enum: [venue_feed_lost, run_desk_disconnected, bitrate_collapsed, compatibility_worker_failed, provider_error, manual]
                message:
                  type: object
                  required: [contentLanguage, text]
                  properties:
                    contentLanguage: { type: string }
                    text: { type: string, maxLength: 400 }
            example:
              incidentId: 019928d1-0000-7000-8000-000000000001
              kind: hold_screen
              cause: venue_feed_lost
              message: { contentLanguage: fr, text: 'Interruption technique. Nous reprenons dans quelques instants.' }
      responses:
        '201':
          description: Incident levé, diffusé en moins de deux secondes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/StudioIncident' } }
              example:
                servedAt: '2026-09-21T19:52:00.000Z'
                rightsVersion: 412
                data:
                  id: 019928d1-0000-7000-8000-000000000001
                  kind: hold_screen
                  cause: venue_feed_lost
                  trigger: manual
                  message: { contentLanguage: fr, text: 'Interruption technique. Nous reprenons dans quelques instants.' }
                  raisedAt: '2026-09-21T19:52:00Z'
                  raisedBy: { personId: 019928b0-0000-7000-8000-000000000001, displayName: 'Claire D.', surface: studio-mobile }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /v1/incidents/{incidentId}/resolve:
    post:
      operationId: resolveIncident
      tags: [run]
      summary: Résout l'incident et retire le voile.
      description: |
        Le lecteur **retire le voile** sans redemander de jeton de lecture : sinon la reprise se
        paierait d'un rechargement de flux, sur un média qui n'a jamais été coupé.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Incident résolu.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          resolvedAt: { type: string, format: date-time }
              example:
                servedAt: '2026-09-21T19:56:00.000Z'
                rightsVersion: 412
                data: { resolvedAt: '2026-09-21T19:56:00Z' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/incidents/{incidentId}/escalate:
    post:
      operationId: escalateIncidentToProduction
      tags: [run]
      summary: Escalade vers la production — le geste des rôles qui ne décident pas.
      description: |
        **Ce que peut faire un rôle sans `canDecideOutcome`.** Il ne déclare pas d'issue ; il
        signale, et l'alerte est **routée par rôle et par chaîne côté serveur**. Sans ce geste, la
        seule issue d'un régisseur seul en salle serait d'appeler quelqu'un.
      x-arthome-maturity: provisional
      x-arthome-upstream: [notifications]
      parameters:
        - name: incidentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 400 }
            example: { note: 'Flux perdu depuis 4 minutes, la salle ne répond pas.' }
      responses:
        '202':
          description: Escalade routée.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          routedToRoles: { type: array, items: { type: string } }
              example:
                servedAt: '2026-09-21T19:57:00.000Z'
                rightsVersion: 412
                data: { routedToRoles: [artist, production] }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/dates/{dateId}/stream-key/reveal:
    post:
      operationId: revealStreamKey
      tags: [run]
      summary: Révèle la clé de flux — commande distincte, auditée, nominative.
      description: |
        **C'est un secret affiché sur un téléphone, dans une salle, souvent devant un
        prestataire.** Quatre garanties, et elles sont dans le contrat parce qu'aucune n'est
        vérifiable côté client :

        - la clé **n'est jamais** dans une charge utile de liste ;
        - sa révélation est **cette commande**, distincte, auditée et nominative ;
        - la réponse porte **`Cache-Control: no-store`** — elle ne doit se retrouver ni dans le
          cache HTTP du téléphone, ni dans l'instantané d'application pris par le système au
          passage en arrière-plan ;
        - l'**affectation du créneau `director`**, qui donne accès à la clé, est réservée à
          `artist ∨ production`.

        **Réauthentification exigée** : c'est une opération sensible, et elle est demandée **au
        moment de l'opération**, jamais au retour d'écran.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauthToken]
              properties:
                reauthToken: { type: string, description: Jeton de réauthentification à usage unique, de courte durée. }
            example: { reauthToken: ott_9f2ac1 }
      responses:
        '200':
          description: La clé, une fois, sans cache.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
              description: Non négociable. C'est ce qui tient le secret hors du cache et hors de l'instantané d'application.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/StreamKeyReveal' } }
              example:
                servedAt: '2026-09-21T18:40:00.000Z'
                rightsVersion: 412
                data:
                  streamKey: sk_live_9f2ac1b4
                  ingestUrl: 'rtmps://ingest.arthome.fr/live'
                  revealedAt: '2026-09-21T18:40:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/dates/{dateId}/stream-key/rotate:
    post:
      operationId: rotateStreamKey
      tags: [run]
      summary: Renouvelle la clé de flux — l'ancienne cesse aussitôt de diffuser.
      description: |
        **Immédiat**, et le contrat le dit : l'ancienne clé cesse aussitôt de diffuser. Renouveler
        **pendant un direct** coupe l'ingestion en cours — le refus porte un code distinct
        (`STREAM_KEY_ROTATION_DURING_RUN`) plutôt que d'exécuter en silence une commande dont la
        conséquence est une antenne noire.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: '#/components/parameters/DateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reauthToken]
              properties:
                reauthToken: { type: string }
                confirmDuringRun: { type: boolean, default: false }
            example: { reauthToken: ott_9f2ac1, confirmDuringRun: false }
      responses:
        '200':
          description: Nouvelle clé émise.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeMeta'
                  - type: object
                    required: [data]
                    properties: { data: { $ref: '#/components/schemas/StreamKeyReveal' } }
              example:
                servedAt: '2026-09-21T18:41:00.000Z'
                rightsVersion: 412
                data: { streamKey: sk_live_4d77e2, ingestUrl: 'rtmps://ingest.arthome.fr/live', revealedAt: '2026-09-21T18:41:00Z' }
        '409':
          description: '`STREAM_KEY_ROTATION_DURING_RUN` — confirmer explicitement, ou attendre la fin.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: STREAM_KEY_ROTATION_DURING_RUN, nature: refused, params: { runState: on_air }, traceId: 4bf92f3577b34da6a3ce929d0e0e4736 }
