  # =============================================================== channel

  /v1/channels/{channelId}/stream:
    get:
      operationId: getChannelStreamSettings
      tags: [run]
      summary: A channel's Broadcast page — ingest server, recommended profile, test history.
      description: |
        **One of only five entries a control room has**, and it had no operation at all. Taking
        `stream` and `replays` away from a `director` left them an event board.

        It also carries the **broadcast defaults** applied to new dates, which the Settings screen
        announces and which had no carrier.

        **The stream key does not appear in it**: it appears in no list payload.
      x-arthome-maturity: provisional
      x-arthome-upstream: [streaming]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Ingest, recommended profile, measured bitrate, check history.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        properties:
                          ingestUrl: { type: string, format: uri }
                          recommendedProtocol:
                            { type: string, x-arthome-vocabulary: [rtmps, srt, whip] }
                          recommendedBitrateKbps: { type: integer }
                          lastMeasuredUpKbps: { type: [integer, "null"] }
                          defaults:
                            type: object
                            description: Applied to **new** dates, never retroactively.
                            properties:
                              ingestProtocol:
                                { type: string, x-arthome-vocabulary: [rtmps, srt, whip] }
                              qualityLadder: { type: array, items: { type: string } }
                              holdScreenAutoAfterSec: { type: integer }
                          recentChecks:
                            type: array
                            items:
                              type: object
                              properties:
                                dateId: { type: string, format: uuid }
                                passed: { type: boolean }
                                passedAt: { type: [string, "null"], format: date-time }
                          preflightPending:
                            type: integer
                            description: The `preflightBadge`, **served** — it had no source at all.
              example:
                servedAt: "2026-09-21T18:12:00.000Z"
                rightsVersion: 412
                data:
                  ingestUrl: "rtmps://ingest.arthome.fr/live"
                  recommendedProtocol: rtmps
                  recommendedBitrateKbps: 6000
                  lastMeasuredUpKbps: 8900
                  defaults:
                    {
                      ingestProtocol: rtmps,
                      qualityLadder: ["1080p", "720p", "360p"],
                      holdScreenAutoAfterSec: 15,
                    }
                  recentChecks: []
                  preflightPending: 1
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/channels/{channelId}/replays:
