  # =============================================================== moderation

  /v1/channels/{channelId}/moderation/queue:
    get:
      operationId: listModerationQueue
      tags: [moderation]
      summary: The moderation queue — **by cursor**, the first exception to page + total.
      description: |
        **A moderation queue grows while it is being read.** Offset pagination duplicates rows there
        and skips others — **mechanically, not exceptionally**. It is a stream, even hosted in the
        studio, hence a cursor (D-010).

        The **separate total** (`pendingCount`) feeds the badge: it is not counted over the current
        page, otherwise the bottom bar would display the number of rows loaded.

        **Other people's claims are visible**: `claimedBy` and `claimExpiresAt` arrive on the same
        channel, with the name of whoever is acting. Without that, two moderators work blind to each
        other and collide on every row.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: dateId
          in: query
          schema: { type: string, format: uuid }
        - name: filter
          in: query
          schema: { type: string, enum: [all, pending, settled], x-arthome-vocabulary-source: none, x-arthome-vocabulary-reason: "A sort or filter key. It is a property of THIS endpoint's list — which orders it offers — not of the domain, and adding one is an endpoint change rather than a vocabulary change.", default: pending }
        - name: q
          in: query
          description: '**Server-side** search on the nickname and the text.'
          schema: { type: string }
      responses:
        "200":
          description: A page of the queue, plus the total for the badge.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [items, page]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/ModerationItem" } }
                      page: { $ref: "#/components/schemas/CursorPageInfo" }
              example:
                servedAt: "2026-09-21T19:30:00.000Z"
                rightsVersion: 412
                lastEventSeq: 8812
                items:
                  - id: 019928e0-0000-7000-8000-000000000001
                    messageId: 019928f8-0000-7000-8000-000000000009
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                    state: reported
                    reason: harassment
                    reportsCount: 3
                    atMediaSec: 1812
                    sentAt: "2026-09-21T19:29:42Z"
                    authorHandle: "@anon.7742"
                    authorSanction: none
                    body: { contentLanguage: fr, text: "…" }
                    origin: human_verdict
                    version: 1
                page:
                  { hasMore: true, nextCursor: eyJjIjoiMjAyNi0wOS0yMVQxOTozMCJ9, pendingCount: 14 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410": { $ref: "#/components/responses/Gone" }

  /v1/moderation/items/{itemId}/claim:
    post:
      operationId: claimModerationItem
      tags: [moderation]
      summary: Claims a row — a lease, not a write.
      description: |
        **"Taking charge is not deciding."** It is a **short lease**, renewed while the person is
        present and **released by the server** on expiry: a moderator whose phone dies does not freeze
        a row for the whole live show.

        **Never queued offline**: replayed on reconnection, it would claim a row someone else has
        already handled.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Lease taken, with the instant it expires.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/ModerationItem" } }
              example:
                servedAt: "2026-09-21T19:30:10.000Z"
                rightsVersion: 412
                data:
                  id: 019928e0-0000-7000-8000-000000000001
                  messageId: 019928f8-0000-7000-8000-000000000009
                  dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                  state: claimed
                  reportsCount: 3
                  atMediaSec: 1812
                  claimedBy:
                    {
                      personId: 019928b0-0000-7000-8000-000000000001,
                      displayName: "Claire D.",
                      surface: studio-mobile,
                    }
                  claimExpiresAt: "2026-09-21T19:32:10Z"
                  version: 2
                  decisionVersion: 0
        "409":
          description: "`MODERATION_ALREADY_CLAIMED`, with the name of whoever holds the lease."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: moderation.already_claimed,
                    nature: refused,
                    params: { claimedBy: "Yann P.", claimExpiresAt: "2026-09-21T19:32:00Z" },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T19:30:10.000Z"
    delete:
      operationId: releaseModerationItem
      tags: [moderation]
      summary: Releases the claim.
      description: Speeds up the release; **nothing depends on it**, the lease expires by itself.
      x-arthome-maturity: provisional
