  # =============================================================== modération

  /v1/channels/{channelId}/moderation/queue:
    get:
      operationId: listModerationQueue
      tags: [moderation]
      summary: La file de modération — **au curseur**, première exception à page + total.
      description: |
        **Une file de modération grandit pendant qu'on la lit.** Une pagination par décalage y
        double des lignes et en saute d'autres — **mécaniquement, pas exceptionnellement**. C'est
        un flux, même hébergé dans le studio, donc curseur (D-010).

        Le **total séparé** (`pendingCount`) alimente la pastille : il ne se compte pas sur la page
        courante, sinon la barre du bas afficherait le nombre de lignes chargées.

        La **prise en charge des autres est visible** : `claimedBy` et `claimExpiresAt` arrivent
        sur le même canal, avec le nom de qui agit. Sans cela, deux modérateurs travaillent en
        aveugle l'un de l'autre et se marchent dessus à chaque ligne.
      x-arthome-maturity: provisional
      x-arthome-upstream: [chat]
      parameters:
        - $ref: '#/components/parameters/ChannelId'
        - $ref: '#/components/parameters/Surface'
        - $ref: '#/components/parameters/Traceparent'
