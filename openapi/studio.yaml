                reauthToken: { type: string }
                confirmName: { type: string }
            example: { reauthToken: ott_9f2ac1, confirmName: Compagnie Verticale }
      responses:
        "200":
          description: Channel deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data: { type: object, properties: { deleted: { type: boolean } } }
              example:
                servedAt: "2026-09-21T18:22:00.000Z"
                rightsVersion: 413
                data: { deleted: true }
        "409":
          description: "`CHANNEL_HAS_OPEN_OBLIGATIONS`, with the detail."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: CHANNEL_HAS_OPEN_OBLIGATIONS,
                    nature: refused,
                    params: { datesOnSale: 3, payoutsDue: 1 },
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T18:22:00.000Z"

  # =============================================================== argent

  /v1/channels/{channelId}/payouts:
    get:
      operationId: listPayouts
      tags: [payouts]
      summary: The payouts owed, one line per date sold.
      description: |
        **One balance per currency, never a converted balance.** A channel selling in two currencies
        has **two balances**: converting would introduce a rate, hence an exchange date, hence a
        reconciliation gap nobody could explain. Stripe keeps one balance per currency; we mirror it,
        we do not aggregate it.

        **Reserved to roles with `canRevenue`** — the whole page, not only its columns.
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortDir"
        - name: state
          in: query
          schema: { type: string, enum: [scheduled, held, paid, refunded, suspended] }
      responses:
        "200":
          description: A page of payout lines, and the balances **per currency**.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [items, page, balances]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/PayoutLine" } }
                      balances:
                        type: array
                        description: "**One balance per currency.** Never aggregated."
                        items: { $ref: "#/components/schemas/Money" }
                      pendingBankChange: { $ref: "#/components/schemas/BankChangeRequest" }
                      page: { $ref: "#/components/schemas/OffsetPageInfo" }
              example:
                servedAt: "2026-09-21T18:25:00.000Z"
                rightsVersion: 412
                items:
                  - payoutId: 019928e5-0000-7000-8000-000000000001
                    dateId: 019928a0-7d31-7a10-b8c4-2f9e11a4c001
                    channelId: 019928a0-7d31-7a10-b8c4-2f9e11a4c222
                    state: scheduled
                    grossTtc: { amountMinor: 417600, currencyCode: EUR }
                    vat:
                      - {
                          rateBps: 550,
                          base: { amountMinor: 395830, currencyCode: EUR },
                          amount: { amountMinor: 21770, currencyCode: EUR },
                          jurisdictionCode: FR,
                          jurisdictionLevel: country,
                          supplyKind: live_stream_access,
                        }
                    grossHt: { amountMinor: 395830, currencyCode: EUR }
                    commissionRateBps: 1200
                    commission: { amountMinor: 47500, currencyCode: EUR }
                    net: { amountMinor: 348330, currencyCode: EUR }
                    dueAt: "2026-10-05T21:30:00Z"
                balances: [{ amountMinor: 348330, currencyCode: EUR }]
                page: { page: 1, pageSize: 20, totalItems: 42, totalPages: 3 }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/channels/{channelId}/bank-change-requests:
    post:
      operationId: requestBankChange
      tags: [payouts]
      summary: Requests a change of bank details — dual signature.
      description: |
        **An aggregate in its own right, not a write.** Two actors, two distinct roles (owner **and**
        treasury), a delay, a trace — **and it suspends the payout in flight** for the duration of the
        signing. A write cannot carry that.

        Only the **last four characters** of the account travel: a full IBAN has no business in an
        event log that gets replayed.

        **The return from an external browser confirms nothing**: the pending state lives
        **server-side**, and on the way back, "the deep link says where to go, the backend says what
        changed".
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stripeSetupRef, reauthToken]
              properties:
                stripeSetupRef:
                  {
                    type: string,
                    description: '**Opaque** reference to the hosted flow. No provider identifier crosses the domain.,'
                  }
                reauthToken: { type: string }
            example: { stripeSetupRef: seti_1Ab2Cd, reauthToken: ott_9f2ac1 }
      responses:
        "202":
          description: Request created, transfers suspended until counter-signature.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/BankChangeRequest" } }
              example:
                servedAt: "2026-09-21T18:26:00.000Z"
                rightsVersion: 412
                data:
                  requestId: 019928e6-0000-7000-8000-000000000001
                  state: pending_countersignature
                  maskedAccountTail: "4417"
                  requestedBy:
                    {
                      personId: 019928b0-0000-7000-8000-000000000001,
                      displayName: "Claire D.",
                      surface: studio-web,
                    }
                  requestedAt: "2026-09-21T18:26:00Z"
                  expiresAt: "2026-09-28T18:26:00Z"
                  suspendsPayoutIds: [019928e5-0000-7000-8000-000000000001]
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/bank-change-requests/{requestId}/countersign:
    post:
      operationId: countersignBankChange
      tags: [payouts]
      summary: Counter-signs a change of bank details.
      description: |
        **Two distinct roles**: the owner **and** the treasury. One and the same person cannot sign
        both times, even holding both roles — `SAME_ACTOR_FORBIDDEN`. That is the entire point of a
        dual signature.
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reauthToken]
              properties:
                decision: { type: string, enum: [countersign, reject] }
                reauthToken: { type: string }
            example: { decision: countersign, reauthToken: ott_4d77e2 }
      responses:
        "200":
          description: Counter-signed, transfers resumed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    required: [data]
                    properties: { data: { $ref: "#/components/schemas/BankChangeRequest" } }
              example:
                servedAt: "2026-09-21T18:30:00.000Z"
                rightsVersion: 412
                data:
                  requestId: 019928e6-0000-7000-8000-000000000001
                  state: countersigned
                  maskedAccountTail: "4417"
                  requestedAt: "2026-09-21T18:26:00Z"
                  expiresAt: "2026-09-28T18:26:00Z"
                  countersignedBy:
                    {
                      personId: 019928b4-0000-7000-8000-000000000001,
                      displayName: "Léa M.",
                      surface: studio-web,
                    }
        "403":
          description: "`SAME_ACTOR_FORBIDDEN` — a dual signature requires two people."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  {
                    code: SAME_ACTOR_FORBIDDEN,
                    nature: refused,
                    params: {},
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736,
                  }
                servedAt: "2026-09-21T18:30:00.000Z"
        "410": { $ref: "#/components/responses/Gone" }

  /v1/channels/{channelId}/reconciliation-periods/{periodId}/close:
    post:
      operationId: closeReconciliationPeriod
      tags: [payouts]
      summary: Closes a reconciliation period.
      description: |
        **A period does not close with an unexplained discrepancy.** The refusal carries the gap and
        the lines concerned. We never rebuild the provider's ledger: we **reconcile** ours against it,
        and any discrepancy routes an alert to `treasury`.
      x-arthome-maturity: provisional
      x-arthome-upstream: [payouts]
      parameters:
        - $ref: "#/components/parameters/ChannelId"
        - name: periodId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Surface"
        - $ref: "#/components/parameters/IfRightsVersion"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                explanations:
                  type: array
                  items:
                    type: object
                    properties:
                      payoutId: { type: string, format: uuid }
                      note: { type: string }
            example: { explanations: [] }
      responses:
        "200":
          description: Period closed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeMeta"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          periodId: { type: string }
                          closedAt: { type: string, format: date-time }
              example:
                servedAt: "2026-10-01T09:00:00.000Z"
                rightsVersion: 412
                data: { periodId: "2026-09", closedAt: "2026-10-01T09:00:00Z" }
        "409":
          description: "`RECONCILIATION_DISCREPANCY_UNEXPLAINED`, with the gap and the lines."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
              example:
                error:
                  code: RECONCILIATION_DISCREPANCY_UNEXPLAINED
                  nature: refused
                  params:
                    {
                      discrepancyMinor: -1240,
                      currencyCode: EUR,
                      payoutIds: [019928e5-0000-7000-8000-000000000001],
                    }
                  traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                servedAt: "2026-10-01T09:00:00.000Z"

  /v1/seats/{seatId}/refund:
