name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run build

      - run: pnpm run verify

      - run: node tools/pack-release.mjs "$GITHUB_REF_NAME" release-assets

      - name: Attach the tarballs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.tgz --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
